								var item = {
									// name: '降水量 (mm)',
									name: chartName[j],
									type: 'bar',
									barWidth: '20%',
									yAxisIndex: 1,
									data: chartValue
								};
								serie.push(item);
							} else if (chartName[j].lastIndexOf("水量")>-1) {
								var item = {
									// name: '流量 (m³/s)',
									name: chartName[j],
									type: 'bar',
									"connectNulls": true, //这个是重点，将断点连接
									yAxisIndex: 2,
									data: chartValue
								};
								serie.push(item);
							} else {
								if (max_min_Name != "" & max_min_Name == chartName[j]) {
									var item = {
										name: chartName[j],
										type: 'line',
										"connectNulls": true, //这个是重点，将断点连接
										data: chartValue,
										markPoint: {
											data: [{
												type: 'max',
												name: '最大值'
											}, {
												type: 'min',
												name: '最小值'
											}],
											label: {
												normal: {
													formatter: function(datas) {
														return Number(datas.value).toFixed(2);
														//或者是下面这种，效果是一样的
														//return datas.value.toFixed(2);
													}
												}
											}
										},
										smooth: false
									}
									serie.push(item);
								} else {
									var item = {
										name: chartName[j],
										type: 'line',
										"connectNulls": true, //这个是重点，将断点连接
										data: chartValue,
										smooth: false,
                                        markLine: {
                                        lineStyle: {
                                            type: 'solid',
                                            color:'#FA0000',
                                        }, 
                                        data: [{ xAxis: formatDate(AddHourDate(new Date().format("yyyy-MM-dd HH:00:00"),1)).format("yyyy-MM-dd HH:00") }]
                                }

									}
									serie.push(item);
								}
							}

						};
						return serie;
					}()
				};
				if (data.length == 0) {
						$("." + $.data(myData, "DIVID")).hide();
					var strWhere = "";
					strWhere =
						"<div class='DIVHIDE'>\ <span class='NoneBg' style='letter-spacing:-2px;position: absolute;font-size: 30px;color:#afa2a2'>暂无数据</span>\ </div>";
					$.data(myData, "DIVID", "DIVHIDE");
					$('#' + ChartName).append(strWhere);
				} else {
					if ($.data(myData, "DIVID") != null) {
						$("." + $.data(myData, "DIVID")).hide();
					}
				}

				myChart.setOption(option);
			}
    </script>

</body>
