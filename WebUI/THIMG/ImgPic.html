    <style type="text/css">
        html,body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            /*overflow: hidden;*/
            font-size: 14px;
        }
    </style>

</head>
<body>
    <div style="width:100%;height:1454px;margin:0 auto;background-size:100% 100%;background-repeat:no-repeat;" align="center" id="btnIMG">
        <!--<img id="btnIMG" src="" height="100%" width="100%"/>-->
    </div>
    <script type="text/javascript">
        var tempUrl = GetQueryString("URL");
        var tempWidth = GetQueryString("width")
        $(function () {
            if (tempUrl != null) {
                //$("#btnIMG").attr("src", tempUrl);
                $("#btnIMG").css("background-image", "url(" + tempUrl+")");
                if (tempWidth != null) {
                    //$("#btnIMG").attr("width", tempWidth);
                    //$("#btnIMG").attr("height", "auto");
                    
                }
            }
        })

        function GetQueryString(str) {
            var LocString = String(window.document.location.href);
            var rs = new RegExp("(^|)" + str + "=([^&]*)(&|$)", "gi").exec(LocString), tmp;
            if (tmp = rs)
                return decodeURI(tmp[2]);
            return null;
        }
    </script>
</body>
</html>
