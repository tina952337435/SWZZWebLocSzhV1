    <script>
        mini.parse();
        var countyLayer1;
        var myData = [];
        var _globallevel = 7;
        var faCom = mini.get("faCom");
        var grid=mini.get('grid1');
        $(function () {
            setTimeout(() => {
                setZOOM(9);
                dyCenter(121.407411, 31.303422);
                countyLayer1 = CreateLayer("swzzAreaMode_Layer1");
                MapRainfallArea(0);

                search();
            }, 500);
        });
        function search() {
            var strWhere = { DD_DISTRIBY: 100 };
            GetJosns("MODE_DD_SOLUTIONSel", strWhere, "Sel");
        }
        function onSTCDChanged(e) {
            BreakLayerLoad();
        }
        function zhanDianData() {
            var TYPE = "2,24,25,14,15,19";
            var s_where = { TYPE: TYPE, KEY: "嘉宝北片" };
            GetJosns("MODE_ES_JISUANZHANSel", s_where, "MODE_ES_JISUANZHANSel");
        }
        function BreakLayerLoad() {
            var selected = faCom.getSelected();
            var DD_ID = selected.DD_ID;
            //水量分布:24入流,25出流，2产流,19平均水位，15蓄量，14水面积
            var DATA_TYPE = "2,24,25,14,15,19";
            var s_where = { PLAN_N: DD_ID, DATA_TYPE: DATA_TYPE };
            GetJosns("MODE_BDMS_PREDICTSel", s_where, "MODE_BDMS_PREDICTSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                faCom.setData(data.data);
                faCom.select(0);

                zhanDianData();
            }
            else if (typeID == 'MODE_ES_JISUANZHANSel') {
                $.data(myData, "zhanDian", data.data);
                BreakLayerLoad();
            }
            else if (typeID == "MODE_BDMS_PREDICTSel") {
                $.data(myData, "zhanDianData", data.data);
                var dataTemp = data.data.filter(function (res) {
                    return res.STCD == "81460";
                });
                var qcxl = Number(dataTemp[0].DATA);
                var qmxl = Number(dataTemp[dataTemp.length - 1].DATA);
                dataTemp = data.data.filter(function (res) {
                    return res.STCD == "81459";
                });
                var qcsw = Number(dataTemp[0].DATA);
                var qmsw = Number(dataTemp[dataTemp.length - 1].DATA);
                var xlc = qmxl - qcxl;
                $("#spanQCXL").html(qcxl.toFixed(2));
                $("#spanQMXL").html(qmxl.toFixed(2));
                $("#spanQCSW").html(qcsw.toFixed(2));
                $("#spanQMSW").html(qmsw.toFixed(2));
                $("#spanXLC").html(xlc.toFixed(2));

                dataTemp = data.data.filter(function (res) {
                    return res.STCD == "81449";//出流
                });
                var totalCSL = SumJson(dataTemp, 'DATA');
                totalCSL = totalCSL * 0.36;//流量转水量，万方
                $("#spanCSL").html(totalCSL.toFixed(2));

                dataTemp = data.data.filter(function (res) {
                    return res.STCD == "81450";//入流
                });
                var totalRSL = SumJson(dataTemp, 'DATA');
                totalRSL = totalRSL * 0.36;//流量转水量，万方
                $("#spanRSL").html(totalRSL.toFixed(2));

                dataTemp = data.data.filter(function (res) {
                    return res.STCD == "81346";//嘉宝北片降雨产流
                });
                // console.error(dataTemp);
                var totalJYCL = SumJson(dataTemp, 'DATA');
                totalJYCL = Math.abs(totalJYCL) * 0.36;//流量转水量，万方
                $("#spanJYCL").html(totalJYCL.toFixed(2));

                var totalRCSLC = Number(totalRSL) + Number(totalJYCL) - Number(totalCSL);
                $("#spanRCSLC").html(totalRCSLC.toFixed(2));

                JsonLineChart();
                bindData();

                var LineColor = ["#3E8BFF", "#1CB8B2", "#01DDFF", "#F9C823", "#0264FD", "#FE7923", "#8E30FF"];
                pieArr = [
                    { value: totalRSL.toFixed(2), name: '入水量' },
                    { value: totalCSL.toFixed(2), name: '出水量' },
                    { value: totalJYCL.toFixed(2), name: '降雨产量' },
                ];
                echartSLPie('slTableRU', pieArr, LineColor);
            }
        }
        var jbbpNameArr = ["嘉宝北片沿长江", "嘉宝北片沿蕴南片", "嘉宝北片沿浏河", "嘉宝北片沿苏州河"];
        function bindData() {
            require([
                "esri/geometry/Point",
                "esri/graphic",
                "myJs/MapText",
                "myJs/MultiLineTextSymbol",
                "dojo/domReady!"
            ], function (Point, Graphic, MapText, MultiLineTextSymbol) {
                var zhanDian = $.data(myData, "zhanDian");
                var zhanDianData = $.data(myData, "zhanDianData");
                var data=[];
                var jsl=Number($("#spanRSL").html())-Number($("#spanCSL").html());
                data.push({stnm:"累计",rsl: $("#spanRSL").html(),csl: $("#spanCSL").html(),jsl:jsl.toFixed(2)});
                for (var num = 0; num < jbbpNameArr.length; num++) {
                    var totalCSL = 0;
                    var totalRSL = 0;
                    var name = jbbpNameArr[num];
                    var zhanDianTemp = zhanDian.filter(function (res) {
                        return res.NAME.indexOf(name) > -1 && res.TYPE == "24";
                    });
                    stcd = zhanDianTemp[0].STCD;
                    var zhanDianDataTemp = zhanDianData.filter(function (res) {
                        return res.STCD == stcd;
                    });
                    totalRSL = SumJson(zhanDianDataTemp, 'DATA');
                    totalRSL = totalRSL * 0.36;//流量转水量，万方

                    zhanDianTemp = zhanDian.filter(function (res) {
                        return res.NAME.indexOf(name) > -1 && res.TYPE == "25";

        function getAreaColor(zValue, type) {
            var color = "#ffffff";
            var colorTM = [255, 255, 255, 0];
            var colors = ["#970202", "#ed1808", "#ed9708", "#0000F9", "#3DBCF9", "#007B00", "#A6F28E"];
            var opt = 0.65;
            var colorsTM = [
                [151, 2, 2, opt],
                [237, 24, 8, opt],
                [237, 151, 8, opt],
                [0, 0, 249, opt],
                [61, 188, 249, opt],
                [0, 123, 0, opt],
                [166, 242, 142, opt]
            ];
            if (zValue > 0 && zValue <= 10) {
                color = colors[0];
                colorTM = colorsTM[0];
            }
            else if (zValue > 10 && zValue <= 30) {
                color = colors[1];
                colorTM = colorsTM[1];
            }
            else if (zValue > 30 && zValue <= 50) {
                color = colors[2];
                colorTM = colorsTM[2];
            }
            else if (zValue > 50 && zValue <= 80) {
                color = colors[3];
                colorTM = colorsTM[3];
            }
            else if (zValue > 80 && zValue <= 100) {
                color = colors[4];
                colorTM = colorsTM[4];
            }
            else if (zValue > 100 && zValue <= 200) {
                color = colors[5];
                colorTM = colorsTM[5];
            }
            else if (zValue > 200) {
                color = colors[6];
                colorTM = colorsTM[6];
            }
            if (type == "fill") {
                return colorTM;
            } else {
                return color;
            }
        }

                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }
                        if (max_min_Name != "" & max_min_Name == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: true,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                smooth: true,
                                symbol: 'none',
                            }
                            serie.push(item);
                        }
                        else if (chartName[j] == "蓄量") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                barMaxWidth: '30%',
                                data: chartValue,
                                connectNulls: true,
                                yAxisIndex: 0,
                                smooth: true,
                                symbol: 'none',
                                itemStyle: {
                                    normal: {
                                        color: {
                                            type: 'linear',
                                            x: 0,
                                            y: 0,
                                            x2: 0,
                                            y2: 1,
                                            colorStops: [{
                                                offset: 0,
                                                color: '#2D8DED'
                                            }, {
                                                offset: 1,
                                                color: '#5ED8FB'
                                            }]
                                        },
                                        barBorderRadius: [30, 30, 0, 0],
                                    }
                                },
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: true,
                                smooth: true,
                                symbol: 'none',
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
            if (m.length == 0) {
                if ($.data(myData, "ChartID") != null) {
                    $("#" + $.data(myData, "ChartID")).show();
                } else {
                    var $li = "";
                    $.data(myData, "ChartID", new Date().format("yyyyMMddHH"));

                    $li = "<div id='" + $.data(myData, "ChartID") + "'>\ <span  class='b threefont' style='letter-spacing:-2px;position: absolute;top: 40%;font-size: 30px;color:#ddd'>暂无数据</span>\ </div>";
                    $('#' + ChartName).append($li);
                }

            } else {
                $("#" + $.data(myData, "ChartID")).hide();
            }
        }
        //水量饼图
        var tSLInterval;
        function echartSLPie(ChartName, data, LineColor) {
            //if (tSLInterval) {
            //    clearInterval(tSLInterval);
            //}
            var myChart = echarts.init(document.getElementById(ChartName));
            myChart.clear();
            option = {
                // color: ['#37a2da', '#32c5e9', '#9fe6b8', '#ffdb5c', '#ff9f7f', '#fb7293', '#e7bcf3', '#8378ea'],
                tooltip: {
                    trigger: 'item',
                    // formatter: ' {a} <br />{b} : {c} ({d}%) '
                    formatter: '{b} : {c} ' + '万方',
                    position: ['40%', '50%']
                },
                color: LineColor,
                legend: {
                    x: 'right',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    left: '78%',
                    show: true,
                    padding: [30, 0, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                    textStyle: { //图例文字的样式
                        color: '#ccc',
                        fontSize: 12
                    },
                    data: ['超保', '超警', '正常'],
                    formatter: function (name) {
                        var index = 0;
                        var clientlabels = ['超保', '超警', '正常'];
                        var clientcounts = data;
                        clientlabels.forEach(function (value, i) {
                            if (value == name) {
                                index = i;
                            }
                        });
                        return name + "(" + clientcounts[index].value + ")";
                    }
                },
                series: [
                    {
                        color: LineColor,
                        name: '个数',
                        type: 'pie',
                        center: ['50%', '50%'],
                        radius: ['60%', '80%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            normal: {
                                borderColor: '#ccc',
                                borderWidth: 0,
                            }
                        },
                        labelLine: {
                            normal: {
                                show: false,
                            }
                        },
                        label: {
                            position: 'center',
                            show: false,
                            emphasis: {
                                show: true,
                                formatter: "{S|{c}}{A|万方}\n{B|{b}}",
                                // formatter:function(e){
                                //     console.error(e);
                                //      var s='<div style="font-weight:bold;line-height:40px;font-size:18px;color:'+e.color+';">'+e.value+'</div>';
                                //       s='<div style="font-weight:bold;line-height:40px;font-size:18px;color:'+e.color+';">'+e.value+'</div>';
                                //      return s;

                                // },
                                textStyle: {
                                    fontWeight: 'bold',
                                    rich: {
                                        B: {
                                            fontSize: 14,
                                        },
                                        S: {
                                            fontWeight: 'bolder',
                                            lineHeight: 40,
                                            fontSize: 18,
                                        },
                                        L: {
                                            fontSize: 16,
                                        }
                                    }
                                }
                            },
                        },
                        data: data
                    }
                ]
            }
            myChart.resize();
            myChart.setOption(option);
            window.addEventListener("resize", function () {
                myChart.resize();
            });
            // myChart.on("click", eSLChage);
            myChart.dispatchAction({
                type: "highlight",
                seriesIndex: 0,
                dataIndex: 0
            });
            var curIndex = 0;
            if (SetNull(tSLInterval) != "") {
                clearInterval(tSLInterval);
            }
            tSLInterval = setInterval(selectPie, 2000);// 设置自动切换高亮图形的定时器
            function highlightPie() { // 取消所有高亮并高亮当前图形
                // 遍历饼图数据，取消所有图形的高亮效果, 高亮当前图形
                for (var idx = 0; idx < data.length; idx++)
                    myChart.dispatchAction({
                        type: idx != curIndex ? 'downplay' : 'highlight',
                        seriesIndex: 0,
                        dataIndex: idx
                    });
            }
            myChart.on('mouseover', (params) => { // 用户鼠标悬浮到某一图形时，停止自动切换并高亮鼠标悬浮的图形
                clearInterval(tSLInterval);
                curIndex = params.dataIndex;
                highlightPie();
            });
            myChart.on('mouseout', (params) => { // 用户鼠标移出时，重新开始自动切换
                if (tSLInterval)
                    clearInterval(tSLInterval);
                tSLInterval = setInterval(selectPie, 2000);
            });
            function selectPie() { // 高亮效果切换到下一个图形
                var dataLen = data.length;
                curIndex = (curIndex + 1) % dataLen;
                highlightPie();
            }
        }
    </script>
