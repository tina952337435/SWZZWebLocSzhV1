    function search() {
      setGridColumns();
      var xdata = [], ydatayl = [], ydataylz = [], ydatawsk = [],ydatagq=[];
      var dataResult = [];
      var node = tree.getSelectedNode();
      var dataResultJYTemp = dataResultJY.filter(function (res) {
        return res.TYPE == node.NAME;
      });
      for (var num = 0; num < dataResultJYTemp.length; num++) {
        var item = dataResultJYTemp[num];
        xdata.push(dataResultJYTemp[num]['时间']);
        ydatayl.push(dataResultJYTemp[num]['嘉宝北片降雨']);
        if (node.NAME.indexOf('菲特') > -1) {
          var dataResultYLTemp = dataResultYL.filter(function (res) {
            return res['时间'] == dataResultJYTemp[num]['时间'];
          });
          if (dataResultYLTemp.length > 0) {
            ydataylz.push(dataResultYLTemp[0]['杨林']);
            item['杨林'] = dataResultYLTemp[0]['杨林'];
          }
          var dataResultWSKTemp = dataResultWSK.filter(function (res) {
            return res['时间'] == dataResultJYTemp[num]['时间'];
          });
          if (dataResultWSKTemp.length > 0) {
            ydatawsk.push(dataResultWSKTemp[0]['吴淞口']);
            item['吴淞口'] = dataResultWSKTemp[0]['吴淞口'];
          }
        }
        else{
          var datadataResultGQTemp = datadataResultGQ.filter(function (res) {
            return res['时间'] == dataResultJYTemp[num]['时间'];
          });
          if (datadataResultGQTemp.length > 0) {
            ydatagq.push(datadataResultGQTemp[0]['高桥']);
            item['高桥'] = datadataResultGQTemp[0]['高桥'];
          }
        }
        dataResult.push(item);
      }
      //console.error( JSON.stringify( dataResultJY));
      chartSW('chartPie', xdata, ydatayl, ydataylz, ydatawsk,ydatagq);
      grid.setData(dataResult);
    }
    function setGridColumns() {
        var node = tree.getSelectedNode();
        var createGrid = [];
        createGrid = [
        {
          field: "时间", headerAlign: "center", align: "center", header: "时间",
        },
        {
          field: "嘉宝北片降雨", headerAlign: "center", align: "center", header: "嘉宝北片降雨(mm)", decimalPlaces: "1", dataType: "float"
        }
      ];
        var columns=[];
        if (node.NAME.indexOf('菲特') > -1) {
          columns.push({ field: "杨林", headerAlign: "center", align: "center", header: "杨林", decimalPlaces: "2", dataType: "float" });
          columns.push({ field: "吴淞口", headerAlign: "center", align: "center", header: "吴淞口" , decimalPlaces: "2", dataType: "float"});
        }else{
          columns.push({ field: "高桥", headerAlign: "center", align: "center", header: "高桥" , decimalPlaces: "2", dataType: "float"});
        }
        var item={
          field: "设计潮位(m)", headerAlign: "center", align: "center", header: "设计潮位(m)",
          columns:columns
        };
        createGrid.push(item);
        grid.set({
          columns: createGrid
        });
      }
    function onSelectNode(e) {
      search();
    }
