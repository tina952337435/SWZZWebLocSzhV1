        function modelGetResultPresetByTimePeriod() {
            var idArr = "81459".split(',');//嘉宝北片平均计算水位81459
            var curDate = new Date().format('yyyy-MM-dd HH:mm:ss');
            var stime = AddHourDate(curDate, -1).replaceAll('/', '-');
            var etime = AddHourDate(curDate, 1).replaceAll('/', '-');
            var id = idArr[0];
            var isHaveData = false;
            var msg = "";
            var strWhere = {
                "version": 1,
                "api": "GetResultPresetByTimePeriod",
                "id": id,//主图形编号
                "startTM": stime,
                "endTM": etime,
                "taskID": "00000000000000000000000000000000"
            }
            app.postAsync("", strWhere, function (res) {
                var info = res.info;
                if (!info.success) {
                    isHaveData = false;
                    msg = (info.msg);
                } else {
                    isHaveData=true;
                    $.data(myData, "swdata", res.data);
                }
            });
            var upz = 2.67;
            if (isHaveData) {
                var dataSW = $.data(myData, "swdata");
                var times = dataSW.times;
                var valsSW = dataSW.vals;
				if(valsSW.length>0){
				upz =Number(valsSW[valsSW.length - 1]).toFixed(2);
				}
            }
            mini.get("UpzText").setValue(upz);

            getRainFall();
        }
        function getRainFall() {
            var wrzCha = wrz - Number(mini.get('UpzText').getValue());
            var grzCha = grz - Number(mini.get('UpzText').getValue());
            var strWhere = {
                WRZCHA: wrzCha.toFixed(2),
                GRZCHA: grzCha.toFixed(2),
                TYPE: $.data(myData, "choseType"),
                JYTYPE: $.data(myData, "rainType"),
                SCWTYPE: $.data(myData, "tideType"),
                DDFATYPE:$.data(myData, "ddfaType"),
                CTYPE: "净增水位降雨量",
                AREA: "嘉宝北片"
            };
            GetJosns("STORAGE_ST_ABILITYTOABSORBRAINFALL_BCalculator", strWhere, "SelRain");
        }
