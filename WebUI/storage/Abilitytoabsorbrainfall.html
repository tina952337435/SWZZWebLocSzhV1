    <script>
        mini.parse();
        var faCom = mini.get("faCom");
        var myData = [];
        $(function () {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            GetJosns("MODE_DD_SOLUTIONSel", {}, "Sel");
        });
        function onLoadAllData() {
            var dd_tm = $.data(myData, "stime");
            var DD_ID = faCom.getValue();
            var strParam = {
                "PLAN_N": DD_ID,
                "STIME": dd_tm,
                "ETIME": dd_tm,
                "STCD": "81459,81460,81461", //平均水位，蓄量，水面积
                "DATA_TYPE": "14,15,19"
            };
            GetJosns("MODE_BDMS_PREDICTSelMORE", strParam, "MODE_BDMS_PREDICTSelMORE");
        }

        function onvaluechanged(e) {
            var selected = faCom.getSelected();
            var dd_tm = convertToDate(selected.DD_TM).format('yyyy-MM-dd HH:mm:ss');
            $.data(myData, "stime", dd_tm);
            modelGetRainReceivingCapacity();
        }

        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                faCom.setData(data.data);
                faCom.select(0);
                var selected = faCom.getSelected();
                var dd_tm = convertToDate(selected.DD_TM).format('yyyy-MM-dd HH:mm:ss');
                $.data(myData, "stime", dd_tm);
                modelGetRainReceivingCapacity();
            }
            else if (typeID == 'GetRainReceivingCapacity') {
                var info = data.info;
                if (info.code == -1) {
                    alert(info.msg);
                    mini.unmask(document.body);
                } else {
                    var capcity = data['1744830552'].capcity;
                    $.data(myData, "capcityData", capcity);
                    onLoadAllData();
                }
            }
            else if (typeID == "MODE_BDMS_PREDICTSelMORE") {
                $.data(myData, "bdmsData", data.data);
                setLabelValue();
                mini.unmask(document.body);
            }
        }
        function setLabelValue() {
            var item = {};
            item.tm=$.data(myData, "stime");
            var capcityData = $.data(myData, "capcityData");
            var bdmsData = $.data(myData, "bdmsData");
            bdmsData.filter(function (res) {
                if (res.DATA_TYPE == '19') {
                    item.upz = res.DATA;
                }
                if (res.DATA_TYPE == '15') {
                    item.cxl = res.DATA;
                }
                if (res.DATA_TYPE == '14') {
                    item.area = res.DATA;
                }
            });
            capcityData.filter(function(res){
                if(res.name=='警戒水位'){
                    item.wrz = res.level;
                    item.wrzcapcity=res.capcity;
                }
                if(res.name=='保证水位'){
                    item.grz = res.level;
                    item.grzcapcity=res.capcity;//纳雨能力
                }
            });

            console.error(item);
            var strHtml = '<p><span class="valueTitle">时间：</span><span>' + new Date(item.tm).format("yyyy-MM-dd HH:mm") + '</span></p>';
            var ss = item.upz != undefined ? Number(item.upz).toFixed(2) : "-";
            strHtml += '<p><span class="valueTitle">平均水位：</span><span class="valueVal">' + ss + '</span><span>m</span></p>';
            strHtml += '<p><span class="valueTitle">水面积：</span><span class="valueVal">' + Number(item.area).toFixed(2) + '</span><span>百万m³</span></p>';
            strHtml += '<p><span class="valueTitle">蓄量：</span><span class="valueVal">' + Number(item.cxl).toFixed(2) + '</span><span>k㎡</span></p>';
            strHtml += '<p><span class="valueTitle">纳雨能力(警戒)：</span><span class="valueVal">' + Number(item.wrzcapcity).toFixed(2) + '</span><span>mm</span></p>';
            strHtml += '<p><span class="valueTitle">纳雨能力(保证)：</span><span class="valueVal">' + Number(item.grzcapcity).toFixed(2) + '</span><span>mm</span></p>';
            $(".dataBox").html(strHtml);


            var xdsw = item.xdsw != undefined ? Number(item.xdsw).toFixed(2) : "-";
            $(".relative-value").html("相对水位：" + xdsw + "米");
            var ssStr = "水深：" + ss + "米";
            $("#liquid").html(ssStr);
            var grz = item.grz != undefined ? Number(item.grz).toFixed(2) : "-";
            $("#risk-price").html("危险线：" + grz + "m");
            var wrz = item.wrz != undefined ? Number(item.wrz).toFixed(2) : "-";
            $("#warning-price").html("警戒线：" + wrz + "m");
            var gdz = item.gdz != undefined ? Number(item.gdz).toFixed(2) : "-";
            $("#elevation").html("地面标高：+" + gdz + "米");

            var mbdz = item.mbdz != undefined ? Number(item.mbdz).toFixed(2) : "-";
            $("#water-depth").html("最大埋深：" + mbdz + "米");

            var iez = item.iez != undefined ? Number(item.iez).toFixed(2) : "-";
            $("#low_mark").html("井底标高：" + iez + "米");

            gwywselectListHtml(item);
        }

        function gwywselectListHtml(gwMap) {
            // 内低标高：
            var innerElevation1 = gwMap.grz;
            // 最大埋深：
            var maxDepth1 = gwMap.grz;
            // 水深：
            var waterDepth1 = gwMap.upz;
            // 警戒值：
            var cordonLine = gwMap.wrz;
            // 危险值：
            var dangerLine = gwMap.grz;
            
            if (!innerElevation1) {
                innerElevation1 = 0;
            }
            if (!maxDepth1) {
                maxDepth1 = 0;
            }
            if (!waterDepth1) {
                waterDepth1 = 0;
            }
            if (!cordonLine) {
                cordonLine = 0;
            }
            if (!dangerLine) {
                dangerLine = 0;
            }
            /*地面标高标高计算*/
            var elevationVlue = ((innerElevation1 * 1000 + maxDepth1 * 1000) / 1000).toFixed(3);
            elevationVlue = elevationVlue > 0 ? '+' + elevationVlue : '-' + elevationVlue
            $('#elevation').text('地面标高：' + elevationVlue + '米');

            if (window.innerWidth) windowWidth = window.innerWidth;
            else if (document.body && document.body.innerWidth) windowWidth = document.body.innerWidth;
            // $('.picScroll-left').css('left', (1000 - 790) / 2);
            var num = $('.speciaclBox li').length;
            $('.speciaclBox li')
                .eq(0)
                .css('margin-left', (730 - 242 * num) / 2);
            var num = $('.picList li').length;
            if (num != 0) {
                $('img.picture').css('margin-top', '170px');
                $('.basicMessage').css('top', '50%');
            } else {
                $('img.picture').css('margin-top', '100px');
                $('.basicMessage').css('top', '30%');
            }
            /*水深*/
            var WaterDepth = '';
            if (!waterDepth1) {
                WaterDepth = 0 + waterDepth1;
            } else {
                WaterDepth = waterDepth1;
            }
            //console.log(WaterDepth)
            //console.log(maxDepth1)
            /*控制背景水位的高低的图片-------  */
            // var levelWater = parseInt((WaterDepth / maxDepth1) * 700);
            var bottomLevelWater = parseInt((WaterDepth / maxDepth1) * 380)
            let liquidBottom;
            if (bottomLevelWater >= 0 && bottomLevelWater <= 124) {
                var s = "/Common/images/gy-pipe2-1.png"
                $('.bg-map').css("background", "url(" + s + ")");
                $('.water-back').css({ 'height': bottomLevelWater + 'px', 'bottom': '39px' })
                liquidBottom = (bottomLevelWater + 39) + 'px';
            }
            if (bottomLevelWater >= 0 && bottomLevelWater <= 23) {
                var waterSrc = "/common/images/bg-water.png"
                $('.water-back').css({
                    'bottom': '39px',
                });
                $('.water-back img').attr("src", waterSrc)
                $(".blue-back").hide()
            } else if (bottomLevelWater > 20 && bottomLevelWater <= 124) {
                $(".blue-back").show()
                var waterSrc = "/Common/images/bg-water-1.png"
                $('.water-back').css({
                    'bottom': '59px',
                    "left": "40px",
                    "width": "638px",
                });
                $('.water-back img').attr("src", waterSrc)
                var levelWater = parseInt((WaterDepth / maxDepth1) * 380) - 22;
                var bgWaterLevel = levelWater + 'px';
                // $('.bg-water').css('background-size', bgWaterLevel);
                $('.water-back').css('height', bgWaterLevel)
            } else {
                var levelWater = parseInt((WaterDepth / maxDepth1) * 380) - 125;
                var bgWaterLevel = levelWater + 'px';
                // $('.bg-water').css('background-size', bgWaterLevel);
                $('.water-back').css('height', bgWaterLevel)
                liquidBottom = (levelWater + 162) + 'px';
            }
            $('#liquid').css('bottom', liquidBottom);
            // 施芳平修改，添加相对水位高度
            var relativeWater = parseInt(((maxDepth1 - WaterDepth) / maxDepth1) * 380);
            $('.relative-place').css('height', (relativeWater - 10) + 'px')
            var topline = relativeWater / 2 - 15;
            $('.top-line').css('height', topline + 'px')
            $('.bottom-line').css('height', topline + 'px')
            $('.relative-value').text('相对水位：' + '-' + (maxDepth1 - WaterDepth).toFixed(2) + '米')
            $('.relative-value').css('top', (relativeWater / 2 - 15) + 'px')
            /*液位*/
            $('#liquid').text('水深：' + WaterDepth.toFixed(2) + '米');

            /*水深 最大埋深*/
            $('#water-depth').text('最大埋深：' + maxDepth1 + ' m');
            if (dangerLine == 0 || innerElevation1 == 0) {
                $('.number-line').hide();
                $('.number-two').hide();
            }
            /*危险值*/
            $('#risk-price').text('危险线：' + (dangerLine ).toFixed(2) + 'm');
            /*警戒值*/
            $('#warning-price').text('警戒线：' + (cordonLine).toFixed(2) + 'm');
            //var lowMarkValue=innerElevation1>0?'+'+innerElevation1.toFixed(3):'-'+innerElevation1.toFixed(3)
            var lowMarkValue = innerElevation1.toFixed(3)
            $('#low_mark').text('井底标高：' + lowMarkValue + 'm');
            /*控制警戒值变化-------  */
            /*危险线*/
            //debugger
            var riskWater = parseInt(((dangerLine - innerElevation1) / maxDepth1) * 380);
            var riskLevel = riskWater2 + 'px';//380 - riskWater + 'px';
            $('#risk-water').css('top', riskLevel);
            /*警戒线*/
            var riskWater2 = parseInt(((cordonLine - innerElevation1) / maxDepth1) * 380);
            var riskLev2 =Math.abs(riskWater2)  + 'px';//380 - riskWater2 + 'px';
            $('#warningPrice').css('top', riskLev2);
