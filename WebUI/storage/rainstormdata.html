        allowalternating="true" borderstyle="border-right:0;"
            showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell"
            showsummaryrow="true" ondrawsummarycell="onDrawSummaryCell">
            <div property="columns">
                    <div field="TM" width="60" align="center" headeralign="center" allowsort="false">时序</div>
                    <div field="DRP" width="60" align="center" headeralign="center" allowsort="false" decimalPlaces="1" dataType="float">雨量(mm)</div>
                <!-- <div field="时段" width="60" align="center" headeralign="center" allowsort="false">时段</div>

                        <div field="P50" width="120" align="center" headeralign="center" allowsort="false"

    <script>
        mini.parse();
        var myData=[];
        var tree = mini.get('tree1');
        var grid = mini.get('grid1');
        // var dataResult = [
        //     { "时段": "H1日", "均值": "96.77", "CV": "0.43", "CV/CS": "3.3", "P1": "233.39", "P2": "209.67", "P5": "177.54", "P10": "152.37", "P20": "125.99", "P50": "87.27" },
        //     { "时段": "H3日", "均值": "133.18", "CV": "0.44", "CV/CS": "3.98", "P1": "336.64", "P2": "299.12", "P5": "249.03", "P10": "210.58", "P20": "171.36", "P50": "117.08" }
        // ];
        // grid.setData(dataResult);
        $(function () {
            tree.selectNode(1);
        });
        function onSelectNode(e) {
            var node = e.node;
            var parentNode = tree.getParentNode(node);
            var parentText = parentNode.id;
            $.data(myData, "parentText",parentText);
            $.data(myData, "treeHour", node.id);
            search();
        }
        function search() {
            var ZHANID="1744830552";//嘉宝北片
            var s_where = { 
                "TYPE": $.data(myData, "parentText"), 
                "HOUR": $.data(myData, "treeHour"),
                ZHANID:ZHANID
            };
            GetJosns("MODE_ES_RAINFALLSel", s_where, "MODE_ES_RAINFALLSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "MODE_ES_RAINFALLSel") {
                var strNote = [];
                var item = { "name": "时间", "codename": "TM", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                item = { "name": "降雨量", "codename": "DRP", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                //绘制过程线颜色设置
                var LineColor = ['#3398DB', '#FF0000', '#00FF00', '#FFA500'];
                chartYL("Chart", data.data, strNote, LineColor, "雨量(mm)");
                
                $.data(myData, "raindata", data.data);
                grid.setData(data.data);
            }
        }
        //鼠标移动上去的提示信息。
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            var index=grid.indexOf(row);//获取单行的序号
            //超链接任务
            if (field == "TM") {
                e.cellHtml=(index+1);
            }
        }
        function onDrawSummaryCell(e) {
                var value = e.value;
                var data = $.data(myData, "raindata");
                if (data != undefined) {
                    if (data.length > 0) {
                        if (e.field == "DRP") {
                            var drp=Number( SumJson(data,'DRP')).toFixed(1);
                            var str = "";
                            str = "<span  style=\"color:Blue;font-weight:bold;\">累计雨量: " + drp + "mm</span><br>";
                            e.cellHtml = str;
                        }
                    }
                }
            }
        function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    // console.error(index1);
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        var tm = (index+1);//new Date(convertToDate(value[value1.codename])).format("yyyy-MM-dd HH");
                        chartTM.push(tm);
                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show:false,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                toolbox: {
                    show: true,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: { show: false, type: ['line', 'bar'] },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom:40,
                    top: 40,
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        scale: true,
                        axisTick: {
                            alignWithLabel: false
                        },
                        axisLabel: {
                            interval: 0,
                            // rotate: 40
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        //interval: 0,
                        //  splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        min: 0,
                        max: function (value) {
                            return Number((value.max - (value.max % 5)) / 5 + 1).toFixed(0) * 5;
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                //dataZoom: [
                //    {
                //        show: true,
                //        realtime: true,
                //        start: 0,
                //        end: 20
                //    },
                //    {
                //        type: 'inside',
                //        realtime: true,
                //        start: 0,
                //        end: 20
                //    }
                //],
                animation: false,
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        if (chartName[j] == "名称") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: '60%',
                                //itemStyle: {
                                //    borderWidth:3,
                                //},
                                //label: {
                                //    normal: {
                                //        show: true,
                                //        position: 'top'
                                //    }
                                //},
                                smooth: true
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
</body>
