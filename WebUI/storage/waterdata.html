<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>经验公式预报</title>
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="/Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <script src="/Common/boot.js?ver=1.0.2" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
            background: white;
        }
    </style>
</head>

<body class="contentbody">
    <div id="grid1" class="mini-datagrid" style="width: 100%;height:360px;" allowalternating="true" borderstyle="border-right:0;"
        showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
        <div property="columns">
            <div field="频率" width="60" align="center" headeralign="center" allowsort="false">频率(%)</div>
            <div field="重现期" width="60" align="center" headeralign="center" allowsort="false">重现期</div>
            <div field="" align="center" headeralign="center">
                设计潮位(m)
                <div property="columns" align="center">

                    <div field="墅沟闸" width="120" align="center" headeralign="center" allowsort="false" decimalPlaces="2"
                        dataType="float">墅沟闸</div>
                    <div field="吴淞口" width="120" align="center" headeralign="center" allowsort="false" decimalPlaces="2"
                        dataType="float">吴淞口</div>
                    <div field="金山嘴" width="120" align="center" headeralign="center" allowsort="false" decimalPlaces="2"
                        dataType="float">金山嘴</div>
                </div>
            </div>


        </div>
    </div>
    <div style="padding:20px;">
           <p style="font-size:16px;font-weight:bold;">1、大潮汛</p> 
           <p>2021年受第6号台风“烟花”和天文大潮影响，上海出现“风暴潮洪”四碰头，吴淞站最高高潮位5.55m，约20年一遇，居历史第四位。</p> 
           <p style="font-size:16px;font-weight:bold;">2、中潮汛</p> 
           <p>2022年9月15日凌晨0时30分前后第12号台风“梅花”在上海奉贤沿海再次登陆，吴淞站最高高潮位5.53米，约20年一遇，历史第五。</p> 
           <p style="font-size:16px;font-weight:bold;">3、小潮汛</p> 
           <p>2019年受第9号台风“利奇马”影响，8月9～10日河口吴淞站最高高潮位3.90米，低于警戒潮位0.90米。</p> 
    </div>
    <script>
        mini.parse();
        var grid = mini.get('grid1');
        var dataResult = [
            { "频率": "0.333", "墅沟闸": "6.71", "吴淞口": "6.28", "金山嘴": "6.88","重现期":"300年" },
            { "频率": "1", "墅沟闸": "6.38", "吴淞口": "6", "金山嘴": "6.58" ,"重现期":"100年" },
            { "频率": "5", "墅沟闸": "5.87", "吴淞口": "5.57", "金山嘴": "6.12" ,"重现期":"20年" },
            { "频率": "10", "墅沟闸": "5.65", "吴淞口": "5.38", "金山嘴": "5.92" ,"重现期":"10年"},
            { "频率": "30", "吴淞口": "5.07", "金山嘴": "5.56" ,"重现期":"3年"},
            { "频率": "40", "吴淞口": "4.98", "金山嘴": "5.46" ,"重现期":"2年"}
        ];
        grid.setData(dataResult);
    </script>
</body>

</html>
