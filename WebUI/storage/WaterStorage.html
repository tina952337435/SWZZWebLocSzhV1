    <script type="text/javascript">
        mini.parse();
        var stcd = '1230483,1130283';//嘉定南门,罗店
        var grid = mini.get("grid1");
        var rbl = mini.get("rbl");
        var myData = [];
        rbl.on("valuechanged", function (e) {
            btnSearch();
        });
        function doExport() {
            var data = grid.data;
            var columns = grid.columns;
            ExportExcel("嘉宝北片水位蓄量", columns, data);
        }

        $(function () {
            var tm = new Date();// new Date("2023-10-19");
            etime ="2023-12-05 08:00:00"; //tm.format("yyyy-MM-dd") + " " + (tm.getHours() + 1) + ":00:00";
            stime = AddHourDate(etime, -24) + " " + (tm.getHours() + 1) + ":00:00";
            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            btnSearch();
        });
        function PageFillData() {
            //查询方法
            var strWhere = {};
            GetJosns("STORAGE_ST_WATERSTORAGE_BSel", strWhere, "BSel");
        }
        function btnSearch() {
            $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
            BreakLayerLoad();
        }

        function BreakLayerLoad() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(endDate);
            var strWhere = {
                STIME: d1.format("yyyy/MM/dd HH:mm:ss"),
                ETIME: d2.format("yyyy/MM/dd HH:mm:ss"),
                STCD: stcd,
                "DAYHOUR": rbl.getValue()
            };
            //GetJosns("WATER_ST_WAS_RDZNEW",strWhere , "Sel");
            var id = "81459";//嘉宝北片计算蓄量 81460，嘉宝北片平均计算水位81459
            setTimeout(function () {
                modelGetResultPresetByTimePeriod();
            }, 100);

        }
        function modelGetResultPresetByTimePeriod() {
            var idArr = "81459,81460".split(',');//嘉宝北片计算蓄量 81460，嘉宝北片平均计算水位81459
            var stime = mini.get("STIME").getFormValue();
            var etime = mini.get("ETIME").getFormValue();
            var isHaveData = true;
            var msg = "";
            for (var num = 0; num < idArr.length; num++) {
                var id = idArr[num];
                var strWhere = {
                    "version": 1,
                    "api": "GetResultPresetByTimePeriod",
                    "id": id,//主图形编号
                    "startTM": stime,
                    "endTM": etime,
                    "taskID": "18C3CDBB2E02F3C486"
                }
                app.postAsync("", strWhere, function (res) {
                    var info = res.info;
                    if (!info.success) {
                        isHaveData = false;
                        msg = (info.msg);
                    } else {
                        $.data(myData, "data" + id, res.data);
                    }
                });
            }
            if (!isHaveData) {
                ShowMsg(msg);
                mini.unmask(document.body);
                noData();
            } else {
                var dataSW = $.data(myData, "data81459");
                var dataXL = $.data(myData, "data81460");
                var times = dataSW.times;
                var valsSW = dataSW.vals;
                var valsXL = dataXL.vals;
                var dataNew = [], maxArr = [], wrzDataS = [], grzDataS = [];
                var stime = mini.get("STIME").getFormValue();
                var etime = mini.get("ETIME").getFormValue();
                var hours = GetDateDiff(stime, etime, 'hour');
                var tmArr = [];
                for (var num = 0; num < times.length; num++) {
                    //if (new Date(times[num]).getMinutes() == 0) {
                    var ss = (valsXL[num] / 1000000).toFixed(2);
                    var tm = new Date(times[num]).format('yyyy-MM-dd HH:mm:ss');
                    var item = {
                        "TM": tm,
                        "UPZ": valsSW[num].toFixed(2),
                        "WRZ": 3.15,
                        "GRZ": 3.87,
                        "S": ss,
                        "WRZS": 154.47,
                        "GRZS": 192.62,
                        "WRZSYL": 154.47 + "(" + (154.47 - Number(ss)).toFixed(2) + ")",
                        "GRZSYL": 192.62 + "(" + (192.62 - Number(ss)).toFixed(2) + ")",
                    };
                    // console.error('tm',tm);
                    maxArr.push(192.62);
                    wrzDataS.push(154.47);
                    grzDataS.push(192.62);
                    if (tmArr.indexOf(tm) == -1) {//临时筛选
                        tmArr.push(tm);
                        dataNew.push(item);
                    }
                    //}
                }
                // console.error('dataNew',dataNew);
                if (rbl.getValue() == "HOUR") {
                    dataNew = dataNew.filter(function (res) {
                        return new Date(res.TM).getMinutes() == 0;
                    });
                }
                else if (rbl.getValue() == "DAY") {
                    dataNew = dataNew.filter(function (res) {
                        return new Date(res.TM).getHours() == 8 && new Date(res.TM).getMinutes() == 0;
                    });
                }
                var data = {};
                data.data = dataNew;
                data.total = dataNew.length;
                dataResult = data;
                var ColoumnsName = { "indexcolumn": "序号", "TM": "时间" };
                ColoumnsName["UPZ"] = "水位(m)@";
                ColoumnsName["S"] = "蓄量(百万方)@";
                ColoumnsName["WRZ"] = "警戒水位(m)";
                ColoumnsName["WRZSYL"] = "警戒蓄量(余量)<br/>(百万方)@";
                ColoumnsName["GRZ"] = "保证水位(m)";
                ColoumnsName["GRZSYL"] = "保证蓄量(余量)<br/>(百万方)@";
                SetSummaryColumns(ColoumnsName, grid);

                grid.setData(dataResult.data);
                JsonLineChart(dataResult, maxArr, wrzDataS, grzDataS);
                console.error(dataSW, dataXL);
                mini.unmask(document.body);
            }

        }
        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var arr = groupBy(data.data, 'TM');
                    var dataNew = [];
                    for (var num = 0; num < arr.length; num++) {
                        var arrTemp = arr[num];
                        var upzTotal = SumJson(arrTemp, 'UPZ');
                        var upzAvg = (upzTotal / arrTemp.length).toFixed(2);//求平均
                        var item = {
                            "TM": arrTemp[0].TM,
                            "UPZ": upzAvg,
                            "WRZ": arrTemp[0].WRZ,
                            "GRZ": arrTemp[0].GRZ,
                        };
                        //根据平均水位求得蓄量
                        var S = getStorageValue(upzAvg);
                        item.S = S;
                        dataNew.push(item);
                    }
                    data.data = dataNew;
                    data.total = dataNew.length;
                    dataResult = data;
                    var ColoumnsName = { "indexcolumn": "序号", "TM": "时间" };
                    ColoumnsName["UPZ"] = "水位(m)@";
                    ColoumnsName["S"] = "蓄量(百万方)@";
                    ColoumnsName["WRZ"] = "警戒水位(m)@";
                    ColoumnsName["GRZ"] = "保证水位(m)@";
                    ColoumnsName["WRZ"] = "蓄量(警戒水位)(百万方)@";
                    ColoumnsName["WRZ"] = "蓄量(保证水位)(百万方)@";
                    SetSummaryColumns(ColoumnsName, grid);

                    grid.setData(dataResult.data);
                    JsonLineChart(dataResult);
                }
                else {
                    noData();
                }
            }
            else if (typeID == "BSel") {
                $.data(myData, "bdata", data.data);
            }
        }
        function getStorageValue(upz) {
            upz = parseFloat(upz);
            var data = $.data(myData, "bdata");
            var dataTempMax = data.filter(function (res) {
                return res.UPZ >= upz;
            });
            var dataTempMin = data.filter(function (res) {
                return res.UPZ <= upz;
            });
            var minUpz = dataTempMin[dataTempMin.length - 1].UPZ;
            var maxUpz = dataTempMax[0].UPZ;
            var cha = Number(parseFloat(maxUpz - minUpz).toFixed(2));//差值
            var scha = Number(parseFloat(upz - minUpz).toFixed(2));//差值;
            var minS = dataTempMin[dataTempMin.length - 1].S;
            var maxS = dataTempMax[0].S;
            var chaS = Number(parseFloat(maxS - minS).toFixed(2));//差值
            var sscha = Number((chaS / 10 * scha).toFixed(2));
            var S = (minS + sscha).toFixed(2);
            return S;
        }
        function noData() {

        }
        function JsonLineChart(strJson, maxArr, wrzDataS, grzDataS) {
            var strData = "";
            var _XData = strJson.data;
            //绘制数据说明
            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            var LineColor = ['#FFA500', '#ff0909'];
            // strNote += ',{"name": "水位","codename": "UPZ","tableV":"1","isShow":true,"width":"20%"}';
            strNote += ',{"name": "蓄量","codename": "S","tableV":"1","isShow":true,"width":"20%"}';
            strNote += ',{"name": "警戒蓄量","codename": "WRZS","tableV":"1","isShow":false,"width":"20%"}';
            strNote += ',{"name": "保证蓄量","codename": "GRZS","tableV":"1","isShow":false,"width":"20%"}';
            strNote += ']';
            //绘制过程线颜色设置
            //var jsonData = sortObjectArray(_XData, ['TM'], 'asc');
            var jsonData = _XData;
            $.data(myData, "jsonData", jsonData);
            $.data(myData, "strNote", eval('(' + strNote + ')'));
            $.data(myData, "LineColor", LineColor);
            //绘制图形
            chartSW("Chart", jsonData, eval('(' + strNote + ')'), LineColor, "水位", maxArr, wrzDataS, grzDataS);
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });

        //统计水位
        function onDrawSummaryCell(e) {
            var value = e.value;
            var data = grid.getData();
            if (data.length > 0) {
                if (e.field == "UPZ") {
                    var str = "";
                    str = "<span  style=\"color:Blue;font-weight:bold;\">当前水位: " + data[data.length - 1].UPZ + "mm</span><br>";
                    //str += value != null ? "<span  style=\"color:Blue;font-weight:bold;\">最高水位: " + Number(value).toFixed(2) + "mm</span>" : "<span  style=\"color:red;font-weight:bold;\">水位最高: 无</span>";
                    e.cellHtml = str;
                }
                if (e.field == "S") {
                    var str = "";
                    str = "<span  style=\"color:Blue;font-weight:bold;\">当前蓄量: " + data[data.length - 1].S + "百万方</span><br>";
                    var ylValue = Number(192.62 - data[data.length - 1].S).toFixed(2);
                    var ylWrzValue = Number(154.47 - data[data.length - 1].S).toFixed(2);
                    str += "<span  style=\"color:Blue;font-weight:bold;\">剩余蓄量(警戒): " + ylWrzValue + "百万方</span><br>";
                    str += "<span  style=\"color:Blue;font-weight:bold;\">剩余蓄量(保证): " + ylValue + "百万方</span><br>";
                    //str += value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最高蓄量: " + Number(value).toFixed(2) + "百万方</span>" : e.cellHtml = "<span  style=\"color:red;font-weight:bold;\">蓄量最高: 无</span>";
                    e.cellHtml = str;
                }
                if (e.field == "WRZS" || e.field == "GRZS") {
                    e.cellHtml = '';
                }
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (Number(row.WRZ) > 0 && Number(row.UPZ) > Number(row.WRZ)) {
                e.cellStyle = "color:#FFA500";
            }
            if (Number(row.GRZ) > 0 && Number(row.UPZ) > Number(row.GRZ)) {
                e.cellStyle = "color:red";
            }
            if (field == "TM") {
                // e.cellHtml = convertToDate(value).format("yyyy-MM-dd HH:mm:ss");
            } else if (field == "WRZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            } else if (field == "UPZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            } else if (field == "DWZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            } else if (field == "GRZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            }
        }
    </script>
    <script type="text/javascript">
        /* 过程线绘制 过程线 水位
         * ChartName画图控件名称
         * dataS数据对象，数据格式json
         * strNote数据说明，数据类型数组，数据格式
         * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示过程线
         * [
         * {"name": "时间","codename": "TM","tableV":"1","isShow":true},
         * {"name": "闸上水位","codename": "UPZ","tableV":"1","isShow":true},
         * {"name": "闸下水位","codename": "DWZ","tableV":"1","isShow":true},
         * {"name": "警戒水位","codename": "WRZ","tableV":"0","isShow":false}
         * ]
         */
        function chartSW(ChartName, data, strNote, LineColor, max_min_Name, maxArr, wrzDataS, grzDataS) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var ShowSelected = {};
            var m = new Array();
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        var tm = value[value1.codename];//convertToDate(value[value1.codename]).format("yyyy-MM-dd HH:mm");
                        if (rbl.getValue() == "DAY") {
                            tm = new Date(tm).format("yyyy-MM-dd");
                        }
                        else if (rbl.getValue() == "HOUR") {
                            tm = new Date(tm).format("MM-dd HH");
                        }
                        chartTM.push(tm); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            //获得最大值最小值
            //var max_min=GetSort(chartValue);
            var titleText = "槽蓄量和平均水位过程";
            var option = {
                title: {
                    text: titleText,
                    textStyle: {
                        //color: '#497DBB',
                        color: '#414C59',
                        // fontSize: 12,
                        // fontWeight: 'normal'
                    },
                    // subtext: subtext,
                    subtextStyle: {
                        color: '#497DBB',
                        fontSize: 16,
                        fontWeight: 'normal'
                    },
                    left: 'center',
                    top: 0
                },
                //backgroundColor: '#100E19',
                noDataLoadingOption: {
                    text: '暂无数据',
                    effect: 'bubble',
                    effectOption: {
                        effect: {
                            n: 0 //气泡个数为0
                        }
                    },
                    textStyle: {
                        fontSize: 30,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis',
                    formatter: function (params, ticket, callback) {
                        var dataIndex = params[0].dataIndex;
                        var dataValue = Number(params[0].data).toFixed(2);
                        var str = "蓄量：" + dataValue + "<br/>";
                        str += "水位：" + Number(data[dataIndex].UPZ).toFixed(2);
                        return str;
                    }
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show: true,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    },
                    selected: ShowSelected,
                    y: 30,
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: true,
                        data: chartTM,
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        }
                    }
                ],

                    {
                        name: "(百万方)",
