<!DOCTYPE HTML PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>系统菜单管理</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="../Common/boot.js" type="text/javascript"></script> 
    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            overflow: hidden;
        }
        .mini-fit{
            overflow: hidden;
        }
    </style>
</head>
<body class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar" style=" margin-bottom:1px;">
            <table style="width:100%;">
                <tr>
                    <td style="width:100%;">
                        关键字：  
                        <input id="key" class="mini-textbox" emptytext="请输入菜单名称" style="height:25px;width:200px;" onenter="onKeyEnter" />   &nbsp;
                        <a id="searchbtn" class="mini-button"  onclick="search()">查询</a>
                    </td>
                    <td style="white-space:nowrap;">
                        <a class="mini-button" onclick="search()">刷新</a>
                        <span class="separator"></span>
                        <a id="delbtn" class="mini-button" onclick="remove()">删除</a>
                        <span class="separator"></span>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <!--allowAlternating="true"隔行换色，showVGridLines =false竖线 showHGridLines横线  headerStyle头样式 cellStyle=列样式 -->
    <div class="mini-fit" style="margin-top:1px;height: -webkit-calc(100% - 100px);height: -moz-calc(100% - 100px);height: calc(100% - 100px);">
        <div id="treegrid1" class="mini-treegrid" style="width:100%;height:85%;background-color:#FFF;"
             showtreeicon="true"
             treecolumn="taskname" idfield="qx_ID" parentfield="qx_PARENT" resultastree="false"
             allowresize="true" expandonload="true" allowresize="true" showvgridlines="false" ondrawcell="ondrawcell">
            <div property="columns">
                <!--<div type="indexcolumn" width="5%" headerstyle="height:30px" cellstyle="height:25px" headeralign="center" allowsort="true"></div>-->
                <div name="taskname" field="qx_NAME" width="30%" headerstyle="height:30px" cellstyle="height:25px" cellstyle="height:30px;width:30%;" headeralign="center" allowsort="true">名称</div>
                <div field="qx_MENU"   width="10%" headerstyle="height:30px;" cellstyle="height:25px;width:10%;" headeralign="center" align="center" allowsort="true">分类编码</div>
                <div field="qx_URL"  width="30%" headerstyle="height:30px;" cellstyle="height:25px;width:30%;" headeralign="center" align="center" allowsort="true">路径</div>
                <div field="qx_ICON" width="10%" headerstyle="height:30px;" cellstyle="height:25px;width:10%;" headeralign="center" align="center" allowsort="true">图标</div>
                <div field="qx_ORDERID" width="10%" headerstyle="height:30px;" cellstyle="height:25px;width:10%;" headeralign="center" align="center" allowsort="true">排序号</div>
            </div>
        </div>
        <fieldset style="width:99.9%;border:solid 1px #aaa;position:relative;background-color:#FFF">
            <legend>功能编辑</legend>
            <div id="editForm1" style="padding:5px; ">
                <div class="mini-toolbar">
                    <table style="width:100%">
                        <tr>
                            <td align="right">编号：</td>
                            <td align="left"> 
                                <input id="qx_ID" name="qx_ID" class="mini-textbox" emptytext="请输入编号" required="true" readonly/>
                                <input type="checkbox" onchange="OnQx_ID()" id="CBQX_ID" title="" />父节点
                            </td>
                            <td align="right">名称：</td>
                            <td align="left"><input id="qx_NAME" name="qx_NAME" class="mini-textbox Span90" /></td>
                            <td align="right">图标：</td>
                            <td align="left"><input id="qx_ICON" name="qx_ICON" class="mini-textbox Span90" />
                            <img src="/Common/miniui/themes/icons/noimage.gif" style="cursor:pointer;" onclick="openWindows()"/>
                            </td>
                            <td align="right">分类号：</td>
                            <td align="left"><input id="qx_MENU" name="qx_MENU" class="mini-textbox Span90" /></td>
                            <td align="right">路径：</td>
                            <td align="left"><input id="qx_URL" name="qx_URL" class="mini-textbox Span90" /></td>
                            <td align="right">排序号：</td>
                            <td align="left"><input id="qx_ORDERID" name="qx_ORDERID" class="mini-textbox Span90" name="QX_ORDERID" /></td>
                            <td align="right">
                                <a class="mini-button" onclick="saveData()" id="savebtn">修改</a>
                                <a class="mini-button"onclick="addData()" id="addbtn">添加</a>

                                <input id="qx_SYS2" class="mini-textbox" name="qx_SYS" value="NO12" style="width:80px;display:none;" />
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </fieldset>
    </div>
    <script language="javascript" type="text/javascript">
        //获取图片
        function openWindows() {
            mini.open({
                //url: "DuanXin/duanxin_send.aspx",
                url: "/System/ICON.html",
                iconCls: "icon-look",
                title: "图标选择",
                width: "80%",
                height: "800",
                showCloseButton: true,   //显示关闭按钮
                showMaxButton: true,     //显示最大化按钮
                showModal: true,         //显示遮罩
                onload: function () {

                },
                ondestroy: function (action) {
                    if (action == "ok") {
                        var iframe = this.getIFrameEl();
                        var data = iframe.contentWindow.GetData();
                        mini.get("qx_ICON").setValue(data);
                    }
                }
            })
        } 
        //删除
        function remove() {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        var value = grid.getValue();
                        if (value == "") {
                            mini.alert("请选择删除行！");
                            return;
                        }
                        grid.loading("执行删除中，请稍后......");
                        //GetJosns("QX_MAINDel", { "QX_ID": value }, "Del");
						app.post("SWZZ_DATA_qx_main/remove",{stcd:value},(data)=>{
							JosnSel(data,"Del")
						})
                    }
                    else {
                        //alert("不删除!");
                    }
                }
            );
        }

        function OnQx_ID() {
            if (GetObj("CBQX_ID").checked == true) {
                GetObj("CBQX_ID").alt = mini.get("qx_ID").getValue();
                mini.get("qx_ID").setValue("-1");
            } else {
                GetObj("CBQX_ID").title = "-1";
                mini.get("qx_ID").setValue(GetObj("CBQX_ID").alt);
            }
            alert(mini.get("qx_ID").getValue());
        }
        //查询
        function search() {
            var key = mini.get("key").getValue();
            var qx_sys = mini.get("qx_SYS2").getValue();
            var strWhere = { kwtxt: key, strExp: qx_sys }
            //GetJosns("QX_MAINSel", strWhere, "Sel");
			app.post("SWZZ_DATA_qx_main/findResult",strWhere,(data)=>{
				JosnSel(data,"Sel")
			})
        }
    </script>
    <script language="javascript" type="text/javascript">
        mini.parse();
        //绑定表单
        var grid = mini.get("treegrid1");
        var db = new mini.DataBinding();
        db.bindForm("editForm1", grid);
        //mini.get("qx_sys").select(0);
        //grid.setUrl("QX_main.aspx?method=LoadData");
        $(function () {
            search();
        })


        function JosnSel(resultdata, typeID) {
            if (typeID == "Sel") {
                var tree = mini.get("treegrid1");
                tree.loadList(resultdata.data.sort((a,b)=>{return a.qx_ORDERID - b.qx_ORDERID}), "qx_ID", "qx_PARENT")
            }
            else if (typeID == "SAVE") {
                alert(resultdata.message)
                if (resultdata.total > 0) { 
                    search();
                    GetObj("CBQX_ID").checked == false;
                }
            } else if (typeID == "Del") {
                alert(resultdata.message)
                if (resultdata.total > 0) {
                    search();
                }
            }
        }
        function saveData() {
            var data = grid.getChanges();
            var json = mini.encode(data);
            if (json == "[]") {
                mini.alert("未对数据进行修改！");
                return;
            }
            grid.loading("保存中，请稍后......");

          
            var strWhere = {
                "qx_ID": mini.get("qx_ID").getValue(),
                "qx_NAME": mini.get("qx_NAME").getValue(),
                "qx_ICON": mini.get("qx_ICON").getValue(),
                "qx_MENU": mini.get("qx_MENU").getValue(),
                "qx_URL": mini.get("qx_URL").getValue(),
                "qx_SYS": mini.get("qx_SYS2").getValue(),
                "qx_ORDERID": mini.get("qx_ORDERID").getValue() 
            }; 
            //GetJosns("QX_MAINUpdate", strWhere, "SAVE");
			app.post("SWZZ_DATA_qx_main/modify",strWhere,(data)=>{
				JosnSel(data,"SAVE");
			})
        }

        function addData() {
            var data = grid.getChanges();
            var json = mini.encode(data);
            if (json == "[]") {
                mini.alert("没有可以添加的数据！");
                return;
            }
            grid.loading("保存中，请稍后......"); 
            var strID = GetTableID();
            var PARENT_ID = mini.get("qx_ID").getValue();
            if (PARENT_ID == "-1") {
                PARENT_ID = data[0].qx_PARENT;
            }
            var strWhere = { 
                "qx_ID": strID,
                "qx_PARENT": PARENT_ID,
                "qx_NAME": mini.get("qx_NAME").getValue(), 
                "qx_ICON": mini.get("qx_ICON").getValue(),
                "qx_MENU": mini.get("qx_MENU").getValue(),
                "qx_URL": mini.get("qx_URL").getValue(),
                "qx_SYS": mini.get("qx_SYS2").getValue(),
                "qx_ORDERID": mini.get("qx_ORDERID").getValue()
            }; 
            //GetJosns("QX_MAINAdd", strWhere, "SAVE");
			app.post("SWZZ_DATA_qx_main/add",strWhere,(data)=>{
				JosnSel(data,"SAVE")
			})
        }

        //鼠标移动上去的提示信息。
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务
            if (field == "qx_ICON") {
                var s = '';
                if (value == "" || value == "暂定图片") {
                    s = '<i class="fa fa-desktop" style="font-size:18px;margin-top:5px;"></a>';
                } else {
                    s = '<i class="fa ' + value + '" style="font-size:18px;margin-top:5px;"></a>';
                }
                e.cellHtml = s;
            }
        }

    </script>
    </div>
</body>
</html>
