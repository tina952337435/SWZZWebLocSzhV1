<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>预报降雨关联管理</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <script src="/Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="/Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            <table style="width:100%;">
                <tr>
                    <td style="width:100%;">
                        预报时间：&nbsp;
                        <input id="STIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" ondrawdate="onDrawDate"/>
                        <input id="HOUR" name="HOUR" class="mini-combobox" style="width:60px;"
                               textfield="text" valuefield="id" allowinput="true" />
                        <a class="mini-button" onclick="PageFillData()" style="width:60px;">查询</a>

                    </td>
                    <td style="white-space:nowrap;">
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <div style="width: 100%;  height: -webkit-calc(100% - 60px);height: -moz-calc(100% - 60px);height: calc(100% - 60px);border-top: solid 1px #e8e8e8;">
        <div style="width:15%;float:left;border: solid 1px #e8e8e8; margin-top:5px;margin-left:5px;height:99%;">
            <ul id="tree1" class="mini-tree" style="width:100%;height:100%;"
                showTreeIcon="true" textField="ID" idField="ID" onNodeClick="onNodeClick"
                expandOnLoad="true"></ul>
        </div>
        <div style="width:84%;float:left;height:99%; margin-top:5px;margin-left:0.5%;">
            <div id="divChart" style="height:100%;width:99%;">
            </div>
        </div>
    </div>
    <script>
        mini.parse();
        var zhanid = GetQueryString("zhanid");
        var zhanname = GetQueryString("zhanname");
        var gridcode = GetQueryString("gridcode");
        var tree = mini.get("tree1");
        var myData = [];
        $(function () {
            var hourData = [{ "id": "08", "text": "8时" }, { "id": "20", "text": "20时" }];
            mini.get("HOUR").setData(hourData);
            //mini.get("HOUR").select(0);
            var gridcodeData = gridcode.split(",");
            var treeData = [];
            for (var num = 0; num < gridcodeData.length; num++) {
                if (gridcodeData[num] != "") {
                    treeData.push({ ID: gridcodeData[num] });
                }
            }
            tree.setData(treeData);
            tree.select(0);
            var s_where = {};
            GetJosns("QXSJ_TZ_NCFILESel", s_where, "QXSJ_TZ_NCFILESel");
        });
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "QXSJ_TZ_NCFILESel") {
                $.data(myData, "solutionArr", data.data);
                var TM = new Date(convertToDate(data.data[0].TM)).format("yyyy-MM-dd");
                var HOUR = new Date(convertToDate(data.data[0].TM)).format("HH");
                mini.get("HOUR").setValue(HOUR);
                mini.get("STIME").setValue(TM);
                PageFillData();
            } else if (typeID == "Sel") {
                JsonLineChart(data.data);
                mini.unmask(document.body);
            }
        }
        function PageFillData() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var TM = mini.get("STIME").getFormValue() + " " + mini.get("HOUR").getValue() + ":00:00";
            var node = tree.getSelectedNode();
            GetJosns("QXSJ_TZGRIDDATASel", { RLSTM: TM, GRIDCODE: node.ID }, "Sel");
        }
        function JsonLineChart(strJson) {
            var strNote = '[{"name": "时间","codename": "FTM","tableV":"1","isShow":true,"width":"40%"}';
            strNote += ',{"name": "雨量","codename": "FP","tableV":"1","isShow":true,"width":"30%"}]';
            //绘制过程线颜色设置
            var LineColor = ['#257BEE', '#FF0000', '#00FF00', '#FFA500'];
            //绘制图形
            chartYL("divChart", strJson, eval('(' + strNote + ')'), LineColor, "雨量");
        }
        function onNodeClick(e) {
            var tree = e.sender;
            var node = e.node;
            var isLeaf = tree.isLeaf(node);
            if (isLeaf == false) {
                e.cancel = true;
            } else {
                PageFillData();
            }
        }
        function onDrawDate(e) {
            var date = e.date;
            var solutionArr = $.data(myData, "solutionArr");
            var tempResult = solutionArr.filter(function (ex) {
                return new Date(date).format("yyyy/MM/dd") == new Date(convertToDate(ex.TM)).format("yyyy/MM/dd");
            });
            if (tempResult.length > 0) {
                e.dateStyle = "background:#A8D9B6;"
            } else {
                //e.allowSelect = false;
            }
        }
        function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(new Date(convertToDate(value[value1.codename])).format("M月d日H时")); //加入时间集合
                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                toolbox: {
                    show: true,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: { show: false, type: ['line', 'bar'] },
                        restore: { show: false },
                        saveAsImage: { show: true }
                    }
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: 40,
                    top: 40,
                    containLabel: true
                },
                calculable: true,
                dataZoom: [
                    {
                        show: true,
                        realtime: true,
                        start: 0,
                        end: 20
                    },
                    {
                        type: 'inside',
                        realtime: true,
                        start: 0,
                        end: 20
                    }
                ],
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        },
                        axisLabel: {
                            interval: 0,
                            rotate: 30
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        //interval: 0,
                        //  splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        min: 0,
                        max: function (value) {
                            var max = value.max;
                            if (max < 5) {
                                max = 5
                            } else {
                                max = max + 2;
                            }
                            return max;
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        if (chartName[j] == "名称") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: '25%',
                                label: {
                                    normal: {
                                        show: true,
                                        position: 'top'
                                    }
                                },
                                smooth: true
                                //		           itemStyle: {normal: {
                                //          	areaStyle: {type: 'default'},
                                //				//颜色渐变设置
                                //          	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //          		offset:0,
                                //          		color:'#050AE8'
                                //          	},{
                                //          		offset:1,
                                //          		color:'#8688F4'
                                //          	}])
                                //          }},
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html>
