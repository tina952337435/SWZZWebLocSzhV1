
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<head>

    <style type="text/css">

<body style="font-size:14px;font-family:arial;">
    <div style="width:250px;float:left;height:100%; margin-right: 5px;">
        <div style="margin-bottom:5px; margin-top:5px;line-height:25px;">
            <label>&nbsp;&nbsp;С�����б�</label>
        </div>
        <ul id="tree1" class="mini-tree" style="width:100%;padding:5px;height: -webkit-calc(100% - 45px);height: -moz-calc(100% - 45px);height: calc(100% - 45px);"
            showTreeIcon="true" textField="NAME" idField="STCD" onNodeClick="onNodeClick"
            expandOnLoad="true"></ul>
    </div>
    <div style="width:calc(100% - 260px);float:left;height: -webkit-calc(100% - 25px);height: -moz-calc(100% - 25px);height: calc(100% - 25px);">
        <table cellpadding="0" cellspacing="0" border="0" width="100%" height="100%">
            <tr>
                <td style="width:35%;">
                    <div style="width:100%;">
                        <div class="mini-toolbar">
                            <table style="width: 100%;">
                                <tr>
                                    <td style="width: 80%;">
                                        <span class="label" style="width: 70px;line-height: 30px;float: left;">ʱ��ѡ��</span>
                                        <input id="STIME" class="mini-datepicker" style="width:115px;float: left;" format="yyyy-MM-dd" ondrawdate="onDrawDate" />
                                        <!--<input id="HOUR" name="HOUR" class="mini-combobox" style="width:60px;" textfield="text" valuefield="id" allowinput="true" />-->
                                        <div id="rb2" style="width:120px;margin-left:10px;margin-top:5px;float: left;" class="mini-radiobuttonlist" textfield="text" valuefield="id" value="8" onvaluechanged="BreakLayerLoad"></div>
                                        <a style="margin-top:1px;margin-left:2px;" class="mini-button" onclick="play()">��ѯ</a>
                                        &nbsp;&nbsp;<a class="mini-button" onclick="ExportExcel('С����Ԥ��������')">����Excel</a>
                                    </td>
                                    <td align="right">
                                        <div class="bootstrap-switch ">
                                            <div class="bootstrap-switch-container">
                                                <span class="bootstrap-switch-handle-on switch" onclick="OnBoot(this.id,'fit1')" id="switch1"><i class="fa fa-line-chart"></i></span>
                                                <span class="bootstrap-switch-handle-off switch" onclick="OnBoot(this.id,'fit2')" id="switch2"><i class="fa fa-table"></i></span>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div class="mini-fit" style="margin-top:1px;height: 100%;">
                        <div id="fit1" class="fit" style="float:left;width:100%;">
                            <div id="Chart" style="width: 100%;min-width:1000px; height:700px; text-align: center">
                            </div>
                        </div>
                        <div id="fit2" class="fit" style="height:100%;float:left;width:100%;">
                            <div id="grid1" class="left mini-datagrid"
                                 style="width:100%; height: 100%; margin: auto; "
                                 showpager="false" allowalternating="true" allowresize="false" ondrawcell="ondrawcell">
                                <div property="columns">
                                    <div type="indexcolumn" width="60" headeralign="center" align="center">���</div>
                                    <div field="NAME" width="120" align="center" headeralign="center" allowsort="false">��������</div>
                                    <div field="DRP" width="80" align="center" headeralign="center" allowsort="false">Ԥ��������(mm)</div>
                                    <div field="FTM" width="120" align="center" headeralign="center" allowsort="false">ʱ��</div>
                                </div>
                            </div>
                        </div>

                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>
<script type="text/javascript">
    mini.parse();
    var tree = mini.get("tree1");
    var grid = mini.get("grid1");
    var list2 = mini.get("rb2");
    list2.load([{ "id": "8", "text": "8ʱ" }, { "id": "20", "text": "20ʱ" }]);

    grid.on("beforeload", function (e) {
        e.cancel = true;
        var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
    });
    function ondrawcell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            value = e.value;
        rowIndex = e.rowIndex;
        if (field == "FTM") {
            e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm");
        }
    }
    var resultData;
    var dt;
    var myData = [];
    window.onload = function () {
        $("#fit1").show();
        $("#fit2").hide();

        var hourData = [{ "id": "08", "text": "8ʱ" }, { "id": "20", "text": "20ʱ" }];

        var s_where = {};
        GetJosns("QXSJ_TZ_NCFILESel", s_where, "QXSJ_TZ_NCFILESel");
        GetJosns("QXSJ_TZ_WATERSHEDSel", s_where, "QXSJ_TZ_WATERSHEDSel");
    };
    function getInfo() {
        tableBind(resultData);
        JsonColumnChart(resultData);
    }
    function tableBind(data) {
        var dataResult = data;
        grid.setData(dataResult);
    }
    // ��ҳ���ϸ�ڴ���
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }
    function BreakLayerLoad() {
        $("#dataLoad").show(); //ҳ�������Ϻ󼴽�DIV����
        var TM = mini.get("STIME").getFormValue() + " " + list2.getValue()+ ":00:00";
        var node = tree.getSelectedNode();
        console.error(node);
        var KEYID = node.KEYID;
        GetJosns("QXSJ_TZ_WATERSHEDDATAMoreSel", {"RLSTM": TM, "KEYID": KEYID }, "Sel");
    }
    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.total > 0) {
                resultData = eval(ResultData.data);
                getInfo();
            } else {
                resultData = [];
                getInfo();
            }
        }
        else if (typeID == "QXSJ_TZ_NCFILESel") {
            if (ResultData.total > 0) {
                $.data(myData, "solutionArr", ResultData.data);
                var TM = new Date(convertToDate(ResultData.data[0].TM)).format("yyyy-MM-dd");
                var HOUR = new Date(convertToDate(ResultData.data[0].TM)).format("H");
                mini.get("STIME").setValue(TM);
                list2.setValue(HOUR);
            } else {
                var TM = new Date().format("yyyy-MM-dd");
                mini.get("STIME").setValue(TM);
                list2.setValue("8");
            }

        }
        else if (typeID == "QXSJ_TZ_WATERSHEDSel") {
            tree.loadList(ResultData.data, "KEYID");
            tree.select(0);

            BreakLayerLoad();
        }
    }
    function onDrawDate(e) {
        var date = e.date;
        var solutionArr = $.data(myData, "solutionArr");
        var tempResult = solutionArr.filter(function (ex) {
            return new Date(date).format("yyyy/MM/dd") == new Date(convertToDate(ex.TM)).format("yyyy/MM/dd");
        });
        if (tempResult.length > 0) {
            e.dateStyle = "background:#A8D9B6;"
        } else {
            //e.allowSelect = false;
        }
    }
    function btnSearch() {
        BreakLayerLoad();
    }
    function OnBoot(objID, objFit) {
        $(".switch").removeClass("bootstrap-switch-handle-on");
        $(".switch").addClass("bootstrap-switch-handle-off");
        $("#" + objID).toggleClass("bootstrap-switch-handle-on");
        $(".fit").hide();
        $("#" + objFit).show();
    }
    function onNodeClick(e) {
        BreakLayerLoad();
    }

    function JsonColumnChart(strJson) {
        var strNote = [];
        var item = { "name": "ʱ��", "codename": "FTM", "tableV": "1", "isShow": true, "width": "30%" };
        strNote.push(item);
        item = { "name": "������", "codename": "DRP", "tableV": "1", "isShow": true, "width": "30%" };
        strNote.push(item);
        //���ƹ�������ɫ����
        var LineColor = ['#3398DB', '#FF0000', '#00FF00', '#FFA500'];
        //����ͼ��
        chartYL("Chart", strJson, strNote, LineColor, "����");
    }
    /* ��״ͼ ����
* ChartName��ͼ�ؼ�����
* dataS���ݶ������ݸ�ʽjson
* strNote����˵���������������飬���ݸ�ʽ
* json ��ʽ˵�� name�����������ƣ�codename���ݱ�ʾ��tableV ����Ƿ���ʾ��isShow �Ƿ���ʾ
*/
    function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
        var myChart = echarts.init(document.getElementById(ChartName));  //��ÿؼ�����
        //��ջ滭���ݣ���պ�ʵ�����ã���Ϊ�����ͷ�ʾ������Դ���ͷ���Դ������Ҫdispose()
        myChart.clear();
        if (max_min_Name == "����") {
            max_min_Name = "������mm��";
        }
        var chartName = []; 	//�ؼ�Ԫ������
        var chartTM = []; 	//ʱ������
        var chartValue = []; //ʱ������
        var liststr = ""; 	//ƴװ���
        var m = new Array();

        $.each(strNote, function (index, value, item) {
            chartName.push(value.name);   //Echarts���Ʊ�ע���Ƽ���
        });
        //ѭ�����ݣ�������Ч���ݡ�
        $.each(data, function (index, value, item) {
            var charthan = []; 	//ʱ������
            $.each(strNote, function (index1, value1, item1) {
                charthan.push(value[value1.codename]); //���뼯��
                if (value1.name == "ʱ��") {
                    chartTM.push(new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")); //����ʱ�伯��
                    //chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //����ʱ�伯��
                } else if (value1.name == "����") {
                    chartTM.push(value[value1.codename]);
                }
                else {
                    chartValue.push(value[value1.codename]);
                }
            });
            m.push(charthan); //���뼯��
        });
        var option = {
            tooltip: {
                showDelay: 0,
                hideDelay: 50,
                transitionDuration: 0,
                backgroundColor: 'rgba(255,255,255,0.9)',
                borderColor: '#4040FB',
                borderRadius: 8,
                borderWidth: 2,
                padding: 10,
                textStyle: {
                    color: '#000000'
                },
                trigger: 'axis'
            },
            color: LineColor,
            legend: {
                data: chartName,
                itemWidth: 8,
                itemHeight: 8,
                textStyle: {
                    color: '#000',
                    fontSize: 12
                }
            },
            toolbox: {
                show: true,
                feature: {
                    mark: { show: false },
                    dataView: { show: false, readOnly: false },
                    magicType: { show: false, type: ['line', 'bar'] },
                    restore: { show: false },
                    saveAsImage: { show: true }
                }
            },
            grid: {
                left: '5%',
                right: '5%',
                bottom: 20,
                top: 40,
                containLabel: true
            },
            calculable: true,
            dataZoom: [
                {
                    show: true,
                    realtime: true,
                    start: 0,
                    end: 55
                },
                {
                    type: 'inside',
                    realtime: true,
                    start: 0,
                    end: 35
                }
            ],
            xAxis: [
                {
                    type: 'category',
                    data: chartTM,
                    axisTick: {
                        alignWithLabel: false
                    },
                    axisLabel: {
                        interval: 0,
                        rotate: 30
                    }
                }
            ],
            yAxis: [
                {
                    name: max_min_Name,
                    type: 'value',
                    boundaryGap: false,
                    //interval: 0,
                    //  splitNumeber: 5,
                    //scale: true, //�Ƿ��Զ����������Сֵ��
                    min: 0,
                    max: function (value) {
                        var max = 5;
                        if (value.max > 5) {
                            max = value.max + 2;
                        }
                        return max;
                    },
                    axisLabel: {
                        formatter: function (v) {
                            return v.toFixed(1);
                        }
                    }
                }
            ],
            series: function () {
                var serie = [];
                for (var j = 0; j < chartName.length; j++) {
                    if (chartName[j] == "ʱ��") //����ʱ���ֶ�
                    {
                        continue;
                    }
                    if (chartName[j] == "����") //����ʱ���ֶ�
                    {
                        continue;
                    }
                    var chartValue = []; 	//��������value����
                    for (var i = 0; i < m.length; i++) {
                        chartValue.push(changeTwoDecimal(m[i][j], 1)); //ѭ����ֵ
                    }
                    if (max_min_Name != "") {
                        var item = {
                            name: chartName[j],
                            type: 'bar',
                            data: chartValue,
                            barWidth: '25%',
                            label: {
                                normal: {
                                    show: true,
                                    position: 'top'
                                }
                            },
                            smooth: true,
                        }
                        serie.push(item);
                    }
                    else {
                        var item = {
                            name: chartName[j],
                            type: 'line',
                            data: chartValue,
                            smooth: true
                        }
                        serie.push(item);
                    }
                };
                return serie;
            }()
        };
        myChart.setOption(option);
    }
</script>
</html>
