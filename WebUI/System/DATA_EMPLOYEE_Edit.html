                    if (obj.qx_YPASSWORD != undefined) {

                        console.error(o.qx_PASSWORD,decrypted(obj.qx_PASSWORD));

        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {

            app.post("SWZZ_DATA_employee/findResult",s_where,(data)=>{

			})

       function onEnglishAndNumberValidation(e) {
            if (e.isValid) {
                console.error(checkStrong(e.value))
                if (checkStrong(e.value) != 3) {
                    e.errorText = "密码长度大于8且必须输入英文大小写+数字";
                    e.isValid = false;
                }
            }
        }
        function checkStrong(val) {
            var modes = 0;
            if (val.length <= 8) return 0;
            if (/\d/.test(val)) modes++; //数字
            if (/[a-z]/.test(val)) modes++; //小写
            if (/[A-Z]/.test(val)) modes++; //大写 
            //   if (/\W/.test(val)) modes++; //特殊字符
            if (val.length >= 8) return modes;
            return modes;
        };

        function OnSava() {
            form.validate();
            var yz=checkStrong(mini.get("qx_YPASSWORD").getValue());
            if (yz != 3) {
                mini.alert("密码长度大于8且必须输入英文大小写+数字");
                return;
            }
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("id").getValue();
            }
            else {
                var strId = GetTableID();
                mini.get("id").setValue(strId);
            }
            mini.get("qx_PASSWORD").setValue(hex_md5(mini.get("qx_YPASSWORD").getValue()));

			console.log(strWhere)
            mini.mask({

				app.post("SWZZ_DATA_employee/modify",strWhere,(data)=>{

				})

				app.post("SWZZ_DATA_employee/add",strWhere,(data)=>{
					JosnSel(data,"Add")
				})
            }
        }
        function onGROUPChanged(e) {
