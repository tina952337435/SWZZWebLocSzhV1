<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>站点关联配置</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <!--<div class="mini-panel" title="关联信息" style="width:100%;height:100px;"
             showCollapseButton="true" bodyStyle="padding:0;" expanded="true">-->
            <div style="margin-left:50px; margin-top:10px;">
                <table cellpadding="0" cellspacing="0" border="0" style="width:100%">

                    <tr>
                        <td style="width:50px;">站点：</td>
                        <td style="width:120px;">
                            <input id="InputSTCD" name="InputSTCD" class="mini-combobox Span90" textfield="STNM" valuefield="STCD" allowInput="true"
                                  showNullItem="true" emptytext="全部" nullItemText="全部" onvaluechanged="onDeptChanged" />
                        </td>
                        <td style="width:65px;">
                            关联信息：
                        </td>
                        <td>
                            <div id="DIV_TAB" class="mini-checkboxlist" repeatitems="15" repeatlayout="table"
                                 textfield="NAME" valuefield="STCD">
                            </div>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="4" align="right">
                            &nbsp;&nbsp; <a class="mini-button" id="addbtn" onclick="AddData()">增加</a>
                            &nbsp;&nbsp; <a class="mini-button" id="savabtn" onclick="savaData()">保存</a>&nbsp;&nbsp;&nbsp;&nbsp;
                        </td>
                    </tr>
                </table>
            </div>
        <!--</div>-->
            <div class="mini-toolbar">
                &nbsp; &nbsp;  <div id="ck1" name="product" class="mini-checkbox" readOnly="false" text="关联信息" onvaluechanged="onValueChanged"></div>
                &nbsp; &nbsp; <span style="font-size:13px;">关键字：</span>&nbsp;<input id="key" class="mini-textbox" emptytext="请输入关键字" style="height: 25px;width: 150px;" onenter="onKeyEnter" />
                &nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a>

            </div>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);" allowalternating="true"
         borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]" pagesize="15" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" width="20" headeralign="center" align="center">序号</div>
            <div field="STNM" name="STNM" headeralign="center" align="center" allowsort="true">
                站名
            </div>
            <div field="NAME" headeralign="center" align="center" allowsort="true">
                关联名称
            </div>
            <div field="URL" headeralign="center" align="center" allowsort="true">
                关联路径
            </div>
            <div field="ORDERBY" headeralign="center" align="center" allowsort="true">
                排序
            </div>
            <div name="action" width="50" headeralign="center" align="center" renderer="onActionRenderer" cellstyle="padding:0;">
                基本操作
            </div>
        </div>
    </div>
    <script language="javascript" type="text/javascript">
        mini.parse();
        //实例化表格对象
        var myData = [];
        var grid = mini.get("grid1");
        var InputSTCD = mini.get("InputSTCD");
        $(function () {
            GetJosns("WATER_ST_STBPRP_BSel", {}, "InputSTCD");
            GetJosns("WATER_GL_STCDSel", { "TYPE": "站点配置" }, "DIV_TAB");//抢险机构性质
            $.data(myData, "TYPE", "站点关联配置");
            //默认加载数据
            search();
        })
        function onKeyEnter() {
            //关键字
            search();
        }
        var dataResult = null;
        function search() {
            PageFillData(0, 15);
        }
        function PageFillData(pageIndex, pageSize) {
            //查询方法
            var strWhere = { "TYPE": $.data(myData, "TYPE"), "STCD": InputSTCD.getValue(), "KEY": mini.get("key").getValue(), "PageIndex": pageIndex, "PageSize": pageSize };
            GetJosns("WATER_GL_STCDSel", strWhere, "Sel");
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                PageServerFill(grid, data);
            }
            else if (typeID == "Del") {
                if (data.total > 0) {
                    search();
                }
            } else if (typeID == "DIV_TAB") {
                mini.get("DIV_TAB").setData(data.data);
            } else if (typeID == "InputSTCD") {
                $.data(myData, "STCDDATA", data.data);
                InputSTCD.setData(data.data);
                InputSTCD.select(0);
            } else if (typeID == "SavaData") {
                var obj = mini.get("DIV_TAB").getSelecteds();
                var _stcd = InputSTCD.getValue();
                var jsonarray = obj;
                for (var item in jsonarray) {
                    if (checkRate(item) == true) { 
                        var tempObj = jsonarray[item]; 
                        var strWhere = {
                            "ID": "",
                            "STCD": _stcd,
                            "NAME": tempObj.NAME,
                            "URL": tempObj.URL,
                            "ORDERBY": tempObj.ORDERBY,
                            "TYPE": "站点关联配置"
                        }
                        if (item == jsonarray.length - 1) {
                            GetJosns("WATER_GL_STCDAdd", strWhere, "Add");
                        } else {
                            GetJosns("WATER_GL_STCDAdd", strWhere, "Add1");
                        }
                        //console.log(item + "@@@@@@" + jsonarray.length + "=======" + JSON.stringify(strWhere));

                    }
                } 
            } else if (typeID == "Add") {
                search();
            }
        }

        function checkRate(objNum) {
            　　var re = /^[0-9]+.?[0-9]*/;//判断字符串是否为数字//判断正整数/[1−9]+[0−9]∗]∗/ 
            if (!re.test(objNum)) {
                return false;
            } else {
                return true;
            }
        }
        //==加上编辑列代码
        function onActionRenderer(e) {
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            var s = '<img style="cursor:pointer;" onclick="lookData(\'ID@' + record.ID + '\',\'/System/WATER_GL_STCD_View.html\',\'查看站点关联配置\',\'40%\',\'55%\',\'true\')" src="../Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
            s += '<img style="cursor:pointer;" onclick="editData(\'ID@' + record.ID + '\', \'/System/WATER_GL_STCD_Edit.html\', \'编辑站点关联配置\', \'40%\',\'55%\', \'true\')" src="../Common/miniui/themes/icons/edit.png" title="修改" />&nbsp;';
            s += '<img style="cursor:pointer;" onclick="del(\'' + record.ID + '\')" src="../Common/miniui/themes/icons/remove.png" title="删除站点关联配置" />&nbsp;';
            return s;
        }
        //删除
        function del(objID) {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        var strWhere = { "ID": objID };
                        GetJosns("WATER_GL_STCDDel", strWhere, "Del");
                    }
                }
            );
        }
        //--------------------------------
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            PageFillData(pageIndex, pageSize);
        });

        function AddData() {
            addData('STCD@' + InputSTCD.getValue(), '/System/WATER_GL_STCD_Edit.html', '新增站点关联配置', '40%', '40%', 'true')
        }
        function onValueChanged(e) {
            var checked = this.getChecked();
            if (checked == true) {
                grid.hideColumn("STNM");
                $.data(myData, "TYPE", "站点配置");
            } else {
                grid.showColumn("STNM");
                $.data(myData, "TYPE", "站点关联配置");
            }
            search();
        }

        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
   
        }
        function savaData() {
            var _stcd = InputSTCD.getValue(); 
            GetJosns("WATER_GL_STCDAdd", { "TYPE": "站点关联配置", "STCD": _stcd }, "SavaData");
        }
        function onDeptChanged() { 
            var stcd = InputSTCD.getValue();
            search();
        }
    </script>
</body>
</html>
