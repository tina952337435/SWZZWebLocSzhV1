<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>通讯录管理</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }
        .lie1 {
            line-height:60px;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellpadding="0" cellspacing="0" border="0" width="100%">
            <tr>
                <td style="width:50%;" valign="top">
                    <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width: 100%; border-collapse: collapse;height:600px;'>
                        <tr>
                            <td colspan="4" align="center" class="CssTitle">
                                通讯录管理
                                <input id="STCD" name="STCD" class="mini-textbox Span90" style="display:none;" />
                            </td>
                        </tr>
                        <tr>
                            <td class="lie1" align="right">
                                测站名称：
                            </td>
                            <td class="lie2">
                                <input id="STNM" name="STNM" class="mini-textbox Span90" />
                            </td>
                        </tr>
                        <tr>
                            <td class="lie1" align="right">
                                河流名称：
                            </td>
                            <td class="lie2">
                                <input id="RVNM" name="RVNM" class="mini-textbox Span90" />
                            </td>
                        </tr>
                        <tr>
                            <td class="lie1" align="right">
                                水系名称：
                            </td>
                            <td class="lie2">
                                <input id="HNNM" name="HNNM" class="mini-textbox Span90" />
                            </td>
                        </tr>
                        <tr>
                            <td class="lie1" align="right">
                                流域名称：
                            </td>
                            <td class="lie2">
                                <input id="BSNM" name="BSNM" class="mini-textbox Span90" />
                            </td>
                        </tr>
                        <tr>
                            <td class="lie1" align="right">
                                经度：
                            </td>
                            <td class="lie2">
                                <input id="LGTD" name="LGTD" class="mini-textbox Span90" />
                            </td>
                        </tr>
                        <tr>
                            <td class="lie1" align="right">
                                纬度：
                            </td>
                            <td class="lie2">
                                <input id="LTTD" name="LTTD" class="mini-textbox Span90" />
                            </td>
                        </tr>
                        <tr>
                            <td class="lie1" align="right">
                                站类：
                            </td>
                            <td class="lie2">
                                <input id="STTP" name="STTP" class="mini-textbox Span90" />
                            </td>
                        </tr>
                        <tr>
                            <td colspan="2" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                                <a class="mini-button" onclick="onOk" style="width:60px;margin-right:20px;">确认</a>
                                <a class="mini-button" onclick="onCancel" style="width:60px;">取消</a>
                            </td>
                        </tr>
                    </table>
                </td> 
                <td style="width:50%;" valign="top"> 
                    <table class="table1" style="width:100%" border="0">
                        <tr>
                            <td>
                                <iframe id="IframeRight" scrolling="no" frameborder="0" style="height:600px; width:100%; " src=""></iframe>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
        

    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");
        //标准方法接口定义
        function SetData(data) {
            $.data(myData, "action", data.action);
            if (data.action == "edit") {
                mini.get("STCD").setValue(data.STCD);
                var strWhere = { "STCD": data.STCD };
                GetJosns("WATER_ST_STBPRP_BSel", strWhere, "Sel");
            } else if (data.action == "new") {
                var strID = GetTableID();
                mini.get("STCD").setValue(strID);
                //var tm = new Date();
                //mini.get("TM").setValue(tm.format("yyyy-MM-dd"));
            }
        }
        function SetMapPoint(lgtd, lttd, str) {
            mini.get("LGTD").setValue(lgtd);
            mini.get("LTTD").setValue(lttd);
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
                    FromSetData(o);

                    $("#IframeRight").attr("src", "/XQSB/PointEditMap.html?LGTD=" + o.LGTD + "&LTTD=" + o.LTTD +"&NAME="+o.STNM)
                }
            }
            else if (typeID == "Update") {
                mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            else if (typeID == "Add") {
                mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            mini.unmask(document.body);
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {
            //保存数据
            form.validate();
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("STCD").getValue();
            }
            else {
                var strId = GetTableID();
                mini.get("STCD").setValue(strId);
            }
            var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            if (objSate == "edit") {
                GetJosns("WATER_ST_STBPRP_BUpdate", strWhere, "Update");
            }
            else {
                GetJosns("WATER_ST_STBPRP_BAdd", strWhere, "Add");
            }
        }
    </script>
</body>
</html>
