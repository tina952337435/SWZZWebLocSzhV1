<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>用户管理</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar"> 
            &nbsp;&nbsp;&nbsp;关键字：<input id="key" class="mini-textbox" emptytext="请输入关键字" style="height: 25px;width: 150px;" onenter="onKeyEnter" />
            &nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a>
            &nbsp;&nbsp; <a class="mini-button" id="addbtn" onclick="addData('', '/System/DATA_FX_EMPLOYEE_Edit.html', '新增用户管理', '50%', 565, 'true')" plain="false">增加</a>
        </div>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);" allowalternating="true"
         borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]" pagesize="15" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
        <div property="columns">
            <div type="indexcolumn" width="20" headeralign="center" align="center">序号</div>
            <div field="NAME" headeralign="center" align="center" allowsort="true">
                姓名
            </div>
            <div field="MEMO" name="MEMO" headeralign="center" align="center" allowsort="true">
                单位名称
            </div>
            <div field="TECHTITLE" headeralign="center" align="center" allowsort="true">
                部门名称
            </div>
            <div field="JOBTITLE" headeralign="center" align="center" allowsort="true">
                职位
            </div>
            <div field="TEL" headeralign="center" align="center" allowsort="true">
                办公电话
            </div>
            <div field="MOBILE" headeralign="center" align="center" allowsort="true">
                手机号码
            </div>
            <div field="SORT" headeralign="center" align="center" allowsort="true">
                排序
            </div>
            <div name="action" width="50" headeralign="center" align="center" renderer="onActionRenderer" cellstyle="padding:0;">
                基本操作
            </div>
        </div>
    </div>
    <script language="javascript" type="text/javascript">
        mini.parse();
        //实例化表格对象
        var myData = [];
        var grid = mini.get("grid1");
        $(function () {
            var temp = GetQueryString("TYPE"); 
            $.data(myData, "TYPE", temp); 
            //默认加载数据
            search();
        })
        function onKeyEnter() {
            //关键字
            search();
        }
        var dataResult = null;
        function search() { 
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            setTimeout(function () { PageFillData(0, 15); }, 100); 
        }
        function PageFillData(pageIndex, pageSize) { 
            //查询方法
            var temp = $.data(myData, "TYPE"); 
            var strWhere = { "TYPE": temp, "KEY": mini.get("key").getValue(), "PageIndex": pageIndex, "PageSize": pageSize };
            GetJosns("DATA_FX_EMPLOYEESel", strWhere, "Sel");
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                PageServerFill(grid, data);
                mini.unmask(document.body);
            }
            else if (typeID == "Del") {
                //mini.alert(data.Message);
                if (data.total > 0) {
                    search();
                }
            }
        }
        //==加上编辑列代码
        function onActionRenderer(e) {
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            var s = '<img style="cursor:pointer;" onclick="lookData(\'ID@' + record.ID + ',TYPE@' + $.data(myData, "TYPE") +'\',\'/System/DATA_FX_EMPLOYEE_View.html\',\'查看用户管理\',\'50%\',\'415\',\'true\')" src="../Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
            s += '<img style="cursor:pointer;" onclick="editData(\'ID@' + record.ID + ',TYPE@' + $.data(myData, "TYPE") +'\', \'/System/DATA_FX_EMPLOYEE_Edit.html\', \'编辑用户管理\', \'50%\',\'465\', \'true\')" src="../Common/miniui/themes/icons/edit.png" title="修改" />&nbsp;';
            s += '<img style="cursor:pointer;" onclick="del(\'' + record.ID + '\')" src="../Common/miniui/themes/icons/remove.png" title="删除用户管理" />&nbsp;';
            return s;
        }
        //删除
        function del(objID) {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        var strWhere = { "ID": objID };
                        GetJosns("DATA_FX_EMPLOYEEDel", strWhere, "Del");
                    }
                }
            );
        }
        //--------------------------------
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            PageFillData(pageIndex, pageSize);
        });
        function onTMRenderer(e) {
            var value = e.value;
            if (value) {
                return mini.formatDate(convertToDate(value), 'yyyy-MM-dd');
            }
            else {
                return "";
            }
        }
    </script>
</body>
</html>
