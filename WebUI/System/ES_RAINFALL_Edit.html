
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>自定义配置</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .lie2 {
            width: 80%;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width:98%; border-collapse: collapse;'>
            <tr>
                <td colspan="2" align="center" class="CssTitle">
                    自定义配置
                    <input id="pid" name="pid" class="mini-textbox Span90" style="display:none;" />
                    <input id="tm" name="tm" class="mini-textbox Span90" style="display:none;" />
                    <input id="pathname" name="pathname" class="mini-textbox Span90" style="display:none;" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    编号：
                </td>
                <td class="lie2">
                    <input id="id" name="id" class="mini-textbox Span90" required="true" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    标题：
                </td>
                <td class="lie2">
                    <input id="title" name="title" class="mini-textbox Span90" required="true" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    排序：
                </td>
                <td class="lie2">
                    <input id="orderbyid" name="orderbyid" class="mini-textbox Span90" />
                </td>
            </tr>
            <tr>
                <td colspan="2" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                    <a class="mini-button" onclick="onOk" style="width:60px;margin-right:20px;">保存</a>
                    <a class="mini-button" onclick="onCancel" style="width:60px;">取消</a>
                </td>
            </tr>
        </table>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");
        //标准方法接口定义
        function SetData(data) {
            $.data(myData, "action", data.action);
            var tm = new Date();
            mini.get("tm").setValue(tm.format("yyyy/MM/dd HH:mm:ss"));
            mini.get("pid").setValue(data.PID);
            mini.get("orderbyid").setValue(data.ORDERBYID);
            mini.get("pathname").setValue(data.PATHNAME);
            if (data.action == "edit") {
                mini.get("id").setValue(data.ID);
                var strWhere = { "stcd": data.ID };
                //GetJosns("MODE_ES_RAINFALL_TREESel", strWhere, "Sel");
				app.post("SWZZ_MODE_ES_RAINFALL_TREE/findResult",strWhere,(data)=>{
					JosnSel(data,"Sel")
				})
            } else if (data.action == "new") {
                var strID = GetTableID();
                mini.get("id").setValue(strID);
            }
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var o = data.data[0];
					console.log(o)
                    //FromSetData(o);
					mini.get("tm").setValue(new Date(o.tm).format("yyyy/MM/dd HH:mm:ss"));
					mini.get("pid").setValue(o.pid);
					mini.get("orderbyid").setValue(o.orderbyid);
					mini.get("pathname").setValue(o.pathname);
					mini.get("id").setValue(o.id);
					mini.get("title").setValue(o.title);
                }
            }
            else if (typeID == "Update") {
                //mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            else if (typeID == "Add") {
                //mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            mini.unmask(document.body);
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {
            //保存数据
            form.validate();
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("id").getValue();
            }
            else {
                if (mini.get("id").getValue() != "") {

                } else {
                    var strId = GetTableID();
                    mini.get("id").setValue(strId);
                }
            }
            var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            if (objSate == "edit") {
                //GetJosns("MODE_ES_RAINFALL_TREEUpdate", strWhere, "Update");
				app.post("SWZZ_MODE_ES_RAINFALL_TREE/modify",strWhere,(data)=>{
					JosnSel(data,"Update")
				})
            }
            else {
                //GetJosns("MODE_ES_RAINFALL_TREEAdd", strWhere, "Add");
				app.post("SWZZ_MODE_ES_RAINFALL_TREE/add",strWhere,(data)=>{
					JosnSel(data,"Add")
				})
            }
        }
    </script>
</body>
</html>
