<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>模型输出站点管理</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            <table style="width:100%;">
                <tr>
                    <td style="width:100%;">
                    </td>
                    <td style="white-space:nowrap;">
                        <a class="mini-button" onclick="uploadData()">更新</a>
                    </td>
                </tr>
            </table>

        </div>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 50px);height: -moz-calc(100% - 50px);height: calc(100% - 50px);" allowalternating="true"
         borderstyle="border-right:0;"showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" showpager="false" ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" width="20" headeralign="center" align="center">序号</div>
            <div field="id" headeralign="center" align="center" >
                内码
            </div>
            <div field="name" name="name" headeralign="center" align="center" >
                站名
            </div>
            <div field="stcd" headeralign="center" align="center" >
                相应数据库站码
            </div>
            <div field="type" headeralign="center" align="center" >
                类型
            </div>
            <!--<div name="action" width="50" headeralign="center" align="center" renderer="onActionRenderer" cellstyle="padding:0;">
                基本操作
            </div>-->
        </div>
    </div>
    <script language="javascript" type="text/javascript">
        mini.parse();
        var grid = mini.get("grid1");

        $(function () {
            PageFillData();
        });

        function PageFillData() {
            //GetJosns("MODE_ES_JISUANZHANSel", {}, "Sel");
			app.post("SWZZ_MODE_ES_JISUANZHAN/findResult",{},(data)=>{
				JosnSel(data,"Sel")
			})
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                PageServerFill(grid, data);
            } else if (typeID == "UploadFH_GetSTCD") {
                if (data.total == 0) {
                    ShowMsg("请配置主图形输出！");
                } else {
                    ShowMsg(data.Message);
                    PageFillData();
                }
                mini.unmask(document.body);
            }
        }

        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务
            if (field== "type") {
                var s = "流量";
                if (value == "1") {
                    s = "水位";
                }
                e.cellHtml = s;
            }
        }

        function uploadData() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据更新中...'
            });
            GetJosns("UploadFH_GetSTCD", {}, "UploadFH_GetSTCD");
        }
    </script>
</body >
</html >
