<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>站点关联配置</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }

        .lie2 {
            width: 80%;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width: 98%; border-collapse: collapse;'>
            <tr>
                <td colspan="2" align="center" class="CssTitle">
                    站点关联配置
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    站码：
                </td>
                <td class="lie2 View" id="STCD">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    关联名称：
                </td>
                <td class="lie2 View" id="NAME">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    关联路径：
                </td>
                <td class="lie2 View" id="URL">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    排序：
                </td>
                <td class="lie2 View" id="ORDERBY">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    类型：
                </td>
                <td class="lie2 View" id="TYPE">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <script type="text/javascript">
        //标准方法接口定义
        function SetData(data) {
            if (data.action == "look") {
                var strWhere = { "ID": data.ID };
                GetJosns("WATER_GL_STCDSel", strWhere, "Sel");

                app.post("SWZZ_MODE_GL_STCD/findResultStnm", { treeID: data.ID}, function (res) {
                    JosnSel(res, "Sel");
                });
            }
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
                    FromSetinnerHTML(o, "View");
                    mini.get("url").setValue(o.url);
                    mini.get("name").setValue(o.name);
                    mini.get("orderby").setValue(o.orderby);
                    mini.get("url").setValue(o.url);
                    mini.get("stcd").setValue(o.stcd);
                    mini.get("id").setValue(o.id);
                }
            }
        }
    </script>
</body>
</html>
