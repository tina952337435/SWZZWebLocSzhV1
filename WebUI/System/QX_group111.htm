<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head runat="server">
    <title>用户组管理</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
<script src="../Common/boot.js" type="text/javascript"></script> 
    <link href="../style/demo.css" rel="stylesheet" type="text/css" />
    <style type="text/css">
        body{
            margin:0;padding:0;border:0;width:100%;height:100%;overflow:hidden;
        }    
    </style>  
</head>
<body class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar" style="height:27px;">
            <table style="width:100%;">
                <tr>
                    <td style="width:100%;">
                    </td>
                    <td style="white-space:nowrap;">
                       <a class="mini-button" iconCls="icon-addnew" id="addbtn" onclick="addRow()" plain="true">增加</a>
                        <span class="separator"></span>
                        <a class="mini-button" iconCls="icon-edit" id="editbtn" onclick="editRow()" plain="true">编辑</a>
                        <span class="separator"></span>
                        <a class="mini-button" iconCls="icon-remove" id="delbtn" onclick="removeRow()" plain="true">删除</a>
                        <span class="separator"></span>
                        <a class="mini-button" iconCls="icon-save" id="savebtn" onclick="saveData()" plain="true">保存</a>       
                    </td>
                </tr>
            </table>           
        </div>
    </div>
    <div id="datagrid1" class="mini-datagrid" style="width:100%;margin-top:1px; height: -webkit-calc(100% - 38px);height: -moz-calc(100% - 38px);height: calc(100% - 38px);" 
         allowCellSelect="true" allowCellEdit="true" 
         url="QX_group.aspx?method=LoadData" allowAlternating="true"
    >
        <div property="columns">
            <div field="QX_ID" width="100"  headerStyle="height:30px"  headerAlign="center" align="center">编号
            </div>                   
            <div  field="QX_NAME" width="120" headerAlign="center" align="center"  >组名
               <input property="editor" class="mini-textbox" style="width:100%;"/>            
            </div>   
            <div  field="QX_NOTE"  width="150" headerAlign="center" align="center"  >备注
                <input property="editor" class="mini-textarea" style="width:100%;"/>              
            </div>   
        </div>
    </div>
    <script type="text/javascript" language="javascript">
        mini.parse();

        var grid = mini.get("datagrid1");
        grid.load();

        //编辑
        function editRow() {
            var row = grid.getSelected();
            if (row) {
                mini.open({
                    url: "/System/QX_group_edit.htm",
                    title: "系统模块权限", width: "85%", height: "90%",
                    iconCls: "icon-edit",
                    onload: function () {
                        var iframe = this.getIFrameEl();
                        var data = { action: "edit", id: row.QX_ID };
                        iframe.contentWindow.SetData(data);
                    },
                    ondestroy: function (action) {
                        grid.reload();
                    }
                });

            } else {
               mini.alert("请选中一条记录!");
            }
        }

        var isAdd = "";
        //增加
        function addRow() {
            isAdd = "add";
            var newRow = { name: "New Row" };
            grid.addRow(newRow, 0);
            grid.beginEditRow(newRow);
        }


        //删除
        function removeRow() {
            var value = grid.getSelected();
            if (value) {
                mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        $.ajax({
                            url: "QX_group.aspx?method=del",
                            data: { data: value.QX_ID },
                            type: "post",
                            success: function (text) {
                                grid.reload();
                            },
                            error: function (jqXHR, textStatus, errorThrown) {
                                mini.alert(jqXHR.responseText);
                            }
                        });
                    }
                    else {
                        //alert("不删除!");
                    }
                }
             );
            }
            else {
                mini.alert("请选择删除行！");
                return;
            }
        }

        //保存
        function saveData() {
            grid.commitEdit();

            var data = grid.getChanges();
            var json = mini.encode(data);
            if (json == "[]") {
                mini.alert("没有可以保存的数据！");
                return;
            }
            grid.loading("保存中，请稍后......");
            $.ajax({
                url: "QX_group.aspx?method=SaveQX_main",
                data: { data: json, add: isAdd },
                type: "post",
                success: function (text) {
                    grid.reload();
                    isAdd = "";
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    mini.alert(jqXHR.responseText);
                }
            });
        }
    </script>
</body>
</html>
