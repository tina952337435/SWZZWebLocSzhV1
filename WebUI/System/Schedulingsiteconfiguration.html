<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .mini-grid-checkbox {
            margin-top: 10px;
        }
        /*.mini-labelfield-checkboxlist table{
            padding-left:60px !important;
        }*/
        .mini-panel .mini-panel-viewport {
            width: 100%;
        }

        .table > thead > tr > th, .table > tbody > tr > th, .table > tfoot > tr > th, .table > thead > tr > td, .table > tbody > tr > td, .table > tfoot > tr > td {
            height: 40px !important;
            border:0px !important;
        }

        .divXuanzhong {
            background: #A9CEC7;
        }

        .layout_title {
            position: relative;
            padding: 5px;
        }

        .px-2 {
            padding-right: 10px !important;
        }

        .pl-2, .px-2 {
            padding-left: 10px !important;
        }

        .layout_title .d1, .layout_title .d2 {
            width: 14px;
            height: 14px;
            background: #3794ff;
            border-radius: 2px;
            position: absolute;
            left: 4px;
            top: 15px;
            margin: 0px 10px;
        }

        .layout_title .d2 {
            background: rgba(55,148,255,.3);
            left: 11px;
            top: 9px;
        }

        .layout_title .base-p {
            color: #409eff;
            font-size: 16px;
            line-height: 0px;
            margin-left: 40px;
            font-weight: 800 !important;
            display: inline-block;
        }

        .mwsChart {
            -webkit-box-shadow: 0 2px 6px 2px rgba(0,0,0,.14);
            box-shadow: 0 2px 6px 2px rgba(0,0,0,.14);
            background-color: #fff;
            /*padding-left: 10px;
            padding-right: 10px;*/
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="mini-fit">
        <div style="width:300px;float:left;height:100%; margin-right: 5px;">
            <div class="mini-toolbar">
                <a class="mini-button" id="addbtn" onclick="addFuData()" plain="false">增加(节点)</a>
                <a class="mini-button" id="addbtn" onclick="addZiData()" plain="false">增加(子节点)</a><br />
                <a class="mini-button" id="addbtn" onclick="edit()" plain="false">编辑(节点)</a>
                <a class="mini-button" id="addbtn" onclick="delTree()" plain="false">删除</a>
            </div>
            <ul id="tree1" class="mini-tree" style="width:100%;height: -webkit-calc(100% - 100px);
height: -moz-calc(100% - 100px);height: calc(100% - 100px);padding:5px;    background: #F5FAFE;"
                showTreeIcon="true" textField="title" expandOnLoad="0" allowDrag="true" allowDrop="true" allowLeafDropIn="true"
                idField="id" parentField="pid" resultAsTree="false" onnodeselect="onSelectNode"></ul>
        </div>
        <div style="width:calc(100% - 310px);float:left;height: -webkit-calc(100% - 20px);height: -moz-calc(100% - 20px);height: calc(100% - 20px);
background: #F5FAFE;margin-top:5px;" class="mwsChart">
            
            <div class="layout_title px-2">
                <div data-v-62547c07="" class="d1">
                </div>
                <div class="d2"></div>
                <p class="base-p">模型输出要素分类</p>
            </div>
            <div id="checklist" style="width:100%;padding:10px;"></div>
            <div style="text-align:center;">
                <a class="mini-button" id="addbtn" style="padding:5px; font-size:16px;" onclick="SavaQU()" plain="false">保存数据</a>
            </div>
        </div>
    </div>
    <div id="win1" class="mini-window" title="窗体" style="width:600px;height:400px;"
         showToolbar="false" showFooter="false" showModal="false" allowResize="true" allowDrag="true">
        <div id="form1" style="text-align: center;">
            <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width:98%; border-collapse: collapse;'>
                <tr>
                    <td colspan="2" align="center" class="CssTitle">
                        自定义配置
                        <input id="PID" name="PID" class="mini-textbox Span90" style="display:none;" />
                        <input id="TM" name="TM" class="mini-textbox Span90" style="display:none;" />
                        <input id="PATHNAME" name="PATHNAME" class="mini-textbox Span90" style="display:none;" />
                    </td>
                </tr>
                <tr>
                    <td class="lie1" align="right">
                        标题：
                    </td>
                    <td class="lie2">
                        <input id="TITLE" name="TITLE" class="mini-textbox Span90" required="true" />
                        <input id="PID" name="PID" class="mini-textbox Span90" style="display:none;" />
                        <input id="STCD" name="STCD" class="mini-textbox Span90" style="display:none;" />
                        <input id="ID" name="ID" class="mini-textbox Span90" style="display:none;" />
                    </td>
                </tr>
                <tr>
                    <td class="lie1" align="right">
                        类型：
                    </td>
                    <td class="lie2">
                        <input id="TYPE" name="TYPE" class="mini-combobox Span90"  textField="text" valueField="id"  required="true" allowInput="true" />
                    </td>
                </tr>
                <tr>
                    <td colspan="2" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                        <a class="mini-button" onclick="onOk()" style="width:100px;margin-right:20px;">保存数据</a>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <script type="text/javascript">
        mini.parse();
        //实例化表格对象
        var PathName = GetQueryString("PATHNAME");
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
		var win = mini.get("win1");
        $(function () {
            var listcombo = [
                { text: "工程调度站", id: "2" },
                { text: "流量", id: "0" },
                { text: "蓄量", id: "15" },
                { text: "水位", id: "1" },
                { text: "边界水位", id: "4" }];
            mini.get("TYPE").setData(listcombo);
            mini.get("TYPE").select(0);
            search();
        })
        function TreeSel() {
            //GetJosns("MODE_ES_SLTONGJISel", {}, "MODE_ES_SLTONGJISel");
			app.post("SWZZ_MODE_ES_SLTONGJI/findResult",{},(data)=>{
				JosnSel(data,"MODE_ES_SLTONGJISel")
			})
        }
        function ONORDERBYID(e) {
            var editor = e.sender;
            var rows = grid2.getEditorOwnerRow(editor);
            rows["ORDERBYID"] = e.value;
            GetJosns("WATER_ST_STBPRP_B_QUUpdate", rows, "WATER_ST_STBPRP_B_QUUpdate");
        }
        function JosnSel(ResultData, typeID) {
            if (typeID == "MODE_ES_SLTONGJISel") {
                tree.loadList(ResultData.data, "id", "pid");
                if ($.data(myData, "ID") != null) {
                    tree.setValue($.data(myData, "ID"));
                } else {
                    tree.select(0);
                    var node = tree.getSelected();
                    $.data(myData, "ID", node.id);
                    $.data(myData, "PID", node.pid);
                    $.data(myData, "TITLE", node.title);
                    $.data(myData, "STCD", node.stcd);
                    $.data(myData, "TYPE", node.type);
                }
                STTPSel();
            } else if (typeID == "MODE_ES_JISUANZHANSel") {
                htmlTable(ResultData, "stcd", "name");
            } else if (typeID == "MODE_ES_ZHANDIANSel") {
                htmlTable(ResultData, "zhanid", "zhanname");
            } else if (typeID == "MODE_ES_SLTONGJIUpdate") {
                showTips(ResultData.message);
				win.hide();
                search();
            } else if (typeID == "MODE_ES_SLTONGJIDel") {
                showTips(ResultData.message);
                search();
            }
        }

        function onCheckValueChanged(e) {
            STTPSel();
        }

        function search() {
            TreeSel();
        }
        function STTPSel() {
            var type = $.data(myData, "TYPE");
            if (type == "0") {
                //GetJosns("MODE_ES_JISUANZHANSel", { "TYPE": "2" }, "MODE_ES_JISUANZHANSel");
				app.post("SWZZ_MODE_ES_JISUANZHAN/findResult",{pattem : "2"},(data)=>{
					JosnSel(data,"MODE_ES_JISUANZHANSel")
				})
            } else if (type == "2") {
                //GetJosns("MODE_ES_ZHANDIANSel", { "PTYPE": "3" }, "MODE_ES_ZHANDIANSel");
				app.post("SWZZ_MODE_ES_ZHANDIAN/findResult",{pattem : "3005"},(data)=>{
					JosnSel(data,"MODE_ES_ZHANDIANSel")
				})
            } else if (type == "3") {
                //GetJosns("MODE_ES_JISUANZHANSel", { "TYPE": "15" }, "MODE_ES_JISUANZHANSel");
				app.post("SWZZ_MODE_ES_JISUANZHAN/findResult",{pattem : "15"},(data)=>{
					JosnSel(data,"MODE_ES_JISUANZHANSel")
				})
            } else if (type == "1") {
                //GetJosns("MODE_ES_JISUANZHANSel", { "TYPE": "1" }, "MODE_ES_JISUANZHANSel");
				app.post("SWZZ_MODE_ES_JISUANZHAN/findResult",{pattem : "1"},(data)=>{
					JosnSel(data,"MODE_ES_JISUANZHANSel")
				})
            } else if(type=="4") {
                //GetJosns("MODE_ES_ZHANDIANSel", { "PTYPE": "1" }, "MODE_ES_ZHANDIANSel");
				app.post("SWZZ_MODE_ES_ZHANDIAN/findResult",{pattem : "1"},(data)=>{
					JosnSel(data,"MODE_ES_ZHANDIANSel")
				})
            }
        }
        function onSelectNode(e) {
            var node = e.node;
            if (node) {
				//console.log(node)
                $.data(myData, "ID", node.id);
                $.data(myData, "PID", node.pid);
                $.data(myData, "TITLE", node.title);
                $.data(myData, "STCD", node.stcd);
                $.data(myData, "TYPE", node.type);
                STTPSel();
            }
        }

        function SavaQU() {
            var stcds = "";
            var i_len = $("#checklist input[type='checkbox']:checked").length;
            $("#checklist input").each(function () {
                if (this.checked) {
                    stcds += this.value + ",";
                }
            });
			//console.log(stcds)
            var strWhere = { id: $.data(myData, "ID"), title: $.data(myData, "TITLE"), stcd: stcds, type: $.data(myData, "TYPE"), pid: $.data(myData, "PID") };
            //GetJosns("MODE_ES_SLTONGJIUpdate", strWhere, "MODE_ES_SLTONGJIUpdate");
			app.post("SWZZ_MODE_ES_SLTONGJI/modify",strWhere,(data)=>{
				JosnSel(data,"MODE_ES_SLTONGJIUpdate")
			})
        }

        function htmlTable(data, fieldSTCD, fieldSTNM) {
            var stcds = $.data(myData, "STCD");
            var Person_list = " <table class=\"table table-bordered table-striped\" style=\"width:100%;\">";
            Person_list += "<tr bgcolor=#FFFFFF>";
            var count = 0;
            for (var num = 0; num < data.data.length; num++) {
                count++;
                var checked = "";
                var cls = "";
                if (stcds != undefined) {
                    if (stcds.indexOf(data.data[num][fieldSTCD]) > -1) {
                        checked = "checked=\"checked\"";
                        cls = "divXuanzhong";
                    }else{
						checked = "";
						cls = "";
					}
                }
                if (count < 9) {
                    Person_list += "<td>";
                    Person_list += "<div class='" + cls + "' id='div_" + num + "'> <input id=\"Employ_" + num + "\" " + checked + "onclick=\"xuanzhong('Employ_" + num + "')\"  type=checkbox name=employee_id value=\"" + data.data[num][fieldSTCD] + "\">";
                    Person_list += "<span onclick=\"xuanzhong('Employ_" + num + "')\" style=\"cursor:pointer;\">" + data.data[num][fieldSTNM] + "</span></div>";
                    Person_list += "</td>";
                }
                else {
                    count = 1;
                    Person_list += "</tr><tr bgcolor=#FFFFFF>";
                    Person_list += "<td>";
                    Person_list += " <div class='" + cls + "'  id='div_" + num + "'><input id=\"Employ_" + num + "\" " + checked + " onclick=\"xuanzhong('Employ_" + num + "')\"   type=checkbox name=employee_id value=\"" + data.data[num][fieldSTCD] + "\">";
                    Person_list += "<span onclick=\"xuanzhong('Employ_" + num + "')\" style=\"cursor:pointer;\">" + data.data[num][fieldSTNM] + "</span></div>";
                    Person_list += "</td>";
                }
            }
            Person_list += "</tr> ";
            Person_list += " </table>";
            $("#checklist").html(Person_list);
        }

        function xuanzhong(obj) {
            var checked = $("#" + obj).attr("checked");
            var id = "div_" + obj.replace("Employ_", "");
            if (!checked) {
                $("#" + obj).attr("checked", true);
                document.getElementById(id).className = "divXuanzhong";
            } else {
                $("#" + obj).attr("checked", false);
                document.getElementById(id).className = "";
            }
        }

        function delTree() {
            var strWhere = {
                stcd: $.data(myData, "ID")
            }
            //GetJosns("MODE_ES_SLTONGJIDel", strWhere, "MODE_ES_SLTONGJIDel");
			app.post("SWZZ_MODE_ES_SLTONGJI/remove",strWhere,(data)=>{
				JosnSel(data,"MODE_ES_SLTONGJIDel")
			})
        }

        function showTips(msg) {
            var x = "center";
            var y = "top";
            var state = "success";
            mini.showTips({
                content: msg,
                state: state,
                x: x,
                y: y,
                timeout: 3000
            });
        }


        function addFuData() {
            $.data(myData, "method", "add");
            mini.get("PID").setValue("-1");
			mini.get("ID").setValue(UUID(19,16));
			mini.get("TITLE").setValue("");
			mini.get("TYPE").setValue($.data(myData, "TYPE"));
			mini.get("STCD").setValue("");
            addMenuData();
        }
        function addZiData() {
            $.data(myData, "method", "add");
            mini.get("PID").setValue($.data(myData, "ID"));
			mini.get("ID").setValue(UUID(19,16));
			mini.get("TITLE").setValue("");
			mini.get("TYPE").setValue($.data(myData, "TYPE"));
			mini.get("STCD").setValue("");
            //alert(mini.get("PID").getValue());
            addMenuData();
        }
        function edit() {
            $.data(myData, "method","edit");
            mini.get("ID").setValue($.data(myData, "ID"));
            mini.get("PID").setValue($.data(myData, "PID"));
            mini.get("TITLE").setValue($.data(myData, "TITLE"));
            mini.get("TYPE").setValue($.data(myData, "TYPE"));
            mini.get("STCD").setValue($.data(myData, "STCD"));
            addMenuData();
        }

        function addMenuData() {
            showAtEl();
        }
        
        function showAtEl() {
            var xAlign = "center";
            var yAlign = "middle";

            win.showAtPos(xAlign,yAlign);
        }
        function onOk() {
            var method = $.data(myData, "method");
            var strWhere = { id: mini.get("ID").getValue(), title: mini.get("TITLE").getValue(), stcd: mini.get("STCD").getValue(), type: mini.get("TYPE").getValue(), pid: mini.get("PID").getValue()};
            if (method == "edit") {
                //GetJosns("MODE_ES_SLTONGJIUpdate", strWhere, "MODE_ES_SLTONGJIUpdate");
				app.post("SWZZ_MODE_ES_SLTONGJI/modify",strWhere,(data)=>{
					JosnSel(data,"MODE_ES_SLTONGJIUpdate")
				})
            } else {
                //GetJosns("MODE_ES_SLTONGJIAdd", strWhere, "MODE_ES_SLTONGJIUpdate");
				app.post("SWZZ_MODE_ES_SLTONGJI/add",strWhere,(data)=>{
					JosnSel(data,"MODE_ES_SLTONGJIUpdate")
				})
            }
        }
    </script>
</body>
</html>
