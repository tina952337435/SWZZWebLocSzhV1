<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <script src="../Common/boot.js" type="text/javascript"></script> 
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div class="mini-toolbar" style="text-align: left; line-height: 30px;margin-bottom:1px;">
        &nbsp; &nbsp;
        开始日期： &nbsp;<input id="STIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;
        结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;
        <a class="mini-button" style="width: 60px;" onclick="search()">查询</a>&nbsp;&nbsp;
    </div>
    <div class="mini-fit">
    <div id="grid1" class="mini-datagrid" allowAlternating="true" sortMode="client" style="width: 100%; height: 100%;" idfield="EMP_ID" borderStyle="border-left:0;border-right:0;">
        <div property="columns">
            <div type="indexcolumn" width="5%" headerstyle="height:30px" cellstyle="height:25px"
                 headeralign="center" allowsort="true">
                序号
            </div>
            <div field="CREATETIME" width="30%" headerstyle="height:30px;" cellstyle="height:25px"
                 headeralign="center" align="center" allowsort="true" renderer="onTMRenderer">
                操作时间
            </div>
            <div field="SYSUSERNAME" width="30%" headerstyle="height:30px;" cellstyle="height:25px"
                 headeralign="center" align="center" allowsort="true">
                操作人员
            </div>
            <div field="PLATFORM" width="30%" headerstyle="height:30px;" cellstyle="height:25px"
                 headeralign="center" align="center" allowsort="true">
                操作来源
            </div>
            <div field="INTERFACENAME" width="30%" headerstyle="height:30px;" cellstyle="height:25px" headeralign="center"
                 align="left" allowsort="true" renderer="onActionRenderer">
                操作记录
            </div>
        </div>
    </div>
    </div>
    <script language="javascript" type="text/javascript">
        mini.parse();
        var grid = mini.get("grid1");

        window.onload = function () {
            var tm = new Date();  
            mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -7));
            mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));
            search();
        }

        var Genders = [{ id: "PC", text: '平台登录' }, { id: "IOS", text: '评估手机登录'}];
        function onActionRenderer(e) {
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            var _REPORTERROR = record.REPORTERROR;
            return record.SYSUSERNAME + "" + convertToDate(record.CREATETIME).format("HH时mm分") + "在" + record.PLATFORM +"操作"+ record.PLATFORMNAME+"，结果为："+ record.REPORTERROR  ;
        }
        function search() {
            PageFillData(0, grid.pageSize);
        }
        function PageFillData(pageIndex, pageSize) {
            var Startime = mini.get("STIME").getFormValue();
            var Endtime = mini.get("ETIME").getFormValue();
            if (Startime > Endtime) {
                mini.alert("请确认起止日期次序是否正确（终止日期至少是起始日期的次日）！");
                return false;
            }
            var strWhere = {
                STIME: Startime,
                ETIME: Endtime, 
                PageIndex: pageIndex,
                PageSize: pageSize
            };

            GetJosnsFW("LOGDATA_SYS_REPORTLOGSel", strWhere, "Sel");
        }

        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                PageServerFill(grid, data);
            } 
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            PageFillData(pageIndex, pageSize);
        });
        function onTMRenderer(e) {
            var value = e.value;
            if (value) {
                return mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
            }
            else {
                return "";
            }
        }
    </script>
</body>
</html>
