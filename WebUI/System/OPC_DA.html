<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <link href="../arcgis_js_api/myJs/style/map.css" rel="stylesheet" />

    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 98%;
            overflow: hidden;
            font-size: 12px;
        }

        .onlytab {
            width: 800px;
            height: 40px;
            margin: auto;
            -webkit-padding-start: 10px;
        }

            .onlytab li {
                list-style: none;
                border: 1px #3291f9 solid;
                float: left;
                background-color: White;
                width: 20%;
                height: 30px;
                font: 14px/30px "Microsoft YaHei";
                text-align: center;
            }

        .start {
            border-radius: 5px 0 0 5px;
        }

        .end {
            border-radius: 0 5px 5px 0;
        }

        .onlyli:hover {
            background-color: #3291f9;
            color: White;
            cursor: pointer;
        }

        .onlyliHover {
            background-color: #3291f9 !important;
            color: White;
            cursor: pointer;
        }

        .HUIsquare {
            display: inline-block;
            width: 10px;
            height: 10px;
            padding: 4px;
            border: 2px solid #A1A1A1;
            background-color: #A1A1A1;
            font-size: 14px !important;
        }

        .Grentsquare {
            display: inline-block;
            width: 10px;
            height: 10px;
            padding: 4px;
            border: 2px solid #00DB00;
            background-color: #00DB00;
            font-size: 14px !important;
        }

        body .mini-grid *, body .mini-supergird *, body .mini-gantt *, body .mini-panel *, body .mini-window * {
            box-sizing: border-box !important;
        }

        .HUIsquare, .Grentsquare, .gqRed, .gqGreen {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            <!--<div style="width:160px;float:left;height: 40px;line-height: 40px;">
                日期：<input id="TM" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />
            </div>-->
            <div style="margin-top:10px;" id="DivTitles">
                <ul class="onlytab">
                    <li id="TitleLi0" onclick="OnClickTitle(this.id,'1')" class="onlyli start onlyliHover">水位</li>
                    <li id="TitleLi1" onclick="OnClickTitle(this.id,'2')" class="onlyli">雨量</li>
                    <li id="TitleLi2" onclick="OnClickTitle(this.id,'3')" class="onlyli">工情</li>
                    <li id="TitleLi3" onclick="OnClickTitle(this.id,'6')" class="onlyli end">降雨预报</li>
                </ul>
            </div>
            <div style="clear:both;">

            </div>
        </div>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);" allowalternating="true"
         borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]" pagesize="15" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell" showpager="false">
        <div property="columns"> 
        </div>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        //实例化表格对象
        var grid = mini.get("grid1");
        $(function () {
            //默认加载数据
            //mini.get("TM").setValue(new Date().format("yyyy-MM-dd"));
            $.data(myData, "TYPE", "1");
            search();
        })
        function OnClickTitle(objID, objTYPE, objTITLE) {
            var only = $(".onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $.data(myData, "TYPE", objTYPE);
            search();
        }

        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            setTimeout(function (e) {
                var strTYPE = $.data(myData, "TYPE");
                var strSource = "";
                if (strTYPE == "6") {
                    //strTYPE = "2";
                    strSource = "气象局";
                }
                if (strTYPE != "3") {
                    var strWhere = {
                        "TYPE": strTYPE,
                        "SOURCE": strSource,
                        "TOTALTM": new Date().format("yyyy-MM-dd 08:00:00")
                    };
                    GetJosns("WATER_ST_STBPRP_B_STCDSel", strWhere, "Sel");
                } else {
                    var strWhere = { TREEID: "2019041210071468251" };
                    GetJosns("WATER_ST_GATE_RNEWLIST", strWhere, "Sel"); 
                }
               
            }, 100);
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var ColoumnsName = {}; 
                if ($.data(myData, "TYPE") != "3") {
                    ColoumnsName = {
                        "indexcolumn": "序号",
                        "STNM": "站名",
                        "UPZ": "最新数据",
                        "ZTM": "最新时间",
                        "TOTAL": "已收到总数",
                        "SOURCE": "来源",
                    };
                    SetColumns(ColoumnsName, grid);
                    grid.setData(data.data);
                    grid.sortBy("ZTM", "desc");
                } else {
                    ColoumnsName = {
                        "indexcolumn": "序号",
                        "STNM": "站名",
                        "OMCNUM": "泵站状态",
                        "SFQ": "泵站流量(m³/s)",
                        "GTOPNUM": "闸门", 
                        "TM": "最新时间", 
                    };
                    SetColumns(ColoumnsName, grid);
                    grid.setData(data.data);
                    grid.sortBy("TM", "desc");
                }
               
                mini.unmask(document.body);
            }
        }
        function TMOnRenderer(e) {
            var record = e.record,
                value = e.value;
            var s = '';
            if (value != undefined) {
                s = convertToDate(value).format("yyyy-MM-dd HH:mm:ss");
            }
            return s;
        }

        //鼠标移动上去的提示信息。
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务
            if (field == "OMCNUM") {
                var s = '';
                for (index = 1; index <= Number(row.OMCNUM); index++) {
                    var tempTM = new Date(new Date().format("yyyy/MM/dd 00:00:00"));
                    var temAgg = row.ST_GATE_R.filter(function (e) {
                        return e.EQPTP == "泵站电流" && e.EXKEY == index && Number(e.GTQ) > 0 && new Date(convertToDate(e.TM)) > tempTM;
                    });
                    if (temAgg.length > 0) {
                        s += '<span class="gqGreen">&nbsp;&nbsp;</span> ';
                    }
                    else {
                        s += '<span class="gqRed">&nbsp;&nbsp;</span> ';
                    }
                }
                if (s == "") {
                    s = "—";
                }
                e.cellHtml = s;

            } else if (field == "GTOPNUM") {
                var s = '';
                for (index = 1; index <= Number(row.GTOPNUM); index++) {
                    var temAgg = row.ST_GATE_R.filter(function (e) {
                        return e.EQPTP == "闸坝开度" && e.EXKEY == index && Number(e.GTQ) > 0;
                    });
                    if (temAgg.length > 0) {
                        s += '<span class="Grentsquare">&nbsp;&nbsp;</span> ';
                    }
                    else {
                        s += '<span class="HUIsquare">&nbsp;&nbsp;</span> ';
                    }
                }
                if (s == "") {
                    s = "—";
                }
                e.cellHtml = s;

            }
        }

    </script>
</body>
</html>
