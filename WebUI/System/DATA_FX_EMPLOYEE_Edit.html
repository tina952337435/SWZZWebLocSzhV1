<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>用户管理</title>
    <script src="../Common/Scripts/md5.js" type="text/javascript"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
            background-color: white;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width:98%; border-collapse: collapse;'>
            <tr>
                <td colspan="4" align="center"  class="CssTitle">
                    用户管理
                    <input id="ID" name="ID" class="mini-textbox Span90" style="display:none;" />
                    <input id="GROUPID" name="GROUPID" class="mini-textbox Span90" style="display:none;"/>
                    <input id="GROUPNAME" name="GROUPNAME" class="mini-textbox Span90" style="display:none;" />
                </td>
            </tr>
            
            <tr>
                <td class="lie1" align="right">
                    <span class="FontColor">*</span>姓名：
                </td>
                <td class="lie2">
                    <input id="NAME" name="NAME" class="mini-textbox Span90" required="true"/>
                </td>
                <td class="lie1" align="right">
                    生日：
                </td>
                <td class="lie2">
                    <input id="BIRTHDAY" name="BIRTHDAY" class="mini-datepicker Span90" />
                </td>
            </tr> 
            <tr>
                <td class="lie1" align="right">
                    职位：
                </td>
                <td class="lie2">
                    <input id="JOBTITLE" name="JOBTITLE" class="mini-textbox Span90" />
                </td>
                <td class="lie1" align="right">
                    部门名称：
                </td>
                <td class="lie2">
                    <input id="TECHTITLE" name="TECHTITLE" class="mini-textbox Span90" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    手机号码：
                </td>
                <td class="lie2">
                    <input id="MOBILE" name="MOBILE" class="mini-textbox Span90" />
                </td>
                <td class="lie1" align="right">
                    手机短号：
                </td>
                <td class="lie2">
                    <input id="MOBILE2" name="MOBILE2" class="mini-textbox Span90" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    办公电话：
                </td>
                <td class="lie2">
                    <input id="TEL" name="TEL" class="mini-textbox Span90" />
                </td>
                <td class="lie1" align="right">
                    办公短号：
                </td>
                <td class="lie2">
                    <input id="TEL2" name="TEL2" class="mini-textbox Span90" />
                </td>
            </tr>



            <tr>
                <td class="lie1" align="right">
                    手机号码2：
                </td>
                <td class="lie2">
                    <input id="MOBILE3" name="MOBILE3" class="mini-textbox Span90" />
                </td>
                <td class="lie1" align="right">
                    家庭电话：
                </td>
                <td class="lie2">
                    <input id="HOMETEL" name="HOMETEL" class="mini-textbox Span90" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    单位名称：
                </td>
                <td class="lie2">
                    <input id="MEMO" name="MEMO" class="mini-textbox Span90" />
                </td>
                <td class="lie1" align="right">
                    排序：
                </td>
                <td class="lie2">
                    <input id="SORT" name="SORT" class="mini-textbox Span90" />
                </td>
            </tr> 

            <tr>
                <td colspan="4" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                    <a class="mini-button" onclick="onOk" style="width:60px;margin-right:20px;">保存</a>
                    <a class="mini-button" onclick="onCancel" style="width:60px;">取消</a>
                </td>
            </tr>
        </table>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");
        //标准方法接口定义
        function SetData(data) {
            $.data(myData, "action", data.action);
            var _type = data.TYPE;
            
            //GetJosns("DATA_QX_GROUPSel", {}, "DATA_QX_GROUPSel");
            if (data.action == "edit") {
                mini.get("ID").setValue(data.ID);
                var strWhere = { "ID": data.ID };
                GetJosns("DATA_FX_EMPLOYEESel", strWhere, "Sel");
            } else if (data.action == "new") {
                var strID = GetTableID();
                mini.get("ID").setValue(strID);
                var tm = new Date();
                mini.get("BIRTHDAY").setValue(tm.format("yyyy-MM-dd"));
            }
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
                    FromSetData(o);
                    mini.get("qx_group").setValue(o.GROUPID);
                }
            }
            else if (typeID == "Update") {
                mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            else if (typeID == "Add") {
                mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            } else if (typeID == "DATA_QX_GROUPSel") {
                mini.get("qx_group").setData(data.data); 
            }
            mini.unmask(document.body);
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {
            //保存数据
            form.validate();
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("ID").getValue();
            }
            else {
                var strId = GetTableID();
                mini.get("ID").setValue(strId);
            } 
            var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            if (objSate == "edit") {
                GetJosns("DATA_FX_EMPLOYEEUpdate", strWhere, "Update");
            }
            else {
                GetJosns("DATA_FX_EMPLOYEEAdd", strWhere, "Add");
            }
        }
        function onGROUPChanged(e) {
            var tempID = mini.get("qx_group").getValue();
            var tempName = mini.get("qx_group").getText();
            mini.get("GROUPID").setValue(tempID);
            mini.get("GROUPNAME").setValue(tempName);
        }
    </script>
</body>
</html>
