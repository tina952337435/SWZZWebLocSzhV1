<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>站点关联配置</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }

        .lie2 {
            width: 80%;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width: 98%; border-collapse: collapse;'>
            <tr>
                <td colspan="2" align="center" class="CssTitle">
                    站点关联配置
                    <input id="id" name="id" class="mini-textbox Span90" style="display:none;" />
                    <input id="type" name="type" class="mini-textbox Span90" value="站点配置" style="display:none;" />
                </td>
            </tr>
            <tr style="display:none;">
                <td class="lie1" align="right">
                    站码：
                </td>
                <td class="lie2">
                    <input id="stcd" name="stcd" class="mini-combobox Span90"
           textfield="stnm" valuefield="stcd" allowInput="true" />
                    <!-- <input id="stcd" name="stcd" class="mini-textbox Span90" required="true" /> -->

                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    关联名称：
                </td>
                <td class="lie2">
                    <input id="name" name="name" class="mini-textbox Span90" required="true" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    关联路径：
                </td>
                <td class="lie2">
                    <input id="url" name="url" class="mini-textbox Span90" required="true" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    排序：
                </td>
                <td class="lie2">
                    <input id="orderby" name="orderby" class="mini-textbox Span90" required="true" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    STTP：
                </td>
                <td class="lie2">
                    <input id="sttp" name="sttp" class="mini-textbox Span90" value="SW"  />
                </td>
            </tr>
            <tr>
                <td colspan="2" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                    <a class="mini-button" onclick="onOk" style="width:60px;margin-right:20px;">保存</a>
                    <a class="mini-button" onclick="onCancel" style="width:60px;">取消</a>
                </td>
            </tr>
        </table>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");
        //标准方法接口定义
        function SetData(data) {
            // app.post("SWZZ_MODE_st_stbprp_b/findResult",{},function(res){
            //     JosnSel(res,"STCD");
            // });
            $.data(myData, "action", data.action);
            if (data.action == "edit") {
                mini.get("id").setValue(data.ID);
                mini.get("type").setValue(data.type);
                app.post("SWZZ_MODE_GL_STCD/findResultStnm", { treeID: data.ID, pattem: mini.get("type").getValue() }, function (res) {
                    JosnSel(res, "Sel");
                });
            } else if (data.action == "new") {
                var strID = GetTableID();
                mini.get("id").setValue(strID);
                $.data(myData, "STCD", data.STCD);
            }
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
                    FromSetData(o);
                    mini.get("url").setValue(o.url);
                    mini.get("name").setValue(o.name);
                    mini.get("orderby").setValue(o.orderby);
                    mini.get("url").setValue(o.url);
                    mini.get("stcd").setValue(o.stcd);
                    mini.get("id").setValue(o.id);
                }
            }
            else if (typeID == "Update") {
                mini.alert(data.message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            else if (typeID == "Add") {
                mini.alert(data.message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            } else if (typeID == "STCD") {
                mini.get("stcd").setData(data.data);
                if ($.data(myData, "STCD") == undefined) {
                    mini.get("stcd").select(0);
                } else {
                    mini.get("stcd").setValue($.data(myData, "STCD"));
                }
            }
            mini.unmask(document.body);
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {
            //保存数据
            form.validate();
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("id").getValue();
            }
            else {
                var strId = GetTableID();
                mini.get("id").setValue(strId);
            }
            var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
             
            if (objSate == "edit") {
                app.post("SWZZ_MODE_GL_STCD/modify", strWhere,function(res){
                    JosnSel(res,"Update")
                });
            }
            else {
                app.post("SWZZ_MODE_GL_STCD/add", strWhere,function(res){
                    JosnSel(res,"Add")
                });
            }
        }
    </script>
</body>
</html>
