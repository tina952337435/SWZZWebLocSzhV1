<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>

<body style="background:transparent;zoom:1;">
    <div id="YBTM" style="position:absolute;right:20px;top:10px;z-index:99;font-size:16px;height: 40px;line-height: 40px;padding: 0px 15px;border-radius: 5px;"></div>
    <div id="myCharts" style="width:100%;height:100%;">
    </div>
    <script>
        mini.parse();
        var myData = [];
        var STCD = GetQueryString("stcd");
        var STNM = GetQueryString("stnm");
        var DD_ID = GetQueryString("PLAN_N");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        var strPathName = "黄浦江水系预报模型三期";

        $(function () {
            BreakLayerLoad();
        });
        function BreakLayerLoad() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            if (STCD != null) {
                STCD = "100667526";
                STNM = "拦路港-泖河-斜塘";
            }
            var modeResultData=getParentModeResult();
            if (modeResultData == undefined) {
                var hdID = parseInt(stcd);
                modeGetResultModelsByTimePeriod(stime, etime, _taskID, [hdID]);
            }
            else{
                JosnSel(modeResultData,"GetResultModelsByTimePeriod");
            }
        }
        function getParentModeResult(){
           return window.parent.getModeResult();
        }
        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "GetResultModelsByTimePeriod") {
                dataResult = data;
                mini.unmask(document.body);
                var interval = setInterval(getProcess, 2000);
            }
        }

        var t = null;
        var timeout = false;
        var lengthIndex = 0;
        var dataValue = 0, wrz = 0, grz = 0;
        var hourCha = GetDateDiff(stime, etime, 'hour');
        //alert(hourCha);
        function getProcess() {
            window.clearTimeout(t);
            if (timeout) return;
            if (lengthIndex <=hourCha) {
                var curTM = formatDate(AddHourDate(stime, lengthIndex)).format("yyyy/MM/dd HH:mm:ss");
                var dataResultTemp = dataResult.data.filter(function (ex) {
                    return new Date(ex.id.time).format("yyyy/MM/dd HH:mm:ss") == curTM;
                });
                if (dataResultTemp.length > 0) {
                    var results = dataResultTemp[0].results;
                    var sections = results[STCD].sections;

                    for(var num=0;num<sections.length;num++){
                        sections[num].DATA=Number(sections[num].Z).toFixed(2);
                    }

                    // console.error('dataResultTemp', dataResultTemp);
                    var LineColor = ['#0000FF', '#00FF00', '#ff0909', '#FFA500'];
                    var strNote = [{ "name": "断面", "codename": "index", "tableV": "1", "isShow": true, "width": "40%" },
                    { "name": "水位", "codename": "DATA", "tableV": "1", "isShow": true, "width": "40%" }
                    ];
                    //绘制图形
                    chartSW("myCharts", sections, strNote, LineColor, "水位");
                }
                var tm = mini.formatDate(new Date(curTM), 'yyyy年MM月dd日 H时');
                $("#YBTM").html(tm);
                lengthIndex++;
            } else {
                //暂停
                window.clearInterval(t);
                timeout = true;
                lengthIndex = 0
            }
        }
    </script>
    <script type="text/javascript">

        /* 过程线绘制 过程线 水位
         * ChartName画图控件名称
         * dataS数据对象，数据格式json
         * strNote数据说明，数据类型数组，数据格式
         * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示过程线
         * [
         * {"name": "时间","codename": "TM","tableV":"1","isShow":true},
         * {"name": "闸上水位","codename": "UPZ","tableV":"1","isShow":true},
         * {"name": "闸下水位","codename": "DWZ","tableV":"1","isShow":true},
         * {"name": "警戒水位","codename": "WRZ","tableV":"0","isShow":false}
         * ]
         */
        const hexToRgba = (hex, opacity) => {
            let rgbaColor = "";
            let reg = /^#[\da-f]{6}$/i;
            if (reg.test(hex)) {
                rgbaColor = `rgba(${parseInt("0x" + hex.slice(1, 3))},${parseInt(
                    "0x" + hex.slice(3, 5)
                )},${parseInt("0x" + hex.slice(5, 7))},${opacity})`;
            }
            return rgbaColor;
        }
        function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            //myChart.clear();
            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var ShowSelected = {};
            var m = new Array();
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(new Date(value[value1.codename].replaceAll("-","/")).format("MM-dd HH:mm")); //加入时间集合
                        chartTM.push(value[value1.codename]); //加入时间集合
                    } else if (value1.name == "断面") {
                        chartTM.push("断面"+value[value1.codename]); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            //获得最大值最小值
            //var max_min=GetSort(chartValue);
            var option = {
                title: {
                    text: STNM,
                    textStyle: {
                        color: '#000',
                        fontSize: 14,
                        fontWeight: "normal"
                    }
                },
                //backgroundColor: '#100E19',
                noDataLoadingOption: {
                    text: '暂无数据',
                    effect: 'bubble',
                    effectOption: {
                        effect: {
                            n: 0 //气泡个数为0
                        }
                    },
                    textStyle: {
                        fontSize: 30,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show:false,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    },
                    selected: ShowSelected
                    //selected: {
                    //    '警戒水位': false
                    //}

                }, grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: chartTM,
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        name: "水位(m)",
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min:0
                        //    function (value) {
                        //    var jiange = (value.max - value.min).toFixed(2) * 100;
                        //    var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                        //    jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                        //    if ((jiangenew - jiange - 1) == 0) {
                        //        jiangenew = jiangenew * 2;
                        //    }

                        //    if ((jiangenew - jiange) % 2 == 0) {
                        //        return value.min - (jiangenew - jiange) / 200;
                        //    }
                        //    else {
                        //        return value.min - (jiangenew - jiange - 1) / 200;
                        //    }


                        //}
                        ,
                        max: function (item) {
                            return item.max + 0.5;
                        }
                            //function (value) {
                            //var jiange = (value.max - value.min).toFixed(2) * 100;
                            //var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            //jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            //if ((jiangenew - jiange - 1) == 0) {
                            //    jiangenew = jiangenew * 2;
                            //}
                            //if (jiangenew < 5) jiangenew = 5;

                            //if ((jiangenew - jiange) % 2 == 0) {
                            //    return value.max + (jiangenew - jiange) / 200;
                            //}
                            //else {
                            //    return value.max + (jiangenew - jiange + 1) / 200;
                            //}

                            //}
                        ,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0,
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间" || chartName[j] == "断面") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }
                        if (max_min_Name != "" & max_min_Name == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: true,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                smooth: true,
                                areaStyle: {
                                    normal: {
                                        color: new echarts.graphic.LinearGradient(
                                            0,
                                            0,
                                            0,
                                            1,
                                            [{
                                                offset: 0,
                                                color: hexToRgba(LineColor[j - 1], 0.3)
                                            },
                                            {
                                                offset: 1,
                                                color: hexToRgba(LineColor[j - 1], 0.1)
                                            }
                                            ],
                                            false
                                        ),
                                        shadowColor: hexToRgba(LineColor[j - 1], 0.1),
                                        shadowBlur: 10
                                    }
                                },
                                markLine: {
                                    symbol: ['none', 'arrow'], //['none']表示是一条横线；['arrow', 'none']表示线的左边是箭头，右边没右箭头；['none','arrow']表示线的左边没有箭头，右边有箭头
                                    label: {
                                        position: "middle", //将警示值放在哪个位置，三个值“start”,"middle","end" 开始 中点 结束
                                        formatter: function (item) {
                                            return "警戒水位：" + Number(item.value).toFixed(2)+"m";
                                        },
                                        textStyle: {
                                            fontSize: 14,
                                            //fontWeight: "bolder",
                                        },
                                    },
                                    data: [{
                                        silent: false, //鼠标悬停事件 true没有，false有
                                        lineStyle: { //警戒线的样式 ，虚实 颜色
                                            type: "solid", //样式  ‘solid’和'dotted'
                                            color: "orange",
                                            width: 1   //宽度
                                        },
                                        yAxis: 3.80 // 警戒线的标注值，可以有多个yAxis,多条警示线 或者采用 {type : 'average', name: '平均值'}，type值有 max min average，分为最大，最小，平均值
                                    }]
                                },
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: true,
                                smooth: true,
                                
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
            if (m.length == 0) {
                if ($.data(myData, "ChartID") != null) {
                    $("#" + $.data(myData, "ChartID")).show();
                } else {
                    var $li = "";
                    $.data(myData, "ChartID", new Date().format("yyyyMMddHH"));

                    $li = "<div id='" + $.data(myData, "ChartID") + "'>\ <span  class='b threefont' style='letter-spacing:-2px;position: absolute;top: 40%;font-size: 30px;color:#ddd'>暂无数据</span>\ </div>";
                    $('#' + ChartName).append($li);
                }

            } else {
                $("#" + $.data(myData, "ChartID")).hide();
            }

            mini.unmask(document.body);
        }

    </script>
