        $(function () {
            $("#fit2").hide();
            var tm = new Date();
            if (stime == null) {
                stime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
            } else {
                stime = new Date(stime.replaceAll("-", "/")).format("yyyy/MM/dd HH:mm:ss")
            }
            if (etime == null) {
                etime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
            } else {
                etime = formatDate(etime).format("yyyy/MM/dd HH:mm:ss")
            }
            if (formatDate(stime) > formatDate(tm.format("yyyy/MM/dd HH:mm:ss"))) {
                stime = addDayDate(stime, -1) + " 08:00:00"
            }
            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            BreakLayerLoad();
        });

        function btnSearch() {
            $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏

        function BreakLayerLoad() {
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(AddHourDate(endDate, 1));
            //alert(stcd);
            var strWhere = {
                startdate: d1.format("yyyy-MM-dd HH:mm:ss"),
                enddate: d2.format("yyyy-MM-dd HH:mm:ss"),
                stcd: stcd, 
                type: "1",
                plan_n: Solution
            };
            app.post("SWZZ_MODE_ES_ZHANDIANDATA/YBSHUIWEI", strWhere, (data) => {
                JosnSel(data, "Sel")
            })
        }

        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                console.warn(data)
                if (data.total > 0) {
                    //$("#dataShow").hide();
                } else {
                    noData();
                    //$("#Chart").html("<h1 style=\"text-align:center;padding-top:18%;\">暂无数据</h1>");
                    //$("#dataShow").show();
                }
                var tt = data.data.filter(function (e) {
                    return Number(e.DWZ) > 0;
                })
                $.data(myData, "DWZTT", tt.length);
                var ColoumnsName = { "indexcolumn": "序号", "TM": "时间" };
                if (tt.length > 0) {
                    ColoumnsName["UPZ"] = "上游水位(m)@";

                } else {
                    ColoumnsName["UPZ"] = "实测水位(m)@";
                    ColoumnsName["YBZ"] = "预报水位(m)@";
                }
                //ColoumnsName["WRZ"] = "警戒水位(m)";

                SetSummaryColumns(ColoumnsName, grid)

                grid.setData(dataResult.data);

                $("#dataShow").hide();
                $("#dataLoad").hide();

        function noData() {
            $("#maxUpz").html("无");
            $("#maxUpTime").html("无");
            $("#minUpz").html("无");
            $("#minUpTime").html("无");
            $("#maxDown").html("无");
            $("#maxDownTime").html("无");
            $("#minDown").html("无");
            $("#minDownTime").html("无");
        }
        function JsonLineChart(strJson) {
            var strData = "";
            var _XData = [];
            if (strJson.data.length > 0) {
                var SWMAX = -9999, SWMIN = 9999, XYMAX = -9999, XYMIN = 9999;
                var SWMAXTM = "", SWMINTM = "", XYMAXTM = "", XYMINTM = "";
                for (var num = 0; num < strJson.data.length; num++) {
                    if (strJson.data[num].UPZ != "" && strJson.data[num].UPZ != null) {
                        if (SWMAX < parseFloat(strJson.data[num].YBZ)) {
                            SWMAX = parseFloat(strJson.data[num].YBZ).toFixed(2);
                            SWMAXTM = new Date(strJson.data[num].TM).format("MM月dd日HH时");
                        }
                        if (SWMIN > parseFloat(strJson.data[num].YBZ)) {
                            SWMIN = parseFloat(strJson.data[num].YBZ).toFixed(2);
                            SWMINTM = new Date(strJson.data[num].TM).format("MM月dd日HH时");
                        }
                    }
                    if (strJson.data[num].DWZ != "" && strJson.data[num].DWZ != null) {
                        if (XYMAX < parseFloat(strJson.data[num].DWZ)) {
                            XYMAX = parseFloat(strJson.data[num].DWZ).toFixed(2);
                            XYMAXTM = new Date(strJson.data[num].TM).format("MM月dd日HH时");
                        }
                        if (XYMIN > parseFloat(strJson.data[num].DWZ)) {
                            XYMIN = parseFloat(strJson.data[num].DWZ).toFixed(2);
                            XYMINTM = new Date(strJson.data[num].TM).format("MM月dd日HH时");
                        }
                    }
                    var upz = strJson.data[num].UPZ == undefined ? null : Number(strJson.data[num].UPZ).toFixed(2);
                    var dwz = strJson.data[num].DWZ == undefined ? null : Number(strJson.data[num].DWZ).toFixed(2);
                    _XData.push({ TM: new Date(strJson.data[num].TM).format("MM/dd HH:mm"), YBZ: strJson.data[num].YBZ, UPZ: upz, DWZ: dwz, WRZ: strJson.data[num].WRZ, GRZ: strJson.data[num].GRZ });

                }
                GetObj("maxUpz").innerHTML = SWMAX == -9999 ? "-" : SWMAX + "m";
                GetObj("maxUpTime").innerHTML = SWMAXTM;
                GetObj("minUpz").innerHTML = SWMIN == 9999 ? "-" : SWMIN + "m";
                GetObj("minUpTime").innerHTML = SWMINTM;
                GetObj("maxDown").innerHTML = XYMAX == -9999 ? "-" : XYMAX + "m";
                GetObj("maxDownTime").innerHTML = XYMAXTM;
                GetObj("minDown").innerHTML = XYMIN == 9999 ? "-" : XYMIN + "m";
                GetObj("minDownTime").innerHTML = XYMINTM;
            }
            //绘制数据说明
            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            var LineColor = ['#0000FF', '#00FF00', '#ff0909', '#FFA500'];

            if ($.data(myData, "DWZTT") > 0) {
                strNote += ',{"name": "上游水位","codename": "UPZ","tableV":"1","isShow":true,"width":"20%"}';
                strNote += ',{"name": "下游水位","codename": "DWZ","tableV":"1","isShow":true,"width":"20%"}';

                LineColor = ['#0000FF', 'orange', 'red', '#ff0909', '#FFA500'];
            } else {
                strNote += ',{"name": "实测水位","codename": "UPZ","tableV":"1","isShow":true,"width":"20%"}';
                strNote += ',{"name": "预报水位","codename": "YBZ","tableV":"1","isShow":true,"width":"20%"}';

                LineColor = ['orange', 'red', '#00FF00', '#FFA500'];
            }
            //if (stcd == "63201999") {
            //    strNote += ',{"name": "防洪控制水位","codename": "FHKZ","tableV":"1","isShow":true,"width":"20%"}';
            //    strNote += ',{"name": "调水限制水位","codename": "DSXZ","tableV":"1","isShow":true,"width":"20%"}';
            //    strNote += ',{"name": "警戒水位","codename": "WRZ","tableV":"1","isShow":false,"width":"20%"}]';
            //} else if (stcd == "63202211") {
            //    strNote += ',{"name": "警戒水位","codename": "XXSW","tableV":"1","isShow":true,"width":"20%"}]';
            //}
            //else if (stcd == "63202438") {
            //    strNote += ',{"name": "警戒水位","codename": "XXSW","tableV":"1","isShow":true,"width":"20%"}]';
            //} else {
            //    strNote += ',{"name": "警戒水位","codename": "WRZ","tableV":"1","isShow":false,"width":"20%"}]';
            //}
            strNote += ',{"name": "警戒水位","codename": "WRZ","tableV":"1","isShow":false,"width":"20%"}';
            strNote += ',{"name": "保证水位","codename": "GRZ","tableV":"1","isShow":false,"width":"20%"}';
            strNote += ']';
            //绘制过程线颜色设置
            //var jsonData = sortObjectArray(_XData, ['TM'], 'asc');
            var jsonData = _XData;
            $.data(myData, "jsonData", jsonData);
            $.data(myData, "strNote", eval('(' + strNote + ')'));
            $.data(myData, "LineColor", LineColor);
            //绘制图形
            chartSW("Chart", jsonData, eval('(' + strNote + ')'), LineColor, "预报水位");

        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });

        //统计水位
        function onDrawSummaryCell(e) {
            var value = e.value;
            if ($.data(myData, "DWZTT") > 0) {
                if (e.field == "UPZ") {
                    value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">上游最高: " + value + "m</span>" : e.cellHtml = "<span  style=\"color:red;font-weight:bold;\">上游最高: 无</span>";
                }
                if (e.field == "DWZ") {
                    value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">下游最高: " + value + "m</span>" : e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">下游最高: 无</span>";
                }
            } else {
                if (e.field == "UPZ") {
                    value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">水位最高: " + Number(value).toFixed(2) + "m</span>" : e.cellHtml = "<span  style=\"color:red;font-weight:bold;\">水位最高: 无</span>";
                }
            }

        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (Number(row.WRZ) > 0 && Number(row.UPZ) > Number(row.WRZ)) {
                e.cellStyle = "color:#FFA500";
            }
            if (Number(row.GRZ) > 0 && Number(row.UPZ) > Number(row.GRZ)) {
                e.cellStyle = "color:red";
            }
            if (field == "TM") {
                e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
            } else if (field == "WRZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            } else if (field == "UPZ"||field == "DWZ"||field == "YBZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            } 
        }


        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");

                $("#fit2").css("width", "50%");

                $(".fit").hide();
                $("#fit1").show();
                $("#fit2").show();
            } else if (objID == "switch1") {
                $("#" + objFit).css("width", "100%");
                //$("#Chart").css("width", "100%");
                chartSW("Chart", $.data(myData, "jsonData"), $.data(myData, "strNote"), $.data(myData, "LineColor"), "水位");

                $("#" + objFit).show();
            } else {
                $("#" + objFit).css("width", "100%");
                $(".fit").hide();
                $("#" + objFit).show();
            }
            //BreakLayerLoad();
        }

    <script type="text/javascript">

        /* 过程线绘制 过程线 水位
         * ChartName画图控件名称
         * dataS数据对象，数据格式json
         * strNote数据说明，数据类型数组，数据格式
         * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示过程线
         * [
         * {"name": "时间","codename": "TM","tableV":"1","isShow":true},
         * {"name": "闸上水位","codename": "UPZ","tableV":"1","isShow":true},
         * {"name": "闸下水位","codename": "DWZ","tableV":"1","isShow":true},
         * {"name": "警戒水位","codename": "WRZ","tableV":"0","isShow":false}
         * ]
         */
        function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var ShowSelected = {};
            var m = new Array();
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(new Date(value[value1.codename].replaceAll("-","/")).format("MM-dd HH:mm")); //加入时间集合
                        chartTM.push(value[value1.codename]); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            //获得最大值最小值
            //var max_min=GetSort(chartValue);
            var option = {
                //backgroundColor: '#100E19',
                noDataLoadingOption: {
                    text: '暂无数据',
                    effect: 'bubble',
                    effectOption: {
                        effect: {
                            n: 0 //气泡个数为0
                        }
                    },
                    textStyle: {
                        fontSize: 30,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    //showDelay: 0,
                    //hideDelay: 50,
                    //transitionDuration: 0,
                    //backgroundColor: 'rgba(255,255,255,0.9)',
                    //borderColor: '#4040FB',
                    //borderRadius: 8,
                    //borderWidth: 2,
                    //padding: 10,
                    //textStyle: {
                    //    color: '#000000'
                    //},
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#fff',
                        fontSize: 12
                    },
                    selected: ShowSelected
                    //selected: {
                    //    '警戒水位': false
                    //}

                }, grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: chartTM,
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        name: "预报水位(m)",
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#1B2B2F',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 200;
                            }


                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 200;
                            }

                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            },
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0,
                            },
