    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var stcd = GetQueryString("stcd");
        var stnm = GetQueryString("stnm");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        var PLAN_N = GetQueryString("PLAN_N");
        var dm_id = GetQueryString("dm_id");
        var typeName = GetQueryString("typeName");
        var strPathName = GetQueryString("strPathName");
        var _taskID=GetQueryString("taskID");
        var tabs = mini.get("tabs1");
        var danwei = "mg/L";
        if (typeName == "水位") {
            danwei = "m";
        } else if (typeName == "流量") {
            danwei = "m³/s";
        }
        var grid = mini.get("grid1");
        $(function () {
            var tab = { title: "河道水位线", url: 'YBRiver.html?stcd=' + stcd +"&stnm="+stnm+ "&PLAN_N=" + PLAN_N + "&stime=" + stime + "&etime=" + etime };
            tabs.addTab(tab);
            grid.set({
                columns: [
                    { type: "indexcolumn" },
                    { field: "TM", width: 120, headerAlign: "center", align: "center", allowSort: true, header: "时间" },
                    { field: "DATA", width: 100, headerAlign: "center", align: "center", allowSort: true, header: typeName + "(" + danwei + ")", summaryType: "max" },
                ]
            });

            $("#fit2").hide();
            mini.get("STIME").setValue(stime);
            $.data(myData, "DATA_NAME", typeName);
            BreakLayerLoad();
        });
        function getModeResult(){
            return $.data(myData,"modeResultData");
        }
        function btnSearch() {
            $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
            BreakLayerLoad();
        }

        function BreakLayerLoad() {
            var hID=parseInt(stcd);
            modeGetResultModelsByTimePeriod(stime,etime,_taskID,[hID]);
        }

        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var tempJson = mini.decode(data.data);
                dataResult = { data: tempJson.data, total: tempJson.data.length };
                if (data.total > 0) {
                    //$("#dataShow").hide();
                } else {
                    noData();
                    //$("#Chart").html("<h1 style=\"text-align:center;padding-top:18%;\">暂无数据</h1>");
                    //$("#dataShow").show();
                }
                JsonLineChart(dataResult);
                grid.setData(dataResult.data);
                //fillData(0, grid.getPageSize(), dataResult, grid);
                $("#dataShow").hide();
                $("#dataLoad").hide();
            }
            else if (typeID == "GetResultModelsByTimePeriod") {
                var tempJson = data.data;
                $.data(myData,"modeResultData",data);
                var dataNew=[];
                for(var num=0;num<tempJson.length;num++){
                    var objid=tempJson[num].id;
                    var results=tempJson[num].results;
                    var sections=results[stcd].sections;
                    var zvalue=Number( sections[dm_id].Z).toFixed(2);
                    var tm=new Date(objid.time).format("yyyy-MM-dd HH:mm:ss");
                    var item={
                        TM:tm,
                        DATA:zvalue
                    }
                    dataNew.push(item);
                }
                console.error('dataNew',dataNew);
                dataResult = { data: dataNew, total:dataNew.length };
                if (data.total > 0) {
                } else {
                    noData();
                }
                JsonLineChart(dataResult);
                grid.setData(dataResult.data);
                $("#dataShow").hide();
                $("#dataLoad").hide();
            }
        }
        function noData() {
            $("#maxUpz").html("无");
            $("#maxUpTime").html("无");
            $("#minUpz").html("无");
            $("#minUpTime").html("无");
            $("#maxDown").html("无");
            $("#maxDownTime").html("无");
            $("#minDown").html("无");
            $("#minDownTime").html("无");
        }
        function JsonLineChart(strJson) {
            var strData = "";
            var _XData = [];
            if (strJson.data.length > 0) {
                var SWMAX = -9999, SWMIN = 9999, XYMAX = -9999, XYMIN = 9999;
                var SWMAXTM = "", SWMINTM = "", XYMAXTM = "", XYMINTM = "";
                for (num = 0; num < strJson.data.length; num++) {
                    if (strJson.data[num].DATA != "" && strJson.data[num].DATA != null) {
                        if (SWMAX < parseFloat(strJson.data[num].DATA)) {
                            SWMAX = parseFloat(strJson.data[num].DATA).toFixed(2);
                            SWMAXTM = new Date(strJson.data[num].TM).format("MM-dd HH:mm");
                        }
                        if (SWMIN > parseFloat(strJson.data[num].DATA)) {
                            SWMIN = parseFloat(strJson.data[num].DATA).toFixed(2);
                            SWMAXTM = new Date(strJson.data[num].TM).format("MM-dd HH:mm");
                        }
                    }
                    _XData.push({ TM: new Date(strJson.data[num].TM).format("MM-dd HH:mm"), DATA: strJson.data[num].DATA });
                }
                //console.log(JSON.stringify(_XData));
                //alert(SWMAX);
                //GetObj("maxUpz").innerHTML = SWMAX == -9999 ? "-" : SWMAX + "m";
                //GetObj("maxUpTime").innerHTML = SWMAXTM;
                //GetObj("minUpz").innerHTML = SWMIN == 9999 ? "-" : SWMIN + "m";
                //GetObj("minUpTime").innerHTML = SWMINTM;
                GetObj("maxDown").innerHTML = SWMAX == -9999 ? "-" : SWMAX + danwei;
                GetObj("maxDownTime").innerHTML = SWMAXTM;
                GetObj("minDown").innerHTML = SWMIN == 9999 ? "-" : SWMIN + danwei;
                GetObj("minDownTime").innerHTML = SWMAXTM;
            }

            //绘制数据说明
            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            strNote += ',{"name": "' + typeName + '","codename": "DATA","tableV":"1","isShow":true,"width":"30%"}';
            strNote += ']';
            //绘制过程线颜色设置
            var LineColor = ['blue', '#FF0000', '#0000FF', '#00FF00', '#FFA500'];
            //绘制图形
            chartSW("Chart", _XData, eval('(' + strNote + ')'), LineColor, typeName + "(" + danwei + ")");

        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        //grid.on("beforeload", function (e) {
        //    e.cancel = true;
        //    var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
        //    fillData(pageIndex, pageSize, dataResult, grid);
        //});

        //统计水位
        function onDrawSummaryCell(e) {
            var value = e.value;
            //if (e.field == "UPZ") {
            //    value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">" + $.data(myData, "DATA_NAME")+"最大数据: " + value + "m</span>" : e.cellHtml = "<span  style=\"color:red;font-weight:bold;\">实时最高水位: 无</span>";
            //}
            if (e.field == "DATA") {
                value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">" + $.data(myData, "DATA_NAME") + "最大数据: " + value + "</span>" : e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">" + $.data(myData, "DATA_NAME") + "最大数据: 无</span>";
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (Number(row.WRZ) > 0 && Number(row.DATA) > Number(row.WRZ)) {
                e.cellStyle = "color:#FFA500";
            }
            if (Number(row.GRZ) > 0 && Number(row.DATA) > Number(row.GRZ)) {
                e.cellStyle = "color:red";
            }
            if (field == "TM") {
                e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
            }
        }


        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            //$(".fit").css("display", "none");
            //$("#" + objFit).css("display", "block");
            $(".fit").hide();
            $("#" + objFit).show();
        }

    </script>
