        function transferToNumber(inputNumber) {
                if (isNaN(inputNumber)) {
                    return inputNumber
                }
                inputNumber = '' + inputNumber
                inputNumber = parseFloat(inputNumber)
                let eformat = inputNumber.toExponential() // 转换为标准的科学计数法形式（字符串）
                let tmpArray = eformat.match(/\d(?:\.(\d*))?e([+-]\d+)/) // 分离出小数值和指数值
                let number = inputNumber.toFixed(Math.max(0, (tmpArray[1] || '').length - tmpArray[2]))
                return number
            }

        //根据风速风向计算增水
        function getZSValue(item,WindSpeed) {
            var yValue = 0;
            if (item.FTYPE == "noe") {
                yValue = Math.pow(WindSpeed, 2) * item.WINDSQUAREXS;
                if (item.WINDXS > 0) {
                    yValue = yValue + WindSpeed * item.WINDXS;
                } else {
                    yValue = yValue - WindSpeed * item.WINDXS;
                }
                if (item.CONSTANT > 0) {
                    yValue = yValue + item.CONSTANT;
                }
                else {
                    yValue = yValue - Math.abs(item.CONSTANT);
                }
            }
            else if (item.FTYPE == "e") {
                var eNum = 2.718281828459045;
                yValue = item.WINDSQUAREXS * Math.pow(eNum, item.WINDXS * WindSpeed);
            }
            return yValue;
        }
