        function transferToNumber(inputNumber) {
                if (isNaN(inputNumber)) {
                    return inputNumber
                }
                inputNumber = '' + inputNumber
                inputNumber = parseFloat(inputNumber)
                let eformat = inputNumber.toExponential() // 转换为标准的科学计数法形式（字符串）
                let tmpArray = eformat.match(/\d(?:\.(\d*))?e([+-]\d+)/) // 分离出小数值和指数值
                let number = inputNumber.toFixed(Math.max(0, (tmpArray[1] || '').length - tmpArray[2]))
                return number
            }

        //根据风速风向计算增水
        function getZSValue(item,WindSpeed) {
            var yValue = 0;
            if (item.ftype == "noe") {
                yValue = Math.pow(WindSpeed, 2) * item.windsquarexs;
                if (item.windxs > 0) {
                    yValue = yValue + WindSpeed * item.windxs;
                } else {
                    yValue = yValue - WindSpeed * Math.abs(item.windxs);
                }
                if (item.constant > 0) {
                    yValue = yValue + item.constant;
                }
                else {
                    yValue = yValue - Math.abs(item.constant);
                }
            }
            else if (item.ftype == "e") {
                var eNum = 2.718281828459045;
                yValue = item.windsquarexs * Math.pow(eNum, item.windxs * WindSpeed);
            }
            return yValue;
        }
        function bindData() {
                resultData = $.data(myData, "winddata");

                var fdataTemp = fdata.filter(function (res) {
                    return res.type == mini.get("PPTM").getValue()
                    &&(res.stcd==mini.get('STCD').getValue()||res.stcd==gstcd);
                });
                var flfxdata = [], flfxDataNew = [], xflfxDataNew = [];
                for (var num = 0; num < resultData.length; num++) {
                    resultData[num].WINDDIRNAME = getDirName(resultData[num].winddir);//+ "(" + resultData[num].WINDDIR+")";
                    resultData[num].WINDDIRYNM = getDirYName(resultData[num].winddir);
                    resultData[num].BPRESSURE = (resultData[num].pressure).toFixed(1);

                    var TM = new Date(new Date(resultData[num].tm)).format("MM-dd HH:mm");
                    var R = resultData[num].winddir / 360 * Math.PI;
                    var item = [TM, resultData[num].wind, resultData[num].WINDDIRYNM, R, resultData[num].winddir];
                    flfxdata.push(item);
                    xflfxDataNew.push(TM);
                    var WindDirName = resultData[num].WINDDIRNAME;//风向中文名称
                    var WindSpeed = resultData[num].wind;//风速
                    var fdataTempT = fdataTemp.filter(function (res) {
                        return res.winddir == WindDirName + "风";
                    });
                    var WindZS = getZSValue(fdataTempT[0], WindSpeed);//增水
                    if(gstcd!=undefined){//需要用与其他站点的关系式
                        //一直y,求得x         y=1.0074x-0.4821
                        var gfdataTempT = fdata.filter(function (res) {
                            return res.stcd == mini.get('STCD').getValue();
                        });
                        var gCONSTANT = gfdataTempT[0].constant;//常数
                        var gWINDXS = gfdataTempT[0].windxs;//系数
                        WindZS=gCONSTANT>0?WindZS-gCONSTANT:WindZS+Math.abs(gCONSTANT);
                        WindZS=WindZS/gWINDXS;
                        // console.error(gstcd,WindZS);
                    }
                    //WindZS=(WindZS * 100).toFixed(1);//米转厘米
                    WindZS=Number(WindZS).toFixed(2);
                    item = {
                        "TimePoint": TM,
                        "WindDir": resultData[num].winddir,
                        "WindSpeed": WindSpeed,
                        "WindDirName": WindDirName,
                        "WindZS": WindZS
                    }
                    resultData[num].WINDZS =WindZS;
                    // console.error(resultData[num].WINDDIRNAME, fdataTempT, WindZS);
                    flfxDataNew.push(item);
                }
                //console.error(flfxDataNew);
                //绘制图形
                $.data(myData,"ZSData",resultData);
                chartFLFXNew("JY_charts", flfxDataNew, xflfxDataNew);
                getInfo();
            }

        const hexToRgba = (hex, opacity) => {
            let rgbaColor = "";
            let reg = /^#[\da-f]{6}$/i;
            if (reg.test(hex)) {
                rgbaColor = `rgba(${parseInt("0x" + hex.slice(1, 3))},${parseInt(
                    "0x" + hex.slice(3, 5)
                )},${parseInt("0x" + hex.slice(5, 7))},${opacity})`;
            }
            return rgbaColor;
        }
        function getDirName(degrees) {
            var directArrOne = ["北", "东北", "东", "东南", "南", "西南", "西", "西北"];
            var dirname = "";
            var index = 0;
            if (337.5 <= degrees && degrees <= 360) {
                index = 0;
            }
            else if (0 <= degrees && degrees <= 22.5) {
                index = 0;
            }
            else if (degrees >= 22.5 && degrees <= 67.5) {
                index = 1;
            }
            else if (degrees >= 67.5 && degrees <= 112.5) {
                index = 2;
            }
            else if (degrees >= 112.5 && degrees <= 157.5) {
                index = 3;
            }
            else if (degrees >= 157.5 && degrees <= 202.5) {
                index = 4;
            }
            else if (degrees >= 202.5 && degrees <= 247.5) {
                index = 5;
            }
            else if (degrees >= 247.5 && degrees <= 292.5) {
                index = 6;
            }
            else if (degrees >= 292.5 && degrees <= 337.5) {
                index = 7;
            }
            dirname = directArrOne[index];
            return dirname;
        }
