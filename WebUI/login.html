<script type="text/javascript">
    var strID = GetQueryString("APPID");

    $(".ip3").click(function () {

            //SetCookie('pwd', pwd.value, 7); //保存密码到cookie，有效期7天
            //}
        }
    });

    var myData = [];
    onload = function () {
        username.focus();
        username.select();
        var AppID = GetQueryString("APPID");
        $.data(myData, "APPID", AppID);
        username.onkeydown = function (ev) {
            var e = ev || window.event;
            if (e.keyCode == 13) {
                keyOK();
            }
        }

        pwd.onkeydown = function (ev) {
            var e = ev || window.event;
            if (e.keyCode == 13) {
                keyOK();
            }
        }

        if (GetCookie('username') && GetCookie('pwd')) {
            username.value = GetCookie('username');
            pwd.value = GetCookie('pwd');
            //remember.checked = true;
        }
    }

    function isOK() {
        if (username.value == "") {
            alert("请输入用户名");
            username.focus();
            username.select();
            return false;
        } else if (pwd.value == "") {
            alert("请输入密码");
            pwd.focus();
            pwd.select();
            return false;
        } else {
            var postParam = { "qx_LOGIN": username.value, "qx_PASSWORD": hex_md5(pwd.value), "platform": "PC" };
            $.data(myData, "QX_LOGIN", username.value);
            $.data(myData, "QX_PASSWORD", pwd.value);
            app.post("SWZZ_DATA_employee/LOGINSel", postParam,(data)=>{
				//console.log(data);
				JosnSel(data,"Login");
			});
        }

    }

    function keyOK() {
        if (username.value == "") {
            alert("请输入用户名");

            return false;
        } else if (pwd.value == "") {

            pwd.select();
            return false;
        } else {
            var postParam = { "qx_LOGIN": username.value, "qx_PASSWORD": hex_md5(pwd.value), "platform": "PC" };
            $.data(myData, "QX_LOGIN", username.value);
            $.data(myData, "QX_PASSWORD", pwd.value);
            GetJosns("LOGINSel", postParam, "Login");
        }

    }

				})
                if (resultdata.data.length > 0) {
                    alert("用户名或密码错误，请重新输入");
                } else {
                    alert("用户名无权限或未获取用户信息，请重新输入");
                    window.location.href = 'login.html';
                }
                pwd.value = ""
                pwd.focus();
                pwd.select();
            }
        } else if (typeID == "DATA_MENU_LOGAdd") {
            window.location.href = "index.html?rid=" + Math.random();
        } else if (typeID == "") {

        }
    }
    function isCancel() {
        pwd.value = "";
        username.value = "";
        username.focus();
        username.select();
    }


    function IEVersion() {
        var userAgent = navigator.userAgent; //取得浏览器的userAgent字符串
        var isIE = userAgent.indexOf("compatible") > -1 && userAgent.indexOf("MSIE") > -1; //判断是否IE<11浏览器
        var isEdge = userAgent.indexOf("Edge") > -1 && !isIE; //判断是否IE的Edge浏览器
        var isIE11 = userAgent.indexOf('Trident') > -1 && userAgent.indexOf("rv:11.0") > -1;
        if (isIE) {
            var reIE = new RegExp("MSIE (\\d+\\.\\d+);");
            reIE.test(userAgent);
            var fIEVersion = parseFloat(RegExp["$1"]);
            if (fIEVersion == 7) {
                return 7;
            } else if (fIEVersion == 8) {
                return 8;
            } else if (fIEVersion == 9) {
                return 9;
            } else if (fIEVersion == 10) {
                return 10;
            } else {
                return 6;//IE版本<=7
            }
        } else if (isEdge) {
            return 'edge';//edge
        } else if (isIE11) {
            return 11; //IE11
        } else {
            return -1;//不是ie浏览器
        }
    }
