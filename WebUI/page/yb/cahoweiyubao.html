        function loadZS(objPathName) {
            var data = LCGdata;

                data = WSKdata;
            } else if (objPathName == "金山嘴") {
                data = JSZdata;
            } else if (objPathName == "高桥") {
                data = GQdata;
            } else if (objPathName == "芦潮港") {
                data = LCGdata;
            }
            var tm = [], _XData = [], ydata = [], ydataMAX = [], ydataMIN = [];
            for (var num = 0; num < data.length; num++) {
                var item = data[num]
                var TM = new Date(item["tm"]).format("MM-dd HH:mm");
                var UPZ = item.upz == undefined ? null : Number(item.upz / 100).toFixed(2);
                var MAX = item.upz == undefined ? null : Number(item.upz / 100 + 0.1).toFixed(2);
                var MIN = item.upz == undefined ? null : Number(item.upz / 100 - 0.1).toFixed(2);
                tm.push(TM);
                ydata.push(UPZ);
                ydataMAX.push(MAX);
                ydataMIN.push(MIN);
            }
            chartCW("JY_charts", tm, ydata, ydataMAX, ydataMIN,objPathName);

        }

                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 30;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 30;
                            }
