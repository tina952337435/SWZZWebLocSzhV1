<!DOCTYPE html>

<head>

    <meta name="keywords" content="上海市水文预报调度一体化平台（一期）" />

        .progressTime {
            width: 88%;
        }
        .mini-button-inner {
            padding: 2px 5px;
        }
    </style>
</head>
<body>
    <div class="flex" style="width: 100%; height: 100%; overflow: hidden;">
        <!--<div class="biaoheader">
        <p class="NONEp">
        </p>
        条件选择</div>-->
        <div class="right box" style="height: 45px;">
            <div class="demo1" style="float: left;width:100%;">
                <div class="inline">
                    <div style="width: 100%; height: 35px; float: left;">
                        方案选择：&nbsp;
                        <input id="STCD" name="STCD" class="mini-combobox" style="width: 180px;"
                                           textfield="DD_NAME" valuefield="DD_ID" allowinput="true" onvaluechanged="onSTCDChanged" />
                        <a class="mini-button" onclick="OpenHref()" style="width:60px;">报表</a>
                    </div>

                </div>
            </div>
        </div> 

        <div class="biaoheader">
            <p class="NONEp">
            </p>
            预报流量<span class="dwCss">(单位:m³/s)</span>&nbsp;&nbsp;&nbsp;
            <!--<input id="thsq" name="thsq" class="mini-checkbox" checked="false" onvaluechanged="onValueChanged" />周边水情-->
            <img title="导出表格" src="../../arcgis_js_api/myJs/images/excel.png" onclick="ExportExcel('预报流量')" style="position: relative;
                top: 5px; right: 15px; float: right; cursor: pointer;" />
        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 99%; height: 100%; margin: auto;"
             showpager="false" idfield="STCD" allowresize="false" allowalternating="true"  
              pagesize="50" ondrawcell="ondrawcell" onselectionchanged="onSelectionChanged" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
            <div property="columns">
                <div field="STNM" width="80" align="center" headeralign="center">
                    站名
                </div>
                <div field="DATA" width="80" align="center" headeralign="center">
                    流量
                </div>
                <!--<div field="ANGLE" width="130" align="center" headeralign="center" >
        角度
    </div>-->
            </div>
        </div>
    </div>

    <script type="text/javascript">
        ShowPage(); //map页面会调用
        function ShowPage() {
            //openTL("mxbztl");
        }

        mini.parse();
        var grid = mini.get("grid1"); 
        var myData = [];
        var mydt = [];
        var resultData = [];
        $(function () { 
            GetJosns("MODE_DD_SOLUTIONSel", { "DD_STATUS": "1" }, "STCD");
        })
        function onSTCDChanged(e) {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            $.data(myData, "DD_ID", nodes.DD_ID);
            var stime = AddHourDate(new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"), 1);
            $.data(myData, "STM", stime);
            //$.data(myData, "STM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
            $.data(myData, "TM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
            $.data(myData, "ETM", new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy/MM/dd HH:mm:ss"));
           
            search();
        }
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });

            var s_where = { "SolutionID": $.data(myData, "DD_ID"), "typeID": "2,7,8",TM: $.data(myData, "STM")};
            GetJosns("YBList", s_where, "Sel");
        }
        function JosnSel(ResultData, typeID) {
            if (typeID == "Sel") {
                var tempData = ResultData.data;
                mydt = tempData;
                window.parent.YBClick($.data(myData, "STM"), $.data(myData, "ETM"));
                
                //加载全部
                s_where = { "SolutionID": $.data(myData, "DD_ID"), "typeID": "2,7,8" };
                GetJosns("YBList", s_where, "SelAll");
            } else if (typeID == "SelAll") {
                var tempData = ResultData.data;
                mydt = tempData;
            }
            else if (typeID == "STCD") {
                mini.get("STCD").setData(ResultData.data);
                mini.get("STCD").select(0);
                var _stcd = mini.get("STCD");
                var nodes = _stcd.getSelected();
                $.data(myData, "DD_ID", nodes.DD_ID);
                var stime = AddHourDate(new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"), 1);
                $.data(myData, "STM", stime);
                $.data(myData, "TM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
                $.data(myData, "ETM", new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy/MM/dd HH:mm:ss"));
                GetJosns("MODE_ES_SLTONGJISel", { TYPE: "0" }, "MODE_ES_SLTONGJISel");
            } else if (typeID == "MODE_ES_SLTONGJISel") {
                var stcds = "";
                var arr = ResultData.data.filter(function (item) {
                    return item.TITLE == "首页流量工程展示";
                });
                if (arr.length > 0) {
                    stcds = arr[0].STCD;
                }
                $.data(myData, "STCDS", stcds);
                setTimeout(function () {
                    search();
                }, 500);
            }
        }
        function gridLoad() {
            var stcds = $.data(myData, "STCDS");
            var result = mydt.filter(function (e) {
                return new Date(convertToDate(e.TM)).format("yyyy/MM/dd HH:mm:ss") == new Date($.data(myData, "TM")).format("yyyy/MM/dd HH:mm:ss");
            });
            resultData = result;
            getInfo();
            tlCount();
        }


        var kbCount = 0;
        var gbCount = 0;
        function getInfo() {
            if (resultData == null)
                return;
            dt = new Array();
            psCount = 0;
            ysCount = 0;
            gzCount = 0;
            var value1 = getTLObj("mxcb_b0").checked;
            var value2 = getTLObj("mxcb_b1").checked;
            for (var i = 0; i < resultData.length; i++) {
                resultData[i].TM = new Date(convertToDate(resultData[i].TM)).format("yyyy-MM-dd HH:mm:ss");
                if (resultData[i].STNM != undefined) {
                    if (resultData[i].STNM.indexOf("水库") > -1) {
                        continue;
                    }
                }
                var z = parseFloat(resultData[i].DATA); 
                if (Math.abs(z) >0) {
                    kbCount++;
                    if (value1) {
                        dt.push(resultData[i]);
                    }
                }
                else{
                    gbCount++;
                    if (value2) {
                        dt.push(resultData[i]);
                    }
                }
            }
            tableBind(dt);
            addMark(dt);
        }
        function tableBind(data) {
            var dataResult = data;
            grid.setData(dataResult);
            grid.mergeColumns(["TYPE", "company"]);
        }

        function tlCount() {
            getTLObj("mxb0Count").innerHTML = kbCount;
            getTLObj("mxb1Count").innerHTML = gbCount;

            mini.unmask(document.body);
        }
        function tlChecked() {
            getInfo();
        }
        function GetMap(startDate, objSTCD) {
            var _GlobalTab = window.parent.tabs.getActiveTab();
            var _url = _GlobalTab.url;
            if (_url.lastIndexOf("ybll.html") > -1) {
                $.data(myData, "TM", new Date(startDate).format("yyyy/MM/dd HH:mm:ss"));
                window.parent.showJCTips($.data(myData, "TM"));
                gridLoad();
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            var record = e.record;
            var s;
         if (field == "STNM") {
                var sColor = "";
                if (row.YBZ == null) {
                    sColor = "style='color:#EAEAEA'";
                }
             e.cellHtml = '<a title="' + value + '" ' + sColor + '  href="JavaScript:Trans(\'' + record.STCD + '\',\'' + record.STNM + '\',\'' + record.DATATYPE + '\')">' + value + '</a>';
         }
        }
        function onTMRenderer(e) {
            var value = e.value;
            if (value) {
                return mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
            }
            else {
                return "";
            }
        }
        function Trans(stcd, stnm,datatype) {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            var stime = new Date(convertToDate(nodes.DD_TM)).format("yyyy-MM-dd HH:mm:ss");
            var etime = new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy-MM-dd HH:mm:ss");
            var ZU_ID = nodes.DD_MIND;
            openChart("/DanZhan/YBLLLine.html?stcd=" + stcd + "&stnm=" + (stnm) + "&stime=" + stime + "&etime=" + etime + "&PLAN_N=" + nodes.DD_ID + "&ZU_ID=" + ZU_ID + "&datatype=" + datatype, stnm + "预测流量过程线", stcd, "");
        }
        function onSelectionChanged(e) {
            var grid = e.sender;
            var record = grid.getSelected();
            if (record) {
                loc(record.LGTD, record.LTTD);
            }
        }
        function loc(lgtd, lttd) {
            if (lgtd == undefined && lttd == undefined) {
                mini.alert("缺失经纬度");
            } else {
                dyCenter(lgtd, lttd);
            }
        }
        function OpenHref() {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            window.parent.window.parent.OpenTab("", "调度方案详细信息", "/DD_MX/ResultsRelease.html?ID=" + nodes.ID + "&DD_ID=" + nodes.DD_ID + "&FA_ID=" + nodes.DD_EVALUE + "&stime=" + $.data(myData, "STM") + "&etime=" + $.data(myData, "ETM") + "&key=&type=list");
        }
    </script>
</body>
</html>
