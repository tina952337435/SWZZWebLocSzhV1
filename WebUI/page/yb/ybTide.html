<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="../../Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="../../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../../Common/Scripts/ChartJs.js" type="text/javascript"></script>

            .onlytab li {
                list-style: none;

                width: 100px !important;

</head>
<body  class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar">
            预报时间：<input id="STIME" class="mini-datepicker" style="width:110px;" showtime="false" format="yyyy-MM-dd" onvaluechanged="onvaluechanged" />
            <ul class="onlytab" id="onlytab2" style="">
                <li id="TitleLi08" onclick="OnClickTitle2(this.id,'08')" class="onlyli start" style="width: 60px !important;">8时</li>
                <li id="TitleLi20" onclick="OnClickTitle2(this.id,'20')" class="onlyli end" style="width: 60px !important;">20时</li>
            </ul>
            <!--<ul class="onlytab" id="onlytab" style="left:320px;width:180px !important;">
        <li id="10001010" onclick="OnClickTitle(this.id,'温带风暴潮')" class="onlyli onlyliHover start" style="width: 90px !important;">温带风暴潮</li>
        <li id="10001011" onclick="OnClickTitle(this.id,'台风风暴潮')" class="onlyli end" style="width: 90px !important;">台风风暴潮</li>
    </ul>-->

            <!--&nbsp;&nbsp;<button type="button" class="btn btn-info" onclick="lookPhoto()">查看原图</button>-->

        </div>
    </div>
    <div id="JY_charts" style="height:350px;width:90%;margin:0px auto;background:white;">

    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 405px);height: -moz-calc(100% - 405px);height: calc(100% - 405px);" allowalternating="true"
         borderstyle="border-right:0;" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div field="tm" width="60" align="center" headeralign="center" allowsort="false">时间</div>
            <div field="tdz" width="120" align="center" headeralign="center" allowsort="false"  decimalPlaces="2" dataType="float">风暴潮(m)</div>
        </div>
    </div>
    <script>
        mini.parse();
        var myData = [];
        var resultData = [];
        //实例化表格对象
        var grid = mini.get("grid1");
        window.onload = function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            $.data(myData, "TYPE", "温带风暴潮");
            $.data(myData, "STCD","10001010");
            A_PathName = "国家海洋潮位预报";
            //var s_where = {"TBA_INFOTYPE": A_PathName };
            //GetQXJosns("DATA_TBA_WEACONTENTSel", s_where, "YBSel");

            var s_where = {
                pagesize: 1,
                pageindex: 1,
                stcd: $.data(myData, "STCD")
            };
            //GetJosns("DATA_ST_TIDE_RYBSel", s_where, "SelDate");
			app.post("SWZZ_QXSJ_st_tide_ryb/findResult",s_where,(data)=>{
				JosnSel(data,"SelDate")
			});
        };
        function BreakLayerLoad() {
            var YBTM = mini.get("STIME").getFormValue() + " " + $.data(myData, "HOUR")+":00:00";
            var s_where = { kid1: YBTM,kid2: YBTM, stcd: $.data(myData, "STCD") };
            //GetJosns("DATA_ST_TIDE_RYBSel", s_where, "Sel");
			app.post("SWZZ_QXSJ_st_tide_ryb/findResult",s_where,(data)=>{
				JosnSel(data,"Sel")
			})
        }
        function JosnSel(data, typeID) {
            if (typeID == "YBSel") {
                var TM = new Date(convertToDate(data.data[0].TBA_DESDATE)).format("yyyy-MM-dd HH:mm:ss");
                var HOUR = new Date(convertToDate(data.data[0].TBA_DESDATE)).format("HH");
                $.data(myData, "HOUR", HOUR);
                var objID = "TitleLi" + HOUR;
                $("#onlytab2 .onlyli").removeClass("onlyliHover");
                $("#" + objID).addClass("onlyliHover");
                mini.get("STIME").setValue(TM);
                $.data(myData, "YBTM", TM);
                BreakLayerLoad();
            }
            else if (typeID == "SelDate") {
                console.error(new Date(data.data[0].ybtm).format("yyyy-MM-dd HH:mm:ss"));
                var TM = new Date(data.data[0].ybtm).format("yyyy-MM-dd HH:mm:ss");
                var HOUR = new Date(data.data[0].ybtm).format("HH");
                $.data(myData, "HOUR", HOUR);
                var objID = "TitleLi" + HOUR;
                $("#onlytab2 .onlyli").removeClass("onlyliHover");
                $("#" + objID).addClass("onlyliHover");
                mini.get("STIME").setValue(TM);
                $.data(myData, "YBTM", TM);
                BreakLayerLoad();
            }
            else if (typeID == "Sel") {
                resultData = data.data;
				resultData.sort((a,b)=>{
                    a.tdz=Number( a.tdz).toFixed(2);
					return new Date(a.tm).getTime() - new Date(b.tm).getTime();
				})
                //绘制过程线颜色设置
                var LineColor = ["#8B5CFF"];
                var strNote = [];
                var item = { "name": "时间", "codename": "tm", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                item = { "name": "风暴潮", "codename": "tdz", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                //绘制图形
                chartLL("JY_charts", resultData, strNote, LineColor, "风暴潮(m)");
                getInfo();
            } else if (typeID == "SelExcel") {
                // var Hour = $.data(myData, "HOUR");
                // var TM = new Date(mini.get("STIME").getFormValue()).format("yyyy年M月d日");
                // var name = TM + Hour + "时温带风暴潮";
                // var columns = grid.columns;
                // var datas = mini.decode(data.data);
                // ExportExcel(name, columns, datas);
				window.open(HuishuiApiUrl + "upLoad/" + data.data);
            }
        }
        function getInfo() {
            tableBind(resultData);
        }
        function tableBind(data) {
            var dataResult = data;
            grid.setData(dataResult);
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "tm") {
                e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm");
            }
        }
        function onvaluechanged(e) {
            BreakLayerLoad();
        }
        function Exp() {
            var Hour = $.data(myData, "HOUR");
            var TM = mini.get("STIME").getFormValue() + " " + Hour + ":00:00";
            //GetJosns("DATA_ST_TIDE_RYBExcel", { "YBTM": TM,STCD: $.data(myData, "STCD")}, "SelExcel");
			var Hour = $.data(myData, "HOUR");
			var TM = new Date(mini.get("STIME").getFormValue()).format("yyyy年M月d日");
			var name = TM + Hour + "时温带风暴潮";
			var objJson = JSON.stringify(grid.getData());
			// console.log(objJson);
			// app.post("excelOperation/writeExcelServlet/swzzqxsj.St_tide_rybPojo",{ojbList:objJson,filename:name},(data)=>{
			// 	JosnSel(data,"SelExcel");
            // });

            var data = grid.data;
            ExportExcel(data, grid, name);
            
        }
        function lookPhoto() {
            var Hour = $.data(myData, "HOUR");
            var TM = mini.get("STIME").getFormValue() + " " + Hour + ":00:00";
            var imgUrl = HttpUrl + new Date(TM).format("yyyyMMdd") + "/" + new Date(TM).format("yyyyMMddHH") + "_qgq.png";
            var url = "/ImgPic.html?URL=" + imgUrl;
            lookData("温带风暴潮原图", url, "温带风暴潮原图", "80%", "70%", "true");
        }
        function OnClickTitle(objID, objPathName) {//选择类型
            var only = $("#onlytab .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $.data(myData, "STCD", objID);
            $('#dataLoad').show();
            BreakLayerLoad();
        }
        function OnClickTitle2(objID, objPathName) {//选择类型
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $.data(myData, "HOUR", objPathName);
            $('#dataLoad').show();
            BreakLayerLoad();
        }
        const hexToRgba = (hex, opacity) => {
            let rgbaColor = "";
            let reg = /^#[\da-f]{6}$/i;
            if (reg.test(hex)) {
                rgbaColor = `rgba(${parseInt("0x" + hex.slice(1, 3))},${parseInt(
                    "0x" + hex.slice(3, 5)
                )},${parseInt("0x" + hex.slice(5, 7))},${opacity})`;
            }
            return rgbaColor;
        }
        function chartLL(ChartName, data, strNote, LineColor, max_min_Name) {
            var YBTM = new Date(mini.get("STIME").getFormValue() + " " + $.data(myData, "HOUR") + ":00:00").format("yyyy年MM月dd日HH时");
            YBTM = YBTM + $.data(myData, "TYPE") + "数值预报";
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(value[value1.codename]); //加入时间集合
                        chartTM.push(new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")); //加入时间集合

                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var max_min = GetSort(chartValue);
            var option = {
                title: {
                    text: YBTM,
                    left:"center",
                    textStyle: {
                        color: '#000',
                        fontSize: 20,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show:false,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min: max_min.min, //动态设置最大值最小值。
                        max: max_min.max,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                type: 'line',
                                data: chartValue,
                                barWidth: '40%',
                                symbol: 'none',  //这句就是去掉点的
                                smooth: true,
                                areaStyle: {
                                    normal: {
                                        color: new echarts.graphic.LinearGradient(
                                            0,
                                            0,
                                            0,
                                            1,
                                            [{
                                                offset: 0,
                                                color: hexToRgba(LineColor[j - 1], 0.3)
                                            },
                                            {
                                                offset: 1,
                                                color: hexToRgba(LineColor[j - 1], 0.1)
                                            }
                                            ],
                                            false
                                        ),
                                        shadowColor: hexToRgba(LineColor[j - 1], 0.1),
                                        shadowBlur: 10
                                    }
                                },
                                //		           itemStyle: {normal: {
                                //          	areaStyle: {type: 'default'},
                                //				//颜色渐变设置
                                //          	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //          		offset:0,
                                //          		color:'#050AE8'
                                //          	},{
                                //          		offset:1,
                                //          		color:'#8688F4'
                                //          	}])
                                //          }},
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },

                                symbol: 'none',  //这句就是去掉点的
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html>
