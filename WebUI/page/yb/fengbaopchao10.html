<body class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar" style="height: 40px;line-height: 32px;">
            <span style="margin-left: 0px;float:left;">&nbsp;&nbsp;年份：</span>
            <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                <input id="YEAR" class="form-control" value="请选择年份">
                <div class="input-group-addon">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
            <span style="margin-left: 10px;">&nbsp;&nbsp;台风选择：</span>
            <input id="typhoonId" class="mini-combobox" style="width:150px;" textField="typhoonName" valueField="typhoonId"
                allowInput="true" onvaluechanged="setTyphoonId();" />
            <span style="margin-left: 0px;">&nbsp;&nbsp; 站点选择： </span>
            <ul class="onlytab" id="onlytab2">
                <li id="TitleLi1" onclick="OnClickTitle2(this.id,'63401750')" class="onlyli onlyliHover start" style="width: 60px !important;">吴淞口</li>
                <li id="TitleLi2" onclick="OnClickTitle2(this.id,'63405900')" class="onlyli" style="width: 60px !important;">金山嘴</li>
                <li id="TitleLi3" onclick="OnClickTitle2(this.id,'60117537')" class="onlyli" style="width: 60px !important;">高桥</li>
                <li id="TitleLi4" onclick="OnClickTitle2(this.id,'63405800')" class="onlyli" style="width: 60px !important;">芦潮港</li>
                <li id="TitleLi4" onclick="OnClickTitle2(this.id,'63405800')" class="onlyli end" style="width: 70px !important;">墅沟闸(外)</li>
            </ul>
            <span style="margin-left: 310px;">&nbsp;&nbsp;回退天数：</span>

    <div id="JY_charts" style="height: 350px;width:100%;margin:0px auto;background:white;">

    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 405px);height: -moz-calc(100% - 405px);height: calc(100% - 405px);"
        allowalternating="true" borderstyle="border-right:0;" showpager="false" showemptytext="true" emptytext="暂无数据"
        alwaysshowemptytext="true" ondrawcell="ondrawcell">
        <div property="columns">
            <div field="tm" width="60" align="center" headeralign="center" allowsort="false">时间</div>
            <div field="twc" width="80" align="center" headeralign="center" allowsort="false" decimalPlaces="2"
                dataType="float">天文潮(m)</div>
            <div field="ybzs" width="60" align="center" headeralign="center" allowsort="false" decimalPlaces="2"
                dataType="float">预报增水(m)</div>
            <div field="ybcw" width="60" align="center" headeralign="center" allowsort="false" decimalPlaces="2"
                dataType="float">预报潮位(m)</div>
        </div>
    </div>

    <script src="../../Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script>
        mini.parse();
        var myData = [];
        var resultData = [];
        var STCD = "63401750";
        //实例化表格对象
        var grid = mini.get("grid1");

        window.onload = function () {
             GetObj("YEAR").value =new Date().getFullYear();
             BreakLayerLoad();
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1949",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });

            $('.form-control').datetimepicker().on('changeDate', function(evt){
                BreakLayerLoad();
            });
        };
        function BreakLayerLoad() {
            var strWhere = {
                "year": GetObj("YEAR").value
            }
            GetJosnsStormSurgeForecast("/Typhoon/GetInfos", strWhere, true, function (res) {
                JosnSel(res, "GetInfos");
            });
        }
        function getFangAn() {
            var TyphoonId = mini.get("typhoonId").getValue();
            GetJosnsStormSurgeForecast("/StormSurge/Calculate/GetNewestCalSchemeInfo?projectId=814&TyphoonId=" + TyphoonId + "&ModelId=1&DBType=1&ForecastTime=", "", true, function (res) {
                JosnSel(res, "GetSubjectList");
            }, function (res) {
                console.error('请求模型接口报错');
            }, "GET");
        }
        function GetCalResultsByStation() {
            var strJson = $.data(myData, "GetSubjectList");
            var calSchemeInfos = strJson[0].calSchemeInfos;
            if (calSchemeInfos != null) {
                var calSchemeId = calSchemeInfos[0].calSchemeId;
                if (calSchemeId != null) {
                    var strWhere = {
                        "projectId": "814",
                        "calSchemeIds": ["" + calSchemeId + ""],
                        "DBType": 1,
                        "backDays": mini.get("day").getValue(),//回退天数
                        "stationCode": STCD,
                        "twcDept": 0,
                        "stepLength": ""
                    }

                    strWhere = {
                        "projectId": "814",
                        "backDays": mini.get("day").getValue(),//回退天数
                        "calSchemeIds": [calSchemeId],
                        "stationCodes": [STCD],
                        "twcDept": 0,
                        "forecastSchemeId": "81402"
                    }
                    GetJosnsStormSurgeForecast("/StormSurge/Calculate/GetCalResultsByStation", strWhere, true, function (res) {
                        JosnSel(res, "GetCalResultsByStation");
                    });
                } else {
                    ShowMsg("所选台风无预报成果！");
                    var res = {};
                    JosnSel(res, "GetCalResultsByStation");
                }
            }
        }
        function JosnSel(data, typeID) {
            if (typeID == "GetInfos") {
                if (data.data.length > 0) {
                    for(var num=0;num<data.data.length;num++){
                        data.data[num].typhoonName= data.data[num].typhoonName+"("+data.data[num].typhoonId+")"
                    }
                    mini.get("typhoonId").setData(data.data);
                    //mini.get("typhoonId").select(0);
                    mini.get("typhoonId").setValue(202403);
                    getFangAn();
                }
            } else if (typeID == "GetSubjectList") {
                if (data.data != []) {
                    var strJson = data.data
                    $.data(myData, "GetSubjectList", strJson);
                    GetCalResultsByStation();
                }
            } else if (typeID == "GetCalResultsByStation") {
                // console.error("GetCalResultsByStation", data.data)
                var TMdata = [], TWCdata = [], YBTMdata = [], YBZSdata = [], YBCWdata = [], _XData = [];
                if (data.data != undefined) {
                    var strJson = data.data[0];
                    if (strJson.baseDatas.length > 0) {
                        var baseDatasT=strJson.baseDatas.filter(function(res){
                            return res.valueName=="天文潮位";
                        });
                        var TWCdataJson =baseDatasT.length>0?baseDatasT[0].datas:[];
                        for (var num = 0; num < TWCdataJson.length; num++) {
                            var item = TWCdataJson[num]
                            var tm = new Date(item["tm"]).format("MM-dd HH:mm");
                            var twc = item.value == undefined ? null : Number(item.value).toFixed(2);
                            TMdata.push(tm);
                            TWCdata.push(twc);
                        }
                    }
                    if (strJson.calSchemeInfos.length > 0) {
                        var YBZSdataLIST = strJson.calSchemeInfos[0].results.filter(function (e) {
                            return e.valueName == "预报增水";
                        });
                        var YBCWdataLIST = strJson.calSchemeInfos[0].results.filter(function (e) {
                            return e.valueName == "预报潮位";
                        });
                        if (YBZSdataLIST.length > 0) {
                            var YBZSdataJson = YBZSdataLIST[0].datas;
                            for (var num = 0; num < YBZSdataJson.length; num++) {
                                var item = YBZSdataJson[num]
                                var ybTtm = new Date(item["tm"]).format("MM-dd HH:mm");
                                var ybzs = item.value == undefined ? null : Number(item.value).toFixed(2);
                                YBTMdata.push(ybTtm);
                                YBZSdata.push(ybzs);
                            }
                        }
                        if (YBCWdataLIST.length > 0) {
                            var YBCWdataJson = YBCWdataLIST[0].datas;
                            for (var num = 0; num < YBCWdataJson.length; num++) {
                                var item = YBCWdataJson[num]
                                var ybcw = item.value == undefined ? null : Number(item.value).toFixed(2);
                                YBCWdata.push(ybcw);
                            }
                        }
                    }
                    
                    if (TWCdata.length > 0) {
                        if (TWCdata.length == YBZSdata.length) {
                            YBZSdata = YBZSdata;
                            YBCWdata = YBCWdata;
                        } else {
                            var Length = TWCdata.length - 1;
                            var dataValue =[];// [new Array(Length - YBZSdata.length).fill(null), TWCdata[TWCdata.length]];
                            //YBZSdata = [dataValue, YBZSdata];
                            //YBCWdata = [dataValue, YBCWdata];

                            YBZSdata.splice(0, 0, null); // 在索引0的位置插入一个空字符串
                            YBCWdata.splice(0, 0, null); // 在索引0的位置插入一个空字符串
                        }
                    } else {
                        var dataValue = [];
                        TMdata = YBTMdata;
                        YBZSdata = [dataValue, YBZSdata];
                        YBCWdata = [dataValue, YBCWdata];
                    }
                    console.error('YBZSdata', YBZSdata);
                    console.error('YBCWdata',YBCWdata);
                    chartCW("JY_charts", TMdata, YBTMdata, TWCdata, YBZSdata, YBCWdata);
                    for (var i = 0; i < TMdata.length; i++) {
                        _XData.push({ tm: TMdata[i], twc: TWCdata[i], ybzs: YBZSdata[i], ybcw: YBCWdata[i] });
                    }
                    grid.setData(_XData);
                }else{
                    chartCW("JY_charts", TMdata, YBTMdata, TWCdata, YBZSdata, YBCWdata);
                    grid.setData([]);
                    // noData();
                }
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "tm") {
                e.cellHtml = new Date(convertToDate(value)).format("MM-dd HH:mm");
            } else if (field == "stnm") {
                var s = '<a onclick="loadZS(\'' + value + '\')"  style="cursor:pointer;">' + value + '</a>';
                e.cellHtml = s;
            }
        }
        function OnClickTitle2(objID, objPathName) {//选择类型
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            STCD = objPathName;
            GetCalResultsByStation();

        }
        function setDAY() {
            GetCalResultsByStation();
        }
        function setTyphoonId() {
            getFangAn();
        }
        function chartLL(ChartName, data, strNote, LineColor, max_min_Name) {
            var YBTM = new Date(mini.get("STIME").getFormValue() + " " + $.data(myData, "HOUR") + ":00:00").format("yyyy年MM月dd日HH时");
            YBTM = YBTM + $.data(myData, "TYPE") + "数值预报";
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(value[value1.codename]); //加入时间集合
                        chartTM.push(new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")); //加入时间集合

                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var max_min = GetSort(chartValue);
            var option = {
                title: {
                    text: YBTM,
                    left: "center",
                    textStyle: {
                        color: '#000',
                        fontSize: 20,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show: false,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min: max_min.min, //动态设置最大值最小值。
                        max: max_min.max,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                type: 'line',
                                data: chartValue,
                                barWidth: '40%',
                                symbol: 'none',  //这句就是去掉点的
                                smooth: true,
                                areaStyle: {
                                    normal: {
                                        color: new echarts.graphic.LinearGradient(
                                            0,
                                            0,
                                            0,
                                            1,
                                            [{
                                                offset: 0,
                                                color: hexToRgba(LineColor[j - 1], 0.3)
                                            },
                                            {
                                                offset: 1,
                                                color: hexToRgba(LineColor[j - 1], 0.1)
                                            }
                                            ],
                                            false
                                        ),
                                        shadowColor: hexToRgba(LineColor[j - 1], 0.1),
                                        shadowBlur: 10
                                    }
                                },
                                //		           itemStyle: {normal: {
                                //          	areaStyle: {type: 'default'},
                                //				//颜色渐变设置
                                //          	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //          		offset:0,
                                //          		color:'#050AE8'
                                //          	},{
                                //          		offset:1,
                                //          		color:'#8688F4'
                                //          	}])
                                //          }},
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },

                                symbol: 'none',  //这句就是去掉点的
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
        function chartCW(ChartName, TMdata, YBTMdata, TWCdata, YBZSdata, YBCWdata) {
            var showed = TMdata.length > 0 ? false : true;
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var option = {
                title: {
                    show: showed, // 是否显示title
                    text: '所选台风无预报成果！',
                    left: 'center',
                    top: 'center',
                    textStyle: {
                        color: 'rgba(0,0,0,0.80)',
                        fontSize: 18,
                        fontWeight: 400
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                legend: {
                    data: ['天文潮', '预报增水', '预报潮位'],
                    show: true,
                    itemWidth: 10,
                    itemHeight: 10,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    },
                },
                grid: {
                    top: '10%',
                    left: '3%',
                    right: '4%',
                    bottom: '7%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: TMdata,
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '14'
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                width: 1 //这里是为了突出显示加上的
                            },
                        },
                        axisLabel: {
                            fontSize: 14
                        },
                    }
                ],
                yAxis: [
                    {
                        name: "(m)",
                        type: 'value',
                        nameTextStyle: {
                            fontSize: 14 // 设置字体大小为16
                        },
                        // min: MINdata,
                        // max: MAXdata,
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 20;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 20;
                            }


                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 30;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 30;
                            }

                        },
                        axisLabel: {
                            show: true,
                            //formatter: '{value}',
                            textStyle: {
                                fontSize: 14
                            },
                            formatter: function (value, index) {
                                return value.toFixed(2)
                            }
                        },
                        axisLine: {
                            show: true,
                        },
                        // y轴刻度的颜色
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#ccc',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                    },
                ],
                // dataZoom: [
                //     {
                //         type: 'slider',//数据滑块 
                //         start: 0,
                //         minSpan: 8,    //5min
                //         dataBackground: {
                //             lineStyle: {
                //                 color: '#D5E2FD'
                //             },
                //             areaStyle: {
                //                 color: '#D5E2FD',
                //                 opacity: 1,
                //             }
                //         },
                //     },
                //     {
                //         type: 'inside'//使鼠标在图表中时滚轮可用
                //     }
                // ],

                series: [
                    {
