    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);
        grid.setData(arr);
    }

    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.total > 0) {
                $.data(myData, "resultData", eval(ResultData.data));
                resultData = eval(ResultData.data);
                resultData = groupBy(resultData, "FTM");
                var arr = [];
                for (var num = 0; num < resultData.length; num++) {
                    arr.push(resultData[num][0]);
                }
                // console.error(arr);
                resultData = [];
                resultData = arr;
                getInfo();
                selectRow(0);
                $('#dataShow').hide();
            } else {
                resultData = [];
                getInfo();
                $('#dataShow').show();
            }
            $("#dataLoad").hide();
        } else if (typeID == "QXSJ_TZ_NCFILESel") {
            if (ResultData.total > 0) {
                $.data(myData, "solutionArr", ResultData.data);
                var TM = new Date(new Date(ResultData.data[0].tm)).format("yyyy-MM-dd");
                var HOUR = new Date(new Date(ResultData.data[0].tm)).format("H");
                var Minute = new Date(new Date(ResultData.data[0].tm)).format("m");
                //alert(new Date(convertToDate(ResultData.data[0].TM)).format("yyyy-MM-dd HH:mm:ss"));
                mini.get("HOUR").setValue(HOUR);
                mini.get("STIME").setValue(TM);
                mini.get('Minute').setValue(Minute);
            } else {
                var TM = new Date().format("yyyy-MM-dd");
                mini.get("STIME").setValue(TM);
                mini.get("HOUR").select(0);
                mini.get('Minute').select(0);
            }
            BreakLayerLoad();
        }
    }

    function MapRainfall(flag, picUrl) {
        var obj = {
            xmin: "120.925", ymin: "30.55", xmax: "122.00", ymax: "31.949998"
        };
        require(["esri/geometry/Point",
            "esri/graphic",

            "esri/layers/MapImage",
            "esri/InfoTemplate",
            "esri/dijit/InfoWindow",
            "esri/layers/GraphicsLayer",
            "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "dojo/domReady!"
        ], function (Point, Graphic, MapText, PictureMarkerSymbol, MapImage, InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol) {
            if (flag == true) {
                var tempLayer = window.parent.strImageLayer;
                var strImg = ClientIP + "NC/" + picUrl;
                //console.error(strImg);
                window.parent.waterYBSWSST = picUrl;
                //alert(window.parent.strImageLayer)
                window.parent.strImageLayer = new MapImage({
                    'extent': {
                        'xmin': obj.xmin,
                        'ymin': obj.ymin,
                        'xmax': obj.xmax,
                        'ymax': obj.ymax,
                        'spatialReference': { 'wkid': 4326 }
                    }, 'href': strImg
                });
                window.parent.myMapImageLayer.addImage(window.parent.strImageLayer);
                //判断首页tab是不是当前页面，如果不是就不用叠加
                var _GlobalTab = window.parent.tabs.getActiveTab();
                var _url = _GlobalTab.url;
                if (_url.lastIndexOf("jyyb.html") > -1) {
                    window.parent.myMapImageLayer.setOpacity(0.8);
                    window.parent.myMapImageLayer.setVisibility(true);

                    setTimeout(function (e) {
                        if (window.parent.strImageLayer != undefined) {
                            window.parent.myMapImageLayer.removeImage(tempLayer);
                        }
                    }, 100);
                } else {
                    window.parent.myMapImageLayer.setVisibility(false);
                }
            } else {
                window.parent.myMapImageLayer.setVisibility(false);
            }
        });
    }

    function MapRainfallArea(tm) {
        var result = $.data(myData, "resultData");
        countyLayer1.clear();
        require(["esri/geometry/Point",
            "esri/graphic",
            "myJs/MapText",
            "esri/symbols/PictureMarkerSymbol",
            "esri/symbols/SimpleFillSymbol",
            "esri/symbols/SimpleLineSymbol",
            "esri/Color",
            "esri/InfoTemplate",
            "esri/dijit/InfoWindow",
            "esri/layers/GraphicsLayer",
            "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "esri/geometry/Polygon", "dojo/_base/lang", "esri/symbols/Font",
            "dojo/domReady!"
        ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color, InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol
            , Polygon, lang, Font) {
                _destroy();
                result = result.filter(function (item) {
                    return new Date(new Date(item.FTM)).format("yyyy-MM-dd HH:mm:ss") == tm;
                });
                $.get(
                    "../../Common/SHSWZZArea2000.json",//json路径
                    lang.hitch(this, function (data, status) {

                        if (status === "success") {
                            var features = data.features;
                            features.forEach(function (feature) {
                                var allrings = feature.geometry.coordinates;
                                var gra = feature.properties;
                                var mc = gra.name;
                                var arr = result.filter(function (item) {
                                    return item.NAME == mc;
                                });
                                if (arr.length > 0) {
                                    var center = [];
                                    center = getJWD(arr[0].NAME);
                                    console.error(arr[0].NAME, center);
                                    var cls = "  waterText";
                                    var textStr = "";//arr[0].NAME + ":" +
                                    textStr += parseFloat(arr[0].DRP).toFixed(1) + "mm";
                                    var point = new Point({
                                        "x": center[0],
                                        "y": center[1],
                                        "spatialReference": {
                                            "wkid": 4326
                                        }
                                    });
                                    //cls += " slText ";
                                    var _align = "bottom";
                                    if (textStr == "") {
                                        textStr = "—";
                                    }
                                    var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 12);
                                    labels.push(label);

                                    var colorStr = getAreaColor(arr[0].DRP, "");

                                    if (colorStr != null && colorStr != "" && colorStr != undefined) {
                                        var fillColorStr = getAreaColor(arr[0].DRP, "fill");
                                        var fs = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                            new SimpleLineSymbol(SimpleLineSymbol.STYLE_DASHDOT,
                                                new Color(colorStr), 2), new Color(fillColorStr)
                                        );
                                        var lineSymbol = new SimpleFillSymbol("solid", new SimpleLineSymbol("solid",
                                            new dojo.Color(colorStr), 1),
                                            new dojo.Color(fillColorStr));

                                        var area = new Polygon(feature.geometry.coordinates);
                                        var g3 = new Graphic(area, lineSymbol);
                                        g3.attributes = arr[0];
                                        countyLayer1.add(g3);
                                    }

                                    var point = new Point({ "x": center[0], "y": center[1], "spatialReference": { "wkid": 4326 } });
                                    var font = new Font("14px", Font.STYLE_NORMAL, Font.VARIANT_NORMAL,
                                        Font.WEIGHT_BOLDER);
                                    var textSymbol = new TextSymbol(
                                        mc,
                                        font,
                                        new Color("black")
                                    );
                                    var labelPointGraphic = new Graphic(point, textSymbol);
                                    countyLayer1.add(labelPointGraphic);

                                }
                            }, this);
                        }
                    }),
                    "json"
                );

            });
    }
    function getAreaColor(zValue, type) {
        var color = "#ffffff";
        var colorTM = [255, 255, 255, 0];
        var colors = ["#A6F28E", "#007B00", "#3DBCF9", "#0000F9", "#FB3DFA", "#7B0000"];
        var colorsTM = [
            [166, 242, 142, 0.45],
            [0, 123, 0, 0.45],
            [61, 188, 249, 0.45],
            [0, 0, 249, 0.45],
            [251, 61, 250, 0.45],
            [123, 0, 0, 0.45]
        ];
        if (zValue > 0 && zValue <= 10) {
            color = colors[0];
            colorTM = colorsTM[0];
        }
        else if (zValue > 10 && zValue <= 25) {
            color = colors[1];
            colorTM = colorsTM[1];
        }
        else if (zValue > 25 && zValue <= 50) {
            color = colors[2];
            colorTM = colorsTM[2];
        }
        else if (zValue > 50 && zValue <= 100) {
            color = colors[3];
            colorTM = colorsTM[3];
        }
        else if (zValue > 100 && zValue <= 200) {
            color = colors[4];
            colorTM = colorsTM[4];
        }
        else if (zValue > 200) {
            color = colors[5];
            colorTM = colorsTM[5];
        }
        if (type == "fill") {
            return colorTM;
        } else {
            return color;
        }
    }

            case "蕴南片":

                break;
            case "中心片":

                break;
            case "淀北片":

                break;
            case "青松片":

                break;
            case "淀南片":
                center = [-6136.9, -20025.3];
                break;
            case "浦东片":

            case "太北片":
                center = [-47233.6, -20757.0];
                break;
            case "太南片":
                center = [-38930.5, -27188.5];
                break;
            case "浦南西片":
