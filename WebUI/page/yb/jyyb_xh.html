<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <script src="../../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
            background: white;
        }
        .onlytab {
            margin: 0px;
            padding: 0px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 100% !important;

        }
            .onlytab li {
                list-style: none;
                border: 1px #3291f9 solid;
                float: left;
                background-color: White;
                width: 100px !important;
                height: 30px;
                font: 14px/30px "arial";
                text-align: center;
            }
    </style>
</head>
<body  class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar">
            预报时间：<input id="STIME" class="mini-datepicker" style="width:110px;" showtime="false" format="yyyy-MM-dd" />
                 <ul class="onlytab" id="onlytab2" style="width:180px !important;position:absolute;left:200px;top:0px;">
                     <li id="TitleLi08" onclick="OnClickTitle2(this.id,'08')" class="onlyli start" style="width: 60px !important;">8时</li>
                     <li id="TitleLi12" onclick="OnClickTitle2(this.id,'12')" class="onlyli" style="width: 60px !important;">12时</li>
                     <li id="TitleLi20" onclick="OnClickTitle2(this.id,'20')" class="onlyli end" style="width: 60px !important;">20时</li>
                 </ul>
            <ul class="onlytab" id="onlytab" style="padding-top:5px;">
                <li id="10310112" class="onlyli start"  onclick="OnClickTitle(this.id,'闵行')" >闵行</li>
                <li id="10310119" class="onlyli"  onclick="OnClickTitle(this.id,'南汇')" >南汇</li>
                <li id="10310116" class="onlyli"  onclick="OnClickTitle(this.id,'金山')" >金山</li>
                <li id="10310117" class="onlyli"  onclick="OnClickTitle(this.id,'松江')" >松江</li>
                <li id="10310120" class="onlyli"  onclick="OnClickTitle(this.id,'奉贤')" >奉贤</li>
                <li id="10310114" class="onlyli"  onclick="OnClickTitle(this.id,'嘉定')" >嘉定</li>
                <li id="10310115" class="onlyli"  onclick="OnClickTitle(this.id,'浦东')" >浦东</li>
                <li id="10001001" class="onlyli onlyliHover"  onclick="OnClickTitle(this.id,'徐汇')" >徐汇</li>
                <li id="10310113" class="onlyli"  onclick="OnClickTitle(this.id,'宝山')" >宝山</li>
                <li id="10310118" class="onlyli end"  onclick="OnClickTitle(this.id,'青浦')" >青浦</li>
            </ul>
        </div>
    </div>
    <div id="JY_charts" style="height:350px;width:98%;margin:0px auto;background:white;">
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 405px);height: -moz-calc(100% - 405px);height: calc(100% - 405px);" allowalternating="true"
         borderstyle="border-right:0;" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div field="tm" width="120" align="center" headeralign="center" allowsort="false">时间</div>
            <div field="drp" width="60" align="center" headeralign="center" allowsort="false">雨量(mm)</div>
            <div field="temp" width="60" align="center" headeralign="center" allowsort="false">气温(℃)</div>
            <div field="windspeed" width="60" align="center" headeralign="center" allowsort="false">风速(m/s)</div>
            <div field="winddir" width="60" align="center" headeralign="center" allowsort="false">风向</div>
            <div field="airpressure" width="60" align="center" headeralign="center" allowsort="false">气压(hPa)</div>
            <div field="humidity" width="60" align="center" headeralign="center" allowsort="false">湿度(%)</div>
        </div>
    </div>
    <script>
        mini.parse();
        var myData = [];
        var resultData = [];
        //实例化表格对象
        var grid = mini.get("grid1");
        window.onload = function () {
            var s_where = { pageIndex: 1, pageSize: 1 };
            //GetJosns("DATA_ST_RNFL_FSel", s_where, "YBSel");
			app.post("SWZZ_QXSJ_st_rnfl_f/findResult",s_where,(data)=>{
				JosnSel(data,"YBSel");
			});
        };
        function BreakLayerLoad() {
            var stcd = $("#onlytab .onlyliHover").attr("id");
            var YBTM = mini.get("STIME").getFormValue() + " " + $.data(myData, "HOUR")+":00:00";
            var s_where = { strExp: YBTM, stcd: stcd };
            //GetJosns("DATA_ST_RNFL_FSel", s_where, "Sel");
			app.post("SWZZ_QXSJ_st_rnfl_f/findResult",s_where,(data)=>{
				JosnSel(data,"Sel");
			});
        }
        function JosnSel(data, typeID) {
            if (typeID == "YBSel") {
                var TM = new Date(convertToDate(data.data[0].ybtm)).format("yyyy-MM-dd HH:mm:ss");
                mini.get("STIME").setValue(TM);
                $.data(myData, "YBTM", TM);
                var HOUR = new Date(convertToDate(data.data[0].ybtm)).format("HH");
                $.data(myData, "HOUR", HOUR);
                var objID = "TitleLi" + HOUR;
                //alert(objID);
                $("#onlytab2 .onlyli").removeClass("onlyliHover");
                $("#" + objID).addClass("onlyliHover");

                BreakLayerLoad();
            }
            else if (typeID == "Sel") {
                resultData = data.data;
                //绘制过程线颜色设置
                var LineColor = ['#3398DB', '#FF0000', '#00FF00', '#FFA500'];
                var strNote = [];
                var item = { "name": "时间", "codename": "tm", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                item = { "name": "降雨量", "codename": "drp", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                //绘制图形
                chartYL("JY_charts", resultData, strNote, LineColor, "雨量");
                getInfo();
            }
        }
        function getInfo() {
            tableBind(resultData);
        }
        function tableBind(data) {
            var dataResult = data;
            grid.setData(dataResult);
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "tm") {
                e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm");
            }
            if (field == "drp") {
                if (value != undefined && value != "") {
                    e.cellHtml = Number(value).toFixed(1);
                }
                
            }
        }
        function OnClickTitle(objID, objPathName) {//选择类型
            var only = $("#onlytab .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $('#dataLoad').show();
            BreakLayerLoad();
        }
        function OnClickTitle2(objID, objPathName) {//选择类型
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $.data(myData, "HOUR", objPathName);
            $('#dataLoad').show();
            BreakLayerLoad();
        }
        /* 柱状图 雨量
* ChartName画图控件名称
* dataS数据对象，数据格式json
* strNote数据说明，数据类型数组，数据格式
* json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示
*/
        function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });
            //循环数据，加入有效数据。
            var totalJY = 0;
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        var tm = new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")
                        chartTM.push(tm); //加入时间集合
                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                        if (value[value1.codename] != undefined && value[value1.codename] != "") {
                            totalJY += parseFloat(value[value1.codename]);
                        }
                    }
                });
                m.push(charthan); //加入集合
            });
            var showed = true;
            if (totalJY>0) {
                showed = false;
            }
            var option = {
                title: {
                    show: showed, // 是否显示title
                    text: '未来24小时无降雨',
                    left: 'center',
                    top: 'center',
                    textStyle: {
                        color: 'blue',
                        fontSize: 18,
                        fontWeight: 400
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    show:false,
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                toolbox: {
                    show: false
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: 20,
                    top: 40,
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        },
                        axisLabel: {
                            // interval: 0,
                            //rotate: 30
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        //interval: 0,
                        //  splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        min: 0,
                        max: function (value) {
                            return Number(value.max) + 20;
                            //return Number((value.max - (value.max % 5)) / 5 + 1).toFixed(0) * 5;
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        if (chartName[j] == "名称") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: '20',
                                label: {
                                    normal: {
                                        show: true,
                                        position: 'top'
                                    }
                                },
                                smooth: true
                                //		           itemStyle: {normal: {
                                //          	areaStyle: {type: 'default'},
                                //				//颜色渐变设置
                                //          	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //          		offset:0,
                                //          		color:'#050AE8'
                                //          	},{
                                //          		offset:1,
                                //          		color:'#8688F4'
                                //          	}])
                                //          }},
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }

    </script>
</body>
</html>
