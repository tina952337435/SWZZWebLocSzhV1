<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="../../Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="../../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <script src="../../Common/boot.js?ver=1.0.2" type="text/javascript"></script>
    <script src="../../Common/jquery.min.js"></script>
    <!--高版本下拉框无法使用-->
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
            background: white;
        }
        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

            .mini-grid-summaryRow tr td span {
                color: #fff !important;
                line-height: 25px;
                font-weight: 400 !important;
            }
    </style>
</head>

<body class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar" style="height:45px;">
            开始时间：<input id="STIME" class="mini-datepicker" style="width:135px;" showtime="true" format="yyyy-MM-dd HH:00"
                onvaluechanged="onvaluechanged" />
          
                <button type="button" class="btn btn-success" onclick="Exp()" id="expButton" style="display:none;margin-left: 20px;">报表导出</button>
        <span style="display:block;float: right;">单位：m</span>
            </div>
    </div>
    <div id="JY_charts" style="height:350px;width:90%;margin:0px auto;background:white;">

    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 405px);height: -moz-calc(100% - 405px);height: calc(100% - 405px);"
        allowalternating="true" borderstyle="border-right:0;" showpager="false" showemptytext="true" emptytext="暂无数据"
        alwaysshowemptytext="true" ondrawcell="ondrawcell" showSummaryRow="true" ondrawsummarycell="onDrawSummaryCell">
    </div>
    <script>
        mini.parse();
        var myData = [];
        var resultData = [];
        //实例化表格对象
        var grid = mini.get("grid1");
        window.onload = function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var now = new Date();
            var nowStr = now.format("yyyy-MM-dd HH:00");
            mini.get("STIME").setValue(nowStr);
            BreakLayerLoad();
        };
        function BreakLayerLoad() {
            var enddate = mini.get("STIME").getFormValue() + ":00";
            var startdate = AddHourDate(enddate, -72);
            var s_where = {
                startdate: startdate,
                enddate: enddate,
            };
            app.post("SWZZ_QXSJ_st_tide_ryb/findResultFisrt", s_where, (data) => {
                JosnSel(data, "Sel")
            })
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                resultData = data.data;
                var columns = [];
                columns.push({ header: "序号", type: "indexcolumn", align: "center", headerAlign: "center" });
                columns.push({ header: "日期", field: "TM", align: "center", headerAlign: "center" });
                //绘制过程线颜色设置
                var strNote = [{ "name": "时间", "codename": "TM", "tableV": "1", "isShow": true, "width": "30%" }];
                var propertyNames = Object.keys(resultData[0]);
                for (var num = 0; num < propertyNames.length; num++) {
                    if (propertyNames[num] == "TM") {
                        continue;
                    }
                    var item = { "name": propertyNames[num], "codename": propertyNames[num], "tableV": "1", "isShow": true, "width": "30%" };
                    strNote.push(item);


                    columns.push({ header: propertyNames[num], field: propertyNames[num], align: "center", headerAlign: "center" ,decimalPlaces:"2", dataType:"float"});
                }
                grid.set({ columns: columns });

                var LineColor = ["#0000FE", "#E80000", "#00FF00", "#CBA864", "#8000FF", "#800000", "#FF00FF", "#DB7093", "#008080", "#38B0DE", "#CC3299", "#99CC32", '#00FFFF', '#FFFF00', '#000000', '#70DB93', '#5C3317', '#9F5F9F', '#B5A642', '#D9D919', '#A67D3D', '#8C7853', '#A67D3D', '#5F9F9F', '#D98719', '#B87333', '#FF7F00', '#42426F', '#5C4033', '#2F4F2F', '#4A766E', '#4F4F2F', '#9932CD', '#871F78', '#6B238E', '#2F4F4F', '#97694F', '#7093DB', '#855E42', '#545454', '#545454', '#D19275', '#8E2323', '#238E23', '#CD7F32', '#DBDB70', '#C0C0C0', '#527F76', '#93DB70', '#215E21', '#4E2F2F', '#9F9F5F', '#C0D9D9', '#A8A8A8', '#8F8FBD', '#E9C2A6', '#32CD32', '#E47833', '#8E236B', '#32CD99', '#3232CD', '#6B8E23', '#EAEAAE', '#9370DB', '#426F42', '#7F00FF', '#7FFF00', '#70DBDB', '#DB7093', '#A68064', '#2F2F4F', '#23238E', '#4D4DFF', '#FF6EC7', '#00009C'];
                //绘制图形
                chartLL("JY_charts", resultData, strNote, LineColor, "风暴潮(m)");
                getInfo();
            }
        }
        function getInfo() {
            tableBind(resultData);
        }
        function tableBind(data) {
            var dataResult = data;
            grid.setData(dataResult);
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "tm") {
                e.cellHtml = new Date((value)).format("yyyy-MM-dd HH:mm");
            }
        }
        function onvaluechanged(e) {
            BreakLayerLoad();
        }
        function Exp() {
            var name = "多源潮位预报成果对比分析";
            var data = grid.data;
            ExportExcel(data, grid, name);

        }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            var JSONArray = grid.getData();
            if (e.field == "TM") {
                var s = "<span style='color:Brown;text-align:center;'>";
                s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>最大值</div>";
                s += "</span>";
                e.cellHtml = s;
            } else {
                JSONArray = sortObjectArray(JSONArray, [e.field], 'desc');
                if (JSONArray.length > 0) {
                    var tdz = JSONArray[0][e.field];
                    if (tdz != undefined) {
                        tdz=parseFloat(tdz).toFixed(2);
                        var s = "<span style='color:Brown;text-align:center;'>";
                        s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>" + tdz + "m</div>";
                        s += "</span>";
                        e.cellHtml = s;
                    }
                }
            }
        }
        const hexToRgba = (hex, opacity) => {
            let rgbaColor = "";
            let reg = /^#[\da-f]{6}$/i;
            if (reg.test(hex)) {
                rgbaColor = `rgba(${parseInt("0x" + hex.slice(1, 3))},${parseInt(
                    "0x" + hex.slice(3, 5)
                )},${parseInt("0x" + hex.slice(5, 7))},${opacity})`;
            }
            return rgbaColor;
        }
        function chartLL(ChartName, data, strNote, LineColor, max_min_Name) {
            var YBTM = "多源潮位预报成果对比分析";
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    var echartValue = value[value1.codename];
                    if (echartValue == undefined) {
                        echartValue = null;
                    }
                    charthan.push(echartValue); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(value[value1.codename]); //加入时间集合
                        chartTM.push(new Date((value[value1.codename])).format("MM-dd HH:mm")); //加入时间集合

                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        if(echartValue!=null){
                            chartValue.push(value[value1.codename]);
                        }
                    }
                });
                m.push(charthan); //加入集合
            });
            var max_min = GetSort(chartValue);
            var option = {
                title: {
                    text: YBTM,
                    left: "center",
                    textStyle: {
                        color: '#000',
                        fontSize: 20,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show: true,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12,
                        padding: [40, 0]
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min: max_min.min, //动态设置最大值最小值。
                        max: max_min.max,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            var cValue=m[i][j];
                            if(m[i][j]!=null){
                                cValue=parseFloat(m[i][j]).toFixed(2);
                            }
                            chartValue.push(cValue); //循环价值
                        }
                        //console.error('chartValue', chartName[j], chartValue);
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [
                                        //{ type: 'max', name: '最大值' },
                                        //{ type: 'min', name: '最小值' }
                                    ]
                                },
                                type: 'line',
                                data: chartValue,
                                barWidth: '40%',
                                symbol: 'none',  //这句就是去掉点的
                                smooth: true,
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },

                                symbol: 'none',  //这句就是去掉点的
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
</body>

</html>
