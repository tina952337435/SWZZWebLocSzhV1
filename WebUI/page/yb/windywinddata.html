        const hexToRgba = (hex, opacity) => {
            let rgbaColor = "";
            let reg = /^#[\da-f]{6}$/i;
            if (reg.test(hex)) {
                rgbaColor = `rgba(${parseInt("0x" + hex.slice(1, 3))},${parseInt(
                    "0x" + hex.slice(3, 5)
                )},${parseInt("0x" + hex.slice(5, 7))},${opacity})`;
            }
            return rgbaColor;
        }

        function getDirName(degrees) {
            var directArrOne = ["北", "东北", "东", "东南", "南", "西南", "西", "西北"];
            var dirname = "";
            var index = 0;
            if (337.5 <= degrees && degrees <= 360) {
                index = 0;
            }
            else if (0 <= degrees && degrees <= 22.5) {
                index = 0;
            }
            else if (degrees >= 22.5 && degrees<=67.5) {
                index = 1;
            }
            else if (degrees >= 67.5 && degrees <= 112.5) {
                index = 2;
            }
            else if (degrees >= 112.5 && degrees <= 157.5) {
                index = 3;
            }
            else if (degrees >= 157.5 && degrees <= 202.5) {
                index = 4;
            }
            else if (degrees >= 202.5 && degrees <= 247.5) {
                index = 5;
            }
            else if (degrees >= 247.5 && degrees <= 292.5) {
                index = 6;
            }
            else if (degrees >= 292.5 && degrees <= 337.5) {
                index = 7;
            }
            dirname = directArrOne[index];
            return dirname;
        }
        function getDirYName(degrees) {
            var directArrOne = ["北", "东北", "东", "东南", "南", "西南", "西", "西北"];
            directArrOne = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
            var dirname = "";
            var index = 0;
            if (337.5 <= degrees && degrees <= 360) {

            }
            else if (0 <= degrees && degrees <= 22.5) {
                index = 0;
            }

            }
            dirname = directArrOne[index];
            return dirname;
        }

        function chartFLFX(ChartName, flfxdata) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var directionMap = {};
            echarts.util.each(
                ['W', 'SW', 'S', 'SE', 'E', 'NE', 'N', 'NW'],
                function (name, index) {
                    directionMap[name] = Math.PI / 8 * index;
                }
            );
            var dims = {
                time: 0,//时间
                windSpeed: 1,//风速
                winddir:4,//风向
                R: 2,
                waveHeight: 3,
                weatherIcon: 2,
                minTemp: 3,
                maxTemp: 4
            };
            var arrowSize = 12;
            var weatherIconSize = 45;
            function renderArrow(param, api) {
                var point = api.coord([
                    api.value(dims.time),
                    api.value(dims.windSpeed)
                ]);

                return {
                    type: 'path',
                    shape: {
                        pathData: 'M31 16l-15-15v9h-26v12h26v9z',
                        x: -arrowSize / 2,
                        y: -arrowSize / 2,
                        width: arrowSize,
                        height: arrowSize
                    },
                    rotation: directionMap[api.value(dims.R)],
                    position: point,
                    style: api.style({
                        stroke: '#555',
                        lineWidth: 1
                    })
                };
            }
            option = {
                "title": {
                    "text": mini.get("STCD").getText()+"站风向风速预报",
                    "left": "left"
                },
                tooltip: {
                    trigger: 'axis',
                    formatter: function (params) {
                        return [
                            echarts.format.formatTime('yyyy-MM-dd', params[0].value[dims.time])
                            + ' ' + echarts.format.formatTime('hh:mm', params[0].value[dims.time]),
                            '风速：' + params[0].value[dims.windSpeed],
                            '风向：' + params[0].value[dims.R] + "(" + params[0].value[dims.winddir]+")",
                        ].join('<br>');
                    }
                },
                grid: {
                    left: 40,
                    right: 20,
                    bottom: 80,
                    top: 80,
                    containLabel: true
                },
                "xAxis": {
                    "type": "time",
                    "maxInterval": 86400000,
                    "splitLine": {
                        "lineStyle": {
                            "color": "#ddd"
                        }
                    }
                },
                "yAxis": [{
                    //"name": "风速(m/s)",
                    "nameLocation": "middle",
                    "nameGap": 35,
                    "axisLine": {
                        "lineStyle": {
                            "color": "#666"
                        }
                    },
                    "splitLine": {
                        "lineStyle": {
                            "color": "#ddd"
                        }
                    }
                },
                    {
                        //"name": "风速(m/s)",
                        "nameLocation": "middle",
                        "nameGap": 35,
                        "axisLine": {
                            "lineStyle": {
                                "color": "#666"
                            }
                        },
                        "splitLine": {
                            "lineStyle": {
                                "color": "#ddd"
                            }
                        }
                    }],
                "visualMap": {
                    "type": "piecewise",
                    "orient": "horizontal",
                    "left": "center",
                    "bottom": 10,
                    "pieces": [{
                        "gte": 17,
                        "color": "#18BF12",
                        "label": "大风（>=17节）"
                    }, {
                        "gte": 11,
                        "lt": 17,
                        "color": "#f4e9a3",
                        "label": "中风（11  ~ 17 节）"
                    }, {
                        "lt": 11,
                        "color": "#D33C3E",
                        "label": "微风（小于 11 节）"
                    }],
                    "seriesIndex": 0,
                    "dimension": 1
                },
                "series": [
                    {
                    "type": "custom",

                        "x": 0,

                    },
                        "data": flfxdata,
                    "z": 10

                    {

        function chartFLFXNew(ChartName, flfxdata,xData) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var data = flfxdata;
            var seriesData = [], seriesDataFS = [], seriesDataFX=[];
            data.filter(item => {
                seriesData.push({
                    value: item.WindSpeed,
                    symbol: 'path://M31 16l-15-15v9h-26v12h26v9z',
                    symbolSize: [22, 10],
                    symbolRotate: -90 - item.WindDir,
                    msg: item.WindDir
                });
