    <script>
        mini.parse();

        $(function () {
            if (DD_ID != null) {
                $("#rightBox").hide();
            }

            title = '区域水量<span class="dwCss">(单位:万方)</span>&nbsp;&nbsp;&nbsp;';
            $("#spanTitle").html(title);
            createGrid();
            setTimeout(function () {
                map.getLayer("bj").setVisibility(false);

                //loadLayer();
                countyLayer1 = new esri.layers.GraphicsLayer();

        function createGrid() {
            grid.set({
                columns: [
                    { type: "indexcolumn", width: 20 },
                    { field: "stnm", width: 60, headerAlign: "center", align: "left", header: "区域名称", },
                    { field: "rsl", width: 60, headerAlign: "center", align: "center", allowSort: true, header: "来水量" },
                    { field: "csl", width: 60, headerAlign: "center", align: "center", allowSort: true, header: "出水量" },
                    { field: "clsl", width: 60, headerAlign: "center", align: "center", allowSort: true, header: "降雨产流" },
                ]
            });
        }
        function onSTCDChanged(e) {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            var time = new Date(new Date(nodes.dd_TM)).format("yyyy/MM/dd HH:mm:ss");
            var etime = new Date(new Date(nodes.dd_CHECKBY)).format("yyyy/MM/dd HH:mm:ss");
            BreakLayerLoad();

        }
        function BreakLayerLoad() {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            var time = new Date(new Date(nodes.dd_TM)).format("yyyy-MM-dd HH:mm:ss");
            var etime = new Date(new Date(nodes.dd_CHECKBY)).format("yyyy-MM-dd HH:mm:ss");
            showJCTips(time + "至" + etime);
            //水量分布
            var s_where = { dd_id: nodes.dd_ID };
            //GetJosns("AREASL", s_where, "AREASL");
			app.post("SWZZ_MODE_BDMS_PREDICT/AREASL",s_where,(data)=>{
				JosnSel(data,"AREASL")
			})
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
				//console.log(data.data)
				data.data.sort((a,b)=>{
					return new Date(b.dd_TM).getTime() - new Date(a.dd_TM).getTime();
				})
                mini.get("STCD").setData(data.data);
                mini.get("STCD").select(0);
                var _stcd = mini.get("STCD");
                var nodes = _stcd.getSelected();
				console.log(nodes)
                var time = new Date(new Date(nodes.dd_TM)).format("yyyy/MM/dd HH:mm:ss");
                var _stcd = mini.get("STCD");
                var nodes = _stcd.getSelected();
                var time = new Date(new Date(nodes.dd_TM)).format("yyyy/MM/dd HH:mm:ss");
                var etime = new Date(new Date(nodes.dd_CHECKBY)).format("yyyy/MM/dd HH:mm:ss");
                BreakLayerLoad();
            }
            else if (typeID == "AREASL") {
                gridLoad(data.data);
                //画颜色
                queryComplete(data.data);
            }
        }
        function gridLoad(data) {
            grid.setData(data);
        }
        var isComp = 0;
        function loadLayer() {
            var url = swzzAreaUrl;
            layer_hw = new esri.layers.FeatureLayer(url + "/0", {
                //注意这里的mode一定要指定MODE_SNAPSHOT，否则每次放大或缩小或者是平移都会执行FeatureLayer的update-end操作
                //mode: esri.layers.FeatureLayer.MODE_ONDEMAND,//esri.layers.FeatureLayer.MODE_SNAPSHOT,
                //输出所有属性
                outFields: ["*"],
                id: "swzzArea"
            });
            //添加图层
            map.addLayer(layer_hw);
            
            layer_hw.on("load", function () {
                //var div = document.getElementById("map_zoom_slider").style;
                //div.visibility = "collapse";
            });
            layer_hw.on("update-end", function () {
                if (isComp == 0) {
                    isComp++;
                    //GetJosns("MODE_DD_SOLUTIONSel", { "DD_STATUS": "1", DD_ID: DD_ID }, "Sel");
					app.post("SWZZ_MODE_DD_SOLUTION/findByDD_IDandDD_status",{"dd_STATUS": "1", dd_ID: DD_ID},(data)=>{
						JosnSel(data,"Sel")
					})
                }
            });
        }
        //查询结果换颜色
        var labels = new Array();
        var _globallevel = 5;
        function queryComplete(result) {
            countyLayer1.clear();
            require(["esri/geometry/Point",
                "esri/graphic",
                "myJs/MapText",
                "esri/symbols/PictureMarkerSymbol",
                "esri/symbols/SimpleFillSymbol",
                "esri/symbols/SimpleLineSymbol",
                "esri/Color",
                "esri/InfoTemplate",
                "esri/dijit/InfoWindow",
                "esri/layers/GraphicsLayer",
                "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "esri/geometry/Polygon", "dojo/_base/lang","dojo/domReady!"
            ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color,
                InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, Polygon, lang) {
                _destroy();
                $.get(
                    "../../Common/SHSWZZArea2000.json",//json路径
                    lang.hitch(this, function (data, status) {
                        if (status === "success") {
                            var features = data.features;
                            features.forEach(function (feature) {
                                var allrings = feature.geometry.coordinates;
                                var gra = feature.properties;
                                var mc = gra.name;
                                var arr = result.filter(function (item) {
                                    return item.stnm == mc;
                                });
                                if (arr.length > 0) {
                                    var center = [];
									arr[0].STNM = arr[0].stnm;
                                    center = getJWD(arr[0].stnm);
                                    var cls = "  waterText";
                                    var point = new Point({
                                        "x": center[0],
                                        "y": center[1],
                                        "spatialReference": {
                                            "wkid": 4326
                                        }
                                    });
                                    if (Number(arr[0].rsl) > Number(arr[0].rsl)) {
                                        cls += " oneslText ";
                                    } else {
                                        cls += " slText ";
                                    }
                                    var textStr = "";
                                    //textStr+="<span style='font-weight:600;'>"+item.name+"</span><br>";
                                    textStr += "<span style=\"line-height: 22px;\">";
                                    textStr += "<div style='width:90%;text-align: center;margin: 0 auto; margin-top: -10px;'>" + arr[0].STNM + "</div>";
                                    textStr += "&nbsp;来：<span style='font-size:18px;'>" + arr[0].rsl;
                                    if (arr[0].rsl.toString().length < 3) {
                                        textStr += "&nbsp;&nbsp;&nbsp;";
                                    }
                                    textStr += "</span><br>";
                                    textStr += "&nbsp;出：<span style='font-size:18px;'>" + arr[0].csl;
                                    if (arr[0].csl.toString().length < 3) {
                                        textStr += "&nbsp;&nbsp;&nbsp;";
                                    }
                                    textStr += "</span><br>";
                                    textStr += "&nbsp;产：<span style='font-size:18px;'>";
                                    var CLSL = 0;
                                    if (arr[0].clsl != undefined) {
                                        CLSL = arr[0].clsl;
                                        if (arr[0].clsl.toString().length < 3) {
                                            textStr += "&nbsp;&nbsp;&nbsp;";
                                        }
                                    }
                                    textStr += CLSL;
                                    textStr += "</span>";

                                    textStr += "</span>";
                                    var _align = "bottom";
                                    if (textStr == "") {
                                        textStr = "—";
                                    }
                                    var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 12);
                                    labels.push(label);

                                    
                                }
                                var polygon = new Polygon(allrings);
                                var colorStr = "#005CE6";
                                var fillColorStr = [0, 92, 230, 0];
                                var fs = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                    new SimpleLineSymbol(SimpleLineSymbol.STYLE_DASHDOT,
                                        new Color(colorStr), 2), new Color(fillColorStr)
                                );
                                var lineSymbol = new SimpleFillSymbol("solid", new SimpleLineSymbol("solid",
                                    new dojo.Color(colorStr), 1),
                                    new dojo.Color(fillColorStr));
                                var g3 = new Graphic(polygon, lineSymbol);
                                g3.attributes = arr[0];
                                countyLayer1.add(g3);
                            }, this);
                        }
                    }),
                    "json"
                );
                //for (var s = 0; s < layer_hw.graphics.length; s++) {
                //    var gra = layer_hw.graphics[s];
                    
                //}
                countyLayer1.on("click", function (e) {
                    var graphic = e.graphic;
                    var attributes = graphic.attributes;
                    var title = attributes.TITLE;
                });
            });
        }
        function getAreaColor(zValue, type) {
            var color;
            var colorTM;
            var colors = ["#C1F1FF", "#82E2FF", "#2FCFFF", "#00B8EF", "#0098C6", "#9797FF", "#6363FF", "#2424FF", "#0000D0",
                "#000087", "#EF0088", "#EF0004", "#7D0003"];
            var colorsTM = [
                [193, 241, 255, 0.45],
                [130, 226, 255, 0.45],
                [47, 207, 255, 0.45],
                [0, 184, 239, 0.45],
                [0, 152, 198, 0.45],
                [151, 151, 255, 0.45],
                [99, 99, 255, 0.45],
                [36, 36, 255, 0.45],
                [0, 0, 208, 0.45],
                [0, 0, 135, 0.45],
                [239, 0, 136, 0.45],
                [239, 0, 4, 0.45],
                [125, 0, 3, 0.45]
            ];
            if (zValue > 0 && zValue <= 20) {
                color = colors[0];
                colorTM = colorsTM[0];
            }
            else if (zValue > 20 && zValue <= 50) {
                color = colors[1];
                colorTM = colorsTM[1];
            }
            else if (zValue > 50 && zValue <= 80) {
                color = colors[2];
                colorTM = colorsTM[2];
            }
            else if (zValue > 80 && zValue <= 100) {
                color = colors[3];
                colorTM = colorsTM[3];
            }
            else if (zValue > 100 && zValue <= 150) {
                color = colors[4];
                colorTM = colorsTM[4];
            }
            else if (zValue > 150 && zValue <= 200) {
                color = colors[5];
                colorTM = colorsTM[5];
            }
            else if (zValue > 200 && zValue <= 300) {
                color = colors[6];
                colorTM = colorsTM[6];
            }
            else if (zValue > 300 && zValue <= 500) {
                color = colors[7];
                colorTM = colorsTM[7];
            }
            else if (zValue > 500 && zValue <= 1000) {
                color = colors[8];
                colorTM = colorsTM[8];
            }
            else if (zValue > 1000 && zValue <= 2000) {
                color = colors[9];
                colorTM = colorsTM[9];
            }
            else if (zValue > 2000 && zValue <= 5000) {
                color = colors[10];
                colorTM = colorsTM[10];
            }
            else if (zValue > 5000 && zValue < 8000) {
                color = colors[11];
                colorTM = colorsTM[11];
            }
            else if (zValue > 8000) {
                color = colors[12];
                colorTM = colorsTM[12];
            }
            if (type == "fill") {
                return colorTM;
            } else {
                return color;
            }
        }

        function showJCTips(tm) {

            mini.showTips({
