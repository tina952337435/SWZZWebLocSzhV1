    <title>2.5km网格降雨预报</title>
    <link href="../../arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" />
    <style type="text/css">
        .mini-grid-row-alt {
            background: #ffffff !important;
        }

        .btn {
            margin-top: 3px;
            width: 70px;
            text-indent: 0px;
            font-size: 14px;
            height: 30px;
            text-align: center;
            line-height: 25px;
            float: right;
            margin-right: 10px;
        }

        .onlytab {
            width: 90% !important;
            height: 40px;
            margin: auto;
        }

        .onlytab li {
            list-style: none;
            border: 1px #3291f9 solid;
            float: left;
            background-color: White;
            width: 50% !important;
            height: 30px;
            font: 14px/30px "arial";
            text-align: center;
        }

        .start {
            border-radius: 5px 0 0 5px;
        }

        .end {
            border-radius: 0 5px 5px 0;
        }

        .onlyli:hover {
            background-color: #3291f9;
            color: White;
            cursor: pointer;
        }

        .onlyliHover {
            background-color: #3291f9 !important;
            color: White;
            cursor: pointer;
        }

        .rain-cell-0 {
            background-color: #ffffff;
            color: #333;
        }
        .rain-cell-1 {
            background-color: #A6F28E;
            color: #333;
        }
        .rain-cell-2 {
            background-color: #007B00;
            color: #fff;
        }
        .rain-cell-3 {
            background-color: #3DBCF9;
            color: #333;
        }
        .rain-cell-4 {
            background-color: #0000F9;
            color: #fff;
        }
        .rain-cell-5 {
            background-color: #FB3DFA;
            color: #333;
        }
        .rain-cell-6 {
            background-color: #7B0000;
            color: #fff;
        }
    </style>

    <link href="../../arcgis_js_api/library/3.31/3.31/esri/css/esri.css" rel="stylesheet" type="text/css" />
    <script src="../../arcgis_js_api/myJs/mapConfig.js" type="text/javascript"></script>

    <script src="../../Common/boot.js" type="text/javascript"></script>
    <script src="../../Common/jquery.min.js"></script>
    <script src="../../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
</head>

<body style="font-size:14px;font-family:arial;">
    <div class="flex" style="width: 100%; height: 100%; overflow: hidden; margin: auto">
        <div style="width: 98%; height:140px;" class="right box">
            <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td>
                        <span class="label" style="width: 70px;line-height: 30px;margin-left: 5px;">预报时长：</span>
                        <ul class="onlytab" style="width:160px !important;margin:0px;float: left;">
                            <li id="DurLi6" onclick="OnClickDuration(this.id,'12')" class="onlyli start">6h</li>
                            <li id="DurLi48" onclick="OnClickDuration(this.id,'11')" class="onlyli end onlyliHover">48h</li>
                        </ul>
                    </td>
                </tr>
                <tr>
                    <td>
                        <span class="label" style="width: 70px;line-height: 30px;margin-left: 5px;">区域类型：</span>
                        <ul class="onlytab" style="width:200px !important;margin:0px;float: left;">
                            <li id="TypeLi1" onclick="OnClickType(this.id,'1')" class="onlyli start onlyliHover">行政区划</li>
                            <li id="TypeLi2" onclick="OnClickType(this.id,'2')" class="onlyli end">水利分片</li>
                        </ul>
                    </td>
                </tr>
                <tr>
                    <td>
                        <span style="float:left;margin-left: 5px;">
                            <span class="label" style="width: 70px;line-height: 30px;">起报时间：</span>
                            <input id="STIME" class="mini-datepicker" style="width:105px;" format="yyyy-MM-dd" />
                            <input id="HOUR" name="HOUR" class="mini-combobox" style="width:65px;" textfield="text"
                                valuefield="id" allowinput="true" onvaluechanged="onHourChanged" />
                            <input id="Minute" name="Minute" class="mini-combobox" style="width:70px;" textfield="text"
                                valuefield="id" allowinput="true" />
                        </span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <a style="margin-top:1px;margin-left:2px;" class="btn" onclick="btnQuery()">查询</a>
                    </td>
                </tr>
            </table>
        </div>
        <div class="biaoheader">
            <p class="NONEp"></p>
            2.5km网格降雨预报<span class="dwCss">(单位:mm)</span>
        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 98%; height: 100%; margin: auto;"
            showpager="false" allowalternating="true" idfield="regionId" allowresize="false"
            ondrawcell="onDrawCell" onselectionchanged="onRowClick">
            <div property="columns">
                <div type="indexcolumn" width="50" headeralign="center" align="center">序号</div>
                <div field="regionName" width="120" align="center" headeralign="center" allowsort="false">区域名称</div>
                <div field="sumRain" width="120" align="center" headeralign="center" allowsort="true">累计雨量(mm)</div>
                <!-- <div field="initialTime" width="160" align="center" headeralign="center" allowsort="false">起报时间</div>
                <div field="validTime" width="160" align="center" headeralign="center" allowsort="false">预报截止时间</div> -->
            </div>
        </div>
    </div>
    <div id="dataShow" style="position:absolute;top:50%;left:50%;margin-left:-55px; font-size:28px; font-weight:bold; display:none">暂无数据</div>
    <!--页面载入显示-->
    <div id="dataLoad" style="display:none;">
        <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">
            <tr style="height: 50%">
                <td align="center">&nbsp;</td>
            </tr>
            <tr>
                <td align="center">
                    <img alt="" src="../../arcgis_js_api/myJs/images/wait1.gif" />
                </td>
            </tr>
            <tr>
                <td align="center">数据载入中，请稍后...</td>
            </tr>
            <tr style="height: 50%">
                <td align="center">&nbsp;</td>
            </tr>
        </table>
    </div>
</body>
<script type="text/javascript">
    mini.parse();
    var grid = mini.get("grid1");

    // 当前选中的参数
    var currentProductId = "11";  // 默认48h (productId=11为48h, 12为6h)
    var currentType = "1";        // 默认行政区划 (type=1行政区划, 2水利分片)
    var latestTimeData = "";      // 接口返回的最新起报时间（原始格式）
    var currentForecastData = []; // 当前查询到的预报数据

    // 地图相关
    var map = window.parent.map;
    var countyLayer1;
    var labels = [];
    var _globallevel = 5;

    grid.on("beforeload", function (e) {
        e.cancel = true;
    });

    /**
     * 根据预报时长设置小时/分钟下拉框数据
     */
    function setComboboxValue() {
        var hourData = [];
        var minuteData = [];
        if (currentProductId == "12") {
            for (var h = 0; h < 24; h++) {
                hourData.push({ "id": h, "text": h + "时" });
            }
            for (var m = 0; m < 60; m += 10) {
                minuteData.push({ "id": m, "text": m + "分" });
            }
            $("#Minute").show();
        } else {
            hourData = [{ "id": 8, "text": "8时" }, { "id": 20, "text": "20时" }];
            minuteData = [{ "id": 0, "text": "0分" }];
            $("#Minute").hide();
        }
        mini.get("HOUR").setData(hourData);
        mini.get("Minute").setData(minuteData);
    }

    function getSelectedTime() {
        var date = mini.get("STIME").getFormValue();
        var hour = mini.get("HOUR").getValue();
        var minute = mini.get("Minute").getValue();
        if (!date || hour == null || hour == undefined || minute == null || minute == undefined) {
            return null;
        }
        hour = parseInt(hour, 10);
        minute = parseInt(minute, 10);
        var hh = hour < 10 ? "0" + hour : "" + hour;
        var mm = minute < 10 ? "0" + minute : "" + minute;
        return date + "T" + hh + ":" + mm + ":00";
    }

    function onDrawCell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            value = e.value;
        if (field == "regionName" && (value == null || value === "")) {
            e.cellHtml = "中心片";
        }
        if ((field == "initialTime" || field == "validTime") && value) {
            e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
        }
    }

    function getAreaColor(zValue, type) {
        var color = "#ffffff";
        var colorTM = [255, 255, 255, 0];
        var colors = ["#A6F28E", "#007B00", "#3DBCF9", "#0000F9", "#FB3DFA", "#7B0000"];
        var colorsTM = [
            [166, 242, 142, 0.45],
            [0, 123, 0, 0.45],
            [61, 188, 249, 0.45],
            [0, 0, 249, 0.45],
            [251, 61, 250, 0.45],
            [123, 0, 0, 0.45]
        ];
        if (zValue > 0 && zValue <= 10) {
            color = colors[0]; colorTM = colorsTM[0];
        } else if (zValue > 10 && zValue <= 25) {
            color = colors[1]; colorTM = colorsTM[1];
        } else if (zValue > 25 && zValue <= 50) {
            color = colors[2]; colorTM = colorsTM[2];
        } else if (zValue > 50 && zValue <= 100) {
            color = colors[3]; colorTM = colorsTM[3];
        } else if (zValue > 100 && zValue <= 200) {
            color = colors[4]; colorTM = colorsTM[4];
        } else if (zValue > 200) {
            color = colors[5]; colorTM = colorsTM[5];
        }
        if (type == "fill") return colorTM;
        return color;
    }

    /**
     * 水利分片中心点坐标（2000坐标系）
     */
    function getJWD(name) {
        var center = [];
        switch (name) {
            case "嘉宝北片": center = [-15196.4, 15309.4]; break;
            case "蕴南片": center = [481.1, 6771.0]; break;
            case "中心片": center = [-2004.6, -1983.8]; break;
            case "淀北片": center = [-10318.7, -6509.2]; break;
            case "青松片": center = [-25258.7, -13524.8]; break;
            case "淀南片": center = [-6136.9, -20025.3]; break;
            case "浦东片": center = [22116.1, -22209.7]; break;
            case "太北片": center = [-47233.6, -20757.0]; break;
            case "太南片": center = [-38930.5, -27188.5]; break;
            case "浦南西片": center = [-36936.0, -37704.3]; break;
            case "浦南东": center = [-17710.0, -43992.3]; break;
            case "商榻片": center = [-53796.5, -12985.9]; break;
            case "浦东片浦东新区": center = [22302.3, -17147.6]; break;
            case "浦东片奉贤区": center = [6458.5, -38181.0]; break;
            case "浦南东片": center = [-16662.8, -46240.0]; break;
            case "青松片松江区": center = [-23314.5, -22476.4]; break;
            case "浦东片闵行区": center = [4350.1, -20672.7]; break;
            case "青松片青浦区": center = [-31534.3, -8904.8]; break;
            default: break;
        }
        return center;
    }

    /**
     * 在地图上绘制降雨分区图
     * type=1 行政分区 → 上海市2000.json（有centroid属性）
     * type=2 水利分片 → SHSWZZArea2000.json（用getJWD获取中心点）
     */
    function MapRainfallArea() {
        if (!currentForecastData || currentForecastData.length === 0) return;
        countyLayer1.clear();
        _destroy();

        var jsonPath, isWaterArea;
        if (currentType == "2") {
            jsonPath = "../../Common/SHSWZZArea2000.json";
            isWaterArea = true;
        } else {
            jsonPath = "../../Common/shArea2000.json";
            isWaterArea = false;
        }

        require(["esri/geometry/Point",
            "esri/graphic",
            "myJs/MapText",
            "esri/symbols/PictureMarkerSymbol",
            "esri/symbols/SimpleFillSymbol",
            "esri/symbols/SimpleLineSymbol",
            "esri/Color",
            "esri/InfoTemplate",
            "esri/dijit/InfoWindow",
            "esri/layers/GraphicsLayer",
            "esri/geometry/webMercatorUtils",
            "esri/symbols/TextSymbol",
            "esri/symbols/Font",
            "esri/geometry/Polygon",
            "dojo/_base/lang",
            "dojo/domReady!"
        ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color,
            InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, Font, Polygon, lang) {

            $.get(jsonPath, lang.hitch(this, function (data, status) {
                if (status !== "success") return;
                var features = data.features;
                features.forEach(function (feature) {
                    var properties = feature.properties;
                    var allrings = feature.geometry.coordinates;
                    var mc = properties.name || properties.NAME || "";

                    // 匹配API返回的regionName
                    // 水利片：regionName为空=中心片，青松片/浦东片需前缀匹配子区域
                    var arr = currentForecastData.filter(function (item) {
                        if (isWaterArea) {
                            if (item.regionName === "" && mc == "中心片") return true;
                            if (item.regionName !== "" && mc.indexOf(item.regionName) === 0) return true;
                            return false;
                        } else {
                            return item.regionName == mc || item.regionName == mc + "区";
                        }
                    });

                    if (arr.length > 0) {
                        var rainValue = parseFloat(arr[0].sumRain);
                        var textStr = rainValue.toFixed(1) + "mm";

                        // 获取中心点
                        var centerX, centerY;
                        if (isWaterArea) {
                            var c = getJWD(mc);
                            centerX = c[0]; centerY = c[1];
                        } else {
                            centerX = properties.centroid ? properties.centroid[0] : 0;
                            centerY = properties.centroid ? properties.centroid[1] : 0;
                        }

                        // 绘制填充多边形
                        var colorStr = getAreaColor(rainValue, "");
                        if (colorStr != null && colorStr != "" && colorStr != undefined) {
                            var fillColorStr = getAreaColor(rainValue, "fill");
                            var processRings = function (rings) {
                                var area = new Polygon(rings);
                                var symbol = new SimpleFillSymbol(
                                    SimpleFillSymbol.STYLE_SOLID,
                                    new SimpleLineSymbol(SimpleLineSymbol.STYLE_SOLID,
                                        new Color(colorStr), 1),
                                    new Color(fillColorStr)
                                );
                                var g3 = new Graphic(area, symbol);
                                g3.attributes = arr[0];
                                countyLayer1.add(g3);
                            };

                            // 处理MultiPolygon和Polygon两种格式
                            if (feature.geometry.type === "MultiPolygon") {
                                allrings.forEach(function (rings) {
                                    processRings(rings);
                                }, this);
                            } else {
                                processRings(allrings);
                            }
                        }

                        // 标注降雨量和区域名称
                        if (centerX != null && centerY != null) {
                            var point = new Point({
                                "x": centerX, "y": centerY,
                                "spatialReference": { "wkid": 4326 }
                            });
                            var cls = "  waterText";
                            var _align = "bottom";
                            if (textStr == "") textStr = "—";
                            var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 12);
                            labels.push(label);

                            var font = new Font("12px", Font.STYLE_NORMAL, Font.VARIANT_NORMAL, Font.WEIGHT_BOLDER);
                            var displayName = isWaterArea ? mc : (arr[0].regionName || mc);
                            var textSymbol = new TextSymbol(displayName, font, new Color("black"));
                            var nameGraphic = new Graphic(point, textSymbol);
                            countyLayer1.add(nameGraphic);
                        }
                    }
                }, this);

                // 设置提示
                var titleText = isWaterArea ? "水利分区预报降雨图" : "行政分区预报降雨图";
                window.parent.showQXTips(getSelectedTime(), titleText);
            }), "json");
        });
    }

    function queryLatestTime(callback) {
        var url = "../waterlogging_api/nwp/productLatestTime?productId=" + currentProductId;
        app.post(url, {}, function (res) {
            if (res.code === 200 && res.data) {
                latestTimeData = res.data;
                var dt = new Date(latestTimeData);
                mini.get("STIME").setValue(dt.format("yyyy-MM-dd"));
                mini.get("HOUR").setValue(parseInt(dt.format("H"), 10));
                mini.get("Minute").setValue(parseInt(dt.format("m"), 10));
                if (callback) callback();
            } else {
                $("#dataLoad").hide();
            }
        }, function (err) {
            console.error("获取最新起报时间失败:", err);
            $("#dataLoad").hide();
        });
    }

    function queryForecastData() {
        var selectedTime = getSelectedTime();
        if (!selectedTime) {
            mini.alert("请选择起报时间");
            return;
        }
        $("#dataLoad").show();
        var url = "../waterlogging_api/nwp/prePolygonForecast?productId=" + currentProductId
            + "&productInitialTime=" + encodeURIComponent(selectedTime)
            + "&type=" + currentType;
        app.post(url, {}, function (res) {
            $("#dataLoad").hide();
            if (res.code === 200 && res.data && res.data.length > 0) {
                currentForecastData = res.data;
                grid.setData(res.data);
                $("#dataShow").hide();
                MapRainfallArea();
            } else {
                currentForecastData = [];
                grid.setData([]);
                $("#dataShow").show();
                if (countyLayer1) countyLayer1.clear();
            }
        }, function (err) {
            console.error("查询预报数据失败:", err);
            $("#dataLoad").hide();
            currentForecastData = [];
            grid.setData([]);
            $("#dataShow").show();
        });
    }

    function OnClickDuration(objID, productId) {
        var $li = $("#" + objID);
        $li.siblings().removeClass("onlyliHover");
        $li.addClass("onlyliHover");
        currentProductId = productId;
        setComboboxValue();
        queryLatestTime(function () {
            queryForecastData();
        });
    }

    function OnClickType(objID, type) {
        var $li = $("#" + objID);
        $li.siblings().removeClass("onlyliHover");
        $li.addClass("onlyliHover");
        currentType = type;
        queryForecastData();
    }

    function btnQuery() {
        queryForecastData();
    }

    function onRowClick(e) {
        var record = grid.getSelected();
        if (record && record.rainValues && record.rainValues.length > 0) {
            var selectedTime = getSelectedTime();
            var url = "../../DanZhan/NwpRainProcess.html"
                + "?regionName=" + encodeURIComponent(record.regionName)
                + "&productId=" + currentProductId
                + "&productInitialTime=" + selectedTime
                + "&type=" + currentType;
            openChart(url, record.regionName + " 雨量过程", record.regionName);
        }
    }

    window.onload = function () {
        setComboboxValue();
        countyLayer1 = CreateLayer("nwpRainLayer");
        queryLatestTime(function () {
            queryForecastData();
        });
    };
</script>

</html>
