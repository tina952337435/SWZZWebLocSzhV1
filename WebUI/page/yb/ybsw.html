<body>
    <div class="flex" style="width:100%; height: 100%; overflow: hidden;">
        <!--<div class="biaoheader">
        <p class="NONEp">
        </p>
        条件选择</div>-->
        <div class="right box" style="height: 45px;">
            <div class="demo1" style="float: left;width:100%;">
                <div class="inline">
                    <div style="width: 100%; height: 35px; float: left;">
                        方案选择：
                        <input id="STCD" name="STCD" class="mini-combobox" style="width: 180px;"
                               textfield="DD_NAME" valuefield="DD_ID" allowinput="true" onvaluechanged="onSTCDChanged" />
                        <a class="mini-button" onclick="OpenHref()" style="width:60px;">报表</a>
                    </div>
                </div>
            </div>
        </div>
        <div class="biaoheader">
            <p class="NONEp">
            </p>
            预报水位<span class="dwCss">(单位:m)</span>&nbsp;&nbsp;&nbsp;
            <!--<input id="thsq" name="thsq" class="mini-checkbox" checked="false" onvaluechanged="onValueChanged" />周边水情-->
            <img title="导出表格" src="../../arcgis_js_api/myJs/images/excel.png" onclick="ExportExcel('预报水位')" style="position: relative;
                top: 5px; right: 15px; float: right; cursor: pointer;" />
        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 99%; height: 100%; margin: auto;"
             showpager="false" idfield="STCD" allowresize="false" allowalternating="true" showemptytext="true"
             emptytext="暂无数据" alwaysshowemptytext="true"
             ondrawcell="ondrawcell" onselectionchanged="onSelectionChanged" sortMode="client">
            <div property="columns">
                <!--<div field="HNNM" width="80" align="center" headeralign="center">
        分区
    </div>-->
                <div field="STNM" width="80" align="center" headeralign="center">
                    站名
                </div>
                <div field="DATA" width="80" align="center" headeralign="center">
                    水位
                </div>
                <div field="MAXDATA" width="80" align="center" headeralign="center">
                    最高水位
                </div>
                <div field="TM" width="130" align="center" headeralign="center" visible="false">
                    时间
                </div>
            </div>
        </div>
    </div>
    <script src="ybsw.js" type="text/javascript"></script>
    <script type="text/javascript">
        ShowPage(); //map页面会调用
        function ShowPage() {
            openTL("mxsqtl");
        }
        mini.parse();
        var grid = mini.get("grid1");
        var myData = [];
        var mydt = [];
        var resultData = [];
        $(function () {
            //MapRainfall(true,"2020080308/20200804130000.png")
            GetJosns("MODE_DD_SOLUTIONSel", { "DD_STATUS": "1" }, "STCD");
        })
        function onSTCDChanged(e) {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            $.data(myData, "DD_ID", nodes.DD_ID);
            $.data(myData, "STM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
            $.data(myData, "TM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
            $.data(myData, "ETM", new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy/MM/dd HH:mm:ss"));
            search();
        }
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            //加载一个时刻
            //var s_where = { "SolutionID": $.data(myData, "DD_ID"), "typeID": "1", TM: $.data(myData, "STM") };
            //GetJosns("YBList", s_where, "Sel");
            //加载全部
            s_where = { "SolutionID": $.data(myData, "DD_ID"), "typeID": "1" };
            GetJosns("YBList", s_where, "SelAll");
        }
        function JosnSel(ResultData, typeID) {
            if (typeID == "Sel") {
                var tempData = ResultData.data;
                mydt = tempData;
                //window.parent.YBClick($.data(myData, "STM"), $.data(myData, "ETM"));

                //加载全部
                //s_where = { "SolutionID": $.data(myData, "DD_ID"), "typeID": "1" };
                //GetJosns("YBList", s_where, "SelAll");
            } else if (typeID == "SelAll") {
                var tempData = ResultData.data;
                mydt = tempData;
                window.parent.YBClick($.data(myData, "STM"), $.data(myData, "ETM"));
            } else if (typeID == "STCD") {
                mini.get("STCD").setData(ResultData.data);
                mini.get("STCD").select(0);
                var _stcd = mini.get("STCD");
                var nodes = _stcd.getSelected();
                $.data(myData, "DD_ID", nodes.DD_ID);
                $.data(myData, "STM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
                $.data(myData, "TM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
                $.data(myData, "ETM", new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy/MM/dd HH:mm:ss"));
                
                setTimeout(function () {
                    search();
                }, 500)
            }
        }
        function gridLoad() {
            window.parent.showJCTips($.data(myData, "TM"));
            var result = mydt.filter(function (e) {
                return new Date(convertToDate(e.TM)).format("yyyy/MM/dd HH:mm:ss") == new Date($.data(myData, "TM")).format("yyyy/MM/dd HH:mm:ss");
            });
            //console.error(JSON.stringify(result));
            resultData = result;
            getInfo();
            tlCount();
            mini.unmask(document.body);
        }

        var qcCount = 0;
        var zcCount = 0;
        var bzCount = 0;
        var sureCount = 0;
        var warnCount = 0;

        function getInfo() {
            qcCount = 0;
            zcCount = 0;
            sureCount = 0;
            warnCount = 0;

            var value1 = getTLObj("mxcb_waterCJ").checked;
            var value2 = getTLObj("mxcb_waterZC").checked;
            var value3 = getTLObj("mxcb_waterCB").checked;
            var item = resultData;

            if (item == null)
                return;
            dt = [];
            for (var i = 0; i < item.length; i++) {
                item[i].STATE = 0;
                var z = parseFloat(item[i].DATA);
                var wrz = parseFloat(item[i].WRZ);
                var grz = parseFloat(item[i].GRZ);
                item[i].DATA = z;
                if (item[i].DATA == null || item[i].DATA == "" || item[i].DATA == undefined) {
                    item[i].STATE = 4;
                    qcCount++;
                    dt.push(item[i]);
                }
                else if (z >= grz && grz != 0) {
                    item[i].STATE = 2;
                    sureCount++;
                    if (value3) {
                        dt.push(item[i]);
                    }
                }
                else if (z >= wrz && wrz != 0) {
                    item[i].STATE = 1;
                    //console.error(item[i].STCD + "    wrz:" + wrz + "@z:" + z + "@grz:" + grz);
                    warnCount++;
                    if (value1) {
                        dt.push(item[i]);
                    }
                }
                else {
                    item[i].STATE = 0;
                    zcCount++;
                    if (value2) {
                        dt.push(item[i]);
                    }
                }
            }
            grid.setData(dt);
            grid.sortBy("SORT");
            addMark(dt);
        }
        function tlCount() {
            getTLObj("mxwaterCJ").innerHTML = warnCount;
            getTLObj("mxwaterZC").innerHTML = zcCount;
            getTLObj("mxwaterCB").innerHTML = sureCount;
        }
        function tlChecked() {
            getInfo();
        }
        function GetMap(startDate, objSTCD) {
            var _GlobalTab = window.parent.tabs.getActiveTab();
            var _url = _GlobalTab.url;
            if (_url.lastIndexOf("ybsw.html") > -1) {
                $.data(myData, "TM", new Date(startDate).format("yyyy/MM/dd HH:mm:ss"));
                gridLoad();
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            var record = e.record;

            if (field == "STNM") {
                var sColor = "";
                if (row.YBZ == null) {
                    sColor = "style='color:#EAEAEA'";
                }
                e.cellHtml = '<a title="' + value + '" ' + sColor + '  href="JavaScript:Trans(\'' + record.STCD + '\',\'' + record.STNM + '\')">' + value + '</a>';
            }
        }
        function Trans(stcd, stnm) {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            var stime = new Date(convertToDate(nodes.DD_TM)).format("yyyy-MM-dd HH:mm:ss");
            var etime = new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy-MM-dd HH:mm:ss");
            var ZU_ID = nodes.DD_MIND;
            openChart("/DanZhan/DanZHanSel.html?stcd=" + stcd + "&stnm=" + (stnm) + "&stime=" + stime + "&etime=" + etime + "&PLAN_N=" + nodes.DD_ID + "&ZU_ID=" + ZU_ID, stnm + "预测水位过程线", "1200@660");
        }
        function onSelectionChanged(e) {
            var grid = e.sender;
            var record = grid.getSelected();
            if (record) {
                loc(record.LGTD, record.LTTD);
            }
        }
        function loc(lgtd, lttd) {
            if (lgtd == undefined && lttd == undefined) {
                //mini.alert("缺失经纬度");
            } else {
                window.parent.setMapZoom(8);
                dyCenter(lgtd, lttd);
            }
        }
        function OpenHref() {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            window.parent.window.parent.OpenTab("", "调度方案详细信息", "/DD_MX/ResultsRelease.html?ID=" + nodes.ID + "&DD_ID=" + nodes.DD_ID + "&FA_ID=" + nodes.DD_EVALUE + "&stime=" + $.data(myData, "STM") + "&etime=" + $.data(myData, "ETM") + "&key=&type=list");
        }
    </script>
</body>
</html>
