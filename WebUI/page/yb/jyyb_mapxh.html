    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);
        grid.setData(arr);
    }

    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.total > 0) {
                $.data(myData, "resultData", ResultData.data);
                resultData = ResultData.data;
                resultData = groupBy(resultData, "TM");
                var arr = [];
                for (var num = 0; num < resultData.length; num++) {
                    arr.push(resultData[num][0]);
                }
                resultData = [];
                resultData = arr;
                getInfo();
                selectRow(0);
                $('#dataShow').hide();
            } else {
                resultData = [];
                getInfo();
                $('#dataShow').show();
            }
            $("#dataLoad").hide();
        }
        else if (typeID == "YBSel") {
            if (ResultData.total > 0) {
                var TM = new Date(new Date(ResultData.data.ybtm)).format("yyyy-MM-dd HH:mm:ss");
                mini.get("STIME").setValue(TM);
                $.data(myData, "YBTM", TM);
                var HOUR = new Date(new Date(ResultData.data.ybtm)).format("HH");
                mini.get("HOUR").setValue(HOUR);
                mini.get("STIME").setValue(TM);
            } else {
                var TM = new Date().format("yyyy-MM-dd");
                mini.get("STIME").setValue(TM);
                mini.get("HOUR").select(0);
            }
            countyLayer1 = CreateLayer("Area_Layer1");
            countyLayer1.on("click", function (e) {
                var graphic = e.graphic;
                var attributes = graphic.attributes;
                var title = attributes.NAME;
                trans(title);
            });
            BreakLayerLoad();
        }
    }

    function MapRainfallArea(tm) {
        var result = $.data(myData, "resultData");
        countyLayer1.clear();
        require(["esri/geometry/Point",
            "esri/graphic",
            "myJs/MapText",
            "esri/symbols/PictureMarkerSymbol",
            "esri/symbols/SimpleFillSymbol",
            "esri/symbols/SimpleLineSymbol",
            "esri/Color",
            "esri/InfoTemplate",
            "esri/dijit/InfoWindow",
            "esri/layers/GraphicsLayer",
            "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "esri/symbols/Font",
            "dojo/_base/lang",
            "esri/geometry/Polygon",
            "dojo/domReady!"
        ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color, InfoTemplate, InfoWindow,
            GraphicsLayer, webMercatorUtils, TextSymbol, Font, lang,Polygon) {
            _destroy();
            result = result.filter(function (item) {
                return new Date(convertToDate(item.TM)).format("yyyy-MM-dd HH:mm:ss") == tm;
            });
            $.get(
                "../../Common/shArea2000.json",//json路径
                lang.hitch(this, function (data, status) {
                    if (status === "success") {
                        var features = data.features;
                        features.forEach(function (feature) {
                            var allrings = feature.geometry.coordinates;
                            var properties = feature.properties;
                            var mc = properties.name;
                            var areaname = mc;
                            var str = "区";
                            if (mc == "浦东新区") {
                                str = "新区";
                            }
                            var strCenter = "黄浦区,长宁区,静安区,普陀区,虹口区,杨浦区";//这几个区域用徐汇区代替
                            if (strCenter.indexOf(mc) > -1) {
                                mc = "徐汇区";
                            }
                            var arr = result.filter(function (item) {
                                return item.NAME + str == mc;
                            });
                            if (arr.length > 0) {
                                var cls = "  waterText";
                                var textStr = "";//arr[0].NAME + ":" +
                                textStr += parseFloat(arr[0].DRP).toFixed(1) + "mm";
                                var point = new Point({
                                    "x": properties.centroid[0],
                                    "y": properties.centroid[1],
                                    "spatialReference": {
                                        "wkid": 4326
                                    }
                                });
                                //cls += " slText ";
                                var _align = "bottom";
                                if (textStr == "") {
                                    textStr = "—";
                                }
                                if (strCenter.indexOf(areaname) == -1) {
                                    var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 12);
                                    labels.push(label);
                                }
                                var colorStr = getAreaColor(arr[0].DRP, "");
                                if (colorStr != null && colorStr != "" && colorStr != undefined) {
                                     var fillColorStr = getAreaColor(arr[0].DRP, "fill");

                                    allrings.forEach(function (rings) {
                                        var area = new Polygon(rings);
                                        var symbol = new SimpleFillSymbol(
                                            SimpleFillSymbol.STYLE_SOLID,
                                            new SimpleLineSymbol(
                                                SimpleLineSymbol.STYLE_SOLID,
                                                new Color(colorStr),//rgb  边框色
                                                1
                                            ),
                                            new Color(fillColorStr)//rgba  中间填充色
                                        );
                                        var g3 = new Graphic(area, symbol);
                                        g3.attributes = arr[0];
                                        countyLayer1.add(g3);
                                    }, this);
                                }

                                var point = new Point({ "x": properties.centroid[0], "y": properties.centroid[1], "spatialReference": { "wkid": 4326 } });
                                var font = new Font("14px", Font.STYLE_NORMAL, Font.VARIANT_NORMAL,
                                    Font.WEIGHT_BOLDER);
                                var textSymbol = new TextSymbol(
                                    areaname,
                                    font,
                                    new Color("black")
                                );
                                var labelPointGraphic = new Graphic(point, textSymbol);
                                countyLayer1.add(labelPointGraphic);
                            }
                        }, this);
                    }
                }),
                "json"
            );
        });
    }
    function getAreaColor(zValue, type) {
        var color = "#ffffff";
        var colorTM = [255, 255, 255, 0];
        var colors = ["#A6F28E", "#007B00", "#3DBCF9", "#0000F9", "#FB3DFA", "#7B0000"];
        var colorsTM = [
            [166, 242, 142, 0.45],
            [0, 123, 0, 0.45],
            [61, 188, 249, 0.45],
            [0, 0, 249, 0.45],
            [251, 61, 250, 0.45],
            [123, 0, 0, 0.45]
        ];
        if (zValue > 0 && zValue <= 10) {
            color = colors[0];
            colorTM = colorsTM[0];
        }
        else if (zValue > 10 && zValue <= 25) {
            color = colors[1];
            colorTM = colorsTM[1];
        }
        else if (zValue > 25 && zValue <= 50) {
            color = colors[2];
            colorTM = colorsTM[2];
        }
        else if (zValue > 50 && zValue <= 100) {
            color = colors[3];
            colorTM = colorsTM[3];
        }
        else if (zValue > 100 && zValue <= 200) {
            color = colors[4];
            colorTM = colorsTM[4];
        }
        else if (zValue > 200) {
            color = colors[5];
            colorTM = colorsTM[5];
        }
        if (type == "fill") {
            return colorTM;
        } else {
            return color;
        }
    }
