

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>

    <script src="../../Common/Scripts/jquery-1.9.1.min.js" type="text/javascript"></script>
    <script src="../../Common/Scripts/echarts.js" type="text/javascript"></script>

    <script src="../../Common/boot.js" type="text/javascript"></script>
    <script src="../../Common/jquery.min.js"></script><!--高版本下拉框无法使用-->
    <script src="../../Common/Scripts/ChartJs.js"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
			background: white;
        }
        .mini-grid-rows-view{
		 overflow: auto !important;
		}
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar"> 
           <table style="width:100%">
                    <tr>
						<td>
							&nbsp;&nbsp;站点：
							<input id="STCD" name="STCD" class="mini-combobox" style="width:110px;" textField="stnm" valueField="stcd" allowInput="true" />
							&nbsp;&nbsp;预报日期：
							<input id="TM" class="mini-datepicker" style="width:150px;" format="yyyy-MM-dd H:mm:ss"
							 showTime="false" showOkButton="false" showClearButton="false" onvaluechanged="onvaluechangedTM" ondrawdate="onDrawDate"/>
							 
							&nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a>
						</td>
						<td style="width:180px;display:none;">
							类型:
							<div id="YBZ" class="mini-radiobuttonlist" repeatItems="1" repeatLayout="table" repeatDirection="vertical" textField="text"
							 valueField="id" value="true" data="[{'id':'true','text':'预报值'},{'id':'false','text':'实测值'}]" onvaluechanged="onDeptChanged">
							</div>
						</td>
                    </tr>
                </table>
         
            
        </div>
    </div>
    <div style="width:100%;height:350px; margin:0 auto;" id="Chart">

    </div>

    <div id="grid1" class="mini-datagrid" style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 385px);height: -moz-calc(100% - 385px);height: calc(100% - 385px);    background: red;"
        allowalternating="true" borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50,100,500,1000]"
        pagesize="20" showPager="false" ondrawcell="ondrawcell" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
        <div property="columns">

                <div field="ymdh" width="100" align="center" headeralign="center" renderer="onTMRenderer" allowsort="true">
                        时间
                    </div>
            <!-- <div field="STNM" width="80" align="center" headeralign="center" allowsort="false">站名</div> -->
            <div field="z" width="100" align="center" headeralign="center" allowsort="true" decimalPlaces="2"
                dataType="float">预报水位</div>
        </div>
    </div>
	<script language="javascript" type="text/javascript">
		var stcdArr=[
			{stcd:"1728053250",stnm:"嘉兴"},
			{stcd:"1728053251",stnm:"昆山"},	
			{stcd:"1728053248",stnm:"陈墓"},	
			{stcd:"1728053252",stnm:"平望"},		
		]
        mini.parse();
        var myData=[];
        //实例化表格对象
		var grid = mini.get("grid1");
        $(function () {
			mini.get("STCD").setData(stcdArr);
			mini.get("STCD").select(0);
            var strWhere = { };
			app.post("SWZZ_MODE_ST_FORECAST_F/findResultFYMDH", strWhere, function (res) {
				JosnSel(res, "findResultFYMDH");
			});
        })
        //鼠标移动上去的提示信息。遍历数据
        function ondrawcell(e) {
            var record = e.record;
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务
            if(field=="TM"){ 
                if(value!=undefined){
                    e.cellHtml =convertToDate(value).format("yyyy-MM-dd HH:mm:ss");
                }else{
                    e.cellHtml="—";
                }
            }
        }
        function onKeyEnter() {
            //关键字
            search();
        }
        var dataResult = null;
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            setTimeout(function () {
                PageFillData(0, 20);
            }, 100);
        }
        function PageFillData(pageIndex, pageSize) {
            var Startime = mini.get("TM").getFormValue();
			//查询方法
			var strWhere = { "startdate": Startime,"stcd": mini.get('STCD').getValue()};
			app.post("SWZZ_MODE_ST_FORECAST_F/findResult", strWhere, function (res) {
				JosnSel(res, "Sel");
			});
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") { 

                var strJson=data.data;
				strJson=strJson.filter(function(e){
					e.z=(e.z-0.26).toFixed(2);
					return true;
				});
				
                grid.setData(strJson);

                var strNote = [];
                strNote.push({ "name": "时间", "codename": "ymdh", "tableV": "1", "isShow": true, "width": "40%" });
				strNote.push({ "name": "预报水位", "codename": "z", "tableV": "1", "isShow": true, "width": "40%" });
				
                var LineColor = ['#0000FF', '#ff0909', '#00FF00', '#FFA500'];

                chartSW("Chart", strJson, strNote, LineColor, "水位");

                mini.unmask(document.body);
            }
            else if (typeID == "Del") {
                if (data.total > 0) {
                    search();
                }
            }
            else if(typeID=="findResultFYMDH"){
                $.data(myData,"FYMDHData",data.data);

				var tm = data.data[data.data.length-1].fymdh;
				mini.get("TM").setValue(tm);
				//mini.get("STIME").setValue(addDayDate(tm.format("yyyy/MM/dd"), -7));
				//mini.get("ETIME").setValue(tm.format("yyyy/MM/dd"));
				// if (Number(tm.format("HH")) > 8) {
				// 	mini.get("TM").setValue(tm.format("yyyy/MM/dd") + " 08:00:00");
				// } else {
				// 	mini.get("TM").setValue(addDayDate(tm.format("yyyy/MM/dd"), -1) + " 08:00:00");
				// }
				//默认加载数据
				search();
            }
        }
        function onDeptChanged(evt){
            search();
        }
        //--------------------------------
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            PageFillData(pageIndex, pageSize);
        });
        function onvaluechangedTM(e){
            var tmStr=new Date(e.value).format("yyyy-MM-dd 08:00:00");
            mini.get('TM').setValue(tmStr);
        }

         function onDrawDate(e) {
            var FYMDHData=$.data(myData,"FYMDHData");
            var date = e.date;
             var tempResult = FYMDHData.filter(function (ex) {
                 return new Date(date).format("yyyy/MM/dd") == new Date(convertToDate(ex.fymdh)).format("yyyy/MM/dd");
             });
             if (tempResult.length > 0) {
                 e.dateStyle = "background:#A8D9B6;"
             } 
         }
    </script>
    <script type="text/javascript">

        /* 过程线绘制 过程线 水位
			 * ChartName画图控件名称
			 * dataS数据对象，数据格式json
			 * strNote数据说明，数据类型数组，数据格式
			 * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示过程线
			 * [
			 * {"name": "时间","codename": "TM","tableV":"1","isShow":true},
			 * {"name": "上游水位","codename": "UPZ","tableV":"1","isShow":true},
			 * {"name": "下游水位","codename": "DWZ","tableV":"1","isShow":true},
			 * {"name": "警戒水位","codename": "WRZ","tableV":"0","isShow":false}
			 * ]
			 */
			function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
				var myChart = echarts.init(document.getElementById(ChartName)); //获得控件对象
				//清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
				myChart.clear();
				//echarts.init(document.getElementById('quxian'), 'macarons');
				var chartName = []; //控件元素名称
				var chartTM = []; //时间序列
				var chartValue = []; //时间序列
				var liststr = ""; //拼装表格
				var ShowSelected = {};
				var m = new Array();
				$.each(strNote, function(index, value, item) {
					chartName.push(value.name); //Echarts绘制标注名称加入
					ShowSelected[value.name] = value.isShow;
				}); 
				//循环数据，加入有效数据。
				$.each(data, function(index, value, item) {
					var charthan = []; //时间序列
					$.each(strNote, function(index1, value1, item1) {
						charthan.push(value[value1.codename]); //加入集合
						if (value1.name == "时间") { 
							//chartTM.push(new Date(value[value1.codename].replaceAll("-","/")).format("MM-dd HH:mm")); //加入时间集合
                            chartTM.push(new Date(convertToDate(value[value1.codename])).format("yyyy-MM-dd HH:mm"))
						} else {
							chartValue.push(value[value1.codename]);
						}
					});
					m.push(charthan); //加入集合
				}); 
				//获得最大值最小值
				//var max_min=GetSort(chartValue); 
				var option = {
					//backgroundColor: '#100E19',
					noDataLoadingOption: {
						text: '暂无数据',
						effect: 'bubble',
						effectOption: {
							effect: {
								n: 0 //气泡个数为0 
							}
						},
						textStyle: {
							fontSize: 30,
							fontWeight: 'bold'
						}
					},
					tooltip: {
						showDelay: 0,
						hideDelay: 50,
						transitionDuration: 0,
						backgroundColor: 'rgba(255,255,255,0.9)',
						borderColor: '#4040FB',
						borderRadius: 8,
						borderWidth: 2,
						padding: 10,
						textStyle: {
							color: '#000000'
						},
						trigger: 'axis',
						axisPointer: {
							type: 'cross'
						}
						/*formatter: function (datas) { 
                        return Number(datas[0].data).toFixed(2);
                        //或者是下面这种，效果是一样的
                        //return datas.value.toFixed(2);
                    } */
					},
					color: LineColor,
					legend: {
						data: chartName,
						itemWidth: 8,
						itemHeight: 8,
						textStyle: {
							color: '#000',
							fontSize: 12
						},
						selected: ShowSelected
						//selected: {
						//    '警戒水位': false
						//}

					},
					grid: {
						left: '4%',
						right: '1%',
						bottom: '3%',
						top: '15%',
						containLabel: true
					},
					xAxis: [{ 
						data: chartTM,
						axisLine: {
							lineStyle: {
								color: '#918F8F',
								width: 1, //这里是为了突出显示加上的
							},
							textStyle: {
								color: '#000',
								fontSize: '16'
							}
						}
					}],
					yAxis: [{
							name: "水位(m)",
							type: 'value',
							boundaryGap: false,
							splitNumeber: 5,
							scale: true, //是否自动计算最大最小值。
							splitLine: {
								show: false,
								lineStyle: {
									color: '#eee',
									width: 1,
									type: 'dashed',
								}
							},
							min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                               return (value.min - (jiangenew - jiange) / 200);
                            }
                            else {
                               return (value.min - (jiangenew - jiange - 1) / 200);
                            }
                            // return 1;
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                               return (value.max + (jiangenew - jiange) / 200);
                            }
                            else {
                               return (value.max + (jiangenew - jiange + 1) / 200);
                            }
                            // return 3.00
                        },
							axisLabel: {
								formatter: function(v) {
									return v.toFixed(2);
								}
							}, 
                        },
                    ],
					series: function() {
						var serie = [];
						for (var j = 0; j < chartName.length; j++) { 
							if (chartName[j] == "时间"){//调过时间字段
								continue;
							}
							var chartValue = []; //声明过线value集合
							for (var i = 0; i < m.length; i++) {
								chartValue.push(m[i][j]); //循环价值
							}
							if (chartName[j] == "降雨") {
								var item = {
									// name: '降水量 (mm)',
									name: chartName[j],
									type: 'bar',
									barWidth: '20%',
									yAxisIndex: 1,
									data: chartValue
								};
								serie.push(item);
                            } 
                            else {
								if (max_min_Name != "" & max_min_Name == chartName[j]) {
									var item = {
										name: chartName[j],
										type: 'line',
										"connectNulls": true, //这个是重点，将断点连接
										data: chartValue,
										markPoint: {
											data: [{
												type: 'max',
												name: '最大值'
											}, {
												type: 'min',
												name: '最小值'
											}],
											label: {
												normal: {
													formatter: function(datas) {
														return Number(datas.value).toFixed(2);
														//或者是下面这种，效果是一样的
														//return datas.value.toFixed(2);
													}
												}
											}
										},
										smooth: false
									}
									serie.push(item);
								} else {
									var item = {
										name: chartName[j],
										type: 'line',
										"connectNulls": true, //这个是重点，将断点连接
										data: chartValue,
										smooth: false,
                                        markLine: {
                                        lineStyle: {
                                            type: 'solid',
                                            color:'#FA0000',
                                        }, 
                                        //data: [{ xAxis: formatDate(AddHourDate(new Date().format("yyyy-MM-dd HH:00:00"),1)).format("yyyy-MM-dd HH:00") }]
                                }

									}
									serie.push(item);
								}
							}

						};
						return serie;
					}()
				};
				if (data.length == 0) {
						$("." + $.data(myData, "DIVID")).hide();
					var strWhere = "";
					strWhere =
						"<div class='DIVHIDE'>\ <span class='NoneBg' style='letter-spacing:-2px;position: absolute;font-size: 30px;color:#afa2a2'>暂无数据</span>\ </div>";
					$.data(myData, "DIVID", "DIVHIDE");
					$('#' + ChartName).append(strWhere);
				} else {
					if ($.data(myData, "DIVID") != null) {
						$("." + $.data(myData, "DIVID")).hide();
					}
				}

				myChart.setOption(option);
			}
    </script>

</body>
</html>
