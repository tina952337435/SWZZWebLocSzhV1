<body>
    <div class="flex" style="width: 100%; height: 100%; overflow: hidden;">
        <!--<div class="biaoheader">
        <p class="NONEp">
        </p>
        条件选择</div>-->
        <div class="right box" style="height: 45px;">
            <div class="demo1" style="float: left;width:100%;">
                <div class="inline">
                    <div style="width: 100%; height: 35px; float: left;">
                        方案选择：
                        <input id="STCD" name="STCD" class="mini-combobox" style="width: 250px;"
                               textfield="DD_NAME" valuefield="DD_ID" allowinput="true" onvaluechanged="onSTCDChanged" />
                    </div>
                </div>
            </div>
        </div>
        <div class="biaoheader">
            <p class="NONEp">
            </p>
            水库列表<span class="dwCss">(单位:水位m,流量m³/s,蓄水量万方)</span>&nbsp;&nbsp;&nbsp;
            <img title="导出表格" src="../../arcgis_js_api/myJs/images/excel.png" onclick="ExportExcel('预报水位')" style="position: relative;
                top: 5px; right: 15px; float: right; cursor: pointer;" />
        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 99%; height: 100%; margin: auto;"
             showpager="false" idfield="STCD" allowresize="false" allowalternating="true" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
             ondrawcell="ondrawcell" onselectionchanged="onSelectionChanged">
            <div property="columns">
                <div field="STNM" width="80" align="center" headeralign="center">
                    站名
                </div>
                <div field="UPZ" width="60" align="center" headeralign="center">
                    库水位
                </div>
                <div field="RQ" width="60" align="center" headeralign="center">
                    入流
                </div>
                <div field="CQ" width="60" align="center" headeralign="center">
                    出流
                </div>
                <div field="XSL" width="60" align="center" headeralign="center">
                    蓄水量
                </div>
                <div field="WRZ" width="60" align="center" headeralign="center">
                    汛限
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        ShowPage(); //map页面会调用
        function ShowPage() {
            openTL("mxsktl");
        }

        mini.parse();
        var grid = mini.get("grid1");
        var myData = [];
        var mydt = [];
        var resultData=[];
        $(function () {
            showDitu();
            GetJosns("MODE_DD_SOLUTIONSel", { "DD_STATUS": "1"}, "STCD");
        })
        function onSTCDChanged(e) {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            $.data(myData, "DD_ID", nodes.DD_ID);
            $.data(myData, "STM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
            $.data(myData, "TM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
            $.data(myData, "ETM", new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy/MM/dd HH:mm:ss"));
            search();
        }
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var DD_ID = $.data(myData, "DD_ID");
            var strParam = { "DD_ID": DD_ID, TM: $.data(myData, "TM")};
            GetJosns("SKZHAN", strParam, "Sel");
        }
        function JosnSel(ResultData, typeID) {
            if (typeID == "Sel") {
                var tempData = ResultData.data;
                mydt = tempData;
                window.parent.YBClick($.data(myData, "STM"), $.data(myData, "ETM"));

                //加载全部
                s_where = { "DD_ID": $.data(myData, "DD_ID")};
                GetJosns("SKZHAN", s_where, "SelAll");
            } else if (typeID == "SelAll") {
                var tempData = ResultData.data;
                mydt = tempData;
            }  else if (typeID == "STCD") {
                mini.get("STCD").setData(ResultData.data);
                mini.get("STCD").select(0);
                var _stcd = mini.get("STCD");
                var nodes = _stcd.getSelected();
                $.data(myData, "DD_ID", nodes.DD_ID);
                $.data(myData, "STM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
                $.data(myData, "TM", new Date(convertToDate(nodes.DD_TM)).format("yyyy/MM/dd HH:mm:ss"));
                $.data(myData, "ETM", new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy/MM/dd HH:mm:ss"));
                
                setTimeout(function () {
                    search();
                }, 500)
            }
        }
        function gridLoad() {
            //$(window.parent.document).find(".mini-tips").hide()
            window.parent.showJCTips($.data(myData, "TM"));
            var objTM = new Date($.data(myData, "TM"));
            var objID = mini.get("STCD").getValue();
            //加载图片
            var picUrl = objID + "\\" + "2016年预报调度文档__" + objTM.format("yy_MM_dd_HH_mm_ss") + ".png";//"moren.png";
            
            var result = mydt.filter(function (e) {
                return new Date(convertToDate(e.TM)).format("yyyy/MM/dd HH:mm:ss") == new Date($.data(myData, "TM")).format("yyyy/MM/dd HH:mm:ss");
            });
            resultData = result;
            getInfo();
            tlCount();
        }

        var qcCount = 0;
        var zcCount = 0;
        var warnCount = 0;

        function getInfo() {
            zcCount = 0;
            warnCount = 0;
            var t = mini.get("thsq");
            var value1 = getTLObj("mxcb_skCJ").checked;
            var value2 = getTLObj("mxcb_skZC").checked;
            var item = resultData;
            if (item == null)
                return;
            dt = [];
            for (var i = 0; i < item.length; i++) {
                if (item[i].STNM != undefined) {
                    if (item[i].STNM.indexOf("水库") == -1) {
                        continue;
                    }
                } else {
                    continue;
                }
                item[i].STATE = 0;
                var bsnm = item[i].BSNM;
                var sttp = item[i].STTP;
                if ((item[i].UPZ == null || item[i].UPZ == undefined || item[i].UPZ == "")) {
                    item[i].STATE = 4;
                    qcCount++;
                    dt.push(item[i]);
                } else {
                    item[i].UPZ = Number(item[i].UPZ).toFixed(2);
                    var z = Number(item[i].UPZ).toFixed(2);
                    var wrz = parseFloat(item[i].WRZ).toFixed(2);
                    var grz =parseFloat(item[i].GRZ);
                    var tempTM = false;
                    //if ((item[i].UPZ == null || item[i].UPZ == "") || (tempTM == true)) {
                    //    item[i].STATE = 4;
                    //    qcCount++;
                    //    dt.push(item[i]);
                    //}
                    //else if (z >= wrz) {
                    //    item[i].STATE = 1;
                    //    warnCount++;
                    //    if (value1) {
                    //        dt.push(item[i]);
                    //    }
                    //}
                    //else {
                        item[i].STATE = 0;
                        zcCount++;
                        if (value2) {
                            dt.push(item[i]);
                        }
                    //}
                }
            }
            //console.error(JSON.stringify(dt));
            grid.setData(dt);
            addMark(dt);
        }

        function tlCount() {
            getTLObj("mxskCJ").innerHTML = warnCount;
            getTLObj("mxskZC").innerHTML = zcCount;
            mini.unmask(document.body);
        }

        function tlChecked() {
            getInfo();
        }

        function GetMap(startDate, objSTCD) {
            $.data(myData, "TM", new Date(startDate).format("yyyy/MM/dd HH:mm:ss"));
            var ttImg = window.parent.strImageLayer;
            gridLoad();
            setTimeout(function () {
                if (ttImg != undefined) {
                    window.parent.myMapImageLayer.removeImage(ttImg);
                }
            }, 100);
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            var record = e.record;
            var s;
            if (field == "TM") {
                e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm:ss");
            } else if (field == "STNM") {
                var sColor = "";
                if (row.YBZ == null) {
                    sColor = "style='color:#EAEAEA'";
                }
                e.cellHtml = '<a title="' + value + '" ' + sColor+'  href="JavaScript:Trans(\'' + record.STCD + '\',\'' + record.STNM + '\')">' + value + '</a>';
            }

        }
        function Trans(stcd, stnm) {
            var _stcd = mini.get("STCD");
            var nodes = _stcd.getSelected();
            var stime = new Date(convertToDate(nodes.DD_TM)).format("yyyy-MM-dd HH:mm:ss");
            var etime = new Date(convertToDate(nodes.DD_CHECKBY)).format("yyyy-MM-dd HH:mm:ss");
            var DD_ID = $.data(myData, "DD_ID");
            var url = "/Danzhan/YBSKLine.html?DD_ID=" + DD_ID + "&stcd=" + stcd + "&stnm=" + stnm + "&stime=" + stime+"&etime="+etime;
            openChart(url, stnm, stcd, "");
        }

        function onSelectionChanged(e) {
            var grid = e.sender;
            var record = grid.getSelected();
            if (record) {
                loc(record.LGTD, record.LTTD);
            }
        }
        function loc(lgtd, lttd) {
            if (lgtd == undefined && lttd == undefined) {
                //mini.alert("缺失经纬度");
            } else {
                window.parent.setMapZoom(8);
                dyCenter(lgtd, lttd);
            }
        }

        function showDitu() {
            var lysStr = "DDSK";
            layer_sk = map.getLayer(lysStr);
            try {
                layer_sk.setVisibility(true);

                layer_sk.on("click", function (e) {
                    var screenPoint = e.mapPoint;
                    var lgtd = screenPoint.x.toFixed(6);
                    var lttd = screenPoint.y.toFixed(6);
                    var graphic = e.graphic;
                    console.error(graphic);
                    setTimeout(function () {
                        Trans(graphic.attributes.ID, graphic.attributes.名称, graphic.attributes.起始断面序);
                    }, 200);
                });
            } catch (e) {

            }
            
        }
    </script>
</body>
</html>
