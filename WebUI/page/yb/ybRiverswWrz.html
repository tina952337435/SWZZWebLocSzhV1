                path.setAttribute('id', 'path-' + i);
                const length = path.getTotalLength();
                //console.error(length);
                const speed = length / 100;
                style += `
        #path-${i} {
          stroke-dasharray: ${length};
          stroke-dashoffset: ${length};
          animation: dash ${speed}s linear infinite;
        }

        @keyframes dash-${i} {
          from {
            stroke-dashoffset: 0;
          }
          to {
            stroke-dashoffset: ${length};
          }
        }
@keyframes dash {
          to {
            stroke-dashoffset: 0;
          }
        }
`
            });

            const sheet = document.createElement('style');
            sheet.innerHTML = style;
            document.head.appendChild(sheet);

            require(

                ],
                function (
                    Map,

                    //转为float类型
                    function toNum(n) {
                        return parseFloat(n)
                    }
                    var length = data.length
                    var allPoints = []
                    var lineft = []
                    var linetf = []
                    if (length > 0) {
                        //获取所有点集合
                        for (var i = 0; i < length; i++) {
                            var flon = toNum(data[i].from_lon)
                            var flat = toNum(data[i].from_lat)
                            var fPoint = { "value": [flon, flat] }
                            var tlon = toNum(data[i].to_lon)
                            var tlat = toNum(data[i].to_lat)
                            var tPoint = { "value": [tlon, tlat] }
                            allPoints.push(fPoint)
                            allPoints.push(tPoint)
                            //流向线 from至to
                            var ft = [
                                { "coord": [flon, flat] },
                                { "coord": [tlon, tlat] }
                            ]
                            lineft.push(ft)
                            //流向线  to至from

        /* 柱状图 雨量
* ChartName画图控件名称
* dataS数据对象，数据格式json
* strNote数据说明，数据类型数组，数据格式
* json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示
*/
        function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                        //chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合
                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show: false,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                toolbox: {
                    show: false
                },
                grid: {
                    left: 90,
                    right: 40,
                    bottom: 40,
                    top: 20,
                    containLabel: false
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'value',
                        show: false,
                        //name: max_min_Name,
                        axisTick: {
                            alignWithLabel: false
                        },
                        min: 0,
                        max: function (value) {
                            return Number(value.max) + 15;
                        },
                        axisLine: {
                            show: false
                        },
                        splitLine: {
                            show: false
                        },
                    }
                ],
                yAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        boundaryGap: false,
                        axisLabel: {
                            interval: 0,
                            //rotate: 30
                        },
                        axisLine: {
                            show: false
                        },
                        splitLine: {
                            show: false
                        },
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        if (chartName[j] == "名称") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: 12,
                                label: {
                                    normal: {
                                        show: true,
                                        position: 'right',
                                        formatter: function (params) {
                                            if (params.value == 0) {  //为0时不显示
                                                return '';
                                            } else {
                                                return params.value;
                                            }
                                        }
                                    },

                                },
                                smooth: true
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
            myChart.on('click', function (param) {
                var name = param.name;
                WindowsOpen("/DanZhan/YBYQBar.html?stnm=" + (name) + "&DD_ID=" + DD_ID, name, "1100@600");
            });
        }

        }
