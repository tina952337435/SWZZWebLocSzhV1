<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>气象产品查看</title>
    <link href="../../Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="../../Common/jquery.min.js" type="text/javascript"></script>
    <script src="../../Common/boot.js?ver=1.0.2" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
            background: #f5f5f5;
            font-family: "Microsoft YaHei", arial;
        }

        .main-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        /* 顶部工具栏 */
        .top-toolbar {
            padding: 10px 15px;
            background: #fff;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .top-toolbar .label-text {
            font-weight: bold;
            color: #333;
            white-space: nowrap;
        }

        /* 预报时效选择 */
        .forecast-tabs {
            display: flex;
            margin-left: 10px;
        }

        .forecast-tabs .tab-item {
            list-style: none;
            border: 1px solid #3291f9;
            background-color: #fff;
            width: 80px;
            height: 28px;
            font: 13px/28px "Microsoft YaHei", "arial";
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .forecast-tabs .tab-item:first-child {
            border-radius: 4px 0 0 4px;
        }

        .forecast-tabs .tab-item:last-child {
            border-radius: 0 4px 4px 0;
        }

        .forecast-tabs .tab-item:hover {
            background-color: #3291f9;
            color: #fff;
        }

        .forecast-tabs .tab-item.active {
            background-color: #3291f9;
            color: #fff;
        }

        /* 图片展示区域 */
        .image-viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgb(237, 237, 237);
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .image-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .image-container img {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
            transition: opacity 0.25s ease;
        }

        .image-container .img-front {
            opacity: 1;
            z-index: 2;
        }

        .image-container .img-back {
            opacity: 0;
            z-index: 1;
        }

        /* 导航按钮 */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.35);
            color: #fff;
            border: none;
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: background 0.2s;
            outline: none;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(0,0,0,0.65);
        }

        .nav-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
        }

        .nav-btn-prev { left: 20px; }
        .nav-btn-next { right: 20px; }

        /* 底部控制栏 */
        .control-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0,0,0,0.55);
            padding: 7px 18px;
            border-radius: 22px;
            z-index: 10;
        }

        .control-bar .btn-play {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: #3291f9;
            color: #fff;
            border: none;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            outline: none;
            transition: background 0.2s;
        }

        .control-bar .btn-play:hover {
            background: #2674c9;
        }

        .control-bar .image-counter {
            color: #fff;
            font-size: 13px;
            min-width: 55px;
            text-align: center;
        }

        .control-bar .speed-select {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.45);
            border-radius: 10px;
            padding: 3px 8px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        .control-bar .speed-select option {
            color: #333;
        }

        /* 指示点 */
        .dots-container {
            display: flex;
            gap: 5px;
        }

        .dots-container .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            transition: all 0.2s;
        }

        .dots-container .dot.active {
            background: #3291f9;
            transform: scale(1.4);
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 16px;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        /* 图片信息标签 */
        .image-label {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.55);
            color: #fff;
            padding: 4px 14px;
            border-radius: 10px;
            font-size: 13px;
            z-index: 10;
            white-space: nowrap;
        }

        /* 加载动画 */
        #dataLoad {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.75);
            z-index: 100;
            display: none;
        }

        #dataLoad table {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- 顶部工具栏：最新起报时间 + 预报时效切换 + 查询按钮 -->
        <div class="top-toolbar">
            <span class="label-text">最新起报时间：</span>
            <input id="initTimePicker" class="mini-datepicker" style="width:155px;" showtime="true"
                format="yyyy-MM-dd HH:mm:ss" onvaluechanged="onInitTimePicked" />
            <a class="mini-button" onclick="reloadInitTime()">刷新</a>

            <!-- 预报时效切换 -->
            <div class="forecast-tabs">
                <span class="tab-item active" data-hour="3" onclick="switchForecastHour(this, '3')">3h</span>
                <span class="tab-item" data-hour="6" onclick="switchForecastHour(this, '6')">6h</span>
                <span class="tab-item" data-hour="12" onclick="switchForecastHour(this, '12')">12h</span>
                <span class="tab-item" data-hour="24" onclick="switchForecastHour(this, '24')">24h</span>
            </div>
        </div>

        <!-- 图片展示区 -->
        <div class="image-viewer" id="imageViewer">
            <div class="image-label" id="imageLabel">加载中...</div>

            <div class="image-container" id="imageContainer">
                <img class="img-front" id="imgFront" alt="气象产品图片" />
                <img class="img-back" id="imgBack" alt="气象产品图片" />
                <div class="empty-state" id="emptyState">
                    <span class="icon">📷</span>
                    <span>暂无图片数据</span>
                </div>
            </div>

            <!-- 上一张/下一张 -->
            <button class="nav-btn nav-btn-prev" id="btnPrev" onclick="prevImage()" disabled>&#10094;</button>
            <button class="nav-btn nav-btn-next" id="btnNext" onclick="nextImage()" disabled>&#10095;</button>

            <!-- 底部控制栏 -->
            <div class="control-bar" id="controlBar" style="display:none;">
                <button class="btn-play" id="btnPlay" onclick="togglePlay()" title="播放/暂停">▶</button>
                <div class="image-counter" id="imageCounter">0 / 0</div>
                <div class="dots-container" id="dotsContainer"></div>
                <select class="speed-select" id="speedSelect" onchange="onSpeedChange()">
                    <option value="500">0.5秒</option>
                    <option value="1000" selected>1秒</option>
                    <option value="1500">1.5秒</option>
                    <option value="2000">2秒</option>
                    <option value="3000">3秒</option>
                </select>
            </div>

            <!-- 加载遮罩 -->
            <div id="dataLoad">
                <table align="center" valign="middle">
                    <tr style="height:50%"><td align="center">&nbsp;</td></tr>
                    <tr><td align="center"><img alt="" src="../../arcgis_js_api/myJs/images/wait1.gif" /></td></tr>
                    <tr><td align="center">数据载入中，请稍后...</td></tr>
                    <tr style="height:50%"><td align="center">&nbsp;</td></tr>
                </table>
            </div>
        </div>
    </div>

    <script>
        mini.parse();

        // ==================== 全局状态 ====================
        var allInitTimes = [];             // 所有起报时间（原始格式）
        var currentInitTime = null;       // 当前选中的起报时间（显示格式）
        var currentForecastHour = '3';    // 当前预报时效
        var imageList = [];
        var currentImageIndex = 0;
        var playTimer = null;
        var isPlaying = false;

        // API的固定时间范围
        var QUERY_SDT = "2026-07-18 00:00:00";
        var QUERY_EDT = "2026-07-20 23:00:00";

        // ==================== 初始化 ====================
        window.onload = function () {
            console.log("===== 页面初始化，开始获取起报时间 =====");
            fetchInitTimesAndLoad();
        };

        // 获取起报时间列表，取最后一个作为最新时间
        function fetchInitTimesAndLoad() {
            $("#dataLoad").show();

            var url = "/smartGridForecastParser/meta/initTimeList?sdt=" + encodeURIComponent(QUERY_SDT) + "&edt=" + encodeURIComponent(QUERY_EDT);
            console.log("[initTimeList] 请求URL:", url);

            $.ajax({
                url: url,
                type: "GET",
                dataType: "json",
                success: function (res) {
                    console.log("[initTimeList] 返回完整数据:", JSON.stringify(res));
                    console.log("[initTimeList] res.code:", res.code, "res.status:", res.status, "res.data:", res.data, "res.result:", res.result);

                    // 兼容 code 和 status 两种字段
                    var code = res.code || res.status;
                    var list = res.data || res.result;

                    if (code === 200 && list && list.length > 0) {
                        allInitTimes = list;
                        // 取最后一个作为最新起报时间
                        var latestTime = allInitTimes[allInitTimes.length - 1];
                        currentInitTime = formatTimeDisplay(latestTime);
                        console.log("[initTimeList] 最新起报时间:", currentInitTime);

                        // 设置时间选择器的值
                        mini.get("initTimePicker").setValue(currentInitTime);

                        // 加载产品图片
                        loadProductImages();
                    } else {
                        $("#dataLoad").hide();
                        console.warn("[initTimeList] 无数据或格式不对, code:", code, "list长度:", list ? list.length : 0);
                        $("#imageLabel").text("未获取到起报时间数据");
                    }
                },
                error: function (xhr, status, error) {
                    $("#dataLoad").hide();
                    console.error("[initTimeList] 请求失败, status:", status, "error:", error, "xhr.status:", xhr.status, "xhr.responseText:", xhr.responseText);
                }
            });
        }

        // 刷新起报时间
        function reloadInitTime() {
            fetchInitTimesAndLoad();
        }

        // 用户手动修改时间选择器
        function onInitTimePicked(e) {
            var val = mini.get("initTimePicker").getFormValue();
            if (val) {
                currentInitTime = val;
                loadProductImages();
            }
        }

        // ==================== 切换预报时效 ====================
        function switchForecastHour(el, hour) {
            $(".forecast-tabs .tab-item").removeClass("active");
            $(el).addClass("active");

            currentForecastHour = hour;

            if (currentInitTime) {
                loadProductImages();
            }
        }

        // ==================== 加载产品图片 ====================
        function loadProductImages() {
            if (!currentInitTime) {
                console.warn("[meta/list] currentInitTime 为空，跳过");
                clearImageViewer();
                return;
            }

            stopPlay();
            $("#dataLoad").show();

            var initTimeParam = formatTimeForApi(currentInitTime);
            var url = "/smartGridForecastParser/meta/list?initTime=" + encodeURIComponent(initTimeParam) + "&forecastHour=" + currentForecastHour;
            console.log("[meta/list] 请求URL:", url);

            $.ajax({
                url: url,
                type: "GET",
                dataType: "json",
                success: function (res) {
                    console.log("[meta/list] 返回完整数据:", JSON.stringify(res));
                    console.log("[meta/list] res.code:", res.code, "res.status:", res.status, "res.data:", res.data, "res.result:", res.result);

                    // 兼容 code 和 status 两种字段
                    var code = res.code || res.status;
                    var list = res.data || res.result;

                    $("#dataLoad").hide();
                    if (code === 200 && list && list.length > 0) {
                        imageList = list;
                        currentImageIndex = 0;
                        console.log("[meta/list] 获取到", imageList.length, "张图片, 第一项:", JSON.stringify(imageList[0]));
                        showCurrentImage();
                        updateControlBar();
                        $("#controlBar").show();
                        $("#emptyState").hide();
                        $("#imageLabel").text("起报时间: " + currentInitTime + "  |  预报时效: " + currentForecastHour + "h  |  共 " + imageList.length + " 张");
                    } else {
                        imageList = [];
                        currentImageIndex = 0;
                        console.warn("[meta/list] 无数据或格式不对, code:", code, "list长度:", list ? list.length : 0);
                        clearImageViewer();
                        $("#imageLabel").text("起报时间: " + currentInitTime + "  |  预报时效: " + currentForecastHour + "h  |  暂无图片");
                    }
                },
                error: function (xhr, status, error) {
                    $("#dataLoad").hide();
                    console.error("[meta/list] 请求失败, status:", status, "error:", error, "xhr.status:", xhr.status, "xhr.responseText:", xhr.responseText);
                    clearImageViewer();
                }
            });
        }

        // ==================== 图片展示 ====================
        var _frontIsA = true; // true=imgFront当前可见, imgBack为后备

        function showCurrentImage() {
            var imgData = imageList[currentImageIndex];
            var imgSrc = getImageUrl(imgData);

            console.log("当前图片数据:", imgData);
            console.log("拼接后图片URL:", imgSrc);

            $("#emptyState").hide();

            if (!imgSrc) {
                console.error("图片路径为空");
                $("#imgFront, #imgBack").hide();
                $("#emptyState").show().find("span").text("图片路径为空");
                return;
            }

            // 当前可见的是哪个？把新图加载到隐藏的那个里面
            var $visible, $hidden;
            if (_frontIsA) {
                $visible = $("#imgFront");
                $hidden = $("#imgBack");
            } else {
                $visible = $("#imgBack");
                $hidden = $("#imgFront");
            }

            $visible.show();
            $hidden.show();

            // 隐藏图先放到下层
            $hidden.css({ "z-index": 1, "opacity": 0 });

            // 用原生Image预加载，加载完再切
            var preload = new Image();
            preload.onload = function () {
                $hidden.attr("src", imgSrc);
                // 交叉淡入淡出：可见图淡出，隐藏图淡入
                $visible.css({ "opacity": 0, "z-index": 1 });
                $hidden.css({ "opacity": 1, "z-index": 2 });
                _frontIsA = !_frontIsA;
            };
            preload.onerror = function () {
                console.error("图片加载失败, URL:", imgSrc);
                $("#imgFront, #imgBack").hide();
                $("#emptyState").show().find("span").html('图片加载失败<br/><small>' + imgSrc + '</small>');
            };
            preload.src = imgSrc;

            updateNavButtons();
            updateDots();
            updateCounter();
            $("#imageLabel").text("起报时间: " + currentInitTime + "  |  预报时效: " + currentForecastHour + "h  |  " + (currentImageIndex + 1) + " / " + imageList.length);
        }

        function clearImageViewer() {
            $("#imgFront, #imgBack").attr("src", "").hide();
            $("#emptyState").show().find("span").text("暂无图片数据");
            $("#controlBar").hide();
            $("#btnPrev").prop("disabled", true);
            $("#btnNext").prop("disabled", true);
            _frontIsA = true;
            stopPlay();
        }

        function getImageUrl(imgData) {
            if (typeof imgData === "string") {
                if (imgData.indexOf("http") === 0) {
                    return imgData;
                } else {
                    return "/smartGridForecastParser/sgf/" + imgData;
                }
            } else if (imgData && typeof imgData === "object") {
                var relativePath = imgData.relativePath || "";
                if (relativePath.indexOf("http") === 0) {
                    return relativePath;
                } else {
                    return "/smartGridForecastParser/sgf/" + relativePath;
                }
            }
            return "";
        }

        // ==================== 图片导航 ====================
        function prevImage() {
            if (imageList.length === 0) return;
            currentImageIndex = (currentImageIndex - 1 + imageList.length) % imageList.length;
            showCurrentImage();
        }

        function nextImage() {
            if (imageList.length === 0) return;
            currentImageIndex = (currentImageIndex + 1) % imageList.length;
            showCurrentImage();
        }

        function updateNavButtons() {
            $("#btnPrev").prop("disabled", imageList.length <= 1);
            $("#btnNext").prop("disabled", imageList.length <= 1);
        }

        // ==================== 底部控制栏 ====================
        function updateControlBar() {
            if (imageList.length > 0) {
                $("#controlBar").show();
                $("#btnPrev").prop("disabled", imageList.length <= 1);
                $("#btnNext").prop("disabled", imageList.length <= 1);
            } else {
                $("#controlBar").hide();
                $("#btnPrev").prop("disabled", true);
                $("#btnNext").prop("disabled", true);
            }
            updateDots();
            updateCounter();
        }

        function updateDots() {
            var container = $("#dotsContainer");
            container.empty();
            if (imageList.length <= 1) return;

            var maxDots = 20;
            for (var i = 0; i < imageList.length && i < maxDots; i++) {
                var dot = $("<span>")
                    .addClass("dot")
                    .attr("data-index", i)
                    .on("click", function () {
                        currentImageIndex = parseInt($(this).attr("data-index"));
                        showCurrentImage();
                        if (isPlaying) restartPlayTimer();
                    });

                if (i === currentImageIndex) dot.addClass("active");
                container.append(dot);
            }
        }

        function updateCounter() {
            if (imageList.length > 0) {
                $("#imageCounter").text((currentImageIndex + 1) + " / " + imageList.length);
            } else {
                $("#imageCounter").text("0 / 0");
            }
        }

        // ==================== 自动播放 ====================
        function togglePlay() {
            if (isPlaying) {
                stopPlay();
            } else {
                startPlay();
            }
        }

        function startPlay() {
            if (imageList.length <= 1) return;
            isPlaying = true;
            $("#btnPlay").html("⏸");
            restartPlayTimer();
        }

        function stopPlay() {
            isPlaying = false;
            $("#btnPlay").html("▶");
            if (playTimer) {
                clearInterval(playTimer);
                playTimer = null;
            }
        }

        function restartPlayTimer() {
            if (playTimer) clearInterval(playTimer);
            var speed = parseInt($("#speedSelect").val()) || 1000;
            playTimer = setInterval(function () {
                nextImage();
            }, speed);
        }

        function onSpeedChange() {
            if (isPlaying) restartPlayTimer();
        }

        // ==================== 键盘导航 ====================
        $(document).keydown(function (e) {
            if (e.keyCode === 37) { // 左箭头
                e.preventDefault();
                prevImage();
                if (isPlaying) restartPlayTimer();
            } else if (e.keyCode === 39) { // 右箭头
                e.preventDefault();
                nextImage();
                if (isPlaying) restartPlayTimer();
            } else if (e.keyCode === 32) { // 空格
                e.preventDefault();
                togglePlay();
            }
        });

        // ==================== 工具函数 ====================
        function formatTimeDisplay(timeStr) {
            if (!timeStr) return "";
            return timeStr.replace("T", " ");
        }

        function formatTimeForApi(timeStr) {
            if (!timeStr) return "";
            if (timeStr.indexOf("T") > -1) return timeStr.replace("T", " ");
            if (timeStr.split(":").length >= 3) return timeStr;
            return timeStr + ":00";
        }
    </script>
</body>
</html>
