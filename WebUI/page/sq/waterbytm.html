<body>

    <div class="flex" style="width: 100%; height: 100%; overflow: hidden;">

            <img title="导出表格" src="../../arcgis_js_api/myJs/images/xls.gif" onclick="exp('水情信息')" style="position: relative;
                top: 5px; right: 15px; float: right; cursor: pointer;" />

                <!-- <input id="thsq" name="thsq" class="mini-checkbox" onvaluechanged="onValueChanged2" />水势面 -->
            </span>
        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 99%; height: 100%; margin: auto;" showpager="false" idfield="stcd"
             allowresize="false" allowalternating="true" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
             sortmode="client" pagesize="50" frozenStartColumn="0" frozenEndColumn="1"
             ondrawcell="ondrawcell" onselectionchanged="onSelectionChanged">
            <div property="columns">
                    <div type="indexcolumn" width="30" headeralign="center" align="center">序号</div>
                <div field="stnm" width="80" align="center" headeralign="center" allowsort="false">站名</div>
                <div field="upz" width="60" align="center" headeralign="center" allowsort="true" decimalPlaces="2" dataType="float">最高水位</div>
                <div field="tm" width="100" align="center" headeralign="center" allowsort="true" renderer="onTMRenderer">发生时间</div>
                <div field="wrz" width="60" align="center" headeralign="center" allowsort="true" decimalPlaces="2" dataType="float">警戒水位</div>
                <div field="grz" width="60" align="center" headeralign="center" allowsort="true" decimalPlaces="2" dataType="float">保证水位</div>
                <div field="ivhz" width="70" align="center" headeralign="center" allowsort="true" decimalPlaces="2" dataType="float">历史最高</div>
                <div field="wrzcha" width="60" align="center" headeralign="center" allowsort="true" decimalPlaces="2" dataType="float">超警幅度</div>
                <div field="grzcha" width="60" align="center" headeralign="center" allowsort="true" decimalPlaces="2" dataType="float">超保幅度</div>
                <div field="ivhzcha" width="70" align="center" headeralign="center" allowsort="true" decimalPlaces="2" dataType="float">超历史幅度</div>
            </div>

</body>
<script type="text/javascript">
    ShowPage(); //map页面会调用
    function ShowPage() {
        openTL("sqtl");
    }
    var treeID = GetQueryString("TREEID");
    if (treeID == null) {
        treeID = "2020063009422050442";
    }
    mini.parse();
    var myData = [];
    //实例化表格对象
    var grid = mini.get("grid1");
    var now = new Date();
    mini.get("end").setValue(now.format("yyyy-MM-dd"));
    mini.get("endHour").setValue(now.getHours());

    var yesterday = new Date(now.getTime() - 24 * 60 * 60 * 1000);
    mini.get("start").setValue(yesterday.format("yyyy-MM-dd"));
    mini.get("startHour").setValue(now.getHours());

    var tm = mini.get("end").getFormValue();
    $(function () {
        //setTimeout(function () {
        //    var bjLayer = window.parent.bjLayer;
        //    if (bjLayer != undefined) {
        //        bjLayer.setVisibility(true);
        //    }
        //    var SHBJ = window.parent.SHBJ;
        //    window.parent.addLine(SHBJ, bjLayer);
        //}, 1500);
        BreakLayerLoad();
    });


    var Rainfall = "";
    function RainfallChange() {
        if (Rainfall != "") {
            JosnSel({
                data: Rainfall
            }, "Rainfall");
        } else {
            GetJosns("ST_WAS_SWLine", {
                "VALUE_STR": RainfallStr
            }, "Rainfall");
        }
    }

    function onValueChanged2() {
        //var Points = { xmin: mini.get("xmin").getValue(), ymin: mini.get("ymin").getValue(), xmax: mini.get("xmax").getValue(), ymax: mini.get("ymax").getValue() };

        if (mini.get("thsq").checked == false) {
            $(window.parent.document).find("#SSYQTTL").hide();
            JosnSel({
                data: Rainfall
            }, "Rainfall");
        } else {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '水位等值面加载中...'
            });
            $(window.parent.document).find("#SSYQTTL").show();
            setTimeout(function () {
                Rainfall = "";
                RainfallChange();
            }, 100);
        }

    }
    function ondrawcell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            value = e.value;
        rowIndex = e.rowIndex;
        var record = e.record;

        //超链接任务
        var s;
        if (field == "stnm") {
            s = '<a title="' + value + '"  href="JavaScript:Trans(\'' + record.stcd + '\',\'' + record.stnm + '\')">' + value +
                '</a>';
            e.cellHtml = s;
        }
    }

    function Trans(stcd, stnm) {
        var tm = mini.get("end").getFormValue() + " " + mini.get("endHour").getValue() + ":00:00";
        var tempTM = new Date(tm.replaceAll("-", "/"));
        var stime = "",
            etime = "";
        if (parseInt(new Date().format("HH")) < 8) {
            stime = addDayDate(tempTM.format("yyyy/MM/dd"), -2) + " 08:00:00";
        } else {
            stime = addDayDate(tempTM.format("yyyy/MM/dd"), -1) + " 08:00:00";
        }
        etime = tempTM.format("yyyy/MM/dd HH:mm:ss");
        openChart("DanZhan/DanZHanMain.html?stcd=" + stcd + "&stnm=" + (stnm) + "&stime=" + stime + "&etime=" + etime +
            "&TYPENAME=水位过程", stnm + "水位过程线", '1200@620');
    }

    function tableBind(data) {
        var dataResult = data;
        grid.setData(dataResult);
    }


    // 分页填充细节处理
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize,
            end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }

    function onSelectionChanged(e) {
        var grid = e.sender;
        var record = grid.getSelected();
        if (record) {
            loc(record.lgtd, record.lttd);
        }
    }

    function BreakLayerLoad() {
        mini.mask({
            el: document.body,
            cls: 'mini-mask-loading',
            html: '加载中...'
        });
        var etime = mini.get("end").getFormValue() + " " + mini.get("endHour").getValue() + ":59:59";
        var stime = mini.get("start").getFormValue() + " " + mini.get("startHour").getValue() + ":00:00";
        strWhere = { "pid": "2026031114184492913-3", "stime": stime, "etime": etime };
        app.post("/GetWaterViewNew/queryBySWMax", strWhere, (data) => {
            JosnSel(data, "Sel")
        });
    }
    var resultData = [];

    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.data != null) {
                resultData = ResultData.data;
            } else {
                resultData = [];
            }
            getData();
        }
        else if (typeID == "Rainfall") {
            var Points = {
                xmin: "120.815295",
                ymin: "30.665293",
                xmax: "122.012805",
                ymax: "31.511996"
            };
            Rainfall = ResultData.data;
            MapRainfall(Points, mini.get("thsq").checked, ResultData.data);
            mini.unmask(document.body);
        }
    }

    function OnClickTitle(objID, treeid) {
        var only = $(".onlyli").removeClass("onlyliHover");
        $("#" + objID).addClass("onlyliHover");
        $.data(myData, "TREEID", treeid);
        setTimeout('BreakLayerLoad()', 1000);
    }
    RainfallStr = "";
    function getData() {
        var Lake1 = getTLObj("cb_waterCB").checked;
        var Lake2 = getTLObj("cb_waterCJ").checked;
        var Lake3 = getTLObj("cb_waterZC").checked;
        var Lake4 = getTLObj("cb_waterQC").checked;

        var sureCount = 0,
            warnCount = 0,
            zcCount = 0,
            qcCount = 0;
        var dt = resultData.filter(function (e) {
            if (e.lgtd != undefined && e.lttd != undefined && e.upz != undefined) {
                if (RainfallStr == "") {
                    RainfallStr += e.lgtd + "," + e.lttd + "," + e.upz;
                } else {
                    RainfallStr += "|" + e.lgtd + "," + e.lttd + "," + e.upz;
                }
            }

            var flag = false;
            var state = "2";

            if (e.grz != undefined && Number(e.grz) > 0) {
                if (Number(e.upz) >= Number(e.grz)) {
                    state = "0";
                }
            }

            var wrzcha = "-";
            if (e.wrz != undefined && Number(e.wrz) > 0) {
                if (Number(e.upz) >= Number(e.wrz)) {
                    wrzcha = (Number(e.upz) - Number(e.wrz)).toFixed(2);
                    if (state != "0") {
                        state = "1";
                    }
                }
            }

            var grzcha = "-";
            if (e.grz != undefined && Number(e.grz) > 0) {
                if (Number(e.upz) >= Number(e.grz)) {
                    grzcha = (Number(e.upz) - Number(e.grz)).toFixed(2);
                }
            }

            var ivhzcha = "-";
            if (e.ivhz != undefined && Number(e.ivhz) > 0) {
                if (Number(e.upz) >= Number(e.ivhz)) {
                    ivhzcha = (Number(e.upz) - Number(e.ivhz)).toFixed(2);
                }
            }
            if (state == "0") {
                sureCount++;
                if (Lake1) {
                    flag = true;
                }
            }
            if (state == "1") {
                warnCount++;
                if (Lake2) {

                    flag = true;
                }
            }
            if (state == "2") {
                zcCount++;
                if (Lake3) {

                    flag = true;
                }
            }
            if (state == "3") {
                qcCount++;
                if (Lake4) {

                    flag = true;
                }
            }
            e.wrzcha = wrzcha;
            e.grzcha = grzcha;
            e.ivhzcha = ivhzcha;
            e.state=state;
            return flag;
        });

        dt = sortObjectArray(dt, ['wrzcha'], 'desc');

        // 调试：检查数据中 upz 和 ivhz 是否存在
        if (dt.length > 0) {
            console.log("第一条数据:", JSON.stringify(dt[0]));
        }

        grid.setData(dt);
        showRowPoint(grid);

        getTLObj("waterCB").innerHTML = sureCount;
        getTLObj("waterCJ").innerHTML = warnCount;
        getTLObj("waterZC").innerHTML = zcCount;
        getTLObj("waterQC").innerHTML = qcCount;
        $.data(myData, "dt", dt);
        addMark(dt);
        // if (mini.get("thsq").checked) {
        //     Rainfall = "";
        //     RainfallChange();
        // }
        mini.unmask(document.body);
    }

    function tlChecked() {
        getData();
    }

    function loc(lgtd, lttd) {
        if (lgtd == undefined && lttd == undefined) {
            window.parent.showTips("缺失经纬度");
        } else {
            dyCenter(lgtd, lttd);
        }
    }

    function btnSearch() {
        BreakLayerLoad();
    }

    function onTMRenderer(e) {
        var value = e.value;
        if (!value) {
            return "—";
        }
        if (value !== "") {
            return new Date(convertToDate(value)).format('MM-dd HH:mm');
        }
        return "—";
    }

    function exp(name) {
        var data = grid.data;
        // var columns = grid.columns;
        // ExportExcel(name, columns, data);
        ExportExcel(data, grid, name);
    }
</script>
