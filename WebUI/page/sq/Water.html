<script type="text/javascript">
    ShowPage(); //map页面会调用
    function ShowPage() {
        openTL("sqtl");
    }
    var treeID = GetQueryString("TREEID");
    if (treeID == null) {
        treeID = "2020063009422050442";
    }
    mini.parse();
    var myData = [];
    //实例化表格对象
    var grid = mini.get("grid1");
    //初始化类型下拉框
    var typeFilter = mini.get("typeFilter");
    typeFilter.setData([
        { id: "2026031114184492913-2,2026031114184492913-7,2026031114184492913-8", text: "全部" },
        { id: "2026031114184492913-3", text: "代表站" },
        { id: "2026031114184492913-2", text: "防汛站" },
        { id: "2026031114184492913-8", text: "海事" },
        { id: "2026031114184492913-7", text: "外省市" }
    ]);
    typeFilter.setValue("2026031114184492913-2");
    var now = new Date();
    mini.get("end").setValue(now.format("yyyy/MM/dd"));
    mini.get("endHour").setValue(now.getHours() + 1);
    var tm = mini.get("end").getFormValue();
    $(function () {
        //setTimeout(function () {
        //    var bjLayer = window.parent.bjLayer;
        //    if (bjLayer != undefined) {
        //        bjLayer.setVisibility(true);
        //    }
        //    var SHBJ = window.parent.SHBJ;
        //    window.parent.addLine(SHBJ, bjLayer);
        //}, 1500);
        BreakLayerLoad();
    });


    var Rainfall = "";
    function RainfallChange() {
        if (Rainfall != "") {
            JosnSel({
                data: Rainfall
            }, "Rainfall");
        } else {
            GetJosns("ST_WAS_SWLine", {
                "VALUE_STR": RainfallStr
            }, "Rainfall");
        }
    }

    function onValueChanged2() {
        //var Points = { xmin: mini.get("xmin").getValue(), ymin: mini.get("ymin").getValue(), xmax: mini.get("xmax").getValue(), ymax: mini.get("ymax").getValue() };

        if (mini.get("thsq").checked == false) {
            $(window.parent.document).find("#SSYQTTL").hide();
            JosnSel({
                data: Rainfall
            }, "Rainfall");
        } else {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '水位等值面加载中...'
            });
            $(window.parent.document).find("#SSYQTTL").show();
            setTimeout(function () {
                Rainfall = "";
                RainfallChange();
            }, 100);
        }

    }
    function ondrawcell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            value = e.value;
        rowIndex = e.rowIndex;
        var record = e.record;

        //超链接任务
        var s;
        if (field == "stnm") {
            s = '<a title="' + value + '"  href="JavaScript:Trans(\'' + record.STCD + '\',\'' + record.stnm + '\')">' + value +
                '</a>';
            e.cellHtml = s;
        }
    }

    function Trans(stcd, stnm) {
        var tm = mini.get("end").getFormValue() + " " + mini.get("endHour").getValue() + ":00:00";
        var tempTM = new Date(tm.replaceAll("-", "/"));
        var stime = "",
            etime = "";
        if (parseInt(new Date().format("HH")) < 8) {
            stime = addDayDate(tempTM.format("yyyy/MM/dd"), -2) + " 08:00:00";
        } else {
            stime = addDayDate(tempTM.format("yyyy/MM/dd"), -1) + " 08:00:00";
        }
        etime = tempTM.format("yyyy/MM/dd HH:mm:ss");
        // openChart("DanZhan/SQLine.html?stcd=" + stcd + "&stnm=" + (stnm) + "&stime=" + stime + "&etime=" + etime +
        //     "&TYPENAME=水位过程", stnm + "水位过程线", '1200@620');


        openChart("DanZhan/DanZHanMain.html?stcd=" + stcd + "&stnm=" + (stnm) + "&stime=" + stime + "&etime=" + etime +
            "&TYPENAME=水位过程", stnm, '1200@620');
    }

    function tableBind(data) {
        var dataResult = data;
        grid.setData(dataResult);
    }


    // 分页填充细节处理
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize,
            end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }

    function onSelectionChanged(e) {
        var grid = e.sender;
        var record = grid.getSelected();
        if (record) {
            loc(record.lgtd, record.lttd);
        }
    }

    function BreakLayerLoad() {
        mini.mask({
            el: document.body,
            cls: 'mini-mask-loading',
            html: '加载中...'
        });
        var etime = mini.get("end").getFormValue() + " " + mini.get("endHour").getValue() + ":00:00";
        var stime = new Date(AddHourDate(etime, -2)).format("yyyy-MM-dd HH:mm:ss");
        var pid = mini.get("typeFilter").getValue();
        strWhere = { "pid": pid,
            "stime": stime, "etime": etime
        };
        app.post("/GetWaterViewNew/queryBySWNew", strWhere, (data) => {
            JosnSel(data, "Sel")
        });
    }
    var resultData = [];

    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.data != null) {
                resultData = ResultData.data;
            } else {
                resultData = [];
            }
            getData();
        }
        else if (typeID == "Rainfall") {
            var Points = {
                xmin: "120.815295",
                ymin: "30.665293",
                xmax: "122.012805",
                ymax: "31.511996"
            };
            Rainfall = ResultData.data;
            MapRainfall(Points, mini.get("thsq").checked, ResultData.data);
            mini.unmask(document.body);
        }
    }

    function OnClickTitle(objID, treeid) {
        var only = $(".onlyli").removeClass("onlyliHover");
        $("#" + objID).addClass("onlyliHover");
        $.data(myData, "TREEID", treeid);
        setTimeout('BreakLayerLoad()', 1000);
    }
    RainfallStr = "";
    function getData() {
        var Lake1 = getTLObj("cb_waterCB").checked;
        var Lake2 = getTLObj("cb_waterCJ").checked;
        var Lake3 = getTLObj("cb_waterZC").checked;
        var Lake4 = getTLObj("cb_waterQC").checked;

        var sureCount = 0,
            warnCount = 0,
            zcCount = 0,
            qcCount = 0;
        var dt = resultData.filter(function (e) {
            if (e.lgtd != undefined && e.lttd != undefined && e.upz != undefined) {

                if (RainfallStr == "") {
                    RainfallStr += e.lgtd + "," + e.lttd + "," + e.upz;
                } else {
                    RainfallStr += "|" + e.lgtd + "," + e.lttd + "," + e.upz;
                }
            }

            var flag = false;
            var state = "2";

            if (e.GRZ != undefined) {
                if (Number(e.upz) >= Number(e.GRZ)) {
                    state = "0";
                }
            } else if (e.wrz != undefined) {
                if (Number(e.upz) >= Number(e.wrz)) {
                    state = "1";
                }
            } else if (e.upz == undefined || e.upz == null) {
                state = "3";
            }
            if (state == "0") {
                sureCount++;
                if (Lake1) {
                    flag = true;
                }
            }
            if (state == "1") {
                warnCount++;
                if (Lake2) {

                    flag = true;
                }
            }
            if (state == "2") {
                zcCount++;
                if (Lake3) {

                    flag = true;
                }
            }
            if (state == "3") {
                qcCount++;
                if (Lake4) {
                    flag = true;
                }
            }
            return flag;
        });
        grid.setData(dt);
        showRowPoint(grid);

        getTLObj("waterCB").innerHTML = sureCount;
        getTLObj("waterCJ").innerHTML = warnCount;
        getTLObj("waterZC").innerHTML = zcCount;
        getTLObj("waterQC").innerHTML = qcCount;
        $.data(myData, "dt", dt);
        addMark(dt);
        if (mini.get("thsq").checked) {
            Rainfall = "";
            RainfallChange();
        }
        mini.unmask(document.body);
    }

    function tlChecked() {
        getData();
    }

    function loc(lgtd, lttd) {
        if (lgtd == undefined && lttd == undefined) {
            window.parent.showTips("缺失经纬度");
        } else {
            dyCenter(lgtd, lttd);
        }
    }

    function btnSearch() {
        BreakLayerLoad();
    }

    function onTypeChange() {
        BreakLayerLoad();
    }

    function onTMRenderer(e) {
        var value = e.value;
        if (!value) {
            return "—";
        }
        if (value !== "") {
            return new Date(convertToDate(value)).format('MM-dd HH:mm');
        }
        return "—";
    }

    function exp(name) {
        var data = grid.data;
        ExportExcel(data, grid, name);
    }
</script>
