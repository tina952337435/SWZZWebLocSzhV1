    function ondrawcell(e) {
        var row = e.row,                                                                                       
            column = e.column,
            field = e.field,
            value = e.value;
        rowIndex = e.rowIndex;
        var record = e.record;
        if (field == "OMCNUM") {
            var s = '';
            var tempNum = record.flpq==null?0:record.flpq;
            // console.error('tempNum',tempNum);
            if (tempNum.toString().lastIndexOf('/')) {
                var AggNum = tempNum.toString().split('/');
                tempNum = AggNum[AggNum.length - 1];
            }
            for (index = 1; index <= Number(tempNum); index++) {
                var tempTM = new Date(new Date().format("yyyy/MM/dd 00:00:00"));
                var temAgg = row.gateList.filter(function (e) {
                    return e.eqptp == "泵站状态" && Number(e.exkey) == index && new Date(convertToDate(e.tm)) > tempTM;
                });
                var gtqVal;
                if (temAgg.length > 0) {
                    gtqVal = temAgg[0].gtq;
                    if (undefined != gtqVal) {
                        if (gtqVal > 0) {
                            s += '<span class="gqGreen">&nbsp;&nbsp;</span> ';
                        } else {
                            s += '<span class="gqRed">&nbsp;&nbsp;</span> ';
                        }
                    } else {
                        s += '<span class="gqXiu">&nbsp;&nbsp;</span> ';
                    }
                } else {
                    s += '<span class="gqXiu">&nbsp;&nbsp;</span> ';
                }
            }
            if (s == "") {
                s = "—";
            }
            e.cellHtml = s;
        }
         else if (field == "GTOPNUM") {
            var s = '';
            var tempTM = new Date(new Date().format("yyyy/MM/dd 00:00:00"));

            for (index = 1; index <= Number(row.grq); index++) {
                var temAgg = [];
                if (row.gateList.length > 0) {
                    temAgg = row.gateList.filter(function (e) {
                        return e.eqptp == "闸坝开度" && Number(e.exkey) == index && Number(e.gtq) > 0.002 && new Date(convertToDate(e.tm)) > tempTM;
                    });
                    if (temAgg.length > 0) {
                        s += '<span class="Grentsquare">&nbsp;&nbsp;</span> ';
                    }
                    else {
                        s += '<span class="HUIsquare">&nbsp;&nbsp;</span> ';
                    }
                } else {
                    s += '<span class="XIUsquare">&nbsp;&nbsp;</span> ';
                }
            }
            if (s == "") {
                s = "—";
            }
            e.cellHtml = s;
        } else if (field == "tm") {
            if (record.tm != undefined) {
                //e.cellHtml = new Date(convertToDate(record.tm)).format("MM/dd HH:mm");
                e.cellHtml = new Date(convertToDate(record.tm)).format("HH:mm");
            } else {
                if (undefined != record.gateList && record.gateList.length > 0) {
                    //e.cellHtml = new Date(convertToDate(record.gateList[0].tm)).format("MM/dd HH:mm");
                    e.cellHtml = new Date(convertToDate(record.gateList[0].tm)).format("HH:mm");
                } else {
                    e.rowStyle = "color:rgb(152, 144, 144)";
                    e.cellHtml = " — ";
                }
            }
        } else if (field == "UPZ") {
            var s = '';
            if (record.UPZ != undefined) {
                s = Number(record.UPZ).toFixed(2);
            } else {
                s = "—";
            }
            if (record.DWZ != undefined) {
                s += "/" + Number(record.DWZ).toFixed(2);
            }
            e.cellHtml = s;
        }
        else if (field == "CHA") {
            if (row.UPZ != undefined && row.DWZ != undefined && row.UPZ != "" && row.DWZ != "" && row.UPZ != "—" && row.DWZ != "—") {
                e.cellHtml = Number(Number(row.UPZ) - Number(row.DWZ)).toFixed(2);
            } else {
                e.cellHtml = "—";
            }
        } else if (field == "stnm") {
            //超链接任务
            var typeName = "工情";
            if (row.flpq != undefined) {
                if (Number(row.flpq) > 0) {
                    typeName = "工情监视";
                }
            } else {
                typeName = "工情";
            }
            var s = '<a title="' + value + '" style="color:blue;" href="javaScript:Trans(\'' + record.stcd + '\',\'' + record.stnm + '\',\'' + typeName + '\')">' + value + '</a>';
            e.cellHtml = s;
        } else if (field == "VIEWNAME") {
            var s = "";
            if (row.gateList != undefined) {
                var tempAgg = row.gateList.filter(function (e) {
                    return e.eqptp == "泵站电流";
                });
                if (tempAgg.length > 0) {
                    s = tempAgg[0].gtq;
                } else {
                    s = value;
                }
            } else {
                s = value;
            }

            e.cellHtml = s;
        }
    }

    function Trans(stcd, stnm, typeName) {
        var tm = mini.get("end").getFormValue();
        var tempTM = new Date(tm.replaceAll("-", "/") + ":00");
        var stime = "", etime = "";
        if (parseInt(new Date().format("HH")) < 8) {
            stime = addDayDate(tempTM.format("yyyy/MM/dd"), -1) + " 08:00:00";
        } else {
            stime = tempTM.format("yyyy/MM/dd 08:00:00");
        }
        etime = tempTM.format("yyyy/MM/dd HH:mm:ss");
        //openChart("page/gq/EngineerLineChart.htm?stcd=" + stcd + "&stnm=" + (stnm) + "&stime=" + tempTM.format("yyyy-MM-dd 08:00:00") + "&etime=" + tempTM.format("yyyy-MM-dd HH:mm:ss"), stnm);
        typeName = "运行状况";
        var param = "stcd=" + stcd + "&stnm=" + (stnm) + "&stime=" + stime + "&etime=" + etime + "&TYPENAME=" + typeName;
        var url = "././DanZhan/DanZHanSel.html?" + param;
        openChart(url, stnm, stcd);
    }

    function onTMRenderer(e) {

    function getQueryVariable(variable) {
        var query = window.location.search.substring(1);
        var vars = query.split("&");
        for (var i = 0; i < vars.length; i++) {
            var pair = vars[i].split("=");
            if (pair[0] == variable) { return pair[1]; }
        }
        return (false);
    }



    var psCount = 0;
    var ysCount = 0;
    var gzCount = 0;

    function getInfo() {
        if (resultData == null)
            return;
        dt = new Array();
        psCount = 0;
        ysCount = 0;
        gzCount = 0;
        var value1 = getTLObj("cb_PS").checked;
        var value2 = getTLObj("cb_YS").checked;
        var value3 = getTLObj("cb_GZ").checked;

        for (var i = 0; i < resultData.length; i++) {
            var OMCN = Number(resultData[i].flpq) + Number(resultData[i].grq);
            if (resultData[i].stcd == "63202652") {
                resultData[i].DWZ = null;
            }
            if (resultData[i].tm != undefined) {
                if (resultData[i].tm.substr(0, 5) == "/Date") {
                    resultData[i].tm = new Date(convertToDate(resultData[i].tm)).format('yyyy/MM/dd HH:mm');
                }
                if (new Date(resultData[i].tm) > new Date(new Date().format("yyyy/MM/dd 00:00:00"))) {
                    OMCN = 0;
                } else {
                    OMCN = undefined;
                }
            } else {
                if (undefined != resultData[i].gateList && resultData[i].gateList.length > 0) {
                    resultData[i].tm = resultData[i].gateList[0].tm;
                } else {
                    OMCN = undefined;
                }
            }
            var tempTM = new Date(new Date().format("yyyy/MM/dd 00:00:00"));

            var temAgg = [];
            if (resultData[i].gateList.length > 0) {
                temAgg = resultData[i].gateList.filter(function (e) {
                    return e.eqptp == "泵站状态" && Number(e.gtq) > 0 && new Date(convertToDate(e.tm)) > tempTM;
                })
                if (temAgg.length == 0) {
                    temAgg = resultData[i].gateList.filter(function (e) {
                        return e.eqptp == "闸坝开度" && Number(e.gtq) > 0.002 && new Date(convertToDate(e.tm)) > tempTM;
                    })
                    resultData[i].OMCN = OMCN;
                    OMCN = temAgg.length;
                }
            }
            else {
                OMCN = undefined;
            }

            if (temAgg.length > 0) {
                OMCN = 1;
            }
            // if(resultData[i].stnm=="华田泾枢纽"){
            //     console.error(resultData[i].stnm,OMCN);
            // }
            if ("".lastIndexOf(resultData[i].stcd) > -1) {
                dt.push(resultData[i]);
            } else {
                resultData[i].OMCN = OMCN;
                if (OMCN == undefined) {
                    gzCount++;
                    if (value3) {
                        dt.push(resultData[i]);
                    }
                }
                else if (OMCN == 0) {
                    ysCount++;
                    if (value2) {
                        dt.push(resultData[i]);
                    }
                }
                else {
                    psCount++;
                    if (value1) {
                        dt.push(resultData[i]);
                    }
                }
            }
        }
        tableBind(dt);
        setTimeout(function () {
            addMark2(dt);
        }, 1000);

    }
    function tableBind(data) {

    // 分页填充细节处理
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }

    function FunTimeOver() {
        timeNum++;
        var tempTimeOver = 0;
        if (timeNum == 180) {
            var now = new Date();
            mini.get("end").setValue(new Date(now.setHours(now.getHours() + 1)).format("yyyy/MM/dd HH:00:00"));
            BreakLayerLoad();
            timeNum = 0;
        } else {
            tempTimeOver = timeOver - timeNum * 1000;
        }
        $("#SpanTM").html("<span style='color:red;'>" + formatDuring(tempTimeOver) + "</span>");
    }

    function formatDuring(result) {
        var minutes = parseInt((result % (1000 * 60 * 60)) / (1000 * 60));
        var seconds = (result % (1000 * 60)) / 1000;
        var tempSeconds = Math.floor(seconds) < 10 ? '0' + seconds : seconds;
        return minutes + ":" + tempSeconds;
    }

    function exp(name) {
        var data = grid.data;
        ExportExcel(data,grid,name);
    }
</script>
