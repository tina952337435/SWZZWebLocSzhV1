<script src="../../Common/Scripts/tab.js" type="text/javascript"></script>
 
<script type="text/javascript">
    mini.parse();
    var grid = mini.get("grid1");
    var stcd = GetQueryString("stcd");
    var stnm = GetQueryString("stnm"); 
    var tm = GetQueryString("tm");
     
    var stime = GetQueryString("stime");
    var etime = GetQueryString("etime");

    $(function () { 
        if (tm == null) {
            tm = new Date();
        } else {
            tm = new Date(tm);
        }
        if (stime == null) {
            stime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
        } else {
            stime = new Date(stime.replaceAll("-", "/")).format("yyyy-MM-dd HH:mm:ss")
        }
        if (etime == null) {
            etime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
        } else {
            etime = new Date(etime.replaceAll("-", "/")).format("yyyy-MM-dd HH:mm:ss")
        } 
        if (new Date(stime) > new Date(tm.format("yyyy-MM-dd HH:mm:ss").replaceAll("-", "/"))) {
            stime = addDayDate(stime, -1) + " 08:00:00"
        }
        mini.get("start").setValue(stime);
        mini.get("end").setValue(etime);
        BreakLayerLoad();
    })
    var strTitle = "";
    var upzData2 = [];
    var dwzData2 = [];
    //使用
    function setChart(data) { 

        var xData = []; 
        var min = 100; var max = 0;
        var minTM = "", maxTM = "";
        for (var i = 0, len = data.length; i < len; i++) {

            var tm;
            if (tm == "") {
                tm = data[i].TM;
            } else {
                tm = mini.formatDate(new Date(data[i].TM.replaceAll("-", "/")), 'MM-dd HH:mm')
            }

            xData.push({ "TM": tm, "UPZ": data[i].UPZ, "DWZ": data[i].DWZ, "Q": Number(data[i].Q).toFixed(2)});
           
        }

        var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
        strNote += ',{"name": "上游水位","codename": "UPZ","tableV":"1","isShow":true,"width":"30%"}';
        strNote += ',{"name": "下游水位","codename": "DWZ","tableV":"1","isShow":true,"width":"30%"}';
        strNote += ',{"name": "流量","codename": "Q","tableV":"1","isShow":true,"width":"30%"}]';
        var LineColor = ['#0000FF', '#00FF00', '#FF0000']; 
        chartLL("main", xData, eval('(' + strNote + ')'), LineColor, "流量");


    }





    var maxUp = 0;
    var minDown = 1000;

    var maxFlow = -100;
    var minFlow = 100;

    var upTime = "";
    var downTime = "";
    var maxFlowTime = "";
    var minFlowTime = "";
    function upAndDown(data) {
        for (var i = 0, len = data.length; i < len; i++) {
            var upz = Number(data[i].UPZ).toFixed(2);
            var tm;
            if (tm == "") {
                tm = data[i].TM;
            } else {
                tm = mini.formatDate(new Date(data[i].TM), 'MM-dd HH:mm')
            }
            var q = Number(data[i].Q).toFixed(2);
            if (maxUp < upz) {
                maxUp = upz;
                upTime = tm;
            }
            if (minDown > upz) {
                minDown = upz;
                downTime = tm;
            }

            if (maxFlow < q) {
                maxFlow = q;
                maxFlowTime = tm;
            }
            if (minFlow > q) {
                minFlow = q;
                minFlowTime = tm;
            }
        }

        if (maxUp == "") {
            maxUp = "无";
        } else {
            maxUp += "m";
        }
        if (upTime == "") {
            upTime = "无";
        }
        if (minDown == "") {
            minDown = "无";
        } else {
            minDown += "m";
        }
        if (downTime == "") {
            downTime = "无";
        }



        if (maxFlow == "") {
            maxFlow = "无";
        } else {
            maxFlow = maxFlow  + "m³/s"
        }
        if (maxFlowTime == "") {
            maxFlowTime = "无";
        }
        if (minFlow == "") {
            minFlow = "无";
        } else {
            minFlow = minFlow  + "m³/s"
        }
        if (minFlowTime == "") {
            minFlowTime = "无";
        }

        $("#upz").html(maxUp);
        $("#dpz").html(minDown);
        $("#upTime").html(upTime);
        $("#downTime").html(downTime);


        $("#maxFlow").html(maxFlow);
        $("#minFlow").html(minFlow);
        $("#maxFlowTime").html(maxFlowTime);
        $("#minFlowTime").html(minFlowTime);
    }

    function noData() {
        $("#upz").html("无");
        $("#dpz").html("无");
        $("#upTime").html("无");
        $("#downTime").html("无");

        $("#maxFlow").html("无");
        $("#minFlow").html("无");
        $("#maxFlowTime").html("无");
        $("#minFlowTime").html("无");
    }


    function onrenderer(e) {
        return parseInt(e.value).toFixed(1)
    }

    var resultData;
    grid.on("beforeload", function (e) {
        e.cancel = true;
        var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
        //fillData(pageIndex,pageSize,resultData);
    });
    function ondrawcell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            Value = e.value;
        rowIndex = e.rowIndex;
        if (field == "Q") {
            if (Value != "") {
                e.cellHtml = Number(Value).toFixed(2);
            }
        }
    }
    function tableBind(data) {
        var dataResult = data.data;
        //fillData(0, grid.getPageSize(), dataResult);
        grid.setData(dataResult);
    }
    // 分页填充细节处理
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }
    function BreakLayerLoad() {
        var startDate = mini.get("start").getFormValue();
        var endDate = mini.get("end").getFormValue();
        var d1 = new Date(startDate.replaceAll("-", "/"));
        var d2 = new Date(endDate.replaceAll("-", "/"));
        if (parseInt(d2 - d1) < 0) {
            mini.alert("开始时间不大于结束时间！");
            return;
        }
        if (parseInt(d2 - d1) / 1000 / 60 / 60 / 24 > 90) {
            mini.alert("时间不能大于三个月！");
            return;
        }
        $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏

        GetJosns("DT_GQXXDZSel", { "STCD": stcd, "STIME": d1.format("yyyy-MM-dd HH:mm:ss"), "ETIME": d2.format("yyyy-MM-dd HH:mm:ss") }, "Sel");
    }

    function JosnSel(data, typeID) {
        if (typeID == "Sel") {
            if (data.total > 0) {
                resultData = eval(data);
                setChart(resultData.data);
                upAndDown(resultData.data);
                tableBind(resultData);
                $('#dataShow').hide();
            } else {
                tableBind([]);
                $("#main").html("<h1 style=\"text-align:center;margin-top:18%;\">暂无数据</h1>"); 
                $('#dataShow').show();
                noData();
            }
            $("#dataLoad").hide();
        }
    }
     
    function btnSearch() {
        BreakLayerLoad();
    }
    function onTabChange(index) {
        if (index > 1) {
            showtitle(false);
        }
        else {
            showtitle(true);
        }
    }
    function showtitle(isShow) {
        if (isShow) {
            $("#selectDiv").css("display", "flex");
            $("#labelDiv").css("display", "table-cell");
        }
        else {
            $("#selectDiv").css("display", "none");
            $("#labelDiv").css("display", "none");
        }
    }

    function doExport() {
        ExportExcel(strTitle);
    }



    function onDrawSummaryCell(e) {
        var value = e.value;
        if (e.field == "Q") {
            value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最大流量: " + Number(value).toFixed(2) + "m³/s</span>" :
                e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最大流量: 无</span>";

        }

        if (e.field == "UPZ") {
            value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最大上游水位: " + Number(value).toFixed(2) + "m</span>" :
                e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最大上游水位: 无</span>";
        }

        if (e.field == "DWZ") {
            value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最小下游水位: " + Number(value).toFixed(2) + "m</span>" :
                e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最小下游水位: 无</span>";
        }
    }
</script>
