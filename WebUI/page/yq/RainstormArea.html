        function hexToRgb(hex) {
            // 移除十六进制颜色代码中的'#'
            let sanitizedHex = hex.replace("#", "");
            // 解析红、绿、蓝值
            let r = parseInt(sanitizedHex.substring(0, 2), 16);
            let g = parseInt(sanitizedHex.substring(2, 4), 16);
            let b = parseInt(sanitizedHex.substring(4, 6), 16);
            var rgbArr = [r, g, b];
            return rgbArr;//`rgb(${r}, ${g}, ${b})`;
        }

        function MapRainfallData(res) {
            if (DZMRainLayerGraphicLayer != null) {
                DZMRainLayerGraphicLayer.clear();
                DZMRainLayerGraphicLayer.setOpacity(0.6);                
                DZMRainLayerGraphicLayer.setVisibility(true);
            }
            if (!res.success) {
                return;
            }
            var flatIsosurfaces = [];

            if (res.success && res.data) {
                Object.keys(res.data).forEach(function (regionId) {
                var regionData = res.data[regionId];
                if (regionData && regionData.isosurfaces) {
                    regionData.isosurfaces.forEach(function (iso) {
                    flatIsosurfaces.push(iso);
                    });
                }
                });
            }
            var isolines = flatIsosurfaces;
            for (const u of isolines) {
                var level = u.level;
                var levelIndex = jibieArr.findIndex(function (l) {
                    return l >= level;
                });
                if (levelIndex < 0) levelIndex = 0;

        function pathDataToPoints(d) {
            // 将SVG路径数据转换为点数组
            // 这里省略具体实现，需要根据SVG路径指令实现解析
            let points = [];
            let instructions = d.split(/(?=[MLC])/); // 正则表达式分割路径指令

            instructions.forEach(instruction => {
                let type = instruction[0];
                let coords = instruction.substr(1).split(/(?=\D)/); // 正则表达式分割坐标
                coords = coords.map(Number); // 将字符串坐标转换为数字

                switch (type) {
                    case 'M': // 移动到
                        points.push({ x: coords[0], y: coords[1], type: 'move' });
                        break;
                    case 'L': // 线到
                        points.push({ x: coords[0], y: coords[1], type: 'line' });
                        break;
                    case 'C': // 三次贝塞尔曲线
                        points.push({ x: coords[0], y: coords[1], type: 'curve' });
                        // 这里可以添加控制点坐标的处理
                        break;
                    // 可以添加其他指令类型的处理
                    default:
                        break;
                }
            });

            return points;
        }

        function areaOfPolygon(points) {
            let area = 0;
            // 假设点是顺时针方向，第一个点和最后一个点相连
            for (let i = 0; i < points.length - 1; i++) {
                area += (points[i][0] * points[i + 1][1]) - (points[i + 1][0] * points[i][1]);
            }
            // 因为最后一个点和第一个点相连，所以要除以2
            area = area / 2;
            return Math.abs(area);
        }

        function approximateAreaOfSVGPath(pathData) {
            const points = pathDataToPoints(pathData); // 将路径数据转换为点数组
            const triangles = []; // 存储由三个点构成的三角形

            // 将多边形分割成多个三角形
            for (let i = 1; i < points.length - 1; i++) {
                triangles.push([points[0], points[i], points[i + 1]]);
            }

            let totalArea = 0;
            // 计算所有三角形的面积并累加
            triangles.forEach(triangle => {
                totalArea += areaOfPolygon(triangle);
            });

            return totalArea;
        }

        function getAreaOfIntersection(path1, path2) {
                // 获取两个路径的DOM元素
                var bbox1 = path1.getBBox();
                var bbox2 = path2.getBBox();

                // 创建一个新的SVG元素用于存放相交区域的path
                var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                var intersectPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                svg.appendChild(intersectPath);
                document.body.appendChild(svg); // 临时添加到DOM中以计算其BBox

                // 使用SVG的'rect'元素的属性来创建一个矩形，该矩形是两个路径重叠的区域
                intersectPath.setAttribute('d', 'M' + bbox1.x + ' ' + bbox1.y + ' L' + (bbox1.x + bbox1.width) + ' ' + bbox1.y + ' L' + (bbox1.x + bbox1.width) + ' ' + (bbox1.y + bbox1.height) + ' L' + bbox1.x + ' ' + (bbox1.y + bbox1.height) + ' L' + bbox1.x + ' ' + bbox1.y);
                intersectPath.setAttribute('fill', 'red');
                intersectPath.setAttribute('fill-opacity', '0'); // 设置透明度为0，使其不可见

                var bboxIntersection = intersectPath.getBBox();

                // 计算并返回相交区域的面积
                var area = (bboxIntersection.width * bboxIntersection.height);

                // 清理，移除临时添加的元素
                svg.parentNode.removeChild(svg);

                return area;
            }

        function calculationArea() {
            //求每一块有多少交集的
            var fugraphics = DZMRainLayerGraphicLayer.graphics;
            var fuAreaArr = [];
            require([
                "esri/geometry/geometryEngine"
            ], function (geometryEngine) {
                for (var k = 0; k < fugraphics.length; k++) {
                    var fuG = fugraphics[k];
                    var bianhao=fuG.attributes.id;
                    //叠在上面的或者同级别的
                    var zigraphics=fugraphics.filter(function(res){
                        return Number(res.attributes.id)>Number(bianhao);
                    });
                    // console.error('bianhao',bianhao,'zigraphicsTemp',zigraphicsTemp,"drplevel",fuG.attributes.drplevel);
                    var lastGeometry = fuG.geometry;//前一个对象
                    var children = [];
                    var drplevelArr = [];
                    var children_id = [];
                    for (var g = 0; g < zigraphics.length; g++) {
                        var ziItem=zigraphics[g];
                        var myPolygon = ziItem.geometry;
                        //使用geometryEngine检查交集
                        var intersects = geometryEngine.intersects(myPolygon, lastGeometry);
                        if (intersects) {
                            children.push(ziItem);
                            drplevelArr.push(ziItem.attributes.drplevel);
                            children_id.push(ziItem.attributes.id);
                        }
                    }
                    fuG.ischildren = children;
                    fuG.drplevelArr = drplevelArr;
                    fuG.drplevelArr = drplevelArr;
                    fuG.children_id = children_id;
                    fuAreaArr.push(fuG);
                }
            
                //分组计算面积
                var areaNoteArr=[];
                var bianhaoArr=[]; //记录被减过的编号
                for(var num=jibieArr.length-1;num>=0;num--){

                        });

                        totalarea=0;

                if (areaFilter) {
                    areaMatch = item.getAttribute('data-addvnm') === areaFilter;

                if (textMatch && areaMatch) {
                    item.style.display = '';
                    visibleCount++;

                }
                noResult.style.display = '';
            } else if (noResult) {
                noResult.style.display = 'none';
            }
        }

        // 更新已排除站点数量显示
        function updateExcludedCount() {
            var el = document.getElementById('excludedCount');
            if (el) {
                el.innerHTML = excludedStations.size > 0 ? '（已排除 ' + excludedStations.size + ' 个）' : '';
            }
        }

        // 单个站点复选框变化
        function onStationCheckChange(stcd, checked) {
            if (checked) {
                excludedStations.delete(stcd);
            } else {
                excludedStations.add(stcd);
            }
            updateExcludedCount();
            // 更新地图标记透明度
            if (RainLayerGraphicLayer) {
                var graphics = RainLayerGraphicLayer.graphics;
                for (var j = 0; j < graphics.length; j++) {
                    var g = graphics[j];
                    if (g.attributes && g.attributes.stcd === stcd) {
                        setMarkerOpacity(g, checked ? 1.0 : 0.2);
                        break;
                    }
                }
            }
            // 重新计算等值面
            refreshRainfallStr();
        }

        // 重新构建RainfallStr（排除站点value=0，仍传给API保证插值不报错）并刷新等值面
        function refreshRainfallStr() {
            var obj = $.data(myData, "STATIONDATA");
            if (!obj) return;
            RainfallStr = [];
            for (var i = 0; i < obj.length; i++) {
                var item = obj[i];
                if (item.lgtd == undefined && item.lttd == undefined) continue;
                var f = parseFloat(item.drp);
                // 被排除的站点value置0，但仍传给API以保证插值算法有完整的空间参考点
                var value = excludedStations.has(item.stcd) ? 0 : f;
                if(excludedStations.has(item.stcd)){
                    console.error(item.stnm,value);
                }
                if (SetNull(item.lgtd) != "" && SetNull(item.lttd) != "") {
                    RainfallStr.push({ lon: item.lgtd, lat: item.lttd, value: value });
                    if (item.stcd == "63422650") {
                        RainfallStr.push({ lon: -58570.8187561, lat: -14245.7293732, value: value });
                    }
                    if (item.stcd == "63422480") {
                        RainfallStr.push({ lon: -45857.005352, lat: -45373.137903, value: value });
                    }
                    if (item.stcd == "X1160101") {
                        RainfallStr.push({ lon: -18971.869913, lat: -60205.822566, value: value });
                    }
                }
            }
            MapRainfall();
        }

        // 获取当前可见（未被筛选隐藏）的站点列表项
        function getVisibleStationItems() {
            var allItems = document.querySelectorAll('#stationListContent .station-list-item');
            var visible = [];
            for (var i = 0; i < allItems.length; i++) {
                if (allItems[i].style.display !== 'none') {
                    visible.push(allItems[i]);
                }
            }
            return visible;
        }

        // 全选当前可见站点
        function selectAllStations() {
            var visibleItems = getVisibleStationItems();
            for (var i = 0; i < visibleItems.length; i++) {
                var cb = visibleItems[i].querySelector('input[type="checkbox"]');
                if (cb) {
                    cb.checked = true;
                    // 从排除集合中移除
                    var stcd = cb.id.replace('stationCb_', '');
                    excludedStations.delete(stcd);
                }
            }
            updateExcludedCount();
            // 恢复可见标记透明度
            if (RainLayerGraphicLayer) {
                var graphics = RainLayerGraphicLayer.graphics;
                for (var j = 0; j < graphics.length; j++) {
                    var g = graphics[j];
                    if (g.attributes && g.attributes.stcd && !excludedStations.has(g.attributes.stcd)) {
                        setMarkerOpacity(g, 1.0);
                    }
                }
            }
            refreshRainfallStr();
        }

        // 取消全选（仅排除当前可见站点）
        function deselectAllStations() {
            var visibleItems = getVisibleStationItems();
            for (var i = 0; i < visibleItems.length; i++) {
                var cb = visibleItems[i].querySelector('input[type="checkbox"]');
                if (cb) {
                    cb.checked = false;
                    var stcd = cb.id.replace('stationCb_', '');
                    excludedStations.add(stcd);
                }
            }
            updateExcludedCount();
            // 可见标记半透明
            if (RainLayerGraphicLayer) {
                var graphics = RainLayerGraphicLayer.graphics;
                for (var j = 0; j < graphics.length; j++) {
                    var g = graphics[j];
                    if (g.attributes && g.attributes.stcd && excludedStations.has(g.attributes.stcd)) {
                        setMarkerOpacity(g, 0.2);
                    }
                }
            }
            refreshRainfallStr();
        }

        // 反选当前可见站点
        function invertStationSelection() {
            var visibleItems = getVisibleStationItems();
            for (var i = 0; i < visibleItems.length; i++) {
                var cb = visibleItems[i].querySelector('input[type="checkbox"]');
                if (!cb) continue;
                var stcd = cb.id.replace('stationCb_', '');
                if (excludedStations.has(stcd)) {
                    excludedStations.delete(stcd);
                    cb.checked = true;
                } else {
                    excludedStations.add(stcd);
                    cb.checked = false;
                }
            }
            updateExcludedCount();
            // 更新标记透明度
            if (RainLayerGraphicLayer) {
                var graphics = RainLayerGraphicLayer.graphics;
                for (var j = 0; j < graphics.length; j++) {
                    var g = graphics[j];
                    if (g.attributes && g.attributes.stcd) {
                        setMarkerOpacity(g, excludedStations.has(g.attributes.stcd) ? 0.2 : 1.0);
                    }
                }
            }
            refreshRainfallStr();
        }

        // 监听Ctrl键状态，用于Ctrl+点击地图标记切换排除
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Control' || e.keyCode === 17) ctrlKeyPressed = true;
        });
        document.addEventListener('keyup', function (e) {
            if (e.key === 'Control' || e.keyCode === 17) ctrlKeyPressed = false;
        });
        // 窗口失去焦点时重置Ctrl状态，防止状态卡住
        window.addEventListener('blur', function () {
            ctrlKeyPressed = false;
        });
    </script>
</body>

</html>
