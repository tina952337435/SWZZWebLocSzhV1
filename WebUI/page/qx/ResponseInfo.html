<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <!--STATUS OK-->
    <meta content="" charset="utf-8" />
    <meta name="description" content="产品项目" />
    <meta name="keywords" content="产品项目" />
    <meta http-equiv="imagetoolbar" content="no" />
    <meta property="wb:webmaster" content="10fd28588b2f9686" />
    <meta name="sogou_site_verification" content="Mtd2WIt6Ne" />
    <meta name="msvalidate.01" content="2D36557CC0E331F85475A3B85DAAA4FC" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta http-equiv="Access-Control-Allow-Origin" content="*" />
    <title>产品项目--应急响应信息</title>
    <script src="../../arcgis_js_api/myJs/mapConfig.js" type="text/javascript"></script>
    <script src="../../arcgis_js_api/library/3.31/3.31/init.js" type="text/javascript"></script>
    <script src="../../Common/boot.js" type="text/javascript"></script>
    <script src="../../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
    <link href="../../arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" />

    <style type="text/css">
        .mini-grid-row-alt {
            background: #ffffff !important;
        }
    </style>
</head>
<body style="font-size:14px;font-family:arial;">
    <div class="flex" style="width: 100%; height: 100%; overflow: hidden; margin: auto">
        <div class="biaoheader">
            <p class="NONEp"></p>
            应急响应信息
        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 98%; height: 95%; margin: auto;"
             showpager="false" allowalternating="true" idfield="id" allowresize="false"
             sortmode="client" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
            <div property="columns">
                <div type="indexcolumn" width="50" align="center" headeralign="center">序号</div>
                <div field="deptwx" width="120" align="center" headeralign="center" allowsort="true">
                    分区名称
                </div>
                <div field="signal_LEVEL" width="100" align="center" headeralign="center" allowsort="true" renderer="onLevelRenderer">
                    响应等级
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        mini.parse();
        var grid = mini.get("grid1");

        function loadData() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });

            app.post("SWZZ_DATA_emergency_response/findLatestByDeptwx", {}, function (res) {
                mini.unmask(document.body);
                if (res && res.isSuccess && res.data) {
                    grid.setData(res.data);
                } else {
                    if (res && res.message) {
                        mini.alert(res.message);
                    }
                }
            });
        }

        // 响应等级列渲染：signal_STAGE为"解除"时显示"无"，否则按等级着色
        function onLevelRenderer(e) {
            var row = e.record;
            if (row.signal_STAGE === "解除") {
                return "无";
            }
            var level = row.signal_LEVEL;
            var colorMap = {
                "Ⅳ": { color: "#2256F8", name: "蓝" },
                "Ⅲ": { color: "#F0F11D", name: "黄" },
                "Ⅱ": { color: "#F39D1D", name: "橙" },
                "Ⅰ": { color: "#FB0101", name: "红" }
            };
            var cfg = colorMap[level];
            if (cfg) {
                return '<span style="color:' + cfg.color + ';font-weight:bold;">' + level + '(' + cfg.name + ')</span>';
            }
            return level;
        }

        $(function () {
            loadData();
        });
    </script>
</body>
</html>
