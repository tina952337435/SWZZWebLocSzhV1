<script type="text/javascript">
    var myData = [];
    function ShowPage() {
        //openTL("yqtl");
    }
    var A_PathName = "";
    A_PathName = GetQueryString("PathName");
    if (A_PathName == null || A_PathName == "") {
        A_PathName = "国家海洋潮位预报";
    }
    mini.parse();
    //实例化表格对象
    var grid = mini.get("grid1");
    var type ="24";
    var typeStr = "0";
    function onCombChanged(e) {
        getInfo();
    }

    var list2 = mini.get("rb2");
    list2.load([{ "id": "1000", "text": "1秒" }, { "id": "1500", "text": "1.5秒" }, { "id": "2000", "text": "2秒"}]);

    function onCombChanged2(e) {
        var hour = list2.getValue();
        play(hour);
    }
    function onValueChanged(e) {
        getInfo();
    }

    function lookTrans() {
        var url = "http://www.nmefc.cn/stormSurgeViews/temperate";
        if (A_PathName == "台风风暴潮数值预报") {
            url = "http://www.nmefc.cn/stormSurgeViews/typhoon";
        }
        window.open(url);
    }

    function play(hour) {
        debugger;
        startCount(hour);
        $("#playBtn").html("停止播放");
    }
    function play2() {
        if ($("#playBtn").html() == "停止播放") {
            stopCount();
            $("#playBtn").html("播放");
        } else {
            play(list2.getValue());
        }
    }

    var t;
    function startCount(hour) {
        t = setInterval("TimeShowYT()", hour);
    }
    function stopCount() {
        if (t) {
            clearInterval(t);
        }
    }
    function TimeShowYT() {
        var row = grid.getSelected();
        var index = grid.indexOf(row);
        var total = grid.data.length;
        index++;
        index = index % total;
        selectRow(index);
    }
    grid.on("beforeload", function (e) {
        e.cancel = true;
        var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
    });
    function ondrawcell(e) {
        var row = e.row,
        column = e.column,
        field = e.field,
        value = e.value;
        rowIndex = e.rowIndex;
    }

    var resultData;
    var dt;
    window.onload = function () {
        BreakLayerLoad();
    };

    function getInfo() {
        var dt = resultData;
        tableBind(dt);
    }

    function tableBind(data) {
        var dataResult = data;
        grid.setData(data);
        selectRow(0);
    }
    // 分页填充细节处理
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }
    function onRowClick(e) {
        var grid = e.sender;
        var record = grid.getSelected();
        if (record) {
            //loc(record.LGTD, record.LTTD);
            var Imgs = new Date(convertToDate(record.TBA_GETDATE)).format("yyyyMMdd") + "/" + record.TBA_FILENAME;
            ShowYT(Imgs, A_PathName);
        }
    }
    function tlCount() {

    }
    function tlChecked() {
        getInfo();
    }
    var today = new Date();
    var sdate = mini.formatDate(today, 'yyyy-MM-dd');
    function BreakLayerLoad() {
        $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
        var now = new Date();
        var s_where = { "STIME": new Date(addDayDate(now.format("yyyy-MM-dd HH:mm:ss"),-3)).format("yyyy-MM-dd 00:00:00"), "ETIME": now.format("yyyy-MM-dd 23:59:59"), "TBA_INFOTYPE": A_PathName };
            GetQXJosns("DATA_TBA_WEACONTENTSel", s_where, "Sel");
    }
    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.total > 0) {
                resultData = eval(ResultData.data);
                $.data(myData, "resule", resultData);
                getInfo();

                $('#dataShow').hide();
            } else {
                $('#dataShow').show();
            }
            $("#dataLoad").hide();
        }
    }
    function selectRow(index) {
        var row = grid.getRow(index);
        grid.select(row, true);
    }
    function btnSearch() {
        BreakLayerLoad();
    }
    function hide() {
        stopCount();
        $("#playBtn").html("自动播放");
        ShowYT("", "");
    }

    function onTMRenderer(e) {
        var value = e.value;
        if (!value) {
            return;
        }
        if (value !== "")
            return mini.formatDate(new Date(convertToDate(value)), 'yyyy-MM-dd HH:mm');
        //return mini.parseDate('yyyy-MM-dd HH:mm');
        return "";
    }
</script>
