<body style="font-size:14px;font-family:arial;">
    <!--水情信息-->
    <div class="flex" style="width: 100%; height: 100%; overflow: hidden; margin: auto">
        <!--<div class="biaoheader" >
        条件选择</div>-->
        <div class="right box" style="height: 40px;">
            <div style="width:100%;height:30px;display:none;">
                <div style="width:70px; float: left;overflow:hidden;margin-left:5px;">
                    <p style="height: 30px;">
                        <span class="label" style="width: 70px;line-height: 30px;">时间区间：</span>
                    </p>

                </div>
                <div id="rbl" style="width: 230px;margin-top:5px;float: left; overflow: hidden;" class="mini-radiobuttonlist"
                    textfield="text" valuefield="id" value="72" onvaluechanged="onCombChanged">
                </div>
            </div>
            <div style="height:40px;width:100%;line-height:40px;">
                <p class="label" style="width: 70px; float: left; margin-left: 5px;">播放速度：</p>
                <div id="rb2" style="width:165px;margin-top:12px;float: left;" class="mini-radiobuttonlist" textfield="text"
                    valuefield="id" value="1000" onvaluechanged="onCombChanged2"></div>
                <p id="playBtn" style="float:left;margin-top:8px;" class="btn btn-primary" onclick="play()">播放</p>
            </div>

        </div>
        <div style="margin-top:10px; " id="DivTitles">
            <ul class="onlytab">
                <li id="TitleLi0" onclick="OnClickTitle(this.id,'yfw_014')" class="onlyli start onlyliHover">500</li>
                <li id="TitleLi1" onclick="OnClickTitle(this.id,'yfw_013')" class="onlyli">700</li>
                <li id="TitleLi3" onclick="OnClickTitle(this.id,'yfw_012')" class="onlyli end">850</li>
            </ul>
        </div>
        <div class="biaoheader">
            <p class="NONEp">
            </p>
            EC风场预报图

            <a href="###" id="source" onclick="lookTrans()" style="text-decoration:underline; font-weight:bold;margin-left:10px;color: blue;display: none;">【数据来源】</a>

        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 98%; height: 100%; margin: auto; " showpager="false"
            allowalternating="true" idfield="tba_FLAG" allowresize="false" onselectionchanged="onRowClick">
            <div property="columns">
                <!--style="display:none;"-->
                <!--<div type="indexcolumn" width="60" align="center" headerAlign="center">序号</div>-->

    <div id="dataShow" style="position:absolute;top:50%;left:50%;margin-left:-55px; font-size:28px; font-weight:bold; display:none">暂无数据</div>

    <!--页面载入显示-->

        <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">

                    &nbsp;
                </td>
            </tr>

            </tr>

                    数据载入中，请稍后...
                </td>
            </tr>
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
        </table>

<script type="text/javascript">
    function ShowPage() {
        //openTL("sqtl");
    }
    var A_PathName = "";
    A_PathName = GetQueryString("PathName");
    if (A_PathName == null || A_PathName == "") {
        A_PathName = "EC风场预报图";
    }
    mini.parse();
    //实例化表格对象
    var grid = mini.get("grid1");

    var list = mini.get("rbl");
    var type = "72";

    list.load([{ "id": "12", "text": "12小时" }, { "id": "24", "text": "24小时" }, { "id": "48", "text": "48小时" }]);
    //grid.rowmousedown(e) {
    //    alert("11")
    //}
    function onCombChanged(e) {
        $("#dataLoad").show();
        type = list.getValue();
        BreakLayerLoad();
    }

    function lookTrans() {
        var url = "http://www.nmefc.cn/szyb/fc.aspx";
        window.open(url);
    }

    var list2 = mini.get("rb2");
    var hour = 1000;
    list2.load([{ "id": "1000", "text": "1秒" }, { "id": "1500", "text": "1.5秒" }, { "id": "2000", "text": "2秒" }]);

    function onCombChanged2(e) {
        hour = list2.getValue();
        stopCount();
        startCount(hour);
        $("#playBtn").html() == "停止播放";
    }

    function play() {
        if ($("#playBtn").html() == "停止播放") {
            stopCount();
            $("#playBtn").html("播放");
        }
        else {
            hour = list2.getValue();
            startCount(hour);
            $("#playBtn").html("停止播放");
        }
    }
    var t;
    function startCount(hour) {
        t = setInterval("TimeShowYT()", hour);
    }
    function stopCount() {
        if (t) {
            clearInterval(t);
        }
    }
    function TimeShowYT() {
        var row = grid.getSelected();
        var index = grid.indexOf(row);
        var total = grid.data.length;
        index++;
        index = index % total;
        selectRow(index);
    }
    var resultData;
    var dt;
    var myData = [];
    window.onload = function () {
        $.data(myData, "tba_FLAG", "yfw_014");
        BreakLayerLoad();
    };

    function getInfo() {
        var data = resultData.filter(function (res) {
            return res.tba_FLAG == $.data(myData, "tba_FLAG");
        });
        tableBind(data);
    }
    function tableBind(data) {
        var dataResult = data;
        grid.setData(dataResult);
    }
    function onRowClick(e) {
        var grid = e.sender;
        var record = grid.getSelected();
        if (record) {
            var Imgs = new Date(new Date(record.tba_GETDATE)).format("yyyyMMdd") + "/" + record.tba_FILENAME;
            ShowYT(Imgs, A_PathName);
        }
    }
    function BreakLayerLoad() {
        $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
        var now = new Date("2024-10-21 08:00:00");//new Date();//
        var stime = "";
        var etime = "";
            stime = new Date(now.getTime() - 12 * 60 * 60 * 1000).format("yyyy-MM-dd HH:mm:ss")//now.format("yyyy-MM-dd") + " " + (now.getHours() - 12) < 0 ? "00:" : (now.getHours() - 12) + ":00:00";
            etime = now.format("yyyy-MM-dd HH:mm:ss");
        
        var strWhere = {
            "startdate": stime, "enddate": etime,
            "pattem": A_PathName, //"TBA_HAVE": A_PathName
        };
        //GetQXJosns("DATA_TBA_WEACONTENTSel", strWhere, "Sel");
        app.post("SWZZ_QXSJ_tba_weacontent/findResult", strWhere, (data) => {
            JosnSel(data, "Sel")
        })
    }
    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.total > 0) {
                resultData = ResultData.data;
                getInfo();
                selectRow(0);
                $('#dataShow').hide();
            } else {
                resultData = [];
                getInfo();
                $('#dataShow').show();
            }
            $("#dataLoad").hide();
        }
    }
    function selectRow(index) {
        var row = grid.getRow(index);
        grid.select(row, true);
    }
    function hide() {
        stopCount();
        $("#playBtn").html("自动播放");
        ShowYT("", "");
    }
    function OnClickTitle(objID, objPathName) {//选择类型
        var only = $(".onlyli").removeClass("onlyliHover");
        $("#" + objID).addClass("onlyliHover");

        $.data(myData, "tba_FLAG", objPathName);
        getInfo();
        selectRow(0);
    }
</script>
