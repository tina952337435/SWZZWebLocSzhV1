<script type="text/javascript">
    var myData = [];
    function ShowPage() {
        //openTL("yqtl");
    }
    var A_PathName = "";
    A_PathName = GetQueryString("PathName");
    if (A_PathName == null || A_PathName == "") {
        A_PathName = "全国雨量预报";
    }
    mini.parse();
    //实例化表格对象
    var grid = mini.get("grid1");

    var list = mini.get("rbl");
    var type = "24";

    list.load([{ "id": "0", "text": "最新数据" }, { "id": "1", "text": "实时数据" }]);
    //list.setValue("24小时");
    var typeStr = "0";
    function onCombChanged(e) {
        typeStr = list.getValue();
        getInfo();
    }

    function lookTrans() {
        var url = "http://www.nmc.cn/publish/precipitation/1-day.html";
        window.open(url);
    }

    var list2 = mini.get("rb2");

    list2.load([{ "id": "1000", "text": "1秒" }, { "id": "1500", "text": "1.5秒" }, { "id": "2000", "text": "2秒"}]);

    function onCombChanged2(e) {
	stopCount();
        var hour = list2.getValue();
        play(hour);
    }

    //    function onRenderer(e) {
    //        var value = e.value;
    //        var s = value + "小时";
    //        return s;
    //    }

    function onValueChanged(e) {
        getInfo();
    }


    function play(hour) {
        //debugger;
        startCount(hour);
        $("#playBtn").html("停止播放");
    }
    function play2() {
        if ($("#playBtn").html() == "停止播放") {
            stopCount();
            $("#playBtn").html("播放");
        } else {
            play(list2.getValue());
        }
    }

    var t;
    function startCount(hour) {
        t = setInterval("TimeShowYT()", hour);
    }
    function stopCount() {
        if (t) {
            clearInterval(t);
        }
    }
    function TimeShowYT() {
        var row = grid.getSelected();
        var index = grid.indexOf(row);
        var total = grid.data.length;
        index++;
        index = index % total;
        selectRow(index);
    }
    grid.on("beforeload", function (e) {
        e.cancel = true;
        var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
    });
    function ondrawcell(e) {
        var row = e.row,
        column = e.column,
        field = e.field,
        value = e.value;
        rowIndex = e.rowIndex;
    }

    var resultData;
    var dt;
    window.onload = function () {
        BreakLayerLoad();
    };

    function getInfo() {
        //var t = mini.get("ckb1");
        resultData = $.data(myData, "resule");
        var dtss = [];
        if (resultData != undefined) {
            dtss = groupBy(resultData, 'tba_NOTE');
        }
        console.error(dtss);
        var ss = {
            "24": { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": 24 },
            "48": { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": 48 },
            "72": { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": 72 },
            "96": { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": 96 },
            "120": { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": 120 },
            "144": { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": 144 },
            "168": { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": 168 }
        };
        ss = {};
        if ($.data(myData, "SS") == undefined) {

            if (dtss.length > 0) {
                var strJson = mini.decode(dtss);
                if (strJson.length > 0) {
                    for (num = 0; num < strJson.length; num++) {
                        var dataTemp = sortObjectArray(strJson[num], ['tba_DESDATE'], 'desc');
                        //for (var _i = 0; _i < dataTemp.length; _i++) {
                        //    var tm = new Date(dataTemp[_i].TBA_DESDATE).format("yyyy-MM-dd HH:mm:ss");
                        //    console.error(_i,tm);
                        //}
                        var tempSS = parseInt(dataTemp[0].tba_NOTE);//parseInt(dataTemp[0]['tba_FILENAME'].slice(12).replace('00.JPG', ''));
                        
                        var strWhere = { "TM": "", "ZJ_HOUR": "", "ZJ_PIC": "", "DAYS": tempSS };
                        ss[tempSS] = strWhere;
                    }
                }
            }
            $.data(myData, "SS", ss);
        } else {
            ss = $.data(myData, "SS");
        }
        if (!!resultData && resultData instanceof Array) {
            resultData.forEach(function (item) {
                item['tba_FILETYPE'] = parseInt(item.tba_NOTE);//parseInt(item['tba_FILENAME'].slice(12).replace('00.JPG', ''));
            });
        }
		console.log(ss)
        var dt = [];
        if (typeStr == "0") {
            for (var key in ss) {
                if (resultData != null) {
                    if (resultData.length > 0) {
                        var menu_node2 = resultData.filter(function (e) {
                            return e.tba_NOTE == ss[key].DAYS;
                        });
                        if (menu_node2[0] != null) {
                            dt.push(menu_node2[0]);
                        }
                    }
                }
            }
        } else {
            if (resultData != null) {
                for (var i = 0; i < resultData.length; i++) {
                    if (resultData[i] != null) {
                        dt.push(resultData[i]);
                    }
                }
            }
        }
        tableBind(dt);
    }

    function tableBind(data) {
		console.log(data);
        var dataResult = data;
        grid.setData(data);
        selectRow(0);
    }
    // 分页填充细节处理
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }
    function onRowClick(e) {
        var grid = e.sender;
        var record = grid.getSelected();
        if (record) {
            //loc(record.LGTD, record.LTTD);
            var Imgs =new Date(new Date(record.tba_GETDATE)).format("yyyyMMdd") + "/" + record.tba_FILENAME;
            ShowYT(Imgs, A_PathName);
        }
    }
    function tlCount() {

    }
    function tlChecked() {
        getInfo();
    }
    var today = new Date();
    var sdate = mini.formatDate(today, 'yyyy-MM-dd');
    function BreakLayerLoad() {
        $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
        var now = new Date();//

        var stime=new Date(addDayDate(now.format("yyyy-MM-dd HH:mm:ss"), -1)).format("yyyy-MM-dd 00:00:00");
        //var stime=now.format("yyyy-MM-dd 23:59:59");
        // stime="2024-07-28 00:00:00";
        // etime="2024-07-28 23:59:59";
        var s_where = { 
			"startdate": stime,
			 "enddate": now.format("yyyy-MM-dd 23:59:59"),
			  "pattem": A_PathName };
            //GetQXJosns("DATA_TBA_WEACONTENTSel", s_where, "Sel");
			app.post("SWZZ_QXSJ_tba_weacontent/findResult",s_where,(data)=>{
				JosnSel(data,"Sel")
			})
    }
    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.total > 0) {
				ResultData.data.sort((a,b)=>{
					return new Date(b.tba_GETDATE).getTime() - new Date(a.tba_GETDATE).getTime();
				})
                resultData = eval(ResultData.data);
                $.data(myData, "resule", resultData);
                getInfo();

                $('#dataShow').hide();
            } else {
                $('#dataShow').show();
            }
            $("#dataLoad").hide();
        }
    }
    function selectRow(index) {
        var row = grid.getRow(index);
        grid.select(row, true);
    }
    function btnSearch() {
        BreakLayerLoad();
    }
    function hide() {
        stopCount();
        $("#playBtn").html("自动播放");
        ShowYT("", "");
    }

    function onTMRenderer(e) {
        var value = e.value;
        if (!value) {
            return;
        }
        if (value !== "")
            return mini.formatDate(new Date(new Date(value)), 'yyyy-MM-dd HH:mm');
        //return mini.parseDate('yyyy-MM-dd HH:mm');
        return "";
    }
</script>
