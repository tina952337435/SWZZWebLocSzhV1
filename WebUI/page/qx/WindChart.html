<body style="font-size:14px;font-family:arial;">
    <!--水情信息-->

        条件选择</div>-->
        <div class="right box" style="height: 40px;">
            <div style="width:100%;height:30px;display:none;">
                <div style="width:70px; float: left;overflow:hidden;margin-left:5px;">

                <div id="rbl" style="width: 230px;margin-top:5px;float: left; overflow: hidden;" class="mini-radiobuttonlist" textfield="text" valuefield="id" value="24" onvaluechanged="onCombChanged">

            <div style="height:40px;width:100%;line-height:40px;">
                <p class="label" style="width: 70px; float: left; margin-left: 5px;">播放速度：</p>
                <div id="rb2" style="width:165px;margin-top:12px;float: left;" class="mini-radiobuttonlist" textfield="text" valuefield="id" value="1000" onvaluechanged="onCombChanged2"></div>

            </div>

        </div>
        <div style="margin-top:10px;display: none; " id="DivTitles">

                <li id="TitleLi3" onclick="OnClickTitle(this.id,'9')" class="onlyli">9时</li>
                <li id="TitleLi4" onclick="OnClickTitle(this.id,'12')" class="onlyli">12时</li>
                <li id="TitleLi5" onclick="OnClickTitle(this.id,'15')" class="onlyli">15时</li>
                <li id="TitleLi6" onclick="OnClickTitle(this.id,'18')" class="onlyli">18时</li>
                <li id="TitleLi7" onclick="OnClickTitle(this.id,'21')" class="onlyli end">21时</li>

            </p>

        </div>
        <div id="grid1" class="left mini-datagrid" style="width: 98%; height: 100%; margin: auto; "
             showpager="false" allowalternating="true" idfield="tba_FILENAME" allowresize="false"

<script type="text/javascript">
    function ShowPage() {
        //openTL("sqtl");
    }
    var A_PathName = "";
    A_PathName = GetQueryString("PathName");
    if (A_PathName == null || A_PathName == "") {
        A_PathName = "全国10m风";
    }
    mini.parse();
    //实例化表格对象
    var grid = mini.get("grid1");

    var list = mini.get("rbl");
    var type = "24";

    list.load([{ "id": "12", "text": "12小时" }, { "id": "24", "text": "24小时" }, { "id": "48", "text": "48小时" }]);
    var myData = [];
    function onCombChanged(e) {
        $("#dataLoad").show();
        type = list.getValue();
        BreakLayerLoad();
    }


    function lookTrans() {
        var url = "http://www.nmefc.cn/szyb/fc.aspx";
        window.open(url);
    }

    var list2 = mini.get("rb2");
    var hour = 1000;
    list2.load([{ "id": "1000", "text": "1秒" }, { "id": "1500", "text": "1.5秒" }, { "id": "2000", "text": "2秒" }]);

    function onCombChanged2(e) {
        hour = list2.getValue();
        stopCount();
        startCount(hour);
        $("#playBtn").html() == "停止播放";
    }

    function play() {
        if ($("#playBtn").html() == "停止播放") {
            stopCount();
            $("#playBtn").html("播放");
        }
        else {

            hour = list2.getValue();
            startCount(hour);
            $("#playBtn").html("停止播放");
        }
    }
    var t;
    function startCount(hour) {
        t = setInterval("TimeShowYT()", hour);
    }
    function stopCount() {
        if (t) {
            clearInterval(t);
        }
    }
    function TimeShowYT() {
        var row = grid.getSelected();
        var index = grid.indexOf(row);
        var total = grid.data.length;
        index++;
        index = index % total;
        selectRow(index);
    }
    grid.on("beforeload", function (e) {
        e.cancel = true;
        var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
    });
    function ondrawcell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            value = e.value;
        rowIndex = e.rowIndex;
    }

    var resultData;
    var dt;
    window.onload = function () {
        BreakLayerLoad();
    };

    function getInfo() {
        tableBind(resultData);
    }
    function tableBind(data) {
        var dataResult=[];
        for(var num=0;num<data.length;num++){
            var item=data[num];
            var tbaTM=new Date(new Date(item.tba_GETDATE).addDate('h',parseInt(item.tba_NOTE))).format("yyyy-MM-dd HH:mm:ss");
            item.tba_TM=tbaTM; //AddHourDate(item.tba_GETDATE,parseInt(item.tba_NOTE)); //new Date()
            dataResult.push(item);
        }
        // var dataResult = data;
        console.error('item',dataResult);
        grid.setData(dataResult);
    }

    // 分页填充细节处理
    function fillData(pageIndex, pageSize, dataResult) {
        var data = dataResult;
        var totalCount = dataResult.length;
        var arr = [];
        var start = pageIndex * pageSize, end = start + pageSize;
        for (var i = start, l = end; i < l; i++) {
            var record = data[i];
            if (!record) continue;
            arr.push(record);
        }

        grid.setTotalCount(totalCount);
        grid.setPageIndex(pageIndex);
        grid.setPageSize(pageSize);

        grid.setData(arr);

    }
    function onRowClick(e) {
        var grid = e.sender;
        var record = grid.getSelected();
        if (record) {
            var Imgs = new Date(convertToDate(record.tba_GETDATE)).format("yyyyMMdd") + "/" + record.tba_FILENAME;
            ShowYT(Imgs, A_PathName);
        }
    }
    function tlCount() {

    }
    function tlChecked() {
        getInfo();
    }
    function BreakLayerLoad() {
        $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
        var now = new Date();//new Date("2024-07-10 08:00:00");//
        if(now.getHours()<3){
            now = new Date(addDayDate(now.format("yyyy-MM-dd HH:mm:ss"), -1));
        }
        var stime = "";
        var etime = "";
        stime = now.format("yyyy-MM-dd 00:00:00");
        etime = now.format("yyyy-MM-dd 23:59:59");
        //if (type == "48") {
        //    stime = new Date(addDayDate(now.format("yyyy-MM-dd HH:mm:ss"), -2)).format("yyyy-MM-dd ") + now.format("HH:mm:ss");
        //    etime = now.format("yyyy-MM-dd HH:mm:ss");
        //} else if (type == "24") {
        //    stime = new Date(addDayDate(now.format("yyyy-MM-dd HH:mm:ss"), -1)).format("yyyy-MM-dd ") + now.format("HH:mm:ss");
        //    etime = now.format("yyyy-MM-dd HH:mm:ss");
        //} else {
        //    stime = new Date(now.getTime() - 12 * 60 * 60 * 1000).format("yyyy-MM-dd HH:mm:ss")//now.format("yyyy-MM-dd") + " " + (now.getHours() - 12) < 0 ? "00:" : (now.getHours() - 12) + ":00:00";
        //    etime = now.format("yyyy-MM-dd HH:mm:ss");
        //}
        var strWhere = {
            "startdate": stime, "enddate": etime,
            "pattem": A_PathName, //"TBA_HAVE": A_PathName
        };
        //GetQXJosns("DATA_TBA_WEACONTENTSel", strWhere, "Sel");
		app.post("SWZZ_QXSJ_tba_weacontent/findResult",strWhere,(data)=>{
			JosnSel(data,"Sel")
		})
    }
    function JosnSel(ResultData, typeID) {
        if (typeID == "Sel") {
            if (ResultData.total > 0) {
                resultData = eval(ResultData.data);
                $.data(myData, "resultData", resultData);
                var arr = groupBy(resultData, "tba_GETDATE");
                resultData = arr[arr.length-1];
                getInfo();
                selectRow(0);
                $('#dataShow').hide();
            } else {
                resultData = [];
                getInfo();
                $('#dataShow').show();
            }
            $("#dataLoad").hide();
        }
    }
    function selectRow(index) {
        var row = grid.getRow(index);
        grid.select(row, true);
    }
    function btnSearch() {
        BreakLayerLoad();
    }
    function hide() {
        stopCount();
        $("#playBtn").html("自动播放");
        ShowYT("", "");
    }

    function onTMRenderer(e) {
        var value = e.value;
        if (!value) {
            return;
        }
        if (value !== "")
            return mini.formatDate(new Date(new Date(value)), 'yyyy-MM-dd HH:mm');
        //return mini.parseDate('yyyy-MM-dd HH:mm');
        return "";
    }
    function OnClickTitle(objID, objPathName) {//选择类型
        var only = $(".onlyli").removeClass("onlyliHover");
        $("#" + objID).addClass("onlyliHover");
        A_PathName = objPathName;
        resultData=$.data(myData, "resultData");
        resultData = resultData.filter(function (e) {
            return new Date(new Date(e.tba_GETDATE)).getHours() == objPathName;
        });
        if (resultData.length ==0) {
            $('#dataShow').show();
        }
        getInfo();
        selectRow(0);
    }
</script>
