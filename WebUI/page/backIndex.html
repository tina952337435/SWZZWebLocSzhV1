                    { "STCD": "63201402", "STNM": "小桥港", STATE: "0", "LGTD": 120.938873, "LTTD": 30.992803, "SJLL": 50.000 },
                    { "STCD": "63201405", "STNM": "小腰子港", STATE: "0", "LGTD": 120.921626, "LTTD": 30.886831, "SJLL": 50.000 },
                    { "STCD": "63201407", "STNM": "老变电所", STATE: "0", "LGTD": 120.809242, "LTTD": 30.970263, "SJLL": 50.000 },
                    { "STCD": "63201409", "STNM": "利壳港闸", STATE: "1", "LGTD": 120.776363, "LTTD": 30.955888, "SJLL": 50.000 },
                    { "STCD": "63201411", "STNM": "河泥田港闸", STATE: "1", "LGTD": 120.764486, "LTTD": 30.964647, "SJLL": 50.000 },
                    { "STCD": "63201413", "STNM": "冯家港闸", STATE: "2", "LGTD": 120.785794, "LTTD": 30.968410, "SJLL": 50.000 },
                    { "STCD": "63201414", "STNM": "急水桥水闸", STATE: "0", "LGTD": 120.891494, "LTTD": 30.921959, "SJLL": 50.000 },
                    { "STCD": "63201415", "STNM": "肖家港北闸", STATE: "0", "LGTD": 120.835168, "LTTD": 30.971280, "SJLL": 50.000 },
                    { "STCD": "63201416", "STNM": "北长河水闸", STATE: "2", "LGTD": 120.822765, "LTTD": 30.964316, "SJLL": 50.000 },
                    { "STCD": "63201417", "STNM": "港娄口闸", STATE: "0", "LGTD": 120.846294, "LTTD": 30.954297, "SJLL": 50.000 },

        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            if (field == "STATE") {
                var s = "";
                if (value == "0") {
                    s = "正常";
                } else if (value == "1") {
                    s = "告警";
                } else if (value == "2") {
                    s = "故障";
                }
                e.cellHtml = s;
            }
        }
        function onSelectionChanged(e) {
            var grid = e.sender;
            var record = grid.getSelected();
            if (record) {
                loc(record.LGTD, record.LTTD);
            }
        }
        function loc(lgtd, lttd) {
            if (lgtd != null && lttd != null) {
                dyCenter(lgtd, lttd);
            } else {
                mini.alert("未找到经纬度");
            }
        }
        function tlCount() {
            getTLObj("backZC").innerHTML = water1;
            getTLObj("backGJ").innerHTML = water2;
            getTLObj("backGZ").innerHTML = water3;
        }
        function PieChart(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var chartName = []; 	//控件元素名称
            var chartColor = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                chartColor.push(value.tableColor);
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                        //chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });

            option = {
                tooltip: {
                    trigger: 'item',
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    formatter: "{a} <br/>{b}: {c} ({d}%)"
                },
                legend: {
                    orient: 'vertical',
                    x: 'right',
                    right: '0',
                    data: chartName
                },
                color: chartColor,
                series: function () {
                    var serie = [];
                    var temValue = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            //chartValue.push(changeTwoDecimal(m[i][j], 0)); //循环价值
                            chartValue.push(m[i][j]);
                        }
                        temValue.push({ "name": chartName[j], "value": chartValue })
                    }

                    var item = {
                        name: "水质",
                        type: 'pie',
                        data: temValue,
                        center: ['35%', '50%'],
                        radius: ['50%', '80%'],
                        avoidLabelOverlap: false,
                        label: {
                            normal: {
                                show: false,
                                position: 'center'
                            },
                            emphasis: {
                                show: true,
                                textStyle: {
                                    fontSize: '30',
                                    fontWeight: 'bold'
                                }
                            }
                        },
                        labelLine: {
                            normal: {
                                show: false
                            }
                        }
                    }
                    serie.push(item);
                    return serie;
                }()
            };

            myChart.setOption(option);
            //myChart.on("click", eConsole);
        }
    </script>
