
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>用户管理</title>
    <script src="/Common/Scripts/md5.js" type="text/javascript"></script>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
            background-color: white;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width: 98%; border-collapse: collapse;'>
            <tr>
                <td colspan="4" align="center" class="CssTitle">
                    站点管理
                    <input id="BID" name="BID" class="mini-textbox Span90" style="display:none;" />
                    <input id="STCD" name="STCD" class="mini-textbox Span90" style="display:none;" />
                </td>
            </tr>
            <tr id="tr1">
                <td class="lie1" align="right">
                    <span class="FontColor">*</span>站点名称
                </td>
                <td class="lie2">
                    <input id="STNM" name="STNM" class="mini-textbox Span90" required="true" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    所属行政分区
                </td>
                <td class="lie2">
                    <input id="CID" name="CID" textfield="AREANAME" valuefield="AID" class="mini-combobox" required="true" style="width:90%;" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    所属水利片区
                </td>
                <td class="lie2">
                    <input id="WID" name="WID"  textfield="AREANAME" valuefield="AID" class="mini-combobox" required="true" style="width:90%;"  />
                </td>
            </tr>
            <tr>
                <td colspan="4" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                    <a class="mini-button" onclick="onOk" style="width:60px;margin-right:20px;">保存</a>
                    <a class="mini-button" onclick="onCancel" style="width:60px;">取消</a>
                </td>
            </tr>
        </table>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");
        //标准方法接口定义
        function SetData(data) {
            GetJosns("SWZZ_FLOODTIDEDATA_ST_AREA_BSel", {}, "ASel");
            if (data.action == "edit") {
                if (data.ID != "undefined") {
                    mini.get("BID").setValue(data.ID);
                    var strWhere = { "BID": data.ID };
                    GetJosns("DATA_EMPLOYEESel", strWhere, "Sel");
                } else {
                    data.action = "new";
                    var strWhere = { "USERID": data.MEMO };
                    GetJosns("Unified_PortalSel", strWhere, "Sel");
                }

            } else if (data.action == "new") {
                var strID = GetTableID();
                mini.get("BID").setValue(strID);
            }
            $.data(myData, "action", data.action);
        }
        function JosnSel(data, typeID) {
            if (typeID == "Update") {
                mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            else if (typeID == "Add") {
                mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            } else if (typeID == "ASel") {
                var dataTemp = data.data.filter(function (item) {
                    return item.ATYPE=="行政分区";
                });
                mini.get("CID").setData(dataTemp);
                dataTemp = data.data.filter(function (item) {
                    return item.ATYPE == "水利片区";
                });
                mini.get("WID").setData(dataTemp);
            }
            mini.unmask(document.body);
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {
            //保存数据
            OnSava();

        }


        function OnSava() {
            form.validate();
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("BID").getValue();
            }
            else {
                var strId = GetTableID();
                mini.get("BID").setValue(strId);
            }
            var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            if (objSate == "edit") {
                GetJosns("SWZZ_FLOODTIDEDATA_ST_AREASTATION_BPL", strWhere, "Update");
            }
            else {
                var arr = [];
                var stcd = mini.get("STCD").getValue();
                arr.push({ BID: GetTableID(), STCD: stcd, BTYPE: "", PAID: mini.get("CID").getValue() });
                arr.push({ BID: GetTableID(), STCD: stcd, BTYPE: "", PAID: mini.get("WID").getValue() });
                strWhere = { UPDATE: "false", LISTMODE: JSON.stringify(arr)};
                GetJosns("SWZZ_FLOODTIDEDATA_ST_AREASTATION_BPL", strWhere, "Add");
            }
        }
    </script>
</body>
</html>
