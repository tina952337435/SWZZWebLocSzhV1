<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代表站暴雨极值查询</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .onlytab {
            margin: 0px;
            padding: 0px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 100% !important;
        }

        .onlytab li {
            list-style: none;
            border: 1px #3291f9 solid;
            float: left;
            background-color: White;
            width: 100px !important;
            height: 30px;
            font: 14px/30px "arial";
            text-align: center;
        }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }

        #areaList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }
    </style>
</head>
<body>
    <!-- 头部搜索框start -->
    <div class="mini-toolbar">
        <ul class="ui-choose choose-type-right" id="choseMNLX">
            <li class="selected" style="border-radius: 3px 0 0 3px;">
                <span>行政分区</span>
            </li>
            <li>
                <span>水利片区</span>
            </li>
        </ul>
        <!--<a class="mini-button" onclick="AddBtn()" style="margin-left:20px;">添加站点</a>-->
    </div>
    <!-- 头部搜索框end -->
    <!-- 表格start -->
    <div id="grid1" class="mini-datagrid"
         style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 50px);height: -moz-calc(100% - 50px);height: calc(100% - 50px);"
         allowalternating="true" borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]"
         pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell" onshowrowdetail="onShowRowDetail" showcolumnsmenu="true">
        <div property="columns">
            <div type="expandcolumn">展开..</div>
            <div type="indexcolumn" width="4%" headeralign="center" align="center">序号</div>
            <div field="AID" headeralign="center" align="center" allowsort="true">
                分区编号
            </div>
            <div field="AREANAME" headeralign="center" align="center" allowsort="true">
                分区名称
            </div>
            <div field="AREA" headeralign="center" align="center" allow sort="true" decimalPlaces="3" , dataType="float">
                分区面积(k㎡)
            </div>
            <div field="action" width="60" headeralign="center" align="center" allowsort="true">
                基本操作
            </div>
        </div>
    </div>
    <!-- 表格end -->



    <div id="detailGrid_Form" style="display:none;margin:0px auto;">
        <div id="xiangqing_grid" class="mini-datagrid" style="width:94%;height:200px;margin-left:2%;"
             idfield="DD_ID" showPager='false' showfooter="false" allowAlternating="true"
             allowCellSelect="true" multiSelect="true" ondrawcell="ondrawcell">
            <div property="columns">
                <div field="STCD" width="80" headerAlign="center" align="center">站码</div>
                <div field="STNM" width="80" headerAlign="center" align="center">站名</div>
                <div field="AREA" width="80" headerAlign="center" align="center" allowsort="true" decimalPlaces="3" , dataType="float">面积</div>
                <div field="AREARATIO" width="80" headerAlign="center" align="center" decimalPlaces="6" , dataType="float">面积占比</div>
            </div>
        </div>
    </div>

    <div id="win1" class="mini-window" title="" style="width:600px;height:350px;"
         showMaxButton="false" showCollapseButton="false" showShadow="true"
         showToolbar="true" showFooter="true" showModal="false" allowResize="true" allowDrag="true">
        <div id="win_grid" class="mini-datagrid" style="width:100%;height:100%;"
             idfield="DD_ID" showPager='false' showfooter="false" allowAlternating="true"
             allowCellSelect="true" multiSelect="true" ondrawcell="ondrawcell">
            <div property="columns">
                <div type="indexcolumn" width="4%" headeralign="center" align="center">序号</div>
                <div field="STNM" width="80" headerAlign="center" align="center">站名</div>
                <div field="AREA" width="80" headerAlign="center" align="center" allowsort="true" decimalPlaces="3" , dataType="float">面积</div>
                <div field="AREARATIO" width="80" headerAlign="center" align="center" decimalPlaces="6" , dataType="float">面积占比</div>
            </div>
        </div>
    </div>

    <script>
        mini.parse();
        var myData = [];
        var grid = mini.get("grid1");
        var win_grid = mini.get("win_grid");
        var dataResult = {};
        $(function () {
            $.data(myData, "TYPE", "行政分区");
            search();
        });

        function search() {
            var strWhere = { ATYPE: $.data(myData, "TYPE") };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_AREA_BSel", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                grid.setData(data.data);
            } else if (typeID == "ST_AREASTATION_BNAMESel") {
                xiangqing_grid1.setData(data.data);
            } else if (typeID == "NAMESel") {
                win_grid.setData(data.data);
            }
        }
        $('#choseMNLX li').click(function () {
            var f = this;
            $('#choseMNLX li').each(function (index, item) {
                this.className = this == f ? 'selected' : '';
            });
            var name = $(this).find("span").html();
            $.data(myData, "TYPE", name);
            search();
        });
        function ondrawcell(e) {
            var grid = e.sender;
            var field = e.field;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            if (field == "action") {
                var s = '';
                //s += '<img style="cursor:pointer;" onclick="editData(\'ID@' + record.BID +'\', \'/System/DATA_EMPLOYEE_Edit.html\', \'编辑代表站\', \'50%\',565, \'true\')" src="/Common/miniui/themes/icons/edit.png" title="修改" />&nbsp;';
                //s += '<img style="cursor:pointer;" onclick="del(\'' + record.BID + '\')" src="/Common/miniui/themes/icons/remove.png" title="删除代表站" />&nbsp;';
                s += '<img style="cursor:pointer;" onclick="OpenHref(\'' + record.AID + '\',\'' + record.AREANAME + '\')" src="/Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
                e.cellHtml = s;
            }
        }

        var xiangqing_grid1 = mini.get("xiangqing_grid");
        var detailGrid_Form = document.getElementById("detailGrid_Form");
        function onShowRowDetail(e) {
            var grid = e.sender;
            var row = e.record;
            var fenzhuID = "";
            var fenzhuIDColor = "#A1FFA9";

            xiangqing_grid1.on("drawcell", function (e) {
                var record = e.record,
                    field = e.field,
                    DD_ID = e.value;
                if (field == "DD_NAME") {
                    if (fenzhuID == DD_ID || fenzhuID == "") {
                        //e.rowStyle = "font-size:14px;background:" + fenzhuIDColor;
                        fenzhuID = DD_ID;
                    }
                    else {
                        fenzhuIDColor = fenzhuIDColor == "#A1FFA9" ? "#FA9CF3" : "#A1FFA9";
                        //e.rowStyle = "font-size:14px;background:" + fenzhuIDColor;
                        fenzhuID = DD_ID;
                    }
                }
            });
            var td = grid.getRowDetailCellEl(row);
            td.appendChild(detailGrid_Form);
            detailGrid_Form.style.display = "block";
            GetJosns("ST_AREASTATION_BNAMESel", { "PAID": row.AID }, "ST_AREASTATION_BNAMESel");
        }
        function OpenHref(AID,AREANAME) {
            var win = mini.get("win1");
            win.setTitle(AREANAME+"代表站清单");
            var x = "center";
            var y = "middle";
            win.showAtPos(x, y);
            GetJosns("ST_AREASTATION_BNAMESel", { "PAID": AID }, "NAMESel");
        }
    </script>
</body>
</html >
