<body>
    <div id="myMap" style="width: 100%; height: 100%; display: block; overflow: hidden;

    <div id="SSTTL_TZ" style="background:#ffffff;position:absolute;right:10px;top:30%;height:185px;
    border: 1px solid #cecbcb;
    width:65px;-moz-border-radius: 5px;

            <p><span class="colorSpan" style="background-color:#E9D620"></span><span class="colorSpanValue">245</span></p>
            <p><span class="colorSpan" style="background-color:#D4E03E"></span><span class="colorSpanValue">235</span></p>
            <p><span class="colorSpan" style="background-color:#C1EB5D"></span><span class="colorSpanValue">225</span></p>
            <p><span class="colorSpan" style="background-color:#ACF57A"></span><span class="colorSpanValue">215</span></p>
            <p><span class="colorSpan" style="background-color:#99FF99"></span><span class="colorSpanValue">205</span></p>
        </div>
    </div>
    <script>
        var myData = [];
        var labels = new Array();
        var layer_hw;
        var countyLayer1;
        var _globallevel = 5;
        var labels = new Array();
        var stype = GetQueryString('STYPE');
        $(function () {
            if (stype == null) {
                stype = 1;
            }
            $.data(myData, "STYPE", stype);
            setTimeout(function () {
                countyLayer1 = CreateLayer("Area_Layer1");
                map.setZoom(8);
                loadLayer();
                loadBase();
            }, 800);


        });
        function loadBase() {
            var strWhere = { STTP: "PP"};
            GetJosns("SWZZ_FLOODTIDEDATA_ST_STBPRP_BSel", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                addMarker(data.data);
            }
        }
        var layer_hw;
        function loadLayer() {
            MapRainfallStation();
            //require(
            //    ["esri/layers/FeatureLayer", "esri/layers/GraphicsLayer", "esri/layers/ArcGISDynamicMapServiceLayer"],
            //    function (FeatureLayer, GraphicsLayer, ArcGISDynamicMapServiceLayer) {
            //        var url = 'http://36.155.90.4:6080/arcgis/rest/services/SHTysonPolygonCountyStation/MapServer';
            //        layer_hw = new ArcGISDynamicMapServiceLayer(url, { id: "SHTysonPolygonCountyStation", visible: true });
            //        map.addLayer(layer_hw);
            //    });
        }
        function MapRainfallStation() {
            require(["esri/geometry/Point",
                "esri/graphic",
                "myJs/MapText",
                "esri/symbols/PictureMarkerSymbol",
                "esri/symbols/SimpleFillSymbol",
                "esri/symbols/SimpleLineSymbol",
                "esri/Color",
                "esri/InfoTemplate",
                "esri/dijit/InfoWindow",
                "esri/layers/GraphicsLayer",
                "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "dojo/_base/lang",
                "esri/geometry/Polygon",
                "dojo/domReady!"
            ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color,
                InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, lang, Polygon) {
                    $.get(
                        "/Common/代表站泰森多边形.json",//json路径
                        lang.hitch(this, function (data, status) {
                            if (status === "success") {
                                //countyLayer1.clear();
                                var features = data.features;
                                features.forEach(function (feature) {
                                    var allrings = feature.geometry.coordinates;
                                    var polygon = new Polygon(allrings);
                                    var gra = feature.properties;
                                    var mc = gra.STNM;
                                    var stcd = gra.STCD;
                                    var colorStr = "#ACF57A";
                                    var fillColorStr = [172, 245, 122, 0.6];
                                    var lineSymbol = new SimpleFillSymbol("solid", new SimpleLineSymbol("solid",
                                        new dojo.Color(colorStr), 1),
                                        new dojo.Color(fillColorStr));
                                    var g3 = new Graphic(polygon, lineSymbol);
                                    countyLayer1.add(g3);
                                }, this);
                            }
                        }),
                        "json"
                    );
                });
        }

        function addMarker(data) {
            require(["esri/geometry/Point",
                "esri/graphic",
                "myJs/MapText",
                "esri/symbols/PictureMarkerSymbol",
                "esri/symbols/SimpleFillSymbol",
                "esri/symbols/SimpleLineSymbol",
                "esri/Color",
                "esri/InfoTemplate",
                "esri/dijit/InfoWindow",
                "esri/layers/GraphicsLayer",
                "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "esri/symbols/Font", "dojo/domReady!"
            ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color, InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, Font) {
                var maxNum = 0, minNum = 1000000000;
                for (var num = 0; num < data.length; num++) {
                    var NUM = data[num].BYNUMBER;
                    var item = { STNM: data[num].STNM, "LGTD": data[num].LGTD, "LTTD": data[num].LTTD};
                    var textStr = data[num].STNM 
                    var point = new Point({ "x": data[num].LGTD, "y": data[num].LTTD, "spatialReference": { "wkid": 4326 } });
                    var font = new Font("13px", Font.STYLE_NORMAL, Font.VARIANT_NORMAL,
                        null);
                    var textSymbol = new TextSymbol(
                        textStr,
                        font,
                        new Color("black")
                    );
                    var labelPointGraphic = new Graphic(point, textSymbol);
                    countyLayer1.add(labelPointGraphic);
                }
            });
        }
    </script>
</body>
