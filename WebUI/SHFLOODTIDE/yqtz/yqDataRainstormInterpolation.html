<body>
    <div class="box">
        <div class="yb_left">

                &nbsp;<span style="width: 5px;height: 17px;margin-top: 9px;background-color: #0C52C4;vertical-align: top;display: inline-block;">&nbsp;</span>

                    </tr>
                    <tr height="50">

                    </tr>
                    <tr>

        <div class="tqyb_right">

            </div>
        </div>

        <div style="width:100%;height: calc(100% - 420px);background:#FFFFFF;padding:5px 0px;margin:0px auto;margin-top:10px;  ">

                &nbsp;<span style="width: 5px;height: 17px;margin-top: 9px;background-color: #0C52C4;vertical-align: top;display: inline-block;">&nbsp;</span>
                雨量代表站清单
            </div>
            <div style="height: calc(100% - 35px);width:calc(100% - 10px);margin:0px auto;background-color: #FFF;border-top: solid 1px #e8e8e8;">

    <script>
        mini.parse();
        var myData = [];
        var combo= mini.get("combo1");
        $(function () {
            newestTm();
            //查询预报站点
            GetJosns("SWZZ_FLOODTIDEDATA_ST_STBPRP_BSel", { STTP: "PP" }, "Sel");

            chartGraph("GraphContent");

            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var index = Number($(this).find("span").attr("id").replaceAll("span", ""));
                var STIME = $("#TIME").html();
                var ETIME = new Date(new Date(STIME).addDate('y', index)).format("yyyy-MM-dd HH:mm:ss");
                $.data(myData, "STIME", STIME);
                $.data(myData, "ETIME", ETIME);
            });
        });
        function newestTm() {
            //查看最新插补时间
            GetJosns("SWZZ_FLOODTIDEDATA_ST_RAININNEWEST_RSel", { TYPE: "NUMBER" }, "TMSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "TMSel") {
                var TM = "1978-01-01 00:00:00";
                if (data.total > 0) {
                    TM = convertToDate(data.data[0].TM).format("yyyy-MM-dd HH:mm:ss");
                }
                $("#TIME").html(TM);
                var STIME = $("#TIME").html();
                var year = Number($('#choseMNLX .selected').find("span").attr("id").replaceAll("span", ""));
                var ETIME = new Date(new Date(STIME).addDate('y', year)).format("yyyy-MM-dd HH:mm:ss");
                $.data(myData, "STIME", STIME);
                $.data(myData, "ETIME", ETIME);
            }
            else if (typeID == "Sel") {
                combo.setData(data.data);
                //combo.setValue("63425900");
                onZhanLoad(data);
            }
            else if (typeID == "InterAdd") {
                newestTm();
                mini.unmask(document.body);
                if (data.total > 0) {
                    //插补完成之后，跳转到结果页面
                    OpenHref();
                } else {
                    mini.alert("当前选择的区间无暴雨场次！");
                }
            }
        }
        function onZhanLoad(data) {
            var Person_list = " <table class=\"table table-bordered table-striped\">";
            Person_list += "<tr bgcolor=#FFFFFF>";
            var count = 0;
            for (var num = 0; num < data.data.length; num++) {
                var STCD = data.data[num].STCD;
                var STNM = data.data[num].STNM;
                count++;
                var checked = "";
                //if (data.data[num].ISXZ == "1") {
                checked = "checked=\"checked\""
                // }

                var html = '<span class="c-index  c-index-hot1 c-gap-icon-right-small">' + (num + 1) + '</span>';

                if (count < 10) {
                    Person_list += "<td>";
                    //Person_list += " <input id=\"Employ_" + num + "\" " + checked + " type=checkbox name=employee_id value=\"" + STCD + "\">" + STNM + "";
                    Person_list += html + STNM;
                    Person_list += "</td>";
                }
                else {
                    count = 1;

                    Person_list += "</tr><tr bgcolor=#FFFFFF>";
                    Person_list += "<td>";
                    //Person_list += " <input id=\"Employ_" + num + "\" " + checked + "  type=checkbox name=employee_id value=\"" + STCD + "\">" + STNM + "";
                    Person_list += html + STNM;
                    Person_list += "</td>";
                }
            }
            Person_list += "</tr> ";
            Person_list += " </table>";
            //alert(Person_list);
            $("#checklist").html(Person_list)
        }
        function startInterpolation() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据插补中，请稍等...'
            });
            var STIME = $.data(myData, "STIME");
            var ETIME = $.data(myData, "ETIME");
            var strWhere = {
                STIME: STIME,
                ETIME: ETIME,
               //STCD: combo.getValue(),
            };
            GetJosns("RainfallRainstormDataInterpolation", strWhere, "InterAdd");
        }
        function OpenHref() {
            var STIME = $.data(myData, "STIME");
            var ETIME = $.data(myData, "ETIME");
            var url = "/SHFLOODTIDE/yqtz/yqDataInterpolationResult.html?STIME=" + STIME + "&ETIME=" + ETIME + "&type=list";
            //window.parent.OpenTab("fa-delicious", "暴雨插补成果", url);
            window.parent.addTab("暴雨插补成果", url);
        }
    </script>
