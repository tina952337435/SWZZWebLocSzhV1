
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
            background: white;
        }

        .onlytab {
            margin: 0px;
            padding: 0px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 100% !important;
            width: 120px !important;
            position: absolute;
            left: 190px;
            top: 0px;
        }

            .onlytab li {
                list-style: none;
                border: 1px #3291f9 solid;
                float: left;
                background-color: White;
                width: 100px !important;
                height: 30px;
                font: 14px/30px "arial";
                text-align: center;
            }
    </style>
</head>
<body class="contentbody">
    <div id="JY_charts" style="height:100%;width:90%;margin:0px auto;background:white;">

    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 405px);height: -moz-calc(100% - 405px);
height: calc(100% - 405px);display:none;" allowalternating="true"
         borderstyle="border-right:0;" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div field="TM" width="60" align="center" headeralign="center" allowsort="false">时间</div>
            <div field="TDZ" width="120" align="center" headeralign="center" allowsort="false">风暴潮(m)</div>
        </div>
    </div>
    <script>
        mini.parse();
        var myData = [];
        var resultData = [];
        //实例化表格对象
        var grid = mini.get("grid1");
        var dd_tm = GetQueryString("DD_TM");
        var etime = GetQueryString("ETIME");
        window.onload = function () {
            A_PathName = "国家海洋潮位预报";
            var s_where = { "TBA_INFOTYPE": A_PathName, ETIME: dd_tm };
            GetQXJosns("DATA_TBA_WEACONTENTSel", s_where, "YBSel");
        };
        function BreakLayerLoad() {
            var YBTM = $.data(myData, "YBTM");
            var s_where = { YBTM: YBTM };
            GetJosns("DATA_ST_TIDE_RYBSel", s_where, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "YBSel") {
                var TM = new Date(convertToDate(data.data[0].TBA_DESDATE)).format("yyyy-MM-dd HH:mm:ss");
                $.data(myData, "YBTM", TM);
                BreakLayerLoad();
            }
            else if (typeID == "Sel") {
                resultData = data.data;
                resultData = resultData.filter(function (item) {
                    return new Date(convertToDate(item.TM)) >= new Date(dd_tm) && new Date(convertToDate(item.TM)) <= new Date(etime) ;
                });
                //绘制过程线颜色设置
                var LineColor = ["#8B5CFF"];
                var strNote = [];
                var item = { "name": "时间", "codename": "TM", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                item = { "name": "风暴潮", "codename": "TDZ", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                //绘制图形
                chartLL("JY_charts", resultData, strNote, LineColor, "风暴潮(m)");
                getInfo();
            }
        }
        function getInfo() {
            tableBind(resultData);
        }
        function tableBind(data) {
            var dataResult = data;
            grid.setData(dataResult);
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "TM") {
                e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm");
            }
        }
        const hexToRgba = (hex, opacity) => {
            let rgbaColor = "";
            let reg = /^#[\da-f]{6}$/i;
            if (reg.test(hex)) {
                rgbaColor = `rgba(${parseInt("0x" + hex.slice(1, 3))},${parseInt(
                    "0x" + hex.slice(3, 5)
                )},${parseInt("0x" + hex.slice(5, 7))},${opacity})`;
            }
            return rgbaColor;
        }
        function chartLL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(value[value1.codename]); //加入时间集合
                        chartTM.push(new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")); //加入时间集合

                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var max_min = GetSort(chartValue);
            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show:false,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min: max_min.min, //动态设置最大值最小值。
                        max: max_min.max,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                type: 'line',
                                data: chartValue,
                                barWidth: '40%',
                                symbol: 'none',  //这句就是去掉点的
                                smooth: true,
                                areaStyle: {
                                    normal: {
                                        color: new echarts.graphic.LinearGradient(
                                            0,
                                            0,
                                            0,
                                            1,
                                            [{
                                                offset: 0,
                                                color: hexToRgba(LineColor[j - 1], 0.3)
                                            },
                                            {
                                                offset: 1,
                                                color: hexToRgba(LineColor[j - 1], 0.1)
                                            }
                                            ],
                                            false
                                        ),
                                        shadowColor: hexToRgba(LineColor[j - 1], 0.1),
                                        shadowBlur: 10
                                    }
                                },
                                //		           itemStyle: {normal: {
                                //          	areaStyle: {type: 'default'},
                                //				//颜色渐变设置
                                //          	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //          		offset:0,
                                //          		color:'#050AE8'
                                //          	},{
                                //          		offset:1,
                                //          		color:'#8688F4'
                                //          	}])
                                //          }},
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },

                                symbol: 'none',  //这句就是去掉点的
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html>
