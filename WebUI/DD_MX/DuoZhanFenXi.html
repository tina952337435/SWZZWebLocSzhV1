<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script src="../Common/boot.js" type="text/javascript"></script>
    <title>代表站水位</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size:14px;
        } 
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            &nbsp; &nbsp;
            开始日期：&nbsp;<input id="STIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;
            结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;
            &nbsp;&nbsp;&nbsp;关键字：<input id="key" class="mini-textbox" emptytext="请输入关键字" style="height: 25px;width: 150px;" onenter="onKeyEnter" />
            &nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a> 
        </div>
    </div>
    <div class="mini-fit">
        <div id="grid1" class="mini-datagrid" style="width: 100%; height: 100%;" sortmode="client"
             allowalternating="true" borderstyle="border:1px;" idfield="id" pagesize="20"
             onshowrowdetail="onShowRowDetail" showcolumnsmenu="true">
            <div property="columns">
                <div type="expandcolumn">更多..</div>
                <div field="name" height="30px" headerstyle="height:30px" headeralign="center">
                    方案集名称
                </div>
                <div field="yj_TIME" width="60" height="30px" headerstyle="height:30px" headeralign="center" align="center" allowsort="true" renderer="onTMRenderer">
                    依据时间
                </div>
                <div field="dd_TIME" width="60" height="30px" headerstyle="height:30px" headeralign="center" align="center" allowsort="true" renderer="onTMRenderer">
                    创建时间
                </div>
                <div field="num" width="60" height="30px" headerstyle="height:30px" headeralign="center" align="center" allowsort="true">
                    方案数量
                </div>
                <div field="note" height="30px" headerstyle="height:30px" headeralign="center">
                    备注
                </div>
                <div field="CAOZUO" width="50" height="30px" headerstyle="height:30px" headeralign="center" align="center" renderer="onActionRenderer">
                    基本操作
                </div>
            </div>
        </div>
    </div>
    <div id="detailGrid_Form" style="display:none;margin:0px auto;">
        <div id="xiangqing_grid" class="mini-datagrid" style="width:96%;height:150px;margin-left:2%;"
             idfield="dd_ID" showPager='false' showfooter="false" allowAlternating="true"
             allowCellSelect="true" multiSelect="true" ondrawcell="ondrawcell">
            <div property="columns">
                <div field="dd_NAME" width="40%" headerAlign="center" align="left">方案名称</div>
                <div field="dd_TM" width="15%" headerAlign="center" align="center" allowsort="true">依据时间</div>
                <div field="dd_STANA" width="15%" headerAlign="center" align="center">预见期(三天)</div>
                <div field="dd_BY" width="15%" headerAlign="center" align="center">调度人员</div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        mini.parse();
        var grid = mini.get("grid1");
        $(function () {
            var stime = GetQueryString("stime");
            var etime = GetQueryString("etime");
            var key = GetQueryString("key");
            if (stime != null) {
                mini.get("STIME").setValue(stime);
                mini.get("ETIME").setValue(etime);
                mini.get("key").setValue(key);
            } else {
                var tm = new Date();
                mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -365));
                mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));
            }
            search();
        })

        function search() {
            grid.loading("数据加载中，请稍后......");
            PageFillData(1, grid.pageSize);

        }

        function PageFillData(pageIndex, pageSize) {
            var Startime = mini.get("STIME").getFormValue()+" 00:00:00";
            var Endtime = mini.get("ETIME").getFormValue() + " 23:59:59";
            if (Startime > Endtime) {
                mini.alert("请确认起止日期次序是否正确（终止日期至少是起始日期的次日）！");
                return false;
            }
            var strWhere = {
                "startdate": Startime,
                "enddate": Endtime,
                "kwtxt": mini.get("key").getValue(),
                "pageindex": pageIndex,
                "pagesize": pageSize
            };
            //GetJosns("MODE_SCHEME_TYPEContSel", strWhere, "Sel");
			app.post("SWZZ_MODE_SCHEME_TYPE/findResult",strWhere,(data)=>{
				JosnSel(data,"Sel")
			})
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") { 
				var arr = "";
				var dataResult = data;
				for(var obj of data.data){
					arr += obj.id + ",";
				}
				app.post("SWZZ_MODE_DD_SOLUTION/findResult",{pattem : arr},(data)=>{
					for(var obj of dataResult.data){
						obj.num = data.data.filter(m=>{
							return obj.id == m.dd_MIND;
						}).length;
					}
				//console.log(data);
				dataResult.data.sort((a,b)=>{
					return new Date(b.yj_TIME).getTime() - new Date(a.yj_TIME).getTime();
				});
                PageServerFill(grid, dataResult);
				})
            } else if (typeID == "MODE_DD_SOLUTIONSel") {
                xiangqing_grid1.setData(data.data);
            }
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex + 1, pageSize = e.data.pageSize;
            PageFillData(pageIndex, pageSize);
        });
        function onTMRenderer(e) {
            var value = e.value;
			//console.log(value);
            if (value) {
                return mini.formatDate(new Date(value), 'yyyy-MM-dd HH:mm:ss');
            }
            else {
                return "";
            }
        }
        //==加上编辑列代码
        function onActionRenderer(e) {
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            var NUM = record.num;
            var s = '<a title="对比分析" onclick="duibi(\'' + record.id + '\',\'2\')"  style="height:15px;color:blue !important; line-height:15px;padding:6px 10px;cursor:pointer;">单指标对比</a>';
            if (NUM > 1) {
                s += '<a title="双屏对比" onclick="duibi2(\'' + record.id + '\',\'2\')"  style="height:15px;color:orange !important; line-height:15px;padding:6px 10px;cursor:pointer;">双屏对比</a>';
            }
            return s;
        }
        function duibi(id, pgType) {
            var url=window.location.pathname.indexOf('swzzWeb')>-1?"DD_MX/FangAnComList.html":"FangAnComList.html";            
            url+="?stime="+ mini.get("STIME").getFormValue() + "&etime=" + mini.get("ETIME").getFormValue() + "&key=" + mini.get("key").getFormValue() + "&ID=" + id;
            
            
            try {
                window.parent.addTab("调度方案对比", url, "", "调度方案对比");
            } catch (error) {
                window.location.href=url;
            }
        }
        function duibi2(id, pgType) {
            var url = window.location.pathname.indexOf('swzzWeb')>-1?"DD_MX/DoubleScreen.html" :"DoubleScreen.html"; 
            url+= "?stime="+mini.get("STIME").getFormValue() + "&etime=" + mini.get("ETIME").getFormValue() + "&key=" + mini.get("key").getFormValue() + "&ID=" + id;
            try {
                window.parent.addTab("调度方案对比", url, "", "调度方案对比");
            } catch (error) {
                window.location.href = url;
            }
        }
    </script>
    <script type="text/javascript">
        var xiangqing_grid1 = mini.get("xiangqing_grid");
        var detailGrid_Form = document.getElementById("detailGrid_Form");
        function onShowRowDetail(e) {
            var grid = e.sender;
            var row = e.record;
            var fenzhuID = "";
            var fenzhuIDColor = "#A1FFA9";

            xiangqing_grid1.on("drawcell", function (e) {
                var record = e.record,
                    field = e.field,
                    DD_ID = e.value;
                if (field == "dd_NAME") {
                    if (fenzhuID == DD_ID || fenzhuID == "") {
                        //e.rowStyle = "font-size:14px;background:" + fenzhuIDColor;
                        fenzhuID = DD_ID;
                    }
                    else {
                        fenzhuIDColor = fenzhuIDColor == "#A1FFA9" ? "#FA9CF3" : "#A1FFA9";
                        //e.rowStyle = "font-size:14px;background:" + fenzhuIDColor;
                        fenzhuID = DD_ID;
                    }
                }
            }); 
            var td = grid.getRowDetailCellEl(row);
            td.appendChild(detailGrid_Form);
            detailGrid_Form.style.display = "block";
            //GetJosns("MODE_DD_SOLUTIONSel", { "DD_MIND": row.ID  },"MODE_DD_SOLUTIONSel"); 
			app.post("SWZZ_MODE_DD_SOLUTION/findResult",{pattem : row.id},(data)=>{
				JosnSel(data,"MODE_DD_SOLUTIONSel")
			})
        }

        function onGenderRenderer(e) {
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            return '<a class="Edit_Button" href="javascript:lookFangAn(\'' + record.ID + '\')">' + e.value + '</a>';
        }

        function lookFangAn(objID) {
            var url=window.location.pathname.indexOf('swzzWeb')>-1?"DD_MX/ResultsRelease.html":"ResultsRelease.html"; 
            url+="?stime=" + mini.get("STIME").getFormValue() + "&etime=" + mini.get("ETIME").getFormValue() + "&key=" + mini.get("key").getFormValue() + "&type=duo&DD_ID=" + objID;
            try {
                window.parent.OpenTab("fa-delicious", "调度方案成果展示", url);
            } catch (error) {
                window.location.href=url;
            }
        }

        xiangqing_grid1.on("cellclick", function (e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value,
                sender = e.sender;
            var type_id = "";
            if (e.column.type == "checkcolumn") {
                type_id = row.DD_TYPE;
                if (type_id == type_id) {

                } else {
                    mini.alert("不是同一事件方案，不能选择！");
                }
            }
        });

        function ondrawcell(e) {
            var field = e.field;
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            if (field == "dd_STANA") {
                var s = parseInt(e.value) / 24;
                e.cellHtml = s;
            }
            if (field == "dd_NAME") {
                var s = '<a class="Edit_Button" href="javascript:lookFangAn(\'' + record.id + '\',\'' + record.dd_EVALUE + '\')">' + e.value + '</a>';
                e.cellHtml = s;
            }

            if (field == "dd_TM") {
                var value = e.value;
                var s = '';
                if (value) {
                    s = mini.formatDate(new Date(value), 'yyyy-MM-dd HH:mm:ss');
                }
                else {
                    s = "";
                }
                e.cellHtml = s;
            }

            if (field == "dd_EVALUE") {
                var s = "";
                if (e.value == 0) {
                    s = "水质";
                } else if (e.value == 1) {
                    s = "水量";
                } else if (e.value == 2) {
                    s = "淹涝(水动力)";
                }
                e.cellHtml = s;
            }
        }

    </script>
</body>
</html>
