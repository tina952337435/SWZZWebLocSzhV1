<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script src="../Common/boot.js" type="text/javascript"></script>
    <link href="../Common/miniui/res/font-awesome/css/font-awesome.min.css" rel="stylesheet" type="text/css" />
    <title>调度方案记录管理</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }

        .lie2 {
            width: 80%;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width: 99%; border-collapse: collapse;'>
            <tr>
                <td class="lie1" align="right">
                    方案名称
                </td>
                <td class="lie2">
                    <input id="DD_NAME" name="DD_NAME"  class="mini-textbox Span80" required="true" />
                    <span style="font-weight:600">(****方案)</span>
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    创建人
                </td>
                <td class="lie2">
                    <input id="DD_BY" name="DD_BY" class="mini-textbox Span80" required="true" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    起调时间
                </td>
                <td class="lie2">
                    <input id="DD_TM" name="DD_TM" class="mini-textbox Span80" readonly="readonly" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    最后编辑时间
                </td>
                <td class="lie2">
                    <input id="DD_CARRYTM" name="DD_CARRYTM" class="mini-textbox Span80" readonly="readonly" />
                </td>
            <tr>
                <td class="lie1" align="right">
                    备注
                </td>
                <td class="lie2">
                    <textarea id="DD_NOTE" name="DD_NOTE" rows="30" style="width:80%; height:150px;" class="mini-textarea" emptytext="请输入备注"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                    <a class="mini-button" onclick="onOk" style="width:60px;margin-right:20px;">保存</a>
                    <a class="mini-button" onclick="onCancel" style="width:60px;">关闭</a>
                </td>
            </tr>
        </table>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");
        var editType = "";
        function SetData(data) {
            if (data.action == "edit") {
                editType = data.action;
                var s_where = { stcd: data.ID };
                //GetJosns("MODE_DD_SOLUTIONSel", s_where, "DDSel");
				app.post("SWZZ_MODE_DD_SOLUTION/findResult",s_where,(data)=>{
					JosnSel(data,"DDSel")
				});
            } else {
                $.data(myData, "stime", data.STIME)
                $.data(myData, "etime",data.ETIME)
                var _type = data.TYPE;
                $.data(myData, "TYPE", _type);
                $.data(myData, "DD_EVALUE", data.DD_EVALUE);
                mini.get("DD_TM").setValue(new Date(data.STIME.replaceAll("-","/")).format("yyyy/MM/dd HH:mm:ss"));
                var tm = new Date();
                mini.get("DD_CARRYTM").setValue(tm.format("yyyy/MM/dd HH:mm:ss"));
                mini.get("DD_BY").setValue(GetCookie("LOGINNAME"));
                var s_where = {
                    "SOLUTIONID": "0", "ZHANID": "1795162157,1795162193,1795162169"
                };
                GetJosns("MODE_ES_ZHANDIANDATASel", s_where, "MODE_ES_ZHANDIANDATASel");
                //加载备注
                onLoadData();
            }
        }
        function JosnSel(ResultData, typeID) {
            if (typeID == "PLAdd") {
                if (editType!= "edit") {//修改时不去调用模型了
                    SetCookie("DD_ID", $.data(myData, "DD_ID"), 1);
                    DelCookie("DD_ID");
                    function showTips() {
                        var x = "right";
                        var y = "bottom";
                        var state = "default";
                        mini.showTips({
                            content: data.data,
                            state: state,
                            x: x,
                            y: y,
                            timeout: 1500
                        });
                    }
                    //保存下载文件
                    var dd_id = $.data(myData, "DD_ID");
                    var strParam = { STIME: $.data(myData, "stime"), ETIME: $.data(myData, "etime"), SOLUTIONID: dd_id };
                    GetJosns("FH_GetLOCNEW", strParam, "FH_GetLOCNEW");
					
					strParam={stcd: "0",strExp: "SOLUTIONID"};
					//GetJosns("FH_inset_delete", strParam, "FH_inset_delete");
					app.post("SWZZ_MODE_ES_ZHANDIANDATA/remove",strParam,(data)=>{
						JosnSel(data,"FH_inset_delete")
					})
					
                    mini.unmask(document.body);
                    DelCookie("FA_ID");
                    //调用父页面的方法
                    top["win"].OpenHref($.data(myData, "ID"), $.data(myData, "DD_ID"));
                }
                setTimeout(function () {
                    CloseWindow("cancel");
                }, 200);
            }
            else if (typeID == "Sel") {
                var dataResult = mini.decode(ResultData.data);
                $.data(myData, "gridJYData", dataResult);

                var strParam = { "SolutionID": "", "STCD": "63201999", "MKEYID": "357", "DATA_TYPE": "1" };
                GetJosns("FH_GetData", strParam, "FH_GetData");

            } else if (typeID == "FH_GetData") {
                var dataResult = mini.decode(ResultData.data);
                $.data(myData, "FH_GetData", dataResult);

                var s_where = { "stime": $.data(myData, "stime"), "etime": $.data(myData, "etime"), "msgType": "3" };
                GetJosns("FH_GetBind", s_where, "SelGC");
            } else if (typeID == "SelGC") {
                var dataResult = mini.decode(ResultData.data);
                $.data(myData, "gridGCData", dataResult);
                getNote();
            } else if (typeID == "MODE_ES_ZHANDIANDATASel") {
                getFANAME(ResultData.data);
            } else if (typeID == "DDSel") {
                if (ResultData.total > 0) {
                    var o = ResultData.data[0];//mini.decode(ResultData.data[0]);
					console.log(o)
                    $.data(myData, "DD_ID", o.dd_ID);
                    $.data(myData, "stime", o.dd_TM);
                    $.data(myData, "etime", o.dd_CHECKBY);
                    $.data(myData, "DD_EVALUE", o.dd_EVALUE);
                    mini.get("DD_NAME").setValue(o.dd_NAME);
                    mini.get("DD_BY").setValue(o.dd_BY);
                    var dd_tm=mini.formatDate(new Date(o.dd_TM),"yyyy-MM-dd HH:mm:ss");
                    mini.get("DD_TM").setValue(dd_tm);
                    var dd_carrytm=mini.formatDate(new Date(o.dd_CARRYTM),"yyyy-MM-dd HH:mm:ss");
                    mini.get('DD_CARRYTM').setValue(dd_carrytm);
                    mini.get("DD_NOTE").setValue(o.dd_NOTE);
                    console.error(o);
                    // FromSetData(o);
                }
            }
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {
            //保存数据
            form.validate();
            if (form.isValid() == false)
                return;
            //var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据保存中...'
            });
            var _dd_id = "";
            if (editType == "edit") {
                _dd_id = $.data(myData, "DD_ID");
            } else {
                _dd_id = GetTableID();
            }
            $.data(myData, "DD_ID", _dd_id);
            $.data(myData, "ID", _dd_id);
            var ms = new Date($.data(myData, "etime")).getTime() - new Date(mini.get("DD_TM").getValue()).getTime();
            if (ms < 0) return 0;
            var hour= Math.floor(ms / 1000 / 60 / 60);
            var s_where = {
                "id": _dd_id,
                "dd_ID": _dd_id,
                "dd_NAME": mini.get("DD_NAME").getValue(),
                "dd_BY": mini.get("DD_BY").getValue(),
                "dd_TM": mini.get("DD_TM").getValue(),
                "dd_CARRYTM": mini.get("DD_CARRYTM").getValue(),
                "dd_NOTE": mini.get("DD_NOTE").getValue(),
                "typeID": $.data(myData, "TYPE"),
                "dd_EVALUE": $.data(myData, "DD_EVALUE"),
                "dd_CHECKBY": $.data(myData, "etime"),
                "dd_STANA": hour
            };
            //GetJosns("FH_inset_update", s_where, "PLAdd");
			if (editType == "edit") {
				app.post("SWZZ_MODE_DD_SOLUTION/modify",s_where,(data)=>{
					JosnSel(data,"PLAdd")
				});
			}else{
				app.post("SWZZ_MODE_DD_SOLUTION/add",s_where,(data)=>{
					JosnSel(data,"PLAdd")
				});
			}
			
        }

        function onLoadData() {
            var s_where = {
                "stime": $.data(myData, "stime"), "etime": $.data(myData, "etime"), "msgType": "0", "DayHour": "DAY"
            };
            GetJosns("FH_GetBind", s_where, "Sel");
        }
        //获取备注
        function getNote() {
            var data = $.data(myData, "gridJYData");
            var dataGC = $.data(myData, "gridGCData");
            var dataSW = $.data(myData, "FH_GetData");

            //mini.get("DD_NOTE").setValue(str_note1);

            var _dd_id = GetTableID();
            var s_where = "'ID':'" + GetTableID() + "',";
            s_where += "'DD_ID':'" + _dd_id + "',";
            s_where += "'DD_NAME':'" + mini.get("DD_NAME").getValue() + "',";
            s_where += "'DD_BY':'" + mini.get("DD_BY").getValue() + "',";
            s_where += "'DD_TM':'" + mini.get("DD_TM").getValue() + "',";
            s_where += "'DD_CARRYTM':'" + mini.get("DD_CARRYTM").getValue() + "',";
            s_where += "'DD_NOTE':'" + mini.get("DD_NOTE").getValue() + "',";
            s_where += "'typeID':'" + $.data(myData, "TYPE") + "'";
        }

        //获取方案名称
        function getFANAME(data) {
            var title = new Date($.data(myData, "stime").replaceAll("-", "/")).format("yyyyMMddHH") + "水情预报(" + GetCookie("ModeJYDan")+")";
			//title=new Date($.data(myData, "stime").replaceAll("-", "/")).format("yyyyMMdd") +"("+new Date($.data(myData, "stime").replaceAll("-", "/")).format("H")+"时)水情预报";
            mini.get("DD_NAME").setValue(title);
        }
    </script>
</body>
</html>
