<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <title>调度方案对比</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size:14px;
            background:white;
        }
        .switch {
            cursor:pointer;
        }
        .lie2 {
            width: 90%;
        }
    </style>
</head>
<body>
    <div style="width: 100%; height: 80px;display:none;">
        <table cellspacing='0' cellpadding='2' rules='all' border='1' id='GridView1' width="100%" style='background-color:White;border:#dedede 1px solid;width:100%;border-collapse:collapse;'>

            <tr>
                <td class="lie1" align="right">
                    名称：
                </td>
                <td class="lie2 View" id="NAME">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    描述：
                </td>
                <td class="lie2 View" id="NOTE">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <div>
        <div style="
                    text-align:left;
                    width:100%;
                    line-height: 35px;
                    background-color: #FFF;
                    padding-left: 10px;
                    color: black;
                    font-size:16px;
                    ">
            &nbsp;<span style="width: 5px;height: 17px;margin-top: 9px;background-color: #0C52C4;vertical-align: top;display: inline-block;">&nbsp;</span>&nbsp;方案对比信息
        </div>

    </div>

    <div style="width: 100%;  height: -webkit-calc(100% - 50px);height: -moz-calc(100% - 50px);height: calc(100% - 50px);border-top: solid 1px #e8e8e8;">
        <div style="width:15%;float:left; margin-top:5px;margin-left:5px;height: -webkit-calc(100% - 0px);height: -moz-calc(100% - 0px);height: calc(100% - 0px);">
            <div style="margin-bottom:5px; margin-top:5px; ">
                <label>名称：</label>
                <input id="key" class="mini-textbox" style="width:120px;" onenter="onKeyEnter" />
                <a class="mini-button" style="width:60px;" onclick="btnSearch()">查询</a>
            </div>

            <ul id="tree1" class="mini-tree" style="width:100%;padding:5px;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);"
                showTreeIcon="true" textField="name" idField="stcd" onNodeClick="onNodeClick"
                expandOnLoad="true"></ul>
        </div>
        <div style="width:84%;float:left;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);"> 
            <div id="fit1" class="fit">
                <div id="divChart" style="height:500px;width:99.5%;padding-top:20px;">

                </div>
                <div id="divHide" style="line-height:100px;font-size:28px; text-align:center;height:800px;width:99.5%; position: absolute;top: 45px;left: 295px;background: #FFFFFF;z-index: 99;display:none;">暂无数据</div>
            </div>
            <div id="fit2" class="fit" style="height:100%;">
                <div id="grid1" class="mini-datagrid" style="width: 99%; height: -webkit-calc(100% - 470px);height: -moz-calc(100% - 470px);height: calc(100% - 470px);margin: auto;margin-top:10px;" sizeList="[15,20,30,50]" pageSize="15"
                     idfield="STCD" allowresize="false" allowalternating="true" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" allowHeaderWrap="true"
                     sortmode="client">
                </div>
            </div>

        </div>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var grid = mini.get("grid1");
        var tree = mini.get("tree1");
        $(function () {
            //$("#fit2").hide();
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var stime = GetQueryString("stime");
            var etime = GetQueryString("etime");
            var key = GetQueryString("key");
            var _ID = GetQueryString("ID");
            var _type = GetQueryString("type");
            $.data(myData, "STIME", stime);
            $.data(myData, "ETIME", etime);
            $.data(myData, "KEY", key);
            $.data(myData, "ID", _ID);
            $.data(myData, "type", _type);

            //GetJosns("MODE_ES_JISUANZHANSel", { "TYPE": "1,2,15" }, "tree");
            //GetJosns("JISUANZHAN", {}, "tree");
			app.post("SWZZ_MODE_ES_JISUANZHAN/JISUANZHAN",{},(data)=>{
				JosnSel(data,"tree")
			})
            //GetJosns("MODE_SCHEME_TYPESel", { "ID": _ID }, "SCHEME_TYPE");
			app.post("SWZZ_MODE_SCHEME_TYPE/findResult",{stcd : _ID},(data)=>{
				JosnSel(data,"SCHEME_TYPE")
			})
        })
        function gridLoad() {
            var jsonarray = $.data(myData, "gridColumn");
            var jsonData = $.data(myData, "gridData"); 

            var ColoumnsName = [];
            ColoumnsName.push({ field: "TM", header: "时间", headerAlign: 'center', align: 'center', autoescape: true, width:60 });
            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            if (jsonarray.length > 0) {
                for (num = 0; num < jsonarray.length; num++) { 
                    var field = jsonarray[num].STCD;
                    var name = jsonarray[num].STNM;
                    var width =120;
                    if (jsonarray[num].STCD != "VALUE") {
                        width = 120;
                        name = "<a onclick='lookFangAn(\"" + field + "\")' href='javascript:void(0)'  style='text-decoration:underline;color:black;'>" + name + "</a>";
                    }
                    else {
                        width = 40;
                    }
                    if (field.indexOf("DRP")==-1) {
                        if ($.data(myData, "DATA_TYPE") == "2") {
                            if (jsonarray[num].STCD == "VALUE") {
                            } else {
                                ColoumnsName.push({ field: field, header: name, headerAlign: 'center', align: 'center', autoescape: true, width: width,decimalPlaces:2, dataType:"float" });
                                strNote += ',{"name": "' + jsonarray[num].STNM + '","codename": "' + field + '","tableV":"1","isShow":true,"width":"30%"}';
                            }
                        } else {
                            ColoumnsName.push({ field: field, header: name, headerAlign: 'center', align: 'center', autoescape: true, width: width,decimalPlaces:2, dataType:"float" });
                            strNote += ',{"name": "' + jsonarray[num].STNM + '","codename": "' + field + '","tableV":"1","isShow":true,"width":"30%"}';
                        }
                    }
                }
            } 
            strNote += ']';
            //绘制过程线颜色设置
            var LineColor = ['blue', '#07C600', "#72F3EF", "#66CDAA",  "#7794F4", "#4662D9", "#EDD475", "#ED8854", "#ED1A1E","#ED03B7"];
            //绘制图形 
            $.data(myData, "gridData", jsonData) 
            if ($.data(myData, "DATA_TYPE") == "1") {
				console.log(jsonData.data)
				console.log(eval('(' + strNote + ')'))
				
                chartSW("divChart", jsonData.data, eval('(' + strNote + ')'), LineColor, "水位(m)");
            } else{
                chartSW("divChart", jsonData.data, eval('(' + strNote + ')'), LineColor, "流量(m³/s)");
            }
			console.log(ColoumnsName)
            grid.set({ columns: ColoumnsName });
            fillData(0, grid.getPageSize(), jsonData, grid);
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") { 
                var aggList = data.data.split('@'); 
                if (aggList[1] == "") {
                    //$("#divChart").html("<div style=\"line-height:100px;font-size:28px; text-align:center;\">暂无数据</div>");
                    $("#divHide").css("display", "block"); 

                }else if (aggList[0] != "") {
                    $("#divHide").css("display", "none");
                    var jsonarray = eval('(' + aggList[0] + ')');
                    var jsonData = eval('(' + aggList[1] + ')');
                    $.data(myData, "gridColumn", jsonarray);
                    $.data(myData, "gridData", jsonData);
                    gridLoad();
                } else { 
                    $("#divHide").css("display", "block");
                    //$("#divChart").html("<div style=\"line-height:100px;font-size:28px; text-align:center;\">暂无数据</div>");
                }
                mini.unmask(document.body);

            } else if (typeID == "SCHEME_TYPE") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
					console.log(o);
                    FromSetinnerHTML(o, "View");  
                }
            } else if (typeID == "tree") {
                var result = data.data;
                //var tempData = [];
                //if (result.length > 0) {
                //    tempData.push({ id: "SW", text: "水位" });
                //    tempData.push({ id: "LL", text: "流量" });
                //    tempData.push({ id: "XL", text: "蓄水量" });
                //    for (num = 0; num < result.length; num++) {
                //        var TYPE = result[num].TYPE;
                //        if (TYPE == "1") {
                //            tempData.push({ id: result[num].ID, text: result[num].NAME, STCD: result[num].STCD, pid: "SW" });
                //        } else if (TYPE == "2") {
                //            tempData.push({ id: result[num].ID, text: result[num].NAME, STCD: result[num].STCD, pid: "LL" });
                //        } else if (TYPE == "15") {
                //            tempData.push({ id: result[num].ID, text: result[num].NAME, STCD: result[num].STCD, pid: "XL" });
                //        }
                //    }
                //}
                //console.error(result);
                tree.loadList(result, "id", "pid");
                tree.select(1); 
                search();
            }
        }


        //分页
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, $.data(myData, "gridData"), grid);
        });

        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on"); 
            $(".fit").hide();
            $("#" + objFit).show();
            gridLoad();
        }
        function onNodeClick(e) {
            var tree = e.sender;
            var node = e.node;
            var isLeaf = tree.isLeaf(node);
            if (isLeaf == false) {
                e.cancel = true;
            } else {
                mini.mask({
                    el: document.body,
                    cls: 'mini-mask-loading',
                    html: '加载中...'
                });
                search();
            }
        }
        function search() {
            var node = tree.getSelectedNode();
            $.data(myData, "DATA_TYPE", node.type)
            var strParam = {
                "dd_MIND": $.data(myData, "ID"),
                "stcd": node.stcd,
                "data_TYPE":node.type
            };
            //GetJosns("GetFangAnData", strParam, "Sel");
			app.post("SWZZ_MODE_BDMS_PREDICT/GetFangAnData",strParam,(data)=>{
				JosnSel(data,"Sel")
			})
        }
        function btnSearch() {
            var key = mini.get("key").getValue();
            if (key == "") {
                tree.clearFilter();
            } else {
                key = key.toLowerCase();
                tree.filter(function (node) {
                    console.error(node);
                    var text = node.name ? node.name.toLowerCase() : "";
                    if (text.indexOf(key) != -1) {
                        return true;
                    }
                });
            }
        }
        function onKeyEnter(e) {
            btnSearch();
        }
        function FanHui() {
            window.parent.addTab("多方案对比分析", "DD_MX/DuoZhanFenXi.html?stime=" + $.data(myData, "STIME") + "&etime=" + $.data(myData, "ETIME") + "&key=" + $.data(myData, "KEY"), "", "多方案对比分析");
        }
        function lookFangAn(objID) {
            window.parent.OpenTab("fa-delicious", "调度方案成果展示", "DD_MX/ResultsRelease.html?DD_ID=" + objID);
        }


        /* 过程线绘制 过程线 水位
 * ChartName画图控件名称
 * dataS数据对象，数据格式json
 * strNote数据说明，数据类型数组，数据格式
 * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示过程线
 * [
 * {"name": "时间","codename": "TM","tableV":"1","isShow":true},
 * {"name": "上游水位","codename": "UPZ","tableV":"1","isShow":true},
 * {"name": "下游水位","codename": "DWZ","tableV":"1","isShow":true},
 * {"name": "警戒水位","codename": "WRZ","tableV":"0","isShow":false}

 * ]
 */
        function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
            var node = tree.getSelectedNode();
            var stnm = node.name;
            if (max_min_Name == "") {
                max_min_Name = "水位(m)";
            }
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            myChart.clear();

            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            var ShowSelected = {};
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合 
                    } else if (value1.name == "名称") {
                        if (value[value1.codename] != undefined) {
                            chartTM.push(new Date(value[value1.codename]).format("MM-dd HH:mm"));
                        }
                    } else if (value1.name == "时间名称") {
                        chartTM.push(value[value1.codename]); //加入时间集合 
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });

            //获得最大值最小值
            //var max_min=GetSort(chartValue);

            var option = {
                title: {
                    text: stnm + "站预报水位过程",
                    x: "50%",
                    y: "top",
                    textAlign: "center",
                    textStyle: {
                        fontSize: 22,
                        fontWeight: 'normal',
                        color: ['#333']
                    },
                    subtextStyle: {
                        color: '#666',
                        fontSize: 16
                    },
                },
                tooltip: {
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    },
                    selected: ShowSelected,
                    x: 'center',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    //left: '41%',
                    padding: [50, 0, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                },
                grid: {
                    left: '1%',
                    right: '2%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: { show: false, type: ['line', 'bar'] },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: chartTM,
                        axisLine: {
                            lineStyle: {
                                color: '#999',
                                width: 1 //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#999',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        // splitNumeber:5,
                        scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#E5E5E5',
                                width: 1,
                                type: 'dashed'
                            }
                        },

                        //min:max_min.min, //动态设置最大值最小值。
                        //max:max_min.max,
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 200;
                            }


                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 200;
                            }

                        },

                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            },
                            textStyle: {
                                color: '#999'
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#999',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    }
                ],
                series: function () {
                    var serie = [];

                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间" || chartName[j] == "名称" || chartName[j] == "时间名称") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            if (isNaN(m[i][j]) == false) {
                                chartValue.push(changeTwoDecimal(m[i][j], 2)); //循环价值
                            }
                        }
                        if (max_min_Name != "" & max_min_Name == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                smooth: true,
                                itemStyle: {
                                    normal: {
                                        lineStyle: {
                                            width: 1,
                                            type: 'solid'  //'dotted'虚线 'solid'实线
                                        }
                                    }
                                }

                                //		           ,itemStyle: {normal: {
                                //		            	areaStyle: {type: 'default'},
                                //						//颜色渐变设置
                                //		            	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //		            		offset:0,
                                //		            		color:'#050AE8'
                                //		            	},{
                                //		            		offset:1,
                                //		            		color:'#8688F4'
                                //		            	}])
                                //		            }}	
                            }
                            serie.push(item);
                        }
                        else if (chartName[j] == "警戒水位") {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: true,
                                smooth: false,
                                itemStyle: {
                                    normal: {
                                        lineStyle: {
                                            width: 1,
                                            type: 'dotted'  //'dotted'虚线 'solid'实线
                                        }
                                    }
                                }
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' },
                                    { type: 'min', name: '最小值' }]
                                },
                                type: 'line',
                                connectNulls: true,
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };

            myChart.resize();
            myChart.setOption(option);
        }
    </script>
</body>
</html>
