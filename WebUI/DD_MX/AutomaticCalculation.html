<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>水动力模型自动预报</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../Common/JSMy.js" type="text/javascript"></script>
    <script src="../Common/Scripts/swfupload/swfupload.js"></script>
    <script src="../Common/Scripts/calendar.js"></script>
    <link href="../Common/CSS/Calendar.css" rel="stylesheet" />
    <style type="text/css">
        html {
            overflow-y: hidden;
        }
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
        }

        .table {
            width: 96%;
            margin: 0px auto;
            max-width: 100%;
            margin-bottom: 20px;
        }

        .table-bordered {
            /*border: 1px solid #EBEBEB;*/
        }

        thead {
            display: table-header-group;
            vertical-align: middle;
            border-color: inherit;
        }

        .table td {
            line-height: 1.42857;
            padding: 8px;
            text-align: left;
            font-size: 14px;
            vertical-align: top;
            border: 1px solid #e7e7e7;
            /*background-color: #F5F5F6;*/
        }

        .table-bordered tr th, .table-bordered tr td, .table-bordered tbody tr td {
            border: 0px;
            height: 40px;
        }

        .c-index {
            display: inline-block;
            padding: 1px 0;
            color: #fff;
            width: 20px;
            line-height: 100%;
            font-size: 14px;
            text-align: center;
            background-color: #8eb9f5;
        }

        .c-gap-icon-right-small {
            margin-right: 5px;
        }

        .box {
            padding: 0px 0px;
            width: 100%;
            overflow-y: hidden;
            height: 100%;
        }

        .yb_left {
            float: left;
            width: 600px;
            /*border: 1px solid #d3d3d3;*/
            background: #ffffff;
            /*margin-top: 5px;*/
            height: 400px;
        }

        .tqyb_right {
            float: right;
            width: calc(100% - 610px);
            height: 400px;
            background: #ffffff;
        }
        .mini-checkboxlist table label,
        .mini-radiobuttonlist table label {
            font-size: 15px !important;
        }
        .mini-radiobuttonlist-td{
            height:28px;
        }
    </style>
</head>

    <div class="box">
        <div class="yb_left">
            <div style="text-align:left; width:100%;line-height: 35px; background-color: #FFF;padding-left: 10px; color: black;font-size:16px;width:calc(100% - 10px);margin:0px auto;">
                &nbsp;<span style="width: 5px;height: 17px;margin-top: 9px;background-color: #0C52C4;vertical-align: top;display: inline-block;">&nbsp;</span>
                自动计算设置
            </div>

                <table class="form-table" border="0" cellpadding="1" cellspacing="2">
                    <tr height="50">
                        <td width="50"></td>
                        <td>
                            自动预报时长：
                            <input id="NUM" name="NUM" class="mini-combobox" style="width:80px;" textField="text" valueField="id" allowInput="true"

                            小时
                        </td>
                    </tr>
                    <tr height="50">
                        <td width="30"></td>
                        <td>
                            <span style="float:left;">每日计算时间：</span>
                            <div id="cbl1" class="mini-checkboxlist" repeatItems="2" repeatLayout="table"
                                 textField="text" valueField="value" style="float:left;">
                            </div>
                        </td>
                    </tr>
                    <tr height="50">
                        <td width="30"></td>
                        <td>
                            <span style="float:left;">降雨预报选项：</span>
                            <div id="cblJY" class="mini-radiobuttonlist" repeatItems="2" repeatLayout="table"
                                 textField="TEXT" valueField="VALUE" data="[{'VALUE':'shanghaiyb','TEXT':'上海气象台'},{'VALUE':'zhongyangyb','TEXT':'中央气象台'}]" style="float:left;">
                            </div>
                        </td>
                    </tr>
                    <tr height="50">
                        <td width="30"></td>
                        <td>
                            <span style="float:left;">潮位预报选项：</span>
                            <div id="cblCW" class="mini-radiobuttonlist" repeatItems="2" repeatLayout="table"
                                 textField="TEXT" valueField="VALUE" style="float:left;">
                            </div>
                        </td>
                    </tr>
                    <tr height="50">
                        <td colspan="2" align="center">
                            <a id="searchbtn" class="mini-button" onclick="saveData()">保存设置</a>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
        <div class="tqyb_right">
            <div style="text-align:left; width:100%;line-height: 35px; background-color: #FFF;padding-left: 10px; color: black;font-size:16px;width:calc(100% - 10px);margin:0px auto;">
                &nbsp;<span style="width: 5px;height: 17px;margin-top: 9px;background-color: #0C52C4;vertical-align: top;display: inline-block;">&nbsp;</span>
                方案日历
            </div>
            <div style="border-top: solid 1px #e8e8e8;height: calc(100% - 35px);width:calc(100% - 10px);margin:0px auto;">
                <div id="calendar"></div>
                <div id="calendarTable" style="display:none;">
                    <div style="float:right;cursor:pointer;" onclick="returnMethod()"><i class="fa fa-angle-left" style="font-size: 25px;"></i><span style="vertical-align: 4px;  margin-left: 6px;">返回</span> </div>
                    <table  class="form-table" border="0" cellpadding="1" cellspacing="2">
                        <tr height="50">
                            <td width="150"></td>
                            <td class="form-label" align="left" style="font-size:16px;">

                            </td>
                        </tr>
                        <tr>
                            <td width="150"></td>
                            <td>
                                <a id="searchbtn" class="mini-button" onclick="checkData()">手动补算方案</a>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
        <div style="clear:both"></div>

                <div id="checklist" style="height:100%;">

                </div>
            </div>
        </div>

                    // }

                    mini.alert("当前时刻无降雨数据！");
                }
            }
            else if (typeID == "MODE_DD_SOLUTION_YSSel") {
                var finish = data.data[0].DD_FINISH;
                if (finish == "0") {//说明还没计算完成
                    process(DD_ID_CUR);

                        addFangAn();

                        fa_arr = [];

                var jyType="shanghaiyb";

                            $("#calendarTable").css("display", "block");

            }

        function AutomaticCalculation() {
            if (tongbu_ZD != null) {
                //判断早晚八点
                DD_TM = new Date().format("yyyy-MM-dd HH:00:00");
                var hours = new Date().getHours();
                var DD_TM = mini.get("TM").getFormValue() + " 08:00:00";
                var listNum=$.data(myData, "listNum");
                if(listNum!=null&&listNum!=undefined&&listNum!=""){
                    var listNumTemp=listNum.filter(function(e){
                        return Number( e.value)>=hours;
                    });
                    if(listNumTemp.length>0){
                        listNumTemp=sortObjectArray(listNumTemp, ["value"], "asc");
                        DD_TM=mini.get("TM").getFormValue() + " "+listNumTemp[0].value+":00:00";
                    }
                }
                // if (hours >=20) {
                //     DD_TM = mini.get("TM").getFormValue() + " 20:00:00";
                // }
                $.data(myData, "DD_TM", DD_TM);
                tmArr.push($.data(myData, "DD_TM"));
                DD_ZD = "0";
                $.data(myData, "hours", hours);
                //启动计算之前先判断今天这个时刻是否已经计算过，或者这个时刻正在计算
                startModel();
            }
        }

            })
        }
