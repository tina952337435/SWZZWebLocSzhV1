<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>调度方案</title>
    <link href="../Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size:14px;
        }

        .mini-button-icon {
            left:0px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            方案：<input id="DD_ID" name="DD_ID" class="mini-combobox" style="width:250px;" textField="dd_NAME" valueField="dd_ID"
                allowInput="true" onvaluechanged="onvaluechangedTM" />
            <button type="button" class="btn btn-info" onclick="Exp()" style="margin: 0px 0px;padding: 4px 12px;">数据导出</button>
            <a class="mini-button" iconCls="icon-upload">发布</a>
        </div>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);" allowalternating="true"
         borderstyle="border-right:0;" idfield="id"  showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" showPager="false"
         ondrawcell="ondrawcell" allowCellEdit="true" allowCellSelect="true">
        <div property="columns">
            <div type="indexcolumn" width="4%" headeralign="center" align="center">序号</div>
            <div field="stnm" headeralign="center" align="center">
                站点名称
            </div>
            <div field="maxz" headeralign="center" align="center" width="60">
                最高水位(m)
                <input property="editor" class="mini-textbox"  _maxWidth="100" />
            </div>
            <div field="maxtm" headeralign="center" align="center">
                最高水位出现时间
            </div>
            <div field="minz" headeralign="center" align="center" width="60">
                最低水位(m)
                <input property="editor" class="mini-textbox"  _maxWidth="100" />
            </div>
            <div field="mintm" headeralign="center" align="center">
                最低水位出现时间
            </div>
        </div>
    </div>
    <script language="javascript" type="text/javascript">
        mini.parse();
        //实例化表格对象
        var grid = mini.get("grid1");
        $(function () {
            app.post("SWZZ_MODE_DD_SOLUTION/findByDD_IDandDD_status",{"dd_STATUS": "1"},(data)=>{
				JosnSel(data,"MODE_DD_SOLUTIONSel")
			});
        })
        function onKeyEnter() {
            //关键字
            search();
        }
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            PageFillData(0, 15);
        }
        function PageFillData(pageIndex, pageSize) {
            var DD_ID=mini.get("DD_ID").getValue();
            var stcds="1170181,2060881,1460281,1850281";
            //1170181,2060881,1460281,1850281
            //吴淞口,黄浦公园,米市渡,芦潮港
            var strParam = { "solutionid": DD_ID, "stcd": stcds, "data_TYPE": "1" };
            app.post("SWZZ_MODE_BDMS_PREDICT/WJ_MODELSINGRESULT", strParam, (data) => {
                JosnSel(data, "Sel")
            });
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var dataResult=data.data;
                dataResult=dataResult.filter(function(res){
                    return "1170181,2060881,1460281,1850281".indexOf(res.stcd)>-1;
                });
				grid.setData(dataResult);
                mini.unmask(document.body);
            }
            else if (typeID == "MODE_DD_SOLUTIONSel") {
                fa_arr = data.data;
				fa_arr.sort((a,b)=>{
					return new Date(b.dd_TM).getTime() - new Date(a.dd_TM).getTime();
				})
                mini.get("DD_ID").setData(fa_arr);
                mini.get("DD_ID").select(0);

                //默认加载数据
                search();
            }
        }

        function OpenHref(DD_EVALUE, objID, DD_ID, DD_CARRYBY, DD_EVALUE,DD_DISTRIBY) {
            var url ="DD_MX/ResultsRelease.html";
            if(DD_DISTRIBY=="100"){
                url="storage/ResultsReleaseReportCXL.html";
            }
            url = url+"?ID=" + objID + "&DD_ID=" + DD_ID + "&FA_ID=" + DD_EVALUE + "&stime=" + mini.get("STIME").getFormValue() + "&etime=" + mini.get("ETIME").getFormValue() + "&key=" + mini.get("key").getValue() + "&type=list";
            window.parent.addTab("调度方案详细信息", url);
        }
        //删除
        function del(objID) {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        var strWhere = { "stcd": objID };
                        //GetJosns("MODE_DD_SOLUTIONDel", strWhere, "Del");
						app.post("SWZZ_MODE_DD_SOLUTION/remove",strWhere,(data)=>{
							JosnSel(data,"Del")
						});
                    }
                }
            );
        }
        //编辑调度方案
        function edit(objID, STIME, ETIME, DD_EVALUE) {
            var strParam = "action@edit,ID@" + objID;
            editData(strParam, "DD_MX/FangAn.html", "调度方案记录管理", "700px", "500px", "true");
        }

        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "maxtm" || field == "mintm") {
                if (value != undefined) {
                    e.cellHtml = mini.formatDate(new Date(value), 'yyyy-MM-dd HH:mm');
                }
            }
        }
        function collectFang(ID, TYPE) {
            var DD_CARRYBY = "1";
            if (TYPE == "yes") {
                DD_CARRYBY = "10";
            }
            var strWhere = { id: ID, dd_CARRYBY: DD_CARRYBY};
            //GetJosns("MODE_DD_SOLUTIONUpdate", strWhere, "MODE_DD_SOLUTIONUpdate");
			app.post("SWZZ_MODE_DD_SOLUTION/modify",strWhere,(data)=>{
				JosnSel(data,"MODE_DD_SOLUTIONUpdate")
			});
        }

        function Exp() {
            var data = grid.data;
            var name = mini.get("STCD").getText() + "(" + mini.get("STCD").getValue() + ")";
            name += new Date(mini.get("STIME").getFormValue()).format("yyyy年M月d日") + "-";
            name += new Date(mini.get("ETIME").getFormValue()).format("yyyy年M月d日") + "整点潮位数据";
            ExportExcel(data, grid, name);
        }
    </script>
</body>
</html>
