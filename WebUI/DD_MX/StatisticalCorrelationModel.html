            else if (typeID == 'GetStatisticsPredictObjectsGSApi') {

            }

        function startJisuan() {
            mini.mask({

            });

                "version": 1,
                "api": "GetResultPresetByTimePeriod",

                    var vals=res.data.vals;
                    for (var _index = 0; _index < times.length; _index++) {
                        var ctm = new Date(times[_index]).format('yyyy-MM-dd HH:mm:ss');
                        var pREDICT = {};
                        pREDICT.stcd = baseZhanDianT[num].stcd;
                        pREDICT.tm = ctm;//模型计算数据要加8小时
                        pREDICT.drp = vals[_index];
                        listPPTN.push(pREDICT);
                    }                    
                });
            }
            
            // strWhere = {
            //     yj_time: stime,
            //     yj_etime: etime,
            //     SOLUTIONID: SOLUTIONID,

            //     //SWLIST: JSON.stringify(SWLIST)
            // };
            // app.post("GetStatisticsPredictObjectsGSApi", strWhere, function (res) {
            //     JosnSel(res, "GetStatisticsPredictObjectsGSApi");
            // });

            console.error("listPPTN",listPPTN);
                
            $.data(myData, "listPPTN",listPPTN);
            GetStatisticsPredictObjectsGS();
        }
        function GetStatisticsPredictObjectsGS(){
            var mPredictTime=stime;
            var mPredictETime=etime;
            var listPPTN=$.data(myData, "listPPTN");
            var listGUANNew =$.data(myData, "baseZhanDian");
            var listGUANNewYL = listGUANNew.filter(p => {return p.type == "GSXGTJ" && p.field == "雨量";});
            var zhanidsYL ="";
            listGUANNewYL.filter(p=>{
                zhanidsYL+= p.stcd+",";
            });
            zhanidsYL=zhanidsYL!=""?zhanidsYL.substring(0,zhanidsYL.length-1):"";
            var strWhere={
                pattem:zhanidsYL,
                strExp: SOLUTIONID
            }
            var listData=[];
            app.postAsync("SWZZ_MODE_ES_ZHANDIANDATA/findResult",strWhere,function(res){
                listData=res.data;
            });
            var listGUANNewSW = listGUANNew.filter(function(p) {return p.type == "GSXGTJ" && p.field == "水位"});
            var listGUANNewSWZ = listGUANNew.filter(function(p){return p.field == "水位"});//需要查前7日实测水位的站
            var stcdsSW ="";
            listGUANNewSWZ.filter(p=>{
                stcdsSW+= p.stcd+",";
            });
            stcdsSW=stcdsSW!=""?stcdsSW.substring(0,stcdsSW.length-1):"";
            var swetime =new Date( etime).format("yyyy-MM-dd HH:mm:ss");
            var swstime =new Date(AddHourDate(etime,-7*24)).format("yyyy-MM-dd HH:mm:ss");
            strWhere={
                stime: swstime,
                etime: swetime,
                stcd: stcdsSW,
                pathname:"HOUR"
            }
            var listWas=[];
            app.postAsync("/GetWaterViewNew/selectListByHis", strWhere, (res) => {
                listWas=res.data;
            });
            var userList =[];
            listGUANNewSW.forEach(u => {
                // console.error(u);
                var ybupz = 0;
                var stcd = u.stcd;
                var zhanid="",stnm="";
                if (stcd == "63403500")//陈墓水位
                {
                    zhanid="1728053248";
                    stnm="陈墓";
                    ybupz = FormulaCalculationCM(mPredictTime, listWas, listPPTN, listData);
                }
                else if (stcd == "63301150")//嘉兴水位
                {
                    zhanid="1728053250";
                    stnm="嘉兴";
                    ybupz = FormulaCalculationJX(mPredictTime, listWas, listPPTN, listData);
                }
                else if (stcd == "63205150")//昆山水位
                {
                    zhanid="1728053251";
                    stnm="昆山";
                    ybupz = FormulaCalculationKS(mPredictTime, listWas, listPPTN, listData);
                }
                else if (stcd == "63205350")//平望水位
                {
                    zhanid="1728053252";
                    stnm="平望";
                    ybupz = FormulaCalculationPW(mPredictTime, listWas, listPPTN, listData);
                }
                ybupz = parseFloat(ybupz).toFixed(2);
                // console.error(stnm,ybupz);
                var dtoNew = {};
                dtoNew.stcd = zhanid;
                dtoNew.stnm = stnm;
                var listWasTemp = listWas.filter(function(p){return p.stcd == stcd && p.tm == mPredictTime});
                var upz = listWasTemp.length > 0 ? Number(listWasTemp[0].upz) : 0;
                //水位线性插值
                var CModelComputeDataItemmData = getXiangXingChaZhiArray(upz, ybupz, mPredictTime, mPredictETime);
                dtoNew.mData = CModelComputeDataItemmData;
                userList.push(dtoNew);

                console.error('dtoNew',stnm,upz,ybupz);
            });
            var data={
                data:userList,
                total:userList.length
            }
            JosnSel(data, "GetStatisticsPredictObjectsGSApi");
        }

        function chartLL(ChartName, _xdata, data, LineColor, max_min_Name) {

            var chartName = []; 	//控件元素名称
            var chartTM = _xdata; 	//时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();
            $.each(data, function (index, value, item) {
                chartName.push(value.stnm);   //Echarts绘制标注名称加入
            });
            var option = {
                title: {
                    //text: YBTM,
                    left: "center",
                    textStyle: {
                        color: '#000',
                        fontSize: 20,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show: true,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        },
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 30;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 30;
                            }


                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 30;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 30;
                            }

                        },
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < data.length; j++) {
                        var item = {

                            symbol: 'none',  //这句就是去掉点的
                            type: 'line',
                            data: data[j].mData,
                            smooth: true
                        }
                        serie.push(item);
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>

    <script>
        //昆山预报水位公式计算：Z_昆山 =-0.00779+Z_昆山-1 -0.132Z_昆山-2 +0.132Z_昆山-3 -0.0935Z_昆山-4 +0.0935Z_昆山-5 +0.00189P_嘉宝北片面平均 
        //-0.00106P_嘉宝北片面平均-2 +0.00147P_商榻片面平均 -0.00038P_商榻片面平均-7
        function FormulaCalculationKS(mPredictTime,listWas, listPPTN, listData)
        {
            var stime1 =new Date(AddHourDate( mPredictTime,-24*1)).format("yyyy-MM-dd HH:mm:ss");
            var listWasTemp = listWas.filter(function(p){return p.stcd == "63205150" && p.tm == stime1});
            console.error("stime1",stime1);
            var Z1 = listWasTemp.length>0?Number( listWasTemp[0].upz):0;//昆山站前一天当前时刻水位

            var stime2 = new Date(AddHourDate(mPredictTime,-24*2)).format("yyyy-MM-dd HH:mm:ss");
            listWasTemp = listWas.filter(function(p){return p.stcd == "63205150" && p.tm == stime2});
            var Z2 = listWasTemp.length > 0 ? Number(listWasTemp[0].upz) : 0; ;//昆山站前两天当前时刻水位
            
            var stime3 = new Date(AddHourDate(mPredictTime,-24*3)).format("yyyy-MM-dd HH:mm:ss");
            listWasTemp = listWas.filter(function(p){return p.stcd == "63205150" && p.tm == stime3});
            var Z3 = listWasTemp.length > 0 ? Number(listWasTemp[0].upz) : 0; ;//昆山站前三天当前时刻水位

            var stime4 = new Date(AddHourDate(mPredictTime,-24*4)).format("yyyy-MM-dd HH:mm:ss");
            listWasTemp = listWas.filter(function(p){return p.stcd == "63205150" && p.tm == stime4});
            var Z4 = listWasTemp.length > 0 ? Number(listWasTemp[0].upz) : 0; ;//昆山站前四天当前时刻水位

            var stime5 =new Date(AddHourDate(mPredictTime,-24*5)).format("yyyy-MM-dd HH:mm:ss");
            listWasTemp = listWas.filter(function(p){return p.stcd == "63205150" && p.tm == stime5});
            var Z5 = listWasTemp.length > 0 ? Number(listWasTemp[0].upz) : 0; ;//昆山站前五天当前时刻水位

            var listDataTemp = listData.filter(function(p){return p.zhanid == "1744830552"});
            var jbbp_drpyb =Number(SumJson(listDataTemp,'zhandata'));//嘉宝北片面平均（预报周期累计降雨）
            

            var listPPTNTemp = listPPTN.filter(function(p){return new Date(p.tm) > new Date(stime2) && new Date(p.tm) <= new Date(stime2)&&p.stcd== "81459"});
            var jbbp_drpyb2 =Number(SumJson(listPPTNTemp,'drp'));//嘉宝北片面平均前两日这1天的24h累计降雨

            listDataTemp = listData.filter(function(p){return p.zhanid == "1744830531"});
            var stp_drpyb = Number(SumJson(listDataTemp,'zhandata'));//商榻片面平均（预报周期累计降雨）

            var stime6 = new Date(AddHourDate(mPredictTime,-24*6)).format("yyyy-MM-dd HH:mm:ss");
            var stime7 = new Date(AddHourDate(mPredictTime,-24*7)).format("yyyy-MM-dd HH:mm:ss");
            listPPTNTemp = listPPTN.filter(function(p){return new Date(p.tm) > new Date(stime7) && new Date(p.tm) <= new Date(stime6) && p.stcd == "80991"});
            var stp_drpyb7 = Number(SumJson(listPPTNTemp,'drp'));//商榻片面平均前7日这1天的24h累计降雨

            console.error("前一天",Z1,"前两天",Z2,"前三天",Z3,"前四天",Z4,"前五天",Z5,"累计降雨",jbbp_drpyb,"前两日",jbbp_drpyb2,"商榻片面平均",stp_drpyb,"商榻片面平均前7日",stp_drpyb7);
            var upz = -0.00779 + Z1 - 0.132 * Z2 + 0.132 * Z3 - 0.0935 * Z4 + 0.0935 * Z5 + 0.00189 * jbbp_drpyb 
                - 0.00106 * jbbp_drpyb2 + 0.00147 * stp_drpyb - 0.00038 * stp_drpyb7;
            return upz;
        }

        //平望预报水位公式计算：Z_平望 =-0.0143+Z_平望-1 -0.0638Z_平望-2 +0.0638Z_平望-3 +0.00225P_商榻片面平均 +0.00256P_浦南西片面平均 -0.000884P_浦南西片面平均-2

        function getXiangXingChaZhiArray(szs, ezs, stm, etm)

            mData.push( (szs-0.26).toFixed(2));
            for (var _num = 1; _num < minutes; _num++)
            {
                if (_num < minutes - 1)
                {
                    var tm =  new Date(new Date(mPredictTime).addDate('n',_num*5)).format("yyyy-MM-dd HH:mm:ss");
                    ss = tm - stm;
                    var juli = GetDateDiff(stm,tm,'minute')/5;//每个预报时刻距初始时刻时段
