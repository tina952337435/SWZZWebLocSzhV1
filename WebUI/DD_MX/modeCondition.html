    <script>
        mini.parse();
        var tabs = mini.get('tabs');
        var gridJY = mini.get('gridJY');
        var gridSW = mini.get('gridSW');
        var GCDATATYPE = "tianwenchao";
        var JYDATATYPE = "SK@6";
        $(function () {
            var _dd_id = GetTableID();
            SetCookie("SOLUTIONID", _dd_id, 1);
            var dataTM = [];
            for (var num = 0; num < 24; num++) {
                dataTM.push({ id: num, text: num });
            }
            mini.get("startHour").setData(dataTM);
            mini.get("endHour").setData(dataTM);

            var DD_TM = new Date().format("yyyy-MM-dd 08:00:00");
            var ETIME = new Date(AddHourDate(DD_TM, 24)).format("yyyy-MM-dd HH:mm:ss");
            var hour = new Date(DD_TM).getHours();
            mini.get("startHour").setValue(hour);
            hour = new Date(ETIME).getHours();
            mini.get("endHour").setValue(hour);
            mini.get("TM").setValue(DD_TM);
            mini.get("ETM").setValue(ETIME);

            GetJosns("MODE_ES_SLTONGJISel", { "PID": "c5abfaa42d5e43d6" }, "MODE_ES_SLTONGJISel");
            upDataZhandianData();

            $(".wrap ul li").click(function () {
                $(".wrap ul li").removeClass("hover");
                $(this).addClass("hover");
                $(".mini-fit1").hide();
                $(".mini-fit2").hide();
                $("." + $(this).attr('name')).show();
            });
            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function () {
                    this.className = this == f ? 'selected' : '';
                });
            });
        });
        function search() {
            var _dd_id = GetTableID();
            SetCookie("SOLUTIONID", _dd_id, 1);
            upDataZhandianData();
        }
        //更新边界初始数据
        function upDataZhandianData() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });

            var stime = mini.get("TM").getFormValue() + " " + mini.get("startHour").getValue() + ":00:00";
            var etime = mini.get("ETM").getFormValue() + " " + mini.get("endHour").getValue() + ":00:00";
            $.data(myData, "stime", stime);
            $.data(myData, "etime", etime);
            var num = GetDateDiff(stime, etime, 'hour');
            $.data(myData, "HOUR", num);
            var s_where = {
                "STIME": $.data(myData, "stime"),
                "ETIME": $.data(myData, "etime"),
                "SOLUTIONID": GetCookie("SOLUTIONID"),
                "JYDATATYPE": JYDATATYPE,
                "GCDATATYPE": GCDATATYPE,
                username: GetCookie("LOGINNAME"),
            };
            GetJosns("UPDATA_MODEZHANDData", s_where, "UPDATA_MODEZHANDData");
        }
        function JosnSel(data, typeID) {
            if (typeID == "UPDATA_MODEZHANDData") {
                GridColum();
                GridColumSW();
            }
            else if (typeID == "GridColum") {
                var dataResult = mini.decode(data.data);
                var item = {
                    field: "action", header: "统一操作", headerAlign: "center", align: "center", filter: { "type": "textbox", "onValueChanged": "onFilterChangedQuan", "emptyText": "全流域批量输入" }
                };
                dataResult.columns.push(item);
                $.data(myData, "columns", dataResult.columns);
                gridJY.set(dataResult);
                onLoadDataJY();
            }
            else if (typeID == "SelJY") {
                var dataResult = mini.decode(data.data);
                gridJY.setData(dataResult);
                mini.unmask(document.body);
            }
            else if (typeID == "GridColumSW") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridSWColumns", dataResult);
                onLoadDataSW();
            }
            else if (typeID == "SelSW") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridSWData", dataResult);
                gc_choose(str_choose);
                mini.unmask(document.body);
            }
            else if (typeID == "MODE_ES_SLTONGJISel") {
                var strJson = data.data;
                var arr = strJson;
                var strParaMsg = "";
                var strParaNum = "";
                var html = '<span style="float:left;line-height: 33px; font-size:14px !important;">站点类型：</span><ul class="onlytab" id="onlytab">';

                for (var num = 0; num < arr.length; num++) {
                    var tempParaID = arr[num].ID;
                    var cls = "onlyli";
                    if (num == 0) {
                        str_choose = arr[num].STCD;
                        str_type = arr[num].TITLE;
                        cls = "onlyli start onlyliHover";
                    }
                    if (num == arr.length - 1) {
                        cls = "onlyli end";
                    }
                    var title = arr[num].TITLE;
                    html += '<li id="' + tempParaID + '" name="' + arr[num].STCD + '" class="' + cls + '" onclick="OnClickTitle(this.id,this.id,\'' + arr[num].ID + '\',\'' + title + '\')">' + title + '</li>';

                }
                html += '</ul>';
                $("#gcUL").html(html + strParaMsg);
            }
            else if (typeID == "updateButton") {
                if (data.total == 0) {
                    ShowMsg("无降雨数据！");
                } else {
                    ShowMsg(data.data);
                    onLoadDataJY();
                }
                mini.unmask(document.body);
            }
            else if (typeID == "update_batch") {
                ShowMsg(data.data);
                onLoadDataSW();
            }
            else if (typeID == "update_batchJY") {
                ShowMsg(data.data);
                onLoadDataJY();
            }
            else if (typeID == "UpdataInput") {
                ShowMsg(data.data);
                onLoadDataJY();
            }
            else if(typeID=="MODE_ES_ZHANDIANDATA_MODEInsert"){
                hideWindow();
                mini.unmask(document.body);
            }
        }
        function GridColum() {
            GetJosns("FH_JosnHtml_JiangYu", {}, "GridColum");
        }
        function GridColumSW() {
            GetJosns("FH_JosnHtml_ShuiWei", {}, "GridColumSW");
        }
        function onLoadDataJY() {
            var s_where = {
                "stime": $.data(myData, "stime"),
                "etime": $.data(myData, "etime"),
                "msgType": "0",
                "SOLUTIONID": GetCookie("SOLUTIONID"),
                "DayHour": mini.get("RbRain").getValue()
            };
            GetJosns("FH_GetBind", s_where, "SelJY");
        }
        top["win"] = window;
        function onLoadDataSW() {
            var s_where = {
                "stime": $.data(myData, "stime"),
                "etime": $.data(myData, "etime"),
                "SOLUTIONID": GetCookie("SOLUTIONID"),
                "msgType": "1,2,4"
            };
            GetJosns("FH_GetBind", s_where, "SelSW");
        }
        var str_choose = "";
        var str_stcds = "";
        var str_type = "";
        function OnClickTitle(SpanID, objID, objFax, objHNNM) {
            var rbList = [
                { id: 'Astronomicaltide', text: '天文潮' },
                { id: 'modeTide', text: '模型预报潮位' },
                { id: 'typhoon', text: '叠加台风风暴潮' },
                { id: 'temperatezone', text: '叠加温带风暴潮' },
                { id: 'zengshuixianxing', text: '增水线型插值' },
                { id: 'zengshuixiangsitf', text: '相似台风' },
            ];

            if (objHNNM == "江浙边界") {
                rbList = [
                    { id: 'bjshuiweixianxing', text: '水位线型插值' },
                ]
            }
            mini.get("RbRainSW").setData(rbList);

            str_type = objHNNM;
            var only = $(".onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $("#gcUL li span").css({ "backgroundColor": "#FFFFFF", "color": "#0079F5" });
            if (SpanID != objID) {
                $("#" + SpanID).css({ "backgroundColor": "#3291F9", "color": "#FFFFFF" });
            }
            str_stcds = $("#" + SpanID).attr("name");
            gc_choose(str_stcds);
        }
        function gc_choose(str_stcds) {
            str_choose = str_stcds;
            //获取表格表头
            var dataResult = $.data(myData, "gridSWData");
            var dataResultColumns = $.data(myData, "gridSWColumns").columns;
            var Columns = dataResultColumns.filter(function (item) {
                return str_choose.indexOf(item.field.toString()) > -1 || item.field.toString() == "TM";
            });
            var bjswStcd = "1728053248,1728053250,1728053251,1728053252";
            for (var num = 0; num < Columns.length; num++) {
                if ((Columns[num].field != "TM" && bjswStcd.indexOf(Columns[num].field) == -1)) {
                    if (str.indexOf(Columns[num].field) == -1) {
                        var html = '<span class="icon-tip" style="width:20px;height: 15px;display:inline-block;cursor:pointer;" title="查看预报潮位" id="ZD' + Columns[num].field + '" onclick="ontransFangAn(\'' + Columns[num].field + '\',\'' + Columns[num].header + '\')"></span>';
                        Columns[num].header = Columns[num].header + html;
                    }
                    str += Columns[num].field + ",";
                }
            }
            var hoverHtml = $(".onlyliHover").html();
            if (hoverHtml != "江浙边界") {
                var item = {
                    field: "action", header: "统一操作", headerAlign: "center", align: "center",
                    filter: {
                        "type": "textbox", "onValueChanged": "onFilterChangedQuanSW", "emptyText": "批量输入增水值"
                    },
                    //editor: { "type":"textbox","name":"","onValueChanged":"onValueChanged"}
                };
                Columns.push(item);
            }
            dataResultColumns.columns = Columns;
            gridSW.set(dataResultColumns);
            gridSW.setData(dataResult);
            mini.unmask(document.body);
        }
        var rbl = mini.get("RbRain");
        rbl.on("valuechanged", function (e) {
            onLoadDataJY();
        });

        //鼠标移动上去的提示信息。
        function ondrawcellJY(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务
            if (field == "TM") {

            } else if (field == "action") {
                var s = '<input id="fullValue" name=\'' + e.row.TM + '\' type="input" style="width:80px;height:20px;border:1px solid #8BA0BC;" onblur="onfulJY(\'' + e.row.TM + '\',this)"/> ';
                e.cellHtml = s;
            } else {
                var s = "";
                if (value != undefined) {
                    s = Number(value).toFixed(1);
                }
                e.cellHtml = s;
            }
        }
        function onvaluechangedJY(objID, type) {
            $(".onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '操作中，请稍等...'
            });
            GetJosns("updateJYYBBY", { ST: $.data(myData, "stime"), ET: $.data(myData, "etime"), SOLUTIONID: GetCookie('SOLUTIONID'), JYDATATYPE: type }, "UpdataInput");
        }
        function onfulJY(tm, obj) {
            var DayHour = mini.get("RbRain").getValue();
            var hms = new Date($.data(myData, "stime")).format("HH:mm:ss");
            tm = new Date(tm).format("yyyy-MM-dd HH:mm:ss");
            if (DayHour == "DAY") {
                tm = new Date(tm).format("yyyy-MM-dd") + " " + hms;
            }

            //alert(tm);
            var value = obj.value;
            if (isNaN(value)) {
                mini.alert("请输入数字！");
                return;
            }
            if (value == "") {
                return;
            }
            var columns = $.data(myData, "columns");
            var stcds = "";
            for (var num = 0; num < columns.length; num++) {
                var field = columns[num].field;
                if (field == "TM" || field == "action") {

                } else {
                    stcds += field + ",";
                }
            }
            if (stcds != "") {
                stcds = stcds.substring(0, stcds.length - 1);
            }
            var strXZ = mini.get("RbRain").getValue();
            var s_where = { "ZhanData": value, "DayHour": strXZ, "dd_id": GetCookie('SOLUTIONID'), "ZhanID": stcds, "TM": tm };
            GetJosns("update_byTM", s_where, "UpdataInput");
        }
        //累计
        function onDrawSummaryCellJY(e) {
