        function JsonColumnChart(strJson) {
            var arrZhan = $.data(myData, "ES_ZHANDIAN");
            var arr = strJson;
            var strNote = [];
            var item = { "name": "名称", "codename": "STNM", "tableV": "1", "isShow": true, "width": "30%" };
            strNote.push(item);
            item = { "name": "降雨量", "codename": "DRP", "tableV": "1", "isShow": true, "width": "30%" };
            strNote.push(item);

            var _XData = [];
            if (arr != null && arr != undefined) {
                for (var num = 0; num < arrZhan.length; num++) {
                    var totalJY = 0;
                    for (var h = 0; h < arr.length; h++) {
                        totalJY += parseFloat(arr[h][arrZhan[num]["id"]]);
                    }
                    var item = {
                        STNM: arrZhan[num]["title"], DRP: totalJY
                    };
                    _XData.push(item);
                }
                //绘制过程线颜色设置
                var LineColor = ['#3398DB', '#FF0000', '#00FF00', '#FFA500'];
                //绘制图形
                chartYL("JY_charts", _XData, strNote, LineColor, "雨量");
                chartYL("bigJY_charts", _XData, strNote, LineColor, "雨量");
            }
        }

        function ondrawcell(e) {
            var record = e.record;
            if (e.field == "maxtm" || e.field == "mintm") {
                if (e.value != undefined) {
                    e.cellHtml = new Date(new Date(e.value)).format("MM-dd HH:mm");
                }
            }
            if (e.field == "maxz" || e.field == "minz") {
                if (e.value != null && e.value != "") {
                    e.cellHtml = parseFloat(e.value).toFixed(2);
                } else {
                    e.cellHtml = "-";
                }
            }
            if (e.field == "maxz") {
                //超警、超保
                try {
                    var wrz = parseFloat(record.WRZ).toFixed(2);
                    var grz = parseFloat(record.GRZ).toFixed(2);
                    if (e.value >= wrz&&wrz>0) {
                        e.cellStyle = "color:#FFA500;";
                    }
                    if (e.value >= grz&&grz>0) {
                        e.cellStyle = "color:red;";
                    }
                } catch (e) {
                }
            }
            if (e.field == "wrz") {
                if (e.value != null && e.value != "") {
                    e.cellHtml = parseFloat(e.value).toFixed(2);
                } else {
                    e.cellHtml = "-";
                }
            }

            if (e.field == "durw") {
                if (e.value == null || e.value == "" || e.value == 0) {
                    e.cellHtml = "-";
                } else {
                    e.cellHtml = (e.value / 12).toFixed(1);
                }
            }
            if (e.field == "stnm") {
                var s = "<a title=\"" + e.value + "\" onclick=\"tans('" + e.value + "','" + record.stcd + "')\" style='cursor:pointer;'>" + e.value + "</a>";
                e.cellHtml = s;
            }
            if (e.field == "xzdz") {
                var s = e.value;
                if (e.value == 0) {
                    s = "-";
                }
                e.cellHtml = s;
            }
        }

        var nodeschecked = [];
        function JosnSel(data, typeID) {
            if (typeID == "MODE_DD_SOLUTIONSel") {
                fa_arr = data.data;
				fa_arr.sort((a,b)=>{
					return new Date(b.dd_TM).getTime() - new Date(a.dd_TM).getTime();
				})
                mini.get("DD_ID").setData(fa_arr);
                mini.get("DD_ID").select(0);

                $("#DD_NAME").html(fa_arr[0].dd_NAME);
                $("#DD_TM").html(new Date(new Date(fa_arr[0].dd_TM)).format("yyyy-MM-dd HH:mm:ss"));
                $("#DD_NOTE").html(fa_arr[0].dd_NOTE);
                $("#DD_STANA").html(fa_arr[0].dd_STANA);
                $("#DD_CHECKBY").html(new Date(new Date(fa_arr[0].dd_CHECKBY)).format("yyyy-MM-dd HH:mm:ss"));
                $("#ZU_ID").html(fa_arr[0].dd_MIND);
                var etm = new Date(new Date($("#DD_TM").html()).addDate('h', parseInt(fa_arr[0].dd_STANA))).format("yyyy-MM-dd HH:mm:ss");
                $("#DD_ETM").html(etm);
                onLoadAllData();
            } else if (typeID == "MODE_ES_JISUANZHANSel") {
                var dataTemp = data.data.filter(function (item) {
                    return "1" == item.type;
                });
                tree.setData(dataTemp);
                var stcds = "";
                var stnms = "";
                for (var i = 0; i < dataTemp.length; i++) {
                    if (i < 9) {
                        nodeschecked.push(dataTemp[i]);
                    }
                    if (dataTemp[i].stcd != undefined && dataTemp[i].stcd != "" && dataTemp[i].stcd != null) {
                        stcds += dataTemp[i].stcd + ",";
                        stnms += dataTemp[i].name + ",";
                    }
                }
                tree.checkNodes(nodeschecked);
                if (stcds != "") {
                    stcds = stcds.substring(0, stcds.length - 1);
                }
                if (stnms != "") {
                    stnms = stnms.substring(0, stnms.length - 1);
                }
                $.data(myData, "STCDS", stcds);
                $.data(myData, "STNMS", stnms);
                var strParam = { "solutionid": DD_ID, "stcd": stcds, "data_TYPE": "1" };
                //GetJosns("WJ_MODELSINGRESULT", strParam, "WJ_MODELSINGRESULT");
				app.post("SWZZ_MODE_BDMS_PREDICT/WJ_MODELSINGRESULT",strParam,(data)=>{
					JosnSel(data,"WJ_MODELSINGRESULT")
				})

                strParam = {
                    "plan_n": DD_ID, "stcd": stcds, "data_TYPE": "1", "startdate": $("#DD_TM").html(),
                    "enddate": $("#DD_ETM").html()
                };
                //GetJosns("MODE_BDMS_PREDICTSelMORE", strParam, "MODE_BDMS_PREDICTSelMORE");
				app.post("SWZZ_MODE_BDMS_PREDICT/MODE_BDMS_PREDICTSelMORE",strParam,(data)=>{
					JosnSel(data,"MODE_BDMS_PREDICTSelMORE")
				})

            }else if (typeID == "WJ_MODELSINGRESULT") {
                grid1.setData(data.data);
                //grid1.sortBy("HNNMBK", "asc");
                //grid1.mergeColumns(["HNNMBK", "company"]);
            } else if (typeID == "MODE_BDMS_PREDICTSelMORE") {
                $.data(myData, "daibiaozhanData", data.data);
                daibiaozhan(data.data);
                mini.unmask(document.body);
            } else if (typeID == "JIANGYU") {
                var dataResult = data.data;
				console.log(dataResult)
                if (dataResult != [] && dataResult != null) {
                    //绘制图形
                    JsonColumnChart(dataResult);
                }
            }
            else if (typeID == "MODE_ES_ZHANDIANSel") {
                $.data(myData, "ES_ZHANDIAN", data.data);
            }
            else if (typeID == "MODE_ES_ZHANDIANDATASel") {

        const hexToRgba = (hex, opacity) => {
            let rgbaColor = "";
            let reg = /^#[\da-f]{6}$/i;
            if (reg.test(hex)) {
                rgbaColor = `rgba(${parseInt("0x" + hex.slice(1, 3))},${parseInt(
                    "0x" + hex.slice(3, 5)
                )},${parseInt("0x" + hex.slice(5, 7))},${opacity})`;
            }
            return rgbaColor;
        }

                            chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: '25%',
                                label: {
                                    normal: {
                                        show: true,
                                        position: 'top'
                                    }
                                },
                                smooth: true
                                //		           itemStyle: {normal: {
                                //          	areaStyle: {type: 'default'},
                                //				//颜色渐变设置
                                //          	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //          		offset:0,
                                //          		color:'#050AE8'
                                //          	},{
                                //          		offset:1,
                                //          		color:'#8688F4'
                                //          	}])
                                //          }},
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
            myChart.on('click', function (param) {
                var name = param.name;
                WindowsOpen("./DanZhan/YBYQBar.html?stnm=" + (name) + "&DD_ID=" + DD_ID, name, "1100@600");
            });
        }
