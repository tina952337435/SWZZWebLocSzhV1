<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>多方案双屏对比分析</title>
    <script src="../Common/Scripts/echarts.min.js"></script>
    <script src="../Common/Scripts/ChartJs.js"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            /*overflow: hidden;*/
            font-size: 14px;
        }
        .mini-panel-border{
            border:0px !important;
        }
    </style>
</head>
<body>
        <div class="divStyle" style="width: 17%;background: #ffffff;height:100%;float:left;">
            <div style="width: calc(100% - 10px);margin-top: 5px;margin-left: 5px;height: calc(100% - 10px);background: #ffffff;border: #ddd 1px solid !important;">
                <div style="height:40px;line-height:40px;font-size:15px;">&nbsp;&nbsp;&nbsp;方案列表：</div> 
                <ul id="tree1" class="mini-tree" style="width:100%;height:100%;padding:5px;"
                    showTreeIcon="true" textField="DD_NAME" idField="DD_ID"  expandOnNodeClick="true"
                    resultastree="false" showCheckBox="true" checkRecursive="true"
                    allowSelect="false" enableHotTrack="false" onnodecheck="onNodeCheck"></ul>

            </div>
        </div>
        <div class="divStyle" style="width: calc(83% - 10px);background: #ffffff;float:left;">
            <table class="tableALL" style="width: calc(100% - 10px);text-align: center;margin-top: 5px;margin-left:5px;border-color: #333;border-collapse: collapse;" border="1" cellspacing="0" cellpadding="0">
                <tr height="40" style="font-weight: bold;">
                    <td colspan="2" style="width:100px;">方案名称</td>
                    <td><span id="leftName"></span></td>
                    <td><span id="rightName"></span></td>
                </tr>
                <tr height="40" style="font-weight: bold;">
                    <td colspan="2">起算时间</td>
                    <td><span id="leftTM"></span></td>
                    <td><span id="rightTM"></span></td>
                </tr>
                <tr height="300" id="tdSWCJ">
                    <td colspan="2" style="font-weight: bold;">预报河道水位</td>
                    <td style="width: 45%;" id="SWCJLEFT"><div id="divLEFTHDSW" style="height: 280px;margin-top: 20px;"></div></td>
                    <td style="width: 45%;" id="SWCJRIGHT"><div id="divRIGHTHDSW" style="height: 280px;margin-top: 20px;"></div></td>
                </tr>
                
                <tr height="300" id="tdSWCJ">
                    <td colspan="2" style="font-weight: bold;">代表站预报水位统计</td>
                    <td style="width: 40%;height: 300px;">
                        <div id="gridHD1" class="mini-datagrid" style="float:left;margin-left: 5px;width: calc(100% - 10px);height: calc(100% - 30px);" 
                             allowAlternating="true" showPager="false" idField="id" allowCellEdit="true" allowCellSelect="true" editNextOnEnterKey="true" 
                             editNextRowCell="true" navEditMode="true">
                            <div property="columns">
                                <div type="indexcolumn" headerAlign="center" width="40">序号</div>
                                <div field="STNM" headerAlign="center" align="center" width="120">站名</div>
                                <div field="MAXZ" allowSort="false" align="center" headerAlign="center">最高水位(m)</div>
                                <div field="MAXTM" allowSort="false" align="center" headerAlign="center"  renderer="onTMRenderer">时间</div>
                            </div>
                        </div>
                    </td>
                    <td style="width: 40%;height: 300px;">
                        <div id="gridHD2" class="mini-datagrid" style="float:left;margin-left: 5px;width: calc(100% - 10px);height: calc(100% - 30px);" 
                             allowAlternating="true" showPager="false" idField="id" allowCellEdit="true" allowCellSelect="true" editNextOnEnterKey="true" 
                             editNextRowCell="true" navEditMode="true">
                            <div property="columns">
                                <div type="indexcolumn" headerAlign="center" width="40">序号</div>
                                <div field="STNM" headerAlign="center" align="center" width="120">站名</div>
                                <div field="MAXZ" allowSort="false" align="center" headerAlign="center">最高水位(m)</div>
                                <div field="MAXTM" allowSort="false" align="center" headerAlign="center"  renderer="onTMRenderer">时间</div>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr height="300">
                    <td colspan="2" style="font-weight: bold;">预报水位超警</td>
                    <td style="width: 45%;" id="SWCJLEFT1"><div id="divLEFTSW" style="height: 280px;margin-top: 20px;"></div></td>
                    <td style="width: 45%;" id="SWCJLEFT2"><div id="divRIGHTSW" style="height: 280px;margin-top: 20px;"></div></td>
                </tr>
                
            </table>
        </div>

    <script>
        mini.parse();
        var tree = mini.get("tree1");
        $(function () {
            GetJosns("MODE_DD_SOLUTIONSel", { "DD_STATUS": "1" }, "Sel");
        });
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                tree.setData(data.data);
                var nodeschecked = [];
                for (var i = 0; i < 2; i++) {
                    nodeschecked.push(data.data[i]);
                }
                tree.checkNodes(nodeschecked);
                daibiaozhan();
            }
            else if (typeID == "WJ_MODELSINGRESULT") {
                onLoadAllDataHtml(data.data);
            }
        }
        function onNodeCheck(e) {
            var tree = e.sender;
            var node = e.node;
            var value = tree.getValue(true);
            var cnodes = tree.getCheckedNodes(false);
            nodeschecked = cnodes;
            if (cnodes.length >2) {
                tree.uncheckNode(cnodes[cnodes.length-1]);
                mini.alert("最多只能选中两个方案进行对比！");
            }
            else if (cnodes.length == 2) {
                daibiaozhan();
            }
        }
        function daibiaozhan() {
            var value = tree.getValue(true);
            var data = tree.getCheckedNodes(true);
            document.getElementById('leftName').innerHTML = data[0].DD_NAME;
            var DD_TM = mini.formatDate(convertToDate(data[0].DD_TM), 'yyyy年M月d日H时');
            document.getElementById('leftTM').innerHTML = DD_TM;
            document.getElementById('rightName').innerHTML = data[1].DD_NAME;
            DD_TM = mini.formatDate(convertToDate(data[1].DD_TM), 'yyyy年M月d日H时')
            document.getElementById('rightTM').innerHTML =DD_TM;
            //重要代表站
            onLoadAllData();
            //水位超警站点统计

        }
        function onLoadAllData() {
            var value = tree.getValue(true);
            var strParam = { "SOLUTIONID": value, "DATA_TYPE": "1" };
            GetJosns("WJ_MODELSINGRESULT", strParam, "WJ_MODELSINGRESULT");
        }
        function onLoadAllDataHtml(data) {
            var arr = tree.getCheckedNodes(true);
            for (var num = 0; num < arr.length; num++) {
                var dataTemp = data.filter(function (e) {
                    return e.SOLUTIONID == arr[num].DD_ID;
                });
                var WARCount = 0, ZCCount = 0;
                for (var _index = 0; _index < dataTemp.length; _index++) {
                    var WRZ = dataTemp[_index].WRZ;
                    var MAXZ = dataTemp[_index].MAXZ;
                    if (WRZ != undefined) {
                        if (MAXZ > MAXZ) {
                            WARCount++;
                        } else {
                            ZCCount++;
                        }
                    } else {
                        ZCCount++;
                    }
                    
                }

                var grid = mini.get("gridHD" + (num + 1));
                grid.setData(dataTemp);

                var LineColor = ['blue', 'orange', 'red',];

                var strNote = '[';
                strNote += '{"name": "正常(' + ZCCount + ')","codename": "text1","tableV":"1","isShow":true,"width":"30%","tableColor":"' + LineColor[0] + '"}';
                strNote += ',{"name": "超警(' + WARCount + ')","codename": "text2","tableV":"1","isShow":true,"width":"30%","tableColor":"' + LineColor[1] + '"}';
                strNote += ']';
                var xData = [];
                xData.push({ "text1": ZCCount, "text2": WARCount })
                PieChart("SWCJLEFT" + (num + 1), xData, eval('(' + strNote + ')'), LineColor, "水质(mg/l)");
            }
        }
        function onTMRenderer(e) {
            var value = e.value;
            if (!value) {
                return;
            }
            if (value !== "")
                return mini.formatDate(new Date(convertToDate(value)), 'yyyy-MM-dd HH:mm');
            return "";
        }
        function PieChart(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var chartName = []; 	//控件元素名称
            var chartColor = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                chartColor.push(value.tableColor);
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                        //chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });

            option = {
                tooltip: {
                    trigger: 'item',
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    formatter: "{a} <br/>{b}: {c} ({d}%)"
                },
                legend: {
                    orient: 'vertical',
                    x: 'right',
                    right: '0',
                    data: chartName
                },
                color: chartColor,
                series: function () {
                    var serie = [];
                    var temValue = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            //chartValue.push(changeTwoDecimal(m[i][j], 0)); //循环价值
                            chartValue.push(m[i][j]);
                        }
                        temValue.push({ "name": chartName[j], "value": chartValue })
                    }

                    var item = {
                        name: "水质",
                        type: 'pie',
                        data: temValue,
                        center: ['35%', '50%'],
                        radius: ['50%', '80%'],
                        avoidLabelOverlap: false,
                        label: {
                            normal: {
                                show: false,
                                position: 'center'
                            },
                            emphasis: {
                                show: true,
                                textStyle: {
                                    fontSize: '30',
                                    fontWeight: 'bold'
                                }
                            }
                        },
                        labelLine: {
                            normal: {
                                show: false
                            }
                        }
                    }
                    serie.push(item);
                    return serie;
                }()
            };

            myChart.setOption(option);
            myChart.on("click", eConsole);
        }
    </script>
</body>
</html>
