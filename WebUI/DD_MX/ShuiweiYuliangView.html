<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../Common/jquery.min.js"></script><!--高版本下拉框无法使用-->
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            font-size: 14px;
            background-color: #fff;
        }
    </style>
</head>
<body>
    <div class="mini-toolbar">
        历史演算方案：<input id="DD_ID" name="DD_ID" class="mini-combobox" style="width:280px;" textField="DD_NAME" valueField="DD_ID" allowInput="true" onvaluechanged="onvaluechangedTM" />
    </div>
    <div id="tabs1" class="mini-tabs" activeIndex="0" style="width:100%;height:calc(100% - 50px);" plain="false">
        <div title="预报潮位水位">
            <div class="mini-toolbar">
                &nbsp;&nbsp; <a class="mini-button" id="addbtn" onclick="Exp('潮位')" plain="false">导出</a>
            </div>
            <div id="gridSW" class="mini-datagrid" style="width: 100%; height:calc(100% -40px);" ondrawcell="ondrawcell"
                 allowalternating="true" allowcellselect="true" allowcelledit="true" showpager="false"
                 showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="false" showFilterRow="false"
                 showSummaryRow="true" cellEditAction="celldblclick">
            </div>
        </div>
        <div title="水利片降雨" iconCls="icon-cut">
            <div class="mini-toolbar">
                &nbsp;&nbsp; <a class="mini-button" id="addbtn" onclick="Exp('雨量')" plain="false">导出</a>
            </div>
            <div id="gridJY" class="mini-datagrid" style="width: 100%; height:calc(100% -40px);" ondrawcell="ondrawcell"
                 allowalternating="true" allowcellselect="true" allowcelledit="true" showpager="false"
                 showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="false" showFilterRow="false"
                 showSummaryRow="true" cellEditAction="celldblclick">
            </div>
        </div>
    </div>

    <script>
        mini.parse();
        var myData = [];
        var grid = mini.get("gridSW");
        var gridJY = mini.get("gridJY");
        $(function () {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            GetJosns("MODE_DD_SOLUTIONSel", {}, "MODE_DD_SOLUTIONSel");
        });
        function JosnSel(data, typeID) {
            if (typeID == "MODE_DD_SOLUTIONSel") {
                var dataNew = data.data;
                var item = {DD_ID:"0",DD_NAME:"初始条件"};
                dataNew.unshift(item);
                mini.get("DD_ID").setData(data.data);
                mini.get("DD_ID").select(0);
                onLoadAllData();
            }
            else if (typeID == "GridColum") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridSWColumns", dataResult);
                onLoadData();
            }
            else if (typeID == "Sel") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridSWData", dataResult);
                //gc_choose(str_choose);
                var dataResultColumns = $.data(myData, "gridSWColumns");
                grid.set(dataResultColumns);
                grid.setData(dataResult);
                mini.unmask(document.body);
            }
            else if (typeID == "GridColumJY") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridJYColumns", dataResult);
                onLoadDataJY();
            } else if (typeID == "SelJY") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridJYData", dataResult);
                var dataResultColumns = $.data(myData, "gridJYColumns");
                gridJY.set(dataResultColumns);
                gridJY.setData(dataResult);
                //mini.unmask(document.body);
            }
        }
        function onLoadAllData() {
            //潮位
            GridColum();
            //雨量
            GridColumJY();
        }
        function GridColum() {
            GetJosns("FH_JosnHtml_ShuiWei", {}, "GridColum");
        }
        function onLoadData() {
            var s_where = { "stime": $.data(myData, "stime"), "etime": $.data(myData, "etime"), "msgType": "1,2,4", solutionid: mini.get("DD_ID").getValue() };
            GetJosns("FH_GetBind", s_where, "Sel");
        }
        function GridColumJY() {
            GetJosns("FH_JosnHtml_JiangYu", {}, "GridColumJY");
        }
        function onLoadDataJY() {
            var s_where = {
                "stime": $.data(myData, "stime"), "etime": $.data(myData, "etime"), "msgType": "0", "DayHour": "HOUR",solutionid: mini.get("DD_ID").getValue()
            };
            GetJosns("FH_GetBind", s_where, "SelJY");
        }

        function onvaluechangedTM(e) {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            onLoadAllData();
        }

        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            if (field == "action") {
                var s = '<input id="fullValue" name=\'' + e.row.TM + '\' type="input" style="width:80px;height:20px;border:1px solid #8BA0BC;" onblur="onfull(\'' + e.row.TM + '\',this)"/> ';
                e.cellHtml = s;
            }
        }

        function Exp(type) {
            var data = [];
            var columns = [];
            var name = "";
            if (type == "潮位") {
                data = grid.data;
                columns = grid.columns;
                name = "边界潮位";
            } else {
                data = gridJY.data;
                columns = gridJY.columns;
                name = "分区降雨量";
            }
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
