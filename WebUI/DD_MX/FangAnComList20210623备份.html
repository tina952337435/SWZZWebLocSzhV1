<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <title>调度方案对比</title>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-size:14px;
        }
        .switch {
            cursor:pointer;
        }
        .lie2 {
            width: 90%;
        }
    </style>
</head>
<body>
    <div style="width: 100%; height: 80px; border: solid 1px #509EE2;display:none;">
        <table cellspacing='0' cellpadding='2' rules='all' border='1' id='GridView1' width="100%" style='background-color:White;border:#dedede 1px solid;width:100%;border-collapse:collapse;'>
            <tr>
                <td class="lie1" align="right">
                    名称：
                </td>
                <td class="lie2 View" id="NAME">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    描述：
                </td>
                <td class="lie2 View" id="NOTE">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <div>
        <div style="
                    text-align:left;
                    width:100%;
                    line-height: 35px;
                    background-color: #FFF;
                    padding-left: 10px;
                    color: black;
                    font-size:16px;
                    ">
            &nbsp;<span style="width: 5px;height: 17px;margin-top: 9px;background-color: #0C52C4;vertical-align: top;display: inline-block;">&nbsp;</span>&nbsp;
            断面方案对比分析
        </div>
    </div>

    <div style="height:520px;width:100%;">
        <div style="width:15%;float:left;border: solid 1px #e8e8e8; margin-top:5px;margin-left:5px;height:500px;">
            <div style="margin-bottom:5px; margin-top:5px; ">
                <label>名称：</label>
                <input id="key" class="mini-textbox" style="width:120px;" onenter="onKeyEnter" />
                <a class="mini-button" style="width:60px;" onclick="btnSearch()">查询</a>
            </div>

            <ul id="tree1" class="mini-tree" style="width:100%;padding:5px;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);"
                showTreeIcon="true" textField="NAME" idField="STCD" onNodeClick="onNodeClick"
                expandOnLoad="true"></ul>
        </div>
        <div style="width:84%;float:left;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);">
            <div id="fit1" class="fit">
                <div id="divChart" style="height:500px;width:99.5%;">
                </div>
                <div id="divHide" style="line-height:100px;font-size:28px; text-align:center;height:800px;width:99.5%; position: absolute;top: 45px;left: 295px;background: #FFFFFF;z-index: 99;display:none;">暂无数据</div>
            </div>
            <div id="fit2" class="fit" style="height:100%;display:none;">
                <div id="grid1" class="mini-datagrid" style="width: 99%; height: -webkit-calc(100% - 470px);height: -moz-calc(100% - 470px);height: calc(100% - 470px);margin: auto;margin-top:10px;" sizeList="[15,20,30,50]" pageSize="15"
                     idfield="STCD" allowresize="false" allowalternating="true" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" allowHeaderWrap="true"
                     sortmode="client">
                </div>
            </div>

        </div>
    </div>
    <div style="
                    text-align:left;
                    width:100%;
                    line-height: 35px;
                    background-color: #FFF;
                    padding-left: 10px;
                    color: black;
                    font-size:16px;
                    ">
        &nbsp;<span style="width: 5px;height: 17px;margin-top: 9px;background-color: #0C52C4;vertical-align: top;display: inline-block;">&nbsp;</span>&nbsp;
        双屏方案对比分析(河道水位)
    </div>
    <div style="height:800px;">
        <iframe id="myIframe" height="100%" width="100%" frameborder="0" scrolling="no"></iframe>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var grid = mini.get("grid1");
        var tree = mini.get("tree1");
        $(function () {

            //$("#fit2").hide();
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var stime = GetQueryString("stime");
            var etime = GetQueryString("etime");
            var key = GetQueryString("key");
            var _ID = GetQueryString("ID");
            var _type = GetQueryString("type");
            $.data(myData, "STIME", stime);
            $.data(myData, "ETIME", etime);
            $.data(myData, "KEY", key);
            $.data(myData, "ID", _ID);
            $.data(myData, "type", _type);

            $("#myIframe").attr("src", "DoubleScreen.html?ID=" + _ID);

            GetJosns("JISUANZHAN", {}, "tree");
            GetJosns("MODE_SCHEME_TYPESel", { "ID": _ID }, "SCHEME_TYPE");
        })
        function gridLoad() {
            var jsonarray = $.data(myData, "gridColumn");
            var jsonData = $.data(myData, "gridData");

            var ColoumnsName = [];
            ColoumnsName.push({ field: "TM", header: "时间", headerAlign: 'center', align: 'center', autoescape: true, width: 60 });
            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            if (jsonarray.length > 0) {
                for (num = 0; num < jsonarray.length; num++) {
                    var field = jsonarray[num].STCD;
                    var name = jsonarray[num].STNM;
                    var width = 120;
                    if (jsonarray[num].STCD != "VALUE") {
                        width = 120;
                        name = "<a onclick='lookFangAn(\"" + field + "\")' href='javascript:void(0)'  style='text-decoration:underline;color:black;'>" + name + "</a>";
                    }
                    else {
                        width = 40;
                    }
                    if (field.indexOf("DRP") == -1) {
                        if ($.data(myData, "DATA_TYPE") == "2") {
                            if (jsonarray[num].STCD == "VALUE") {
                            } else {
                                ColoumnsName.push({ field: field, header: name, headerAlign: 'center', align: 'center', autoescape: true, width: width });
                                strNote += ',{"name": "' + jsonarray[num].STNM + '","codename": "' + field + '","tableV":"1","isShow":true,"width":"30%"}';
                            }
                        } else {
                            ColoumnsName.push({ field: field, header: name, headerAlign: 'center', align: 'center', autoescape: true, width: width });
                            strNote += ',{"name": "' + jsonarray[num].STNM + '","codename": "' + field + '","tableV":"1","isShow":true,"width":"30%"}';
                        }
                    }
                }
            }
            strNote += ']';
            //绘制过程线颜色设置
            var LineColor = ['#8B658B', '#FFA500', '#FF0000', "#6959CD", "#E066FF", "#FF34B3", "#F4A460",
                "#EEAD0E", "#53868B", "#79CDCD", "#66CDAA", "#43CD80", "#00FF00", "#FFFF00", , "#FF00FF", "#8B0000", "#8B008B", "#008B8B", "#90EE90"];
            //绘制图形
            $.data(myData, "gridData", jsonData)
            if ($.data(myData, "DATA_TYPE") == "1") {
                chartSW("divChart", jsonData.data, eval('(' + strNote + ')'), LineColor, "水位(m)");
            } else {
                chartSW("divChart", jsonData.data, eval('(' + strNote + ')'), LineColor, "流量(m³/s)");
            }
            grid.set({ columns: ColoumnsName });
            fillData(0, grid.getPageSize(), jsonData, grid);
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var aggList = data.data.split('@');
                if (aggList[1] == "") {
                    //$("#divChart").html("<div style=\"line-height:100px;font-size:28px; text-align:center;\">暂无数据</div>");
                    $("#divHide").css("display", "block");

                } else if (aggList[0] != "") {
                    $("#divHide").css("display", "none");
                    var jsonarray = eval('(' + aggList[0] + ')');
                    var jsonData = eval('(' + aggList[1] + ')');
                    $.data(myData, "gridColumn", jsonarray);
                    $.data(myData, "gridData", jsonData);
                    gridLoad();
                } else {
                    $("#divHide").css("display", "block");
                    //$("#divChart").html("<div style=\"line-height:100px;font-size:28px; text-align:center;\">暂无数据</div>");
                }
                mini.unmask(document.body);

            } else if (typeID == "SCHEME_TYPE") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
                    FromSetinnerHTML(o, "View");
                }
            } else if (typeID == "tree") {
                var result = data.data;
                //var tempData = [];
                //if (result.length > 0) {
                //    tempData.push({ id: "SW", text: "水位" });
                //    tempData.push({ id: "LL", text: "流量" });
                //    tempData.push({ id: "XL", text: "蓄水量" });
                //    for (num = 0; num < result.length; num++) {
                //        var TYPE = result[num].TYPE;
                //        if (TYPE == "1") {
                //            tempData.push({ id: result[num].ID, text: result[num].NAME, STCD: result[num].STCD, pid: "SW" });
                //        } else if (TYPE == "2") {
                //            tempData.push({ id: result[num].ID, text: result[num].NAME, STCD: result[num].STCD, pid: "LL" });
                //        } else if (TYPE == "15") {
                //            tempData.push({ id: result[num].ID, text: result[num].NAME, STCD: result[num].STCD, pid: "XL" });
                //        }
                //    }
                //}
                //console.error(result);
                tree.loadList(result, "ID", "PID");
                tree.select(1);
                search();
            }
        }


        //分页
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, $.data(myData, "gridData"), grid);
        });

        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            $(".fit").hide();
            $("#" + objFit).show();
            gridLoad();
        }
        function onNodeClick(e) {
            var tree = e.sender;
            var node = e.node;
            var isLeaf = tree.isLeaf(node);
            if (isLeaf == false) {
                e.cancel = true;
            } else {
                mini.mask({
                    el: document.body,
                    cls: 'mini-mask-loading',
                    html: '加载中...'
                });
                search();
            }
        }
        function search() {
            var node = tree.getSelectedNode();
            $.data(myData, "DATA_TYPE", node.TYPE)
            var strParam = {
                "DD_MIND": $.data(myData, "ID"),
                "STCD": node.STCD,
                "DATA_TYPE": node.TYPE
            };
            GetJosns("GetFangAnData", strParam, "Sel");
        }
        function btnSearch() {
            var key = mini.get("key").getValue();
            if (key == "") {
                tree.clearFilter();
            } else {
                key = key.toLowerCase();
                tree.filter(function (node) {
                    var text = node.text ? node.text.toLowerCase() : "";
                    if (text.indexOf(key) != -1) {
                        return true;
                    }
                });
            }
        }
        function onKeyEnter(e) {
            btnSearch();
        }
        function FanHui() {
            window.parent.addTab("多方案对比分析", "/DD_MX/DuoZhanFenXi.html?stime=" + $.data(myData, "STIME") + "&etime=" + $.data(myData, "ETIME") + "&key=" + $.data(myData, "KEY"), "", "多方案对比分析");
        }

        function lookFangAn(objID) {
            window.parent.OpenTab("fa-delicious", "调度方案成果展示", "/DD_MX/ResultsRelease.html?DD_ID=" + objID);
        }
    </script>
</body>
</html>
