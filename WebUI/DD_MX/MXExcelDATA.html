<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <link href="../Common/bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <link href="../Common/bootstrap-fileinput/css/fileinput.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html, body {
            font-family: "arial";
            -ms-overflow-style: scrollbar;
            overflow: hidden;
            width: 100%;
            height: 100%;
            min-width: 800px;
        }

        .Box {
            width: 100%;
            height: 100%;
        }

        .mini-button .mini-button-icon-text {
            background: rgb(29, 111, 2) !important;
            padding: 4px 10px 4px 10px !important;
        }

        .file-preview {
            border: 0px;
        }

        .btn-primary {
            background-color: #3291F9;
            border-color: #3291F9;
        }

        .btn-primary.active,
        .btn-primary:active,
        .btn-primary:active:hover,
        .btn-primary.focus,
        .btn-primary:focus,
        .btn-primary:hover {
            color: white;
            background-color: #007aff;
            border-color: #007aff;
        }

        .btn-file {
            margin-left: 17px;
        }

        .file-drop-zone-title {
            color: #aaa;
            font-size: 40px;
            padding: 25px 10px;
        }

        .file-preview-other {
            width: 60px !important;
            height: 60px !important;
        }

        .kv-upload-progress {
            display: none;
        }
        .file-input, .file-input-new{
            float:left;
            width:280px;
        }
    </style>
</head>
<body>
    <input id="URL" class="mini-hidden" />
    <input id="FileName" class="mini-hidden" />
    <input id="PDF" class="mini-hidden" />
    <div style="width:100%;">
        <div class="mini-toolbar">
            &nbsp;&nbsp;
            <div style="float:left;margin-top: 7px;">Excel文件上传：</div> 
            <input type="file" name="Fdata" id="Fdata" class="file-loading" data-show-preview="false"
                   data-show-upload="false" data-show-caption="true" accept=".xlsx,.xls"
                   data-allowed-file-extensions='["xlsx","xls"]' />
            &nbsp;&nbsp;&nbsp;工作表选择：
            <input id="Sheet" class="mini-combobox"
                   textfield="SheetName" valuefield="SheetID"
                   onValuechanged="onSheetChanged()" />
            <a id="A1" class="mini-button" onclick="saveExcel()">保存</a>
            &nbsp;&nbsp; <a class="mini-button" iconCls="icon-download" id="addbtn" onclick="hrefOpen()" plain="false" style="background:#1D6F02;">&nbsp;&nbsp;降雨Excel导入模板下载</a>
        </div>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);" allowalternating="true"
         borderstyle="border-right:0;" idfield="ID" sortmode="client" showPager="false" ondrawcell="ondrawcell" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
    </div>

    <script src="../Common/bootstrap-fileinput/js/fileinput.min.js" type="text/javascript"></script>
    <script src="../Common/bootstrap-fileinput/js/fileinput_locale_zh.js" type="text/javascript" charset="utf-8"></script>
    <script>
        var myData = [];
        var FileInput = function () {
            var oFile = new Object();

            //初始化fileinput控件（第一次初始化）
            oFile.Init = function (ctrlName, uploadUrl) {
                var control = $('#' + ctrlName);
                //初始化上传控件的样式
                control.fileinput({
                    language: 'zh', //设置语言
                    uploadUrl: uploadUrl, //上传的地址
                    allowedFileExtensions: ['xlsx', 'xls'], //接收的文件后缀
                    showClose: false,
                    showUpload: false, //是否显示上传按钮
                    showRemove: false, //是否显示删除按钮
                    showCaption: false, //是否显示标题
                    showUploadedThumbs: false,
                    browseClass: "btn btn-primary", //按钮样式
                    textEncoding: "UTF-8",
                    dropZoneEnabled: true, //是否显示拖拽区域
                    //minImageWidth: 50, //图片的最小宽度
                    //minImageHeight: 50,//图片的最小高度
                    //maxImageWidth: 1000,//图片的最大宽度
                    //maxImageHeight: 1000,//图片的最大高度
                    maxFileSize: 204800, //单位为kb，如果为0表示不限制文件大小
                    //minFileCount: 0,
                    maxFileCount: 100,
                    enctype: 'multipart/form-data',
                    validateInitialCount: true,
                    previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",

                    msgFilesTooMany: "选择上传的文件数量({n}) 超过允许的最大数值{m}！",
                    uploadExtraData: function (previewId, index) { //额外参数的关键点
                        var obj = {};
                        obj.saveUrl = "降雨";
                        obj.OFILES = ctrlName;
                        return obj;
                    }
                }).on('filebatchselected', function (event, data) {
                    mini.mask({
                        el: document.body,
                        cls: 'mini-mask-loading',
                        html: '数据上报中...'
                    });
                    $(this).fileinput("upload");
                });

                var FileResult = [];
                //导入文件上传完成之后的事件
                $("#Fdata").on("fileuploaded", function (event, data, previewId, index) {
                    var strJson = data.response.data;
                    $.data(myData, "FILEData", strJson[0]);

                    var item = eval(strJson[0].JSONDATA[0]["SheetData"]);
                    console.error(item);
                    $.data(myData, "SheetData", item);
                    grid.setData(item);
                    mini.unmask(document.body);
                });
            }
            return oFile;
        };
    </script>
    <script type="text/javascript">
        mini.parse();
        var grid = mini.get("grid1");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        var TYPE = "";
        var localDD_ID = GetQueryString("DD_ID");
        if (localDD_ID == null || localDD_ID == "") {
            localDD_ID = "0";
        }
        $(function () {
            var oFileInput = new FileInput();
            oFileInput.Init("Fdata", ServerIP + "/json/reply/MODEJYExcelJson");
            var strWhere = { "pattem":"0" };
            app.post("SWZZ_MODE_ES_ZHANDIAN/findResult", strWhere, function(res){
                JosnSel(res,"MODE_ES_ZHANDIANSel");
            });
        });

        function SetData(data) {
            //console.error(data);
            TYPE = data.ID;
        }

        var filename;
        function onUploadSuccess(e) {
            try {
                filename = e.serverData;
                var Jsonarray = eval(filename);
                var sheet = mini.get("Sheet");
                sheet.setData(Jsonarray[0].data);
                sheet.select(sheet.getData().length - 1);
                var data = eval(Jsonarray[0].jsonData);
                grid.setData(data);
                mini.get("URL").setValue(Jsonarray[0].URL);
                mini.get("FileName").setValue(Jsonarray[0].FileName);
                mini.get("PDF").setValue(Jsonarray[0].PDF);
                showTips("读取成功");
            } catch (ex) {
                showTips("读取失败！！！请重新尝试");
                grid.unmask();
            }
        }
        function onUploadError(e) {

        }
        function onFileSelect(e) {
            //alert("选择文件");
            grid.setData([]);
            grid.loading("文件读取中，请稍后......");
            shangchuan();
        }
        function shangchuan() {
            sc_state = "1";
            var fileupload = mini.get("fileupload1");
            fileupload.startUpload();
        }
        //读取Excel
        function readexcel() {
            var strWhere = {
                saveUrl: mini.get("URL").getValue(),
                SheetName: mini.get("Sheet").getText()
            }
            GetJosns("MODEJYExcelJson", strWhere, "Sel");
        }
        function JosnSel(text, typeID) {
            if (typeID == "Sel") {
                var data = eval(text.data);
                grid.setData(data);
            } else if (typeID == "Sava") {
                showTips(text.Message);
                if (text.Message == "操作成功") {
                    mini.unmask(document.body);
                } else {
                    showTips("入库出错、再次尝试入库");
                    PLAdd();
                }
                //关闭窗口
                CloseWindow("cancel");
            } else if (typeID == "ExportExcel") {
                window.location.href = ClientIP + "/UploadDoc/Result/" + text.data;
            } else if (typeID == "MODE_ES_ZHANDIANSel") {
                SelGridColumn(text.data);
            }
        }

        function SelGridColumn(data) {
            var columns = [];
            columns.push({ type: "indexcolumn", header: "序号", width: "40", headerAlign: "center", align: "center" });
            columns.push({ field: "tm", header: "时间", width: "150", headerAlign: "center", align: "center" });
            for (var num = 0; num < data.length; num++) {
                var item = { field: data[num].zhanid, header: data[num].zhanname, headerAlign: "center", align: "center" };
                columns.push(item);
            }
            grid.set({ columns: columns });
        }

        //鼠标移动上去的提示信息。
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务
            if (field == "STCD") {
                if (value != undefined && value != "" && value != null) {
                } else {
                    e.cellStyle = "background-color:#F88DF2;";
                }
            }
            //else if (field == "TM") {
            //    e.cellHtml = new Date((value)).format("yyyy/MM/dd");
            //}
        }
        //保存数据
        function saveExcel() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            PLAdd();
        }

        function PLAdd() {
            var dt = grid.getData();
            var strWhere = { "SOLUTIONID":localDD_ID, "LISTMODE": JSON.stringify(dt), username: GetCookie("LOGINNAME") };
            //console.error(JSON.stringify(dt));
            GetJosns("FH_JYDATAExelPL", strWhere, "Sava");
        }
        function onSheetChanged() {
            readexcel();
        }
        function hrefOpen() {
            //var strWhere = "";
            //strWhere += "'stime':'" + stime + "',";
            //strWhere += "'etime':'" + etime + "'";
            //根据目前得站点生成word模板
            //GetJosn("/DD_MX/MXExcelData.aspx/ExportExcel", strWhere, "ExportExcel");
            var strWhere = { STIME: stime, ETIME: etime };
            GetJosns("MODEJYExportExcel", strWhere, "ExportExcel");
        }
        function onTMRenderer(e) {
            var value = e.value;
            if (value) {
                return new Date(convertToDate(value)).format('yyyy/MM/dd');
            }
            else {
                return "";
            }
        }


        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
    </script>
</body>
</html>
