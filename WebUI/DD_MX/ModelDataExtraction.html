<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
                body {
                    margin: 0;
                    padding: 0;
                    border: 0;
                    width: 100%;
                    height: 100%;
                    font-size: 12px;
                    overflow: hidden;
                    background:#fff;
                }

                .uploader {
                    position: relative;
                    display: inline-block;
                    overflow: hidden;
                    cursor: default;
                    padding: 0;
                    margin: 10px 0px;
                    /*-moz-box-shadow:0px 0px 5px #ddd;
        -webkit-box-shadow:0px 0px 5px #ddd;*/
                    /*box-shadow:0px 0px 5px #ddd;*/
                    -moz-border-radius: 5px;
                    -webkit-border-radius: 5px;
                    border-radius: 5px;
                }

                .button {
                    float: left;
                    height: 32px;
                    display: inline-block;
                    outline: 0 none;
                    padding: 8px 12px;
                    margin: 0;
                    cursor: pointer;
                    border: 1px solid;
                    font: bold 9pt/100% Arial, Helvetica, sans-serif;
                    -moz-border-radius: 0px 5px 5px 0px;
                    -webkit-border-radius: 0px 5px 5px 0px;
                    border-radius: 0px 5px 5px 0px;
                    -moz-box-shadow: 0px 0px 1px #fff inset;
                    -webkit-box-shadow: 0px 0px 1px #fff inset;
                    box-shadow: 0px 0px 1px #fff inset;
                }
                /* Blue Color Scheme ------------------------ */

                .blue .button {
                    color: #fff;
                    text-shadow: 1px 1px 0px #09365f;
                    background: #064884;
                    background: -moz-linear-gradient(top, #3b75b4 0%, #064884 100%);
                    background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#3b75b4), color-stop(100%,#064884));
                    filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#3b75b4', endColorstr='#064884',GradientType=0);
                    border-color: #09365f;
                }

                .blue:hover .button {
                    background: #3b75b4;
                    background: -moz-linear-gradient(top, #064884 0%, #3b75b4 100%);
                    background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#064884), color-stop(100%,#3b75b4));
                    filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#064884', endColorstr='#3b75b4',GradientType=0);
                }

                #GridView tr td {
                    height: 60px;
                    line-height: 60px;
                }

                #dataLoad {
                    display: block;
                    width: 420px;
                    height: 120px;
                    position: absolute;
                    top: 0;
                    right: 0;
                    left: 0;
                    bottom: 0;
                    margin: auto;
                    z-index: 9999999999;
                    font-size: 12px;
                    opacity: 1;
                }

                table.gridtable {
                    font-family: verdana,arial,sans-serif;
                    font-size: 11px;
                    color: #333333;
                    border-width: 1px;
                    border-color: #797777;
                    border-collapse: collapse;
                }

                    table.gridtable th {
                        border-width: 1px;
                        padding: 8px;
                        border-style: solid;
                        border-color: #797777;
                        background-color: #dedede;
                    }

                    table.gridtable td {
                        border-width: 1px;
                        padding: 8px;
                        border-style: solid;
                        border-color: #797777;
                        background-color: #ffffff;
                    }
    </style>
</head>
<body>
    <div style="width:820px;padding: 5px 0px;margin:10px auto;">
        <div style="background:white;margin: 0px 5px;">
            <div align="center" style="line-height:80px; font-weight:bold; font-size:30px;">
                模型成果数据提取
            </div>
            <table id="GridView" align="center" width="700px">

                <tr>
                    <td align="right" valign="middle" width="40%" style="font-size: 14px; margin-top: 50px;">
                        方案名称：
                    </td>
                    <td align="left">
                        <input name="DD_NAME" type="text" id="DD_NAME" class="mini-textbox" required="true" style="width:550px" value="2019年03月21日方案" />
                    </td>
                </tr>

                <tr style="margin-top:150px;">
                    <td align="right" style="font-size: 14px;">
                        开始时间：
                    </td>
                    <td align="left" valign="middle" style="width:200px">
                        &nbsp;<input type="text" id="STIME" name="STIME" width="180" class="mini-datepicker" format="yyyy-MM-dd H:mm:ss" showclearbutton="true" timeformat="H:mm:ss" showokbutton="false" showtime="true" onvaluechanged="onvaluechangedTM" />&nbsp;&nbsp;
                    </td>
                </tr>
                <tr>
                    <td align="right" style="font-size: 14px;">
                        结束时间：
                    </td>
                    <td align="left">
                        &nbsp;<input type="text" id="ETIME" name="ETIME" width="180" class="mini-datepicker" format="yyyy-MM-dd H:mm:ss" showclearbutton="true" timeformat="H:mm:ss" showokbutton="false" showtime="true" />&nbsp;&nbsp;
                    </td>
                </tr>
                <!--<tr>
                    <td align="right" style="font-size: 14px;">模式：</td>
                    <td align="left">
                        <input type="radio" value="1" name="mxtype" checked="checked" />水量
                        <input type="radio" value="0" name="mxtype" />水质
                    </td>
                </tr>-->
            </table>
            <div align="center" style="line-height:80px; font-weight:bold; font-size:30px;">
                <span class="uploader blue">
                    <!--<input type="button" class="mini-button" value="提取成果数据" style="font-size: 14px;" onclick="ExtractionData()" />-->
                    <!--<a id="searchbtn" class="mini-button" onclick="ExtractionData()">提取成果数据</a>-->
                    <input value="提取成果数据" type="button" onclick="ExtractionData();" style="text-align: center; width: 150px;  font-weight: bold; font-size: 16px; height: 37px; color: #fff; cursor: pointer; background:#3c82f6; border: 0px; -webkit-border-radius: 6px; border-radius: 6px;"
                           class="jNicebtn_submit" />
                </span>
            </div>
            <!--<div align="center" style="color:red;font-size:14px;font-weight:bold;">
                注：模型成果数据提取，当起止时间小于3天，提取逐小时成果文件；当起止时间大于3天，提取逐日8点成果文件。
            </div>-->
        </div>
    </div>
    <div id="dataLoadMain" style="width:100%; height:100%;top :0px;background-color:red;text-align:center;position: absolute;z-index: 9999999999;  background: #fff; opacity: .75;display:none;">
        <div id="dataLoad">
            <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">
                <tr style="height: 100%">
                    <td style="height: 9px; padding: 9px; border: 0px;">
                        <div style="float: left; height: 30px; display: none" id="processDiv">
                            <div style="float: left; height: 40px;" id="pro_div">
                                <div style="width: 400px; height: 40px;  margin-top: 0px;color: rgb(54, 43, 54);border: 2px solid #517fad;background: rgb(242, 245, 247); border-radius: 30px; -moz-border-radius: 30px;-webkit-border-radius: 30px;">
                                    <div id="processbar" style="background-color: #90EE90; width: 1px; height: 36px;border-radius: 30px; -moz-border-radius: 30px;-webkit-border-radius: 30px;">
                                    </div>
                                </div>
                            </div>
                            <div style="float: left;line-height:40px;position:absolute;left:200px;" id="pv_div">
                                <span id="pbValue" style="">模型数据读取进度：0%</span>
                            </div>
                        </div>
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var DD_EVALUE = 1;
        $(function () {
            var strTM = new Date();
            mini.get("STIME").setValue(strTM.format("yyyy/MM/dd HH:00:00"));
            var eTM = strTM.addDate('d', 1);
            mini.get("ETIME").setValue(new Date(eTM).format("yyyy/MM/dd HH:00:00"));

            var stime = mini.get("ETIME").getFormValue();
            var dd_name = new Date(stime).format("yyyyMMddHH") + "水情预报(成果提取)";
            mini.get("DD_NAME").setValue(dd_name);
            

            $('input[type=radio][name=mxtype]').change(function () {
                var raValue = this.value;
                if (raValue == 0) {
                    ServerIP = ServerIP_SZ;
                    DD_EVALUE = 0;
                } else if (raValue == 1) {
                    ServerIP = ServerIP_SL;
                    DD_EVALUE = 1;
                }
            });
        });

        function ExtractionData() {
            $("#processbar").css("width", "0px");
            $("#pbValue").html("模型数据读取进度：0%");
            $("#dataLoadMain").css('display', 'block');
            $("#processDiv").css('display', 'block');
            GetJosns("WJ_GetToken", {}, "WJ_GetToken");
        }
        function JosnSel(data, typeID) {
            if (typeID == "DOWNLOADLOC") {
                if (data.PROCESS == "100") {
                    showTips("模型数据提取完毕");
                    //mini.unmask(document.body);
                    $("#dataLoadMain").css('display', 'none');
                    $("#processDiv").css('display', 'none');
                    //保存成果
                    onResultOk();
                } else {
                    $("#processbar").css("width", (Number(data.PROCESS) * 4).toFixed(0) + "px");
                    if (Number(data.PROCESS).toFixed(0) == "NaN") {
                        //$("#pbValue").html("模型服务不可调用了...");
                        //$("#pbValue").html("模型无成果数据...");

                        showTips("模型无成果数据");
                        $("#dataLoadMain").css('display', 'none');
                        $("#processDiv").css('display', 'none');
                        //continue;
                    }
                    else {
                        $("#pbValue").html("模型数据读取进度：" + Number(data.PROCESS).toFixed(0) + "%");

                        var stime = mini.get("STIME").getFormValue();
                        var etime = mini.get("ETIME").getFormValue();
                        var tm = convertToDate(data.TM).addDate('h', 1);
                        var strWhere = { "STIME": stime, "ETIME": etime, "TM": new Date(tm).format("yyyy-MM-dd HH:mm:ss") };
                        GetJosns("DOWNLOADLOC", strWhere, "DOWNLOADLOC");
                    }
                    
                }
            }
            else if (typeID == "WJ_GetToken") {
                if (data.data = "1") {
                    var stime = mini.get("STIME").getFormValue();
                    var etime = mini.get("ETIME").getFormValue();
                    var strWhere = { "STIME": stime, "ETIME": etime, "TM": stime };
                    $.data(myData, "strWhere", strWhere);
                    GetJosns("DOWNLOADLOC", strWhere, "DOWNLOADLOC");
                }
            }
            else if (typeID == "FH_inset_fangan") {
                mini.unmask(document.body);
				//保存下载文件
                var stime = mini.get("STIME").getFormValue();
                var etime = mini.get("ETIME").getFormValue();
                var dd_id = $.data(myData, "_dd_id");
                var strParam = { STIME: stime, ETIME: etime, SOLUTIONID: dd_id };
                GetJosns("FH_GetLOCNEW", strParam, "FH_GetLOCNEW");
				
				OpenHref(dd_id,dd_id);
                //onResultInsert();
            }
            else if (typeID == "PLAdd") {
                showTips(data.data);
                //保存下载文件
                var stime = mini.get("STIME").getFormValue();
                var etime = mini.get("ETIME").getFormValue();
                var strWhere = { "STIME": stime, "ETIME": etime, "TM": stime, DD_ID: $.data(myData, "_dd_id") };
                $.data(myData, "strWhere", strWhere);
                GetJosns("DOWNLOADLOC", strWhere, "DOWNLOADLOC2");
            }
            else if (typeID == "DOWNLOADLOC2") {
                //计算取消之后，归还令牌
                GetJosns("WJ_ReturnToken", {}, "WJ_ReturnToken");
				OpenHref($.data(myData, "_dd_id"),$.data(myData, "_dd_id"));
                mini.unmask(document.body);
            }
        }
function OpenHref(objID, DD_ID) {
            window.parent.OpenTab("fa-delicious", "调度预测成果", "/DD_MX/ResultsRelease.html?ID=" + objID + "&DD_ID=" + DD_ID+ "&type=list");
        }
        function onResultOk() {
            //保存数据
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '成果保存中...'
            });
            var _dd_id = GetTableID();
            var yj_time = mini.get("STIME").getFormValue();
            var yj_etime = mini.get("ETIME").getFormValue();
            $.data(myData, "_dd_id", _dd_id);
            var usedTime = new Date(yj_etime) - new Date(yj_time);  //两个时间戳相差的毫秒数
            var hours = Math.floor(usedTime / (3600 * 1000));
            var s_where = {
                "ID": _dd_id,
                "DD_ID": _dd_id,
                "DD_NAME": mini.get("DD_NAME").getValue(),
                "DD_BY": GetCookie("LOGINNAME"),
                "DD_TM": yj_time,
                "DD_CARRYTM": new Date().format("yyyy-MM-dd HH:mm:ss"),
                //"DD_NOTE": mini.get("DD_NOTE").getValue(),
                "typeID": $.data(myData, "TYPE"),
                "DD_EVALUE": DD_EVALUE,
                "DD_DISTRIBY": "2",//记录是自动计算、任务计算和手动平台计算，分别0，1，2
                "DD_CHECKBY": yj_etime,
                "DD_STANA": hours
            };
            GetJosns("FH_inset_update", s_where, "FH_inset_fangan");
        }
        function onResultInsert() {
            var _dd_id = $.data(myData, "_dd_id");
            var yj_time = mini.get("STIME").getFormValue();
            var s_where = {
                "DD_ID": _dd_id,
                "DD_TM": yj_time,
                "DD_FOR": GetCookie("USERID")
            };
            GetJosns("FH_inset_update", s_where, "PLAdd");
        }
        function showTips(msg) {
            var x = "right";
            var y = "bottom";
            var state = "default";
            mini.showTips({
                content: msg,
                state: state,
                x: x,
                y: y,
                timeout: 1500
            });
        }
        function onvaluechangedTM(e) {

        }
    </script>
</body>
</html>
