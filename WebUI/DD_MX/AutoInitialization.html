        function getModelResult(dd_id) {
            //获取模型的成果
            var zhuData = $.data(myData, 'zhuData');
            var stime = $.data(myData, "stime");
            var etime = $.data(myData, "etime");
            var taskID = $.data(myData, "taskID");
            var bdms_predictSql=[];
            for (var num = 0; num < zhuData.length; num++) {
                var id = zhuData[num].id;
                var dataType = zhuData[num].type;
                var stcd = zhuData[num].stcd;
                stcd=stcd!=""?stcd.replace('.',''):id;
                var strWhere = {
                    "version": 1,
                    "api": "GetResultPresetByTimePeriod",
                    "id": id,//主图形编号
                    "startTM": stime,
                    "endTM": etime,
                    "taskID": taskID
                }
                GetJosnsModeNew("", strWhere,false,function (res) {
                    console.error(id, stcd, res);
                    var data = res.data;
                    if (data != undefined && data != null) {
                        var vals = data.vals;
                        var times = data.times;
                        if (times != undefined && times != null) {
                            for (var _index = 0; _index < times.length; _index++) {
                                var _tm = new Date(times[_index]);
                                var _data = Number(vals[_index]);
                                var pREDICT = {};
                                if (dataType == 1) {//水位，取五分钟的数据
                                    pREDICT.ID = GetTableID();
                                    pREDICT.USERID ="自动预报";
                                    pREDICT.STCD = stcd;
                                    pREDICT.YMDHM = _tm.format("yyyy-MM-dd HH:mm:ss");
                                    pREDICT.PLAN_N = dd_id;
                                    pREDICT.DATA_TYPE = dataType;
                                    pREDICT.DATA = _data.toFixed(2);
                                    bdms_predictSql.push(pREDICT);
                                }
                                else {//其他取一小时一个数据
                                    if (_tm.getMinutes() == 0) {
                                        if (dataType == 15 || dataType == 14) {//水面积和蓄量需要转单位：万m³转百万m³，平方米转平方公里
                                            _data = _data / 1000000;
                                        }
                                        pREDICT.ID = GetTableID();
                                        pREDICT.USERID ="自动预报";
                                        pREDICT.STCD = stcd;
                                        pREDICT.YMDHM = _tm.format("yyyy-MM-dd HH:mm:ss");
                                        pREDICT.PLAN_N = dd_id;
                                        pREDICT.DATA_TYPE = dataType;
                                        pREDICT.DATA = _data.toFixed(2);
                                        bdms_predictSql.push(pREDICT);
                                    }
                                }
                            }
                        }
                    }
                });
            }
            return bdms_predictSql;
        }

    <!--批量操作-->
    <script>
        function onFilterChanged(e) {
            var field = e.sender.getId();
            var value = e.value;
            if (isNaN(value)) {
                mini.alert("请输入数字！");
                return;
            }
            if (value == "") {
                return;
            }
            methodJY(field, value);
        }
        function onValueChanged(e) {
            var selected = grid.getSelected();
            if (selected) {
                var s_where = { "ZhanData": e.value, "ZhanTime": new Date(selected.TM).format("yyyy-MM-dd HH:mm:ss"), "ZhanID": e.sender.getName(), DayHour: "HOUR", username: GetCookie("LOGINNAME")}
                GetJosns("FH_UpdataMethod", s_where, "UpdataMethod");
            }
        }
        function onValueChangedGC(e) {
            var selected = gridGC.getSelected();
            if (selected) {
                var s_where = { "ZhanData": e.value, "ZhanTime": new Date(mini.get("TM").getFormValue()).format("yyyy-MM-dd HH:mm:ss"), "ZhanID": selected.STCD, DayHour: "DAY",username: GetCookie("LOGINNAME") }
                GetJosns("FH_UpdataMethod", s_where, "UpdataMethod");
            }
        }
        function methodJY(field, fieldText) {
            var s_where = "";
            var tempID = GetCookie("DD_ID");
            if (tempID == null || tempID == "") {
                tempID = "0";
            }
            var s_where = {
                "ZhanData": fieldText, "ZhanID": field, "DayHour": "DAY", "dd_id": tempID, username: GetCookie("LOGINNAME")
            };
            GetJosns("FH_update_batch", s_where, "update_batch");
        }
        function ShowMsg(strMsg) {
            var x = "right";
            var y = "bottom";
            mini.showMessageBox({
                showModal: false,
                width: 150,
                title: "提示",
                iconCls: "mini-messagebox-warning",
                message: strMsg,
                timeout: 3000,
                x: x,
                y: y
            });
        }
        function compareAscSort(property) {
            return function (a, b) {
                var value1 = a[property];
                var value2 = b[property];
                return value1 - value2;
            }
        }

            $('#sysList').hide();
