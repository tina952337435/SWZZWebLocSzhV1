<body>
    <div style="width: 100%;">
        <div style="width: 100%;height:80px;margin: 0px auto;text-align: center;">
            <div class="pointsRule">
                <ul id="list">
                    <li style="z-index:5;" id="one" onclick="ClickFirst()"><a><span>1.依据时间设定</span><i></i></a></li>

    <div style="text-align:right;width:100%;">
        <a class="mini-button" onclick="btnSava()" style="width:130px;height: 37px;line-height:37px; margin-right:20px;font-size: 14px;font-weight: bold;background:#0551BD;">保存方案</a>
    </div>
    <div style="width: 100%;height: calc(100% - 80px);">
        <div style="width: 100%; height: 100%; border: solid 1px #ccc;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);">
            <div style="width:15%;float:left; margin-top:5px;margin-left:5px; height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);">
                <div style="margin-bottom:5px; margin-top:5px; ">
                    <label>&nbsp;&nbsp;名称：</label>
                    <input id="key" class="mini-textbox" style="width:120px;" onenter="onKeyEnter" />
                    <a class="mini-button" style="width:60px;" onclick="btnSearch()">搜索</a>
                </div>

                <ul id="tree1" class="mini-tree" style="width:100%;padding:5px;height: -webkit-calc(100% - 35px);height: -moz-calc(100% - 35px);height: calc(100% - 35px);"
                    showTreeIcon="true" textField="NAME" idField="STCD" onNodeClick="onNodeClick"
                    expandOnLoad="true"></ul>
            </div>

            <div style="width:84%;height:100%;float:left;">
                <div id="fit1" class="fit">
                    <div id="divChart" style="height:400px;width:99.5%;">

                    </div>
                </div>
                <div id="fit2" class="fit" style="height: -webkit-calc(100% - 440px);height: -moz-calc(100% - 440px);height: calc(100% - 440px);">
                    <div id="grid1" class="mini-datagrid" style="width: 99%; height: 100%; margin: auto;margin-top:10px;" showPager="false"
                         idfield="STCD" allowresize="false" allowalternating="true" showemptytext="true" emptytext="暂无数据" 
                         alwaysshowemptytext="true" ondrawcell="ondrawcell"
                         sortmode="client">
                    </div>
                </div>

            </div>
        </div>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var grid = mini.get("grid1");
        var tree = mini.get("tree1");
        $(function () {
            var stime = GetQueryString("stime");
            var etime = GetQueryString("etime");
            $.data(myData, "stime", stime);
            $.data(myData, "etime", etime);
            var dd_evalue = GetQueryString("DD_EVALUE");
            $.data(myData, "DD_EVALUE", dd_evalue);
            //$("#fit2").hide();
            
            OnLoad();
            GetJosns("FH_GetCache", {}, "Cache");
        })

        function gridLoad() {
            var treeNodes = tree.getSelectedNode();
            var ParentNode = tree.getParentNode(treeNodes);

            var result = $.data(myData, "result");
            var _xData = $.data(myData, "_xData");
            var danwei = "m";
            var NAME = ParentNode.NAME;
            var ColoumnsName = {
                "TM": "时间",
                "DATA": NAME,
                "UPZ": "实测" + NAME
            };
            if (NAME == "流量" || NAME == "蓄水量") {
                danwei = "m³/s";
                ColoumnsName = {
                    "TM": "时间",
                    "DATA": NAME
                };
            }
            SetColumns(ColoumnsName, grid);


            grid.setData(result);

            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            if (NAME == "水位") {
                strNote += ',{"name": "实测","codename": "UPZ","tableV":"1","isShow":true,"width":"30%"}';
            }
            strNote += ',{"name": "' + treeNodes.NAME + '","codename": "DATA","tableV":"1","isShow":true,"width":"30%"}]';
            var LineColor = ['blue', '#15D69F', '#00FF00', '#FFA500'];

            chartCHART("divChart", _xData, eval('(' + strNote + ')'), LineColor, NAME + "(" + danwei+")");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Cache") {
                if (data.data == "") {
                    ShowMsg("模型令牌已丢失！");
                    DelCookieStep();
                    setTimeout(function () { Next_Click("Initialization.html"); }, 1000);
                } else {
                    mini.mask({
                        el: document.body,
                        cls: 'mini-mask-loading',
                        html: '数据加载中...'
                    });
                    //var mtype = [{ id: "1", text: "水位" }, { id: "2", text: "流量" }, { id: "15", text: "蓄水量" }, { id: "24", text: "入流" }];
                    //if (GetCookie("SZISOK") == "SZ") {
                    //    mtype = [{ id: "1", text: "水位" }, { id: "2", text: "流量" },  { id: "15", text: "蓄水量" }, { id: "102", text: "BOD5浓度" }, { id: "103", text: "DO浓度" }, { id: "104", text: "COD浓度(Cr)" }, { id: "105", text: "总磷浓度" }, { id: "106", text: "总氮浓度" }, { id: "128", text: "氨氮浓度" }];
                    //}
                    //var s_where = { "jsonText": JSON.stringify(mtype) };
                    GetJosns("JISUANZHAN", {}, "JISUANZHAN");
                }
            }
            else if (typeID == "STCD") {

            } else if (typeID == "JISUANZHAN") {
                var result = data.data;
                tree.loadList(result, "ID", "PID");
                tree.select(1);
                search();
            }
            else if (typeID == "Sel") {
                if (data.total == 0) {
                    mini.alert(data.data);
                } else {
                    var dataResult = mini.decode(data.data);
                    var _xData = [];
                    var result = [];
                    if (dataResult.length > 0) {
                        for (num = 0; num < dataResult.length; num++) {
                            var _tm, _data = "", _tm1, _data1 = "", _tm2, _data2 = "", _upz = "", _upz1 = "", _upz2 = "";
                            _tm = new Date(dataResult[num].TM);
                            _data = dataResult[num].DATA;
                            _upz = dataResult[num].UPZ;
                            _xData.push({ "TM": _tm.format("M月d日H时m分"), "DATA": _data, UPZ: _upz });
                            result.push({ "TM": _tm.format("yyyy-MM-dd HH:mm:ss"), "DATA": _data, "UPZ": _upz });
                        }
                    }
                    $.data(myData, "result", result);
                    $.data(myData, "_xData", _xData);
                    gridLoad();
                    mini.unmask(document.body);
                }
            }
            else if (typeID == "MODE_DD_SOLUTIONUpdate") {
                var objID = $.data(myData, "objIDNew");
                var DD_ID = $.data(myData, "DD_IDNew");
                window.parent.OpenTab("fa-delicious", "调度预测成果", "/DD_MX/ResultsRelease.html?ID=" + objID + "&DD_ID=" + DD_ID + "&type=list");
            }
        }
        //分页
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, $.data(myData, "gridData"), grid);
        });

        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务
            if (field != "TM") {
                if (value != null && value != "" && value != undefined) {
                   e.cellHtml=parseFloat(value).toFixed(2);
                }
            }
        }
        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            $(".fit").hide();
            $("#" + objFit).show();
            gridLoad();
        }
        function onNodeClick(e) {
            var tree = e.sender;
            var node = e.node;
            var isLeaf = tree.isLeaf(node);
            if (isLeaf == false) {
                e.cancel = true;
            } else {
                search();
            }
        }
        function search() {
            var tempID = GetCookie("DD_ID");
            if (tempID == null) {
                tempID = "";
            }
            var node = tree.getSelectedNode();
            var strParam = {
                "SolutionID": tempID,
                "STCD": node.STCD,
                "MKEYID": node.ID,
                "DATA_TYPE": node.PID,
                "STIME":$.data(myData, "stime"),
            };
            GetJosns("FH_GetData", strParam, "Sel");
        }
        function btnSearch() {
            var key = mini.get("key").getValue();
            if (key == "") {
                tree.clearFilter();
            } else {
                key = key.toLowerCase();
                tree.filter(function (node) {
                    var text = node.text ? node.text.toLowerCase() : "";
                    if (text.indexOf(key) != -1) {
                        return true;
                    }
                });
            }
        }
        function onKeyEnter(e) {
            btnSearch();
        }
        //保存方案
        function btnSava() {
            addData("type@1,STIME@" + $.data(myData, "stime") + ",ETIME@" + $.data(myData, "etime") + ",DD_EVALUE@" + $.data(myData, "DD_EVALUE"), "/DD_MX/FangAn.html", "调度方案记录管理", "700px", "500px", "true");
        }

        top["win"] = window;
        function OpenHref(objID, DD_ID) {
            mini.confirm("是否收藏方案？", "确定？",
                function (action) {
                    if (action == "ok") {
                        $.data(myData, "objIDNew", objID);
                        $.data(myData, "DD_IDNew", DD_ID);
                        var DD_CARRYBY = "10";
                        var strWhere = { ID: objID, DD_CARRYBY: DD_CARRYBY };
                        GetJosns("MODE_DD_SOLUTIONUpdate", strWhere, "MODE_DD_SOLUTIONUpdate");
                    } else {
                        window.parent.OpenTab("fa-delicious", "调度预测成果", "/DD_MX/ResultsRelease.html?ID=" + objID + "&DD_ID=" + DD_ID + "&type=list");
                    }
                }
            );
        }
    </script>
    <script type="text/javascript">
        function chartCHART(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var tm = new Date($.data(myData, "stime")).format("M月d日H时m分");
            console.error(tm);
            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(new Date(value[value1.codename].replaceAll("-","/")).format("MM-dd HH:mm")); //加入时间集合
                        chartTM.push(value[value1.codename]); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            //获得最大值最小值
            //var max_min = GetSort(chartValue);
            //console.error(max_min.max);
            chartValue.sort(compare);
            var _min = chartValue[0];
            var _max = chartValue[chartValue.length - 1];
            max_min = { min: _min, max: _max };
            //console.error(max_min.max);
            var option = {
                //backgroundColor: '#100E19',
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                    //控制过程线默认是否显示
                    //       ,
                    //		 selected: {
                    //          '警戒水位' : false
                    //      }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: chartTM,
                        axisLine: {
                            lineStyle: {
                                color: '#000000',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        },
                        //axisPointer: {
                        //    value: tm,
                        //    snap: true,
                        //    lineStyle: {
                        //        color: '#004E52',
                        //        opacity: 0.5,
                        //        width: 2
                        //    },
                        //    label: {
                        //        show: true,
                        //        formatter: function (params) {
                        //            return params.value;
                        //        },
                        //        backgroundColor: '#004E52'
                        //    },
                        //    handle: {
                        //        show: true,
                        //        color: '#004E52',
                        //        size: 0
                        //    }
                        //}
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        scale: true, //是否自动计算最大最小值。
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 200-1;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 200-1;
                            }
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 200+1;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 200+1;
                            }

                        },
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#E5E5E5',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        //min:max_min.min, //动态设置最大值最小值。
                        //max:max_min.max,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#000000',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0,
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 2)); //循环价值
                        }
                        if (max_min_Name != "" & max_min_Name == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                smooth: true
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    var item = {
                        name: '平行于y轴的趋势线',
                        type: 'line',
                        markLine: {
                            itemStyle: {      //盒须图样式。
                                color: '#004E52'
                            },
                            name: 'cc',
                            data: [[
                                { coord: [tm, 0] },
                                { coord: [tm, max_min.max] }
                            ]]
                        }
                    }
                    serie.push(item);
                    return serie;
                }()
            };
            myChart.setOption(option);
        }

    </script>
