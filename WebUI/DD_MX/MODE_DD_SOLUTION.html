<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>调度方案</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            &nbsp; &nbsp;
            开始日期： &nbsp;<input id="STIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;
            结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;
            关键字：&nbsp;<input id="key" class="mini-textbox" emptytext="请输入关键字" style="height: 25px;width: 150px;" onenter="onKeyEnter" />
            &nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a>
            &nbsp;&nbsp; <a class="mini-button" id="addbtn" onclick="window.location.href='../DD_MXAPISZH/Initialization.html'" plain="false">增加</a>
        </div>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);" allowalternating="true"
         borderstyle="border-right:0;" idfield="id" sortmode="client" sizelist="[15,20,30,50]" pagesize="15" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" width="4%" headeralign="center" align="center">序号</div>
            <div field="dd_NAME" width="25%" headeralign="center" align="left" allowsort="true">
                方案名称
            </div>
            <div field="dd_TM" width="10%" headeralign="center" align="center" allowsort="true">
                依据时间
            </div>
            <div field="dd_STANA" width="6%" headeralign="center" align="center" allowsort="true">
                预见期(小时)
            </div>
            <!--<div field="DD_DRP" width="10%" headeralign="center" align="center" allowsort="true">
        累计降雨量(mm)
    </div>
    <div header="太湖预测水位(m)" headeralign="center" align="center">
        <div property="columns">
            <div field="QCZ" headeralign="center" align="center">期初</div>
            <div field="QMZ" headeralign="center" align="center">期末</div>
            <div field="MAXZ" headeralign="center" align="center" >最高</div>
            <div field="MINZ" headeralign="center" align="center">最低</div>
        </div>
    </div>
    <div field="DD_THZM" width="10%" headeralign="center" align="center" allowsort="true">
        太湖预测水位(明日)
    </div>
    <div field="DD_ZF" width="6%" headeralign="center" align="center" allowsort="true" >
        涨幅(m)
    </div>-->
            <div field="dd_NOTE" width="32%" headeralign="center" align="left" allowsort="true">
                备注
            </div>
            <div field="dd_CARRYTM" width="10%" headeralign="center" align="center" allowsort="true" renderer="onTMRenderer">
                调度时间
            </div>
            <div field="dd_BY" width="6%" headeralign="center" align="center" allowsort="true">
                调度人员
            </div>
            <div field="action" name="action" width="8%" headeralign="center" align="center" cellstyle="padding:0;">
                基本操作
            </div>
        </div>
    </div>
    <script language="javascript" type="text/javascript">
        mini.parse();
        //实例化表格对象
        var grid = mini.get("grid1");
        $(function () {
            var stime = GetQueryString("stime");
            var etime = GetQueryString("etime");
            var key = GetQueryString("key"); 
            if (stime != null) {
                mini.get("STIME").setValue(stime);
                mini.get("ETIME").setValue(etime);
                mini.get("key").setValue(key);
            } else {
                var tm = new Date();
                mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -365));
                mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));
            }
            
            //默认加载数据
            search();
        })
        function onKeyEnter() {
            //关键字
            search();
        }
        var dataResult = null;
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            PageFillData(0, 15);
        }
        function PageFillData(pageIndex, pageSize) {
            var Startime = mini.get("STIME").getFormValue()+" 00:00:00";
            var Endtime = mini.get("ETIME").getFormValue()+" 23:59:59";
            if (Startime > Endtime) {
                mini.alert("请确认起止日期次序是否正确（终止日期至少是起始日期的次日）！");
                return false;
            } 
            //查询方法
            var strWhere = { 
				"startdate": Startime, 
				"enddate": Endtime, 
				"kwtxt": mini.get("key").getValue(), 
				//"pageindex": pageIndex, 
				//"pagesize": pageSize
				};
            //GetJosns("MODE_DD_SOLUTIONSel", strWhere, "Sel");
			app.post("SWZZ_MODE_DD_SOLUTION/findResult",strWhere,(data)=>{
				data.pageIndex = pageIndex;
				data.pageSize = pageSize;
				JosnSel(data,"Sel")
			})
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
				// dataResult.data.sort((a,b)=>{
				// 	return new Date(b.dd_TM).getTime() - new Date(a.dd_TM).getTime();
				// });
				// console.log(dataResult)
                //PageServerFill(grid, dataResult);
				fillData(dataResult.pageIndex,dataResult.pageSize,dataResult,grid);
                mini.unmask(document.body);
            }
            else if (typeID == "Del") {
                if (data.total > 0) {
                    search();
                }
            } else if (typeID == "MODE_ES_MODELFANGANSel") {

            }
            else if (typeID == "MODE_DD_SOLUTIONUpdate") {
                if (data.message == "操作成功") {
                    ShowMsg("收藏成功");
                    search();
                }
            }
        }

        function OpenHref(DD_EVALUE, objID, DD_ID, DD_CARRYBY, DD_EVALUE,DD_DISTRIBY) {
            var url =  window.location.pathname.indexOf('swzzWeb')>-1?"DD_MX/ResultsRelease.html":"ResultsRelease.html"; 
            if(DD_DISTRIBY=="100"){
                url="../storage/ResultsReleaseReportCXL.html";
            }
            url = url+"?ID=" + objID + "&DD_ID=" + DD_ID + "&FA_ID=" + DD_EVALUE + "&stime=" + mini.get("STIME").getFormValue() + "&etime=" + mini.get("ETIME").getFormValue() + "&key=" + mini.get("key").getValue() + "&type=list";
            try {
                window.parent.addTab("调度方案详细信息", url);
            } catch (error) {
                window.location.href=url;
            }
        }
        //删除
        function del(objID) {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        var strWhere = { "stcd": objID };
                        //GetJosns("MODE_DD_SOLUTIONDel", strWhere, "Del");
						app.post("SWZZ_MODE_DD_SOLUTION/remove",strWhere,(data)=>{
							JosnSel(data,"Del")
						});
                    }
                }
            );
        }
        //编辑调度方案
        function edit(objID, STIME, ETIME, DD_EVALUE) {
            var strParam = "action@edit,ID@" + objID;
            editData(strParam, "../DD_MXAPI/FangAn.html", "调度方案记录管理", "700px", "500px", "true");
        }
        //--------------------------------
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            //PageFillData(pageIndex, pageSize);
			fillData(pageIndex,pageSize,dataResult,grid);
        });

        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "QCZ" || field == "QMZ" || field == "MAXZ" || field == "MINZ") {
                if (value != undefined) {
                    e.cellHtml = parseFloat(value).toFixed(2);
                }
            }
            if (field == "dd_STANA") {
                if (!isNaN(value)) {
                    //e.cellHtml = parseFloat(value/24).toFixed(0);
                }
            }

            if (field == "dd_TM" || field =="dd_CARRYTM") {
                if(value!=undefined){
                e.cellHtml= mini.formatDate(new Date(value), 'yyyy年MM月dd日 H时');
                }
            }
            if (field == "action") {
                var DD_EVALUE = record.dd_EVALUE;
                var s = "";
                if (record.dd_CARRYBY != undefined && record.dd_CARRYBY == "10") {
                    s += '<img style="cursor:pointer;" onclick="collectFang(\'' + record.id + '\',\'no\')" src="../Common/images/collectFang.png" title="取消收藏"/>&nbsp;'
                } else {
                    s += '<img style="cursor:pointer;" onclick="collectFang(\'' + record.id + '\',\'yes\')" src="../Common/images/collectFangNo.png" title="收藏方案"/>&nbsp;'
                }
                s += '<img style="cursor:pointer;" onclick="window.location.href=\'../DD_MXAPISZH/Initialization.html?DD_ID=' + record.dd_ID+'&DD_TM=' + new Date(record.dd_TM).format("yyyy/MM/dd HH:mm:ss") + '&DD_STANA=' + record.dd_STANA +  '\'" src="../Common/images/recalculate.png" title="方案重算"/>&nbsp;'
                s += '<img style="cursor:pointer;" onclick="OpenHref(\'' + DD_EVALUE + '\',\'' + record.id + '\',\'' + record.dd_ID + '\',\'' + record.dd_CARRYBY + '\',\'' + record.dd_EVALUE + '\',\'' + record.dd_DISTRIBY + '\')" src="../Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
                //修改
                s += '<img style="cursor:pointer;" onclick="edit(\'' + record.id + '\')" src="../Common/miniui/themes/icons/edit.png" title="编辑调度方案" />&nbsp;';
                s += '<img style="cursor:pointer;" onclick="del(\'' + record.id + '\')" src="../Common/miniui/themes/icons/remove.png" title="删除调度方案" />&nbsp;';
                e.cellHtml = s;
            }
        }
        function collectFang(ID, TYPE) {
            var DD_CARRYBY = "1";
            if (TYPE == "yes") {
                DD_CARRYBY = "10";
            }
            var strWhere = { id: ID, dd_CARRYBY: DD_CARRYBY};
            //GetJosns("MODE_DD_SOLUTIONUpdate", strWhere, "MODE_DD_SOLUTIONUpdate");
			app.post("SWZZ_MODE_DD_SOLUTION/modify",strWhere,(data)=>{
				JosnSel(data,"MODE_DD_SOLUTIONUpdate")
			});
        }
    </script>
</body>
</html>
