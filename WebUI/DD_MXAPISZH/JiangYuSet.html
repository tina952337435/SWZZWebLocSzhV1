        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var dataResult = mini.decode(data.data);
                grid.setData(dataResult);
                //new CopyExcel(grid);        //Excel互操作插件
                mini.unmask(document.body);
            }
            else if (typeID == "GridColum") {
                var dataResult = mini.decode(data.data);
                var item = {
                    field: "action", header: "统一操作", headerAlign: "center", align: "center", filter: { "type": "textbox", "onValueChanged": "onFilterChangedQuan", "emptyText": "全流域批量输入" }

                grid.set(dataResult);
                onLoadData();
                var strHtml = '<li name="before">复制前一列</li><li name = "after">复制后一列</li>';
                for (var num = 1; num < $.data(myData, "columns").length - 1; num++) {
                    strHtml += '<li name="header' + $.data(myData, "columns")[num].field + '">' + $.data(myData, "columns")[num].header + '</li>';
                }
                //var headerMenu = document.getElementById("headerMenu");
                //headerMenu.innerHTML = strHtml;
                //mini.parse();
            }
            else if (typeID == "MODE_ES_RAINFALL_TREESel") {
                tree.loadList(data.data, "id", "pid");

            }
            else if (typeID == "MODE_ES_ZHANDIANSel") {
                tree2.setData(data.data);
                tree2.select(0);
            }
            else if (typeID == "MODE_ES_RAINFALLSel") {
                var strNote = [];
                var item = { "name": "时间", "codename": "tm", "tableV": "1", "isShow": true, "width": "30%" };

                item = { "name": "降雨量", "codename": "drp", "tableV": "1", "isShow": true, "width": "30%" };

                var LineColor = ['#3398DB', '#FF0000', '#00FF00', '#FFA500'];
                chartYL("danzhanBar", data.data, strNote, LineColor, "雨量(mm)");
            }
            else if (typeID == "UpdataInput") {
                ShowMsg(data.message);
                onLoadData();
                //更新完降雨之后需要给工程指定调度方案
            }
            else if (typeID == "updateButton") {
                if (data.total == 0) {
                    ShowMsg("无降雨数据！");
                } else {
                    ShowMsg(data.message);
                    onLoadData();
                    //更新完降雨之后需要给工程指定调度方案
                }
                mini.unmask(document.body);
            }
            else if (typeID == "Designrainfall") {
                $('#sysList').hide();
                $('#barList').hide();
                onLoadData();
                //更新完降雨之后需要给工程指定调度方案
            }
            else if (typeID == "saveExcelData") {
                ShowMsg(data.Message);
                mini.unmask(document.body);
                url = "ShuiWei.html";
                Next_Click(url);
            }
        }

        //用个全局变量存放当前点击列
        var currentColumnIndex = 0;
        function onBeforeOpen(e) {
            //根据文本找到column的序号，有点问题的（比如header有相同部分什么）
            var columns = grid.getColumns();
            function findColumnIndex(field) {
                for (var i = 0, l = columns.length; i < l; i++) {
                    var column = columns[i];
                    if (!column.field) continue;
                    if (column.header.indexOf(field) != -1) return i;
                }
            }
            //右键点击的表头元素的文本的前2个字符串（方便判断）
            var text = e.htmlEvent.target.innerHTML;//.substr(0, 2);
            //没有field的直接给0，比如序号列展开列之类的
            currentColumnIndex = findColumnIndex(text) || 0;
            
            var menu = e.sender;
            if (currentColumnIndex == 0 || currentColumnIndex==columns.length - 1) {
                e.cancel = true;
                //阻止浏览器默认右键菜单
                e.htmlEvent.preventDefault();
                return;
            }
            ////////////////////////////////
            var beforeItem = mini.getbyName("before", menu);
            var afterItem = mini.getbyName("after", menu);
            beforeItem.show();
            afterItem.show();
            if (currentColumnIndex == 1) {
                beforeItem.hide();
            }
            if (currentColumnIndex ==columns.length-2) {
                afterItem.hide();
            }
        }
        function onItemClick(e) {
            if (currentColumnIndex == 0) return;
            var field = grid.getColumn(currentColumnIndex).field;
            var itemName = e.item.name;
            var stcd = itemName;
            if (itemName == "before") {
                stcd = grid.getColumn(currentColumnIndex - 1).field;//默认取前一列
            } else if (itemName == "after") {
                stcd=grid.getColumn(currentColumnIndex + 1).field
            }
            QuickInputRain(stcd,field);
        }

        function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        var tm = new Date(value[value1.codename]).format("yyyy-MM-dd HH");
                        chartTM.push(tm);
                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                toolbox: {
                    show: true,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: { show: false, type: ['line', 'bar'] },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom:40,
                    top: 40,
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        scale: true,
                        axisTick: {
                            alignWithLabel: false
                        },
                        axisLabel: {
                            //interval: 0,
                            rotate: 40
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        //interval: 0,
                        //  splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        min: 0,
                        max: function (value) {
                            return Number((value.max - (value.max % 5)) / 5 + 1).toFixed(0) * 5;
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                //dataZoom: [
                //    {
                //        show: true,
                //        realtime: true,
                //        start: 0,
                //        end: 20
                //    },
                //    {
                //        type: 'inside',
                //        realtime: true,
                //        start: 0,
                //        end: 20
                //    }
                //],
                animation: false,
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        if (chartName[j] == "名称") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: '60%',
                                //itemStyle: {
                                //    borderWidth:3,
                                //},
                                //label: {
                                //    normal: {
                                //        show: true,
                                //        position: 'top'
                                //    }
                                //},
                                smooth: true
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
            myChart.on('click', function (param) {
                $(".mini-messagebox").hide();
                $(".mini-widget-content").hide();
                mini.confirm("是否选择数据？", "确定？",
                    function (action) {
                        if (action == "ok") {
                            var name = param.name;
                            var ID = $.data(myData, "treeID");
                            var s_where = { 
                                "TYPE": ID, 
                                "TM": name + ":00:00",
                                "SOLUTIONID":localDD_ID
                            };
                            GetJosns("Designrainfall", s_where, "Designrainfall");
                        }
                    }
                );
            });
        }

            var json = mini.encode(dataTM);
            var s_where = { "json": json,TYPE:"0" };
            GetJosns("SaveExcelData", s_where, "saveExcelData");
        }
    </script>
