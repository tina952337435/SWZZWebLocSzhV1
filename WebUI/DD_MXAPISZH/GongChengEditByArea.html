<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>修改工程调度方案</title>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <link href="../Common/CSS/mxCss.css" rel="stylesheet" />
    <link href="../Common/CSS/newmxCss2.css" rel="stylesheet" />
    <link href="../Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0px;
            padding: 0px;
            overflow: auto;
            background: #f7f6f6;
        }

        .onlytab li {
            padding: 0px 6px 0px 6px;
        }

        .box {
            -webkit-box-shadow: 0 2px 6px 2px rgba(0, 0, 0, .14);
            box-shadow: 0 2px 6px 2px rgba(0, 0, 0, .14);
            margin: 0px auto;
            /* width: 80%; */
            width: 90%;
            height: 100%;
            background: #fff;
            display: table;
            /* 确保是块级 */
        }

        #zhanDiv {
            overflow-y: auto;
            min-height: 600px;
        }

        .zhanUL {
            list-style: none;
            padding: 10px;

        }

        .zhanLI {
            /* height: 50px; */
            line-height: 35px;
        }

        .c-index {
            display: inline-block;
            padding: 1px 0;
            color: #fff;
            width: 27px;
            line-height: 100%;
            font-size: 14px;
            text-align: center;
            background-color: #8eb9f5;
        }

        .c-gap-icon-right-small {
            margin-right: 5px;
        }

        ul.ui-choose>li {
            width: auto;
            padding: 0 10px;
        }
    </style>
</head>

<body>
    <div style="position:absolute;top:20px;right:calc(5% + 20px);">
        <a class="mini-button" onclick="saveDataNew()">设定调度预案</a>
    </div>
    <div class="box">
        <div id="zhanDiv">

        </div>
    </div>


    <script>
        mini.parse();
        var myData = [];
        var str_stcds = "";
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        var initFa = "";//记录初始的方案
        var localDD_ID = GetQueryString("DD_ID");
        if (localDD_ID == null || localDD_ID == "") {
            localDD_ID = "0";
        }
        $(function () {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            //方案
            // app.post("SWZZ_MODE_ES_MODELFANGANZHAN/findResult", {}, function(res){
            //     JosnSel(res,"FSel");
            // });

            //站点与分区关联
            app.post("SWZZ_MODE_ES_MODELGUANLIAN/findResult", { "kwtxt": "6" }, function (res) {
                JosnSel(res, "SLJISel");
            });

            setTimeout(function () {
                app.post("SWZZ_MODE_ES_MODELFANGAN/findResult", {}, function (res) {
                    JosnSel(res, "FanganSel");
                    mini.unmask(document.body);
                });
            }, 1000);

        });
        function JosnSel(data, typeID) {
            if (typeID == "SLJISel") {
                var strJson = data.data;
                strJson = strJson.filter(function (e) {
                    return e.stcd != null && e.stcd != undefined && e.stcd != "";
                });
                $.data(myData, "gldata", strJson);
                // loadZhanHtml();
            }
            else if (typeID == "FSel") {
                $.data(myData, "fdata", data.data);
            }
            else if (typeID == "plAdd") {
                ShowMsg(data.message);
                top["win"].onLoadData();
                mini.unmask(document.body);
            }
            else if (typeID == "FanganSel") {
                loadFangAnHtml(data.data);
            }
        }
        function loadZhanHtml() {
            var gldata = $.data(myData, "gldata");
            for (var num = 0; num < gldata.length; num++) {
                gldata[num].sortnum = 1;
                if (gldata[num].mkeyid == "9999999999") {
                    gldata[num].sortnum = 20;
                }
                if (gldata[num].mkeyid == "1744830534") {
                    gldata[num].sortnum = 19;
                }
            }
            gldata = sortObjectArray(gldata, ["sortnum"], "asc");

            var fdata = $.data(myData, "fdata");
            var html = "<ul class='zhanUL'>";
            var _index = 1;
            for (var num = 0; num < gldata.length; num++) {
                var zhanid = gldata[num].mkeyid;

                html += '<li class="zhanLI" id="' + zhanid + '">';

                var name = gldata[num].field;
                html += '<div style="width:150px;"><span class="c-index  c-index-hot1 c-gap-icon-right-small">' + _index + '</span>' + name + '</div>';

                html += '<ul class="ui-choose choose-type-right" id="choseGrade' + zhanid + '">';

                var fdataTempZi = fdata.filter(function (e) {
                    return e.special == name;
                });
                if (name == "其他工程") {
                    fdataTempZi = fdata.filter(function (e) {
                        return e.special == "苏州河河口闸" || e.special == "浏河闸";
                    });
                }
                var fdataTemp = groupBy(fdataTempZi, 'fa_ID');
                for (var fnum = 0; fnum < fdataTemp.length; fnum++) {
                    var itemObj = fdataTemp[fnum];
                    var cls = "";
                    html += '<li class="' + cls + '"  id="' + zhanid + "li" + itemObj[0].fa_ID + '"  onclick="OnClickTitle2(\'' + zhanid + '\',\'' + zhanid + "li" + itemObj[0].fa_ID + '\')" title="' + itemObj[0].normal + '">';
                    html += '<span name="' + itemObj[0].normal + '"  title="' + itemObj[0].normal + '">' + itemObj[0].normal + '</span>';
                    html += ' </li >';
                }
                html += ' </ul >';
                html += '</li>';
                _index++;
            }
            html += "</ul>";
            $("#zhanDiv").html(html);
        }
        function OnClickTitle2(zhanid, objid) {
            $('#choseGrade' + zhanid + ' li').each(function (index, item) {
                $(item).removeClass('selected');
            });
            $("#" + objid).addClass('selected');
        }
        function saveData() {
            var strID = "";
            $("#zhanDiv .ui-choose .selected").each(function (index, item) {
                var fa_id = $(item).attr('id');
                //var arr = fa_id.split('li');
                var fa_id = fa_id.replaceAll("li", "@");
                strID += fa_id + ",";
            });
            if (strID != "") {
                strID = strID.substring(0, strID.length - 1);
            }
            if (strID == "") {
                mini.alert("请选择调度预案！");
                return;
            }
            //alert(strID);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '调度方案修改中...'
            });
            console.error('strID', strID, 'localDD_ID', localDD_ID);

            // 改变调度方案
            var strWhere = { gcddfa: strID, solutionid: localDD_ID };
            app.post('SWZZ_MODE_ES_ZHANDIANDATA/ModifyGCSSLLAREAGCGZ_SZH', strWhere, function (res) {
                JosnSel(res, 'plAdd');
            });
        }
        function saveDataNew() {
            var gldata=$.data(myData, "gldata");            
            var data = [];
            var strID = "";
            $("#zhanDiv .ui-choose .selected").each(function (index, item) {
                var fa_id = $(item).attr('id').replaceAll("li", "@");
                var id = fa_id.split("@")[0];
                var type = fa_id.split("@")[1];

                data.push({ zhanid: id, solutionid: localDD_ID, zhandata: type });

                var ddfangshi= $(item).find("span").html();
                id=id=="苏州河河口闸"?"其他工程":id;
                var gldataT=gldata.filter(function(e){
                    return e.field==id;
                });
                if(gldataT.length>0){      
                     strID += gldataT[0].mkeyid+"@" +ddfangshi+ ",";
                }
            });
            if (data.length == 0) {
                mini.alert("请选择调度预案！");
                return;
            }
            strID=strID.substring(0,strID.length-1);
            // alert(strID);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '调度方案修改中...'
            });
            console.error('strID', strID, 'localDD_ID', localDD_ID);

            // 改变分区的调度预案
            app.post('SWZZ_MODE_ES_ZHANDIANDATA_YUAN/batchResult/true', data, function (res) {
                if(res.total>0){
                    // 改变单个工程的调度预案
                    var strWhere = { gcddfa: strID, solutionid: localDD_ID };
                    app.post('SWZZ_MODE_ES_ZHANDIANDATA/ModifyGCSSLLAREAGCGZ_SZH', strWhere, function (res) {
                        JosnSel(res, 'plAdd');
                    });
                }                
            });
        }

        function loadFangAnHtml(data) {
            var gldata = groupBy(data, 'id');
            var html = "<ul class='zhanUL'>";
            var _index = 1;
            for (var num = 0; num < gldata.length; num++) {
                var zhanid = gldata[num][0].id;

                html += '<li class="zhanLI" id="' + zhanid + '">';

                var name = gldata[num][0].id;
                html += '<div style="width:150px;"><span class="c-index  c-index-hot1 c-gap-icon-right-small">' + _index + '</span>' + name + '</div>';

                html += '<ul class="ui-choose choose-type-right" id="choseGrade' + zhanid + '">';

                var fdataTemp = gldata[num];
                for (var fnum = 0; fnum < fdataTemp.length; fnum++) {
                    var itemObj = fdataTemp[fnum];
                    var cls = "";
                    html += '<li class="' + cls + '"  id="' + zhanid + "li" + itemObj.type + '"  onclick="OnClickTitle2(\'' + zhanid + '\',\'' + zhanid + "li" + itemObj.type + '\')" title="' + itemObj.fa_NAME + '">';
                    html += '<span name="' + itemObj.fa_NAME + '"  title="' + itemObj.fa_NAME + '">' + itemObj.fa_NAME + '</span>';
                    html += ' </li >';
                }
                html += ' </ul >';
                html += '</li>';
                _index++;
            }
            html += "</ul>";
            $("#zhanDiv").html(html);
        }
    </script>
</body>

</html>
