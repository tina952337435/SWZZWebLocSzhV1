            if (typeID == "Sel") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridGCData", dataResult);
                gc_choose();
            }
            else if (typeID == "GridColum") {
                console.error("GridColum");
                var dataResult = mini.decode(data.data);
                $.data(myData, "gridGCColumns", dataResult);
                onLoadData();
            }
            else if (typeID == "UpdataMethod") {
                ShowMsg(data.message);
            }
            else if (typeID == "update_batch") {
                ShowMsg(data.message);
                onLoadData();
            }
            else if (typeID == "SLJISel") {
                var strJson = data.data;
                for (var num = 0; num < strJson.length; num++) {
                    strJson[num].sortnum = 1;
                    if (strJson[num].id == "dc122ef184a4fa27") {
                        strJson[num].sortnum = 20;
                    }
                    if (strJson[num].id == "5d17cd9c5105f041") {
                        strJson[num].sortnum = 19;
                    }
                }
                strJson = sortObjectArray(strJson, ["sortnum"], "asc");
                var arr = strJson;
                var strParaMsg = "";
                var strParaNum = "";
                var html = '<span style="float:left;line-height: 33px; font-size:14px !important;">水利片区：</span>';
                html+='<ul class="onlytab" id="onlytab" style="width:1065px !important;">';
                html += '<li id="gcULAll" name="" class="onlyli start onlyliHover" onclick="OnClickTitle(this.id,\'gcUL\',\'gcULAll\',\'全部\')">全部</li>';
                for (var num = 0; num < arr.length; num++) {
                    var tempParaID = arr[num].id;
                    var cls = "onlyli";
                    if (num == 0) {
                        //str_stcds = arr[num].STCD;
                        //str_type = arr[num].TITLE;
                        //cls = "onlyli onlyliHover";
                    }
                    if (num == arr.length - 1) {
                        cls = "onlyli end";
                    }
                    var title = arr[num].title;
                    html += '<li id="' + tempParaID + '" name="' + arr[num].stcd + '" class="' + cls + '" onclick="OnClickTitle(this.id,\'gcUL\',\'' + arr[num].id + '\',\'' + title + '\')">' + title + '</li>';

                    var paraTee = strJson.filter(function (e) {
                        return e.pid == arr[num].id;
                    })
                    if (paraTee.length > 0) {
                        strParaNum += tempParaID + ",";
                        var paraNum = 25 * num;
                        if (num == 1) {
                            paraNum = 29;
                        } else if (num == 3) {
                            paraNum = 73;
                        }
                        //alert(paraNum);

                        strParaMsg += "<div id=\"treeDiv" + num + "\" class=\"topMenus_skin " + tempParaID + "\" style=\" left: " + paraNum + "%;top:33px;display: none;width:80px\"> ";

                        for (var paraII = 0; paraII < paraTee.length; paraII++) {
                            strParaMsg += "<span id=\"SpanTree" + num + paraII + "\" href=\"#\"  name=\"" + paraTee[paraII].STCD + "\" style='cursor:pointer;' onclick=\"OnClickTitle(this.id,'" + tempParaID + "','" + paraTee[paraII].id + "','" + paraTee[paraII].title + "')\">" + paraTee[paraII].TITLE + "</span>";
                        }
                        strParaMsg += "</div>";
                    }

                }
                html += '</ul>';
                $("#gcUL").html(html + strParaMsg);

                var tempSTOP = strParaNum.split(',');
                if (tempSTOP.length > 0) {
                    for (numSTOP = 0; numSTOP < tempSTOP.length; numSTOP++) {
                        var _STOPID = tempSTOP[numSTOP];
                        if (_STOPID != "") {
                            if (_STOPID == "201911150026") {
                                $('#201911150026').hover(function () {
                                    $('.201911150026').css("left", "calc(2% + 413px)");
                                    $('.201911150026').stop(true, true).fadeIn(200);
                                }, function () {
                                    $('.201911150026').stop(true, true).delay(2000).fadeOut(200);
                                });
                            }
                        }
                    }
                }
            }
            else if (typeID == "LXJISel") {
                var arr = data.data;
                var html = "";
                var html = '<span style="float:left;line-height: 33px; font-size:14px !important;">' +
                    '工程级别：</span><ul class="onlytab" id="onlytab" style="width:1050px !important;">';
                html += '<li id="gcLXULAll" name="" class="onlyli start " onclick="OnClickTitle(this.id,\'gcLXUL\',\'gcLXULAll\',\'全部\')">全部</li>';
                for (var num = 0; num < arr.length; num++) {
                    var tempParaID = arr[num].id;
                    var cls = "onlyli";
                    if (num == 0) {
                        cls += " onlyliHover ";
                        str_stcdsLevel = arr[num].stcd;
                    }
                    if (num == arr.length - 1) {
                        cls += " end";
                    }
                    var title = arr[num].title;
                    html += '<li id="' + tempParaID + '" name="' + arr[num].stcd + '" class="' + cls + '" onclick="OnClickTitle(this.id,\'gcLXUL\',\'' + arr[num].id + '\',\'' + title + '\')">' + title + '</li>';

                }
                html += '</ul>';
                $("#gcLXUL").html(html);
            }
            else if (typeID == "TYPEJISel") {
                var arr = data.data;
                var html = "";
                var html = '<span style="float:left;line-height: 33px; font-size:14px !important;">' +
                    '工程类型：</span><ul class="onlytab" id="onlytab" style="width:1050px !important;">';
                html += '<li id="gcTYPEULAll" name="" class="onlyli start onlyliHover" onclick="OnClickTitle(this.id,\'gcTYPEUL\',\'gcLXULAll\',\'全部\')">全部</li>';

                for (var num = 0; num < arr.length; num++) {
                    var tempParaID = arr[num].id;
                    var cls = "onlyli";
                    if (num == 0) {
                        cls += "";
                    }
                    if (num == arr.length - 1) {
                        cls += " end";
                    }
                    var title = arr[num].title;
                    html += '<li id="' + tempParaID + '" name="' + arr[num].stcd + '" class="' + cls + '" onclick="OnClickTitle(this.id,\'gcTYPEUL\',\'' + arr[num].id + '\',\'' + title + '\')">' + title + '</li>';

                }
                html += '</ul>';
                $("#gcTYPEUL").html(html);
            }
            else if (typeID == "MODE_ES_MODELFANGANSel") {
                getZhibiaoHtml(data.data);
            }
            else if (typeID == "UPADATA_MODEGCZHANDATA") {
                onLoadData();
                mini.unmask(document.body);
            }
            else if(typeID=="DATASel"){
                $.data(myData,"bjModelData",data.data);
                //设置预报调度任务
                modelSetTaskSZH();
            }
            else if(typeID=="GetScheduleObjList"){
                console.error(typeID,data);
                $.data(myData,"bjModelZhan",data.data);
            }
            else if(typeID=="SetTask"){//设置任务
                var info=data.info;
                if(info.success){
                    $.data(myData, "taskID",data.taskID);//模型任务编号
                    mini.unmask(document.body);
                    //加上进度条
                    var miniMsg = '<div style="text-align:center;width:100%;font-size:20px;" id="progressTitle">模型预见期计算...</div>';
                    miniMsg += '<div class="progress">';
                    miniMsg += '<div id="progress" class="progress-bar progress-bar-info progress-bar-striped active" style="width:0%;">';
                    miniMsg += '<div class="progress-value">已完成：0%</div>';
                    miniMsg += '</div>';

                    //取消计算
                    miniMsg += '<div style="margin:25px auto;width:160px;"><a id="A4" style="height:24px;line-height:24px;width:80px;" class="mini-button" onclick="cancelModel()">取消计算</a></div>';

                    miniMsg += '</div>';
                    mini.mask({
                        el: document.body,
                        cls: 'mini-mask-loadingnew',
                        html: miniMsg
                    });
                    setTimeout("modelGetTaskStatus()", 2000);
                }
            }
            else if(typeID=="GetTaskStatus"){
                var info=data.info;
                if (!info.success) {
                    $("#progressTitle").html(info.msg);
                    if (info.modelTime != undefined) {
                        var stime = $.data(myData, "stime");
                        var etime = $.data(myData, "etime");
                        var totalhour = GetDateDiff(stime, etime, 'hour');
                        var gooverhour=GetDateDiff(stime,info.modelTime, 'hour');//计算了多少时间
                        var Process=((gooverhour/totalhour)*100).toFixed(0);
                        if (Number(Process) >= 0) {
                            $("#progress").css("width", Number(Process).toFixed(0) + "%");
                            $(".progress-value").html(Number(Process).toFixed(0) + "%");
                        }
                    }
                    if (!timeout) {//说明取消计算了
                        setTimeout("modelGetTaskStatus()", 1500);
                    }
                }else{
                    //模型计算完成，取模型计算的结果
                    console.error(typeID,info);
                    SetCookie("five", "1", 1);
                    //保存方案，根据调度预案进入不同成果展示界面
                    var url = "JiSuan.html";
                    Next_Click(url);
                }
            }
            else if(typeID=="ZhanSel"){
                console.error('yuanZhan',data.data);
                $.data(myData,"yuanZhan",data.data);
            }
            else if(typeID=="SZHFJL"){
                if(data.total==0){
                    var msg = "无放江";
                    ShowMsg(msg);
                    
                }else{
                    ShowMsg(data.message);
                    onLoadData();
                }
                mini.unmask(document.body);
            }
        }

        function gc_choose() {
            //获取表格表头
            var dataResult = $.data(myData, "gridGCData");
            var dataResultColumns = $.data(myData, "gridGCColumns").columns;
            var Columns = dataResultColumns;
            if (str_stcds != "") {
                Columns = Columns.filter(function (item) {
                    return str_stcds.indexOf(item.field.toString()) > -1 || item.field.toString() == "TM";
                });
            }
            if (str_stcdsType != "") {
                Columns = Columns.filter(function (item) {
                    return str_stcdsType.indexOf(item.field.toString()) > -1 || item.field.toString() == "TM";
                });
            }
            if (str_stcdsLevel != "" && str_stcdsLevel != undefined) {
                Columns = Columns.filter(function (item) {
                    return str_stcdsLevel.indexOf(item.field.toString()) > -1 || item.field.toString() == "TM";
                });
            }

            dataResultColumns.columns = Columns;
            grid.set(dataResultColumns);
            grid.setData(dataResult);
            mini.unmask(document.body);
