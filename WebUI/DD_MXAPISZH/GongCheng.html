<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../Common/Scripts/modelHelperApi.js?ver=1.0.13"></script>
    <script src="../Common/Scripts/modelProcessingData.js?ver=1.0.13"></script>
    <link href="../Common/CSS/mxCss.css" rel="stylesheet" />
    <link href="../Common/CSS/newmxCss2.css" rel="stylesheet" />
    <title></title>
    <style type="text/css">
        html, body { margin: 0; padding: 0; border: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
        #onlytab { width: 640px !important; height: 40px; margin: auto; }
        .onlytab li { padding: 0px 6px 0px 6px; }

        /* 手写树形表格 - 严格匹配 miniUI bootstrap 主题 grid 样式 */
        .tree-wrap {
            overflow: auto; background: #fff;
            border: 1px solid #ddd;
        }
        .tree-tbl {
            width: 100%; table-layout: fixed; border-collapse: collapse;
            font-size: 9pt; font-family: Tahoma, Verdana, 宋体;
        }
        .tree-tbl thead { position: sticky; top: 0; z-index: 10; }
        .tree-tbl th {
            background: rgb(245, 250, 254) !important; border-right: 1px solid #ddd;
            border-bottom: 1px solid #ddd; color: #333; font-weight: 600;
            height: 40px; padding: 0 8px; text-align: center; white-space: nowrap;
        }
        .tree-tbl td {
            border-right: 1px solid #ddd; border-bottom: 1px solid #ddd;
            padding: 5px 8px; line-height: 18px; overflow: hidden;
            white-space: nowrap; text-overflow: ellipsis;
        }
        .tree-tbl tbody tr:hover td { background: #f5f5f5; }
        .tree-tbl tbody tr.row-alt td { background: #f7f4fd; }
        .tree-tbl tbody tr.row-alt:hover td { background: #e0dded; }

        /* 分组行 */
        .grp-row { cursor: pointer; user-select: none; }
        .grp-row td { background: #f8f9fb !important; font-weight: 700; padding: 7px 8px; }
        .grp-row:hover td { background: #ecedef !important; }
        .grp-icon { display: inline-block; width: 16px; text-align: center; transition: transform .15s; color: #666; font-size: 11px; }
        .grp-icon.open { transform: rotate(90deg); }
        .grp-count { color: #999; font-weight: 400; font-size: 11px; margin-left: 6px; }

        /* 站点行 */
        .st-row td { }
        .st-row .st-name { padding-left: 28px; }

        /* 查看过程图标 */
        .btn-look {
            display: inline-block; cursor: pointer; font-size: 16px;
            text-decoration: none; color: #3291F9; line-height: 1;
        }
        .btn-look:hover { color: #0551BD; transform: scale(1.15); }

        .mini-toolbar{
            border:0px !important;
        }
    </style>
</head>
<body>
    <div style="width: 100%;">
        <div style="width: 100%;height:80px;margin: 0px auto;text-align: center;">
            <div class="pointsRule">
                <ul id="list">
                    <li style="z-index:5;" id="one" onclick="ClickFirst()"><a><span>1.依据时间设定</span><i></i></a></li>
                    <li style="z-index:4" id="two" onclick="ClickSecond()"><a><em class="before"></em><span>2.预报降雨输入</span><i></i></a></li>
                    <li style="z-index:3" id="three" onclick="ClickThird()"><a><em class="before"></em><span>3.边界条件输入</span><i></i></a></li>
                    <li style="z-index:2" id="four" onclick="ClickFourth()"><a><em class="before"></em><span>4.工程调度</span><i></i></a></li>
                    <li style="z-index:1" id="five" onclick="ClickFifth()"><a><em class="before"></em><span>5.预测结果</span></a></li>
                </ul>
            </div>
        </div>
    </div>
    <div style="height:calc(100% - 160px);width:96%;margin:0px auto;display:flex;flex-direction:column;">
        <div class="mini-toolbar" style="flex-shrink:0;">
            <table cellpadding="0" cellspacing="0" border="0" style="margin-left: 50px;width:500px;">
                <tr><td id="gcUL"></td></tr>
                <tr><td id="gcLXUL"></td></tr>
                <tr><td id="gcTYPEUL"></td></tr>
                <tr style="display:none"><td id="sjUL"></td></tr>
                <tr style="display:none;"><td><div id="wenxinTip"></div></td></tr>
            </table>
            <div style="position: absolute; right: 10px;margin-top: -30px;">
                <a class="mini-button" onclick="editGongCheng()" style="background: rgb(58, 179, 8);">片区调度预案设定</a>
                <a class="mini-button" onclick="editFangjiang()" style="background: rgb(18, 38, 219);">采用预测放江量</a>
            </div>
        </div>
        <!-- 手写树形表格 -->
        <div class="tree-wrap" id="treeWrap" style="flex:1;">
            <table class="tree-tbl">
                <thead>
                    <tr>
                        <th style="width:60px">序号</th>
                        <th style="width:200px;text-align:left;padding-left:28px;">工程名称</th>
                        <th style="width:180px">调度方式</th>
                        <th style="width:100px">基本操作</th>
                    </tr>
                </thead>
                <tbody id="treeBody">
                    <tr><td colspan="4" style="text-align:center;color:#999;padding:40px;">数据加载中…</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <div style="height:50px;line-height:50px;">
        <div style="text-align: center; ">
            <a class="mini-button" onclick="up_click()" style="width:130px;height:37px;line-height:37px;margin-right:20px;font-size:14px;font-weight:bold;background:#0551BD;">上一步</a>
            <a class="mini-button" onclick="loadFQYUAN();startJisuan()" style="width:130px;height:37px;line-height:37px;margin-right:20px;font-size:14px;font-weight:bold;background:#3AB308;">启动模型计算</a>
        </div>
    </div>

    <style type="text/css">
        .mini-tab-active { background: #3291f9; border-color: #3291f9; color: #fff; }
    </style>
    <script type="text/javascript">
        mini.parse();
        var localDD_ID = "";

        // 全局数据
        var _rawRows = [];
        var _stationList = [];
        var _districtMap = {};
        var _levelMap = {};
        var _typeMap = {};
        var _filterDistrict = "";
        var _filterLevel = "";
        var _filterType = "";
        // 展开状态
        var _expandedGroups = {};

        top["win"] = window;

        $(function () {
            localDD_ID = $.data(myData, "DD_ID") || "0";
            OnLoad();
            loadStationList();
            app.post("/SWZZ_MODE_ES_SLTONGJI/findResult",{ "type": "2","pid": "11836313e8a414f5" },function(res){ JosnSel(res,"SLJISel"); });
            app.post("/SWZZ_MODE_ES_SLTONGJI/findResult",{ "type": "2","pid": "d31bf0965ec84005" },function(res){ JosnSel(res,"LXJISel"); });
            app.post("/SWZZ_MODE_ES_SLTONGJI/findResult",{ "type": "2","pid": "dc67c5ee0e321cd0" },function(res){ JosnSel(res,"TYPEJISel"); });
            modelGetScheduleObjList();
            app.post("SWZZ_MODE_ES_MODELFANGANZHAN/findResult", {}, function(res){ JosnSel(res,"ZhanSel"); });
        });

        function loadStationList() {
             mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            app.post("SWZZ_MODE_ES_ZHANDIAN/findResult", { "pattem": "3,3001,3002,3003,3004,3005,3006,3007,3008,3009" }, function(res){
                var list = res.data;
                _stationList = [];
                for (var i = 0; i < list.length; i++) {
                    var zhanid = list[i]["zhanid"];
                    var zhanname = list[i]["zhanname"];
                    var parts = zhanname.split('_');
                    var stName = parts.length > 0 ? parts[parts.length - 1] : zhanname;
                    var district = parts.length > 1 ? parts[0] : "";
                    _stationList.push({ id: zhanid, name: stName, fullName: zhanname, district: district, level: "", type: "" });
                }
                onLoadData();                
            });
        }
        top["win"] = window;
        function onLoadData() {
            app.post("SWZZ_MODE_ES_ZHANDIAN/FH_GetBind", {
                dayhour:"hour", datatype: "3,3001,3002,3003,3004,3005,3006,3007,3008,3009", solutionid: localDD_ID
            }, function(res){ JosnSel(res,"Sel"); });
        }

        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                _rawRows = mini.decode(data.data);
                renderTree();
                mini.unmask(document.body);
            }
            else if (typeID == "SLJISel") {
                var arr = data.data;
                for (var num = 0; num < arr.length; num++) {
                    arr[num].sortnum = 1;
                    if (arr[num].id == "dc122ef184a4fa27") arr[num].sortnum = 20;
                    if (arr[num].id == "5d17cd9c5105f041") arr[num].sortnum = 19;
                }
                arr = sortObjectArray(arr, ["sortnum"], "asc");
                _districtMap = {};
                var html = '<span style="float:left;line-height:33px;font-size:14px;">水利片区：</span><ul class="onlytab" style="width:1065px;">';
                html += '<li id="gcULAll" class="onlyli start onlyliHover" onclick="onFilterClick(\'gcUL\',\'\')">全部</li>';
                for (var num = 0; num < arr.length; num++) {
                    var cls = "onlyli";
                    if (num == arr.length - 1) cls += " end";
                    var stcds = (arr[num].stcd || "").split(",");
                    _districtMap[arr[num].id] = { id: arr[num].id, title: arr[num].title, stcds: stcds };
                    html += '<li id="' + arr[num].id + '" class="' + cls + '" onclick="onFilterClick(\'gcUL\',\'' + arr[num].id + '\')">' + arr[num].title + '</li>';
                }
                html += '</ul>';
                $("#gcUL").html(html);
                renderTree();
            }
            else if (typeID == "LXJISel") {
                var arr = data.data;
                _levelMap = {};
                var html = '<span style="float:left;line-height:33px;font-size:14px;">工程级别：</span><ul class="onlytab" style="width:1050px;">';
                html += '<li id="gcLXULAll" class="onlyli start onlyliHover" onclick="onFilterClick(\'gcLXUL\',\'\')">全部</li>';
                for (var num = 0; num < arr.length; num++) {
                    var cls = "onlyli";
                    if (num == arr.length - 1) cls += " end";
                    var stcds = (arr[num].stcd || "").split(",");
                    _levelMap[arr[num].id] = { id: arr[num].id, title: arr[num].title, stcds: stcds };
                    html += '<li id="' + arr[num].id + '" class="' + cls + '" onclick="onFilterClick(\'gcLXUL\',\'' + arr[num].id + '\')">' + arr[num].title + '</li>';
                }
                html += '</ul>';
                $("#gcLXUL").html(html);
                patchMeta(_levelMap, "level");
                renderTree();
            }
            else if (typeID == "TYPEJISel") {
                var arr = data.data;
                _typeMap = {};
                var html = '<span style="float:left;line-height:33px;font-size:14px;">工程类型：</span><ul class="onlytab" style="width:1050px;">';
                html += '<li id="gcTYPEULAll" class="onlyli start onlyliHover" onclick="onFilterClick(\'gcTYPEUL\',\'\')">全部</li>';
                for (var num = 0; num < arr.length; num++) {
                    var cls = "onlyli";
                    if (num == arr.length - 1) cls += " end";
                    var stcds = (arr[num].stcd || "").split(",");
                    _typeMap[arr[num].id] = { id: arr[num].id, title: arr[num].title, stcds: stcds };
                    html += '<li id="' + arr[num].id + '" class="' + cls + '" onclick="onFilterClick(\'gcTYPEUL\',\'' + arr[num].id + '\')">' + arr[num].title + '</li>';
                }
                html += '</ul>';
                $("#gcTYPEUL").html(html);
                patchMeta(_typeMap, "type");
                renderTree();
            }
            else if (typeID == "UpdataMethod") { ShowMsg(data.message); }
            else if (typeID == "update_batch") { ShowMsg(data.message); onLoadData(); }
            else if (typeID == "MODE_ES_MODELFANGANSel") { getZhibiaoHtml(data.data); }
            else if (typeID == "UPADATA_MODEGCZHANDATA") { onLoadData(); mini.unmask(document.body); }
            else if (typeID == "DATASel") { $.data(myData,"bjModelData",data.data); modelSetTaskSZH(); }
            else if (typeID == "GetScheduleObjList") { $.data(myData,"bjModelZhan",data.data); }
            else if (typeID == "SetTask") {
                var info = data.info;
                if (info.success) {
                    $.data(myData, "taskID", data.taskID);
                    mini.unmask(document.body);
                    var miniMsg = '<div style="text-align:center;width:100%;font-size:20px;" id="progressTitle">模型预见期计算...</div>';
                    miniMsg += '<div class="progress"><div id="progress" class="progress-bar" style="width:0%;"><div class="progress-value">已完成：0%</div></div>';
                    miniMsg += '<div style="margin:25px auto;width:160px;"><a style="height:24px;line-height:24px;width:80px;" class="mini-button" onclick="cancelModel()">取消计算</a></div></div>';
                    mini.mask({ el: document.body, cls: 'mini-mask-loadingnew', html: miniMsg });
                    setTimeout("modelGetTaskStatus()", 2000);
                }
            }
            else if (typeID == "GetTaskStatus") {
                var info = data.info;
                if (!info.success) {
                    var taskMsg=info.msg;
                    if(info.msg.indexOf("任务计算出错")>-1){
                        taskMsg=info.msg+"(任务编号："+$.data(myData, "taskID")+")";
                    }
                    $("#progressTitle").html(taskMsg);
                    if (info.modelTime != undefined) {
                        var stime = $.data(myData, "stime"), etime = $.data(myData, "etime");
                        var totalhour = GetDateDiff(stime, etime, 'hour');
                        var gooverhour = GetDateDiff(stime, info.modelTime, 'hour');
                        var Process = ((gooverhour / totalhour) * 100).toFixed(0);
                        if (Number(Process) >= 0) {
                            $("#progress").css("width", Number(Process).toFixed(0) + "%");
                            $(".progress-value").html(Number(Process).toFixed(0) + "%");
                        }
                    }
                    if (!timeout) { setTimeout("modelGetTaskStatus()", 1500); }
                } else {
                    SetCookie("five", "1", 1);
                    Next_Click("JiSuan.html");
                }
            }
            else if (typeID == "ZhanSel") { $.data(myData,"yuanZhan",data.data); }
            else if (typeID == "SZHFJL") {
                if (data.total == 0) { ShowMsg("无放江"); } else { ShowMsg(data.message); onLoadData(); }
                mini.unmask(document.body);
            }
        }

        function patchMeta(map, field) {
            for (var key in map) {
                var stcds = map[key].stcds;
                for (var i = 0; i < _stationList.length; i++) {
                    if (stcds.indexOf(_stationList[i].id) > -1) _stationList[i][field] = map[key].title;
                }
            }
        }

        function onFilterClick(objID, filterId) {
            $("#" + objID + " .onlyli").removeClass("onlyliHover");
            if (filterId === "") $("#" + objID + "All").addClass("onlyliHover");
            else $("#" + filterId).addClass("onlyliHover");
            if (objID == "gcUL") _filterDistrict = filterId;
            if (objID == "gcLXUL") _filterLevel = filterId;
            if (objID == "gcTYPEUL") _filterType = filterId;
            renderTree();
        }

        // ====== 获取站点原始调度值 ======
        function getRawVal(stationId) {
            for (var r = 0; r < _rawRows.length; r++) {
                var v = _rawRows[r][stationId];
                if (v !== undefined && v !== null && v !== "" && v !== "0" && v !== 0) return String(v);
            }
            return "—";
        }

        // ====== 构建过滤后的分组数据 ======
        function buildGroups() {
            var filtered = _stationList.slice();
            if (_filterDistrict !== "") {
                var dStcds = _districtMap[_filterDistrict] ? _districtMap[_filterDistrict].stcds : [];
                filtered = filtered.filter(function(st){ return dStcds.indexOf(st.id) > -1; });
            }
            if (_filterLevel !== "") {
                var lStcds = _levelMap[_filterLevel] ? _levelMap[_filterLevel].stcds : [];
                filtered = filtered.filter(function(st){ return lStcds.indexOf(st.id) > -1; });
            }
            if (_filterType !== "") {
                var tStcds = _typeMap[_filterType] ? _typeMap[_filterType].stcds : [];
                filtered = filtered.filter(function(st){ return tStcds.indexOf(st.id) > -1; });
            }

            var groups = {};
            for (var i = 0; i < filtered.length; i++) {
                var st = filtered[i];
                var dKey = "苏州河";
                for (var dk in _districtMap) {
                    if (_districtMap[dk].stcds.indexOf(st.id) > -1) { dKey = dk; break; }
                }
                if (!groups[dKey]) groups[dKey] = { title: (_districtMap[dKey] ? _districtMap[dKey].title : dKey), stations: [] };
                groups[dKey].stations.push(st);
            }
            return groups;
        }

        // ====== 渲染树形表格 ======
        function renderTree() {
            if (_rawRows.length === 0 || _stationList.length === 0) { console.error("renderTree skip: rows=" + _rawRows.length + " stations=" + _stationList.length); return; }
            if (Object.keys(_districtMap).length === 0) { console.error("renderTree skip: no districtMap"); return; }
            console.error("renderTree GO, groups:", Object.keys(buildGroups()).length, "rows:", _rawRows.length, "stations:", _stationList.length);

            var groups = buildGroups();
            var h = '', seq = 0, rowIdx = 0;

            for (var gKey in groups) {
                var g = groups[gKey];
                // 初始化展开状态
                if (!(gKey in _expandedGroups)) _expandedGroups[gKey] = true;
                var open = _expandedGroups[gKey];

                // 分组头行
                rowIdx++;
                h += '<tr class="grp-row" onclick="toggleGroup(\'' + gKey + '\')">';
                h += '<td><span class="grp-icon' + (open ? ' open' : '') + '">▶</span></td>';
                h += '<td colspan="3">📁 ' + g.title + '<span class="grp-count">（' + g.stations.length + '个工程）</span></td>';
                h += '</tr>';

                if (open) {
                    for (var j = 0; j < g.stations.length; j++) {
                        seq++; rowIdx++;
                        var st = g.stations[j];
                        var alt = rowIdx % 2 === 0 ? ' row-alt' : '';
                        var rawVal = getRawVal(st.id);
                        h += '<tr class="st-row' + alt + '">';
                        h += '<td style="text-align:center;">' + seq + '</td>';
                        h += '<td class="st-name">' + st.name + '</td>';
                        h += '<td style="text-align:center;">' + rawVal + '</td>';
                        h += '<td style="text-align:center;">';
                        if (!isNaN(rawVal)) {
                            h += '<a class="btn-look" href="javascript:void(0)" title="查看放江过程" onclick="event.stopPropagation();viewProcess(\'' + st.id + '\')">📊</a>';
                        }
                        h += '</td>';
                        h += '</tr>';
                    }
                }
            }

            document.getElementById("treeBody").innerHTML = h;
            mini.unmask(document.body);
        }

        function toggleGroup(gKey) {
            _expandedGroups[gKey] = !_expandedGroups[gKey];
            renderTree();
        }

        // ====== 查看过程：弹开流量过程图（参考 ShuiWei.html） ======
        function viewProcess(stationId) {
            var st = null;
            for (var i = 0; i < _stationList.length; i++) {
                if (_stationList[i].id === stationId) { st = _stationList[i]; break; }
            }
            if (!st) { mini.alert("未找到站点信息"); return; }
            var stime = $.data(myData, "stime");
            var etime = $.data(myData, "etime");
            var url = "DD_MXAPISZH/GongCheng_ViewFlow.html?stnm=" + encodeURIComponent(st.name) + "&stcd=" + stationId + "&time=" + stime + "&etime=" + etime + "&SOLUTIONID=" + localDD_ID;
            lookData("action@look", url, st.name + " 流量过程", '55%', '70%', 'true');
        }

        // ====== 原有功能 ======
        var t = null, timeout = false;
        function cancelModel() { mini.unmask(document.body); timeout = true; window.clearTimeout(t); }
        function editGongCheng() {
            var param = "stime=" + $.data(myData, "stime") + "&etime=" + $.data(myData, "stime") + "&DD_ID=" + $.data(myData, "DD_ID");
            lookData('', 'DD_MXAPISZH/GongChengEditByArea.html?' + param, '片区调度预案设定', '1300', '730', 'true');
        }
        function editFangjiang() {
            mini.mask({ el: document.body, cls: 'mini-mask-loading', html: '数据提取中，请稍等...' });
            var strWhere={ 
                "solutionid":localDD_ID, 
                "tm": $.data(myData, "stime") ,
                "enddate":$.data(myData, "etime")
            };
            app.post("SWZZ_MODE_ES_ZHANDIANDATA/ModifyGCSSLLAREAGCGZ_SZHFJL", strWhere, function(res){ JosnSel(res,"SZHFJL"); });
        }
        function OnClickTitleFA(SpanID, objID, objFax, objHNNM) {
            mini.mask({ el: document.body, cls: 'mini-mask-loading', html: '数据加载中...' });
            $("#onlytabFA .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            GetJosns("UPADATA_MODEGCZHANDATA", { FA_ID: objID }, "UPADATA_MODEGCZHANDATA");
        }
        function getZhibiaoHtml(arr) {
            var htmlSJ = '<span style="float:left;line-height:33px;font-size:14px;">调度方案：</span><ul class="onlytab" id="onlytabFA">';
            for (var num = 0; num < arr.length; num++) {
                var cls = "onlyli";
                if (num == 0) cls += " start ";
                if (GetCookie("FA_ID") != null && GetCookie("FA_ID") != "") {
                    if (arr[num].ID == GetCookie("FA_ID")) cls += " onlyliHover";
                } else { if (num == 0) cls += " onlyliHover "; }
                if (num == arr.length - 1) cls += " end";
                htmlSJ += '<li id="' + arr[num].ID + '" class="' + cls + '" onclick="OnClickTitleFA(this.id,this.id,\'' + arr[num].ID + '\',\'' + arr[num].FA_NAME + '\')">' + arr[num].FA_NAME + '</li>';
            }
            htmlSJ += '</ul>';
            $("#sjUL").html(htmlSJ);
        }
    </script>
    <script type="text/javascript">
        function OnLoad() {
            var c1 = GetCookie("one"), c2 = GetCookie("two"), c3 = GetCookie("three"),
                c4 = GetCookie("four"), c5 = GetCookie("five");
            function setLi(id, ok, isCurrent) {
                var el = $("#" + id);
                if (ok) { el.removeClass("gray").addClass(isCurrent ? "orange" : "green"); el.find('i').eq(0).removeClass("gray").addClass(isCurrent ? "orange" : "green"); }
                else { el.removeClass("green orange").addClass("gray"); el.find('i').eq(0).removeClass("green orange").addClass("gray"); }
            }
            setLi("one", c1, false); setLi("two", c2, false); setLi("three", c3, false);
            setLi("four", c4, true); setLi("five", c5, false);
        }
        function up_click() { Next_Click("ShuiWei.html"); }
        function next_click() { Next_Click("JiSuan.html"); }
        function loadFQYUAN() {
            var dd = $.data(myData, "DD_ID") || "0";
            app.postAsync("SWZZ_MODE_ES_ZHANDIANDATA_YUAN/findResult", { "strExp": dd }, function(res){ $.data(myData,"bjModelDataFQ",res.data); });
        }
    </script>
</body>
</html>
