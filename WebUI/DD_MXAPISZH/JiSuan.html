        function JosnSel(data, typeID) {
            if (typeID == "JISUANZHAN") {
                var result = data.data;
                var resultP = [{ id: "1", text: "水位" }, { id: "2,7,8,24,25", text: "流量" }, { id: "15", text: "蓄量" }, { id: "14", text: "水面积" }, { id: "19", text: "平均水位" }];
                var sortNum = 0;
                var listUser = [];
                for (var num = 0; num < resultP.length; num++) {
                    var dto = {};
                    var mtype = resultP[num]["id"];
                    var mtypeArr = mtype.split(',');
                    var text = resultP[num]["text"];
                    dto.id = mtype;
                    dto.name = text;
                    dto.type = mtype;
                    dto.stcd = mtype;
                    dto.pid = "-1";
                    dto.px = sortNum;
                    listUser.push(dto);
                    sortNum++;
                    // console.error(listUser);
                    var listTemp = result.filter(function (u) {
                        return mtypeArr.indexOf(u.type) > -1;
                    });
                    for (var _index = 0; _index < listTemp.length; _index++) {
                        dto = listTemp[_index];
                        dto.pid = mtype;
                        listUser.push(dto);
                    }
                }
                tree.loadList(listUser, "id", "pid");
                tree.select(1);
                search();
            }
            else if (typeID == "MODE_DD_SOLUTIONUpdate") {
                var objID = $.data(myData, "objIDNew");
                var DD_ID = $.data(myData, "DD_IDNew");
                window.location.href = "../DD_MX/ResultsRelease.html?ID=" + objID + "&DD_ID=" + DD_ID + "&type=list";
            }
            else if (typeID == "GetResultPresetByTimePeriod") {
                var info = data.info;
                if (info.success && info.code == 1) {
                    console.error(typeID, data);
                    var times = data.data.times;//时间数组
                    var vals = data.data.vals;//值数组

                    var _xData = [];
                    var result = [];
                    for (var num = 0; num < times.length; num++) {
                        var _tm, _data = "", _upz = null;
                        _tm = new Date(times[num]);
                        var _tmStr = _tm.format("yyyy-MM-dd HH:mm:ss");
                        _data = vals[num];
                        var node = tree.getSelectedNode();
                        //水面积和蓄量需要转单位：万m³转百万m³，平方米转平方公里
                        if (node.type == "15" || node.type == "14") {//蓄量
                            _data = _data / 1000000;
                        }
                        if (node.type == "1") {
                            var scswData = $.data(myData, "scswData");
                            if (scswData != undefined && scswData != null) {
                                var scswDataTemp = scswData.filter(function (res) {
                                    var scswTM = new Date(res.TM).format("yyyy-MM-dd HH:mm:ss");
                                    return scswTM == _tmStr;
                                });
                                _upz = scswDataTemp.length > 0 ? scswDataTemp[0].UPZ : null;//实测水位
                            }
                        }
                        if (node.type == "1") {//水位取5分钟数据
                            _xData.push({ "TM": _tm.format("M月d日H时m分"), "DATA": _data, UPZ: _upz });
                            result.push({ "TM": _tm.format("yyyy-MM-dd HH:mm:ss"), "DATA": _data, "UPZ": _upz });
                        }
                        else {//其他取一小时一个数据
                            if (_tm.getMinutes() == 0) {
                                _xData.push({ "TM": _tm.format("M月d日H时m分"), "DATA": _data, UPZ: _upz });
                                result.push({ "TM": _tm.format("yyyy-MM-dd HH:mm:ss"), "DATA": _data, "UPZ": _upz });
                            }
                        }
                    }
                    $.data(myData, "result", result);
                    $.data(myData, "_xData", _xData);
                    gridLoad();
                    mini.unmask(document.body);
                }
                else {
                    ShowMsg(info.msg);
                }
                mini.unmask(document.body);
            }
            else if (typeID == "WATER_ST_WAS_RDZNEW") {
                $.data(myData, "scswData", data.data);
                var node = tree.getSelectedNode();
                var STIME = AddHourDate($.data(myData, "stime"), -24);
                var ETIME = $.data(myData, "etime");
                modelGetResultPresetByTimePeriod(node.id, STIME, ETIME);
            }
        }

        function setColoumn(){
            var treeNodes = tree.getSelectedNode();
            var ParentNode = tree.getParentNode(treeNodes);
            var NAME = ParentNode.name;
            var danwei = "m";
            var ColoumnsName = {};
            if ($.data(myData, "ColoumnType") == "GC") {
                ColoumnsName = {
                    "TM": "时间",
                    "DATA": NAME + '(' + danwei + ')',
                    "UPZ": "实测" + NAME + '(' + danwei + ')'
                };
                if (NAME == "流量" || NAME == "蓄水量") {
                    danwei = "m³/s";
                    ColoumnsName = {
                        "TM": "时间",
                        "DATA": NAME + '(' + danwei + ')'
                    };
                }
                if (NAME == "蓄量") {
                    danwei = "百万方";
                    ColoumnsName = {
                        "TM": "时间",
                        "DATA": NAME + '(' + danwei + ')'
                    };
                }
                if (NAME == "水面积") {
                    danwei = "k㎡";
                    ColoumnsName = {
                        "TM": "时间",
                        "DATA": NAME + '(' + danwei + ')'
                    };
                }
                if (NAME == "平均水位") {
                    danwei = "m";
                    ColoumnsName = {
                        "TM": "时间",
                        "DATA": NAME + '(' + danwei + ')'
                    };
                }
            }
            else{
                ColoumnsName = {
                    "tm": "时间",
                    "tdz": NAME + '(' + danwei + ')',
                    "isHL": '备注',
                };
            }
            SetColumns(ColoumnsName, grid);
            var result = $.data(myData, "result");
            if ($.data(myData, "ColoumnType") == "GC") {
                grid.setData(result);
            }
            else{
                //计算高低潮
                console.error('result',result);
                var resultTemp=result.filter(function(e){
                    return new Date(e.TM).getTime()>=new Date($.data(myData, "stime")).getTime();
                });
                var tideHList=[];
                resultTemp.map(m=>{
                    tideHList.push([m.TM,m.DATA]);
                });
                var gdcList= computeHL(tideHList);
                console.error('gdcList',gdcList);
                grid.setData(gdcList);
            }
        }
        function computeHL(tideHList) {
            // ["2025-1-1 0:00",2.76]
            const gdcList = [];
            let vvalid = false;
            var v0 = parseFloat(tideHList[0][1]);
            var v1 = parseFloat(tideHList[1][1]);
            var v2 = parseFloat(tideHList[2][1]);

            // 3小时15分 - 3小时30分
            for (let index = 39; index < tideHList.length - 3 - 39; index++) {
                const v3 = parseFloat(tideHList[index][1]);
                const v4 = parseFloat(tideHList[index + 1][1]);
                const v5 = parseFloat(tideHList[index + 2][1]);
                const v6 = parseFloat(tideHList[index + 3][1]);
                let hlstr = "";

                if (v3 !== v5) {
                    vvalid = false;
                    if (v3 >= v0 && v3 >= v1 && v3 >= v2 && v3 >= v4 && v3 >= v5 && v3 >= v6) {
                        if (v3 >= parseFloat(tideHList[index - 6][1]) && v3 >= parseFloat(tideHList[index - 12][1]) &&
                            v3 >= parseFloat(tideHList[index - 18][1]) && v3 >= parseFloat(tideHList[index - 24][1]) &&
                            v3 >= parseFloat(tideHList[index - 30][1]) && v3 >= parseFloat(tideHList[index - 36][1]) &&
                            v3 >= parseFloat(tideHList[index + 6][1]) && v3 >= parseFloat(tideHList[index + 12][1]) &&
                            v3 >= parseFloat(tideHList[index + 18][1]) && v3 >= parseFloat(tideHList[index + 24][1]) &&
                            v3 >= parseFloat(tideHList[index + 30][1]) && v3 >= parseFloat(tideHList[index + 36][1])) {
                            vvalid = true;
                            hlstr = "H";
                        }
                    } else if (v3 <= v0 && v3 <= v1 && v3 <= v2 && v3 <= v4 && v3 <= v5 && v3 <= v6) {
                        if (v3 <= parseFloat(tideHList[index - 6][1]) && v3 <= parseFloat(tideHList[index - 12][1]) &&
                            v3 <= parseFloat(tideHList[index - 18][1]) && v3 <= parseFloat(tideHList[index - 24][1]) &&
                            v3 <= parseFloat(tideHList[index - 30][1]) && v3 <= parseFloat(tideHList[index - 36][1]) &&
                            v3 <= parseFloat(tideHList[index + 6][1]) && v3 <= parseFloat(tideHList[index + 12][1]) &&
                            v3 <= parseFloat(tideHList[index + 18][1]) && v3 <= parseFloat(tideHList[index + 24][1]) &&
                            v3 <= parseFloat(tideHList[index + 30][1]) && v3 <= parseFloat(tideHList[index + 36][1])) {
                            vvalid = true;
                            hlstr = "L";
                        }
                    }

                    if (vvalid) {
                        const map = {
                            tm: tideHList[index][0],
                            tdz: tideHList[index][1],
                            isHL: hlstr
                        };
                        gdcList.push(map);
                        index = (index - 1) + 180 / 5;
                    }

                    v0 = v1;
                    v1 = v2;
                    v2 = v3;
                }
            }
            // console.error(JSON.stringify(gdcList));
            return gdcList;
        }

            var liststr = ""; 	//拼装表格

                    else {
                        chartValue.push(value[value1.codename]);

            });

            chartValue.sort(compare);

            var option = {

                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 200 - 1;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 200 - 1;
                            }
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 200 + 1;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 200 + 1;
                            }

                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 2)); //循环价值
                        }
                        if (max_min_Name != "" & max_min_Name == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                smooth: true
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    var item = {
                        name: '平行于y轴的趋势线',
                        type: 'line',
                        markLine: {
                            itemStyle: {      //盒须图样式。
                                color: '#004E52'
                            },
                            name: 'cc',
                            data: [[
                                { coord: [tm, 0] },
                                { coord: [tm, max_min.max] }
                            ]]
                        }
                    }
                    serie.push(item);
                    return serie;
                }()
            };
