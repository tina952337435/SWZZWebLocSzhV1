            else if (typeID == "update_batch") {
                ShowMsg(data.message);
                onLoadData();
            }

                        str_choose = arr[num].stcd;
                        str_type = arr[num].title;

        function gc_choose(str_stcds) {
            str_choose = str_stcds;
            //获取表格表头
            var dataResult = $.data(myData, "gridJYData");
            var dataResultColumns = $.data(myData, "gridJYColumns").columns;
            var Columns = dataResultColumns.filter(function (item) {
                return str_choose.lastIndexOf(item.field.toString()) > -1 || item.field.toString() == "TM";
            });
            var bjswStcd = "1728053248,1728053250,1728053251,1728053252";
            for (var num = 0; num < Columns.length; num++) {
                if ((Columns[num].field != "TM" && bjswStcd.indexOf(Columns[num].field) == -1)) {
                    if (str.indexOf(Columns[num].field) == -1) {
                        var html = '<span class="icon-tip" style="width:20px;height: 15px;display:inline-block;cursor:pointer;" title="查看预报潮位" id="ZD' + Columns[num].field + '" onclick="ontransFangAn(\'' + Columns[num].field + '\',\'' + Columns[num].header + '\')"></span>';
                        Columns[num].header = Columns[num].header + html;
                    }
                    str += Columns[num].field + ",";
                }
            }
            var hoverHtml = $(".onlyliHover").html();
            if (hoverHtml != "江浙边界") {
                var item = {
                    field: "action", header: "统一操作", headerAlign: "center", align: "center",
                    filter: {
                        "type": "textbox", "onValueChanged": "onFilterChangedQuan", "emptyText": "批量输入增水值"
                    },
                    //editor: { "type":"textbox","name":"","onValueChanged":"onValueChanged"}
                };
                Columns.push(item);
            }
            dataResultColumns.columns = Columns;
            grid.set(dataResultColumns);
            grid.setData(dataResult);
            new CopyExcel(grid);        //Excel互操作插件
            mini.unmask(document.body);
        }

        function onDrawSummaryCell(e) {
            var result = e.result;

            if (field == "TM") {
                var s = "<span style='color:Brown;'>";

                s += "</span>";
                e.cellHtml = s;

            if (field != "TM" && field != "action") {
                if (data.length > 0) {

                    var s = '';
                    var MaxZ = 0;
                    for (var num = 0; num < data.length; num++) {
                        var ybz = data[num][field];
                        var tm = data[num]["TM"];
                        if (ybz > MaxZ) {
                            s = Number(ybz).toFixed(2) + "<br>" +new Date( tm).format("MM-dd HH:mm");

                        }
                    }
                    if (MaxZ == 0) {
                        s = '-'
                    }
                    e.cellHtml = s;
                }
            }
        }
