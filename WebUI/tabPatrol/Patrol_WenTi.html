
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>巡检问题汇总</title>
    <link href="../Common/bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
	<!-- <link href="/arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" /> -->
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 98%;
            overflow: hidden;
            font-size: 14px;
        }
        .onlytab li {
    list-style: none;
    border: 1px #3291f9 solid;
    float: left;
    background-color: White;
    width: 30%;
    height: 35px;
    line-height: 35px;
    font: 14px/35px"arial";
    text-align: center;
}
    </style>
</head>
<body class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar">
                <div class="myrow">
                    <div class="col-md-5">
              开始日期&nbsp;&nbsp;
			<input id="STIME" class="mini-datepicker" style="width:120px;" format="yyyy-MM-dd" showtime="false" showOkButton="false" showClearButton="false" ondrawdate="onMinDrawDate" />&nbsp;&nbsp;
			&nbsp;&nbsp;结束日期&nbsp;&nbsp;
			<input id="ETIME" class="mini-datepicker" style="width:120px;" format="yyyy-MM-dd" showtime="false" showOkButton="false" showClearButton="false" ondrawdate="onMaxDrawDate" />
			&nbsp;&nbsp;关键字
            &nbsp;&nbsp;<input id="key" class="mini-textbox" emptytext="请输入关键字" style="height: 30px;width: 120px;" />
             <button type="button" class="btn btn-primary" onclick="search()">查询</button>
         </div>
         <div class="col-md-4">
                <ul class="onlytab">
                    <li id="TitleLi0" onclick="OnClickTitle(this.id,'')" class="onlyli start onlyliHover">全部</li>
                    <li id="TitleLi1" onclick="OnClickTitle(this.id,'SW')" class="onlyli">水文站维护记录</li>
                    <li id="TitleLi3" onclick="OnClickTitle(this.id,'YJZ')" class="onlyli end">预警站维护记录</li>
                </ul>
         </div>
        </div> 
    </div>
    </div>
	
	<div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 40px);height: -moz-calc(100% - 40px);height: calc(100% - 40px);margin-top:1px;" allowalternating="true"
		 borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[10,20,30,40]" pagesize="10" 
		 ondrawcell="ondrawcell" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" showReloadButton="false" >
        <div property="columns">
            <div type="indexcolumn" width="20" headeralign="center" align="center">序号</div>
            <!-- <div field="stcd" width="60" align="center" headerAlign="center" allowSort="false">站码</div> -->
            <div field="stnm" width="80" align="center" headerAlign="center" allowSort="true">站名</div>
            <!-- <div field="title" width="120" align="center" headerAlign="center" allowSort="true">维护单位</div> -->
            <div field="owen" width="60" align="center" headerAlign="center" allowSort="true">维护人员</div>
            <div field="TM" width="80" align="center" headerAlign="center" allowSort="true">问题时间</div>
            <div field="explains" width="60" align="center" headerAlign="center" allowSort="true">检查项</div>
            <div field="nt" width="60" align="center" headerAlign="center" allowSort="true">情况汇总</div>
            <div field="state" width="60" align="center" headerAlign="center" allowSort="true">状态</div>
            <div field="cltm" width="80" align="center" headerAlign="center" allowSort="true">处理时间</div>
            <div field="clowen" width="60" align="center" headerAlign="center" allowSort="true">处理人员</div>
            <div field="action" name="action" width="70" align="center" headerAlign="center" allowSort="true"  renderer="onActionRenderer">基本操作</div>
        </div>
    </div>
    <script>
        mini.parse();
        var grid = mini.get("grid1");
        var gcList = mini.get("GCList");
        var PathName=GetQueryString("PATHNAME");
        var myData = [];
        $(function () {
            if(GroupArray.contains(GetCookie("GROUPID"))){ 
					grid.showColumn("action");
				}else{ 
					grid.hideColumn("action");
				}
            var tm = new Date();
            mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -365));
            mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));
            $.data(myData, "PATHNAME", ""); 
            search();
        });
        function OnClickTitle(objID,  objPathName) {
            var only = $(".onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $.data(myData, "PATHNAME", objPathName);
            setTimeout('search()', 100);
        }
         //==加上编辑列代码
         function onActionRenderer(e) {
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            var s = ''; 
        var HeadTitle="水文站现场维护记录表";
        var url='/tabPatrol/PatrolSW_View.html?ID='+record.itemid+'&HEADTITLE='+HeadTitle;
        if(record.pathname=="YJZ"){
            HeadTitle="预警站现场维护记录表";
          url='/tabPatrol/Patrol_View.html?ID='+record.itemid+'&HEADTITLE='+HeadTitle;
        }
			 s = '<img style="cursor:pointer;" onclick="lookData(\'ID@' + record.itemid +
					',HEADTITLE@'+HeadTitle+',STCD@'+record.stcd+',STNM@'+record.stnm+',PATHNAME@'+record.pathname+'\',\''+url+'\',\''+HeadTitle+'\',\'1200\',\'650\',\'true\')" src="../Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
                    url="/tabPatrol/Patrol_ChuZHi.html?PID="+record.zt_ID+"&PATHNAME="+record.itemid+"&STAUES=1&NAMES="+record.explains;
				s += '<img style="cursor:pointer;" onclick="editData(\'PID@' + record.itemid +
					',HEADTITLE@'+HeadTitle+',STCD@'+record.stcd+',STNM@'+record.stnm+',PATHNAME@'+record.pathname+'\', \''+url+'\', \''+HeadTitle+'\', \'1200\',\'750\', \'true\')" src="../Common/miniui/themes/icons/user.png" title="处置" />&nbsp;';
			// 	s += '<img style="cursor:pointer;" onclick="del(\'' + record.id +
			// 		'\')" src="../Common/miniui/themes/icons/remove.png" title="删除'+HeadTitle+'" />&nbsp;';
            return s;
        }
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            setTimeout(function () {
                var strWhere={};
                strWhere["STIME"] = mini.get("STIME").getFormValue()+" 00:00:00";
            strWhere["ETIME"] = mini.get("ETIME").getFormValue()+" 23:59:59";
            strWhere["key"] = mini.get("key").getValue();
            strWhere["pathname"] = $.data(myData, "PATHNAME");
                app.get("/itemZhuanti/findWenTiList", strWhere, function (res) {
				JosnSel(res, "Sel");
			})
            }, 100);
        } 
        function JosnSel(data, typeID) {
            if (typeID == "Sel") { 
                var strJson=sortObjectArray(data.data, ['TM'], 'desc');
                data.data=strJson;
                fillData(0, grid.pageSize, data, grid);
                // PageServerFill(grid, data);
            }  
                mini.unmask(document.body);

        }

        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
              if (field == "times") {
                var s = '';
                if(value!=undefined){
                    s=formatDate((value)).format("yyyy-MM-dd");
                }
                e.cellHtml = s;
            }else if (field == "state") {
                var s = '';
                if(value=='1'){
                    e.cellStyle = "background-color:#F88DF2;";
                    s='待处理';
                }else{
                    s='已完成';
                }
                e.cellHtml = s;
            }else if (field == "cltm") {
                var s = '';
                if(value!=undefined){
                    s=formatDate((value)).format("yyyy-MM-dd HH:mm:ss");
                } 
                e.cellHtml = s;
            }
        }
        
    </script>
</body>
</html>
