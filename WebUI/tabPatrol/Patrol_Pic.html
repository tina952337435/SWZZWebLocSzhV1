	<body>
		<table width="100%" cellpadding="0" cellspacing="0" border="0" class="table1">
			<tr id="tr1">
				<td style="width:50%;" valign="top">
					<div style="height:400px;overflow-x:auto;width:95%;">
						<input type="file" name="file" id="file" multiple class="file-loading" />
					</div>
				</td>
				<td style="width:50%;" valign="top">
					<div style="border: solid 1px #EFEFEF;padding-bottom: 5px;">
					<textarea id="NOTE" name="NOTE" rows="30" style="width:90%; height:100px;margin-top:20px;margin-left:20px;" class="mini-textarea"
					 emptytext="请输入备注"></textarea>
					</div> 
							<div>
							<ul class="gallery" id="divJCPic">无图片</ul>
						</div>
				</td>
			</tr>
			<tr id="tr2">
				<td colspan="2" align="center">
                    <button type="button" class="btn btn-primary" onclick="onOk()">保存</button>

				</td>

		<script src="../Common/bootstrap-fileinput/js/fileinput.min.js" type="text/javascript"></script>
		<script src="../Common/bootstrap-fileinput/js/fileinput_locale_zh.js" type="text/javascript" charset="utf-8"></script>
		<script type="text/javascript">
			mini.parse();
			var myData = [];
			var ITEM_DETAILID = GetQueryString("PID");
			var PATHNAME = GetQueryString("PATHNAME");
			var NAME = GetQueryString("NAMES");
			var STAUES = GetQueryString("STAUES");
			var FLAG = GetQueryString("FLAG");
			var WD_TYPE = PATHNAME;
            //标准方法接口定义
            $(function(){
                if(FLAG!=null){
                    $.data(myData, "FLAG", FLAG);
                }else{
                    $.data(myData, "FLAG", "");
                }
                var postParam={};
                postParam["pid"]=ITEM_DETAILID;
                postParam["pathname"]=PATHNAME;
                app.get("/itemPic/selectList", postParam, function (res) {
                    JosnSel(res, "Sel");
                })
            })
			function SetData(data) {
				if (data.FLAG != undefined) {
					$("#tr1").hide();
					$("#tr2").hide();
				}
				$.data(myData, "FLAG", data.FLAG);


 
			}

			function OpenView(objSrc) {
				view.img_show(objSrc);
			}

			function JosnSel(ResultData, typeID) {
				if (typeID == "Sel") {
					$("#divJCPic").html("");
					if (ResultData.total > 0) {
						var strJson=sortObjectArray(ResultData.data, ['staues'], 'asc');
						for (num = 0; num < strJson.length; num++) { 
                            var item=strJson[num];
                            // var _tempResult=PublicResult.filter(function(evt){
                            //     return evt["id"]==item.id;
                            // })
                            // if(_tempResult.length==0){
                            //     PublicResult.push({"id":item.id,"note":item["note"],"filepath":item["url"],"tm":formatDate(item["tm"]).format("yyyy-MM-dd HH:mm:ss")})
                            // }
                            mini.get("NOTE").setValue(item["note"]);
							var strMsg = '';
							strMsg += '<li id="LI' + item.id + '">';
							strMsg += '<div class="file-preview-frame file-preview-success"   data-fileindex="-1">';
							var tempNote = "";
							if (item.staues != undefined) {
								if (item.staues == "0") {
									tempNote += "【问题照片】"
								} else {
									tempNote += "【处置照片】"
								}
							}
							tempNote += item.name == undefined ? item.url : item.name;
							strMsg += '<img onclick="OpenView(this.src)" src="' + HttpUrl + WD_TYPE + '/' + item.url +
								'" class="file-preview-image" title="' + tempNote + '" alt="' + tempNote +
								'" style="width:auto;height:160px;">';
							strMsg += '<div class="file-thumbnail-footer">';
                            strMsg += '<div class="file-footer-caption" title="' + tempNote + '">' + tempNote + '</div>';
							if ($.data(myData, "FLAG") == "") {
								strMsg += '<div class="file-actions">';
								strMsg += '<div class="file-footer-buttons">';
								strMsg +=
									'<button type="button" class="kv-file-upload btn btn-xs btn-default" title="上传文件" style="display: none;">';
								strMsg += ' <i class="glyphicon glyphicon-upload text-info"></i>';
								strMsg += ' </button>';
								if (STAUES == item.staues) {
									strMsg +=
										' <button type="button" class="kv-file-remove btn btn-xs btn-default" title="删除文件"><i class="glyphicon glyphicon-trash text-danger"  onclick="Del(\'' +
                                            item.id + '\',\'LI' +item.id + '\')"></i></button>';
								}

								strMsg += ' </div>';
								strMsg +=
									'  <div class="file-upload-indicator" title="上传"><i class="glyphicon glyphicon-ok-sign text-success"></i></div>';
								strMsg += '  <div class="clearfix"></div>';
								strMsg += ' </div>';
							}

							strMsg += '  </div>';
							strMsg += '</div>';
							strMsg += '</li>';
							$("#divJCPic").append(strMsg);
						}
					} else {
						$("#divJCPic").html("<li class='liNOJcPic' style='width:100%;color:black;'>暂无数据</li>");
					}
				} else if (typeID == "PL") {
					showTips(ResultData.message)
					if (ResultData.message != "操作成功") { 
						onOk();
					}else{
						PublicResult=[];
					}
				} else if (typeID == "DATA_ITEM_PICDel") {
					showTips(ResultData.message)
					if (ResultData.message == "操作成功") {
						$("#" + $.data(myData, "LIID")).hide();
					}
				}
			}
function GetData(){
    return mini.get("NOTE").getValue();
}
			function Del(objID, LiID) {
				if (objID != "") {
					mini.confirm("确定删除记录？", "确定？",
						function(action) {
							if (action == "ok") { 
                                var postParam={};
                                    postParam["stcd"]=objID;
                                    app.get("/itemPic/deleteOne", postParam, function (res) {
                                        JosnSel(res, "DATA_ITEM_PICDel");
                                    })
								$.data(myData, "LIID", LiID);
							}
						}
					);
				} else {
					var tempResult = PublicResult.filter(function(e) {
						return e.LIID != LiID;
					});
					PublicResult = tempResult;
					$("#" + LiID).hide();
				}
			}
			$(function() {
				var oFileInput = new FileInput();
				oFileInput.Init("file", baseurl+"/common/photoUpload");
			})
		</script>
		<script type="text/javascript">
			var PublicResult = [];
			var FileInput = function() {
				var oFile = new Object();

				//初始化fileinput控件（第一次初始化）
				oFile.Init = function(ctrlName, uploadUrl) {
					var control = $('#' + ctrlName);
					//初始化上传控件的样式
					control.fileinput({
						language: 'zh', //设置语言
						uploadUrl: uploadUrl, //上传的地址
						// allowedFileExtensions: ['jpg', 'gif', 'png'],//接收的文件后缀
						showClose: false,
						showUpload: true, //是否显示上传按钮
						showRemove: true, //是否显示删除按钮
						showCaption: false, //是否显示标题
						showUploadedThumbs: false,
						browseClass: "btn btn-primary", //按钮样式
						textEncoding: "UTF-8",
						dropZoneEnabled: true, //是否显示拖拽区域
						//minImageWidth: 50, //图片的最小宽度
						//minImageHeight: 50,//图片的最小高度
						//maxImageWidth: 1000,//图片的最大宽度
						//maxImageHeight: 1000,//图片的最大高度
						maxFileSize: 204800, //单位为kb，如果为0表示不限制文件大小
						//minFileCount: 0,
						maxFileCount: 100,
						enctype: 'multipart/form-data',
						validateInitialCount: true,
						previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",

						msgFilesTooMany: "选择上传的文件数量({n}) 超过允许的最大数值{m}！",
						uploadExtraData: function(previewId, index) { //额外参数的关键点
							$(".liNOJcPic").hide();
							var obj = {};
							obj.PATHNAME = WD_TYPE;
							obj.PDFTOTIF = false;
							obj.TYPEFILE = "file";
							obj.token = "768ADC6A9E72BFEE4891F1F98650FEEE";
							return obj;
						}
					});

					var FileResult = [];
					//导入文件上传完成之后的事件
					$("#file").on("fileuploaded", function(event, data, previewId, index) {
						var strResult = data.response.data;
						if (strResult == undefined) {
							//toastr.error('文件格式类型不正确');
							return;
						}
						// FileResult.push({
						// 	strResult
						// });
					
						if (strResult.length > 0) {
							for (num = 0; num < strResult.length; num++) {
								var LiID = UUID(19,16);
                                strResult[num]["LIID"] = 'LI' + LiID;
                                strResult[num]["tm"]=new Date().format("yyyy-MM-dd HH:mm:ss");
                                strResult[num]["filepath"]=strResult[num].fileName;
								PublicResult.push(strResult[num]);
								//PublicResult.push({ "FILENAME": strResult[num].FILENAME, "FILEPATH": strResult[num].FILEPATH });
								var strMsg = '';

								strMsg += '<li id="LI' + LiID + '">';
								strMsg += '<div class="file-preview-frame file-preview-success" id="  data-fileindex="-1">';
								strMsg += '<img onclick="OpenView(this.src)" src="' + HttpUrl + WD_TYPE + '/' + strResult[num].fileName +
									'" class="file-preview-image" title="' + NAME + '" alt="' + strResult[num].fileName +
									'" style="width:auto;height:160px;">';
								strMsg += '<div class="file-thumbnail-footer">';
								strMsg += '<div class="file-footer-caption" title="' + NAME + '">' + NAME +
									'</div>';
								strMsg += '<div class="file-actions">';
								strMsg += '<div class="file-footer-buttons">';
								strMsg +=
									'<button type="button" class="kv-file-upload btn btn-xs btn-default" title="上传文件" style="display: none;">';
								strMsg += ' <i class="glyphicon glyphicon-upload text-info"></i>';
								strMsg += ' </button>';
								strMsg +=
									' <button type="button" class="kv-file-remove btn btn-xs btn-default" title="删除文件"><i class="glyphicon glyphicon-trash text-danger" onclick="Del(\'\',\'LI' +
									LiID + '\')"></i></button>';
								strMsg += ' </div>';
								strMsg +=
									'  <div class="file-upload-indicator" title="上传"><i class="glyphicon glyphicon-ok-sign text-success"></i></div>';
								strMsg += '  <div class="clearfix"></div>';
								strMsg += ' </div>';
								strMsg += '  </div>';
								strMsg += '</div>';
								strMsg += '</li>';
								$("#divJCPic").append(strMsg);
							}
                        }
                        $.data(myData, "Result", PublicResult);
					});

				}
				return oFile;
			};

			function onOk() {
				var tempData = [];
				if (PublicResult.length > 0) {
					for (num = 0; num < PublicResult.length; num++) {
                        var _note=mini.get("NOTE").getValue();
                        if(PublicResult[num]["note"]!=undefined){
                            _note=PublicResult[num]["note"];
                        }
						var strData = {
							"id": UUID(19,16),
							"pid": ITEM_DETAILID,
							"pathname": PATHNAME,
							"name": NAME,
							"note": _note,
							"url": PublicResult[num].filepath,
							"tm": PublicResult[num].tm,
							"staues": STAUES,
							"username": GetCookie("LOGINNAME")
                        };
                        
						tempData.push(strData);
					}
					var postParam={};
					postParam["itemPic"]=JSON.stringify(tempData);
					app.post("/itemPic/BulkIsert", postParam, function (res) {
						JosnSel(res, "PL");
					})
				}else{
					showTips("无照片需要上传")
				}
                

			}
		</script>
	</body>
</html>
