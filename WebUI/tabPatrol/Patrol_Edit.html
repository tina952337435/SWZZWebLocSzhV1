        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var strJson = data.data;
                if (data.total > 0) {
                    infoData(strJson);
                }
            } else if (typeID == "Update") {
                showTips(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            } else if (typeID == "Add") {
                showTips(data.message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            } else if (typeID == "维护单位") {
                var strJson = data.data;
                infoData(strJson);
            }

        function infoData(strJson){

                }

                }
                if(strJson.zhuantiList!=null){
                    var item=mini.decode(strJson.zhuantiList[0]);  
                       FromSetData(item);
                       $("#ZCSava").show(); 
                       if(item.savastate!=undefined){
                            if(item.savastate=="1"){
                                $("#ZCSava").hide();
                            } 
                       }
                }
                if(strJson.zhuantiZList!=null){
                    var item= strJson.zhuantiZList;

                                mini.get("SCG1").setValue(strWhere["scg"])

                                if(strWhere["SCTM"]!=undefined){

                                mini.get("SWZ2").setValue(strWhere["swz"])
                                if(strWhere["swtm"]!=undefined){

                                mini.get("SCG2").setValue(strWhere["scg"])

                }
        }
