<!DOCTYPE html>

<head>

    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }

        legend {
            display: block;
            -webkit-padding-start: 2px;
            -webkit-padding-end: 2px;
            border-width: initial;
            border-style: none;
            border-color: initial;
            border-image: initial;
            width: 10%;
            font-size: 14px;
        }

        .lie1 {
            width: 10%;
        }

        fieldset {
            -webkit-padding-before: 0.35em;
            -webkit-padding-start: 0.75em;
            -webkit-padding-end: 0.75em;
            -webkit-padding-after: 0.625em;
        }

        .file-preview {
            border: 0px;
        }

        .btn-primary {
            background-color: #3291F9;
            border-color: #3291F9;
        }

        .btn-primary.active,
        .btn-primary:active,
        .btn-primary:active:hover,
        .btn-primary.focus,
        .btn-primary:focus,
        .btn-primary:hover {
            color: white;
            background-color: #007aff;
            border-color: #007aff;
        }

        .btn-file {
            margin-left: 17px;
        }
    </style>
</head>

<body>
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="GridView" id='GridView1'
            style=' background-color: White; width: 100%; border-collapse: collapse;'>
            <tr>
                <td colspan="4" align="center" style="font-size:16px; color:Black; height:10px; ">
                    <!--电话通知单-->
                    <input id="WD_ID" name="WD_ID" class="mini-textbox Span90" style="display:none;" />
                    <input id="WD_XUHAO" name="WD_XUHAO" class="mini-textbox Span90" style="display:none;" />
                    <input id="WD_TYPE" name="WD_TYPE" class="mini-textbox Span90" style="display:none;" />
                    <input id="WD_FILE" name="WD_FILE" class="mini-textbox Span90" style="display:none;" />
                    <input id="WD_SIZE" name="WD_SIZE" class="mini-textbox Span90" style="display:none;" />
                    <input id="WD_KZNAME" name="WD_KZNAME" class="mini-textbox Span90" style="display:none;" />
                </td>
            </tr>
            <tr>

                <td colspan="2" align="left" style="padding-left:10px;width:45%;" valign="top">
                    <fieldset style="width:95%;border:solid 1px #aaa;position:relative;">
                        <legend style="width:12%;">附件信息</legend>
                        <div style="height:auto;overflow-x:auto;width:95%;">
                            <div class="container-fluid">
                                <form id="form" action="/common/fileUpload" method="post"
                                    enctype="multipart/form-data">
                                    <div class="row form-group">
                                        <label class="col-md-4">资料上传:</label>
                                        <div class="col-sm-12">
                                            <!-- <input id="input-id" name="file" multiple type="file" data-show-caption="true"> -->
                                            <input id="input-id" name="file" type="file" data-show-caption="false">

                            </div>
                        </div>
                    </fieldset>
                </td>
                <td colspan="2" align="left" style="padding-left:5px;padding-bottom:10px;width:45%;" valign="top">
                    <fieldset style="width:95%;border:solid 1px #aaa;position:relative;">
                        <legend style="width:12%;">文件信息</legend>
                        <div id="editForm1" style="padding:5px;">
                            <table style="width:100%;" class="table1">
                                <tr>
                                    <td class="lie1" align="right">
                                        期号
                                    </td>
                                    <td class="lie2" align="center">
                                        <input id="WD_YEAR" name="WD_YEAR" class="mini-textbox DivSpan70"
                                            required="true" />
                                        年
                                        <input id="WD_NUM" name="WD_NUM" class="mini-textbox DivSpan70"
                                            required="true" />
                                        号
                                    </td>
                                </tr>
                                <tr>
                                    <td class="lie1" align="right">
                                        文件名称
                                    </td>
                                    <td class="lie2">
                                        <input id="WD_NAME" name="WD_NAME" class="mini-textbox Span90"
                                            required="true" />
                                    </td>
                                </tr>
                                <tr>
                                    <td class="lie1" align="right">
                                        备注
                                    </td>
                                    <td class="lie2">
                                        <textarea id="WD_NOTE" name="WD_NOTE" rows="30" style="width:90%; height:100px;"
                                            class="mini-textarea" emptytext="请输入备注"></textarea>
                                    </td>
                                </tr>
                                <tr>
                                    <td class="lie1" align="right">
                                        上传人

                                    <td class="lie1" align="right">
                                        时间
                                    </td>
                                    <td class="lie2">

                                            format="yyyy-MM-dd HH:mm:00" timeFormat="HH:mm" showTime="true"
                                            showOkButton="false" showClearButton="false" />

                                <tr align="center">
                                    <td colspan="2" class="lie2" align="center"

                </td>

    <script src="../Common/bootstrap-fileinput/js/fileinput.min.js" type="text/javascript"></script>
    <script src="../Common/bootstrap-fileinput/js/fileinput_locale_zh.js" type="text/javascript" charset="utf-8"></script>
    <script type="text/javascript">
        function initFileInput(ctrlName) {
            var control = $('#' + ctrlName);
            control.fileinput({
                language: 'zh', //设置语言
                uploadUrl: baseurl + "/common/fileUpload", //上传的地址
                // allowedFileExtensions: ['jpg', 'gif', 'png'],//接收的文件后缀
                //uploadExtraData:{"id": 1, "fileName":'123.mp3'},
                uploadAsync: true, //默认异步上传
                showUpload: true, //是否显示上传按钮
                showRemove: true, //显示移除按钮
                showPreview: true, //是否显示预览
                showCaption: false, //是否显示标题
                browseClass: "btn btn-primary", //按钮样式
                //dropZoneEnabled: true,//是否显示拖拽区域
                //minImageWidth: 50, //图片的最小宽度
                //minImageHeight: 50,//图片的最小高度
                //maxImageWidth: 1000,//图片的最大宽度
                //maxImageHeight: 1000,//图片的最大高度
                //maxFileSize: 0,//单位为kb，如果为0表示不限制文件大小
                //minFileCount: 0,
                //maxFileCount: 10, //表示允许同时上传的最大文件个数
                enctype: 'multipart/form-data',
                validateInitialCount: true,
                previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",
                msgFilesTooMany: "选择上传的文件数量({n}) 超过允许的最大数值{m}！",
                uploadExtraData: function (previewId, index) { //参数
                    var obj = {};
                    obj.PATHNAME = mini.get("WD_TYPE").getValue();
                    obj.PDFTOTIF = true;
                    obj.token = "768ADC6A9E72BFEE4891F1F98650FEEE";
                    return obj;
                }
            }).on('filepreupload', function (event, data, previewId, index) { //上传中
                var form = data.form,
                    files = data.files,
                    extra = data.extra,
                    response = data.response,
                    reader = data.reader;
                console.log('文件正在上传');
            }).on("fileuploaded", function (event, data, previewId, index) { //一个文件上传成功
                console.log('文件上传成功！' + data.id);
                console.warn(data)

                var strResult = data.response.data;
                console.warn(strResult)
                if (strResult == undefined) {
                    return;
                }
                $.data(myData, "Result", strResult);
                if (strResult.length > 0) {
                    if (mini.get("WD_FILE").getValue() == "") {
                        mini.get("WD_FILE").setValue(strResult[0].fileName);
                        mini.get("WD_SIZE").setValue(strResult[0].fileSize);
                        mini.get("WD_SIZE").setValue(strResult[0].fileSize);
                    }
                }
                if (data.files.length > 0) {
                    var strName = data.files[0]["name"];
                    var tempIndex = strName.lastIndexOf(".");
                    var tempName = strName.substring(0, tempIndex);
                    var tempWD_KZNAME = strName.substring(tempIndex, strName.length);
                    console.log(tempName)
                    console.log(tempWD_KZNAME)
                    console.log(strName)
                    mini.get("WD_NAME").setValue(tempName)
                    mini.get("WD_KZNAME").setValue(tempWD_KZNAME);
                }

            }).on('fileerror', function (event, data, msg) { //一个文件上传失败
                console.log('文件上传失败！' + data.id);


            })
        }
    </script>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");

        function SetData(data) {
            console.error(data)
            mini.get("WD_TYPE").setValue(data.WD_TYPE);
            initFileInput("input-id");

            if (data.action == "edit") {
                mini.get("WD_ID").setValue(data.WD_ID);
                var strWhere = {
                    WD_ID: data.WD_ID
                };
                GetJosns("DATA_WD_LISTTABLESel", strWhere, "Sel");
            } else if (data.action == "new") {
                var strID = UUID(19, 16);
                mini.get("WD_ID").setValue(strID);
                mini.get("WD_OWEN").setValue(GetCookie("LOGINNAME"));
                var tm = new Date();
                if (data.TM != undefined && data.TM != null) {
                    mini.get("WD_TIME").setValue(data.TM + tm.format(" HH:mm:ss"));
                } else {
                    mini.get("WD_TIME").setValue(tm.format("yyyy-MM-dd HH:mm:ss"));
                }
                mini.get("WD_YEAR").setValue(tm.format("yyyy"));
                if(data.ORDERBYID!=undefined){
                    mini.get("WD_NUM").setValue(data.ORDERBYID);
                }
            }


        }

        function onCancel(e) {
            CloseWindow("cancel");
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }

        function onOk(e) {
            //保存数据
            form.validate();
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("WD_ID").getValue();
            } else {
                var strId = UUID(19, 16);
                mini.get("WD_ID").setValue(strId);
            }

            //var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            if (mini.get("WD_FILE").getValue() != undefined) {
                var wd_pdf = mini.get("WD_FILE").getValue().replaceAll(mini.get("WD_KZNAME").getValue(), ".pdf")
                var strWhere = {
                    "wd_ID": UUID(19,16),
                    "wd_FILE": mini.get("WD_FILE").getValue(),
                    "wd_PDF": wd_pdf,
                    "wd_SIZE": mini.get("WD_SIZE").getValue(),
                    "wd_KZNAME": mini.get("WD_KZNAME").getValue(),
                    "wd_NAME": mini.get("WD_NAME").getValue(),
                    "wd_TYPE": mini.get("WD_TYPE").getValue(),
                    "wd_XUHAO": mini.get("WD_XUHAO").getValue(),
                    "wd_YEAR": mini.get("WD_YEAR").getValue(),
                    "wd_NUM": mini.get("WD_NUM").getValue(),
                    "wd_NOTE": mini.get("WD_NOTE").getValue(),
                    "wd_OWEN": mini.get("WD_OWEN").getValue(),
                    "WD_TIME": new Date().format("yyyy-MM-dd HH:mm:ss")
                };
                app.post("/wdListtable/insertOne", strWhere, function (res) {
                    JosnSel(res, "Add");
                })

            } else {
                mini.alert("请先上传文件");
                mini.unmask(document.body);
            }
        }
        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
                    FromSetData(o);
                }
            }
            else if (typeID == "Add") {
                //mini.alert(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            
            mini.unmask(document.body);
        }

    </script>

</body>

</html>
