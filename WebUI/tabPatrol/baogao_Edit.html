    <div style="width:100%;" id="form1">
        &nbsp; &nbsp;
     
        <table cellpadding="0" cellspacing="0" border="0" style="width:100%;height:100%;">

                    检查情况
                </td>
            </tr>
            <tr>
                <td align="right" style="width:40%;">
                    检查日期：
                </td>
                <td class="uploader blue" align="left">
                    &nbsp;<input type="text" id="TM" class="mini-datepicker " value="2018-12-18" />&nbsp;&nbsp;
                </td>
            </tr>
            <tr>
                <td align="right">
                   检查报告：
                </td>
                <td class="uploader blue" align="left">
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="uploader blue">
                            <input type="text" class="filename" readonly="readonly" style="border-right:1px solid;" /> 
                            <input type="button" name="file" class="button" value="选择文件" />
                            <input type="file" name="Fdata" size="30" accept=".doc,.docx,.pdf" />
                        </div>
                        <input type="text" name="filetype"  value="Fdata" style="display: none;"/>
                            <input type="text" id="PATHNAME" name="PATHNAME"  value="" style="display: none;"/>
                            <input type="text" id="PDFTOTIF" name="PDFTOTIF"  value="true" style="display: none;"/>
                    </form>
                </td>
            </tr>
          
            <tr>
                <td align="right">
                    整改报告：
                </td>
                <td class="uploader blue" align="left">
                    <form id="uploadFormVideo" enctype="multipart/form-data">
                        <div class="uploader green">
                            <input type="text" class="filename" readonly="readonly" />

                            <input type="file" name="txt_file" size="30" accept=".doc,.docx,.pdf" />
                        </div>
                        <input type="text" name="filetype"  value="txt_file" style="display: none;"/>
                        <input type="text" id="PATHNAME1" name="PATHNAME"  value="" style="display: none;"/>
                        <input type="text" id="PDFTOTIF" name="PDFTOTIF"  value="true" style="display: none;" />
                    </form>


                </td>
            </tr>
            <tr>
                <td align="center" colspan="2">
                    <span class="uploader blue">
                        <input type="button" class=" button" value="报告上传" onclick="ajaxFileUpload()" />
                    </span> 

                </td>
            </tr>
        </table>

<style>.uploader{
position:relative;
display:inline-block;
overflow:hidden;
cursor:default;
padding:0;
margin:10px 0px;
/*-moz-box-shadow:0px 0px 5px #ddd;
-webkit-box-shadow:0px 0px 5px #ddd;*/
/*box-shadow:0px 0px 5px #ddd;*/

-moz-border-radius:5px;
-webkit-border-radius:5px;
border-radius:5px;
}

    .filename {
        float: left;
        display: inline-block;
        outline: 0 none;
        height: 32px;
        width: 350px;
        margin: 0;
        padding: 8px 10px;
        overflow: hidden;
        cursor: default;
        border: 1px solid;
        /*border-right:0;*/
        font: 9pt/100% Arial, Helvetica, sans-serif;
        color: #777;
        text-shadow: 1px 1px 0px #fff;
        text-overflow: ellipsis;
        white-space: nowrap;
        -moz-border-radius: 5px 0px 0px 5px;
        -webkit-border-radius: 5px 0px 0px 5px;
        border-radius: 5px 0px 0px 5px;
        background: #f5f5f5;
        background: -moz-linear-gradient(top, #fafafa 0%, #eee 100%);
        background: -webkit-gradient(linear, left top, left bottom, color-stop(0%,#fafafa), color-stop(100%,#f5f5f5));
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#fafafa', endColorstr='#f5f5f5',GradientType=0);
        border-color: #ccc;
        -moz-box-shadow: 0px 0px 1px #fff inset;
        -webkit-box-shadow: 0px 0px 1px #fff inset;
        box-shadow: 0px 0px 1px #fff inset;
        -moz-box-sizing: border-box;
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
    }

.button{
float:left;
height:32px;
display:inline-block;
outline:0 none;
padding:8px 12px;
margin:0;
cursor:pointer;
border:1px solid;
font:bold 9pt/100% Arial, Helvetica, sans-serif;

-moz-border-radius:0px 5px 5px 0px;
-webkit-border-radius:0px 5px 5px 0px;
border-radius:0px 5px 5px 0px;

-moz-box-shadow:0px 0px 1px #fff inset;
-webkit-box-shadow:0px 0px 1px #fff inset;
box-shadow:0px 0px 1px #fff inset;
}


.uploader input[type=file]{
position:absolute;
top:0; right:0; bottom:0;
border:0;
padding:0; margin:0;
height:30px;
cursor:pointer;
filter:alpha(opacity=0);
-moz-opacity:0;
-khtml-opacity: 0;
opacity:0;
}

input[type=button]::-moz-focus-inner{padding:0; border:0 none; -moz-box-sizing:content-box;}
input[type=button]::-webkit-focus-inner{padding:0; border:0 none; -webkit-box-sizing:content-box;}
input[type=text]::-moz-focus-inner{padding:0; border:0 none; -moz-box-sizing:content-box;}
input[type=text]::-webkit-focus-inner{padding:0; border:0 none; -webkit-box-sizing:content-box;}
