    <script src="../Common/Scripts/jquery-3.6.0.min.js" type="text/javascript"></script>
		<link href="../Common/bootstrap/css/bootstrap-datetimepicker.min.css" rel="stylesheet">

	<body class="contentbody">
		
		<div style="position: absolute;padding: 0; overflow: hidden;left: 20px;top:10px;
			width: 300px;height:90%;padding:5px 0px 5px 5px;background:#fff;">
			<!--工程信息-->
			<ul id="tree1" class="mini-tree" style="padding: 5px;height:calc(100% - 10px)"
				showtreeicon="true" textfield="name" expandonload="1" allowdrag="true"
				allowdrop="true"
				allowleafdropin="true" idfield="tcd" parentfield="pid"
				resultastree="false" allowselect="true" showarrow="true"
				onnodeclick="onNodeClick"></ul>
		</div>
		<div style="left: 340px;    top: 5px;    position: absolute;    padding: 0;overflow: hidden;height:100%;width:98%; ">
		    <div style="width:calc(100% - 330px);height:100%;padding: 5px;">
				<div style="width:100%;">
					<div class="mini-toolbar">
						<div class="myrow" style="    line-height: normal;"> 
								<span style="line-height: 35px;">
										&nbsp;&nbsp;&nbsp;关键字：&nbsp;&nbsp;&nbsp;
								</span>
								<input id="key" class="mini-textbox" emptytext="请输入测站名称" style="height: 25px;width: 150px;"
						 onenter="onKeyEnter" />
							<div style="margin-top: 10px;font-size: 14px;">&nbsp;&nbsp;&nbsp;&nbsp;年份&nbsp;&nbsp;&nbsp;</div>
							<div class='input-group date' style="width: 10em;" id='datetimepicker1'>
								<input id="date1" type='text' class="timeInput form-control" />
								<span class="input-group-addon">
									<span class="glyphicon glyphicon-calendar"></span>
								</span>
							</div>
							&nbsp;&nbsp;&nbsp;<button type="button" class="btn btn-primary" onclick="search()">查询</button>
							&nbsp;&nbsp;&nbsp;
							<button id="btnSava" type="button" class="btn btn-warning" onclick="add()">增加</button>
		
						</div>
					</div>
				</div>
				<div id="grid1" class="mini-datagrid"
					style="width:100%;max-height: 100% "
					allowResize="false" idField="id" ondrawcell="ondrawcell" sizelist="[15,20,30,50]" pagesize="15" showPager="false"
					showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" showSummaryRow="false">
					<div property="columns">
						<div type="indexcolumn"   headeralign="center" align="center">序号</div>
                        <!-- <div field="wd_TYPE" headeralign="center" align="center">
                                文件类型
                            </div> -->
                            <div field="wd_NUM"  width="80" headeralign="center" align="center">
                                期号
                            </div>
                            <div field="wd_NAME" width="150" headeralign="center" align="left">
                                文件名称
                            </div>
                        
                            <div field="wd_SIZE"  width="50" headeralign="center" align="center">
                                文件大小(kb)
                            </div>
                            <div field="wd_OWEN"  width="50" headeralign="center" align="center">
                                上传人
                            </div>
                            <div field="wd_TIME" headeralign="center" align="center">
                                时间
                            </div>
                            <div field="wd_KZNAME" width="50" headeralign="center" align="center">
                                下载
                            </div>
                            <div field="wd_NOTE" headeralign="center" align="left">
                                备注
                            </div>
						<div name="action" width="50" headeralign="center" align="center" renderer="onActionRenderer"
							cellstyle="padding:0;">
							基本操作
						</div>
					</div>
				</div>
			</div>
		</div>

		<script language="javascript" type="text/javascript">
			mini.parse();
			var myData = [];
			var PATHNAME = "";
			//实例化表格对象
			var grid = mini.get("grid1");
			var detail_grid = mini.get("detail_grid");
			var detailGrid_Form = document.getElementById("detailGrid_Form");
			var MENTList = mini.get("MENTList");
			var tree = mini.get("tree1");

			$(function() {
				if(GroupArray.contains(GetCookie("GROUPID"))){
					$("#btnSava").show();
					grid.showColumn("action");
				}else{
					$("#btnSava").hide();
					grid.hideColumn("action");
				}

				//默认加载数据
				// search(); 
                var strWhere = {};//[{"column":"PATHNAME","type":"eq","value":"资料管理"}];
                strWhere["pathname"]="资料管理";
                app.get("/xcSystypeS/selectList", strWhere, function (res) {
                    JosnSel(res, "WD_TYPE");
                })

			});

			$('#datetimepicker1').datetimepicker({
				format: 'YYYY',
				locale: moment.locale('zh-cn'),
				defaultDate: new Date().getFullYear() + ''
			});

			var dataResult = null;

			function search() {
				mini.mask({
					el: document.body,
					cls: 'mini-mask-loading',
					html: '加载中...'
				});
                var strWhere={};
                var tree = mini.get("tree1");
                    var node = tree.getSelectedNode();
                    console.error(node)
				strWhere["key"]=mini.get("key").getValue();
				if(GetObj("date1").value!=""){
					strWhere["stime"]=GetObj("date1").value+"-01-01";
                	strWhere["etime"]=GetObj("date1").value+"-12-31 23:59:59";
				}
               
                strWhere["wdType"]=node.name;
                app.get("/wdListtable/selectList", strWhere, function (res) {
                    JosnSel(res, "Sel");
                })
			}

			function onNodeClick(e) {
				var node = e.node;
				var isLeaf = e.isLeaf;
				if (isLeaf) {
					var tree = mini.get("tree1");
                    var node = tree.getSelectedNode();
					search();
				}
			} 

			function ondrawcell(e) {
				var record = e.record;
				var row = e.row,
					column = e.column,
					field = e.field,
					value = e.value;
				  if (field == "wd_KZNAME") {
                    var s = "";
                    if (value != "") {
                        s = "<span onclick=\"download('" + HttpUrl + row.wd_TYPE + "/"+  row.wd_FILE + "','" + row.wd_NAME+row.wd_KZNAME + "')\" style=\"cursor:pointer;\" title=\"点击下载此文件\">" + GetImage(row.wd_FILE) + "</span>";
                        s+="&nbsp;&nbsp;&nbsp;"
                        if(row.wd_PDF!=undefined&&row.wd_PDF!=null){
                            var strHref=   HttpUrl + row.wd_TYPE + "/"+   row.wd_PDF;
                            s += "<span onclick=\"JavaScript:window.parent.open('"+strHref+"')\" style=\"cursor:pointer;\" title=\"点击在线打开此文件\">" + GetImage(row.wd_PDF) + "</span>";
                        }
                    }
                    e.cellHtml = s;
            } else if (field == "wd_NUM") {
                var s = "";
                if (row.wd_YEAR != undefined) {
                    s = row.wd_YEAR + "年" + row.wd_NUM + "号";
                }
                e.cellHtml = s;
            } else if (field == "wd_TIME") {
					if (undefined != value) {
						var TM = formatDate((record.WD_TIME)).format("yyyy-MM-dd HH:mm:ss");
					}
					e.cellHtml = TM;
				}
			}
 
			//接收并处理方法
			function JosnSel(data, typeID) {
				if (typeID == "Sel") {
                    dataResult = data.data;
					grid.setData(dataResult);
					mini.unmask(document.body);
				} else if (typeID == "Del") {
					if (data.total > 0) {
						search();
					}
				} else if (typeID == "DATA_PRO_INFOTYPESel") {
					$.data(myData, "DATA_PRO_INFOTYPESel", data.data);
					TYPELIST.setData(data.data);
					TYPELIST.select(0);
					search();
				} 
				else if (typeID == "WD_TYPE") {
					var resultData = data.data;
                    var strJson=[];
                    if(resultData.length>0){
                        var strID=UUID(19,16);
                      var strNAME="";
                        for(num=0;num<resultData.length;num++){
                            var strWhere=resultData[num];
                            strWhere["pid"]=strID;
                            if(strNAME==""){
                                strNAME=strWhere["name"];
                            }else{
                                strNAME+=","+strWhere["name"];
                            }
                            strJson.push(strWhere);   
                        }
                        strJson.push({"tcd":strID,"pathname":strNAME,"name":resultData[0]["pathname"],"pid":"-1"});
                    }
					tree.loadList(strJson, "tcd", "pid");
					tree.select(1); 
					search();

				}

			} 

			//==加上编辑列代码
			function onActionRenderer(e) {
				var grid = e.sender;
				var record = e.record;
				var uid = record._uid;
				var rowIndex = e.rowIndex;
				var s = '';
                s += '<img style="cursor:pointer;" onclick="del(\'' + record.wd_ID + '\')" src="../Common/miniui/themes/icons/remove.png" title="删除' + record.wd_NAME + '" />&nbsp;';


				return s;
			}

			//删除
			function del(objID) {
				mini.confirm("确定删除记录？", "确定？",
					function(action) {
						if (action == "ok") {
							grid.loading("执行删除中，请稍后......");
							var strWhere = {
								"stcd": objID
							}; 
                            app.get("/wdListtable/deleteOne", strWhere, function(res) {
								JosnSel(res, "Del");
							});
						}
					}
				);
			}
			//--------------------------------
			// 监听分页前事件，阻止后自行设置当前数据和分页信息
			grid.on("beforeload", function(e) {
				e.cancel = true;
				var pageIndex = e.data.pageIndex,
					pageSize = e.data.pageSize;
				PageFillData(pageIndex, pageSize);
			}); 
            function add() {
                var tree = mini.get("tree1");
				var node = tree.getSelectedNode();
				var numCount=grid.getData().length+1;
                addData('WD_TYPE@' + node.name+",ORDERBYID@"+numCount , '/tabPatrol/WD_LISTTABLEListEdit.html', '新增' +  node.name, '75%', 550, 'true')
            }
		</script>
	</body>
</html>
