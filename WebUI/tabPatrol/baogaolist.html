<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="content-type" content="text/html;charset=UTF-8" />

		<link href="../Common/bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />

		<!-- <link href="/arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" /> -->
        <script src="../Common/Scripts/DownLoad.js" type="text/javascript"></script>

		<style type="text/css">

    <script src="../Common/Scripts/jquery-3.6.0.min.js" type="text/javascript"></script>
		<link href="../Common/bootstrap/css/bootstrap-datetimepicker.min.css" rel="stylesheet">
		<script src="../Common/bootstrap/js/bootstrap.min.js"></script>
		<script src="../Common/bootstrap/js/moment-with-locales.js"></script>
		<script src="../Common/bootstrap/js/bootstrap-datetimepicker.min.js"></script>

	</head>
	<body class="contentbody">

				<div style="width:100%;">
					<div class="mini-toolbar">
						<div class="myrow" style="    line-height: normal;"> 
							<div style="font-size: 14px;">&nbsp;&nbsp;&nbsp;&nbsp;年份&nbsp;&nbsp;&nbsp;</div>
							<div class='input-group date' style="width: 10em;" id='datetimepicker1'>
								<input id="date1" type='text' class="timeInput form-control" />
								<span class="input-group-addon">
									<span class="glyphicon glyphicon-calendar"></span>
								</span>
							</div>
							&nbsp;&nbsp;&nbsp;<button type="button" class="btn btn-primary" onclick="search()">查询</button>
							&nbsp;&nbsp;&nbsp;
							<button id="btnSava" type="button" class="btn btn-warning" onclick="add()">增加</button>
		
						</div>
					</div>
		
				<div id="grid1" class="mini-datagrid"
					style="width:100%;max-height: 100% "
					allowResize="false" idField="id" ondrawcell="ondrawcell" sizelist="[15,20,30,50]" pagesize="15" showPager="false"
					showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" showSummaryRow="false">
					<div property="columns">
						<div type="indexcolumn"   headeralign="center" align="center">序号</div>
                        <!-- <div field="wd_TYPE" headeralign="center" align="center">
                                文件类型
                            </div> -->
							<div field="wd_TIME" headeralign="center" align="center">
                                检查时间
                            </div> 
                            <div field="wd_FILE" headeralign="center" align="center">
                                检查报告
                            </div>
							<div field="wd_TIF" headeralign="center" align="center">
                                整改报告
                            </div>
							<div field="wd_OWEN" headeralign="center" align="center">
                                上传人
                            </div> 
						<div name="action"  headeralign="center" align="center" renderer="onActionRenderer"
							cellstyle="padding:0;">
							基本操作
						</div>
					</div>
				</div>
			</div>

		<script language="javascript" type="text/javascript">
			mini.parse();
			var myData = []; 
			//实例化表格对象
			var grid = mini.get("grid1"); 
            var PathName = GetQueryString("PATHNAME");
			$(function() {
				if(GroupArray.contains(GetCookie("GROUPID"))){
					$("#btnSava").show();
					grid.showColumn("action");
				}else{
					$("#btnSava").hide();
					grid.hideColumn("action");
				}
				//默认加载数据
				search();  

			});

			$('#datetimepicker1').datetimepicker({
				format: 'YYYY',
				locale: moment.locale('zh-cn'),
				defaultDate: new Date().getFullYear() + ''
			});

			var dataResult = null;

			function search() {
				mini.mask({
					el: document.body,
					cls: 'mini-mask-loading',
					html: '加载中...'
				});
                var strWhere={}; 
				if(GetObj("date1").value!=""){
					strWhere["stime"]=GetObj("date1").value+"-01-01";
                	strWhere["etime"]=GetObj("date1").value+"-12-31 23:59:59";
				}
               
                strWhere["wdType"]=PathName;
                app.get("/wdListtable/selectList", strWhere, function (res) {
                    JosnSel(res, "Sel");
                })
			}

			function onNodeClick(e) {
				var node = e.node;
				var isLeaf = e.isLeaf;
				if (isLeaf) {
					var tree = mini.get("tree1");
                    var node = tree.getSelectedNode();
					search();
				}
			} 

			function ondrawcell(e) {
				var record = e.record;
				var row = e.row,
					column = e.column,
					field = e.field,
					value = e.value;
				  if (field == "wd_FILE") {
                    var s = "";
                    if (value != "") {
                        s = "<span onclick=\"download('" + HttpUrl + row.wd_TYPE + "/"+  row.wd_FILE + "','" + row.wd_NAME+ "')\" style=\"cursor:pointer;\" title=\"点击下载此文件\">" + GetImage(row.wd_FILE) + "</span>";
                        s+="&nbsp;&nbsp;&nbsp;"
                        if(row.wd_PDF!=undefined&&row.wd_PDF!=null){
                            var strHref=   HttpUrl + row.wd_TYPE + "/"+   row.wd_PDF;
                            s += "<span onclick=\"JavaScript:window.parent.open('"+strHref+"')\" style=\"cursor:pointer;\" title=\"点击在线打开此文件\">" + GetImage(row.wd_PDF) + "</span>";
                        }
                    }
                    e.cellHtml = s;
            } else  if (field == "wd_TIF") {
                    var s = "";
                    if (value != "") {
                        s = "<span onclick=\"download('" + HttpUrl + row.wd_TYPE + "/"+  row.wd_TIF + "','" + row.wd_TIF+ "')\" style=\"cursor:pointer;\" title=\"点击下载此文件\">" + GetImage(row.wd_TIF) + "</span>";
                        s+="&nbsp;&nbsp;&nbsp;"
                        if(row.wd_NOTE!=undefined&&row.wd_NOTE!=null){
                            var strHref=   HttpUrl + row.wd_TYPE + "/"+   row.wd_NOTE;
                            s += "<span onclick=\"JavaScript:window.parent.open('"+strHref+"')\" style=\"cursor:pointer;\" title=\"点击在线打开此文件\">" + GetImage(row.wd_NOTE) + "</span>";
                        }
                    }
                    e.cellHtml = s;
            }  else if (field == "wd_TIME") {
					if (undefined != value) {
						var TM = formatDate((record.WD_TIME)).format("yyyy-MM-dd");
					}
					e.cellHtml = TM;
				}
			}
 
			//接收并处理方法
			function JosnSel(data, typeID) {
				if (typeID == "Sel") {
                    dataResult = data.data;
					grid.setData(dataResult);
					mini.unmask(document.body);
				} else if (typeID == "Del") {
					if (data.total > 0) {
						search();
					}
				} else if (typeID == "DATA_PRO_INFOTYPESel") {
					$.data(myData, "DATA_PRO_INFOTYPESel", data.data);
					TYPELIST.setData(data.data);
					TYPELIST.select(0);
					search();
				}  

			} 

			//==加上编辑列代码
			function onActionRenderer(e) {
				var grid = e.sender;
				var record = e.record;
				var uid = record._uid;
				var rowIndex = e.rowIndex;
				var s = '';
                s += '<img style="cursor:pointer;" onclick="del(\'' + record.wd_ID + '\')" src="../Common/miniui/themes/icons/remove.png" title="删除' + record.wd_NAME + '" />&nbsp;';
				return s;
			}

			//删除
			function del(objID) {
				mini.confirm("确定删除记录？", "确定？",
					function(action) {
						if (action == "ok") {
							grid.loading("执行删除中，请稍后......");
							var strWhere = {
								"stcd": objID
							}; 
                            app.get("/wdListtable/deleteOne", strWhere, function(res) {
								JosnSel(res, "Del");
							});
						}
					}
				);
			}
			//--------------------------------
			// 监听分页前事件，阻止后自行设置当前数据和分页信息
			grid.on("beforeload", function(e) {
				e.cancel = true;
				var pageIndex = e.data.pageIndex,
					pageSize = e.data.pageSize;
				PageFillData(pageIndex, pageSize);
			}); 
            function add() {
				var numCount=grid.getData().length+1;
                addData('WD_TYPE@' + PathName+",ORDERBYID@"+numCount , '/tabPatrol/baogao_Edit.html', '新增' + PathName, 1000, 550, 'true')
            }
		</script>
	</body>
</html>
