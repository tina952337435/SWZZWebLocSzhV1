<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title></title>
    <link href="../Common/bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
    <script src="../Common/boot.js" type="text/javascript"></script>
    <link href="../Common/miniui/themes/default/flatstyle.css" rel="stylesheet" />
    <!-- <link href="/arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" /> -->
    <script src="../Common/Scripts/DownLoad.js" type="text/javascript"></script>

    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }

        .mini-grid-cell-inner {
            height: auto !important;
            line-height: 34px !important;
        }

        .myrow {
            display: flex;
            flex-direction: row;
            /*margin-left:1em;*/
            /* padding: 0px 0px 6px; */
            line-height: normal;
        }

        .mini-layout-region-header .mini-tools,
        .mini-layout-proxy .mini-tools {
            top: 0px;
        }

        .mini-icon {
            color: #72a7cf;
        }

        .selectedli {
            z-index: 2;
            /*background-color: #8FC7FF;
				color: #fff;*/
            cursor: not-allowed;
            border-color: #0080ff !important;
            /*color: #0080ff;*/
            background: transparent url("/bzh../Common/images/icon-selected.png") no-repeat right bottom;
            border-radius: 10px !important;
        }

        .mini-grid-summaryCell {
            line-height: 30px;
            border-top: #d2d2d2 0px solid;
        }

<body class="contentbody">

    <div style="position: absolute;padding: 0; overflow: hidden;left: 20px;top:10px;
			width: 200px;height:90%;padding:5px 0px 5px 5px;background:#fff;">
        <!--工程信息-->
        <ul id="tree1" class="mini-tree" style="padding: 5px;height:calc(100% - 10px)" showtreeicon="true"
            textfield="stnm" expandonload="1" allowdrag="true" allowdrop="true" allowleafdropin="true" idfield="stcd"
            parentfield="pid" resultastree="false" allowselect="true" showarrow="true" onnodeclick="onNodeClick"></ul>
    </div>
    <div
        style="left: 240px;    top: 5px;    position: absolute;    padding: 0;overflow: hidden;height:100%;width:98%; ">
        <div style="width:calc(100% - 230px);height:100%;padding: 5px;">
            <div style="width:100%;">
                <div class="mini-toolbar">
                    <div class="myrow">
                        &nbsp;&nbsp; &nbsp;开始日期&nbsp;&nbsp;&nbsp;
                        <input id="STIME" class="mini-datepicker" style="width:120px;" format="yyyy-MM-dd"
                            showtime="false" showOkButton="false" showClearButton="false"
                            ondrawdate="onMinDrawDate" />&nbsp;&nbsp;
                        &nbsp;&nbsp;&nbsp;结束日期&nbsp;&nbsp;&nbsp;
                        <input id="ETIME" class="mini-datepicker" style="width:120px;" format="yyyy-MM-dd"
                            showtime="false" showOkButton="false" showClearButton="false" ondrawdate="onMaxDrawDate" />
                        &nbsp;&nbsp;&nbsp;关键字：<input id="key" class="mini-textbox" emptytext="请输入关键字："
                            style="height: 25px;width: 150px;" onenter="onKeyEnter" />

                        &nbsp;&nbsp;&nbsp;<button type="button" class="btn btn-primary" onclick="search()">查询</button>
                        &nbsp;&nbsp;&nbsp;
                        <button type="button" id="btnSava" class="btn btn-warning" onclick="add()">增加</button>

                    </div>
                </div>
            </div>
            <div id="grid1" class="mini-datagrid" style="width:100%;max-height: 100% " allowResize="false" idField="id"
                ondrawcell="ondrawcell" sizelist="[15,20,30,50]" pagesize="15" showPager="false" showemptytext="true"
                emptytext="暂无数据" alwaysshowemptytext="true" showSummaryRow="false">
                <div property="columns">
                    <div type="indexcolumn" headeralign="center" align="center">序号</div>
                    <div field="stnm" headeralign="center" align="center">
                        站名
                    </div>
                    <div field="owen" headeralign="center" align="center">
                        维护人员
                    </div>
                    <div field="tm" headeralign="center" align="center">
                        日期
                    </div>
                    <div header="水尺读数" headeralign="center" align="center">
                        <div property="columns">
                            <div field="scr1" headeralign="center" align="center"  decimalPlaces="2" dataType="float">第一次</div>
                            <div field="scr2" headeralign="center" align="center"  decimalPlaces="2" dataType="float">第二次</div>
                        </div>
                    </div> 
                    <div header="水尺水位" headeralign="center" align="center">
                        <div property="columns">
                            <div field="scz1" headeralign="center" align="center"  decimalPlaces="2" dataType="float">第一次</div>
                            <div field="scz2" headeralign="center" align="center"  decimalPlaces="2" dataType="float">第二次</div>
                        </div>
                    </div> 
                    <div header="水位计水位" headeralign="center" align="center">
                        <div property="columns">
                            <div field="swz1" headeralign="center" align="center"  decimalPlaces="2" dataType="float">第一次</div>
                            <div field="swz2" headeralign="center" align="center"  decimalPlaces="2" dataType="float">第二次</div>
                        </div>
                    </div>  
                    <div field="nt" headeralign="center" align="center">
                        情况记录
                    </div>
                    <div field="savastate" headeralign="center" align="center">
                        状态
                    </div>
                
                    <div name="action" headeralign="center" align="center" renderer="onActionRenderer"
                        cellstyle="padding:0;">
                        基本操作
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script language="javascript" type="text/javascript">
        mini.parse();
        var myData = [];
        var PathName = GetQueryString("PATHNAME");
        var HeadTitle = GetQueryString("HEADTITLE");
        //实例化表格对象
        var grid = mini.get("grid1");
        var tree = mini.get("tree1");

        $(function () {
            //默认加载数据
            // search(); 
            if(GroupArray.contains(GetCookie("GROUPID"))){
                $("#btnSava").show();
                grid.showColumn("action");
            }else{
                $("#btnSava").hide();
                grid.hideColumn("action");
            }
            var tm = new Date();

            mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -365));
            mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));
            var strWhere = {};//[{"column":"PATHNAME","type":"eq","value":"资料管理"}];
            strWhere["key"] = PathName; 
            app.get("/stStbprpB/selectList", strWhere, function (res) {
                JosnSel(res, "WD_TYPE");
            })

        });
        var dataResult = null;

        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var strWhere = {};
            var tree = mini.get("tree1");
            var node = tree.getSelectedNode(); 
            $.data(myData,"NODEJSON",node);
            strWhere["key"] = mini.get("key").getValue();
            strWhere["stime"] = mini.get("STIME").getFormValue() + " 00:00:00";
            strWhere["etime"] = mini.get("ETIME").getFormValue() + " 23:59:59";
            strWhere["pathname"] = PathName;
            strWhere["stcd"] = node.stcd;
            strWhere["typename"]="ITEMZHUANTIZ";
            app.get("/itemZhuanti/selectList", strWhere, function (res) {
                JosnSel(res, "Sel");
            })
        }

        function onNodeClick(e) {
            var node = e.node;
            var isLeaf = e.isLeaf;
            if (isLeaf) {
                $("#btnSava").show();
            }else{
                $("#btnSava").hide();
            }
                var tree = mini.get("tree1");
                var node = tree.getSelectedNode(); 
                search(); 
        }

        function ondrawcell(e) {
            var record = e.record;
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            if (field == "tm") {
                var s = '';
                if (undefined != value) {
                    s = formatDate(value).format("yyyy-MM-dd");
                }
                e.cellHtml = s;
            }else if(field=="savastate"){
                var s="暂存";
                if(value!=undefined){
                    if(value=="1"){
                        s="已完成";
                    }else{
                        e.cellStyle = "background-color:#F88DF2;";
                    }
                }else{
                    e.cellStyle = "background-color:#F88DF2;";
                }
                e.cellHtml=s;
            }else if(field=="scr1"){
                var s='';
                if(record.itemZhuantiZ!=undefined){
                    var tempJson=record.itemZhuantiZ.filter(function(res){
                        return res["cknum"]==1;
                    })
                    if(tempJson.length>0){
                        var val=tempJson[0]["scr"];
                        if(SetNull(val)!=""){
                            s=Number(val).toFixed(2);
                        }
                    }
                } 
                e.cellHtml=s;
            }else if(field=="scr2"){
                var s='';
                if(record.itemZhuantiZ!=undefined){
                    var tempJson=record.itemZhuantiZ.filter(function(res){
                        return res["cknum"]==2;
                    })
                    if(tempJson.length>0){
                        var val=tempJson[0]["scr"];
                        if(SetNull(val)!=""){
                            s=Number(val).toFixed(2);
                        }
                    }
                } 
                e.cellHtml=s;
            }else if(field=="swz1"){
                var s='';
                if(record.itemZhuantiZ!=undefined){
                    var tempJson=record.itemZhuantiZ.filter(function(res){
                        return res["cknum"]==1;
                    })
                    if(tempJson.length>0){
                        var val=tempJson[0]["swz"];
                        if(SetNull(val)!=""){
                            s=Number(val).toFixed(2);
                        }
                    }
                } 
                e.cellHtml=s;
            }else if(field=="swz2"){
                var s='';
                if(record.itemZhuantiZ!=undefined){
                    var tempJson=record.itemZhuantiZ.filter(function(res){
                        return res["cknum"]==2;
                    })
                    if(tempJson.length>0){
                        var val=tempJson[0]["swz"];
                        if(SetNull(val)!=""){
                            s=Number(val).toFixed(2);
                        }
                    }
                } 
                e.cellHtml=s;
            }else if(field=="scz1"){
                var s='';
                if(record.itemZhuantiZ!=undefined){
                    var tempJson=record.itemZhuantiZ.filter(function(res){
                        return res["cknum"]==2;
                    })
                    if(tempJson.length>0){
                        var val=tempJson[0]["scz"];
                        if(SetNull(val)!=""){
                            s=Number(val).toFixed(2);
                        }
                    }
                } 
                e.cellHtml=s;
            }else if(field=="scz2"){
                var s='';
                if(record.itemZhuantiZ!=undefined){
                    var tempJson=record.itemZhuantiZ.filter(function(res){
                        return res["cknum"]==2;
                    })
                    if(tempJson.length>0){
                        var val=tempJson[0]["scz"];
                        if(SetNull(val)!=""){
                            s=Number(val).toFixed(2);
                        }
                    }
                } 
                e.cellHtml=s;
            }
        }

        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data.data;
                grid.setData(dataResult);
                mini.unmask(document.body);
            } else if (typeID == "Del") {
                if (data.total > 0) {
                    search();
                }
            }  
            else if (typeID == "WD_TYPE") {
                var resultData = data.data;
                var strJson = [];
                if (resultData.length > 0) {
                    var strID = UUID(19, 16);
                    var strNAME = "";
                    for (num = 0; num < resultData.length; num++) {
                        var strWhere = resultData[num];
                        strWhere["pid"] = strID;
                        strWhere["tcd"] = strWhere["stcd"];
                        if (strNAME == "") {
                            strNAME = strWhere["stcd"];
                        } else {
                            strNAME += "," + strWhere["stcd"];
                        }
                        strJson.push(strWhere);
                    }
                    strJson.push({ "tcd": strID, "stcd": strNAME, "stnm": "测站名称", "pid": "-1" });
                }
                tree.loadList(strJson, "tcd", "pid");
                tree.select(1);
                search();

            }

        }

        //==加上编辑列代码
        function onActionRenderer(e) {
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            var s = '';
            var rowIndex = e.rowIndex;
            var node=$.data(myData,"NODEJSON");
				var s = '<img style="cursor:pointer;" onclick="lookData(\'ID@' + record.id +
					',HEADTITLE@'+HeadTitle+',STCD@'+node.stcd+',STNM@'+node.stnm+',PATHNAME@'+PathName+'\',\'/tabPatrol/PatrolSW_View.html?ID='+record.id+'&HEADTITLE='+HeadTitle+'\',\''+HeadTitle+'\',\'1200\',\'650\',\'true\')" src="../Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
				s += '<img style="cursor:pointer;" onclick="editData(\'ID@' + record.id +
					',HEADTITLE@'+HeadTitle+',STCD@'+node.stcd+',STNM@'+node.stnm+',PATHNAME@'+PathName+'\', \'/tabPatrol/PatrolSW_Edit.html\', \''+HeadTitle+'\', \'1200\',\'750\', \'true\')" src="../Common/miniui/themes/icons/edit.png" title="修改" />&nbsp;';
				s += '<img style="cursor:pointer;" onclick="del(\'' + record.id +
					'\')" src="../Common/miniui/themes/icons/remove.png" title="删除'+HeadTitle+'" />&nbsp;';
            return s;
        }

        //删除
        function del(objID) {
            mini.confirm("确定删除巡检记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        var strWhere = {
                            "stcd": objID
                        };
                        app.get("/itemZhuanti/deleteOne", strWhere, function (res) {
                            JosnSel(res, "Del");
                        });
                    }
                }
            );
        }
        //--------------------------------
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex,
                pageSize = e.data.pageSize;
            PageFillData(pageIndex, pageSize);
        });
        function add() {
            var tree = mini.get("tree1");
            var node = tree.getSelectedNode();
            addData('STCD@' + node.stcd+',STNM@'+node.stnm+',HEADTITLE@'+HeadTitle+',PATHNAME@'+PathName, '/tabPatrol/PatrolSW_Edit.html', '新增' + node.stnm, '1200', 800, 'true')
        }
    </script>
</body>

</html>
