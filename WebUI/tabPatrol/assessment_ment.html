<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
	<head>
		<meta http-equiv="content-type" content="text/html;charset=UTF-8" />
		<title></title>
		<link href="../Common/bootstrap/css/bootstrap.css" rel="stylesheet" type="text/css" />
		<script src="../Common/boot.js" type="text/javascript"></script>
		<link href="../Common/CSS/ui-choose.css" rel="stylesheet" />
		<link href="../Common/CSS/common.css" rel="stylesheet" type="text/css" />

		<style type="text/css">
			body {
				margin: 0;
				padding: 0;
				border: 0;
				width: 100%;
				height: 100%;
				/* overflow: hidden; */
				font-size: 12px;
			}

			.myrow {
				display: flex;
				flex-direction: row;
				/*margin-left:1em;*/
				padding:0px 0px 6px;
			}
			.mini-grid-summaryCell{
				line-height: 30px;
				border-top: #d2d2d2 0px solid;
			}
		</style>
		<link href="../Common/bootstrap/css/bootstrap-datetimepicker.min.css" rel="stylesheet">
		<script src="../Common/bootstrap/js/bootstrap.min.js"></script>
		<script src="../Common/bootstrap/js/moment-with-locales.js"></script>
		<script src="../Common/bootstrap/js/bootstrap-datetimepicker.min.js"></script>

	</head>
	<body class="contentbody">
		<div style="width:100%;">
			<div class="mini-toolbar">
				<div class="myrow">
					<div style="margin-top: 10px;font-size: 14px;">单位名称&nbsp;&nbsp;&nbsp;</div>
					<input id="MENTList" name="MENTList" class="mini-combobox"
						   textField="MANAGE_UNIT_NAME"
						   valueField="ID"
						   onvaluechanged="search()"
						   style="width: 280px; margin-left: 2px;margin-top: 3px;" />
					<div style="margin-top: 10px;font-size: 14px;">&nbsp;&nbsp;&nbsp;&nbsp;年份&nbsp;&nbsp;&nbsp;&nbsp;</div>
					<div class='input-group date' style="width: 10em;" id='datetimepicker1'>
						<input id="date1" type='text' class="timeInput form-control" />
						<span class="input-group-addon">
							<span class="glyphicon glyphicon-calendar"></span>
						</span>
					</div>
					&nbsp;&nbsp;&nbsp;&nbsp;<button type="button" class="btn btn-primary" onclick="search()">查询</button>
				</div>
			</div>
		</div>
		
		<div id="grid1" class="mini-datagrid"
			style="width:100%;max-height: 90%"
			allowResize="false" idField="id" ondrawcell="ondrawcell" sizelist="[10,20,30,50]" pagesize="10" showPager="false"
			showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" showSummaryRow="true" ondrawsummarycell="onDrawSummaryCell">
			<div property="columns">
				<div type="indexcolumn" width="10" headeralign="center" align="center">序号</div>
				<div field="NAME" width="30" headerAlign="center" align="center">项目</div>
				<div field="ASSESSMENT_SCORE" width="15" headerAlign="center" align="center">标准分</div>
				<div field="MANAGEINFO" headerAlign="center" align="center">管理要求</div>
				<!-- <div field="ASSESSMENT_PRINCIPLE" headerAlign="center" align="center">考核赋分原则</div> -->
				<div field="ACTUAL_SCORE" width="15" headerAlign="center" align="center">考核评分</div>
				<div field="CREATETIME" width="20" headerAlign="center" align="center">评分时间</div>
				<div name="action" width="35" headeralign="center" align="center" renderer="onActionRenderer"
					cellstyle="padding:0;">
					基本操作
				</div>
			</div>
		</div>
		<script language="javascript" type="text/javascript">
			mini.parse();
			var myData = [];
			var PATHNAME = "";
			//DATA_FZ_TYPESel FLAG
			//实例化表格对象
			var grid = mini.get("grid1");
			var detail_grid = mini.get("detail_grid");
			var detailGrid_Form = document.getElementById("detailGrid_Form");
			var MENTList = mini.get("MENTList");
			$(function() {
				//默认加载数据
				// search();
				var _param = {};
				if( GetCookie("GROUPID") != "2021071100244633136"){
					_param = {ID: GetCookie("MENTID")};
				}

				GetJosns("DATA_PRO_MANAGEMENTSel", _param, "DATA_PRO_MANAGEMENTSel");
			});

			$('#datetimepicker1').datetimepicker({
				format: 'YYYY',
				locale: moment.locale('zh-cn'),
				defaultDate: new Date().getFullYear() + ''
			});

			function onKeyEnter() {
				//关键字
				search();
			}

			var dataResult = null;
			var ShowdataResult = null;

			function search() {
				PageFillData(0, 15);
			}

			function onShowRowDetail(e) {
				var grid = e.sender;
				var row = e.record;

				var td = grid.getRowDetailCellEl(row);
				td.appendChild(detailGrid_Form);
				detailGrid_Form.style.display = "block";

				//employee_grid.load({ dept_id: row.id });
				$.data(myData, "PID", row.ID);
				ShowPageFillData(0, 10);
			}

			function PageFillData(pageIndex, pageSize) {
				//查询方法  
				var year = $("#date1").val();
				var STIME = year + "-01-01";
				var strWhere = {
					"STARTTIME": STIME,
					"PRO_INFOTYPE": "0",
					"MENTID": MENTList.getValue(),
					"PageIndex": pageIndex,
					"PageSize": pageSize
				};
				GetJosns("DATA_PRO_ASSESSMENT_RECORDList", strWhere, "Sel");
			}

			function ShowPageFillData(pageIndex, pageSize) {
				//查询方法
				var strWhere = {
					"TYPEID": $.data(myData, "PID")
				};
				GetJosns("DATA_PRO_ASSESSMENTSel", strWhere, "ShowDetailSel");
			}

			function ondrawcell(e) {
				var record = e.record;
				var row = e.row,
					column = e.column,
					field = e.field,
					value = e.value;
				// if (field == "action") {

				// }else  else if (field == "PRO_INFOTYPE") {
				// 	var str = "是";
				// 	var s = $.data(myData,"DATA_PRO_INFOTYPESel").filter(function(item){
				// 		return item.ID == value;
				// 	})
				// 	if (s.length > 0) {
				// 		str = s[0].TYPENAME;
				// 	}
				// 	e.cellHtml = str;
				// }

				if (field == "NAME") {
					var s = "";
					if (value != undefined) {
						s = "<span style='font-size:14px;color:#007aff'>" + value + "</span>";
					}
					e.cellHtml = s;
				}else if (field == "ACTUAL_SCORE") {
					var s = "";
					if (value != undefined && Number(value) == Number(record.ASSESSMENT_SCORE) ) {
						s = "<span style='font-size:16px;color:#007aff;font-weight: 600;'>" + value + "</span>";
					}else{
						s = value;
					}
					e.cellHtml = s;
				} else if (field == "CREATETIME") {
					if (undefined != value) {
						var TM = formatDate(convertToDate(value)).format("yyyy-MM-dd");
					}
					e.cellHtml = TM;
				}
			}


			//接收并处理方法
			function JosnSel(data, typeID) {
				if (typeID == "Sel") {
					dataResult = data.data;
					var s = dataResult.filter(function(item) {
						return item.TYPEID != "-1";
					});
					grid.setData(s);
				} else if (typeID == "Del") {
					if (data.total > 0) {
						search();
					}
				} else if (typeID == "DATA_PRO_INFOTYPESel") {
					$.data(myData, "DATA_PRO_INFOTYPESel", data.data);
					TYPELIST.setData(data.data);
					TYPELIST.select(0);
					search();
				}
				else if (typeID == "DATA_PRO_MANAGEMENTSel") {
					$.data(myData, "MENTList", data.data);
					MENTList.setData(data.data);
					MENTList.select(0);
					
					search();
				}

			}
			//==加上编辑列代码
			function onActionRenderer(e) {
				var grid = e.sender;
				var record = e.record;
				var uid = record._uid;
				var rowIndex = e.rowIndex;
				var s = '';

				// s += '<a style="margin-right:10px" href="javascript:addData(\'ID@' + record.ID +',PRO_INFOTYPE@'+ TYPELIST.getValue() +'\',\'/bzh/assessment/DATA_PRO_ASSESSMENT_DETAIL_Edit.html?ID=' + record.ID + '\',\'' +
				// 		'添加评分项\',\'800\',\'600\',\'true\')" title="添加评分项">添加评分项</a>';
				
				var year = $("#date1").val();
				var STIME = year + "-01-01";
				
				if (undefined != record.RECORDID) {
					s += '<a class="edit" style="margin-right:10px" href="javascript:editData(\'RECORDID@' + record.RECORDID +
						'\', \'/bzh/assessment/assessment_ment_Edit.html\', \'' +
						'考核评分\', \'960\',\'640\', \'true\');" title="考核评分" >编辑评分</a>';
					s += '<a class="del" style="margin-right:10px" href="javascript:del(\'' + record.RECORDID + '\');" title="删除考核评分" >删除评分</a>';
				}else{
					s += '<a class="edit" style="margin-right:10px" href="javascript:addData(\'INFOTYPEID@0,MENTID@'+ MENTList.getValue() +',PID@'+ record.ID +',STARTTIME@'+ STIME +'\', \'/bzh/assessment/assessment_ment_Edit.html\', \'' +
						'考核评分\', \'960\',\'640\', \'true\');" title="考核评分" >考核评分</a>';
				}

				return s;
			}

			//删除
			function del(objID) {
				mini.confirm("确定删除记录？", "确定？",
					function(action) {
						if (action == "ok") {
							grid.loading("执行删除中，请稍后......");
							var strWhere = {
								"ID": objID
							};
							GetJosns("DATA_PRO_ASSESSMENT_RECORDDel", strWhere, "Del");
						}
					}
				);
			}
			//--------------------------------
			// 监听分页前事件，阻止后自行设置当前数据和分页信息
			grid.on("beforeload", function(e) {
				e.cancel = true;
				var pageIndex = e.data.pageIndex,
					pageSize = e.data.pageSize;
				PageFillData(pageIndex, pageSize);
			});
			
			function onDrawSummaryCell(e) {
				if(e.column.field == "ACTUAL_SCORE"){
					var s = SumJson(e.data,"ACTUAL_SCORE");
					e.cellHtml = "<div class='classColor' style='color:#18CF5D;text-align:center;font-size:16px;'>"+ s +"</div>";
				}else if(e.column.field == "ASSESSMENT_SCORE"){
					var s = SumJson(e.data,"ASSESSMENT_SCORE");
					e.cellHtml = "<div class='classColor' style='color:#FF0000;text-align:center;font-size:16px;'>"+ s +"</div>";
				}else if(e.column.field == "NAME"){
					e.cellHtml = "<div class='classColor' style='color:black;text-align:center;'>合计</div>";
				}

			}
		</script>
	</body>
</html>
