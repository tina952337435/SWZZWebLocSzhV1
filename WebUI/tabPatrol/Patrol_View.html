        function PrintA() {

        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var strJson = data.data;
                if (data.total > 0) {
                    infoData(strJson);
                }
            } else if (typeID == "Update") {
                showTips(data.Message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            } else if (typeID == "Add") {
                showTips(data.message);
                if (data.total > 0) {
                    CloseWindow("save");
                }
            } else if (typeID == "维护单位") {
                var strJson = data.data;
                infoData(strJson);
            }
            mini.unmask(document.body);
        }
        function infoData(strJson){ 
            console.log(strJson)
            // $("#TITLE").setData(strJson.xcSystypeSPList);

                if (strJson.stStbprpBList != undefined) {

                }

                    }

                $("#TITLE").html(strMsg);
            }

                            if(strWhere["cknum"]==1){

                                }

                                }
                                $("#SCZ1").html(val);
                                val=strWhere["swz"];
                                if(SetNull(val)!=""){
                                    val=Number(val).toFixed(2)
                                }
                                $("#SWZ1").html(val);
                                if(strWhere["swtm"]!=undefined){
                                    $("#SWTM1").html(formatDate(strWhere["swtm"]).format("yyyy-MM-dd HH:mm"));
                                }
                                $("#SCG1").html(strWhere["scg"]); 

                            }else{
                                if(strWhere["SCTM"]!=undefined){
                                    $("#SCTM2").html(formatDate(strWhere["SCTM"]).format("yyyy-MM-dd HH:mm"));
                                }
                                var val=strWhere["scr"];
                                if(SetNull(val)!=""){
                                    val=Number(val).toFixed(2)
                                }
                                $("#SCR2").html(val);
                                val=strWhere["scz"];
                                if(SetNull(val)!=""){

        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }

        function onCancel(e) {
            CloseWindow("cancel");
        }
  
        function setHtml(strJson,strResult) {
            $.data(myData, "ITEM_CONFIG", strJson);

            strMsg += '          情况';
            strMsg += '   </td>';
            strMsg += '  </tr>';
            if (strJson.length > 0) {
                // var allJson=groupBy(strJson,"pid");
                var allJson = strJson.filter(function (res) {
                    return res["pid"] == "-1";
                })
                var fuItem = sortObjectArray(allJson, ['orderby'], 'asc');
                if (fuItem.length > 0) {
                    for (num = 0; num < fuItem.length; num++) {
                        strMsg += '  <tr>';
                        var tempItem = strJson.filter(function (ext) {
                            return ext["pid"] == fuItem[num]["id"];
                        });
                        var numCount = Math.ceil(tempItem.length / 2);
                        strMsg += '     <td rowspan="' + numCount + '" align="center">';
                        strMsg += fuItem[num]["jc_NAME"];
                        strMsg += '   </td>';
                        if (tempItem.length > 0) {
                            for (numII = 0; numII < tempItem.length; numII++) {
                                if (numII > 0) {
                                    strMsg += '  <tr>';
                                }
                                strMsg += '     <td align="center">';
                                strMsg += tempItem[numII]["jc_NAME"];
                                strMsg += '   </td>';
                                strMsg += '     <td align="center">';
                                var strData = "";
                                var strValue = "";
                                var _item=null;
                                if(strResult!=null){
                                    _item=strResult.filter(function(res){
                                        return res["zt_ID"]==tempItem[numII]["id"];
                                    });
                                }

                                if (tempItem[numII]["jc_TYPE"] != undefined) {
                                    var jcType = tempItem[numII]["jc_TYPE"].split('、');
                                    for (nm = 0; nm < jcType.length; nm++) {
                                        strValue = jcType[nm];
                                        var tt=_item.filter(function(evt){
                                            return evt["meet"]==strValue;
                                        })
                                        if(tt.length>0){
                                            strData+='<span class="qingkuan">'+strValue+'<span class="fontSize18">☑</span></span>';
                                        }else{
                                            strData+='<span class="qingkuan">'+strValue+'<span class="fontSize18">⊡</span></span>';
                                        }
                                       
                                    }
                                }
                                strMsg+=strData;
                                strMsg += '   </td>';
                                numII++;
                                if (numII < (tempItem.length)) {
                                    strMsg += '     <td align="center">';
                                    strMsg += tempItem[numII]["jc_NAME"];
                                    strMsg += '   </td>';
                                    strMsg += '     <td align="center">';
                                 
                                            var strData2 = "";
                                            var strValue2 = "";
                                            var _item=null;
                                            if(strResult!=null){
                                                _item=strResult.filter(function(res){
                                                    return res["zt_ID"]==tempItem[numII]["id"];
                                                });
                                            }

                                            if (tempItem[numII]["jc_TYPE"] != undefined) {
                                                var jcType = tempItem[numII]["jc_TYPE"].split('、');
                                                for (nm = 0; nm < jcType.length; nm++) {
                                                    strValue2 = jcType[nm];
                                                    var tt=_item.filter(function(evt){
                                                        return evt["meet"]==strValue2;
                                                    })
                                                    if(tt.length>0){
                                                        strData2+='<span class="qingkuan">'+strValue2+'<span class="fontSize18">☑</span></span>';
                                                    }else{
                                                        strData2+='<span class="qingkuan">'+strValue2+'<span class="fontSize18">⊡</span></span>';
                                                    }
                                                
                                                }
                                            }
                                            strMsg+=strData2;
                                    strMsg += '   </td>';
                                } else {
                                    strMsg += '     <td colspan="2">';
                                    strMsg += '   </td>';
                                }

                                strMsg += ' </tr> ';
                            }
                        } else {
                            strMsg += ' </tr> ';
                        }



                    }
                }
            }

            strMsg += '   </table>';
            $("#tableView1").html(strMsg);
            mini.parse();

                            var tempNote = strPic[num].note == undefined ? "" : strPic[num].note;
                            if (strPic[num].staues != "0") {
                                tempNote = strPic[num].note == undefined ? "" : strPic[num].note;
                                tempPIC += '  <div style="padding:8px; font-size:13px;color:#2f88e9;">';

                            } else {
                                tempPIC += '  <div style="padding:8px; font-size:13px;color:red;">';

                            }
                            tempPIC += '     【' + strPic[num].name + '】 ' + tempNote;
                            tempPIC += '    </div>';
                            tempPIC += '</td>';

                        } else {
                            tempPIC += '<td align="center" style="line-height:normal;height:auto;width:50% !important;">';
                            tempPIC += '   <div style="height:240px;">';
                            tempPIC += ' </div>';
                            tempPIC += '<div style="padding:8px; font-size:13px;">';
                            tempPIC += '  </div>';
                            tempPIC += ' </td>';
                        }

                        tempPIC += ' </tr>';
                        num++;
                    }

                    tempPIC += ' </table> ';
                }
            } 
            $("#divPic").html(tempPIC);
        }
    </script>
