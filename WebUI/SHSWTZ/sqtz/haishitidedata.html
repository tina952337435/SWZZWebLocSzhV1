
<html>
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>海事潮位数据</title>
    <link href="../../Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="../../Common/boot.js" type="text/javascript"></script>
    <script src="../../Common/jquery.min.js"></script><!--高版本下拉框无法使用-->
    <link href="../../Common/CSS/ui-choose.css" rel="stylesheet" />
    <script src="../../Common/Scripts/DownLoad.js" type="text/javascript"></script>
    <script src="../../Common/Scripts/echarts.js" type="text/javascript"></script>
    <style>
        ul.ui-choose > li {
            width: auto;
            padding: 0px 20px;
        }

        .mini-grid-summaryRow tr td {
            background: none !important;
        }

        .mini-grid-summaryRow {
            background: none !important;
            padding-top: 10px;
        }


        .mini-radiobuttonlist-item .mini-list-icon {
        }

        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

            .mini-grid-summaryRow tr td span {
                color: #fff !important;
                line-height: 25px;
                font-weight: 400 !important;
            }
    </style>
</head>
<body>
    <div class="mini-toolbar">
        <div id="zhanList">
            <div class="searchTitle" style="line-height:35px;float:left;">&nbsp; &nbsp;站点选择： </div>
            <input id="STCD" name="STCD" class="mini-combobox" style="width:100px;"
                   textField="STNM" valueField="STCD" allowInput="true"
                   onvaluechanged="onvaluechangedTM" />
            <div style="margin-left:12px;float:left;display:none;" id="zhanDiv">
            </div>
            &nbsp;&nbsp;&nbsp;
            开始日期：&nbsp;<input id="STIME" class="mini-datepicker" style="width:100px;" format="yyyy-MM-dd" showOkButton="false" showClearButton="false" />&nbsp;&nbsp;
            &nbsp;&nbsp;&nbsp;
            结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:100px;" format="yyyy-MM-dd" showOkButton="false" showClearButton="false" />&nbsp;&nbsp;

            &nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a>
            <button type="button" class="btn btn-info" onclick="Exp()" id="expButton" style="margin: 0px 0px;padding: 4px 12px;display:none;">导出</button>

        </div>
    </div>
    <div class="mini-fit">
        <div id="cwchart" style="width:100%;height:300px;">
        </div>
        <div id="grid1" class="mini-datagrid"
             style="width: 100%;height: -webkit-calc(100% - 300px);height: -moz-calc(100% - 300px);height: calc(100% - 300px);"
             allowalternating="true" borderstyle="border-right:0;" idfield="sid" sortmode="client" sizelist="[15,20,30,50]"
             pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
             allowcellselect="true" allowcelledit="true"
             ondrawcell="ondrawcell" showSummaryRow="true" ondrawsummarycell="onDrawSummaryCell">
            <div property="columns">
                <div type="indexcolumn" headeralign="center" align="center">序号</div>
                <div field="tm" headeralign="center" align="center" allowsort="true">
                    时间
                </div>
                <div field="tdz" headeralign="center" align="center" allowsort="true" decimalPlaces="2" dataType="float">
                    潮位(m)
                </div>
                <div field="htdz" headeralign="center" align="center" allowsort="true" decimalPlaces="2" dataType="float">
                    天文潮(m)
                </div>
                <div field="ztdz" headeralign="center" align="center" allowsort="true" decimalPlaces="2" dataType="float">
                    增水(m)
                </div>
            </div>
        </div>
    </div>
    <script>
        var myData = [];
        mini.parse();
        var grid = mini.get("grid1");
        var stcd = GetQueryString("stcd");
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var dataResult = [
                { STCD: "HS020033", STNM: "中浚" },
                { STCD: "HS020060", STNM: "绿华山" },
				{ STCD: "HY007415", STNM: "大戢山" },
                { STCD: "SW63404572", STNM: "三甲港" }
            ];
            mini.get("STCD").setData(dataResult);
            if(stcd==null){
                mini.get("STCD").select(0);
            }else{
                mini.get("STCD").setValue(stcd);
            }
            

            var now = new Date();
            mini.get("STIME").setValue(addDayDate(now.format("yyyy-MM-dd"),-7));
            mini.get("ETIME").setValue(now.format("yyyy-MM-dd"));
            search();
        });
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var stime = mini.get("STIME").getFormValue() + " 00:00:00";
            var etime = mini.get("ETIME").getFormValue() + " 23:59:59";
            var strWhere = {
                startdate: stime,
                enddate: etime,
                stcd: mini.get("STCD").getValue(),
            };
            //GetJosns("WATER_ST_TIDE_RHTIDE", strWhere, "Sel");
			app.post("SWZZ_FLOOD_ST_TIDE_R/WATER_ST_TIDE_RHTIDEHS",strWhere,(data)=>{
				JosnSel(data,"Sel")
			})
		}
        function onvaluechangedTM(e) {
            search();
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var xdata = [];
                var ydata = [], ydataH = [], ydataZ = [];
                for (var num = 0; num < data.data.length; num++) {
                    var tm = new Date(new Date(data.data[num].tm)).format("yyyy-MM-dd HH:mm");
                    xdata.push(tm);
                    var tdz = data.data[num].tdz != undefined ? Number(Number(data.data[num].tdz).toFixed(2)) :null;
                    ydata.push(tdz);
                    var htdz = data.data[num].htdz != undefined ? Number(Number(data.data[num].htdz).toFixed(2)) : null;
                    ydataH.push(htdz);
                    var ztdz = data.data[num].ztdz != undefined ? Number(Number(data.data[num].ztdz).toFixed(2)) : null;
                    ydataZ.push(ztdz);
                }
                console.error(ydataH);
                chartCW("cwchart", xdata, ydata, ydataH, ydataZ);
                grid.setData(data.data);
                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "tm") {
                var s = new Date(new Date(value)).format("yyyy-MM-dd HH:mm");
                e.cellHtml = s;
            }
        }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            var JSONArray = grid.getData();
            if (e.field == "tm") {
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>最高潮位</div>";
                s += "</span>";
                e.cellHtml = s;
            }
            else if (e.field == "tdz") {
                JSONArray = sortObjectArray(JSONArray, [e.field], 'desc');
                if (JSONArray.length > 0) {
                    var tdz = JSONArray[0][e.field];
                    var tm = new Date(JSONArray[0].tm).format("MM-dd HH:mm");
                    var s = "<span style='color:Brown;'>";
                    s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>" + Number(tdz).toFixed(2) + "(" + tm+")</div>";
                    s += "</span>";
                    e.cellHtml = s;
                }
            }
            else if(e.field == "htdz"){
                if (JSONArray.length > 0) {
                    JSONArray = JSONArray.filter(function (res) {
                        return res[e.field] != undefined;
                    });
                    JSONArray = sortObjectArray(JSONArray, [e.field], 'desc');
                    var tdz = JSONArray[0][e.field];
                    var tm = new Date(JSONArray[0].tm).format("MM-dd HH:mm");
                    var s = "<span style='color:Brown;'>";
                    s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>" + Number(tdz).toFixed(2) + "(" + tm + ")</div>";
                    s += "</span>";
                    e.cellHtml = s;
                }
            }
            else if(e.field == "ztdz"){
                if (JSONArray.length > 0) {
                    JSONArray = JSONArray.filter(function (res) {
                        return res[e.field] != undefined;
                    });
                    JSONArray = sortObjectArray(JSONArray, [e.field], 'desc');
                    var tdz = JSONArray[0][e.field];
                    var tm = new Date(JSONArray[0].tm).format("MM-dd HH:mm");
                    var s = "<span style='color:Brown;'>";
                    s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>" + Number(tdz).toFixed(2) + "(" + tm + ")</div>";
                    s += "</span>";
                    e.cellHtml = s;
                }
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = mini.get("STCD").getText() + "(" + mini.get("STCD").getValue() + ")";
            name += new Date(mini.get("STIME").getFormValue()).format("yyyy年M月d日") + "-";
            name += new Date(mini.get("ETIME").getFormValue()).format("yyyy年M月d日") + "潮位数据";
            ExportExcel(data, grid, name);
			// app.post("/excelOperation/writeExcelServlet/swzzzjk.ST_TIDEHIGHParam",{ojbList:JSON.stringify(data),filename:name},(data)=>{
			// 	window.open(HuishuiApiUrl + "upLoad/" + data.data)
			// })
        }
        function chartCW(ChartName, xdata, ydata, ydataH, ydataZ) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var realEx = [];
            var maxTDZ = Math.max.apply(null, ydata);
            var maxTDZTM = "";
            var maxZS = 0;
            for (var num = 0; num < ydata.length; num++) {
                if (ydata[num] == maxTDZ) {
                    maxTDZTM = xdata[num];
                    maxZS = ydataZ[num];
                    break;
                }
            }
            var option = {
                text: mini.get("STCD").getText() + "潮位过程",
                title: {
                    //text: mini.get("STCD").getText()+"潮位过程",
                    textStyle: {
                        color: '#000',
                        fontSize: 14,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        label: {
                            backgroundColor: '#A7E0F4'
                        }
                    },
                    // formatter: (params) => {
                    //     //var str = mini.get("STCD").getText() + "<br/>";
                    //     var str=params[0].axisValue+ "<br/>";
                    //     for (var num = 0; num < params.length; num++) {
                    //         str += params[num].seriesName + ":";
                    //         str += Number(params[num].value).toFixed(2) + "m";
                    //         str += "<br/>";
                    //     }
                    //     //console.error(params);
                    //     return str;
                    // }
                },
                toolbox: {
                    show: false,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: {
                            show: false,
                            type: ['line', 'funnel'],
                            option: {
                                funnel: {
                                    x: '25%',
                                    width: '50%',
                                    funnelAlign: 'left',
                                    max: 1548
                                }
                            }
                        },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                legend: {
                    data: ['潮位','天文潮','增水'],
                    show: true,
                    selected: {
                        '天文潮': false,
                        '增水':false,
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: xdata
                    }
                ],
                yAxis: [
                    {
                        name: "潮位(m)",
                        type: 'value',
                        //max: 6,
                        //min: 2
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            var sw = 0;
                            if ((jiangenew - jiange) % 2 == 0) {
                                sw = Math.round(value.min - (jiangenew - jiange) / 200 - 1, 0);
                            }
                            else {
                                sw = Math.round(value.min - (jiangenew - jiange - 1) / 200 - 1, 0);
                            }
                            return sw;
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            var sw = 0;
                            if ((jiangenew - jiange) % 2 == 0) {
                                sw = Math.round(value.max + (jiangenew - jiange) / 200 + 1, 0);
                            }
                            else {
                                sw = Math.round(value.max + (jiangenew - jiange + 1) / 200 + 1, 0);
                            }
                            return sw;
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            }
                        },
                    }
                ],
                series: [
                    {
                        name: '潮位',
                        type: 'line',
                        color: "blue",
                        symbol: 'circle',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的,
                        symbolSize: 1,
                        label: {
                            show: false
                        },
                        data: ydata,
                        markPoint: {
                            label: {
                                show: true,
                                formatter: function (res) {
                                    //console.error(res);
                                    var value = Number(res.value).toFixed(2);
                                    return value;
                                }
                            },
                            data: [{ type: 'max', name: '最大值' }]
                        },
                    },
                    {
                        name: '天文潮',
                        type: 'line',
                        color: "#00FF00",
                        symbol: 'circle',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的,
                        symbolSize: 1,
                        label: {
                            show: false
                        },
                        data: ydataH,
                        connectNulls: true,
                    },
                    {
                        name: '增水',
                        type: 'line',
                        color: "#FF0000",
                        symbol: 'circle',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的,
                        symbolSize: 1,
                        label: {
                            show: false
                        },
                        data: ydataZ,
                        connectNulls: true,
                        markPoint: {
                            data: [
                                { type: 'max', name: '最大值' },
                                { name: '高潮增水', value: maxZS, xAxis: maxTDZTM, yAxis: maxZS },
                            ]
                        },
                    }
                ]
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html>
