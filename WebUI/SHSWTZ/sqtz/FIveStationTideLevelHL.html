    <script>
        var myData = [];
        mini.parse();
        var grid = mini.get("grid1");
        var cblCom = mini.get("cbl1");
        cblCom.on("valuechanged", function (e) {
            STGRDColumn();
        });
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var dataResult = [
                { STCD: "63401750", STNM: "吴淞口" },
                { STCD: "62701710", STNM: "高桥（二）" },
                { STCD: "63405800", STNM: "芦潮港" },
                { STCD: "63401100", STNM: "米市渡" },
                { STCD: "63401500", STNM: "黄浦公园" },
                { STCD: "63405900", STNM: "金山嘴" }
            ];
            mini.get("STCD").setData(dataResult);
            mini.get("STCD").select(0);
            var curDate = new Date();
            var stime = addDayDate(curDate.format("yyyy-MM-dd"), -20);
            var etime=addDayDate(curDate.format("yyyy-MM-dd"), -1);
            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            var ComData = [
                { "id": "HH", "text": "显示高潮位"},
                { "id": "LL", "text": "显示低潮位",}
            ];
            cblCom.setData(ComData);
            STGRDColumn();
            searchZT();
            search();
        });
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var stime = mini.get("STIME").getFormValue() + " 00:00:00";
            var etime = mini.get("ETIME").getFormValue() + " 23:59:59";
            var strWhere = {
                STIME: stime, ETIME: etime, STCD: mini.get("STCD").getValue(), TDPTN: "2"
            };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_TIDEHIGHLTJ", strWhere, "Sel");
        }
        function searchZT() {
            var strWhere = {
            };
            GetJosns("SWZZ_FLOODTIDEDATA_ZHUANTISel", strWhere, "SelZT");
        }
        function onvaluechangedTF(e) {
            var value = e.value;
            var selected = mini.get("TFNAME").getSelected();
            var stm = convertToDate(selected.STM).format("yyyy-MM-dd");
            var etm = convertToDate(selected.ETM).format("yyyy-MM-dd");
            mini.get("STIME").setValue(stm);
            mini.get("ETIME").setValue(etm);
            search();
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                grid.setData(data.data);
                mini.unmask(document.body);
            }
            else if (typeID == "SelZT") {
                var dataResult = data.data.filter(function (e) {
                    e.TFNAME = e.STATUS + "" + e.TITLE;
                    return e.STM != null;
                });
                mini.get("TFNAME").setData(dataResult);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "TM") {
                var s = new Date(convertToDate(value)).format("yyyy-MM-dd");
                e.cellHtml = s;
            }
        }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            var JSONArray = grid.getData();
            if (e.field == "TM") {
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>最大值</div>";
                s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>高潮位增水</div>";
                s += "</span>";
                e.cellHtml = s;
            }
            else if (e.field == "TDZ" || e.field == "HTDZ" || e.field == "ZTDZ") {
                JSONArray = sortObjectArray(JSONArray, [e.field], 'desc');
                if (JSONArray.length > 0) {
                    var tdz = JSONArray[0][e.field];
                    var s = "<span style='color:Brown;'>";
                    s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>" + Number(tdz).toFixed(2) + "</div>";

                    if (e.field == "ZTDZ") {
                        //高潮位增水=最高潮位减去这段时间最高天文潮，时间上会推后
                        JSONArray = sortObjectArray(JSONArray, ["TDZ"], 'desc');
                        tdz = JSONArray[0]["TDZ"];
                        var tdztm = JSONArray[0]["TM"];//高潮位出现时间
                        JSONArray = sortObjectArray(JSONArray, ["TM"], 'asc');
                        var JSONArray = JSONArray.filter(function (e) {
                            return e.TM >= tdztm;
                        });
                        var htdz;
                        for (var num = 0; num < JSONArray.length; num++) {
                            //console.error(convertToDate(JSONArray[num].TM).format("yyyy-MM-dd HH:mm:ss"));
                            var tdzValue = JSONArray[num].HTDZ;
                            if (num > 0 && num < JSONArray.length - 1) {
                                var qtdzValue = JSONArray[num - 1].HTDZ;
                                var htdzValue = JSONArray[num + 1].HTDZ;
                                //console.error(convertToDate(JSONArray[num].TM).format("yyyy-MM-dd HH:mm:ss") + "," + qtdzValue + "," + tdzValue + "," + htdzValue);

                                if (tdzValue > htdzValue && tdzValue >= qtdzValue) {
                                    //console.error("高潮位对应的天文潮高潮位：" + tdzValue);
                                    htdz = tdzValue;
                                    break;
                                } else { }
                            }
                        }
                        //var htdz = JSONArray[0]["HTDZ"];
                        var tdzcha = tdz - htdz;
                        //console.error("高潮位增水：" + tdzValue);
                        s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>" + Number(tdzcha).toFixed(2) + "</div>";
                    } else {
                        s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>&nbsp;&nbsp;</div>";
                    }

                    s += "</span>";
                    e.cellHtml = s;
                }
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = mini.get("STCD").getText() + "(" + mini.get("STCD").getValue() + ")";
            name += new Date(mini.get("STIME").getFormValue()).format("yyyy年M月d日") + "-";
            name += new Date(mini.get("ETIME").getFormValue()).format("yyyy年M月d日") + "整点潮位数据";
            ExportExcel(name, columns, data);
        }
        //表头
        function STGRDColumn() {
            var createGrid = [];
            createGrid.push({ type:"indexcolumn", headerAlign: "center", align: "center", header: "序号", width: "30" });
            createGrid.push({ field: "TM", headerAlign: "center", align: "center", header: "日期"});
            var fieldType = cblCom.getValue();
            if (fieldType.indexOf("HH") > -1) {
                createGrid.push({
                    headerAlign: "center", align: "center", header: "高高潮", columns: [
                        { field: "HHTDZT", headerAlign: "center", align: "center", header: "天文潮", width: "60" },
                        { field: "HHTDZ", headerAlign: "center", align: "center", header: "潮位", width: "60" },
                        { field: "HHTDZTM", headerAlign: "center", align: "center", header: "时间", width: "60" },
                        { field: "HHTDZZS", headerAlign: "center", align: "center", header: "增水", width: "60" },
                        { field: "HHTDZFD", headerAlign: "center", align: "center", header: "超警幅度", width: "60" }
                    ]
                });
                createGrid.push({
                    headerAlign: "center", align: "center", header: "低高潮", columns: [
                        { field: "HLTDZT", headerAlign: "center", align: "center", header: "天文潮", width: "60" },
                        { field: "HLTDZ", headerAlign: "center", align: "center", header: "潮位", width: "60" },
                        { field: "HLTDZTM", headerAlign: "center", align: "center", header: "时间", width: "60" },
                        { field: "HLTDZZS", headerAlign: "center", align: "center", header: "增水", width: "60" },
                        { field: "HLTDZFD", headerAlign: "center", align: "center", header: "超警幅度", width: "60" }
                    ]
                });
            }
            if (fieldType.indexOf("LL") > -1) {
                createGrid.push({
                    headerAlign: "center", align: "center", header: "低潮", columns: [
                        { field: "LTDZT", headerAlign: "center", align: "center", header: "天文潮", width: "60" },
                        { field: "LTDZ", headerAlign: "center", align: "center", header: "潮位", width: "60" },
                        { field: "LTDZTM", headerAlign: "center", align: "center", header: "时间", width: "60" },
                        { field: "LTDZZS", headerAlign: "center", align: "center", header: "增水", width: "60" },
                        { field: "LTDZFD", headerAlign: "center", align: "center", header: "超警幅度", width: "60" }
                    ]
                });
                createGrid.push({
                    headerAlign: "center", align: "center", header: "低低潮", columns: [
                        { field: "LLTDZT", headerAlign: "center", align: "center", header: "天文潮", width: "60" },
                        { field: "LLTDZ", headerAlign: "center", align: "center", header: "潮位", width: "60" },
                        { field: "LLTDZTM", headerAlign: "center", align: "center", header: "时间", width: "60" },
                        { field: "LLTDZZS", headerAlign: "center", align: "center", header: "增水", width: "60" },
                        { field: "LLTDZFD", headerAlign: "center", align: "center", header: "超警幅度", width: "60" }
                    ]
                });
            }

            grid.set({
                columns: createGrid
            });
        }
    </script>
