    <style type="text/css">
        .checkbox-primary input[type="checkbox"]:checked + label::before,
        .checkbox-primary input[type="radio"]:checked + label::before {
            background-color: #337ab7;
            border-color: #337ab7;
        }

        .checkbox label::before {
            content: "";
            display: inline-block;
            position: absolute;
            width: 17px;
            height: 17px;
            left: 0;
            margin-left: -20px;
            border: 1px solid #cccccc;
            border-radius: 3px;
            background-color: #fff;
            -webkit-transition: border 0.15s ease-in-out, color 0.15s ease-in-out;
            -o-transition: border 0.15s ease-in-out, color 0.15s ease-in-out;
            transition: border 0.15s ease-in-out, color 0.15s ease-in-out;
        }

        .checkbox label {
            display: inline-block;
            vertical-align: middle;
            position: relative;
            padding-left: 0px;
        }

        .radio label,
        .checkbox label {
            min-height: 20px;
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }

        label {
            display: inline-block;
            max-width: 100%;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .checkbox input[type="checkbox"],
        .checkbox input[type="radio"] {
            opacity: 0;
            z-index: 1;
        }

        .radio input[type="radio"],
        .radio-inline input[type="radio"],
        .checkbox input[type="checkbox"],
        .checkbox-inline input[type="checkbox"] {
            position: absolute;
            margin-top: 4px \9;
            margin-left: -20px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 4px 0 0;
            margin-top: 1px \9;
            line-height: normal;
        }

        input[type="checkbox"],
        input[type="radio"] {
            -webkit-box-sizing: border-box;
            -moz-box-sizing: border-box;
            box-sizing: border-box;
            padding: 0;
        }

        input,
        button,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .radio + .radio,
        .checkbox + .checkbox {
            margin-top: -5px;
        }

        .checkbox {
            padding-left: 20px;
        }

        .radio,
        .checkbox {
            position: relative;
            display: block;
            margin-top: 10px !important;
            margin-bottom: 10px;
        }

        .checkbox-primary input[type="checkbox"]:checked + label::after,
        .checkbox-primary input[type="radio"]:checked + label::after {
            color: #fff;
        }

        .checkbox input[type="checkbox"]:checked + label::after,
        .checkbox input[type="radio"]:checked + label::after {
            font-family: "FontAwesome";
            content: "\f00c";
        }

        .checkbox label::after {
            display: inline-block;
            position: absolute;
            width: 16px;
            height: 16px;
            left: 0;
            top: 0;
            margin-left: -20px;
            padding-left: 3px;
            padding-top: 1px;

<body>
    <input id="URL" class="mini-hidden" />

<script src="/Common/bootstrap-fileinput/js/fileinput.min.js" type="text/javascript"></script>
<script src="/Common/bootstrap-fileinput/js/fileinput_locale_zh.js" type="text/javascript" charset="utf-8"></script>
<script type="text/javascript">
    var _PathName = GetQueryString("PATHNAME");
    var _FileName = GetQueryString("HNNM");
    var FileInput = function () {
        var oFile = new Object();

        //初始化fileinput控件（第一次初始化）
        oFile.Init = function (ctrlName, uploadUrl) {
            var control = $('#' + ctrlName);
            //初始化上传控件的样式
            control.fileinput({
                language: 'zh', //设置语言
                uploadUrl: uploadUrl, //上传的地址
                allowedFileExtensions: ['xlsx', 'xls'], //接收的文件后缀
                showClose: false,
                showUpload: false, //是否显示上传按钮
                showRemove: false, //是否显示删除按钮
                showCaption: false, //是否显示标题
                showUploadedThumbs: false,
                browseClass: "btn btn-primary", //按钮样式
                textEncoding: "UTF-8",
                dropZoneEnabled: true, //是否显示拖拽区域
                //minImageWidth: 50, //图片的最小宽度
                //minImageHeight: 50,//图片的最小高度
                //maxImageWidth: 1000,//图片的最大宽度
                //maxImageHeight: 1000,//图片的最大高度
                maxFileSize: 204800, //单位为kb，如果为0表示不限制文件大小
                //minFileCount: 0,
                maxFileCount: 100,
                enctype: 'multipart/form-data',
                validateInitialCount: true,
                previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",

                msgFilesTooMany: "选择上传的文件数量({n}) 超过允许的最大数值{m}！",
                uploadExtraData: function (previewId, index) { //额外参数的关键点
                    var obj = {};
                    obj.PATHNAME = _PathName;
                    obj.OFILES = ctrlName;
                    obj.PDFTOTIF = false;
                    obj.token = "768ADC6A9E72BFEE4891F1F98650FEEE";
                    obj.STCD = "1";
                    obj.YEAR = new Date().getFullYear()
                    return obj;
                }
            }).on('filebatchselected', function (event, data) {
                mini.mask({
                    el: document.body,
                    cls: 'mini-mask-loading',
                    html: '数据加载中...'
                });
                $(this).fileinput("upload");
            });

            var FileResult = [];
            //导入文件上传完成之后的事件
            $("#Fdata").on("fileuploaded", function (event, data, previewId, index) {
                var strJson = data.response.data;
                $.data(myData, "FILEData", strJson[0]);
                var item = eval(strJson[0].JSONDATA[0]["SheetData"]);
                var JSONDATA = strJson[0].JSONDATA;
                $.data(myData, "SheetData", item);
                $.data(myData, "JSONDATA", JSONDATA);
                GetColumnData();
                mini.unmask(document.body);
            });
        }
        return oFile;
    };

    function GetColumnData() {
        var createGrid = STGRDColumn();
        grid.set({
            columns: createGrid
        });
        var JSONDATA = $.data(myData, "JSONDATA");
        var strJson = eval(JSONDATA[0]["SheetData"]);
        strJson.removeAt(0);
        strJson.removeAt(0);
        grid.setData(strJson);
        //}
    }

    //获取表头---2022-01-05
    function STGRDColumn() {
        var createGrid = [];
        createGrid.push({ type: "indexcolumn", headerAlign: "center", align: "center", header: "序号", width: 40 });
        createGrid.push({ field: "1", headerAlign: "center", align: "center", header: "站码", width: 60 });
        createGrid.push({ field: "2", headerAlign: "center", align: "center", header: "年份", width: 60 });
        createGrid.push({ field: "3", headerAlign: "center", align: "center", header: "月日", width: 60 });
        var _field = 5;
        for (var hour = 0; hour < 24; hour++) {
            createGrid.push({
                field: _field.toString(), headerAlign: "center", align: "center", header: hour + "时", width: 50,
                editor: { type: "textbox", minValue: 0, maxValue: 10 }
            });
            _field++;
        }
        return createGrid;
    }
    
</script>
<script type="text/javascript">
    mini.parse();
    var myData = [];
    var sc_state = "0";
    var grid = mini.get("grid1");
    var stcd = GetQueryString("stcd");
    var stnm = GetQueryString("stnm");
    function shangchuan() {
        sc_state = "1";
        var fileupload = mini.get("fileupload1");
        fileupload.startUpload();
    }
    $(function () {
        //<b>" + PATHNAME + "</b>上报值班计划，
        // $("#SpanPathName").html("注：红色日期数据代表当前日期已排班，再次点击保存会被替换值班计划");
        var oFileInput = new FileInput();
        oFileInput.Init("Fdata", ServerIP + "/json/reply/SWZZ_FLOODTIDEDATA_ST_TIDE_RExcel");
    });

    function JosnSel(text, typeID) {
        if (typeID == "ADDPL") {
            if (text.total > 0) {
                ShowMsg("数据保存成功！");
                mini.unmask(document.body);
            }
        }
    }
    Array.prototype.MapApply = function (field, format) {
        var val = null;
        if (format == "max") {
            val = Math.max.apply(Math, this.map(function (o) {
                return o[field]
            }));
        } else if (format == "min") {
            val = Math.min.apply(Math, this.map(function (o) {
                return o[field]
            }));
        }
        return val;
    }
    //鼠标移动上去的提示信息。
    function ondrawcell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            value = e.value;
        //超链接任务
        if (field == "0") {
            if (value.indexOf("年") > -1) {
                e.cellStyle = "font-size:16px !important;font-weight:600;color:red;";
            } else {
                if (value == "" || value == undefined || value == null) {
                    e.cellStyle = "background:red;font-weight:bold;color:white;";
                }
            }
        }
        if (field != "0") {
            if (isNaN(value)) {
                e.cellStyle = "background:red;font-weight:bold;color:white;";
            }
        }
    }
    function saveExcel() {
        var strJson = grid.getData();
        if (strJson.length > 0) {
            console.error(strJson);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据保存中...'
            });
            var strWhere = { LISTMODE: JSON.stringify(strJson) };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_TIDE_RPLSaveNew", strWhere, "ADDPL");
        } else {
            if (mini.get("URL").getValue() == "") {
                showTips("请先上传文件");
            } else {
                showTips("请选择文件");
            }
        }
    }
</script>
