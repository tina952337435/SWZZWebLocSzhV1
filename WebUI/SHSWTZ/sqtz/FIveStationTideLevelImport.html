    <style type="text/css">
        .checkbox-primary input[type="checkbox"]:checked + label::before,
        .checkbox-primary input[type="radio"]:checked + label::before {
            background-color: #337ab7;
            border-color: #337ab7;
        }

        .checkbox label::before {
            content: "";
            display: inline-block;
            position: absolute;
            width: 17px;
            height: 17px;
            left: 0;
            margin-left: -20px;
            border: 1px solid #cccccc;
            border-radius: 3px;
            background-color: #fff;

            transition: border 0.15s ease-in-out, color 0.15s ease-in-out;
        }

        .checkbox label {
            display: inline-block;
            vertical-align: middle;
            position: relative;
            padding-left: 0px;
        }

        .radio label,
        .checkbox label {
            min-height: 20px;
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }

        label {
            display: inline-block;
            max-width: 100%;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .checkbox input[type="checkbox"],
        .checkbox input[type="radio"] {
            opacity: 0;
            z-index: 1;

        .radio input[type="radio"],
        .radio-inline input[type="radio"],
        .checkbox input[type="checkbox"],
        .checkbox-inline input[type="checkbox"] {
            position: absolute;
            margin-top: 4px \9;
            margin-left: -20px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin: 4px 0 0;
            margin-top: 1px \9;
            line-height: normal;
        }

        input[type="checkbox"],

            -moz-box-sizing: border-box;
            box-sizing: border-box;
            padding: 0;
        }

        input,
        button,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .radio + .radio,
        .checkbox + .checkbox {

        .checkbox {

        .radio,

    var FileInput = function () {

        oFile.Init = function (ctrlName, uploadUrl) {
            var control = $('#' + ctrlName);
            //初始化上传控件的样式
            control.fileinput({
                language: 'zh', //设置语言
                uploadUrl: uploadUrl, //上传的地址
                allowedFileExtensions: ['xlsx', 'xls'], //接收的文件后缀
                showClose: false,
                showUpload: false, //是否显示上传按钮
                showRemove: false, //是否显示删除按钮
                showCaption: false, //是否显示标题
                showUploadedThumbs: false,
                browseClass: "btn btn-primary", //按钮样式
                textEncoding: "UTF-8",
                dropZoneEnabled: true, //是否显示拖拽区域
                //minImageWidth: 50, //图片的最小宽度

                maxFileCount: 100,
                enctype: 'multipart/form-data',

                previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",

                uploadExtraData: function (previewId, index) { //额外参数的关键点
                    var obj = {};

                    obj.OFILES = ctrlName;
                    obj.PDFTOTIF = false;
                    obj.token = "768ADC6A9E72BFEE4891F1F98650FEEE";
                    obj.STCD = mini.get("STCD").getValue();
                    obj.YEAR = mini.get("YEAR").getValue();
                    return obj;
                }
            }).on('filebatchselected', function (event, data) {
                mini.mask({
                    el: document.body,
                    cls: 'mini-mask-loading',
                    html: '数据加载中...'
                });
                $(this).fileinput("upload");
            });

            var FileResult = [];
            //导入文件上传完成之后的事件
            $("#Fdata").on("fileuploaded", function (event, data, previewId, index) {
                var strJson = data.response.data;
                $.data(myData, "FILEData", strJson[0]);
                var item = eval(strJson[0].JSONDATA[0]["SheetData"]);
                var JSONDATA = strJson[0].JSONDATA;
                $.data(myData, "SheetData", item);
                $.data(myData, "JSONDATA", JSONDATA);
                GetColumnData();
                mini.unmask(document.body);
            });
        }
        return oFile;
    };

    function GetColumnData() {
        var createGrid = STGRDColumn();
        grid.set({
            columns: createGrid
        });
        var columnName = [],
            columnValue = [];
        var JSONDATA = $.data(myData, "JSONDATA");
        for (var _index = 0; _index < JSONDATA.length; _index++) {
            var strJson = eval(JSONDATA[_index]["SheetData"]);
            if (strJson.length > 0) {
                var year = strJson[0]["0"].substring(strJson[0]["0"].indexOf("年") - 5, strJson[0]["0"].indexOf("年"));
                year = year.replaceAll(" ", "");
                var month = strJson[0]["0"].substring(strJson[0]["0"].indexOf("年") + 1, strJson[0]["0"].indexOf("月"));
                month = month.replaceAll(" ", "");
                var strYM = year + "年" + month + "月";
                var item = { "0": strYM, "1": "","2":"" };
                var _field = 3;
                for (var hour = 0; hour < 24; hour++) {
                    item[_field.toString()] = "";
                    _field++;
                }
                columnValue.push(item);
                for (num = 4; num < strJson.length; num++) {
                    if (strJson[num]["0"].indexOf("备注") > -1 || (strJson[num]["3"] == "" && Number(strJson[num]["0"])>28)) {//读到备注等于3或者1号的潮位为0
                        break;
                    }
                    else {
                        columnValue.push(strJson[num]);
                    }
                }
            }
        }
        var _columnFiled = getColumnFiled();
        $.data(myData, "COLUMNFILED", _columnFiled);
        grid.setData(columnValue);
        //}
    }

    //获取表头---2022-01-05
    function STGRDColumn() {
        var createGrid = [];
        createGrid.push({ type: "indexcolumn", headerAlign: "center", align: "center", header: "序号", width: 40 });
        createGrid.push({ field: "0", headerAlign: "center", align: "center", header: "日期", width: 80});
        var _field = 3;
        for (var hour = 0; hour < 24; hour++) {
            createGrid.push({
                field: _field.toString(), headerAlign: "center", align: "center", header: hour + "时", width: 50,
                editor: { type: "textbox", minValue: 0, maxValue: 10} 
            });
            _field++;
        }
        return createGrid;
    }

<script type="text/javascript">

    function JosnSel(text, typeID) {
        if (typeID == "ADDPL") {
            if (text.total > 0) {
                ShowMsg("数据保存成功！");
                mini.unmask(document.body);
            }
        }
    }
    Array.prototype.MapApply = function (field, format) {
        var val = null;
        if (format == "max") {
            val = Math.max.apply(Math, this.map(function (o) {
                return o[field]
            }));
        } else if (format == "min") {
            val = Math.min.apply(Math, this.map(function (o) {
                return o[field]
            }));
        }
        return val;
    }
    //鼠标移动上去的提示信息。
    function ondrawcell(e) {
        var row = e.row,
            column = e.column,
            field = e.field,
            value = e.value;
        //超链接任务
        if (field == "0") {
            if (value.indexOf("年") > -1) {
                e.cellStyle = "font-size:16px !important;font-weight:600;color:red;";
            } else {
                if (value == "" || value == undefined || value == null) {
                    e.cellStyle = "background:red;font-weight:bold;color:white;";
                }
            }
        }
        if (field != "0") {
            if (isNaN(value)) {
                e.cellStyle = "background:red;font-weight:bold;color:white;";
            }
        }
    }
    function saveExcel() {
        mini.confirm('确定”' + mini.get("STCD").getText() + '“的潮位？', "确定？",
            function (action) {
                if (action == "ok") {
                    var strJson = grid.getData();
                    if (strJson.length > 0) {
                        console.error(strJson);
                        mini.mask({
                            el: document.body,
                            cls: 'mini-mask-loading',
                            html: '数据保存中...'
                        });
                        var strWhere = { LISTMODE: JSON.stringify(strJson), STCD: mini.get("STCD").getValue() };
                        GetJosns("SWZZ_FLOODTIDEDATA_ST_TIDE_RPLSave", strWhere, "ADDPL");
                    } else {
                        if (mini.get("URL").getValue() == "") {
                            showTips("请先上传文件");
                        } else {
                            showTips("请选择文件");
                        }
                    }
                }
            }
        );
    }
