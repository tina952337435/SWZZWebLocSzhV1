<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>台风增水</title>
    <script src="/Common/Scripts/echarts.min.js"></script>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
            background: white;
        }

        .mini-grid-checkbox {
            margin-top: 10px;
        }

        .mini-panel .mini-panel-viewport {
            width: 100%;
        }

        .mini-panel-border {
            border: 0px !important;
        }
        .mwsChart {
            width: 100%;
            height: -webkit-calc(100% - 55px);
            height: -moz-calc(100% - 55px);
            height: calc(100% - 55px);
        }
    </style>
</head>
<body>
    <div class="mini-fit">
        <div class="mini-toolbar" style=" margin-bottom:1px;">
            <table style="width:100%;">
                <tr>
                    <td style="width:100%;">
                        &nbsp; &nbsp;
                        台风名称：
                        <input id="DD_ID" name="DD_ID" class="mini-combobox" value="202106“烟花”" style="width:200px;" textField="DD_NAME" valueField="DD_ID" allowInput="true" />

                        <!--&nbsp; &nbsp;
                        开始日期： &nbsp;<input id="STIME" class="mini-datepicker" style="width:115px;" value="2021-07-21"
                                           format="yyyy-MM-dd" />&nbsp;&nbsp;
                        结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" value="2021-07-26" />-->
                    </td>
                    <td style="white-space:nowrap;"></td>
                </tr>
            </table>
        </div>
        <div class="mwsChart">
        </div>
    </div>
    <script>
        mini.parse();
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        $(function () {
            search();
        });
        var stcds = "1460481,1460381,1460281,1460581,2060881,1831983,1730483,2060181,1430383,1330183,1360481,1170181";
        var stnmArr = ["吴淞", "黄浦公园", "吴泾", "米市渡", "夏字圩", "河祝", "芦潮港", "金山嘴", "高桥", "堡镇"];
        function search() {
            var strParam = {
                "PLAN_N": "2021072523090954751", "STCD": stcds, "DATA_TYPE": "1", STIME: "2021-07-25 20:00:00", ETIME: "2021-07-27 20:00:00"
            };
            GetJosns("MODE_BDMS_PREDICTSelMORE", strParam, "daibiaozhan");

        }
        function JosnSel(data, typeID) {
            if (typeID == "daibiaozhan") {
                loadChartHtml(data.data);
            }
        }
        function loadChartHtml(dataValue) {
            var stcdsArr = stcds.split(',');
            stnmArr.forEach(function (item, index) {
                var ChartName = "chart" + (index + 1);
                strHtml = '<div id="' + ChartName + '" style="float:left;width:32.5%;margin-left:0.5%;height:320px;border: solid 1px #e8e8e8;border-radius:6px; margin-top:10px;"></div>';
                $(".mwsChart").append(strHtml);
                data = dataValue.filter(function (e) {
                    return stcdsArr[index] == e.STCD;
                });
                var data1 = [];//风暴潮
                var data2 = [];//天文潮
                var data3 = [];//总潮位
                var _XDATA = [];
                var dataResult = [];
                for (var num = 0; num < data.length; num++) {
                    var tempTM = convertToDate(data[num].YMDHM).format("MM-dd HH:mm");
                    _XDATA.push(tempTM);
                    var ZTDZ = 0;
                    var TDZ = Number(data[num].DATA);
                    var r = 0.11;
                    ZTDZ = TDZ + r;
                    data1.push(r.toFixed(2));
                    data2.push(TDZ.toFixed(2));
                    data3.push(ZTDZ.toFixed(2));
                    dataResult.push({ TM: tempTM, TDZ: TDZ.toFixed(2), ZTDZ: ZTDZ.toFixed(2), FTDZ: r });
                }
                chartSW(ChartName, data1, data2, data3, _XDATA, null, "水位(m)", item);
            });
        }
        function onGriddrawcell(e) { }
        function onSelectNode(e) { }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            if (e.field == "FTDZ" || e.field == "TDZ" || e.field == "ZTDZ") {
                e.cellHtml = "<div style='text-align:center;'>最大值: " + Number(e.value).toFixed(2) + "</div>";
            }
        }
        function chartSW(ChartName, data1, data2, data3, _XDATA, LineColor, max_min_Name, stnm) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var option = {
                title: {
                    text: stnm,
                    left: "left",
                    textStyle: {
                        color: '#000',
                        fontSize: 16,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        label: {
                            backgroundColor: '#A7E0F4'
                        }
                    }
                },
                toolbox: {
                    show: false,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: {
                            show: false,
                            type: ['line', 'funnel'],
                            option: {
                                funnel: {
                                    x: '25%',
                                    width: '50%',
                                    funnelAlign: 'left',
                                    max: 1548
                                }
                            }
                        },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                legend: {
                    data: ['风暴潮', '天文潮'],
                    x: 'right',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    padding: [10, 50, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                },
                //toolbox: {
                //    feature: {
                //        saveAsImage: {}
                //    }
                //},
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: _XDATA
                    }
                ],
                yAxis: [
                    {
                        name: "水位(m)",
                        type: 'value',
                        //max: 6,
                        //min: 2
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            var sw = 0;
                            if ((jiangenew - jiange) % 2 == 0) {
                                sw = Math.round(value.min - (jiangenew - jiange) / 200 - 1, 0);
                            }
                            else {
                                sw = Math.round(value.min - (jiangenew - jiange - 1) / 200 - 1, 0);
                            }
                            return sw;
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            var sw = 0;
                            if ((jiangenew - jiange) % 2 == 0) {
                                sw = Math.round(value.max + (jiangenew - jiange) / 200 + 1, 0);
                            }
                            else {
                                sw = Math.round(value.max + (jiangenew - jiange + 1) / 200 + 1, 0);
                            }
                            return sw;
                        },
                    }
                ],
                series: [
                    {
                        name: '风暴潮',
                        type: 'line',
                        //stack: '总量',
                        //areaStyle: {},
                        color: "#0808FF",
                        data: data1,
                        symbol: 'none',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的
                        //markPoint: {
                        //    data: [
                        //        { type: 'max', name: '最大值' },
                        //        { type: 'min', name: '最小值' }
                        //    ]
                        //}
                    },
                    {
                        name: '天文潮',
                        type: 'line',
                        //lineStyle: {
                        //    type: "dashed"
                        //},
                        color: "#1CC800",
                        symbol: 'none',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的
                        data: data2
                    },
                    //{
                    //    name: '总潮位',
                    //    type: 'line',
                    //    //lineStyle: {
                    //    //    type: "dashed"
                    //    //},
                    //    color: "#FF0B0B",
                    //    symbol: 'none',  //这句就是去掉点的
                    //    smooth: true,  //这句就是让曲线变平滑的
                    //    data: data3
                    //}
                ]
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html>
