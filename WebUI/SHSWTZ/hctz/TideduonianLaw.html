<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>潮位变化规律分析</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <!-- 引入echarts.js -->
    <script src="/Common/Scripts/echarts.min.js"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-size: 14px;
        }

        #choseMNLX li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
        }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }
    </style>
</head>

<body>
    <div class="mini-toolbar">
        <p>
            &nbsp;&nbsp;&nbsp;年份选择：&nbsp;&nbsp;
            <input id="startYear" name="STCD" class="mini-textbox" style="width: 80px;" allowinput="true" value="2011"
                onvaluechanged="onSTCDChanged" />
            —
            <input id="endYear" name="STCD" class="mini-textbox" style="width: 80px;" allowinput="true" value="2021"
                onvaluechanged="onSTCDChanged" />
        </p>
        <p id="typeList" style="margin-top:-10px;">
        <div class="searchTitle" style="height:25px;line-height:50px;">&nbsp; &nbsp;分类规则：</div>
        <ul class="ui-choose choose-type-right" id="choseMNLX">
            <li class="selected">
                <span>全部</span>
            </li>
            <li>
                <span>黄浦江干流</span>
            </li>
            <li>
                <span>黄浦江上游</span>
            </li>
            <li>
                <span>长江口、杭州湾</span>
            </li>
        </ul>
        </p>
        <div class="searchTitle" style="line-height:40px;">&nbsp; &nbsp;站点选择： </div>
        <p id="zhanList" style="margin-top:-10px;">
        </p>
    </div>
    <div class="type"
        style="height: -webkit-calc(100% - 165px);height: -moz-calc(100% - 165px);height: calc(100% - 165px);">
        <div id="CW_charts" style="height:100%;width:100%;">
        </div>
    </div>

    <script>
        $('#choseMNLX li').click(function () {
            var f = this;
            $('#choseMNLX li').each(function (index, item) {
                this.className = this == f ? 'selected' : '';
            });
        });
        mini.parse();
        var stnmArr = ["吴淞", "黄浦公园", "吴泾", "米市渡", "夏字圩", "河祝", "芦潮港", "金山嘴", "高桥", "堡镇"];
        $(function () {
            var strHtml = '<ul class="ui-choose choose-type-right" id="choseZhan">';
            stnmArr.forEach(function (item, index) {
                var cls = '';
                if (index == 0) {
                    cls = 'selected';
                }
                strHtml += '<li  class="' + cls + '"><span>' + item + '</span></li>';
            });
            strHtml += '</ul>';
            $("#zhanList").html(strHtml);
            $('#choseZhan li').click(function () {
                var f = this;
                $('#choseZhan li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
            });
        });

    </script>

    <script>
        var data = [4.67, 4.92, 5.31, 4.11, 5.05, 5.31, 5.91, 5.49, 5.01, 4.71];
        var sum = 0;
        for (var i = 0; i < data.length; i++) {
            sum += data[i]
        }
        var myChart = echarts.init(document.getElementById('CW_charts'));
        option = {
            backgroundColor: '#fff',
            title: {
                text: mini.get("startYear").getValue() + "至" + mini.get("endYear").getValue() + "潮位变化规律分析",
                x: "center",
                y: "top",
                textAlign: "center",
                textStyle: {
                    fontSize: 24,
                    fontWeight: 'normal',
                    color: ['#333']
                },
                subtextStyle: {
                    color: '#666',
                    fontSize: 16
                },
            },
            tooltip: {
                trigger: 'axis'    //鼠标悬浮提示
            },
            legend: {
                // orient: 'vertical',
                x: 'center',      //可设定图例在左、右、居中
                y: 'top',     //可设定图例在上、下、居中
                left: '41%',
                padding: [40, 0, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                data: ['年高高潮', '潮位均值',]
            },
            grid: {
                top: '5%',
                left: '3%',
                right: '1%',
                bottom: '8%',
            },
            xAxis: [
                {
                    type: 'category',
                    data: ["2021", "2012", "2013", "2014", "2015", "2016", "2018", "2019", "2020", "2021"],
                    axisTick: {
                        show: false // 是否显示坐标轴轴线
                    },
                    axisLabel: {
                        color: '#282828'
                    },
                    splitLine: {
                        show: false,
                    },
                    boundaryGap: true,
                    axisLine: { //坐标轴轴线相关设置。
                        show: true,
                        inside: false,
                        lineStyle: {
                            color: '#000'
                        }
                    }
                }
            ],
            yAxis: [
                {
                    type: 'value',
                    max: function (e) {
                        return Math.floor(e.max + 5);
                    },
                    min: 0,
                    splitNumber: 4,
                    splitLine: { show: true },
                    axisLabel: { //坐标轴刻度标签的相关设置。
                        show: true,
                        textStyle: {
                            color: '#737373',
                        }
                    },
                    axisLine: {
                        show: true,
                    },
                    axisTick: {
                        show: false,
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(131,101,101,0.2)',
                            type: 'dashed',
                        }
                    },
                    show: true,
                }
            ],
            series: [
                {
                    name: '年高高潮',
                    markLine: {
                        data: [
                            {
                                type: 'average',
                                name: '高潮均值'
                            }
                        ],
                        silent: true,
                        symbol: ['none', 'none'],
                        position: 'insideTopCenter',
                        itemStyle: {
                            normal: {
                                lineStyle: {
                                    type: "solid",
                                    color: "#f00",
                                },
                                label: {
                                    show: true,
                                    position: 'middle',
                                    formatter: "潮位均值：" + sum / data.length,
                                }
                            }
                        },
                        large: true,
                        effect: {
                            show: true,
                            loop: true,
                            Period: 0,
                            scaleSize: 2,
                            color: null,
                            shadowColor: null,
                            shadowColor: null,
                        }
                    },
                    type: 'line',
                    zlevel: 10,
                    symbol: 'none',  //这句就是去掉点的
                    smooth: true,
                    data: data,
                    itemStyle: {
                        normal: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: '#2D8DED'
                                }, {
                                    offset: 1,
                                    color: '#5ED8FB'
                                }]
                            },
                            barBorderRadius: [30, 30, 0, 0],
                        }
                    },
                    label: {
                        normal: {
                            show: false,
                            position: 'top',
                            formatter: function (params) {
                                return params.value;
                            },
                            textStyle: {
                                color: '#2D8DED', //color of value
                                fontSize: 14
                            }
                        }
                    },
                    // 可设置最大值、最小值
                    markPoint: {
                        data: [{ type: 'max', name: '最大值' }]
                    },
                }
            ]
        }
        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>

</html>
