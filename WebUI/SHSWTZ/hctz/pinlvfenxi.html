<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="/Common/Scripts/ChartJs.js"></script>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <!-- 引入echarts.js -->
    <script src="/Common/Scripts/echarts.min.js"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-size: 14px;
        }

        #choseMNLX li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
        }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
        }
        .searchTitle{
            width:92px;
            float:left;
        }
        .layout_title {
            position: relative;
            padding: 5px;
        }

        .px-2 {
            padding-right: 10px !important;
        }

        .pl-2, .px-2 {
            padding-left: 10px !important;
        }

        .layout_title .d1, .layout_title .d2 {
            width: 14px;
            height: 14px;
            background: #3794ff;
            border-radius: 2px;
            position: absolute;
            left: 4px;
            top: 15px;
            margin: 0px 10px;
        }

        .layout_title .d2 {
            background: rgba(55,148,255,.3);
            left: 11px;
            top: 9px;
        }

        .layout_title .base-p {
            color: #409eff;
            font-size: 16px;
            line-height: 0px;
            margin-left: 40px;
            font-weight: 800 !important;
            display: inline-block;
        }

        .yb_left {
            float: left;
            width: 49.75%;
            height: 100%;
            /*border: 1px solid #d3d3d3;*/
            /*background: #ffffff;*/
        }

        .tqyb_right {
            float: right;
            width: 49.75%;
            height: 100%;
            /*background: #CFE4FF;*/
        }
        .mwsChart {
            -webkit-box-shadow: 0 2px 6px 2px rgba(0,0,0,.14);
            box-shadow: 0 2px 6px 2px rgba(0,0,0,.14);
            background-color: #fff;
            /*padding-left: 10px;
            padding-right: 10px;*/
            width: 100%;
            height: 100%;
        }

        .textContent {
            width: 100%;
            height: -webkit-calc(100% - 45px);
            height: -moz-calc(100% - 45px);
            height: calc(100% - 45px);
            margin: auto;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="mini-toolbar">
        <p id="typeList" style="margin-top:-10px;">
            <div class="searchTitle" style="height:25px;line-height:50px;">&nbsp; &nbsp;分类规则：</div>
            <ul class="ui-choose choose-type-right" id="choseMNLX">
                <li class="selected">
                    <span>全部</span>
                </li>
                <li>
                    <span>黄浦江干流</span>
                </li>
                <li>
                    <span>黄浦江上游</span>
                </li>
                <li>
                    <span>长江口、杭州湾</span>
                </li>
            </ul>
        </p>
        <div class="searchTitle" style="line-height:40px;">&nbsp; &nbsp;站点选择： </div>
        <p id="zhanList" style="margin-top:-10px;">
        </p>
    </div>
    <div class="type" style="height: -webkit-calc(100% - 170px);height: -moz-calc(100% - 170px);height: calc(100% - 170px);">
        <div class="yb_left">
            <div style="width:100%;margin:0px auto;" class="mwsChart">
                <div class="layout_title px-2">
                    <div data-v-62547c07="" class="d1">
                    </div>
                    <div class="d2"></div>
                    <p class="base-p">行政分区暴雨频次分布图</p>
                </div>
                <div class="textContent">
                    <img src="../yqtz/images/频率分析1.png" alt="" style="height: 100%; width: 100%;" />
                </div>
            </div>
        </div>

        <div class="tqyb_right">
            <div style="width:calc(100%);height:100%;padding-left:5px;padding-right:5px;">
                <div class="mwsChart">
                    <div class="layout_title px-2">
                        <div data-v-62547c07="" class="d1">
                        </div>
                        <div class="d2"></div>
                        <p class="base-p">水利片区暴雨频次分布图</p>
                    </div>
                    <div id="faanCombox" class="textContent">
                        <img src="../yqtz/images/频率分析2.png" alt="" style="height: 100%; width: 100%;" />
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        mini.parse();
        var stnmArr = ["吴淞", "黄浦公园", "吴泾", "米市渡", "夏字圩", "河祝", "芦潮港", "金山嘴", "高桥", "堡镇"];

        $(function () {
            var strHtml = '<ul class="ui-choose choose-type-right" id="choseZhan">';
            stnmArr.forEach(function (item, index) {
                var cls = '';
                if (index == 0) {
                    cls = 'selected';
                }
                strHtml += '<li  class="' + cls + '"><span>' + item + '</span></li>';
            });
            strHtml += '</ul>';
            $("#zhanList").html(strHtml);
            $('#choseZhan li').click(function () {
                var f = this;
                $('#choseZhan li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
            });
        });
    </script>
</body>
</html>
