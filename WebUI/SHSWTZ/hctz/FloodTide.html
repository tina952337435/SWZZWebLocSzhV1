<body class="contentbody">

                结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;-->

    <script>
        mini.parse();
        $(function () {
            search();
        });
        var stcds = "1170181,1460481,1460381,1460281,1460581,2060881,1831983,1730483,2060181,1430383,1330183,1360481";
        function search() {
            var strParam = {
                "PLAN_N": "2021072523090954751", "STCD": stcds , "DATA_TYPE": "1",STIME:"2021-07-25 20:00:00",ETIME: "2021-07-27 20:00:00"
            };
            GetJosns("MODE_BDMS_PREDICTSelMORE", strParam, "daibiaozhan");
        }
        function JosnSel(data, typeID) {
            if (typeID == "daibiaozhan") {
                loadChartHtml(data.data);
            }
        }
        function loadChartHtml(data) {
            var stnmArr = ["吴淞", "黄浦公园", "吴泾", "米市渡", "夏字圩", "河祝", "芦潮港", "金山嘴", "高桥", "堡镇"];
            var strHtml = '';
            $(".mwsChart").html();
            var stcdsArr = stcds.split(',');
            stnmArr.forEach(function (item, index) {
                var ChartName = "chart" + (index + 1);
                strHtml = '<div id="' + ChartName + '" style="float:left;width:32.5%;margin-left:0.5%;height:320px;border: solid 1px #e8e8e8;border-radius:6px; margin-top:10px;"></div>';
                $(".mwsChart").append(strHtml);

                var str = data.filter(function (item) {
                    return stcdsArr[index] == item.STCD;
                });
                var _XDATA = [];
                var data1 = [];
                var data2 = [];
                var data3 = [];
                var data4 = [];//实测水位
                for (var num = 0; num < str.length; num++) {
                    var tempTM = convertToDate(str[num].YMDHM).format("MM-dd HH:mm");
                    _XDATA.push(tempTM);
                    data1.push(str[num].DATA.toFixed(2));
                    if (str[num].WRZ != undefined) {
                        data2.push(str[num].WRZ.toFixed(2));
                    }
                    if (str[num].GRZ != undefined) {
                        data3.push(str[num].GRZ.toFixed(2));
                    }
                    if (str[num].UPZ != undefined) {
                        data4.push(str[num].UPZ.toFixed(2));
                    }
                }
                chartSW(ChartName, data1, data2, data3, data4, _XDATA, null, "水位(m)", item);
            
            });
            
        }
        function chartSW(ChartName, data1, data2, data3, data4, _XDATA, LineColor, max_min_Name, stnm) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var option = {
                title: {
                    text: stnm,
                    left:"left",
                    textStyle: {
                        color: '#000',
                        fontSize: 16,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross',
                        label: {
                            backgroundColor: '#A7E0F4'
                        }
                    }
                },
                toolbox: {
                    show: false,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: {
                            show: false,
                            type: ['line', 'funnel'],
                            option: {
                                funnel: {
                                    x: '25%',
                                    width: '50%',
                                    funnelAlign: 'left',
                                    max: 1548
                                }
                            }
                        },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                legend: {
                    data: ['潮位', '警戒', '保证'],
                    //show: false
                    selected: {
                        '警戒': false,
                        '保证': false
                    },
                    x: 'right',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    padding: [10, 50, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                },
                //toolbox: {
                //    feature: {
                //        saveAsImage: {}
                //    }
                //},
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: false,
                        data: _XDATA
                    }
                ],
                yAxis: [
                    {
                        name: "水位(m)",
                        type: 'value',
                        //max: 6,
                        //min: 2
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            var sw = 0;
                            if ((jiangenew - jiange) % 2 == 0) {
                                sw = Math.round(value.min - (jiangenew - jiange) / 200 - 1, 0);
                            }
                            else {
                                sw = Math.round(value.min - (jiangenew - jiange - 1) / 200 - 1, 0);
                            }
                            return sw;
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            var sw = 0;
                            if ((jiangenew - jiange) % 2 == 0) {
                                sw = Math.round(value.max + (jiangenew - jiange) / 200 + 1, 0);
                            }
                            else {
                                sw = Math.round(value.max + (jiangenew - jiange + 1) / 200 + 1, 0);
                            }
                            return sw;
                        },
                    }
                ],
                series: [
                    {
                        name: '潮位',
                        type: 'line',
                        //stack: '总量',
                        //areaStyle: {},
                        color:'blue', //"#5CB7FF",
                        data: data1,
                        symbol: 'none',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的
                        //markPoint: {
                        //    data: [
                        //        { type: 'max', name: '最大值' },
                        //        { type: 'min', name: '最小值' }
                        //    ]
                        //}
                    },
                    {
                        name: '警戒',
                        type: 'line',
                        lineStyle: {
                            type: "dashed"
                        },
                        color: "orange",
                        symbol: 'none',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的
                        data: data2
                    },
                    {
                        name: '保证',
                        type: 'line',
                        lineStyle: {
                            type: "dashed"
                        },
                        color: "red",
                        symbol: 'none',  //这句就是去掉点的
                        smooth: true,  //这句就是让曲线变平滑的
                        data: data3
                    }
                ]
            };
            myChart.setOption(option);
        }
    </script>
</body>
