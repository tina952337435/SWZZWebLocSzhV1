            function ImgGunDong() {
                var box0 = $(".one"), v0 = 1.5; //这里添加滚动的对象和其速率
                var box1 = $(".two"), v1 = 1;
                Rin(box0, v0);
                Rin(box1, v1);

                function Rin($Box, v) {//$Box移动的对象，v对象移动的速率
                    var $Box_ul = $Box.find("ul"),
                        $Box_li = $Box_ul.find("li"),
                        $Box_li_span = $Box_li.find("span"),
                        left = 0,
                        s = 0,
                        timer;//定时器

                    $Box_li.each(function (index) {
                        $($Box_li_span[index]).width($(this).width());//hover
                        s += $(this).outerWidth(true); //即要滚动的长度
                    })

                    window.requestAnimationFrame = window.requestAnimationFrame || function (Tmove) { return setTimeout(Tmove, 1000 / 60) };
                    window.cancelAnimationFrame = window.cancelAnimationFrame || clearTimeout;

                    if (s >= $Box.width()) {//如果滚动长度超出Box长度即开始滚动，没有的话就不执行滚动
                        $Box_li.clone(true).appendTo($Box_ul);
                        Tmove();
                        function Tmove() {
                            //运动是移动left  从0到-s;（个人习惯往左滚）
                            left -= v;
                            if (left <= -s) { left = 0; $Box_ul.css("left", left) } else { $Box_ul.css("left", left) }
                            timer = requestAnimationFrame(Tmove);
                        }
                        $Box_ul.hover(function () { cancelAnimationFrame(timer) }, function () { Tmove() })
                    }

                }
            }

            function PicTQ() {
                var index = 0;
                var length = $("#img img").length;
                var i = 1;

                //关键函数：通过控制i ，来显示图片
                function showImg(i) {
                    $("#img img")
                        .eq(i).stop(true, true).fadeIn(800)
                        .siblings("img").hide();
                    $("#cbtn li")
                        .eq(i).addClass("hov")
                        .siblings().removeClass("hov");
                }

                function slideNext() {
                    if (index >= 0 && index < length - 1) {
                        ++index;
                        showImg(index);
                    } else {
                        if (confirm("已经是最后一张,点击确定重新浏览！")) {
                            showImg(0);
                            index = 0;
                            aniPx = (length - 5) * 142 + 'px'; //所有图片数 - 可见图片数 * 每张的距离 = 最后一张滚动到第一张的距离
                            $("#cSlideUl ul").animate({ "left": "+=" + aniPx }, 200);
                            i = 1;
                        }
                        return false;
                    }
                    if (i < 0 || i > length - 5) { return false; }
                    $("#cSlideUl ul").animate({ "left": "-=142px" }, 200)
                    i++;
                }

                function slideFront() {
                    if (index >= 1) {
                        --index;
                        showImg(index);
                    }
                    if (i < 2 || i > length + 5) { return false; }
                    $("#cSlideUl ul").animate({ "left": "+=142px" }, 200)
                    i--;
                }
                $("#img img").eq(0).show();
                $("#cbtn li").eq(0).addClass("hov");
                $("#cbtn tt").each(function (e) {
                    var str = (e + 1) + "/" + length;
                    $(this).html(str)
                })

                $(".picSildeRight,#next").click(function () {
                    slideNext();
                })
                $(".picSildeLeft,#front").click(function () {
                    slideFront();
                })
                $("#cbtn li").click(function () {
                    index = $("#cbtn li").index(this);
                    showImg(index);
                });
                $("#next,#front").hover(function () {
                    $(this).children("a").fadeIn();
                }, function () {
                    $(this).children("a").fadeOut();
                })
        }

        function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                        //chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合
                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });

            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        //  splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        min: 0,
                        max: function (value) {

                            return Number((value.max - (value.max % 5)) / 5 + 1).toFixed(0) * 5;

                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: '10%',
                                label: {
                                    normal: {
                                        show: true,
                                        position: 'top'
                                    }
                                },
                                smooth: true
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
