<body>
    <div class="mini-toolbar" style="text-align: right;">
            <a class="mini-button" onclick="Exp()" style="background: #013b56;border-color: #016aa4;width: 55px;height: 28px;line-height: 25px;">导出</a>
    </div>
    <div id="grid1" class="mini-datagrid" style="width:100%;height:100%;" allowalternating="true" borderstyle="border-right:0;"
        idfield="SID" sortmode="client" sizelist="[15,20,30,50]" pagesize="15" showpager="false" showemptytext="true"
        emptytext="暂无数据" alwaysshowemptytext="true" allowcellselect="true" allowcelledit="true" ondrawcell="ondrawcell">
        <div property="columns">
            <!--<div type="indexcolumn" headeralign="center" align="center">序号</div>-->
            <div field="RQSJ2" headeralign="center" align="center">
                时间
            </div>
            <div field="JD" headeralign="center" align="center">
                经度
            </div>
            <div field="WD" headeralign="center" align="center">
                纬度
            </div>
            <div field="QY" headeralign="center" align="center">
                气压(百帕)
            </div>
            <div field="MOVEFX" headeralign="center" align="center">
                风向
            </div>
            <div field="ZJ_RADIUS7" headeralign="center" align="center">
                7级风圈半径
            </div>
            <div field="ZJ_RADIUS10" headeralign="center" align="center">
                10级风圈半径
            </div>
            <div field="ZJ_RADIUS12" headeralign="center" align="center">
                12级别风圈半径
            </div>
            <div field="MOVESD" headeralign="center" align="center">
                移动速度(m/s)
            </div>
        </div>
    </div>

    <script>
        mini.parse();
        var myData = [];
        var grid = mini.get("grid1");
        var tfbh = GetQueryString("tfbh");
        $(function () {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
                var strWhere = { tfbh: tfbh, isYB: "false" };
                app.post("ZJ_TYPHOON_ZJ_TF/GetTyphoonList", strWhere, (data) => {
                    JosnSel(data, "GetTyphoonList")
                })

            });
        function JosnSel(data, typeID) {
            if (typeID == "GetTyphoonList") {
                var pointsData = data.data[0].points;
                pointsData = sortObjectArray(pointsData, ['RQSJ2'], "desc");
                $.data(myData, "TyphoonLJData", pointsData);
                grid.setData(pointsData);

                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            if (field == "RQSJ2") {
                e.cellHtml = new Date(convertToDate(e.value)).format("MM-dd HH:mm");
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name =tfbh+"台风路径";
            ExportExcel(data,grid,name);
        }
    </script>
</body>
