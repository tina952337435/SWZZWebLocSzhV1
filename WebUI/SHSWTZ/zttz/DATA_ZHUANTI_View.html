    <script type="text/javascript">
        mini.parse();
        var grid = mini.get("gridSQYQ");
        var myData = [];
        $(function () {
            $(".wizzy").wizzy();
            var now = new Date();
            mini.get("RC_TIME").setValue(now.format("yyyy-MM-dd"));
            mini.get("RC_CTIME").setValue(now.format("yyyy-MM-dd"));
            mini.get("ZT_STIME").setValue(addDayDate(now, -7));
            mini.get("ZT_ETIME").setValue(now.format("yyyy-MM-dd"));
            mini.get("RC_OWEN").setValue(GetCookie("LOGINNAME"));
            GetJosns("DATA_FZ_TYPESel", { "FLAG": "3" }, "ZT_TYPE");//所属分类
            GetJosns("DATA_FZ_TYPESel", { "FLAG": "4" }, "ZT_DEPARTMENT");//专题发布部门
            GetJosns("WATER_ST_STBPRP_BSel", {}, "STCD");
            var _PID = GetQueryString("PID");
            if (_PID == null) {
                _PID = GetTableID();
            } 
            $.data(myData, "HidID", _PID);
            $.data(myData, "HidTYPE", "专题照片");
            var oFileInput = new FileInput();
            oFileInput.Init("txt_file", "/GongWen/Upload.aspx?option=add&PID=" + $.data(myData, "HidID") + "&TYPE=" + $.data(myData, "HidTYPE"));
        })
        var dataResult;
        function JosnSel(ResultData, typeID) {
            if (typeID == "ZT_TYPE") {//所属分类
                var _ZT_TYPE = mini.get("ZT_TYPE");
                _ZT_TYPE.setData(ResultData.data);
                _ZT_TYPE.select(0);
            } else if (typeID == "ZT_DEPARTMENT") {
                var _ZT_DEPARTMENT = mini.get("ZT_DEPARTMENT");
                _ZT_DEPARTMENT.setData(ResultData.data);
                _ZT_DEPARTMENT.select(0);
            } else if (typeID == "SQSel") {
                dataResult = ResultData;
                JsonLineChart(ResultData.data);
                grid.setData(ResultData.data);
                //fillData(0, grid.getPageSize(), dataResult, grid);
            } else if (typeID == "STCD") {
                var tree2 = mini.get("SQ_STCD");
                var tempData = [];
                var type = "";
                if (ResultData.data.length > 0) {
                    tempData.push({ id: "ZDZ", STNM: "重点站", STCD: "" });
                    tempData.push({ id: "TH", STNM: "太湖流域", STCD: "" });
                    tempData.push({ id: "CQ", STNM: "城区", STCD: "" });
                    var objSTCD = sortObjectArray(ResultData.data, ['STCD'], 'asc');
                    for (num = 0; num < objSTCD.length; num++) {
                        if (objSTCD[num].ZD == "1") {
                            tempData.push({ id: objSTCD[num].STCD, STNM: objSTCD[num].STNM, STCD: objSTCD[num].STCD, pid: "ZDZ" });
                        } else {
                            if (objSTCD[num].BSNM == "太湖流域") {
                                tempData.push({ id: objSTCD[num].STCD, STNM: objSTCD[num].STNM, STCD: objSTCD[num].STCD, pid: "TH" });
                            } else if (objSTCD[num].BSNM == "城区") {
                                tempData.push({ id: objSTCD[num].STCD, STNM: objSTCD[num].STNM, STCD: objSTCD[num].STCD, pid: "CQ" });
                            }
                        }
                    }
                }
                tree2.loadList(tempData, "id", "pid");
                tree2.setValue("2101,2103,2104,2113,2208,2210,2211,2302,2303,2304,2306,1001,2102,2105,2106,2209,2212,2307, 2438");
            } else if (typeID == "GQDDZL_Sel") {
                mini.get("GQDDZL_grid").setData(ResultData.data);
                mini.get("GQDDZL_grid").selectAll(true);
            } else if (typeID == "FXKHJB_Sel") {
                mini.get("FXKHJB_grid").setData(ResultData.data);
                mini.get("FXKHJB_grid").selectAll(true);
            } else if (typeID == "NBCZDB_Sel") {
                mini.get("NBCZDB_grid").setData(ResultData.data);
                mini.get("NBCZDB_grid").selectAll(true);
            } else if (typeID == "DHTZD_Sel") {
                mini.get("DHTZD_grid").setData(ResultData.data);
                mini.get("DHTZD_grid").selectAll(true);
            } else if (typeID == "DDWJ_Sel") {
                mini.get("DDWJ_grid").setData(ResultData.data);
                mini.get("DDWJ_grid").selectAll(true);
            } else if (typeID == "FAYA_Sel") {
                mini.get("FAYA_grid").setData(ResultData.data);
                mini.get("FAYA_grid").selectAll(true);
            } else if (typeID == "MTLIST_Sel") {
                mini.get("MTLIST_grid").setData(ResultData.data);
            } else if (typeID == "MT_LISTDel") {
                PicSearch();
            } else if (typeID == "TQ_Sel") {
                var strMsg = '', strMsg2 = '';
                if (ResultData.data.length > 0) {
                    strMsg += '<div id="img">';
                    strMsg2 += ' <div id="cbtn">';
                    strMsg2 += '  <i class="picSildeLeft"><img src="images/picSlideLeft.gif"></i>';
                    strMsg2 += '<i class="picSildeRight"><img src="images/picSlideRight.gif"></i>';
                    strMsg2 += '<div id="cSlideUl">';
                    strMsg2 += ' <ul>';
                    for (num = 0; num < ResultData.data.length; num++) {
                        var tempPic = "/UploadDoc/" + new Date(convertToDate(ResultData.data[num].TBA_GETDATE)).format("yyyyMMdd") + "/" + ResultData.data[num].TBA_FILENAME;
                        if (num == 0) {
                            strMsg += '<img data-original="' + tempPic + '" src="' + tempPic + '"  style="display: inline;">';
                            strMsg2 += '<li class="hov"><img src="/UploadDoc/' + new Date(convertToDate(ResultData.data[num].TBA_GETDATE)).format("yyyyMMdd") + '/' + ResultData.data[num].TBA_FILENAME + '"><tt>' + (num + 1) + '/' + ResultData.data.length + '</tt></li>';
                        } else {
                            strMsg += '<img data-original="' + tempPic + '" src="' + tempPic + '"  >';
                            strMsg2 += '<li><img src="/UploadDoc/' + new Date(convertToDate(ResultData.data[num].TBA_GETDATE)).format("yyyyMMdd") + '/' + ResultData.data[num].TBA_FILENAME + '"><tt>' + (num + 1) + '/' + ResultData.data.length + '</tt></li>';
                        }

        function PicTQ() {
            var index = 0;
            var length = $("#img img").length;
            var i = 1;

            //关键函数：通过控制i ，来显示图片
            function showImg(i) {
                $("#img img")
                    .eq(i).stop(true, true).fadeIn(800)
                    .siblings("img").hide();
                $("#cbtn li")
                    .eq(i).addClass("hov")
                    .siblings().removeClass("hov");
            }

            function slideNext() {
                if (index >= 0 && index < length - 1) {
                    ++index;
                    showImg(index);
                } else {
                    if (confirm("已经是最后一张,点击确定重新浏览！")) {
                        showImg(0);
                        index = 0;
                        aniPx = (length - 5) * 142 + 'px'; //所有图片数 - 可见图片数 * 每张的距离 = 最后一张滚动到第一张的距离
                        $("#cSlideUl ul").animate({ "left": "+=" + aniPx }, 200);
                        i = 1;
                    }
                    return false;
                }
                if (i < 0 || i > length - 5) { return false; }
                $("#cSlideUl ul").animate({ "left": "-=142px" }, 200)
                i++;
            }

            function slideFront() {
                if (index >= 1) {
                    --index;
                    showImg(index);
                }
                if (i < 2 || i > length + 5) { return false; }
                $("#cSlideUl ul").animate({ "left": "+=142px" }, 200)
                i--;
            }
            $("#img img").eq(0).show();
            $("#cbtn li").eq(0).addClass("hov");
            $("#cbtn tt").each(function (e) {
                var str = (e + 1) + "/" + length;
                $(this).html(str)
            })

            $(".picSildeRight,#next").click(function () {
                slideNext();
            })
            $(".picSildeLeft,#front").click(function () {
                slideFront();
            })
            $("#cbtn li").click(function () {
                index = $("#cbtn li").index(this);
                showImg(index);
            });
            $("#next,#front").hover(function () {
                $(this).children("a").fadeIn();
            }, function () {
                $(this).children("a").fadeOut();
            })
        }
