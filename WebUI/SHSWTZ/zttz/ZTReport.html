    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        var filters = [{ text: '大于', value: '>' }, { text: '小于', value: '<' }, { text: '等于', value: '==' }];
        mini.parse();
        //实例化表格对象
        var grid = mini.get("grid1");
        var myData = [];
        var isMore = false;//是否是选择了更多搜索
        $(function () {
            $.data(myData, "gridHeader", "水文信息");
            var _year = new Date().format("yyyy");
            GetObj("SYear").value = 1949;
            GetObj("EYear").value = _year;
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1949",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            loadSTB();
            //默认加载数据
            search();

            var index_button = 0;
            $("#button").on("click", "ul li", function () {
                index_button = $(this).index();
                $("#button li").removeClass("li_hover");
                $(this).addClass("li_hover");
                if (index_button == 0) {//效果一
                    //$("img").stop().animate({ "width": "225px", "height": "132px" }, 600);
                } else if (index_button == 1) {//效果二
                    //$("img").stop().animate({ "width": "500px", "height": "294px" }, 600);
                } else {//效果三
                    //$("img").stop().animate({ "width": "1050px", "height": "618px" }, 600);
                }
                var name = $(this).attr('name');
                bindGridData(name);
            });
            $("#button li").hover(function () {
                $(this).addClass("li_hover");
            }, function () {
                if (index_button != $(this).index()) {
                    $(this).removeClass("li_hover");
                }
                });
            $(".wrap ul li").click(function () {
                var html = $(this).html();
                $.data(myData, "gridHeader", html);
                $(".wrap ul li").removeClass("hover");
                $(this).addClass("hover");
                bindGridHeader();
                var data =  $.data(myData, "dataAll");
                PageServerFill(grid, data);
                grid.mergeColumns(["FAYA", "company"]);
            });
        });
        function search() {
            bindGridHeader();
            isMore = false;
            $.data(myData, "KEY", null);
            $.data(myData, "YLSTCD", null);
            $.data(myData, "CWSTCD", null);
            $.data(myData, "CWVALUE", null);
            $.data(myData, "CWFUHAO", null);
            $.data(myData, "YLVALUE", null);
            $.data(myData, "YLFUHAO", null);
            PageFillData(0, 15);
        }
        function PageFillData(pageIndex, pageSize) {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var Startime = GetObj("SYear").value + "-01-01";
            var Endtime = GetObj("EYear").value + "-12-31 23:59:59";
            //查询方法
            var strWhere = {
                "STIME": Startime, "ETIME": Endtime, KEY: $.data(myData, "KEY"),
                "YLSTCD": $.data(myData, "YLSTCD"),
                "CWSTCD": $.data(myData, "CWSTCD"),
                "CWVALUE": $.data(myData, "CWVALUE"),
                "CWFUHAO": $.data(myData, "CWFUHAO"),
                "YLVALUE": $.data(myData, "YLVALUE"),
                "YLFUHAO": $.data(myData, "YLFUHAO"),
                "DDWJ":"提供2023"
            };// ,"PageIndex": pageIndex, "PageSize": pageSize
            GetJosns("SWZZ_FLOODTIDEDATA_ZHUANTIReportSel", strWhere, "Sel");
        }
        function searchMore() {
            isMore = true;
            $.data(myData, "KEY", $("#KEY").val());
            //做处理
            var YLSTCD = mini.get("YLZHAN").getValue();
            var CWSTCD = mini.get("CWZHAN").getValue();
            var CWVALUE = mini.get("edit1").getValue();
            var CWFUHAO = mini.get("edit1").getFilterValue();
            var YLVALUE = mini.get("edit2").getValue();
            var YLFUHAO = mini.get("edit2").getFilterValue();
            $.data(myData, "YLSTCD", YLSTCD);
            $.data(myData, "CWSTCD", CWSTCD);
            $.data(myData, "CWVALUE", CWVALUE);
            $.data(myData, "CWFUHAO", CWFUHAO);
            $.data(myData, "YLVALUE", YLVALUE);
            $.data(myData, "YLFUHAO", YLFUHAO);
            PageFillData(0, 15);
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data.data;
                $.data(myData, "data", dataResult);
                $.data(myData, "dataAll", data);
                PageServerFill(grid, data);
                grid.mergeColumns(["FAYA", "company"]);
                var dataX = [], dataY = [];
                var dataResult = groupBy(dataResult, "FAYA");
                var totalTF = 0;
                for (var num = (dataResult.length - 1); num >= 0; num--) {
                    dataX.push(dataResult[num][0].FAYA);
                    dataY.push(dataResult[num].length);
                    totalTF += dataResult[num].length;
                }
                chartBar("chart", dataX, dataY, totalTF);
                mini.unmask(document.body);
            }
            else if (typeID == "Del") {
                if (data.total > 0) {
                    search();
                }
            }
            else if (typeID == "TYPESel") {
                var strHtml = '<ul class="ul1" id="leixin">';
                strHtml += '<li class="">全部</li>';
                for (var num = 0; num < data.data.length; num++) {
                    strHtml += '<li class="">' + data.data[num].FZNAME + '</li>';
                }
                strHtml += '</ul>';
                $("#tzID").html(strHtml);
            }
            else if (typeID == "BSel") {
                var dataYL = data.data.filter(function (e) {
                    return e.TYPE == "2";
                });
                mini.get("YLZHAN").setData(dataYL);
                mini.get("YLZHAN").select(0);

                var dataCW = data.data.filter(function (e) {
                    return e.TYPE == "1";
                });
                mini.get("CWZHAN").setData(dataCW);
                mini.get("CWZHAN").select(0);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var rowIndex = e.rowIndex;
            if (field == "STM") {
                var stm = mini.formatDate(convertToDate(value), 'yyyy-MM-dd');
                e.cellHtml = stm;
            }
            if (field == "SHENHE") {
                // var stm = "";
                // if (value != undefined) {
                //     stm = new Date(value).format('yyyy-MM-dd HH:mm');
                // }
                // e.cellHtml = stm;
            }
            if (field == "ADDRESS") {
                if (value == "未登陆") {
                    //e.cellHtml = "-";
                }
            }
            if (field == "SHIJIAN" || field == "BUMEN" || field == "SHENHE" || field == "FD_TM") {
                if (value == "" || value == null || value == undefined) {
                    e.cellHtml = "-";
                }
            }
            if (field == "action") {
                var s = '<span  style="cursor:pointer;" onclick="LookView(\'' + record.ID + '\',\'' + record.TITLE + '\',\'' + record.TYPE + '\')"><img src="/Common/miniui/themes/icons/look.gif" title="进入专题"/>&nbsp;进入专题</span>'
                //s += '<span><img style="cursor:pointer;" onclick="del(\'' + record.ID + '\')" src="/Common/miniui/themes/icons/remove.png" title="删除专题管理" />&nbsp;</span>';
                e.cellHtml = s;
            }
        }
        function LookView(objID, objTitle, objType) {
            //alert(objType);
            var url = "/SHSWTZ/zttz/DATA_ZHUANTI_index.html?ID=" + objID;
            if (objType == "台风") {
                url = "/SHSWTZ/zttz/TFZTindexV2.html?ZT_ID=" + objID;
            }
            window.open(url);
        }
        function showSearch() {
            var dis = $(".contentSearch").css("display");
            if (dis == "none") {
                $(".contentSearch").css("display", "block");
            } else {
                $(".contentSearch").css("display", "none");
            }
        }
        function loadSTB() {
            var strWhere = {};
            GetJosns("ST_STBPRP_BPTZ", strWhere, "BSel");
        }
        function bindGridData(year) {
            var data = $.data(myData, "data");
            var dataNew = [];
            if (year == "外围") {
                dataNew = data.filter(function (e) {
                    return e.BUMEN == "外围";
                });
            } else if (year == "未登陆") {
                dataNew = data.filter(function (e) {
                    return e.SHIJIAN == "未登陆";
                });
            } else if (year == "经无锡") {
                dataNew = data.filter(function (e) {
                    return e.SHIJIAN != "未登陆" && e.BUMEN != "外围";
                });
            } else if (year == "吴淞口潮位最高") {
                dataNew = sortObjectArray(data, ['MAXZ'], "desc");
            } else if (year == "降雨量最大") {
                dataNew = sortObjectArray(data, ["DRP"], "desc");
            } else if (year == "台风年份") {
                dataNew = sortObjectArray(data, ["FAYA"], "desc");
            } else if (year == "风力登陆强度") {
                //dataNew = sortObjectArray(data, ["SHIJIAN"], "desc");
                dataNew = sortObjectArray(data, ["BUMEN"], "desc");
            } else if (year == "无锡停留时间最久") {
                dataNew = getTFSC(data);
            }
            else {//年份
                dataNew = data.filter(function (e) {
                    return e.FAYA == year;
                });
            }
            grid.setData(dataNew);
            grid.mergeColumns(["FAYA", "company"]);
        }
        function bindGridHeader() {
            var gridHeader = $.data(myData, "gridHeader");
            var createGrid = [];
            if (gridHeader == "台风信息") {
                createGrid = [
                    { type: "indexcolumn", headerAlign: "center", align: "center", header: "序号" },
                    { field: "FAYA", name:"FAYA", headerAlign: "center", align: "center", header: "年份" },
                    { field: "TITLE", headerAlign: "center", align: "center", header: "专题名称" },
                    { field: "FD_TM", headerAlign: "center", align: "center", header: "影响上海日期" },
                    { field: "BUMEN", headerAlign: "center", align: "center", header: "上海受影响风力" },
                    { field: "SHIJIAN", headerAlign: "center", align: "center", header: "登陆强度" },
                    { field: "ADDRESS", headerAlign: "center", align: "center", header: "登陆位置" },
                    { field: "SHENHE", headerAlign: "center", align: "center", header: "登陆时间" },
                ];
            } else {
                createGrid = [
                    { type: "indexcolumn", headerAlign: "center", align: "center", header: "序号" },
                    { field: "FAYA", name: "FAYA", headerAlign: "center", align: "center", header: "年份" },
                    { field: "TITLE", headerAlign: "center", align: "center", header: "专题名称" },

                ];
            }
            createGrid.push({ field: "action", name: "action", headerAlign: "center", align: "center", header: "基本操作" });
            grid.set({
                columns: createGrid
            });
        }

            var data = grid.data;

            var name = GetObj("SYear").value + "-" + GetObj("EYear").value + "年影响上海台风列表";
