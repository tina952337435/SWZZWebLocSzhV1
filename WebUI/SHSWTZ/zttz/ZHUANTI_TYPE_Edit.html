<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <title>类型管理</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }

        .lie2 {
            width: 80%;
        }
    </style>
</head>
<body class="contentbody">
    <div id="form1" style="text-align: center;">
        <table cellspacing='0' cellpadding='0' border='0' class="table1" id='GridView1' style=' background-color: White; width:98%; border-collapse: collapse;'>
            <tr>
                <td colspan="2" align="center"  class="CssTitle">
                    类型管理
                    <input id="FZID" name="FZID" class="mini-textbox Span90" style="display:none;" />
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    名称
                </td>
                <td class="lie2">
                    <input id="FZNAME" name="FZNAME" class="mini-textbox Span90" required="true"/>
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    类型
                </td>
                <td class="lie2">
                    <input id="FLAG" name="FLAG" class="mini-textbox Span90"  required="true"/>
                </td>
            </tr>
            <tr>
                <td class="lie1" align="right">
                    备注
                </td>
                <td class="lie2">
                    <input id="NOTE" name="NOTE" class="mini-textbox Span90" />
                </td>
            </tr> 
            <tr>
                <td colspan="2" class="lie2" align="center" style="text-align:center;height:50px;line-height:50px; ">
                    <a class="mini-button" onclick="onOk" style="width:60px;margin-right:20px;">保存</a>
                    <a class="mini-button" onclick="onCancel" style="width:60px;">取消</a>
                </td>
            </tr>
        </table>
    </div>
    <script type="text/javascript">
        mini.parse();
        var myData = [];
        var form = new mini.Form("form1");
        //标准方法接口定义
        function SetData(data) {
            $.data(myData, "action", data.action);
            if (data.action == "edit") {
                mini.get("FZID").setValue(data.FZID);
                var strWhere = { "FZID": data.FZID };
                GetJosns("SWZZ_FLOODTIDEDATA_ZHUANTI_TYPESel", strWhere, "Sel");
            } else if (data.action == "new") {
                var strID = GetTableID();
                mini.get("FZID").setValue(strID);
                //var tm = new Date();
                //mini.get("TM").setValue(tm.format("yyyy-MM-dd"));
            }
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    var o = mini.decode(data.data[0]);
					mini.get("FZNAME").setValue(o.FZNAME);
					mini.get('NOTE').setValue(o.NOTE);
					mini.get('FLAG').setValue(o.FLAG);
					mini.get('FZID').setValue(o.FZID);
                    FromSetData(o);
                }
            }
            else if (typeID == "Update") { 
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            else if (typeID == "Add") { 
                if (data.total > 0) {
                    CloseWindow("save");
                }
            }
            mini.unmask(document.body);
        }
        //关闭窗体
        function CloseWindow(action) {
            if (action == "close" && form.isChanged()) {
                if (confirm("数据被修改了，是否先保存？")) {
                    return false;
                }
            }
            if (window.CloseOwnerWindow)
                return window.CloseOwnerWindow(action);
            else
                window.close();
        }
        function onCancel(e) {
            CloseWindow("cancel");
        }
        function onOk(e) {
            //保存数据
            form.validate();
            if (form.isValid() == false)
                return;
            var objSate = $.data(myData, "action");
            if (objSate == "edit") {
                var strId = mini.get("FZID").getValue();
            }
            else {
                var strId = GetTableID();
                mini.get("FZID").setValue(strId);
            }
            var strWhere = form.getData(true, true);
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            if (objSate == "edit") {
                GetJosns("SWZZ_FLOODTIDEDATA_ZHUANTI_TYPEUpdate", strWhere, "Update");
            }
            else {
                GetJosns("SWZZ_FLOODTIDEDATA_ZHUANTI_TYPEAdd", strWhere, "Add");
            }
        }
    </script>
</body>
</html>
