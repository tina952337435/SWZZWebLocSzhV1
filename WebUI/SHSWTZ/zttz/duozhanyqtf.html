<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="/Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0px;
            padding: 0px;
        }
    </style>
</head>
<body>
    <div id="Chart" style="height:96%;width:100%;text-align: center">
    </div>
    <script>
        mini.parse();
        var myData = [];
        var Startime = GetQueryString("STIME");
        var Endtime = GetQueryString("ETIME");
        var STCD = GetQueryString("STCD");
        $(function () {
            search();
        });
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            
            var tmChaH = GetDateDiff(Startime, Endtime, 'hour');
            var DAYHOUR = "HOUR";
            if (tmChaH > 72) {
                DAYHOUR = "DAY";
            }
            $.data(myData, "DAYHOUR", DAYHOUR);
            var strWhere = {
                STIME: Startime, ETIME: Endtime, STCD: STCD, DAYHOUR: DAYHOUR
            };
            if (new Date(Startime).getFullYear() <= (new Date().getFullYear()-10)) {
                GetJosns("FLOODTIDEDATA_ST_PPTN_RSel", strWhere, "WATER_ST_PPTN_RDZNEW");
            }
            else {
                GetJosns("WATER_ST_PPTN_RDZNEW", strWhere, "WATER_ST_PPTN_RDZNEW");
            }
        }
        function loadYQHtml(data) {
            if (data.length > 0) {
                var dataX = [], dataY = [];
                for (var num = 0; num < data.length; num++) {
                    var tm = new Date(convertToDate(data[num].TM)).format("M月d日H时");
                    if ($.data(myData, "DAYHOUR") == "DAY") {
                        tm = new Date(convertToDate(data[num].TM)).format("M月d日");
                    } else if ($.data(myData, "DAYHOUR") == "MINUTE") {
                        tm = new Date(convertToDate(data[num].TM)).format("H时m分");
                    }
                    dataX.push(tm);
                    dataY.push(data[num].DRP);
                }
                var LineColor = ['#257BEE', '#FF0000', '#00FF00', '#FFA500'];
                chartYL("Chart", dataX, dataY, LineColor);
            }
            mini.unmask(document.body);
        }
        function JosnSel(data, typeID) {
            if (typeID == "WATER_ST_PPTN_RDZNEW") {
                var dataResult = data.data;
                if (new Date(Startime).getFullYear() > 2020) {
                    dataResult = sortObjectArray(dataResult, ['TM'], 'asc');
                }
                loadYQHtml(dataResult);
            }
        }
        function chartBar(ChartName, dataX, dataY) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            myChart.clear();
            var colorArray = [
                {
                    top: '#ffa800', //黄
                    bottom: 'rgba(11,42,84,.3)'
                }, {
                    top: '#1ace4a', //绿
                    bottom: 'rgba(11,42,84, 0.3)'
                },
                {
                    top: '#4bf3ff', //蓝
                    bottom: 'rgba(11,42,84,.3)'
                }, {
                    top: '#4f9aff', //深蓝
                    bottom: 'rgba(11,42,84,.3)'
                },
                {
                    top: '#b250ff', //粉
                    bottom: 'rgba(11,42,84,.3)'
                }
            ];
            var isdataZoom = false;
            if (dataX.length > 24) {
                isdataZoom = true;
            }
            option = {
                //backgroundColor: '#0E2A43',
                tooltip: {
                    show: true,
                    formatter: "{b}:{c}"
                },
                grid: {
                    left: '5%',
                    top: 20,
                    right: '5%',
                    bottom: 20,
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    //show: false,
                    //position: 'top',
                    axisTick: {
                        show: false
                    },
                    axisLine: {
                        show: false,
                        lineStyle: {
                            color: '#fff',
                        }
                    },
                    splitLine: {
                        show: false
                    },
                    axisLabel: {
                        color: '#B1BCD3',
                        //fontSize: '16'
                    },
                    data: dataX
                },
                yAxis: [{
                    type: 'value',
                    show: false,
                    axisTick: {
                        show: false,
                        alignWithLabel: false,
                        length: 5,

                    },
                    "splitLine": { //网格线
                        "show": false
                    },
                    //inverse: 'true', //排序
                    axisLine: {
                        show: false,
                        lineStyle: {
                            color: '#fff',
                        }
                    },
                }
                ],
                dataZoom: [
                    {
                        show: isdataZoom,
                        type: 'inside',
                        start: 0,
                        end: 30
                    },
                    {
                        start: 0,
                        end: 30
                    }
                ],
                series: [{
                    type: 'bar',
                    label: {
                        normal: {
                            show: true,
                            position: 'top',
                            formatter: function (params) {
                                return parseFloat(params.value).toFixed(1);
                                //if (params.value == 0) {  //为0时不显示
                                //    return ''
                                //} else {
                                //    return parseFloat(params.value).toFixed(1)
                                //}
                            },
                            textStyle: {
                                color: 'white', //color of value
                                fontSize: 14
                            }
                        }
                    },
                    barWidth: 12,
                    itemStyle: {
                        normal: {
                            color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [{
                                offset: 0,
                                color: "#00FFE3"
                            }, {
                                offset: 0.8,
                                color: "#4693EC"
                            }], false),
                            barBorderRadius: [20, 20, 20, 20],
                        },

                    },
                    data: dataY
                }
                ]
            };
            myChart.resize();
            myChart.setOption(option);
        }
        /* 柱状图 雨量
         * ChartName画图控件名称
         * dataS数据对象，数据格式json
         * strNote数据说明，数据类型数组，数据格式
         * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示
         */
        function chartYL(ChartName, chartTM, chartValue, LineColor) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            var max_min_Name = "雨量（mm）";
            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: '#000000',
                    borderColor: '#00FFFF',
                    borderRadius: 8,
                    borderWidth: 1,
                    padding: 10,
                    textStyle: {
                        color: '#00FFFF'
                    },
                    trigger: 'axis'
                },

                color: LineColor,
                legend: {
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#fff',
                        fontSize: 12
                    },
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#00FFFF',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#00FFFF',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        // scale: true, //是否自动计算最大最小值。
                        // min: value.min, //动态设置最大值最小值。
                        // max: value.max,
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            var val = 5;
                            if ((jiangenew - jiange) % 2 == 0) {
                                val = value.min - (jiangenew - jiange) / 20;
                            }
                            else {
                                val = value.min - (jiangenew - jiange - 1) / 20;
                            }

                            if (val < 0) {
                                val = 0;
                            }
                            return val;

                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            var val = 5;
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                val = value.max + (jiangenew - jiange) / 30;
                            }
                            else {
                                val = value.max + (jiangenew - jiange + 1) / 30;
                            }
                            if (val < 5) {
                                val = 5;
                            }
                            return val;
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#00FFFF',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0,
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    var item = {
                        name: "雨量",
                        type: 'bar',
                        data: chartValue,
                        barWidth: 10,
                        symbol: 'none',
                        label: {
                            normal: {
                                show: true,
                                position: 'top',
                                formatter: function (params) {
                                    return params.value;
                                },
                                color: "#00A3FF"
                            },
                        },
                        smooth: true,
                        itemStyle: {
                            normal: {
                                show: true,
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                    offset: 0,
                                    color: '#0099FF'
                                }, {
                                    offset: 1,
                                    color: '#00FFFF'
                                }]),
                                borderWidth: 0,
                                barBorderRadius: [15, 15, 0, 0],
                            },
                            emphasis: {
                                shadowBlur: 10,
                                shadowColor: 'rgba(105,123, 214, 0.7)'
                            }
                        }
                    }
                    serie.push(item);
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html>
