<!DOCTYPE html>
<html>
<head>
    <title>6个站点的潮位统计信息</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style>
        html, body {
            background: transparent;
            width: 100%;
            height: 100%;
        }

        ul.ui-choose > li {
            width: auto;
            padding: 0px 20px;
        }

        .mini-toolbar {
            background: transparent;
            border: 0px;
        }

        html body .mini-grid-row-hover, .mini-grid-row-alt {
            background: none !important;
            color: #fff !important;
        }

        html body .mini-grid-row-selected {
            background: none !important;
            color: #fff !important;
        }

        .mini-grid .mini-grid-bottomCell {
            background: none !important;
        }

        .mini-grid-headerCell-nowrap {
            background: none !important;
            color: #fff !important;
            background: rgba(33,58,68,0.5) !important;
            color: #00A3FF !important;
        }

        .mini-grid-summaryRow tr td {
            background: none !important;
        }

        .mini-grid-summaryRow {
            background: none !important;
        }


        .mini-radiobuttonlist-item .mini-list-icon {
        }

        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

            .mini-grid-summaryRow tr td span {
                color: #fff !important;
                line-height: 25px;
                font-weight: 400 !important;
            }

        .mini-buttonedit-button-hover,
        .mini-buttonedit-hover .mini-buttonedit-trigger {
            border: 0px solid #ababab;
            padding: 0;
            background: none !important;
        }

        .mini-grid-viewport {
            background: none !important;
        }

        .mini-buttonedit-button-hover,
        .mini-buttonedit-hover .mini-buttonedit-trigger {
            border: 0px solid #ababab;
            padding: 0;
            background: none !important;
        }

        .mini-grid-viewport {
            background: none !important;
        }

        .mini-buttonedit-border {
            border: 1px solid rgba(44,58,65,0.60);
            background: none;
        }

        .mini-buttonedit-button, .mini-buttonedit-close {
            border: 0px;
        }

        .mini-buttonedit-button-pressed, .mini-buttonedit-popup .mini-buttonedit-trigger {
            background: none;
            border: 0px;
        }

        .mini-buttonedit-input {
            color: #fff;
        }

        .mini-grid-headerCell, .mini-grid-topRightCell, .mini-grid-columnproxy {
            background: transparent;
            border: none;
        }

        .mini-panel-border {
            border: 0px !important;
        }

        .mini-grid-cell-inner {
            padding: 0 !important;
            font-size: 14px !important;
            font-family: "arial" !important;
            /* color: #FFFFFF ; */
        }

        .mini-grid-cell {
            color: #fff;
        }

        .bootstrap-switch-handle-off {
            margin-left: -3px;
        }

        .mini-buttonedit-border {
            border: 1px solid rgb(1 105 164);
        }

        .bootstrap-switch-handle-off {
            background: url(/SHSWTZ/zttz/images/menuTop.png) no-repeat center;
            background-size: 100% 100%;
            color: #fff;
        }

        .bootstrap-switch-handle-on {
            background: url(/SHSWTZ/zttz/images/menuTopSelected.png) no-repeat center;
            background-size: 100% 100%;
        }
        .mini-grid-cell-selected {
            background: none !important;
        }
    </style>
</head>
<body>
    <div id="grid1" class="mini-datagrid"
         style="width:100%;height:100%;"
         allowalternating="true" borderstyle="border-right:0;" idfield="SID" sortmode="client" sizelist="[15,20,30,50]"
         pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         allowcellselect="true" allowcelledit="true"
         ondrawcell="ondrawcell">
        <div property="columns">
            <!--<div type="indexcolumn" headeralign="center" align="center">序号</div>-->
            <div field="STNM" headeralign="center" align="center">
                站点
            </div>
            <div headeralign="center" align="center">
                最高潮位
                <div property="columns">
                    <div field="MAXZ" headeralign="center" align="center" decimalPlaces="2" dataType="float">
                        潮位
                    </div>
                    <div field="MAXZTM" headeralign="center" align="center">
                        发生时间
                    </div>
                </div>
            </div>
            <div headeralign="center" align="center">
                增水
                <div property="columns">
                    <div field="MAXZS" headeralign="center" align="center" decimalPlaces="2" dataType="float">
                        最大增水
                    </div>
                    <div field="MAXZSTM" headeralign="center" align="center">
                        发生时间
                    </div>
                </div>
            </div>
            <div headeralign="center" align="center">
                高潮增水
                <div property="columns">
                    <div field="MAXZZS" headeralign="center" align="center" decimalPlaces="2" dataType="float">
                        最大增水
                    </div>
                    <div field="MAXZZSTM" headeralign="center" align="center">
                        发生时间
                    </div>
                </div>
            </div>
            <div headeralign="center" align="center">
                超警情况
                <div property="columns">
                    <div field="WRZFD" headeralign="center" align="center" decimalPlaces="2" dataType="float">
                        超警幅度
                    </div>
                    <div field="WRZCOUT" headeralign="center" align="center">
                        超警次数
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        mini.parse();
        var myData = [];
        var grid = mini.get("grid1");
        var stime = GetQueryString("STIME");
        var etime = GetQueryString("ETIME");
        $(function () {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var strWhere = {
                STIME: stime,
                ETIME: etime,
                TDPTN: "2"
            };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_TIDEHIGH_RTJ", strWhere, "Sel");
        });
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var pointsData = data.data;
                grid.setData(pointsData);
                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            if (field == "MAXZTM" || field == "MAXZSTM" || field == "MAXZZSTM") {
                e.cellHtml = new Date(convertToDate(e.value)).format("MM-dd HH:mm");
            }
            if (field == "WRZFD") {
                if (e.value < 0) {
                    e.cellHtml ="";
                }
            }
            if (field == "STNM") {
                if (e.value =="苏州河闸桥（外）") {
                    e.cellHtml = "黄浦公园";
                }
            }
        }
    </script>
</body>
</html>
