<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../../Commonboot.js" type="text/javascript"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0px;
            padding: 0px;
        }
        .circle {
            width: 8px;
            height: 8px;
            background-color: #fff000;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        .span-fff000 {
            color: #fff000;
            font-size:17px;
            font-weight:bold;
        }

        .span-00d2ff {
            color: #00d2ff;
        }

        .divStnm {
            margin-left: 18px;
            margin-top: 2px;
            line-height: 32px;
            text-indent: 2em;
            color: #00d2ff;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="tfnote" style="width: 100%; height: 100%; overflow-y:scroll;">
    </div>
    <script>
        mini.parse();
        var myData = [];
        var ID = GetQueryString("ID");
        $(function () {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var strWhere = {};
            strWhere.stcd = ID
            strWhere.ddwj = "提供2023";
            app.post("/SWZZ_FLOOD_ZhuanTi/selectZhuanTiList", strWhere, (data) => {
                JosnSel(data, "Sel")
            })
        });
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                YBListHtml(data.data);
            }
        }
        function YBListHtml(data) {
            var strHtml = "";
            for (var num = 0; num < data.length; num++) {
                if (data[num].note != undefined) {
                    strHtml += '<div class="circle"></div><span class="span-fff000">说明</span>';
                    strHtml += '<div class="divStnm">';
                    strHtml += data[num].note;
                    strHtml += '</div>';
                }
                
                if (data[num].title2 != undefined&&data[num].title2 != "") {
                    strHtml += '<div class="circle"></div><span class="span-fff000">降雨量</span>';
                    strHtml += '<div class="divStnm">';
                    strHtml += data[num].title2;
                    strHtml += '</div>';
                }
                if (data[num].zongshu != undefined) {
                    strHtml += '<div class="circle"></div><span class="span-fff000">灾情</span>';
                    strHtml += '<div class="divStnm">';
                    strHtml += data[num].zongshu;
                    strHtml += '</div>';
                }
            }
            $("#tfnote").html(strHtml);
            mini.unmask(document.body);
        }
    </script>
</body>
</html>
