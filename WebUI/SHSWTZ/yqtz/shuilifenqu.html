<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水利分区</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <!-- 引入echarts.js -->
    <script src="/Common/Scripts/echarts.min.js"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }
        .onlytab {
            margin: 0px;
            padding: 0px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 100% !important;

        }

        .onlytab li {
            list-style: none;
            border: 1px #3291f9 solid;
            float: left;
            background-color: White;
            width: 100px !important;
            height: 25px;
            font: 14px/25px "arial";
            text-align: center;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            多年选择：
            <input id="STCD" name="STCD" class="mini-combobox" style="width: 180px;" textfield="DD_NAME"
                valuefield="DD_ID" allowinput="true" value="2021,2020,2019,2018" onvaluechanged="onSTCDChanged" />

            <ul class="onlytab" id="onlytab2"
                style="width:240px !important;position:absolute;left:260px;top:0px;margin-left:10px;">
                <!-- onlyliHover 默认选择小时累计 -->
                <li id="TitleLimonth" onclick="OnClickTitle2(this.id,'month')" class="onlyli onlyliHover start"
                    style="width: 60px !important;">每月</li>
                <li id="TitleLibefore" onclick="OnClickTitle2(this.id,'before')" class="onlyli"
                    style="width: 60px !important;">汛前</li>
                <li id="TitleLidoing" onclick="OnClickTitle2(this.id,'doing')" class="onlyli"
                    style="width: 60px !important;">汛期</li>
                <li id="TitleLiafter" onclick="OnClickTitle2(this.id,'after')" class="onlyli end"
                    style="width: 60px !important;">汛后</li>
            </ul>
        </div>
    </div>

    <div style="width:15.5%;float:left;height:100%; margin-right: 5px;background:white;">
        <ul id="tree1" class="mini-tree"
            style="width:100%;height: -webkit-calc(100% - 50px);height: -moz-calc(100% - 50px);height: calc(100% - 50px);padding:5px;"
            showTreeIcon="true" textField="STNM" idField="STNM" expandOnNodeClick="true" expandOnLoad="1"></ul>
    </div>

    <div id="SL_charts" style="height:350px;width:84%;margin:0px 16%;background:white;"></div>

    <div id="grid1" class="mini-datagrid" style="width: 84%;margin:0px 16%;height:408px;" allowalternating="true"
        borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]" pagesize="15"
        showpager="true" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
        <div property="columns">

            <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" -->
            <div width="10%" field="TM" headeralign="center" align="center" allowsort="true">
                月份
            </div>
            <!-- dataType="float":表示小数点  decimalPlaces="1"：小数点的位数 -->
            <div width="20%" field="Y2021" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                dataType="float">
                2021年
            </div>
            <div width="20%" field="Y2020" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                dataType="float">
                2020年
            </div>
            <div width="20%" field="Y2019" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                dataType="float">
                2019年
            </div>
            <div width="20%" field="Y2018" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                dataType="float">
                2018年
            </div>
        </div>
    </div>


    <script>
        mini.parse();
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        window.onload = function () {
            // 水利片区
            var data = [{
                "STNM": "水利片区", "PID": -1
            }, {
                "STNM": "嘉宝北片", "DRP": "100.1", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "浦南东片", "DRP": "96.5", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "浦南西片", "DRP": "89.9", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "商榻片", "DRP": "123.5", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "太北片", "DRP": "87.4", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "太南片", "DRP": "96.2", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "淀北片", "DRP": "88.7", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "淀南片", "DRP": "76.5", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "蕴南片", "DRP": "115.7", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "中心片", "DRP": "110.0", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "浦东片奉贤区", "DRP": "92.6", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "浦东片", "DRP": "104.8", "TM": "2021-08-01", "PID": "水利片区"
            }, {
                "STNM": "青松片", "DRP": "101.9", "TM": "2021-08-01", "PID": "水利片区"
            }];
            tree.loadList(data, "STNM", "PID");
            tree.select(1);
        }
        // ul li 选择切换行政分区和水利分区
        function OnClickTitle2(objID, objPathName) {//选择类型
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $('#dataLoad').show();
        }
    </script>

    <script>
        var data1 = [12.1, 25.1, 15.6, 33.4, 39, 50.7, 60.1, 25.1, 15.6, 33.4, 39, 11.5];
        var data2 = [22, 18.2, 19.1, 23.4, 29, 34.7, 22, 18.2, 19.1, 23.4, 29, 6.5];
        var data3 = [15, 23.2, 20.1, 15.4, 19, 30.7, 55, 23.2, 15.6, 20.1, 19, 10.5];
        var data4 = [9.8, 7.7, 10.1, 29.9, 40.3, 55.7, 59.8, 47.7, 10.1, 29.9, 10.3, 10.3];
        var dataResult = [];
        for (var num = 0; num < data1.length; num++) {
            var item = { "Y2021": data1[num], "Y2020": data2[num], "Y2019": data3[num], "Y2018": data4[num], "TM": (num + 1) };
            dataResult.push(item);
        }
        grid.setData(dataResult);
        var myChart = echarts.init(document.getElementById('SL_charts'));
        option = {
            title: {
                left: 'center',
                text: '嘉宝北片日雨量极值分析'
            },
            tooltip: {
                trigger: 'axis',
                axisPointer: {
                    type: 'shadow'
                }
            },
            // 更改图例默认颜色(依次应用)
            // color: ['red', 'black', 'yellow', 'pink', 'cyan'],
            color: ['#5470C6', '#91CC75', '#FAC858', '#EE6666'],
            // //这里设置柱状图上面的方块，名称跟series里的name保持一致
            legend: {
                // orient: 'vertical',
                x: 'right',      //可设定图例在左、右、居中
                y: 'top',     //可设定图例在上、下、居中
                left: '41%',
                padding: [30, 0, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                data: ['2021', '2020', '2019', '2018']
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            toolbox: {
                show: false,
                feature: {
                    saveAsImage: {}
                }
            },
            xAxis: {
                type: 'category',
                // boundaryGap: true 表示x轴两边留白
                boundaryGap: true,
                axisTick: {
                    alignWithLabel: true
                },
                data: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月']
            },
            yAxis: {
                name: "雨量(mm)",
                type: 'value'
            },
            series: [
                {
                    name: '2021',
                    type: 'bar',
                    data: [12.1, 25.1, 15.6, 33.4, 39, 50.7, 60.1, 25.1, 15.6, 33.4, 39, 11.5],
                    itemStyle: {
                        normal: {
                            show: true,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                offset: 0,
                                color: '#7ea8ee'
                            }, {
                                offset: 1,
                                color: '#2dc5fe'
                            }]),
                            // barBorderRadius: 50,
                            borderWidth: 0,
                            label: {
                                show: true,  //开启显示
                                formatter: '{c}',  //显示数值
                                position: 'top',
                                textStyle: { //数值样式
                                    fontSize: 10
                                }
                            }
                        },
                        emphasis: {
                            shadowBlur: 15,
                            shadowColor: 'rgba(105,123, 214, 0.7)'
                        }
                    }
                },
                {
                    name: '2020',
                    type: 'bar',
                    data: [22, 18.2, 19.1, 23.4, 29, 34.7, 22, 18.2, 19.1, 23.4, 29, 6.5],
                    itemStyle: {
                        normal: {
                            show: true,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                offset: 0,
                                color: '#D90816'
                            }, {
                                offset: 1,
                                color: '#FFA9A3'
                            }]),
                            // barBorderRadius: 50,
                            borderWidth: 0,
                            label: {
                                show: true,  //开启显示
                                formatter: '{c}',  //显示数值
                                position: 'top',
                                textStyle: { //数值样式
                                    fontSize: 10
                                }
                            }
                        },
                        emphasis: {
                            shadowBlur: 15,
                            shadowColor: 'rgba(105,123, 214, 0.7)'
                        }
                    },

                },
                {
                    name: '2019',
                    type: 'bar',
                    data: [15, 23.2, 20.1, 15.4, 19, 30.7, 55, 23.2, 15.6, 20.1, 19, 10.5],
                    itemStyle: {
                        normal: {
                            show: true,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                offset: 0,
                                color: '#F7C016'
                            }, {
                                offset: 1,
                                color: '#FBF931'
                            }]),
                            borderWidth: 0,
                            label: {
                                show: true,  //开启显示
                                formatter: '{c}',  //显示数值
                                position: 'top',
                                textStyle: { //数值样式
                                    fontSize: 10
                                }
                            }
                        },
                        emphasis: {
                            shadowBlur: 15,
                            shadowColor: 'rgba(105,123, 214, 0.7)'
                        }
                    }
                },
                {
                    name: '2018',
                    type: 'bar',
                    data: [9.8, 7.7, 10.1, 29.9, 40.3, 55.7, 59.8, 47.7, 10.1, 29.9, 10.3, 10.3],
                    itemStyle: {
                        normal: {
                            show: true,
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                offset: 0,
                                color: '#6EDAD6'
                            }, {
                                offset: 1,
                                color: '#93DAD2'
                            }]),
                            borderWidth: 0,
                            label: {
                                show: true,  //开启显示
                                formatter: '{c}',  //显示数值
                                position: 'top',
                                textStyle: { //数值样式
                                    fontSize: 10
                                }
                            }
                        },
                        emphasis: {
                            shadowBlur: 15,
                            shadowColor: 'rgba(105,123, 214, 0.7)'
                        }
                    }
                },
            ]
        };
        // 使用刚指定的配置项和数据显示图表。
        myChart.setOption(option);
    </script>
</body>
</html>
