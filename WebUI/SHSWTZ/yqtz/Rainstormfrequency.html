    <script>
        mini.parse();
        $(function () {
            var HOURList = [
                { ID: "1h", NAME: "1小时" },
                { ID: "3h", NAME: "3小时" },
                { ID: "6h", NAME: "6小时" },
                { ID: "12h", NAME: "12小时" },
                { ID: "24h", NAME: "24小时" },
                { ID: "1d", NAME: "1日" },
                { ID: "3d", NAME: "3日" },
                { ID: "7d", NAME: "7日" },
                { ID: "15d", NAME: "15日" },
                { ID: "30d", NAME: "30日" }

            mini.get("HOUR").setData(HOURList);
            mini.get("HOUR").select(0);

        function search() {
            var strWhere = { STCD: mini.get("ZHAN").getValue(), TYPE: mini.get("HOUR").getValue() };
            GetJosns("RAINFREQUENCYLine", strWhere, "SelData");
        }
        function onSTCDChanged() {
            var stnm = mini.get("ZHAN").getText();
            var hour = mini.get("HOUR").getText();
            $("#chartTitle").html(stnm + hour + "降水频率曲线");
            search();

        function Canvas() {
            var xLength = 7.44 * 100;
            var canvas = document.getElementById("myCanvas");
            canvas.width = xLength + 20;
            canvas.height = 200 * 3 + 20;
            canvas.style.border = "1px solid #B8B8B8";
            var ctx = canvas.getContext("2d");
            //ctx.fillStyle = "#FF0000";
            //ctx.fillRect(0, 0, 900, 600);
            ctx.beginPath();
            ctx.moveTo(20, 20);
            ctx.lineTo(20, canvas.height - 20);
            ctx.lineTo(xLength, canvas.height - 20);
            //ctx.lineTo(70, 100);
            //ctx.closePath();
            ctx.stroke();

            var c = normsinv(0.1 / 100) - normsinv(0.0001);
            var x = c * xLength / 7.44;
            var y = (canvas.height - 20) * 124.2 / 182.6;
            console.error(x);
            console.error(y);
            ctx.clearRect(0, 0, x, y);
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    mini.get("ZHAN").setData(data.data);
                    mini.get("ZHAN").select(0);
                    var stnm = mini.get("ZHAN").getText();
                    var hour = mini.get("HOUR").getText();
                    $("#chartTitle").html(stnm + hour+"降水频率曲线");
                    search();
                }
            }
            else if (typeID == "SelData") {
                var dataResult = [];
                //绘制过程线颜色设置
                var LineColor = ["#3E9D3E"];
                var strNote = [];
                var item = { "name": "频率", "codename": "P", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                item = { "name": "降雨量", "codename": "DRP", "tableV": "1", "isShow": true, "width": "30%" };
                strNote.push(item);
                dataResult = data.data.filter(function (e) {
                    return Number(e.P)>=0.01;
                });
                px = [];
                py = [];
                var maxDrp = 0;
                for (var num = 0; num < dataResult.length; num++) {
                    if (num == 0) {

                        Cv = dataResult[num].CV;
                        Cs = (Cv * 3.5).toFixed(3);
                    }
                    //dataResult.push([data.data[num].P, data.data[num].DRP]);
                    px.push(dataResult[num].P);
                    py.push(dataResult[num].DRP);

                    if (maxDrp < drp) {
                        maxDrp = drp;
                    }
                }
                maxDrp = Math.ceil(maxDrp / 100) * 100;
                
                chartH = maxDrp;
                console.error(chartH);
                drawLine();
                //绘制图形
                //chartLL("chartPie", data.data, strNote, LineColor, "降雨量(mm)");

                //绘制画布
                //Canvas();
            }
        }
        function normsinv(p) {
            var LOW = 0.02425;
            var HIGH = 0.97575;

            var a = [
                -3.969683028665376 * 10,
                2.209460984245205 * 100,
                -2.759285104469687 * 100,
                1.383577518672690 * 100,
                -3.066479806614716 * 10,
                2.506628277459239
            ];

            var b = [
                - 5.447609879822406 * 10,
                1.615858368580409 * 100,
                -1.556989798598866 * 100,
                6.680131188771972 * 10,
                -1.328068155288572 * 10
            ];

            var c = [
                -7.784894002430293 * 0.001,
                -3.223964580411365 * 0.1,
                -2.400758277161838,
                -2.549732539343734,
                4.374664141464968,
                2.938163982698783]

            var d = [
                7.784695709041462 * 0.001,
                3.224671290700398 * 0.1,
                2.445134137142996,
                3.754408661907416
            ];

            var q, r;

            if (p < LOW) {
                q = Math.sqrt(-2 * Math.log(p));
                return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4])
                    * q + c[5])
                    / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
            } else if (p > HIGH) {
                q = Math.sqrt(-2 * Math.log(1 - p));
                return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4])
                    * q + c[5])
                    / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
            } else {
                q = p - 0.5;
                r = q * q;
                return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4])
                    * r + a[5])
                    * q
                    / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4])
                        * r + 1);
            }
        }
        function chartLL(ChartName, data, strNote, LineColor, max_min_Name) {
            var YBTM = "";
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //chartTM.push(value[value1.codename]); //加入时间集合
                        chartTM.push(new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")); //加入时间集合

                    } else if (value1.name == "频率") {
                        var pp = ((index + 1) / 20) * 100;
                        console.error(pp);
                        chartTM.push(pp);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var option = {
                title: {
                    text: YBTM,
                    left: "center",
                    textStyle: {
                        color: '#000',
                        fontSize: 20,
                        fontWeight: "normal"
                    }
                },
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    show: false,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        },
                        axisLabel: {
                            interval: 0
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        //splitNumeber: 5,
                        interval: 10,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'solid',
                            }
                        },
                        //min: max_min.min, //动态设置最大值最小值。
                        //max: max_min.max,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(0);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "频率") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }
                        if (max_min_Name != "") {
                            console.error(JSON.stringify(chartTM));
                            console.error(JSON.stringify(chartValue));
                            var item = {
                                name: chartName[j],
                                //markPoint: {
                                //    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                //},
                                type: 'line',
                                data: chartValue,
                                symbol: 'none',  //这句就是去掉点的
                                smooth: true,
                                showSymbol: false,
                                clip: true,

                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                //markPoint: {
                                //    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                //},

                                symbol: 'none',  //这句就是去掉点的
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
    <script>
        var len = 0;
        var het = 0;
        var chartH = 0;
        var offsetx = 100;
        var offsety = 100;
        var px = [];//[0.01, 0.1, 0.2, 0.33, 0.5, 1, 2, 3.33, 5, 10, 20, 50, 75, 80, 90, 95, 99];
        var py = [];//[153.8, 124.2, 115.1, 108.7, 103.1, 93.9, 84.3, 77.5, 71.9, 61.9, 51.5, 36.4, 28, 26.4, 23.2, 22.4, 20.8]
        var Ex = 0;
        var Cv = 0;
        var Cs = 0;
        //drawLine()
        window.onresize = function () {
            drawLine();
        }
        function drawLine() {
            var p;
            var ps = [];
            var c = document.createElement("canvas");
            var div = document.getElementById("app");
            div.innerHTML = "";
            c.width = div.offsetWidth;
            c.height = div.offsetHeight;
            c.style.border = "1px solid #B8B8B8";
            len = div.offsetWidth;
            het = div.offsetHeight;
            div.appendChild(c);

            

            var ctx = c.getContext("2d");
            ctx.rect(0, 0, len, het);
            ctx.fillStyle = "white";
            ctx.fill();

            var chartwidth = len - offsetx;
            var chartHeight = het - offsety;
            ctx.fillStyle = "white";
            ctx.fillRect(offsetx, 0, chartwidth, chartHeight);

            //===开始曲线图
            ctx.beginPath();
            for (var i = 0; i < px.length; i++) {
                p = { x: getX(px[i]), y: getY(py[i]) }
                if (i == 0) {
                    ctx.moveTo(p.x, p.y);
                }
                else {
                    ctx.lineTo(p.x, p.y);
                }
                ps.push(p);
            }
            ctx.strokeStyle = "#FF01FF";
            ctx.stroke();
            //===结束曲线图

            ctx.font = "15px 宋体";
            ctx.strokeStyle = "green";
            ctx.save();//旋转操作在save和restore之间来完成
            ctx.translate(50, chartHeight / 2);//设定以那个点为基准点进行旋转
            ctx.rotate(270 * Math.PI / 180);//设定旋转度数
            ctx.strokeText("降雨量(mm)", 0, 0);//这里的x,y是基于translate设置的基准点来进行计算的
            ctx.restore();
            
            ctx.font = "15px";
            ctx.strokeStyle = "green";
            ctx.strokeText("频率(%)", (chartwidth/2)+20, chartwidth / 2);

            //网格线
            for (var i = 0; i < px.length; i++) {
                var x = getX(px[i]);
                ctx.beginPath();
                ctx.setLineDash([5, 2]);
                ctx.moveTo(x, 0);
                ctx.lineTo(x, chartHeight);
                ctx.strokeStyle = "green";
                ctx.stroke();

                ctx.setLineDash([]);//再切回实线
                // 设置字体样式
                ctx.font = "14px 宋体";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.strokeStyle = "#0F0CFF";
                ctx.strokeText(px[i], x, chartHeight+20);
            }
            
            var jiange = 20;
            var ynum = chartH/jiange;
            for (var i = 0; i<ynum; i++) {
                var y = i * jiange;
                y = getY(y);
                ctx.beginPath();
                ctx.setLineDash([5, 2]);
                ctx.moveTo(offsetx, y);
                ctx.lineTo(chartwidth + offsetx,y);
                ctx.strokeStyle = "green";
                ctx.stroke();

                var value = Math.round(((chartH / ynum) * i), 1);
                ctx.setLineDash([]);//再切回实线
                // 设置字体样式
                ctx.font = "14px 宋体";
                ctx.strokeStyle = "#0F0CFF";
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.strokeText(value, 80, y+5);
            }

            //=====开始内容框，Ex，CV
            
            ctx.fillStyle = '#828282';
            ctx.fillRect(chartwidth - 110, 12, 200, 82);
            ctx.fillStyle = "white";
            ctx.fillRect(chartwidth - 109, 13, 198, 80);
            //=====结束内容框，Ex，CV

            ctx.font = "14px 宋体";
            ctx.strokeStyle = "#828282";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            var text = "Ex=" + Ex + ",Cv=" + Cv + ",Cs=" + Cs;
            ctx.strokeText(text, chartwidth-10, 60);
        }
        function getX(p) {
            var chartwidth = len - offsetx;
            var allLen = normsinv(99.3) - normsinv(0.01);
            var v = normsinv(p) - normsinv(0.01);
            return v * chartwidth / allLen + offsetx
        }
        function getY(p) {
            var chartHeight = het - offsety;
            return chartHeight - chartHeight * p / chartH;
        }
        function normsinv(p) {
            p = p / 100;
            var LOW = 0.02425;
            var HIGH = 0.97575;

            var a = [-39.696830286653757, 220.9460984245205,
            -275.92851044696869, 138.3577518672690,
            -30.66479806614716, 2.5066282774592392];

            var b = [-54.476098798224058, 161.5858368580409,
            -155.69897985988661, 66.80131188771972,
            -13.280681552885721];

            var c = [-0.0077848940024302926, -0.32239645804113648,
            -2.4007582771618381, -2.5497325393437338,
                4.3746641414649678, 2.9381639826987831];

            var d = [0.0077846957090414622, 0.32246712907003983,
                2.445134137142996, 3.754408661907416];

            var q, r;

            if (p < LOW) {
                q = Math.sqrt(-2 * Math.log(p));
                return (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4])
                    * q + c[5])
                    / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
            } else if (p > HIGH) {
                q = Math.sqrt(-2 * Math.log(1 - p));
                return -(((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4])
                    * q + c[5])
                    / ((((d[0] * q + d[1]) * q + d[2]) * q + d[3]) * q + 1);
            } else {
                q = p - 0.5;
                r = q * q;
                return (((((a[0] * r + a[1]) * r + a[2]) * r + a[3]) * r + a[4])
                    * r + a[5])
                    * q
                    / (((((b[0] * r + b[1]) * r + b[2]) * r + b[3]) * r + b[4])
                        * r + 1);
            }
        }

        function NormSDist(z) {
            // this guards against overflow
            if (z > 6)
                return 1;
            if (z < -6)
                return 0;

            var gamma = 0.231641900,
                a1 = 0.319381530,
                a2 = -0.356563782,
                a3 = 1.781477973,
                a4 = -1.821255978,
                a5 = 1.330274429;

            var x = Math.abs(z);
            var t = 1 / (1 + gamma * x);


            var n = 1
                - (1 / (Math.sqrt(2 * Math.PI)) * Math.exp(-z * z / 2))
                * (a1 * t + a2 * Math.pow(t, 2) + a3 * Math.pow(t, 3) + a4
                    * Math.pow(t, 4) + a5 * Math.pow(t, 5));
            if (z < 0)
                return 1.0 - n;

            return n;
        }
        //canvas清空画布方法
        function clearCanvas() {
            try {
                var c = document.getElementById("canvas");
                var cxt = c.getContext("2d");
                cxt.fillStyle = "#000000";
                cxt.beginPath();
                cxt.fillRect(0, 0, c.width, c.height);
                cxt.closePath();
            } catch (e) {

            }
            
        } 
    </script>
