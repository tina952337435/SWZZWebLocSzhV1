    <script src="/arcgis_js_api/library/3.31/3.31/init.js" type="text/javascript"></script>
    <script>

        function MapRainfallArea() {
            var result = $.data(myData, "resultData");
            var VALUE_OBJ = addTuli();
            countyLayer1.clear();
            require(["esri/geometry/Point",
                "esri/graphic",
                "myJs/MapText",
                "esri/symbols/PictureMarkerSymbol",
                "esri/symbols/SimpleFillSymbol",
                "esri/symbols/SimpleLineSymbol",
                "esri/Color",
                "esri/InfoTemplate",
                "esri/dijit/InfoWindow",
                "esri/layers/GraphicsLayer",
                "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "esri/symbols/Font", "dojo/_base/lang",
                "esri/geometry/Polygon", "dojo/domReady!"
            ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color,
                InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, Font, lang, Polygon) {
                _destroy();
                $.get(
                    "/Common/上海市行政分区.json",//json路径
                    lang.hitch(this, function (data, status) {
                        if (status === "success") {
                            var features = data.features;
                            features.forEach(function (feature) {
                                var allrings = feature.geometry.coordinates;
                                var polygon = new Polygon(allrings);
                                var gra = feature.properties;
                                var mc = gra.NAME;
                                var stcd = gra.STCD;
                                var arr = result.filter(function (item) {
                                    return item.STNM == mc;
                                });
                                if (arr.length > 0) {
                                    var TOTALDRP = arr[0].TOTALDRP;
                                    var center = [];
                                    center = [arr[0].LGTD, arr[0].LTTD];
                                    var cls = "";
                                    var textStr = "";//arr[0].NAME + ":" +
                                    textStr = arr[0].STNM + '\n' + TOTALDRP.toFixed(1);
                                    var point = new Point({
                                        "x": center[0],
                                        "y": center[1],
                                        "spatialReference": {
                                            "wkid": 4326
                                        }
                                    });
                                    //cls += " slText ";
                                    var _align = "bottom";
                                    if (textStr == "") {
                                        textStr = "—";
                                    }
                                    var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 13);
                                    labels.push(label);
                                    var colorStr = getAreaColor(TOTALDRP, "", VALUE_OBJ);
                                    if (colorStr != null && colorStr != "" && colorStr != undefined) {
                                        var fillColorStr = getAreaColor(TOTALDRP, "fill", VALUE_OBJ);
                                        var fs = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                            new SimpleLineSymbol(SimpleLineSymbol.STYLE_DASHDOT,
                                                new Color(colorStr), 2), new Color(fillColorStr)
                                        );
                                        var lineSymbol = new SimpleFillSymbol("solid", new SimpleLineSymbol("solid",
                                            new dojo.Color(colorStr), 1),
                                            new dojo.Color(fillColorStr));
                                        var g3 = new Graphic(polygon, lineSymbol);
                                        g3.attributes = arr[0];
                                        countyLayer1.add(g3);
                                    }
                                }

                            }, this);
                        }
                    }),
                    "json"
                );
            });
        }
        function getAreaColor(zValue, type, VALUE_OBJ) {
            var color = "#ffffff";
            var colorTM = [255, 255, 255, 0];
            var colors = ["#99FF99", "#ACF57A", "#C1EB5D", "#D4E03E", "#E9D620", "#FCCD03"];
            var colorsTM = [
                [153, 255, 153, 0.6],
                [172, 245, 122, 0.6],
                [193, 235, 93, 0.6],
                [212, 224, 62, 0.6],
                [233, 214, 32, 0.6],
                [252, 205, 3, 0.6]
            ];
            var valueArr = VALUE_OBJ.split("#");
            for (var num = 0; num < valueArr.length; num++) {
                var item = valueArr[num].split(',');
                if (zValue >= Number(item[0]) && zValue < Number(item[1])) {
                    color = colors[num];
                    colorTM = colorsTM[num];
                }
            }
            if (type == "fill") {
                return colorTM;
            } else {
                return color;
            }
        }

        function addTuli() {
            var result = $.data(myData, "resultData");
            var maxNum = 0, minNum = 1000000000;
            for (var num = 0; num < result.length; num++) {
                var NUM = Number(result[num].TOTALDRP);
                if (NUM > maxNum) {
                    maxNum = NUM;
                }
                if (NUM < minNum) {
                    minNum = NUM;
                }
            }
            maxNum = maxNum + 10;
            if (minNum > 10) {
                minNum = minNum - 10;
            } else {
                minNum = 1;
            }
            var numCha = maxNum - minNum;
            var interNum = Math.floor(numCha / 6);
            var COLOR_OBJ = "#99FF99,#ACF57A,#C1EB5D,#D4E03E,#E9D620,#FCCD03";
            var COLOR_ARR = COLOR_OBJ.split(',');
            var tuliHtml = "";
            for (var num = 5; num >= 0; num--) {
                var min = (minNum + interNum * (num));
                var max = (minNum + (num + 1) * interNum);
                tuliHtml += '<p><span class="colorSpan" style="background-color:' + COLOR_ARR[num] + '"></span><span class="colorSpanValue">' + min + '</span></p>';
            }
            var VALUE_OBJ = "";
            for (var num = 0; num < 6; num++) {
                var min = (minNum + interNum * (num));
                var max = (minNum + (num + 1) * interNum);
                VALUE_OBJ += min + "," + max + "#";
            }
            if (VALUE_OBJ != "") {
                VALUE_OBJ = VALUE_OBJ.substring(0, VALUE_OBJ.length - 1);
            }
            $(window.parent.document).find("#SSTTL_TZ .colorL").html(tuliHtml);
            $(window.parent.document).find("#SSTTL_TZ").show();
            return VALUE_OBJ;
        }
    </script>
