<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代表站暴雨极值查询</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }
    </style>
</head>

<body style="zoom: 1;">
    <!-- 头部搜索框start -->
    <div style="width:100%;">
        <div class="mini-toolbar">
            &nbsp; &nbsp;
            开始日期： &nbsp;<input id="STIME" class="mini-datepicker" style="width:115px;"
                format="yyyy-MM-dd" />&nbsp;&nbsp;
            结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />&nbsp;&nbsp;
            &nbsp;&nbsp;<a class="mini-button" onclick="hour()">小时累计</a>
            &nbsp;&nbsp;<a class="mini-button" onclick="day()">日累计</a>
            <!-- &nbsp;&nbsp; <a class="mini-button" id="addbtn" onclick="window.parent.OpenTab('fa-delicious','仿真计算', '/DD_MX/Initialization.html')" plain="false">增加</a> -->
        </div>
    </div>
    <!-- 头部搜索框end -->

    <!-- 表格start -->
    <div id="grid1" class="mini-datagrid"
        style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);"
        allowalternating="true" borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]"
        pagesize="15" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" width="4%" headeralign="center" align="center">序号</div>
            <div field="DD_NAME" width="25%" headeralign="center" align="left" allowsort="true">
                站名
            </div>
            <div field="DD_TM" width="10%" headeralign="center" align="center" allowsort="true">
                最大降雨量(m)
            </div>
            <div field="DD_STANA" width="20%" headeralign="center" align="center" allowsort="true">
                发生事件
            </div>
        </div>
    </div>
    <!-- 表格end -->

    <script>
        mini.parse();
        //实例化表格对象
        var grid = mini.get("grid1");
        $(function () {
            var stime = GetQueryString("stime");
            var etime = GetQueryString("etime");
            var key = GetQueryString("key"); 
            if (stime != null) {
                mini.get("STIME").setValue(stime);
                mini.get("ETIME").setValue(etime);
                mini.get("key").setValue(key);
            } else {
                var tm = new Date();
                mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -365));
                mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));
            }
            
            //默认加载数据
            search();
        })
    </script>
</body>
</html>
