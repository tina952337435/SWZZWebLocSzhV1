<script>
    function MapRainfall(flag, picUrl) {
        var obj = {
            xmin: "120.925", ymin: "30.55", xmax: "122.00", ymax: "31.949998"
        };
        require(["esri/geometry/Point",
            "esri/graphic",
            "myJs/MapText",
            "esri/symbols/PictureMarkerSymbol",
            "esri/layers/MapImage",
            "esri/InfoTemplate",
            "esri/dijit/InfoWindow",
            "esri/layers/GraphicsLayer",
            "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "dojo/domReady!"
        ], function (Point, Graphic, MapText, PictureMarkerSymbol, MapImage, InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol) {
            if (flag == true) {
                var tempLayer = window.parent.strImageLayer;
                var strImg = ClientIP + "NC/" + picUrl;
                //console.error(strImg);
                window.parent.waterYBSWSST = picUrl;
                //alert(window.parent.strImageLayer)
                window.parent.strImageLayer = new MapImage({
                    'extent': {
                        'xmin': obj.xmin,
                        'ymin': obj.ymin,
                        'xmax': obj.xmax,
                        'ymax': obj.ymax,
                        'spatialReference': { 'wkid': 4326 }
                    }, 'href': strImg
                });
                window.parent.myMapImageLayer.addImage(window.parent.strImageLayer);
                //判断首页tab是不是当前页面，如果不是就不用叠加
                var _GlobalTab = window.parent.tabs.getActiveTab();
                var _url = _GlobalTab.url;
                if (_url.lastIndexOf("jyyb.html") > -1) {
                    window.parent.myMapImageLayer.setOpacity(0.8);
                    window.parent.myMapImageLayer.setVisibility(true);

                    setTimeout(function (e) {
                        if (window.parent.strImageLayer != undefined) {
                            window.parent.myMapImageLayer.removeImage(tempLayer);
                        }
                    }, 100);
                } else {
                    window.parent.myMapImageLayer.setVisibility(false);
                }
            } else {
                window.parent.myMapImageLayer.setVisibility(false);
            }
        });
    }
    function MapRainfallArea() {
        var result = $.data(myData, "resultData");

        //console.error(result);
        var VALUE_OBJ=addTuli();

            "esri/dijit/InfoWindow",

            "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "dojo/_base/lang",
            "esri/geometry/Polygon", "dojo/domReady!"
        ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color,
            InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, lang, Polygon) {
            _destroy();
            $.get(
                "/Common/上海市水利片区.json",//json路径
                lang.hitch(this, function (data, status) {
                    if (status === "success") {
                        var features = data.features;
                        features.forEach(function (feature) {
                            var allrings = feature.geometry.coordinates;
                            var polygon = new Polygon(allrings);
                            var gra = feature.properties;
                            var mc = gra.NAME;
                            if (mc == "中心城") {
                                mc = "蕴南片";
                            }
                            if (mc == "长兴岛片" || mc == "横沙岛片") {
                                mc = "崇明片";
                            }
                            var stcd = gra.STCD;
                            var arr = result.filter(function (item) {
                                return item.STNM == mc;
                            });
                            if (arr.length > 0) {
                                var BYNUMBER = arr[0].BYNUMBER;
                                var center = [];
                                center = [arr[0].LGTD, arr[0].LTTD];
                                var cls = "";
                                var textStr = "";//arr[0].NAME + ":" +
                                textStr = arr[0].STNM + '\n' + BYNUMBER;
                                var point = new Point({
                                    "x": center[0],
                                    "y": center[1],
                                    "spatialReference": {
                                        "wkid": 4326
                                    }
                                });
                                //cls += " slText ";
                                var _align = "bottom";
                                if (textStr == "") {
                                    textStr = "—";
                                }
                                var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 13);
                                labels.push(label);
                                var colorStr = getAreaColor(BYNUMBER, "", VALUE_OBJ);
                                if (colorStr != null && colorStr != "" && colorStr != undefined) {
                                    var fillColorStr = getAreaColor(BYNUMBER, "fill", VALUE_OBJ);
                                    var fs = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                        new SimpleLineSymbol(SimpleLineSymbol.STYLE_DASHDOT,
                                            new Color(colorStr), 2), new Color(fillColorStr)
                                    );
                                    var lineSymbol = new SimpleFillSymbol("solid", new SimpleLineSymbol("solid",
                                        new dojo.Color(colorStr), 1),
                                        new dojo.Color(fillColorStr));
                                    var g3 = new Graphic(polygon, lineSymbol);
                                    g3.attributes = arr[0];
                                    countyLayer1.add(g3);
                                }
                            }

                        }, this);
                    }
                }),
                "json"
            );
        });
    }
    function getAreaColor(zValue, type, VALUE_OBJ) {

        var colorTM = [255, 255, 255, 0];
        var colors = ["#99FF99", "#ACF57A", "#C1EB5D", "#D4E03E", "#E9D620", "#FCCD03"];

            [153, 255, 153, 0.6],
            [172, 245, 122, 0.6],
            [193, 235, 93, 0.6],
            [212, 224, 62, 0.6],
            [233, 214, 32, 0.6],
            [252, 205, 3, 0.6]
        ];
        var valueArr = VALUE_OBJ.split("#");
        for (var num = 0; num < valueArr.length; num++) {
            var item = valueArr[num].split(',');
            if (zValue >= Number(item[0]) && zValue < Number(item[1])) {
                color = colors[num];
                colorTM = colorsTM[num];
            }
        }

        //if (zValue >= 205 && zValue <= 215) {
        //    color = colors[0];
        //    colorTM = colorsTM[0];
        //}
        //else if (zValue > 215 && zValue <= 225) {
        //    color = colors[1];
        //    colorTM = colorsTM[1];
        //}
        //else if (zValue > 225 && zValue <= 235) {
        //    color = colors[2];
        //    colorTM = colorsTM[2];
        //}
        //else if (zValue > 235 && zValue <= 245) {
        //    color = colors[3];
        //    colorTM = colorsTM[3];
        //}
        //else if (zValue > 245 && zValue <= 255) {
        //    color = colors[4];
        //    colorTM = colorsTM[4];
        //}
        //else if (zValue > 255) {
        //    color = colors[5];
        //    colorTM = colorsTM[5];
        //}
        if (type == "fill") {
            return colorTM;
        } else {
            return color;
        }
    }

    function addTuli() {
        var result = $.data(myData, "resultData");
        var maxNum = 0, minNum = 1000000000;
        for (var num = 0; num < result.length; num++) {
            var NUM = Number(result[num].BYNUMBER);
            if (NUM > maxNum) {
                maxNum = NUM;
            }
            if (NUM < minNum) {
                minNum = NUM;
            }
        }
        maxNum = maxNum + 10;
        if (minNum > 10) {
            minNum = minNum - 10;
        } else {
            minNum = 1;
        }
        var numCha = maxNum - minNum;
        var interNum = Math.floor(numCha / 6);
        var COLOR_OBJ = "#99FF99,#ACF57A,#C1EB5D,#D4E03E,#E9D620,#FCCD03";
        var COLOR_ARR = COLOR_OBJ.split(',');
        var tuliHtml = "";
        for (var num = 5; num >= 0; num--) {
            var min = (minNum + interNum * (num));
            var max = (minNum + (num + 1) * interNum);
            tuliHtml += '<p><span class="colorSpan" style="background-color:' + COLOR_ARR[num] + '"></span><span class="colorSpanValue">' + min + '</span></p>';
        }
        var VALUE_OBJ = "";
        for (var num = 0; num < 6; num++) {
            var min = (minNum + interNum * (num));
            var max = (minNum + (num + 1) * interNum);
            VALUE_OBJ += min + "," + max + "#";
        }
        if (VALUE_OBJ != "") {
            VALUE_OBJ = VALUE_OBJ.substring(0, VALUE_OBJ.length - 1);
        }
        $(window.parent.document).find("#SSTTL_TZ .colorL").html(tuliHtml);
        $(window.parent.document).find("#SSTTL_TZ").show();
        return VALUE_OBJ;
    }
