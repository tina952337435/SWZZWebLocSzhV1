    <script>
        mini.parse();
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        var dataMonth = [];
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year-2;
            searchStation();
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });

            $('#choseType li').click(function () {
                var f = this;
                $('#choseType li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");
                if (grade == "全部") {
                    grade = null;
                } else {
                    $.data(myData, "TYPENAME", $(this).find("span").html())
                }
                $.data(myData, "TYPE", grade);
                search();
            });

            $('#choseGrade li').click(function () {
                var f = this;
                $('#choseGrade li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");
                var dataAll = $.data(myData, "dataLL");
                if (grade == "全部") {
                    grade = null;
                    //$.data(myData, "data", dataAll);
                } 
                $.data(myData, "GRADE", grade);
                search();
            });
            for (var m = 1; m <= 12; m++) {
                dataMonth.push({ id: m, text: m });
            }
            mini.get('comboStart').setData(dataMonth);
            mini.get('comboEnd').setData(dataMonth);
        });

        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                if (item[0].COUNTIESID == "100071") {
                    dataResult.push({ ID: "10007", NAME: "浦东新区", PID: "1" });
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                } else if (item[0].COUNTIESID == "100072") {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                }
                else {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                }
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
            var YEARS = [];
            var startYear = Number(GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            for (var num = startYear; num <= endYear; num++) {
                YEARS.push(num.toFixed(0));
            }
            $.data(myData, "YEARS", YEARS);
            var node = tree.getSelectedNode();
            var sMonth = mini.get('comboStart').getValue();
            var eMonth = mini.get('comboEnd').getValue();
            var strWhere = {
                STCD:node.ID,
                YEARS: YEARS.join(','),
                GRADE: $.data(myData, "GRADE"),
                SMONTH: sMonth,
                EMONTH: eMonth
            };
            GetJosns("getRainPatternTypeNum", strWhere, "SelNum");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "dataLL", dataResult);
                $.data(myData, "data", dataResult);
                var grade = $.data(myData, "GRADE");
                if (grade == null) {
                    loadGrid();
                }
                else {
                    loadGridNew();
                }
            }
        }
        function loadGrid() {
            var type = $.data(myData, "TYPE");
            var dataResult = $.data(myData, "data");
            
            var items = [];

            var ONECT = SumJson(dataResult, "ONE");
            var TWOCT = SumJson(dataResult, "TWO");
            var THREECT = SumJson(dataResult, "THREE");
            var FOURCT = SumJson(dataResult, "FOUR");
            var FIVECT = SumJson(dataResult, "FIVE");
            var SIXCT = SumJson(dataResult, "SIX");
            var SEVENCT = SumJson(dataResult, "SEVEN");

            var CT = ONECT + TWOCT + THREECT + FOURCT + FIVECT + SIXCT + SEVENCT;
            var item = 
            {
                TNAME: "场次",
                ONE: ONECT,
                TWO: TWOCT,
                THREE: THREECT,
                FOUR: FOURCT,
                FIVE: FIVECT,
                SIX: SIXCT,
                SEVEN: SEVENCT,
            };
            items.push(item);
            item =
                {
                    TNAME: "占比",
                    ONE: Number(ONECT / CT * 100).toFixed(1),
                    TWO: Number(TWOCT / CT * 100).toFixed(1),
                    THREE: Number(THREECT / CT * 100).toFixed(1),
                    FOUR: Number(FOURCT / CT * 100).toFixed(1),
                    FIVE: Number(FIVECT / CT * 100).toFixed(1),
                    SIX: Number(SIXCT / CT * 100).toFixed(1),
                    SEVEN: Number(SEVENCT / CT * 100).toFixed(1),
                };
            items.push(item);

            //最多年份
            var YEARS = $.data(myData, "YEARS");
            var itemYears = [];
            for (var m = 0; m < YEARS.length; m++) {
                var s = dataResult.filter(function (res) {
                    return res.YEAR == YEARS[m].toString();
                });
                if (s.length > 0) {
                    itemYears.push({
                        YEAR: YEARS[m].toString(),
                        ONE: SumJson(s, "ONE"),
                        TWO: SumJson(s, "TWO"),
                        THREE: SumJson(s, "THREE"),
                        FOUR: SumJson(s, "FOUR"),
                        FIVE: SumJson(s, "FIVE"),
                        SIX: SumJson(s, "SIX"),
                        SEVEN: SumJson(s, "SEVEN"),
                        NUMBER: SumJson(s, "ONE") + SumJson(s, "TWO") + SumJson(s, "THREE") + SumJson(s, "FOUR") + SumJson(s, "FIVE") + SumJson(s, "SIX") + SumJson(s, "SEVEN")
                    });
                }
            }

            var ONE_YEAR_MAX = sortObjectArray(itemYears, ['ONE'], 'desc');
            var ONE_YEAR_MAX_YEAR = ONE_YEAR_MAX[0].YEAR;
            var ONE_YEAR_MAX_CS = ONE_YEAR_MAX[0].ONE;
            var TWO_YEAR_MAX = sortObjectArray(itemYears, ['TWO'], 'desc');
            var TWO_YEAR_MAX_YEAR = TWO_YEAR_MAX[0].YEAR;
            var TWO_YEAR_MAX_CS = TWO_YEAR_MAX[0].TWO;
            var THREE_YEAR_MAX = sortObjectArray(itemYears, ['THREE'], 'desc');
            var THREE_YEAR_MAX_YEAR = THREE_YEAR_MAX[0].YEAR;
            var THREE_YEAR_MAX_CS = THREE_YEAR_MAX[0].THREE;
            var FOUR_YEAR_MAX = sortObjectArray(itemYears, ['FOUR'], 'desc');
            var FOUR_YEAR_MAX_YEAR = FOUR_YEAR_MAX[0].YEAR;
            var FOUR_YEAR_MAX_CS = FOUR_YEAR_MAX[0].FOUR;
            var FIVE_YEAR_MAX = sortObjectArray(itemYears, ['FIVE'], 'desc');
            var FIVE_YEAR_MAX_YEAR = FIVE_YEAR_MAX[0].YEAR;
            var FIVE_YEAR_MAX_CS = FIVE_YEAR_MAX[0].FIVE;
            var SIX_YEAR_MAX = sortObjectArray(itemYears, ['SIX'], 'desc');
            var SIX_YEAR_MAX_YEAR = SIX_YEAR_MAX[0].YEAR;
            var SIX_YEAR_MAX_CS = SIX_YEAR_MAX[0].SIX;
            var SEVEN_YEAR_MAX = sortObjectArray(itemYears, ['SEVEN'], 'desc');
            var SEVEN_YEAR_MAX_YEAR = SEVEN_YEAR_MAX[0].YEAR;
            var SEVEN_YEAR_MAX_CS = SEVEN_YEAR_MAX[0].SEVEN;

            var cNum = ONE_YEAR_MAX[0].ONE + TWO_YEAR_MAX[0].TWO + THREE_YEAR_MAX[0].THREE + FOUR_YEAR_MAX[0].FOUR + FIVE_YEAR_MAX[0].FIVE + SIX_YEAR_MAX[0].SIX + SEVEN_YEAR_MAX[0].SEVEN;
            var rate = "0.0%";
            //item =
            //    {
            //        TNAME: "次数最多",
            //        ONE: ONE_YEAR_MAX_CS,
            //        TWO: TWO_YEAR_MAX_CS,
            //        THREE: THREE_YEAR_MAX_CS,
            //        FOUR: FOUR_YEAR_MAX_CS,
            //        FIVE: FIVE_YEAR_MAX_CS,
            //        SIX: SIX_YEAR_MAX_CS,
            //        SEVEN: SEVEN_YEAR_MAX_CS,
            //    };
            //items.push(item);
            item =
                {
                    TNAME: "占比最多",
                    ONE: (Number(ONE_YEAR_MAX_CS) > 0 ? Number(Number(ONE_YEAR_MAX_CS) / cNum * 100).toFixed(2) + "%" : rate),
                    TWO: (Number(TWO_YEAR_MAX_CS) > 0 ? Number(Number(TWO_YEAR_MAX_CS) / cNum * 100).toFixed(2) + "%" : rate),
                    THREE: (Number(THREE_YEAR_MAX_CS) > 0 ? Number(Number(THREE_YEAR_MAX_CS) / cNum * 100).toFixed(2) + "%" : rate),
                    FOUR: (Number(FOUR_YEAR_MAX_CS) > 0 ? Number(Number(FOUR_YEAR_MAX_CS) / cNum * 100).toFixed(2) + "%" : rate),
                    FIVE: (Number(FIVE_YEAR_MAX_CS) > 0 ? Number(Number(FIVE_YEAR_MAX_CS) / cNum * 100).toFixed(2) + "%" : rate),
                    SIX: (Number(SIX_YEAR_MAX_CS) > 0 ? Number(Number(SIX_YEAR_MAX_CS) / cNum * 100).toFixed(2) + "%" : rate),
                    SEVEN: (Number(SEVEN_YEAR_MAX_CS) > 0 ? Number(Number(SEVEN_YEAR_MAX_CS) / cNum * 100).toFixed(2) + "%" : rate),
                };
            //items.push(item);
            item =
                {
                    TNAME: "最多年份",
                    ONE: ONE_YEAR_MAX_YEAR,
                    TWO: TWO_YEAR_MAX_YEAR,
                    THREE: THREE_YEAR_MAX_YEAR,
                    FOUR: FOUR_YEAR_MAX_YEAR,
                    FIVE: FIVE_YEAR_MAX_YEAR,
                    SIX: SIX_YEAR_MAX_YEAR,
                    SEVEN: SEVEN_YEAR_MAX_YEAR,
                };
            //items.push(item);
            grid.setData(items);


            var arrGrade = undefined != $.data(myData, "GRADE") && "" != $.data(myData, "GRADE") ? $.data(myData, "GRADE").splice(',') : ["暴雨", "大暴雨", "特大暴雨"];
            var itemGrade = [];
            for (var m = 0; m < arrGrade.length; m++) {
                var s = dataResult.filter(function (res) {
                    return res.GRADE == arrGrade[m].toString();
                });
                if (s.length > 0) {
                    itemGrade.push({
                        TNAME: arrGrade[m].toString(),
                        ONE: SumJson(s, "ONE"),
                        TWO: SumJson(s, "TWO"),
                        THREE: SumJson(s, "THREE"),
                        FOUR: SumJson(s, "FOUR"),
                        FIVE: SumJson(s, "FIVE"),
                        SIX: SumJson(s, "SIX"),
                        SEVEN: SumJson(s, "SEVEN"),
                    });
                }
            }
            var rate = 0.0;
            var v = [];
            for (var n = 0; n < itemGrade.length; n++) {
                var item = itemGrade[n];
                var Temp = dataResult.filter(function (res) {
                    return res.GRADE == item.TNAME;
                });
                var totalNum=SumJson(Temp, "ONE") + SumJson(Temp, "TWO") + SumJson(Temp, "THREE") + SumJson(Temp, "FOUR") + SumJson(Temp, "FIVE") + SumJson(Temp, "SIX") + SumJson(Temp, "SEVEN");
                item["ONERATE"] = Number(item["ONE"]) > 0 ? Number(Number(item["ONE"]) / totalNum * 100).toFixed(1) : rate;
                item["TWORATE"] = Number(item["TWO"]) > 0 ? Number(Number(item["TWO"]) / totalNum * 100).toFixed(1) : rate;
                item["THREERATE"] = Number(item["THREE"]) > 0 ? Number(Number(item["THREE"]) / totalNum * 100).toFixed(1) : rate;
