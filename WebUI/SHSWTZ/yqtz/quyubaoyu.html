<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>区域暴雨极值查询</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <!-- 引入echarts.js -->
    <script src="/Common/Scripts/echarts.min.js"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .mini-toolbar p {
            /* height: 30px; */
            /* line-height: 20px; */
            margin-left: 4px;
        }

        .onlytab {
            margin: 0px;
            padding: 0px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 100% !important;

        }

        .onlytab li {
            list-style: none;
            border: 1px #3291f9 solid;
            float: left;
            background-color: White;
            width: 100px !important;
            height: 30px;
            font: 14px/30px "arial";
            text-align: center;
        }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }

        #areaList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }

        .searchContext {
            height: 40px;
            line-height: 30px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }
        .mini-button {
            position: absolute;
            left: 365px;
            /* margin-top: -38px; */
            top: 45px;
        }
    </style>
</head>

<body>
    <!-- 头部搜索框start -->
    <div style="width:100%;">
        <div class="mini-toolbar">
            <div class="searchContext">
                <div class="searchTitle">&nbsp; &nbsp;累计极值：</div>
                <ul class="ui-choose choose-type-right" id="choseMNLX1">
                    <li class="selected" style="border-radius: 3px 0 0 3px;">
                        <span id="span1">小时最大</span>
                    </li>
                    <li style="">
                        <span id="span2">日最大</span>
                    </li>
                </ul>
            </div>
            <div class="searchContext">
                <div class="searchTitle">&nbsp; &nbsp;分类规则：</div>
                <ul class="ui-choose choose-type-right" id="choseMNLX">
                    <li class="selected">
                        <span>行政分区</span>
                    </li>
                    <li>
                        <span>水利片区</span>
                    </li>
                </ul>
            </div>
            <a class="mini-button" onclick="Exp()">导出报表</a>
        </div>
    </div>
    <!-- 头部搜索框end -->

    <!-- 表格start -->
    <!-- showpager="true"：允许设置分页 -->
    <div id="grid1" class="mini-datagrid"
        style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 95px);height: -moz-calc(100% - 95px);height: calc(100% - 95px);"
        allowalternating="true" borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]"
        pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
        ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" width="4%" headeralign="center" align="center">序号</div>
            <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" -->
            <div field="STNM" width="20%" headeralign="center" align="center" allowsort="true">
                分区名称
            </div>
            <div field="DRP" width="20%" headeralign="center" align="center" allow sort="true" decimalPlaces="1"
                dataType="float" allowsort="true">
                最大面雨量(mm)
            </div>
            <div field="TM" width="25%" headeralign="center" align="center" format="yyyy-MM-dd" allowsort="true">
                开始时间
            </div>
            <!--<div field="PID" width="25%" headeralign="center" align="center" format="yyyy-MM-dd" allowsort="true">
                所属区域
            </div>-->
        </div>
    </div>
    <!-- 表格end -->

    <script>
        // 将html标签解析为miniui控件，解析后，才能使用mini.get获取到控件对象
        // 在window.onload时间点会自动调用
        mini.parse();
        //实例化表格对象
        // mini.get("grid1") 根据id获取控件对象
        var grid = mini.get("grid1");
        var dataResult = [];
        var myData = [];
        $(function () {
            $.data(myData, "ATYPE", "行政分区");
            $.data(myData, "STYPE", 1);
            loadArea();

            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var html = $(this).find('span').html();
                $.data(myData, "ATYPE", html);
                search();
            });
            $('#choseMNLX1 li').click(function () {
                var f = this;
                $('#choseMNLX1 li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var hour = $(this).find('span').attr('id').replaceAll('span','');
                $.data(myData, "STYPE", hour);
                search();
            });
        });
        function loadArea() {
            GetJosns("SWZZ_FLOODTIDEDATA_ST_AREA_BSel", {}, "AreaSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "AreaSel") {
                $.data(myData, "AreaData", data.data);
                search();
            }
            else if (typeID == "Sel") {
                fillData(data.data);
            }
        }
        function search() {
            var aType = $.data(myData, "ATYPE");
            var sType = $.data(myData, "STYPE");
            var areaData = $.data(myData, "AreaData");
            areaData = areaData.filter(function (item) {
                return item.ATYPE == aType;
            });
            var stcd = "";
            for (var num = 0; num < areaData.length; num++) {
                stcd += areaData[num].AID+",";
            }
            if (stcd != "") {
                stcd = stcd.substring(0, stcd.length-1);
            }
            var strWhere = { STCD: stcd, STYPE: sType};
            GetJosns("SWZZ_FLOODTIDEDATA_ST_RAINSTORMVALUE_SSel", strWhere , "Sel");
        }
        function fillData(data) {
            var aType = $.data(myData, "ATYPE");
            var areaData = $.data(myData, "AreaData");
            var areaData = areaData.filter(function (item) {
                return item.ATYPE == aType;
            });
            var dataNew = [];
            for (var num = 0; num < data.length; num++) {
                var item = data[num];
                var areaDataTemp = areaData.filter(function (e) {
                    return e.AID == item.STCD;
                });
                
                if (areaDataTemp.length > 0) {
                    item.STNM = areaDataTemp[0].AREANAME;
                }
                dataNew.push(item);
            }
            grid.setData(dataNew);
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            if (field == "STNM") {
                // e.cellStyle="background:#0099CC;";
                var tm = new Date(convertToDate(record.TM)).format("yyyy-MM-dd HH:mm:ss");
                //var str = "<a onclick='lookData(\"STCD@" + record.STCD + ",STYPE@" + $.data(myData, "STYPE") + ",TM@" + tm + "\",\"/SHSWTZ/yqtz/jiangyuliangArea.html\",\"" + record.STNM + "降雨量\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                var str = "<a onclick='lookData(\"STCD@" + record.STCD + ",STYPE@" + $.data(myData, "STYPE") +"\",\"/SHSWTZ/yqtz/jiangyuliang.html\",\"" + record.STNM + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                e.cellHtml = str;
            }
            if (field == "TM") {
                var str = (convertToDate(value)).format("yyyy-MM-dd HH:mm");
                //console.error(str + ":::::::" + value);
                e.cellHtml = str;
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var stype = $.data(myData, "STYPE");
            var name = $.data(myData, "ATYPE");
            if (stype == "1") {
                name += "小时累计最大面雨量"
            } else if (stype == "2") {
                name += "日累计最大面雨量"
            }
            name += "列表"
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
