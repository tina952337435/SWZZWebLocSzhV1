<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>插补报告</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
            background: white;
        }
    </style>
</head>
<body>
    <div class="mini-toolbar">
        &nbsp;&nbsp;开始时间：<input id="STIME" class="mini-datepicker" style="width: 110px;" format="yyyy-MM-dd"
                                showtime="false" showOkButton="false" showClearButton="false"  onvaluechanged="onSTCDChanged" />
        &nbsp; &nbsp;结束时间：
        <input id="ETIME" class="mini-datepicker" style="width: 110px;" format="yyyy-MM-dd"
               showtime="false" showOkButton="false" showClearButton="false"  onvaluechanged="onSTCDChanged" />
        &nbsp;&nbsp;&nbsp;关键字：<input id="key" class="mini-textbox" emptytext="请输入关键字" style="height: 25px;width: 150px;" onenter="onKeyEnter" />
        &nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a>
        <a class="mini-button" onclick="Exp()" id="expButton" style="margin-left:10px;display:none;">导出报表</a>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);" allowalternating="true"
         borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]" pagesize="15"
         showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell">
        <div property="columns">
            <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" -->
            <div type="indexcolumn" headeralign="center" align="center" width="40"> 序号</div>
            <div width="100" field="STNM" headeralign="center" align="center" allowsort="true">
                站名
            </div>
            <div width="100" field="DRP" headeralign="center" align="center" allowsort="true"  decimalPlaces="1" dataType="float">
                雨量(mm)
            </div>
            <div width="120" field="TM" headeralign="center" align="center" allowsort="true">
                时间
            </div>
            <div width="120" field="INSTNM" headeralign="center" align="center" allowsort="true">
                采用站点
            </div>
            <div width="180" field="DRPSTR" headeralign="center" align="center" allowsort="true">
                对应降雨量
            </div>
            <div width="180" field="DISSSTR" headeralign="center" align="center" allowsort="true">
                与本站直线距离
            </div>
            <!--<div width="180" field="ISHB" headeralign="center" align="center" allowsort="true">
                合并降雨量
            </div>-->
        </div>
    </div>

    <script>
        mini.parse();
        var myData = [];
        var grid = mini.get("grid1");
        $(function () {
            $("#expButton").hide();            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {                $("#expButton").show();            }
            var tm = new Date();
            mini.get("STIME").setValue("1978-01-01");
            mini.get("ETIME").setValue(tm.format("yyyy/MM/dd"));

            //mini.get("STIME").setValue("1996-07-01 00:00:00");
            mini.get("ETIME").setValue("2020-12-31 23:59:59");
            search();
        });
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中'
            });
            var strWhere = {
                STIME: mini.get("STIME").getFormValue(),
                ETIME: mini.get("ETIME").getFormValue()
            };
            //GetJosns("RainfallinterpolationAllDataSel", strWhere, "Sel");
            GetJosns("RainfallinterpolationAllNumDataSel", strWhere, "Sel");
            //GetJosns("RainfallinterpolationAllHourDataSel", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var dataResult = mini.decode(data.data);
                grid.setData(dataResult);
                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "TM") {
                var stm = mini.formatDate(value, 'yyyy-MM-dd HH:mm:ss');
                e.cellHtml = stm;
            }
            //if (field == "INSTNM") {
            //    var listIN = record.listIN;
            //    if (listIN.length > 0) {
            //        var str = "";
            //        for (var num = 0; num < listIN.length; num++) {
            //            str+=listIN[num].STNM+",";
            //        }
            //        str = str.substring(0, str.length-1);
            //        e.cellHtml = str;
            //    }
            //}
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = "降水量插补方案";
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
