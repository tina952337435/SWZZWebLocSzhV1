<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/arcgis_js_api/library/3.31/3.31/esri/css/esri.css" rel="stylesheet" type="text/css" />
    <link href="/arcgis_js_api/myJs/style/map.css?ver=0" rel="stylesheet" type="text/css" />
    <script src="/arcgis_js_api/myJs/mapConfig.js" type="text/javascript"></script>
    <script src="/arcgis_js_api/library/3.31/3.31/init.js" type="text/javascript"></script>

    <script src="/arcgis_js_api/myJs/bj.js?ver=1" type="text/javascript"></script>
    <script src="/arcgis_js_api/myJs/mapIndex.js?ver=1.0.9" type="text/javascript"></script>

    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-size: 14px;
        }

        .colork {
            width: 70%;
            height: 80%;
            margin: auto;
        }

        .colorL {
            margin-top: 15px;
        }

        .colorL p {
            width: 55px;
            margin: 0px auto;
            margin-top: -4px;
        }

        .colorSpan {
            display: inline-block;
            width: 15px;
            height: 25px;
            margin-right: 5px;
        }

        .colorSpanValue {
            margin-top: 7px;
            font-size: 13px;
        }

        .ui-choose {
            background: rgba(255,255,255,0.5);
            border-radius: 5px;
        }

        ul.ui-choose > li {
            padding: 0px 5px;
            width: 100px;
        }

        .searchDiv {
            position: absolute;
            top: 20px;
            right: 10px;
            width: 299px;
        }
    </style>

</head>
<body>
    <div id="myMap" style="width: 100%; height: 100%; display: block; overflow: hidden;
        position: absolute">
    </div>
    <div class="searchDiv">
        <ul class="ui-choose choose-type-right" id="choseMNLX">
            <li class="selected">
                <span name="">泰森多边形</span>
            </li>
            <li>
                <span name="行政分区">行政分区</span>
            </li>
            <li>
                <span name="水利片区">水利片区</span>
            </li>
        </ul>
    </div>

    <div id="SSTTL_TZ" style="background:#ffffff;position:absolute;right:10px;top:30%;height:185px;
    border: 1px solid #cecbcb;
    width:65px;-moz-border-radius: 5px;
    -webkit-border-radius: 5px;
    border-radius: 5px;
    box-shadow: 5px 5px 5px #888888;padding: 0px 5px;display:none;">
        <div class="colorL">
            <p><span class="colorSpan" style="background-color:#FCCD03"></span><span class="colorSpanValue">255</span></p>
            <p><span class="colorSpan" style="background-color:#E9D620"></span><span class="colorSpanValue">245</span></p>
            <p><span class="colorSpan" style="background-color:#D4E03E"></span><span class="colorSpanValue">235</span></p>
            <p><span class="colorSpan" style="background-color:#C1EB5D"></span><span class="colorSpanValue">225</span></p>
            <p><span class="colorSpan" style="background-color:#ACF57A"></span><span class="colorSpanValue">215</span></p>
            <p><span class="colorSpan" style="background-color:#99FF99"></span><span class="colorSpanValue">205</span></p>
        </div>
    </div>
    <script>
        var myData = [];
        var labels = new Array();
        var countyLayer1;
        var _globallevel = 5;
        var labels = new Array();
        var stype = GetQueryString('STYPE');
        var tm = GetQueryString('TM');
        $(function () {
            if (stype == null) {
                stype = 1;
            }
            $.data(myData, "STYPE", stype);
            setTimeout(function () {
                countyLayer1 = CreateLayer("Area_Layer1");
                map.setZoom(8);
                if (tm == null) {
                    BreakLayerLoad();
                }
                else {
                    search();
                }
            }, 800);


            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var str = $(this).find('span').attr("name");
                if (str == "") {
                    str = null;
                }
                $.data(myData, "ATYPE", str);
                search();
            });
        });

        function search() {
            var TYPE = $.data(myData, "STYPE");
            if ($.data(myData, "STYPE") == "1") {
                TYPE = "HOUR";
            } else if ($.data(myData, "STYPE") == "2") {
                TYPE = "DAY";
            }
            var strWhere = { TM: tm, TYPE: TYPE, ATYPE: $.data(myData, "ATYPE")};
            GetJosns("FLOODTIDEDATA_ST_PPTN_RNameSel", strWhere, "Sel");
        }
        function BreakLayerLoad() {
            var strWhere = { STYPE: $.data(myData, "STYPE") };
            GetJosns("RAINSTORMVALUENAME_SSel", strWhere, "Sel");
        }

        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                $.data(myData, "resultData", data.data);
                setTimeout(function () {
                    if ($.data(myData, "ATYPE") == "行政分区" || $.data(myData, "ATYPE") == "水利片区") {
                        MapRainfallArea();
                    } else {
                        MapRainfallStation();
                    }
                }, 1000);
            }
        }
        function _destroy() {
            if ("undefined" != typeof labels && labels != null) {
                for (var i = 0; i < labels.length; i++) {
                    try {
                        labels[i].clear();
                    } catch (ex) { }
                }
            }
            labels = new Array();
            if (this.destroy != null) {
                if (typeof (destroy) == "function") {
                    destroy();
                }
            } 
        }
        function MapRainfallStation() {
            var VALUE_OBJ=addTuli();
            var result = $.data(myData, "resultData");
            countyLayer1.clear();
            _destroy();
            require(["esri/geometry/Point",
                "esri/graphic",
                "myJs/MapText",
                "esri/symbols/PictureMarkerSymbol",
                "esri/symbols/SimpleFillSymbol",
                "esri/symbols/SimpleLineSymbol",
                "esri/Color",
                "esri/InfoTemplate",
                "esri/dijit/InfoWindow",
                "esri/layers/GraphicsLayer",
                "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol", "dojo/_base/lang",
                "esri/geometry/Polygon",
                "dojo/domReady!"
            ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color,
                InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, lang, Polygon) {
                $.get(
                    "/Common/代表站泰森多边形.json",//json路径
                    lang.hitch(this, function (data, status) {
                        if (status === "success") {
                            var features = data.features;
                            features.forEach(function (feature) {
                                var allrings = feature.geometry.coordinates;
                                var polygon = new Polygon(allrings);
                                var gra = feature.properties;
                                var mc = gra.STNM;
                                var stcd = gra.STCD;
                                var arr = result.filter(function (item) {
                                    return item.STCD == stcd;
                                });
                                var colorStr = "";
                                var DRP = 0;
                                if (arr.length > 0) {
                                    DRP = arr[0].DRP;
                                    if (arr[0].LGTD != undefined || arr[0].LTTD != undefined) {
                                        var center = [];
                                        center = [arr[0].LGTD, arr[0].LTTD];
                                        var cls = "";
                                        var textStr = "";//arr[0].NAME + ":" +
                                        textStr = arr[0].STNM + '\n' + parseFloat(arr[0].DRP).toFixed(1);
                                        var point = new Point({
                                            "x": center[0],
                                            "y": center[1],
                                            "spatialReference": {
                                                "wkid": 4326
                                            }
                                        });
                                        //cls += " slText ";
                                        var _align = "bottom";
                                        if (textStr == "") {
                                            textStr = "—";
                                        }
                                        var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 13);
                                        labels.push(label);
                                    }
                                }
                                colorStr = getAreaColor(DRP, "", VALUE_OBJ);
                                if (colorStr != null && colorStr != "" && colorStr != undefined) {
                                    var fillColorStr = getAreaColor(DRP, "fill", VALUE_OBJ);
                                    var fs = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                        new SimpleLineSymbol(SimpleLineSymbol.STYLE_DASHDOT,
                                            new Color(colorStr), 2), new Color(fillColorStr)
                                    );
                                    var lineSymbol = new SimpleFillSymbol("solid", new SimpleLineSymbol("solid",
                                        new dojo.Color(colorStr), 1),
                                        new dojo.Color(fillColorStr));
                                    var g3 = new Graphic(polygon, lineSymbol);
                                    g3.attributes = arr[0];
                                    countyLayer1.add(g3);
                                }
                            }, this);
                        }
                    }),
                    "json"
                );
            });
        }
        function MapRainfallArea() {
            var VALUE_OBJ = addTuli();
            var result = $.data(myData, "resultData");
            countyLayer1.clear();
            _destroy();
            require(["esri/geometry/Point",
                "esri/graphic",
                "myJs/MapText",
                "esri/symbols/PictureMarkerSymbol",
                "esri/symbols/SimpleFillSymbol",
                "esri/symbols/SimpleLineSymbol",
                "esri/Color",
                "esri/InfoTemplate",
                "esri/dijit/InfoWindow",
                "esri/layers/GraphicsLayer",
                "esri/geometry/webMercatorUtils", "esri/symbols/TextSymbol",
                "dojo/_base/lang",
                "esri/geometry/Polygon",
                "dojo/domReady!"
            ], function (Point, Graphic, MapText, PictureMarkerSymbol, SimpleFillSymbol, SimpleLineSymbol, Color,
                InfoTemplate, InfoWindow, GraphicsLayer, webMercatorUtils, TextSymbol, lang, Polygon) {
                    $.get(
                        "/Common/上海市" + $.data(myData, "ATYPE") + ".json",//json路径
                        lang.hitch(this, function (data, status) {
                            if (status === "success") {
                                var features = data.features;
                                features.forEach(function (feature) {
                                    var allrings = feature.geometry.coordinates;
                                    var polygon = new Polygon(allrings);
                                    var gra = feature.properties;
                                    var mc = gra.NAME;
                                    var stcd = gra.STCD;
                                    var arr = result.filter(function (item) {
                                        return item.STNM == mc;
                                    });
                                    if (arr.length > 0) {
                                        var center = [];
                                        center = [arr[0].LGTD, arr[0].LTTD];
                                        var cls = "";
                                        var textStr = "";//arr[0].NAME + ":" +
                                        textStr = arr[0].STNM + '\n' + parseFloat(arr[0].DRP).toFixed(1);
                                        var point = new Point({
                                            "x": center[0],
                                            "y": center[1],
                                            "spatialReference": {
                                                "wkid": 4326
                                            }
                                        });
                                        //cls += " slText ";
                                        var _align = "bottom";
                                        if (textStr == "") {
                                            textStr = "—";
                                        }
                                        var label = new MapText(map, point, arr[0], textStr, _globallevel, _align, cls, 13);
                                        labels.push(label);
                                        var colorStr = getAreaColor(arr[0].DRP, "", VALUE_OBJ);
                                        if (colorStr != null && colorStr != "" && colorStr != undefined) {
                                            var fillColorStr = getAreaColor(arr[0].DRP, "fill", VALUE_OBJ);
                                            var fs = new SimpleFillSymbol(SimpleFillSymbol.STYLE_SOLID,
                                                new SimpleLineSymbol(SimpleLineSymbol.STYLE_DASHDOT,
                                                    new Color(colorStr), 2), new Color(fillColorStr)
                                            );
                                            var lineSymbol = new SimpleFillSymbol("solid", new SimpleLineSymbol("solid",
                                                new dojo.Color(colorStr), 1),
                                                new dojo.Color(fillColorStr));
                                            var g3 = new Graphic(polygon, lineSymbol);
                                            g3.attributes = arr[0];
                                            countyLayer1.add(g3);
                                        }
                                    }

                                }, this);
                            }
                        }),
                        "json"
                    );
                });
        }
        function getAreaColor(zValue, type, VALUE_OBJ) {
            var color = "#ffffff";
            var colorTM = [255, 255, 255, 0];
            var colorStr = '#6FBE73,#95C523,#6EC6CA,#25B9EC,#F4E526,#F4BB19,#E94718';
            var colors = colorStr.split(',');
            var colorsTM = [
                [111, 190, 115, 0.8],
                [149, 197, 35, 0.8],
                [110, 198, 202, 0.8],
                [37, 185, 236, 0.8],
                [244, 229, 38, 0.8],
                [244, 187, 25, 0.8],
                [233, 71, 24,0.8]
            ];
            var valueArr = VALUE_OBJ.split("#");
            for (var num = 0; num < valueArr.length; num++) {
                var item = valueArr[num].split(',');
                if (zValue >= Number(item[0]) && zValue < Number(item[1])) {
                    color = colors[num];
                    colorTM = colorsTM[num];
                }
            }
            if (type == "fill") {
                return colorTM;
            } else {
                return color;
            }
        }
        function addTuli() {
            var result = $.data(myData, "resultData");
            var maxNum = 0, minNum = 1000000000;
            for (var num = 0; num < result.length; num++) {
                var NUM = Number(result[num].DRP);
                if (NUM > maxNum) {
                    maxNum = NUM;
                }
                if (NUM < minNum) {
                    minNum = NUM;
                }
            }
            maxNum = maxNum;
            maxNum = maxNum + 10;
            if (minNum > 10) {
                minNum = minNum - 10;
            } else {
                minNum = 0.1;
            }
            var numCha = maxNum - minNum;
            var interNum = Math.floor(numCha / 6);
            var COLOR_OBJ = '#6FBE73,#95C523,#6EC6CA,#25B9EC,#F4E526,#F4BB19,#E94718';
            var COLOR_ARR = COLOR_OBJ.split(',');
            var tuliHtml = "";
            for (var num = 5; num >= 0; num--) {
                var min = (minNum + interNum * (num)).toFixed(1);
                var max = (minNum + (num + 1) * interNum).toFixed(1);
                tuliHtml += '<p><span class="colorSpan" style="background-color:' + COLOR_ARR[num] + '"></span><span class="colorSpanValue">' + min + '</span></p>';
            }
            var VALUE_OBJ = "";
            for (var num = 0; num < 6; num++) {
                var min = (minNum + interNum * (num));
                var max = (minNum + (num + 1) * interNum);
                VALUE_OBJ += min + "," + max + "#";
            }
            if (VALUE_OBJ != "") {
                VALUE_OBJ = VALUE_OBJ.substring(0, VALUE_OBJ.length - 1);
            }
            //console.error(VALUE_OBJ);
            $("#SSTTL_TZ .colorL").html(tuliHtml);
            $("#SSTTL_TZ").show();
            return VALUE_OBJ;
        }
    </script>
</body>
</html>
