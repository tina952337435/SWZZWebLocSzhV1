<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }
        .btn {
            padding: 4px 12px;
        }
    </style>
</head>
<body>
    <div class="mini-toolbar" style=" margin-bottom:1px;">
        <table style="width:100%;">
            <tr>
                <td style="width:100%;">
                    <div class="searchContext">
                        &nbsp; &nbsp;
                        开始日期： &nbsp;<input id="STIME" class="mini-datepicker" style="width:115px;"
                                           format="yyyy-MM-dd" />&nbsp;&nbsp;
                        结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;" format="yyyy-MM-dd" />
                        &nbsp;&nbsp;
                        关键字：&nbsp;<input id="key" class="mini-textbox" emptytext="请输入关键字" style="height: 25px;width: 150px;" onenter="onKeyEnter" />
                        <a class="mini-button" onclick="search()">查询</a>
                        &nbsp;&nbsp;
                        <!--<button type="button" class="btn btn-success" onclick="Exp()">导入excel数据</button>-->
                    </div>
                </td>
                <td style="white-space:nowrap;">
                    <!--<a class="mini-button" onclick="addDataExcel()">添加站点</a>-->
                    <!--<a class="mini-button" onclick="addDataExcel()">保存数据</a>-->
                    <!--<a class="mini-button" onclick="addDataExcel()">导入excel数据</a>-->

                </td>
            </tr>
        </table>
    </div>
    <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 50px);height: -moz-calc(100% - 50px);height: calc(100% - 50px);"
         allowalternating="true" multiSelect="true"
         borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]" pagesize="20"
         showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" resultAsData="true" allowcellselect="true" allowcelledit="true"
         showPager="true" ondrawcell="onGriddrawcell">
        <div property="columns">
            <div field="STNM" width="60" align="center" headeralign="center" allowsort="false">站名</div>
            <div field="DRP" width="120" align="center" headeralign="center" allowsort="false" decimalPlaces="1"
                 dataType="float">
                降雨量(mm)
                <input property="editor" class="mini-textbox" style="width:100%;" vtype="float" onvaluechanged="onvaluechanged" />
            </div>
            <div field="BGYR" width="120" align="center" headeralign="center" allowsort="false">
                发生时间

            </div>
            <div field="action" width="60" align="center" headeralign="center" allowsort="false">基本操作</div>
        </div>
    </div>
    <!--<input property="editor" class="mini-datepicker" style="width:100%;" />-->
    <script>
        mini.parse();
        var grid = mini.get("grid1");
        $(function () {
            var tm = new Date();
            // 显示当日的日期为开始日期
            //mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -365));
            mini.get("STIME").setValue("1978-01-01");
            // 显示当日的日期为结束日期
            mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));
            search();
        });
        function search() {
            PageFillData(0, 20);
        }
        function PageFillData(pageIndex, pageSize) {
            var strWhere = {
                STIME: mini.get("STIME").getFormValue(),
                ETIME: mini.get("ETIME").getFormValue(),
                MYDAVW: 24,//日雨量最大,
                KEY: mini.get("key").getValue(),
                PageIndex: pageIndex,
                PageSize: pageSize
            };
            GetJosns("SWZZ_FLOODTIDEDATA_BYTZCHAXUN", strWhere, "RSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "RSel") {
                PageServerFill(grid, data);
            }
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            PageFillData(pageIndex, pageSize);
        });
        function onGriddrawcell(e) {
            var record = e.record;
            var field = e.field;
            var value = e.value;
            if (field == 'action') {
                var s = ' <img style="cursor:pointer;" onclick="removeRow(\'' + record.BYID + '\')" src="/Common/miniui/themes/icons/remove.png" title="删除" />&nbsp;';
                e.cellHtml = s;
            }
            if (field == "BGYR") {
                if (value != undefined) {
                    var s = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm");
                    e.cellHtml = s;
                }
            }
        }

        function onvaluechanged(e) {
            var value = e.value;
            var sender = e.sender;
            var selected = grid.getSelected();
            if (selected) {
                if (!isNaN(value)) {
                    mini.confirm("值改变是否确认修改？", "确定？",
                        function (action) {
                            if (action == "ok") {
                                var strWhere = { BYID: selected.BYID, DRP: value };
                                GetJosns("SWZZ_FLOODTIDEDATA_ST_BYTZ_SUpdate", strWhere, "Update");
                            }
                            else {
                            }
                        }
                    );
                }
            }
        }

        function Exp() {
            var name = mini.get("STIME").getFormValue() + "至" + mini.get("ETIME").getFormValue() + "代表站暴雨（日降雨量）";
            var columns = grid.columns;
            var data = grid.data;
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
