<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>七种雨型模式柱状图</title>
    <script src="/Common/Scripts/ChartJs.js"></script>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <script src="/Common/Scripts/echarts.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .mini-toolbar {
            height: 45px;
            line-height: 40px;
            font-size: 22px;
            text-align: center;
            border:0px !important;
        }
        .menuparentDiv {
            width: 100%;
            height: 33.33%;
        }
        .menuDiv {
            height: 100%;
            width: 33.33%;
            float: left;
            padding:10px;
        }
        .menuDiv>div {
            width: 100%;
            height: 100%;
            border:1px solid  #ccc;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            七种降雨雨型模式示意图
        </div>
    </div>
    <div style="width:100%;height: -webkit-calc(100% - 70px);height: -moz-calc(100% - 70px);height: calc(100% - 70px);">
        <div class="menuparentDiv">
            <div class="menuDiv">
                <div id="chart1"></div>
            </div>
            <div class="menuDiv">
                <div id="chart2"></div>
            </div>
            <div class="menuDiv">
                <div id="chart3"></div>
            </div>
        </div>
        <div class="menuparentDiv">
            <div class="menuDiv">
                <div id="chart4"></div>
            </div>
            <div class="menuDiv">
                <div id="chart5"></div>
            </div>
            <div class="menuDiv">
                <div id="chart6"></div>
            </div>
        </div>
        <div class="menuparentDiv">
            <div class="menuDiv">
                <div id="chart7"></div>
            </div>
        </div>
    </div>

    <script>
        $(function () {
            search();
        });
        function search() {
            var strWhere = {};
            GetJosns("SWZZ_FLOODTIDEDATA_ST_RAINFALLPATTERN_BSel", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                if (data.total > 0) {
                    for (var num = 0; num < data.data.length; num++) {
                        var dataX = [1, 2, 3, 4, 5, 6];
                        var dataY = [];
                        dataY.push(data.data[num].VALUEONE);
                        dataY.push(data.data[num].VALUETWO);
                        dataY.push(data.data[num].VALUETHREE);
                        dataY.push(data.data[num].VALUEFOUR);
                        dataY.push(data.data[num].VALUEFIVE);
                        dataY.push(data.data[num].VALUESIX);
                        var chartName = "chart" + (num + 1);
                        chartBar(chartName, dataX, dataY, data.data[num].TYPENAME);
                    }
                }
            }
        }
        function chartBar(chartName, dataX, dataY,title) {
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.clear();
            option = {
                title: {
                    top: '2%',
                    left: 'center',
                    text: title,
                    textStyle: {
                        fontSize: 15,
                        fontWeight:550,
                    },
                    itemGap: 10,  //主副标题间距
                    //subtext: '降雨量排序(前十)'
                },
                subtextStyle: {
                    color: '#CCCCCC',
                    fontSize: 14,
                },
                tooltip: {
                    trigger: 'axis',
                    // axisPointer: {
                    //     type: 'shadow'
                    // }
                },
                // 更改图例默认颜色(依次应用)
                // color: ['red', 'black', 'yellow', 'pink', 'cyan'],
                color: ['#3291f9'],
                // //这里设置柱状图上面的方块，名称跟series里的name保持一致
                legend: {
                    orient: 'vertical',
                    x: 'right',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    align: 'left', //可设定文字在图例右边
                    // itemHeight: 10,
                    // itemWidth: 10,
                    //padding: [10, -100, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                    //data: ['1978-至今'],
                    containLabel: true,
                    // selected: {'1978-至今': false} //隐藏图例
                    show: false,
                },
                grid: {
                    left: '4%',
                    right: '4%',
                    bottom: '8%',
                    containLabel: true,
                    //show:true,
                    //borderColor: '#ccc'
                },
                toolbox: {
                    show: false,
                    feature: {
                        saveAsImage: {}
                    }
                },
                calculable: true,
                xAxis: {
                    name: "降雨时段",
                    nameLocation: "middle",
                    nameTextStyle: {
                        fontSize:14,
                    },
                    type: 'category',
                    // boundaryGap: true 表示x轴两边留白
                    boundaryGap: true,
                    axisTick: {
                        alignWithLabel: true,
                        show: false
                    },
                    boundaryGap: ['5%', '5%'],
                    data: dataX,
                    axisLabel: {
                        interval: 0,
                        //rotate: 20 //角度顺时针计算
                    },
                    splitLine: {
                        show:false,
                    }
                },
                yAxis: {
                    name: "降雨量",
                    nameLocation: "center",
                    nameTextStyle: {
                        fontSize: 14,
                    },
                    type: 'value',
                    max: 10,
                    splitLine: {
                        show: false,
                    }
                },
                series: [
                    {
                        name: '1978-至今',
                        type: 'bar',
                        // 相邻柱状之间的空隙
                        //barGap: '0%',
                        barCategoryGap:'0%',
                        //barWidth: 20,
                        data: dataY,
                        itemStyle: {
                            normal: {
                                show: true,
                                color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                    offset: 0,
                                    color: '#7ea8ee'
                                }, {
                                    offset: 1,
                                    color: '#2dc5fe'
                                }]),
                                //barBorderRadius: [50, 50, 0, 0],
                                //borderWidth: 0,
                                //label: {
                                //    show: true,  //开启显示
                                //    formatter: '{c}',  //显示数值
                                //    position: 'top',
                                //    textStyle: { //数值样式
                                //        fontSize: 10
                                //    }
                                //}
                            },
                            emphasis: {
                                shadowBlur: 15,
                                shadowColor: 'rgba(105,123, 214, 0.7)'
                            }
                        }
                    }
                ]
            };
            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
        }
    </script>
</body>
</html>
