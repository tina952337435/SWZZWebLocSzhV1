<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>全市、各区历年面暴雨总量变化以及占当年面降雨的比例</title>
    <script src="/Common/boot.js" type="text/javascript"></script>

    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />

    <!-- 引入echarts.js -->
    <script src="/Common/Scripts/echarts.min.js"></script>
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="/Common/CSS/bootstrap.min.css" rel="stylesheet">
    <link href="/Common/CSS/font-awesome.min.css" rel="stylesheet">
    <link href="/Common/CSS/bootstrap-datetimepicker.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .mini-panel-border, .mini-grid-border {
            border: 0px !important;
        }

        .btn {
            padding: 5px 12px;
            position: absolute;
            left: 640px;
            top: 6px;
        }

        .searchContext {
            height: 40px;
            line-height: 40px;
            width: 340px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }

        .mini-button {
            position: absolute;
            left: 700px;
            top: 6px;
        }

        .onlytab {
            margin: 0px;
            padding: 0px;
            /*padding-top: 10px;*/
            padding-bottom: 5px;
            width: 100% !important;
            /*display: none;*/
            position: absolute;
            left:330px;
            top:6px;
        }

            .onlytab li {
                list-style: none;
                border: 1px #3291f9 solid;
                float: left;
                background-color: White;
                width: 70px !important;
                height: 32px;
                font: 14px/34px "arial";
                text-align: center;
            }

                .onlytab li:nth-child(2) {
                    border-left: 0px;
                }

                .onlytab li:nth-child(3) {
                    border-left: 0px;
                }

                .onlytab li:nth-child(4) {
                    border-left: 0px;
                }

        .sysList {
            margin-top: 25px;
            color: gray;
            margin-left: 0%;
            position: absolute;
            border: 1px solid #dadbdc;
            background-color: #FFF;
            top: 15px;
            left: 357px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .5);
            -webkit-box-shadow: 0 3px 9px rgba(0, 0, 0, .5);
            padding: 10px;
        }

            .sysList table td {
                padding: 10px 3px 0px 3px;
                /*width: 125px;
                border-bottom: 1px solid #3291f9;*/
            }

        #sysList table td {
            padding: 10px 3px 10px 3px !important;
        }

        .sysList table td span {
            line-height: 20px;
        }
        .dailog_divOperation {
            display: -webkit-flex;
            display: flex;
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
            padding: 3px 2px;
            justify-content: flex-end;
            float: right;
            height: 36px;
        }

        .btn_span {
            padding: 6px 10px;
            -webkit-border-radius: 2px;
            -moz-border-radius: 2px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 14px;
            line-height: normal;
            -moz-user-select: -moz-none;
            -ms-user-select: none;
            -webkit-user-select: none;
            user-select: none;
            color: #fff;
            background: #4D96DF;
        }
        /* line 104, ../sass/dialog.scss */
        .dailog_divOperation .btn_span:first-child {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div style="width:260px;float:left;height:100%; margin-right: 5px;background: white;padding: 10px 10px;">
        <ul id="tree1" class="mini-tree" style="width:100%;height:100%;padding:5px;"
            showTreeIcon="true" textField="NAME"
            idField="ID" expandOnNodeClick="true" onnodeselect="onSelectNode" expandOnLoad="false"></ul>
    </div>
    <div style="width:calc(100% - 265px);float:right;height:100%;background: white;">
        <div class="mini-toolbar">
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;年份选择：</div>
                <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                    <input id="startYear" class="form-control" value="开始" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <span style="float:left;">—</span>
                <div class="input-group" style="width:110px;float:left;margin-left:4px;">
                    <input id="endYear" class="form-control" value="结束" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>

                <ul class="onlytab" id="onlytab2"
                    style="width:280px !important;margin-left:20px;float:left;">
                    <li id="TitleQuan" onclick="OnClickTitle2(this.id,'汛期')" class="onlyli onlyliHover start">全年</li>
                    <li id="TitleLidoing" onclick="OnClickTitle2(this.id,'汛期')" class="onlyli ">汛期</li>
                    <li id="TitleLiafter" onclick="OnClickTitle2(this.id,'非汛期')" class="onlyli">非汛期</li>
                    <li id="TitleLiMonth" onclick="OnClickTitle2(this.id,'每月')" class="onlyli end">每月</li>
                </ul>

                <button type="button" class="btn btn-info" onclick="search()">统计</button>
                <a class="mini-button" onclick="Exp()">导出报表</a>
            </div>

            


            <div id="sysList" class="sysList" hidden="hidden" style="z-index:99;width:240px;">
                <div class="title_dailog">汛期月份选择</div>
                <table>
                    <tr>
                        <td>
                            起：<input id="comboStart" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="6" />
                        </td>
                        <td>
                            止：<input id="comboEnd" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="9" />
                        </td>
                    </tr>
                </table>
                <div class="dailog_divOperation">
                    <span class="btn_span" data-name="确定" onclick="XunOK()">确定</span>
                    <!--<span class="btn_span" data-name="取消">取消</span>-->
                </div>
            </div>
            <div id="sysListFei" class="sysList" hidden="hidden" style="z-index:99;width:240px;">
                <div class="title_dailog">非汛期月份选择</div>
                <table>
                    <tr>
                        <td>
                            起：<input id="comboStartFei" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="1" />
                        </td>
                        <td>
                            止：<input id="comboEndFei" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="5" />
                        </td>
                    </tr>
                    <tr>
                        <td>起：<input id="comboStartFei1" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="10" /></td>
                        <td>止：<input id="comboEndFei1" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="12" /></td>
                    </tr>
                </table>
                <div class="dailog_divOperation">
                    <span class="btn_span" data-name="确定" onclick="feiXunOK()">确定</span>
                    <!--<span class="btn_span" data-name="取消">取消</span>-->
                </div>
            </div>
        </div>
        <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 70px);height: -moz-calc(100% - 70px);height: calc(100% - 70px);" 
             allowalternating="true"  borderstyle="border-right:0;"  sortmode="client"
             showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell">
            <div property="columns">
                <div type="indexcolumn" headeralign="center" align="center" width="50">序号</div>
                <div width="10%" field="YEAR" headeralign="center" align="center" allowsort="true">
                    年份
                </div>
                <div width="20%" field="TOTALDRP" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                     dataType="float">
                    累计雨量(mm)
                </div>
                <div width="20%" field="SURDRP" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                     dataType="float">
                    暴雨总量(mm)
                </div>
                <div width="20%" field="DRPP" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                     dataType="float">
                    暴雨总量占累计雨量的比例(%)
                </div>
            </div>
        </div>
    </div>
    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        mini.parse();
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        $(function () {
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 1;
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            searchStation();

            $.data(myData, "SMONTH", null);
            $.data(myData, "EMONTH", null);
            $.data(myData, "SMONTHF", null);
            $.data(myData, "EMONTHF", null);
        });
        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
            STGRDColumn();
            var node = tree.getSelectedNode();
            var startYear = Number(GetObj("startYear").value)+"-01-01 00:00:00";
            var endYear = Number(GetObj("endYear").value) + "-12-31 23:59:59";
            var strWhere = {
                STCD: node.ID,
                STIME: startYear,
                ETIME: endYear,
                SMONTH: $.data(myData, "SMONTH"),
                EMONTH: $.data(myData, "EMONTH"),
                SMONTHF: $.data(myData, "SMONTHF"),
                EMONTHF: $.data(myData, "EMONTHF"),
                AREA: node.PID,
                MONTH: $.data(myData, "MONTH"),
            };
            GetJosns("TOTALSURFACERAINSTORMSel", strWhere, "SelNum");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = data.data;
                var totalYear = SumJson(dataResult, "TOTALDRP");
                var totalSur = SumJson(dataResult, "SURDRP");
                dataResult.push({ YEAR: "合计", TOTALDRP: totalYear.toFixed(1), SURDRP: totalSur.toFixed(1)});
                grid.setData(dataResult);
                //loadChart(dataResult);
            }
        }
        function onSelectNode(e) {
            search();
        };
        function onSTCDChanged(e) {
            search();
        }
        function loadChart(data) {
            var dataResult = [];
            for (var num = 0; num < data.length; num++) {
                dataResult.push(data[num].NUMBER);
            }
            Chart('BY_charts', dataResult);
        }
        function Chart(chartName, data) {
            var node = tree.getSelectedNode();
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.off('click');
            myChart.clear();
            option = {
                title: {
                    left: 'center',
                    text: node.NAME + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年面暴雨总量变化以及占当年面降雨的比例",
                },
                tooltip: {
                    trigger: 'axis',
                    //axisPointer: {
                    //    type: 'shadow'
                    //}
                },
                // 更改图例默认颜色(依次应用)
                // color: ['red', 'black', 'yellow', 'pink', 'cyan'],
                color: ['#5470C6', '#91CC75', '#FAC858', '#EE6666'],
                // //这里设置柱状图上面的方块，名称跟series里的name保持一致
                legend: {
                    orient: 'vertical',
                    x: 'right',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    padding: [10, 50, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                    show: false,
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    // boundaryGap: true 表示x轴两边留白
                    boundaryGap: true,
                    axisTick: {
                        alignWithLabel: true
                    },
                    data: ['特大暴雨', '大暴雨', '暴雨']
                },
                yAxis: {
                    name: "暴雨频次",
                    type: 'value',
                    max: function (e) {
                        return e.max + 10;
                    }
                },
                series: [
                    {
                        name: '暴雨频次',
                        type: 'bar',
                        barGap: '0%',
                        barWidth: 30,
                        data: data,
                        itemStyle: {
                            normal: {
                                label: {
                                    show: true,  //开启显示
                                    formatter: '{c}',  //显示数值
                                    position: 'top',
                                    textStyle: { //数值样式
                                        fontSize: 10
                                    }
                                }
                            }
                        }
                    }
                ]
            };
            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
            myChart.on("click", pieConsole);
            function pieConsole(param) {
                //获取data长度
                var year = param.name;
                loadChangci(year);
            }
        }
        //柱子的点击事件
        function loadChangci(year) {
            var node = tree.getSelectedNode();
            var strTitle = node.NAME;
            var STCD = node.ID;
            var strParam = "STCD@" + STCD;
            var rainLevel = "";
            if (isNaN(year)) {
                strTitle += "1978年至2020年" + year + "频次";
                rainLevel = year;
                strParam += ",TYPE@" + rainLevel;
            } else {
                strTitle += year + "年暴雨频次";
                var stime = year + "-01-01 00:00:00";
                var etime = year + "-12-31 23:59:59";
                strParam += ",STIME@" + stime + ",ETIME@" + etime
            }
            var url = "/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html";
            lookData(strParam, url, strTitle, "50%", 565, "true");
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var node = tree.getSelectedNode();
            var name = node.NAME + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年面暴雨总量变化以及占当年面降雨的比例"
            ExportExcel(name, columns, data);
        }
        function OnClickTitle2(objID, name) {
            $.data(myData, "MONTH", null);
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            var SMONTH, EMONTH, SMONTHF, EMONTHF;
            if (objID == "TitleQuan") {
                $("#sysList").css("display", "none");
                $("#sysListFei").css("display", "none");
                $.data(myData, "SMONTH", null);
                $.data(myData, "EMONTH", null);
                $.data(myData, "SMONTHF", null);
                $.data(myData, "EMONTHF", null);
                search();
            }
            else if (objID == "TitleLidoing") {
                $("#sysListFei").css("display", "none");
                //$("#sysListMonth").css("display", "none");
                var isDisplay = $("#sysList").css("display");
                if (isDisplay == "none") {
                    $("#sysList").css("display", "block");
                } else {
                    $("#sysList").css("display", "none");
                }
                SMONTH = mini.get('comboStart').getValue();
                EMONTH = mini.get('comboEnd').getValue();
                SMONTHF = mini.get('comboStart').getValue();
                EMONTHF = mini.get('comboEnd').getValue();
                $.data(myData, "SMONTH", SMONTH);
                $.data(myData, "EMONTH", EMONTH);
                $.data(myData, "SMONTHF", SMONTHF);
                $.data(myData, "EMONTHF", EMONTHF);
            }
            else if (objID == "TitleLiafter") {
                $("#sysList").css("display", "none");
                var isDisplay = $("#sysListFei").css("display");
                if (isDisplay == "none") {
                    $("#sysListFei").css("display", "block");
                } else {
                    $("#sysListFei").css("display", "none");
                }
                SMONTH = mini.get('comboStartFei').getValue();
                EMONTH = mini.get('comboEndFei').getValue();
                SMONTHF = mini.get('comboStartFei1').getValue();
                EMONTHF = mini.get('comboEndFei1').getValue();
                $.data(myData, "SMONTH", SMONTH);
                $.data(myData, "EMONTH", EMONTH);
                $.data(myData, "SMONTHF", SMONTHF);
                $.data(myData, "EMONTHF", EMONTHF);
            }
            else if (objID == "TitleLiMonth") {
                $("#sysListFei").css("display", "none");
                $("#sysList").css("display", "none");
                $.data(myData, "MONTH", "MONTH");
                search();
            }
        }
        function XunOK() {
            $.data(myData, "ISFLOOD", true);
            $("#sysList").css("display", "none");
            search();
        }
        function feiXunOK() {
            $.data(myData, "ISFLOOD", false);
            $("#sysListFei").css("display", "none");
            search();
        }
        //获取表头---2022-01-05
        function STGRDColumn() {
            var createGrid = [];
            createGrid.push({ type: "indexcolumn", headerAlign: "center", align: "center", header: "序号", width: "50" });
            if ($.data(myData, "MONTH") == null) {
                createGrid.push({ field: "YEAR", headerAlign: "center", align: "center", header: "年份" });
            }
            else {
                createGrid.push({ field: "YEAR", headerAlign: "center", align: "center", header: "月份" });
            }
            createGrid.push({ field: "TOTALDRP", headerAlign: "center", align: "center", header: "累计雨量(mm)", allowsort: true });
            createGrid.push({ field: "SURDRP", headerAlign: "center", align: "center", header: "暴雨总量(mm)", allowsort: true });
            createGrid.push({ field: "DRPP", headerAlign: "center", align: "center", header: "暴雨总量占累计雨量的比例(%)", allowsort: true });
           
            grid.set({
                columns: createGrid
            });
        }
    </script>
</body>
</html>
