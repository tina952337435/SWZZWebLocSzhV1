<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />

    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="/Common/CSS/bootstrap.min.css" rel="stylesheet">
    <link href="/Common/CSS/font-awesome.min.css" rel="stylesheet">
    <link href="/Common/CSS/bootstrap-datetimepicker.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
        }

        #areaList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 5px;
        }

        .searchContext {
            height: 40px;
            line-height: 40px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }

        .mini-buttonedit {
            height: 30px;
            margin-right: 10px;
        }

        .mini-buttonedit-border {
            height: 30px;
        }

        .mini-buttonedit-input {
            height: 30px;
            line-height: 30px;
        }

        .mini-buttonedit-button {
            height: 30px;
            line-height: 30px;
            border: 0px;
        }

        .mini-buttonedit-button-pressed, .mini-buttonedit-popup .mini-buttonedit-trigger, .mini-buttonedit-button-hover {
            background: none;
            border: 0px;
        }
    </style>
</head>
<body>
    <!-- 头部搜索框start -->
    <div style="width:100%;">
        <div class="mini-toolbar">
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;站点选择：</div>
                <input id="ZHAN" name="ZHAN" class="mini-combobox" style="width:150px;float:left;" textfield="NAME"
                       valuefield="ID" allowinput="true" multiSelect="false" onvaluechanged="onSTCDChanged" />
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;年份选择：</div>
                <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                    <input id="startYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <span style="float:left;">—</span>
                <div class="input-group" style="width:110px;float:left;margin-left:4px;">
                    <input id="endYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                &nbsp;&nbsp;
                <a class="mini-button" onclick="Exp()">导出报表</a>
            </div>
            <!--<div class="searchContext">
                <div class="searchTitle">&nbsp; &nbsp;分类规则：</div>
                <ul class="ui-choose choose-type-right" id="choseMNLX">
                    <li class="selected">
                        <span>全市</span>
                    </li>
                    <li>
                        <span>行政分区</span>
                    </li>
                    <li>
                        <span>水利片区</span>
                    </li>
                </ul>
            </div>-->
        </div>
    </div>
    <!-- 头部搜索框end -->
    <!-- 表格start -->
    <div id="grid1" class="mini-datagrid"
         style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 95px);height: -moz-calc(100% - 95px);height: calc(100% - 95px);"
         allowalternating="true" borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]"
         pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="false"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" width="40" headeralign="center" align="center">序号</div>
            <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" -->
            <div field="BGTM" width="80" headeralign="center" align="center">
                暴雨开始时间
            </div>
            <div field="DRPP" width="80" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                 dataType="float">
                暴雨总量/年累计占比(%)
            </div>
            <div field="DRP" width="80" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                 dataType="float">
                暴雨总量(mm)
            </div>
            <div field="TOTALDRP" width="80" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                 dataType="float">
                年累计降雨量(mm)
            </div>
            <!--<div field="AREANAME" width="80" headeralign="center" align="center">
        分区名称
    </div>-->
            <!--<div field="COMMENTS" width="120" headeralign="center" align="center">
        资料年限
    </div>
    <div field="ESSTYM" width="60" headeralign="center" align="center">
        建站年份
    </div>-->
        </div>
    </div>
    <!-- 表格end -->
    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        mini.parse();
        var myData = [];
        var shNo = "310000";
        var shTitle = "全市";
        var grid = mini.get("grid1");
        $(function () {
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year-1;
            $.data(myData, "ATYPE", shTitle);
            loadStation();
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });

            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                shTitle = $(this).find("span").html();
                $.data(myData, "ATYPE", shTitle);
                search();
            });
        });


        //获取分区代表站
        function loadStation() {
            var strWhere = { STTP: "PP" };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_STBPRP_BSel", strWhere, "SSel");
        }

        function search() {
            var strWhere = {};
            strWhere["STIME"] = GetObj("startYear").value+"-01-01 00:00:00";
            strWhere["ETIME"] = GetObj("endYear").value + "-12-31 23:59:59";
            //strWhere["ATYPE"] = $.data(myData, "ATYPE");
            strWhere["STCD"] = mini.get('ZHAN').getValue();
            GetJosns("Daibiaozhanrainstormproportionyear", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "SSel") {
                loadStationHtml(data.data);
            }else if (typeID == "Sel") {
                grid.setData(data.data);
            }
        }
        function loadStationHtml(data) {
            var dataResult = [];
            for (var num = 0; num < data.length; num++) {
                dataResult.push({ ID: data[num].STCD, NAME: data[num].STNM, PID: "1" });
            }
            mini.get('ZHAN').setData(dataResult);
            mini.get('ZHAN').select(0);
            search();
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var rowIndex = e.rowIndex;
            if (field == "BGTM") {
                var stm = mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
                e.cellHtml = stm;
            }
        }

        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name ="代表站暴雨比例";
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
