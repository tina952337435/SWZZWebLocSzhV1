            -moz-user-select: -moz-none;
            -ms-user-select: none;
            -webkit-user-select: none;
            user-select: none;

        /* line 104, ../sass/dialog.scss */

<body>
    <div style="width:260px;float:left;height:100%; margin-right: 5px;background: white;padding: 10px 10px;">
        <ul id="tree1" class="mini-tree" style="width:100%;height:100%;padding:5px;"
            showTreeIcon="true" textField="NAME"
            idField="ID" expandOnNodeClick="true" onnodeselect="onSelectNode" expandOnLoad="2"></ul>
    </div>
    <div style="width:calc(100% - 265px);float:right;height:100%;background: white;">
        <div class="mini-toolbar">
            <div class="searchTitle" style="margin-top:8px;">&nbsp;&nbsp;&nbsp;年份选择：</div>
            <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                <input id="startYear" class="form-control" value="请选择年份" readonly>
                <div class="input-group-addon">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
            <span style="float:left;">—</span>
            <div class="input-group" style="width:110px;float:left;margin-left:4px;">
                <input id="endYear" class="form-control" value="请选择年份" readonly>
                <div class="input-group-addon">
                    <i class="fa fa-calendar" aria-hidden="true"></i>
                </div>
            </div>
            <ul class="onlytab" id="onlytab2"
                style="width:210px !important;margin-left:20px;float:left;">
                <li id="TitleLidoing" onclick="OnClickTitle2(this.id,'汛期')" class="onlyli onlyliHover start">汛期</li>
                <li id="TitleLiafter" onclick="OnClickTitle2(this.id,'非汛期')" class="onlyli">非汛期</li>
                <li id="TitleLiMonth" onclick="OnClickTitle2(this.id,'每月')" class="onlyli end">每月</li>
            </ul>

            <ul class="onlytab" id="onlytab3"
                style="width:140px !important;margin-left:20px;float:left;">
                <li id="TitleGrade" onclick="OnClickTitle3(this.id,'暴雨级别')" class="onlyli onlyliHover start">暴雨级别</li>
                <li id="TitleType" onclick="OnClickTitle3(this.id,'暴雨雨型')" class="onlyli end">暴雨雨型</li>
            </ul>

            <div id="sysList" class="sysList" hidden="hidden" style="z-index:99;width:240px;">
                <div class="title_dailog">汛期月份选择</div>
                <table>
                    <tr>
                        <td>
                            起：<input id="comboStart" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="6" />
                        </td>
                        <td>
                            止：<input id="comboEnd" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="9" />
                        </td>
                    </tr>
                </table>
                <div class="dailog_divOperation">
                    <span class="btn_span" data-name="确定" onclick="XunOK()">确定</span>
                    <!--<span class="btn_span" data-name="取消">取消</span>-->
                </div>
            </div>
            <div id="sysListFei" class="sysList" hidden="hidden" style="z-index:99;width:240px;">
                <div class="title_dailog">非汛期月份选择</div>
                <table>
                    <tr>
                        <td>
                            起：<input id="comboStartFei" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="1" />
                        </td>
                        <td>
                            止：<input id="comboEndFei" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="5" />
                        </td>
                    </tr>
                    <tr>
                        <td>起：<input id="comboStartFei1" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="10" /></td>
                        <td>止：<input id="comboEndFei1" class="mini-combobox" style="width:70px;" textField="text" valueField="id" allowInput="true" value="12" /></td>
                    </tr>
                </table>
                <div class="dailog_divOperation">
                    <span class="btn_span" data-name="确定" onclick="feiXunOK()">确定</span>
                    <!--<span class="btn_span" data-name="取消">取消</span>-->
                </div>
            </div>
            <!--<div id="sysListMonth" class="sysList" hidden="hidden" style="z-index:99;width:70px;left:498px;">
        <table>
            <tr><td>一月份</td></tr>
            <tr><td>二月份</td></tr>
            <tr><td>三月份</td></tr>
            <tr><td>四月份</td></tr>
            <tr><td>五月份</td></tr>
            <tr><td>六月份</td></tr>
            <tr><td>七月份</td></tr>

            <tr><td>十月份</td></tr>
            <tr><td>十一月份</td></tr>
            <tr><td>一月份</td></tr>
        </table>
    </div>-->
            <a class="mini-button" onclick="Exp()" style="margin-left:10px;height:35px;">导出报表</a>

            <div style="float:right;color:red;margin-right:10px;">
                <ul style="list-style:none;color:gray;">
                    <li style="height:30px;"> 注：暴雨、大暴雨和特大暴雨相互不包含</li>
                </ul>
            </div>
        </div>
        <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);" allowalternating="true"
             borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]" pagesize="15"
             showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell">
            <div property="columns">
                <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" 
                <div type="indexcolumn" headeralign="center" align="center" width="50">序号</div>
                <div width="20%" field="YEAR" headeralign="center" align="center" allowsort="true">
                    年份
                </div>
                <div width="20%" field="TOTALNUM" headeralign="center" align="center" allowsort="true">
                    总频次
                </div>
                <div width="20%" field="QIANG" headeralign="center" align="center" allowsort="true">
                    特大暴雨
                </div>
                <div width="20%" field="ZHONG" headeralign="center" align="center" allowsort="true">
                    大暴雨
                </div>
                <div width="20%" field="RUO" headeralign="center" align="center" allowsort="true">
                    暴雨
                </div>-->
            </div>
        </div>
    </div>
    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        mini.parse();
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        $(function () {
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 1;
            $.data(myData, "TJTYPE","Grade")
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            var dataMonth = [];
            for (var m = 1; m <= 12; m++) {
                dataMonth.push({ id: m, text: m });
            }
            mini.get('comboStart').setData(dataMonth);
            mini.get('comboEnd').setData(dataMonth);
            mini.get('comboStartFei').setData(dataMonth);
            mini.get('comboEndFei').setData(dataMonth);
            mini.get('comboStartFei1').setData(dataMonth);
            mini.get('comboEndFei1').setData(dataMonth);
            $.data(myData, "ISFLOOD", true);
            searchStation();
        });
        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
            STGRDColumn();
            var YEARS = [];
            var startYear = Number(GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            for (var num = startYear; num <= endYear; num++) {
                YEARS.push(num.toFixed(0));
            }
            $.data(myData, "YEARS", YEARS);
            var node = tree.getSelectedNode();
            var SMONTH, EMONTH, SMONTHF, EMONTHF;
            var ISFLOOD = $.data(myData, "ISFLOOD");
            if (ISFLOOD) {
                SMONTH = mini.get('comboStart').getValue();
                EMONTH = mini.get('comboEnd').getValue();
                SMONTHF = mini.get('comboStart').getValue();
                EMONTHF = mini.get('comboEnd').getValue();
            } else {
                SMONTH = mini.get('comboStartFei').getValue();
                EMONTH = mini.get('comboEndFei').getValue();
                SMONTHF = mini.get('comboStartFei1').getValue() ;
                EMONTHF = mini.get('comboEndFei1').getValue();
            }
            var strWhere = {
                STCD: node.ID,
                YEARS: YEARS.join(','),
                SMONTH: SMONTH,
                EMONTH: EMONTH,
                SMONTHF: SMONTHF,
                EMONTHF: EMONTHF,
                MONTH: $.data(myData, "MONTH")
            };
            if ($.data(myData, "TJTYPE") == "Grade") {
                GetJosns("FloodNoseasonNumber", strWhere, "SelNum");
            }
            else {
                GetJosns("FloodNoseasonNumberByType", strWhere, "SelNum");
            }
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
            }
            else if (typeID == "SelNum") {
                var dataResult = mini.decode(data.data);
                if ($.data(myData, "TJTYPE") == "Grade") {
                    dataResult.push(
                        {
                            YEAR: "合计",
                            TOTALNUM: SumJson(dataResult, "TOTALNUM"),
                            QIANG: SumJson(dataResult, "QIANG"),
                            ZHONG: SumJson(dataResult, "ZHONG"),
                            RUO: SumJson(dataResult, "RUO"),
                        });
                } else {
                    dataResult.push(
                        {
                            YEAR: "合计",
                            TOTALNUM: SumJson(dataResult, "TOTALNUM"),
                            ONE: SumJson(dataResult, "ONE"),
                            TWO: SumJson(dataResult, "TWO"),
                            THREE: SumJson(dataResult, "THREE"),
                            FOUR: SumJson(dataResult, "FOUR"),
                            FIVE: SumJson(dataResult, "FIVE"),
                            SIX: SumJson(dataResult, "SIX"),
                            SEVEN: SumJson(dataResult, "SEVEN"),
                        });
                }
                grid.setData(dataResult);
            }
        }
        //树形切换事件
        function onSelectNode(e) {
            search();
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;

            if (field == "QIANG" || field == "ZHONG" || field == "RUO") {
                var node = tree.getSelectedNode();
                var STCD = node.ID;
                var YEAR = record.YEAR;
                var STIME = YEAR + "-01-01 00:00:00";
                var ETIME = YEAR + "-12-31 23:59:59";
                var NAME = node.NAME;
                var TYPE = column.header.replaceAll(" ", "").replaceAll("\r", "").replaceAll("\n", "").replaceAll("\t", "");
                var strTitle = NAME + YEAR + "年" + TYPE;
                var str = "<a onclick='lookData(\"STCD@" + STCD + ",STIME@" + STIME + ",ETIME@" + ETIME + ",TYPE@" + TYPE + "\",\"/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html\",\"" + strTitle + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                if (value == undefined) {
                    str = "-";
                }
                if (Number(value) == 0) {
                    str = 0;
                }
                e.cellHtml = str;
            }
            if (field == "TOTALNUM") {
                var node = tree.getSelectedNode();
                var STCD = node.ID;
                var YEAR = record.YEAR;
                var STIME = YEAR + "-01-01 00:00:00";
                var ETIME = YEAR + "-12-31 23:59:59";
                var NAME = node.NAME;
                var TYPE = column.header.replaceAll(" ", "").replaceAll("\r", "").replaceAll("\n", "").replaceAll("\t", "");
                var strTitle = NAME + YEAR + "年" + TYPE;
                var str = "<a onclick='lookData(\"STCD@" + STCD + ",STIME@" + STIME + ",ETIME@" + ETIME +"\",\"/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html\",\"" + strTitle + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                if (value == undefined) {
                    str = "-";
                }
                if (Number(value) == 0) {
                    str = 0;
                }
                e.cellHtml = str;
            }
        }
        function OnClickTitle2(objID, name) {
            $.data(myData, "MONTH", null);
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            if (objID == "TitleLidoing") {
                $("#sysListFei").css("display", "none");
                //$("#sysListMonth").css("display", "none");
                var isDisplay = $("#sysList").css("display");
                if (isDisplay == "none") {
                    $("#sysList").css("display", "block");
                } else {
                    $("#sysList").css("display", "none");
                }
            }
            else if (objID == "TitleLiafter") {
                $("#sysList").css("display", "none");
                //$("#sysListMonth").css("display", "none");
                var isDisplay = $("#sysListFei").css("display");
                if (isDisplay == "none") {
                    $("#sysListFei").css("display", "block");
                } else {
                    $("#sysListFei").css("display", "none");
                }
            }
            else if (objID == "TitleLiMonth") {
                $("#sysListFei").css("display", "none");
                $("#sysList").css("display", "none");
                $.data(myData, "MONTH", "MONTH");
                search();
            }
        }

        function OnClickTitle3(objID, name) {
            var only = $("#onlytab3 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $.data(myData, "TJTYPE", objID.replaceAll("Title", ""));
            search();
        }

        function XunOK() {
            $.data(myData, "ISFLOOD", true);
            $("#sysList").css("display", "none");
            search();
        }
        function feiXunOK() {
            $.data(myData, "ISFLOOD", false);
            $("#sysListFei").css("display", "none");
            search();
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var node = tree.getSelectedNode();
            var name = node.NAME;
            var isFlood = $.data(myData, "ISFLOOD");
            var strXun = "非汛期";
            if (isFlood) {
                strXun = "汛期";
            }
            name += GetObj("startYear").value + "年至" + GetObj("endYear").value + "年" + strXun+"暴雨频次";
            ExportExcel(name, columns, data);
        }
        //获取表头---2022-01-05
        function STGRDColumn() {
            var createGrid = [];
            createGrid.push({ type: "indexcolumn", headerAlign: "center", align: "center", header: "序号" ,width:"50"});
            if ($.data(myData, "MONTH") == null) {
                createGrid.push({ field: "YEAR", headerAlign: "center", align: "center", header: "年份" });
            }
            else{
                createGrid.push({ field: "YEAR", headerAlign: "center", align: "center", header: "月份" });
            }
            if ($.data(myData, "TJTYPE") == "Grade") {
                createGrid.push({ field: "TOTALNUM", headerAlign: "center", align: "center", header: "总频次", allowsort: true });
                createGrid.push({ field: "QIANG", headerAlign: "center", align: "center", header: "特大暴雨", allowsort: true });
                createGrid.push({ field: "ZHONG", headerAlign: "center", align: "center", header: "大暴雨", allowsort: true });
                createGrid.push({ field: "RUO", headerAlign: "center", align: "center", header: "暴雨", allowsort: true });
            } else {
                createGrid.push({ field: "ONE", headerAlign: "center", align: "center", header: "Ⅰ型（单峰）", allowsort: true });
                createGrid.push({ field: "TWO", headerAlign: "center", align: "center", header: "Ⅱ型（单峰）", allowsort: true });
                createGrid.push({ field: "THREE", headerAlign: "center", align: "center", header: "Ⅲ型（单峰）", allowsort: true });
                createGrid.push({ field: "FOUR", headerAlign: "center", align: "center", header: "Ⅳ型（均匀）", allowsort: true });
                createGrid.push({ field: "FIVE", headerAlign: "center", align: "center", header: "Ⅴ型（双峰）", allowsort: true });
                createGrid.push({ field: "SIX", headerAlign: "center", align: "center", header: "Ⅵ型（双峰）", allowsort: true });
                createGrid.push({ field: "SEVEN", headerAlign: "center", align: "center", header: "Ⅶ型（双峰）", allowsort: true });
            }
            grid.set({
                columns: createGrid
            });
        }
    </script>
</body>
</html>
