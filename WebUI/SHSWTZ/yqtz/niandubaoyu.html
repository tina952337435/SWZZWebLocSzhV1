    <script>
        mini.parse();
        var myData = [];
        var shNo = "310000";
        var shTitle = "全市";
        var grid = mini.get("grid1");
        var dataMonth = [];
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year-2;
            $.data(myData, "STCD", shNo);
            $.data(myData, "GRADE",null);
            loadArea();
            loadStation();
            loadAreaStation();
            search();
            breakgrid();
            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var ATYPE = $(this).find("span").html();
                $.data(myData, "STCD", shNo);
                $.data(myData, "ATYPE", ATYPE);
                if (ATYPE == "行政分区" || ATYPE == "水利片区") {
                    $("#areaList").show();
                    var dataResult = $.data(myData, "AreaData");
                    dataResult = dataResult.filter(function (item) {
                        return item.ATYPE == ATYPE && item.AID != '100071' && item.AID != '100072';
                    });
                    var strHtml = '<ul class="ui-choose choose-type-right" id="choseArea">';
                    strHtml += '<li class="selected"><span id="areaAll">全部</span></li>';
                    dataResult.forEach(function (item, index) {
                        strHtml += '<li><span  id="' + item.AID + '">' + item.AREANAME + '</span></li>';
                    });
                    strHtml += '</ul>';
                    $("#areaDiv").html(strHtml);
                    $('#choseArea li').click(function () {
                        $("#sysListPD").hide();
                        var f = this;
                        $('#choseArea li').each(function (index, item) {
                            this.className = this == f ? 'selected' : '';
                        });
                        var stcd = $(this).find("span").attr("id");
                        if (stcd.indexOf("All") == -1) {
                            $.data(myData, "STCD", stcd);
                            shTitle = $(this).find("span").html();
                            var stcsArr = [];
                            var AreaStationData = $.data(myData, "AreaStationData");
                            AreaStationData = AreaStationData.filter(function (item) {
                                if (item.PAID == stcd) {
                                    stcsArr.push(item.STCD);
                                }
                            });
                            //根据分区编号筛选站点
                            $.data(myData, "STCDS", stcsArr);

                        } else {
                            shTitle = "全市";
                            $.data(myData, "STCD", shNo);
                            $.data(myData, "STCDS", null);
                        }
                        loadAreaStationHtml();
                        search();
                        breakgrid();
                    });
                    $('#choseArea li').mousemove(function () {
                        var stcd = $(this).find("span").attr("id");
                        if (stcd == "10007") {//浦东分区分了两个区域
                            $("#sysListPD").show();
                        } else {
                            $("#sysListPD").hide();
                        }
                    });
                }
                else {
                    $("#areaList").hide();
                    shTitle = "全市";
                    $.data(myData, "STCD", shNo);
                    $.data(myData, "STCDS", null);
                    loadAreaStationHtml();
                }
                search();
                breakgrid();
            });
            $('#choseGrade li').click(function () {
                var f = this;
                $('#choseGrade li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");
                if (grade == "全部") {
                    grade = null;
                }
                $.data(myData, "GRADE", grade);
                search();
                breakgrid();
            });
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            $('#choseMNPD li').click(function () {
                var f = this;
                $('#choseMNPD li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                shTitle = $(this).find("span").html();
                var stcd = $(this).find("span").attr("name");
                var stcsArr = [];
                var AreaStationData = $.data(myData, "AreaStationData");
                AreaStationData = AreaStationData.filter(function (item) {
                    if (item.PAID == stcd) {
                        stcsArr.push(item.STCD);
                    }
                });
                //根据分区编号筛选站点
                $.data(myData, "STCDS", stcsArr);
                $.data(myData, "STCD", stcd);
                loadAreaStationHtml();
                search();
                breakgrid();
            });
            for (var m = 1; m <= 12; m++) {
                dataMonth.push({ id: m, text: m });
            }
            mini.get('comboStart').setData(dataMonth);
            mini.get('comboEnd').setData(dataMonth);
            mini.get('comboStartFei').setData(dataMonth);
            mini.get('comboEndFei').setData(dataMonth);
            mini.get('comboStartFei1').setData(dataMonth);
            mini.get('comboEndFei1').setData(dataMonth);
        });
        //获取分区代表站
        function loadStation() {
            var strWhere = { STTP: "PP" };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_STBPRP_BSel", strWhere, "SSel");
        }
        function loadArea() {
            var strWhere = {};
            GetJosns("SWZZ_FLOODTIDEDATA_ST_AREA_BSel", strWhere, "ASel");
        }
        //分区与站点关联关系表
        function loadAreaStation() {
            var strWhere = { BTYPE: "雨量" };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_AREACWSTATION_BSel", strWhere, "BSel");
        }
        function loadAreaStationHtml() {
            var data = $.data(myData, "StationData");
            if ($.data(myData, "STCDS") != undefined) {
                var stcds = $.data(myData, "STCDS");
                data = data.filter(function (item) {
                    return stcds.indexOf(item.STCD) > -1;
                });
            }
            var strHtml = '<ul class="ui-choose choose-type-right" id="choseZhan">';
            strHtml += '<li class="selected"><span id="staAll">全部</span></li>';
            data.forEach(function (item) {
                strHtml += '<li><span id="' + item.STCD + '">' + item.STNM + '</span></li>';
            });
            strHtml += '</ul>';
            $("#zhanDiv").html(strHtml);
            $('#choseZhan li').click(function () {
                var f = this;
                $('#choseZhan li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var stcd = $(this).find("span").attr("id");
                shTitle = $(this).find("span").html();
                if (stcd.indexOf("All") > -1) {
                    var astcd = $('#choseArea .selected').find("span").attr("id");//分区的编号或者全市的编号
                    var astnm = $('#choseArea .selected').find("span").html();
                    if (astcd == undefined || astcd.indexOf("All") > -1) {
                        stcd = shNo;
                        shTitle = "全市";
                    } else {
                        stcd = astcd;

                var etime = GetObj("endYear").value + "-12-31 23:59:59";

                    ETIME: etime,

                };
                GetJosns("SWZZ_FLOODTIDEDATA_ST_RAINSTORMFREQUENCY_RSel", strWhere, "RSel");

        function breakgrid() {
            var stime = GetObj("startYear").value + "-01-01 00:00:00";

        function loadChartHtml(data) {
            var grade = $.data(myData, "GRADE");
            if (grade != undefined && grade != null) {
                if (grade == "暴雨") {
                    data = data.filter(function (e) {
                        return e.DRP24 >= 50 && e.DRP24<100
                    });
                } else if (grade == "大暴雨") {
                    data = data.filter(function (e) {
                        return e.DRP24 >= 100 && e.DRP24 < 200
                    });
                } else if (grade == "特大暴雨") {
                    data = data.filter(function (e) {
                        return e.DRP24 >=200
                    });
                }
            }
            var startYear = GetObj("startYear").value;
            var endYear = GetObj("endYear").value;
            var dataX = []; //["1987", "1988", "1989", "1990", "1992", "1993", "1994", "1995", "1996", "1997", "1998", "1999", "2000", "2001", "2002", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2012", "2013", "2014", "2015", "2016", "2018", "2019", "2020", "2021"];
            var dataY = [];//[4, 3, 5, 2, 1, 2, 3, 1, 2, 1, 3, 1, 5, 1, 1, 1, 2, 4, 2, 2, 1, 1, 4, 1, 3, 2, 2, 5, 1, 1, 1];
            var QNum = 0, ZNum = 0, RNum = 0, TotalNum = 0;
            for (var num = startYear; num <= endYear; num++) {
                dataX.push(num);
                var stime = new Date(num + "-01-01 00:00:00");
                var etime = new Date(num + "-12-31 23:59:59");
                var dataTemp = data.filter(function (item) {
                    return new Date(convertToDate(item.BGTM)) >= stime && new Date(convertToDate(item.BGTM)) <= etime && Number(item.DRP24) >= 50;
                });
                dataY.push(dataTemp.length);
                dataTemp.forEach(function (item) {
                    var drp = Number(item.DRP24);
                    if (drp >= 50 && drp < 100) {
                        RNum++;
                    } else if (drp >= 100 && drp < 200) {
                        ZNum++;
                    } else if (drp >= 200) {
                        QNum++;
                    }
                });
            }
            TotalNum = QNum + ZNum + RNum;
            var dataPie = [{ value: QNum, name: "特大暴雨" }, { value: ZNum, name: "大暴雨" }, { value: RNum, name: "暴雨" }];
            chartBarPie('chartPie', dataX, dataY, dataPie, TotalNum);
        }
        function JosnSel(data, typeID) {
            if (typeID == "SSel") {
                $.data(myData, "StationData", data.data);
                loadAreaStationHtml();
            }
            else if (typeID == "ASel") {
                $.data(myData, "AreaData", data.data);
            }
            else if (typeID == "RSel") {
                loadChartHtml(data.data);
            }
            else if (typeID == "BSel") {
                $.data(myData, "AreaStationData", data.data);
            }
            else if (typeID == "NAMESel") {
                var dataResult = data.data;// sortObjectArray(data.data, ['BGTM'], 'desc');
                var grade = $.data(myData, "GRADE");
                if (grade != undefined && grade != null) {
                    if (grade == "暴雨") {
                        dataResult = dataResult.filter(function (e) {
                            return e.DRP24 >= 50 && e.DRP24 < 100
                        });
                    } else if (grade == "大暴雨") {
                        dataResult = dataResult.filter(function (e) {
                            return e.DRP24 >= 100 && e.DRP24 < 200
                        });
                    } else if (grade == "特大暴雨") {
