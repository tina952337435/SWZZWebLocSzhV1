<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代表站暴雨极值查询</title>
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />

    <link href="/Common/CSS/bootstrap.min.css" rel="stylesheet">
    <link href="/Common/CSS/font-awesome.min.css" rel="stylesheet">
    <link href="/Common/CSS/bootstrap-datetimepicker.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .onlytab {
            margin: 0px;
            padding: 0px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 100% !important;
        }

            .onlytab li {
                list-style: none;
                border: 1px #3291f9 solid;
                float: left;
                background-color: White;
                width: auto !important;
                height: 30px;
                font: 14px/30px "arial";
                text-align: center;
            }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }

        #areaList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }

        .btn {
            /*padding: 3px 12px;*/
            position: absolute;
            left: 365px;
            margin-top: 3px;
        }

        .mini-button {
            position: absolute;
            left: 365px;
            margin-top: 3px;
        }

        .searchContext {
            height: 40px;
            line-height: 40px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }

        ul.ui-choose > li{
            width:auto;
        }
    </style>
</head>
<body>
    <!-- 头部搜索框start -->
    <div style="width:100%;">
        <div class="mini-toolbar" style="position:relative;height:50px;">
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;年份选择：</div>
                <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                    <input id="startYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <span style="float:left;">—</span>
                <div class="input-group" style="width:110px;float:left;margin-left:4px;">
                    <input id="endYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <!--<p style="margin-top:10px;position:absolute;">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;累计极值：</p>-->
                <ul class="ui-choose choose-type-right" id="choseMNLX" style="position:absolute;left:350px;margin-top: 0px;">
                    <li class="selected">
                        <span id="HOUR">小时最大</span>
                    </li>
                    <li>
                        <span id="24H">24小时最大</span>
                    </li>
                    <li>
                        <span id="DAY">日最大</span>
                    </li>
                    <li>
                        <span id="0609_1">汛期小时最大</span>
                    </li>
                    <li>
                        <span id="0609_24">汛期24小时最大</span>
                    </li>
                    <li>
                        <span id="151012_1">非汛期小时最大</span>
                    </li>
                    <li>
                        <span id="151012_24">非汛期24小时最大</span>
                    </li>
                </ul>
                <!--<button type="button" class="btn btn-success" onclick="look()">泰森多边形</button>-->
                <a class="mini-button" onclick="search();" style="position:absolute;left:1160px;margin-top: 0px;">查询</a>
                <a class="mini-button" onclick="Exp()" style="position:absolute;left:1220px;margin-top: 0px;">导出报表</a>
            </div>
        </div>
    </div>
    <!-- 头部搜索框end -->
    <!-- 表格start -->
    <div id="grid1" class="mini-datagrid"
         style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 70px);height: -moz-calc(100% - 70px);height: calc(100% - 70px);"
         allowalternating="true" borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]"
         pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" width="4%" headeralign="center" align="center">序号</div>
            <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" -->
            <div field="STNM" width="80" headeralign="center" align="center">
                站名
            </div>
            <div field="DRP" width="80" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                 dataType="float">
                最大降雨量(mm)
            </div>
            <div field="TIME" width="80" headeralign="center" align="center" format="yyyy-MM-dd" allowsort="true">
                开始时间
            </div>
            <div field="COMMENTS" width="120" headeralign="center" align="center">
                资料年限
            </div>
            <div field="ESSTYM" width="60" headeralign="center" align="center">
                建站年份
            </div>
            <div field="COUNTIES" width="80" headeralign="center" align="center">
                行政分区
            </div>
            <div field="WATERAREA" width="80" headeralign="center" align="center">
                水利片区
            </div>
            <!--<div field="action" width="10%" headeralign="center" align="center" allowsort="true">基本操作</div>-->
        </div>
    </div>
    <!-- 表格end -->
    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        // 将html标签解析为miniui控件，解析后，才能使用mini.get获取到控件对象
        // 在window.onload时间点会自动调用
        mini.parse();
        var myData = [];
        //实例化表格对象
        // mini.get("grid1") 根据id获取控件对象
        var grid = mini.get("grid1");
        var dataResult = {};

        $(function () {
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 1;
            $.data(myData, "STYPE", "1");
            //默认加载数据
            search();
            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var str = $(this).find('span').attr("id");

                if (str == "HOUR") {
                    $.data(myData, "STYPE", "1");
                } else if (str == "DAY") {
                    $.data(myData, "STYPE", "2");
                } else if (str == "24H") {
                    $.data(myData, "STYPE", "24");
                } else {
                    $.data(myData, "STYPE", str);
                }
                search();
            });

            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
        });
        function search() {
            var strWhere = {
                STYPE: $.data(myData, "STYPE"),
                STIME: GetObj("startYear").value + "-01-01 00:00:00",
                ETIME: GetObj("endYear").value + "-12-31 23:59:59"
            };
            GetJosns("RAINSTORMVALUENAME_SSel", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                grid.setData(data.data);
            }
            else if (typeID == "Update") {
                ShowMsg(data.Message);
                search();
            }
        }
        function onvaluechanged(e) {
            var value = e.value;
            var sender = e.sender;
            var selected = grid.getSelected();
            if (selected) {
                if (!isNaN(value)) {
                    mini.confirm("值改变是否确认修改？", "确定？",
                        function (action) {
                            if (action == "ok") {
                                var strWhere = { STCD: selected.STCD, STYPE: $.data(myData, "STYPE"), DRP: value };
                                GetJosns("SWZZ_FLOODTIDEDATA_ST_RAINSTORMVALUE_SUpdate", strWhere, "Update");
                            }
                            else {
                            }
                        }
                    );
                }
            }
        }
        function removeRow(stcd) {
            var strWhere = { STCD: stcd, STYPE: $.data(myData, "STYPE") };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_RAINSTORMVALUE_SDel", strWhere, "Update");
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            if (field == "STNM") {
                if ($.data(myData, "STYPE") != 24) {
                    // e.cellStyle="background:#0099CC;";
                    if (value != undefined) {
                        var str = "<a onclick='lookData(\"STCD@" + record.STCD + ",STYPE@" + $.data(myData, "STYPE") + "\",\"/SHSWTZ/yqtz/jiangyuliang.html\",\"" + record.STNM + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                        e.cellHtml = str;
                    }
                }

            }
            if (field == "TM") {
                var str = "-";
                if (value != undefined) {
                    str = convertToDate(value).format("yyyy-MM-dd HH:mm");
                    console.error(str);
                    var tm = new Date(str).format("yyyy年M月d日H时");
                    str = "<a onclick='lookData(\"TM@" + str + "\",\"/SHSWTZ/yqtz/daibiaozhanPolygonCounty.html?TM=" + str + "&STYPE=" + $.data(myData, "STYPE") + "\",\"" + tm + "面雨量\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + str + "</a>";
                    e.cellHtml = str;
                }
            }

            if (field == "TIME") {
                if (value != undefined) {
                    var str = new Date(value).format("yyyy-MM-dd HH:mm");
                    str = "<a onclick='lookData(\"TM@" + str + "\",\"/SHSWTZ/yqtz/daibiaozhanPolygonCounty.html?TM=" + str + "&STYPE=" + $.data(myData, "STYPE") + "\",\"" + tm + "面雨量\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + str + "</a>";
                    e.cellHtml = str;

                }

            }

            if (field == "action") {
                var s = ' <img style="cursor:pointer;" onclick="removeRow(\'' + record.STCD + '\')" src="/Common/miniui/themes/icons/remove.png" title="删除" />&nbsp;';
                e.cellHtml = s;
            }
        }
        function look() {
            lookData('', '/SHSWTZ/yqtz/daibiaozhanPolygonCounty.html?STYPE=' + $.data(myData, "STYPE"), '面雨量', '60%', '70%', 'true')
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var stype = $.data(myData, "STYPE");
            var name = "代表站";
            if (stype == "1") {
                name += "小时累计最大降雨量"
            } else if (stype == "2") {
                name += "日累计最大降雨量"
            }
            name += "列表"
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
