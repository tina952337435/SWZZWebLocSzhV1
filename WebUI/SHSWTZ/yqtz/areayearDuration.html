    <script src="/Common/boot.js" type="text/javascript"></script>
    <!-- 引入echarts.js -->
    <script src="/Common/Scripts/echarts.min.js"></script>

    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />

    <link href="/Common/CSS/bootstrap.min.css" rel="stylesheet">
    <link href="/Common/CSS/font-awesome.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .mini-panel-border, .mini-grid-border {
            border: 0px !important;
        }

        .btn {
            padding: 3px 12px;
            position: absolute;
            left: 360px;
            top: 8px;
        }

        .searchContext {
            height: 40px;
            line-height: 40px;
            /*width: 340px;*/
        }

        .searchTitle {
            width: 102px;
            float: left;
        }

        .mini-button {
            position: absolute;
            left: 420px;
            top: 6px;
        }
    </style>
</head>
<body>
    <div style="width:260px;float:left;height:100%; margin-right: 5px;background: white;padding: 10px 10px;">
        <ul id="tree1" class="mini-tree" style="width:100%;height:100%;padding:5px;"
            showTreeIcon="true" textField="NAME"
            idField="ID" expandOnNodeClick="true" onnodeselect="onSelectNode" expandOnLoad="1"></ul>
    </div>
    <div style="width:calc(100% - 265px);float:right;height:100%;background: white;">
        <div class="mini-toolbar">
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;年份选择：</div>
                <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                    <input id="startYear" class="form-control" value="开始" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <span style="float:left;">—</span>
                <div class="input-group" style="width:110px;float:left;margin-left:4px;">
                    <input id="endYear" class="form-control" value="结束" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <button type="button" class="btn btn-info" onclick="search()">统计</button>
                <a class="mini-button" onclick="Exp()">导出报表</a>

                <div style="float:right;color:red;margin-right:10px;">
                    <ul style="list-style:none;color:gray;">
                        <li style="height:30px;"> 注：暴雨、大暴雨和特大暴雨相互不包含</li>
                    </ul>
                </div>
            </div>
            <div class="searchContext">
                <div class="searchTitle">&nbsp; &nbsp;暴雨级别：</div>
                <ul class="ui-choose choose-type-right" id="choseGrade">
                    <li class="selected">
                        <span name="全部">全部</span>
                    </li>
                    <li>
                        <span name="暴雨">暴雨</span>
                    </li>
                    <li>
                        <span name="大暴雨">大暴雨</span>
                    </li>
                    <li>
                        <span name="特大暴雨">特大暴雨</span>
                    </li>
                </ul>
            </div>
            <div class="searchContext">
                <div class="searchTitle">&nbsp; &nbsp;暴雨类型：</div>
                <ul class="ui-choose choose-type-right" id="choseType">
                    <li class="selected">
                        <span name="全部">全部</span>
                    </li>
                    <li>
                        <span name="Ⅰ">Ⅰ型（单峰）</span>
                    </li>
                    <li>
                        <span name="Ⅱ">Ⅱ型（单峰）</span>
                    </li>
                    <li>
                        <span name="Ⅲ"> Ⅲ型（单峰）</span>
                    </li>
                    <li>
                        <span name="Ⅳ">Ⅳ型（均匀）</span>
                    </li>
                    <li>
                        <span name="Ⅴ">Ⅴ型（双峰）</span>
                    </li>
                    <li>
                        <span name="Ⅵ">Ⅵ型（双峰）</span>
                    </li>
                    <li>
                        <span name="Ⅶ">Ⅶ型（双峰）</span>
                    </li>
                </ul>
            </div>
            <div class="searchContext">
                <div class="searchTitle">&nbsp; &nbsp;短历时选择：</div>
                <ul class="ui-choose choose-type-right" id="DHOURGrade">
                    <li class="selected">
                        <span name="0-1">&le;1小时</span>
                    </li>
                    <li>
                        <span name="1-3">1~3小时</span>
                    </li>
                    <li>
                        <span name="3-6">3~6小时</span>
                    </li>
                    <li>
                        <span name="6-12">6~12小时</span>
                    </li>
                    <li>
                        <span name="12-24">12~24小时</span>
                    </li>
                    <li>
                        <span name="24-100000">&gt;24小时</span>
                    </li>
                </ul>
            </div>
        </div>
        <!--<div id="BY_charts" style="height:450px;width:100%;margin:0px 0%;background:white;"></div>-->
        <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 180px);height: -moz-calc(100% - 180px);height: calc(100% - 180px);" allowalternating="true"
             borderstyle="border-right:0;" sortmode="client"
             showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell">
            <!-- <div property="columns"> -->
                <!-- <div type="indexcolumn" headeralign="center" align="center" width="50">序号</div> -->
                <!-- <div width="10%" field="YEAR" headeralign="center" align="center" allowsort="true"> -->
                    <!-- 年份 -->
                <!-- </div> -->
                <!-- <div width="20%" field="NUMBER" headeralign="center" align="center" allowsort="true" decimalPlaces="0" -->
                     <!-- dataType="float"> -->
                    <!-- 暴雨场次 -->
                <!-- </div> -->
                <!-- <div width="20%" field="DNUMBER" headeralign="center" align="center" allowsort="true" decimalPlaces="0" -->
                     <!-- dataType="float"> -->
                    <!-- 短历时暴雨场次 -->
                <!-- </div> -->
                <!-- <div width="20%" field="DBILI" headeralign="center" align="center" allowsort="true" decimalPlaces="1" -->
                     <!-- dataType="float"> -->
                    <!-- 短历时暴雨场次所占比例(%) -->
                <!-- </div> -->
                <!-- <div width="20%" field="CNUMBER" headeralign="center" align="center" allowsort="true" decimalPlaces="0" -->
                     <!-- dataType="float"> -->
                    <!-- 长历时暴雨场次 -->
                <!-- </div> -->
                <!-- <div width="20%" field="CBILI" headeralign="center" align="center" allowsort="true" decimalPlaces="1" -->
                     <!-- dataType="float"> -->
                    <!-- 长历时暴雨场次所占比例(%) -->
                <!-- </div> -->
                <!-- <div width="20%" field="YAVGDUR" headeralign="center" align="center" allowsort="true" decimalPlaces="1" -->
                     <!-- dataType="float"> -->
                    <!-- 平均历时(h) -->
                <!-- </div> -->
            <!-- </div> -->
        </div>
    </div>
    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
		
        mini.parse();
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        var myData = [];
        $(function () {
		createGrid();
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 1;
            searchStation();
            $.data(myData, "DHOUR", "0-1");
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            $('#choseGrade li').click(function () {
                var f = this;
                $('#choseGrade li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");
                if (grade == "全部") {
                    grade = null;
                } 
                $.data(myData, "GRADE", grade);
                search();
            });
            $('#choseType li').click(function () {
                var f = this;
                $('#choseType li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");
                if (grade == "全部") {
                    grade = null;
                } else {
                    $.data(myData, "TYPENAME", $(this).find("span").html())
                }
                $.data(myData, "TYPE", grade);
                search();
            });
            $('#DHOURGrade li').click(function () {
                var f = this;
                $('#DHOURGrade li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");//.replace("hour", "");
                //alert(grade);
                $.data(myData, "DHOUR", grade);
                search();
            });
        });
		
        function createGrid() {
            var dhour = $.data(myData, "DHOUR");
            if (dhour == "24-100000") {
                dhour = "大于24";
            }
            if (dhour == "0-1") {
                dhour = "1";
            }
            var columns = [
                { type: "indexcolumn", header: "序号", headerAlign: "center", align: "center" },
                { field: "YEAR", header: "年份", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                { field: "NUMBER", header: "暴雨场次", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                { field: "DNUMBER", header: dhour + "小时暴雨场次", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                { field: "DBILI", header: dhour + "小时暴雨场次所占比例(%)", width: "10%", headerAlign: "center", align: "center", allowSort: true, dataType: "float", decimalPlaces: "1" },
                { field: "CNUMBER", header: "长历时暴雨场次", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                { field: "CBILI", header: "长历时暴雨场次所占比例(%)", width: "10%", headerAlign: "center", align: "center", allowSort: true, dataType: "float", decimalPlaces: "1" },
                { field: "YAVGDUR", header: "平均历时(h)", width: "10%", headerAlign: "center", align: "center", allowSort: true, dataType: "float", decimalPlaces: "1" }
            ];
            grid.set({
                columns: columns
            });
        }
 
	   function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            //dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            //dataTempC.forEach(function (item) {
            //    for (var num = 0; num < item.length; num++) {
            //        dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
            //    }
            //});
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
		//设置表头
		createGrid();
            var node = tree.getSelectedNode();
            var startYear = Number(GetObj("startYear").value) + "-01-01 00:00:00";
            var endYear = Number(GetObj("endYear").value) + "-12-31 23:59:59";;
            var strWhere = {
                STCD: node.ID,
                STIME: startYear,
                ETIME: endYear,
                GRADE: $.data(myData, "GRADE"),
                TYPE: $.data(myData, "TYPE"),
                DHOUR: $.data(myData, "DHOUR"),
            };
            GetJosns("rainStormDurationSel", strWhere, "SelNum");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = mini.decode(data.data);
                var NUMBER = SumJson(dataResult, "NUMBER");
                var DNUMBER = SumJson(dataResult, "DNUMBER");
                var CNUMBER = SumJson(dataResult, "CNUMBER");
                dataResult.push({ YEAR: "合计", NUMBER: NUMBER, DNUMBER: DNUMBER, CNUMBER: CNUMBER });
                grid.setData(dataResult);
                //loadChart(dataResult);
            }
        }
        function onSelectNode(e) {
            search();
        };
        function onSTCDChanged(e) {
            search();
        }
        function loadChart(data) {
            var dataResult = [];
            for (var num = 0; num < data.length; num++) {
                dataResult.push(data[num].NUMBER);
            }
            Chart('BY_charts', dataResult);
        }
        function Chart(chartName, data) {
            var node = tree.getSelectedNode();
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.off('click');
            myChart.clear();
            option = {
                title: {
                    left: 'center',
                    text: node.NAME + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年面暴雨总量变化以及占当年面降雨的比例",
                },
                tooltip: {
                    trigger: 'axis',
                    //axisPointer: {
                    //    type: 'shadow'
                    //}
                },
                // 更改图例默认颜色(依次应用)
                // color: ['red', 'black', 'yellow', 'pink', 'cyan'],
                color: ['#5470C6', '#91CC75', '#FAC858', '#EE6666'],
                // //这里设置柱状图上面的方块，名称跟series里的name保持一致
                legend: {
                    orient: 'vertical',
                    x: 'right',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    padding: [10, 50, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                    show: false,
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    // boundaryGap: true 表示x轴两边留白
                    boundaryGap: true,
                    axisTick: {
                        alignWithLabel: true
                    },
                    data: ['特大暴雨', '大暴雨', '暴雨']
                },
                yAxis: {
                    name: "暴雨频次",
                    type: 'value',
                    max: function (e) {
                        return e.max + 10;
                    }
                },
                series: [
                    {
                        name: '暴雨频次',
                        type: 'bar',
                        barGap: '0%',
                        barWidth: 30,
                        data: data,
                        itemStyle: {
                            normal: {
                                label: {
                                    show: true,  //开启显示
                                    formatter: '{c}',  //显示数值
                                    position: 'top',
                                    textStyle: { //数值样式
                                        fontSize: 10
                                    }
                                }
                            }
                        }
                    }
                ]
            };
            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
            myChart.on("click", pieConsole);
            function pieConsole(param) {
                //获取data长度
                var year = param.name;
                loadChangci(year);
            }
        }
        //柱子的点击事件
        function loadChangci(year) {
            var node = tree.getSelectedNode();
            var strTitle = node.NAME;
            var STCD = node.ID;
            var strParam = "STCD@" + STCD;
            var rainLevel = "";
            if (isNaN(year)) {
                strTitle += "1978年至2020年" + year + "频次";
                rainLevel = year;
                strParam += ",TYPE@" + rainLevel;
            } else {
                strTitle += year + "年暴雨频次";
                var stime = year + "-01-01 00:00:00";
                var etime = year + "-12-31 23:59:59";
                strParam += ",STIME@" + stime + ",ETIME@" + etime
            }
            var url = "/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html";
            lookData(strParam, url, strTitle, "50%", 565, "true");
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var node = tree.getSelectedNode();
            var type = $.data(myData, "TYPENAME") != null ? $.data(myData, "TYPENAME") : "";
            var grade = $.data(myData, "GRADE") != null ? $.data(myData, "GRADE") : "暴雨";
            var name = node.NAME + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年" + type + grade+"历时统计"
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
