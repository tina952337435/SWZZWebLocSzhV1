<!DOCTYPE html>

    <style type="text/css">

    <style type="text/css">

            clear: both;
            padding-top: 10px;
            display: none;

        .label {
            font-weight: bold;
            font-size: 14px;
            display: block;
            float: left;

            border-left: 1px solid transparent;
            border-bottom: 1px solid #DDD;
            color: #000;
        }

            .label:hover {
                cursor: pointer;
                text-decoration: underline;
            }

        #tab1:checked ~ div > #content1, #tab2:checked ~ div > #content2, #tab3:checked ~ div > #content3, #tab4:checked ~ div > #content4 {
            display: block;
        }

        .input:checked + label {
            border-top-color: #3291F9;
            border-right-color: #DDD;
            border-left-color: #DDD;
            border-bottom-color: transparent;
            text-decoration: none;
        }

            width: 100%;

            height: 40px;
        }
    </style>

    <!--文本下划线样式-->
    <style>
        .h1, h1 {
            font-size: 25px;
            font-weight: 600;
        }

        .mini-button-text {
            font-size: 14px;
        }

        .YEARCSS .mini-textbox-border, .DZMTITLE .mini-textbox-border, .TOPTITLE .mini-textbox-border {
            border: 0px !important;
            border-bottom: 1px solid #808080 !important;
            border-radius: 0px !important;
        }

        .TITLECSS .mini-textbox-border {
            border: 0px !important;
            border-bottom: 1px solid #808080 !important;
            border-radius: 0px !important;
            height: 40px;
            line-height: 40px;
        }

        .YEARCSS .mini-textbox-input {
            font-size: 18px !important;
            text-align: center;
            /*font-family: "宋体";*/
        }

        .TITLECSS .mini-textbox-input {
            font-size: 18px !important;
            font-weight: bold;
            width: 600px;
            text-align: center;
            font-family: "仿宋";
            height: 40px;
            line-height: 40px;
        }

        .NOTECONTENT {
            margin: 5px 0px !important;
        }

            .NOTECONTENT .mini-textbox-input {
                font-size: 18px !important;
                line-height: 30px;
                font-family: "仿宋";
                /*text-indent: 2em;*/
            }

        .DZMTITLE .mini-textbox-input {
            font-size: 18px !important;
            text-align: center;
            font-family: "仿宋";
        }

        .TOPTITLE .mini-textbox-input {

        }

        .file-preview, .kv-upload-progress {
            display: none;

    </style>
</head>
<body>
    <div id="form1" style="width:100%;height:100%;">
        <!--收缩-->
        <div style="position:absolute;top:10px;right:10px;z-index:9;">
            <i class="fa fa-chevron-right" style="font-size:20px;transform: rotate(270deg);cursor:pointer;z-index: 9;" title="收缩" onclick="openMenu()" id="showMenu"></i>
        </div>
        <div class="mini-toolbar" style="z-index:1 !important;">
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;时间选择：</div>
                <input id="XQKB_STM" name="XQKB_STM" class="mini-datepicker" style="width:110px;" showTime="false" format="yyyy-MM-dd" required="true" />
                <input id="stmlist" name="stmlist" class="mini-combobox" value="8" style="width: 50px; margin-left: 2px;"
                       required="true" />
                —
                <input id="XQKB_ETM" name="XQKB_ETM" class="mini-datepicker" style="width:110px;" showTime="false" format="yyyy-MM-dd" required="true" />
                <input id="etmlist" name="etmlist" class="mini-combobox" value="8" style="width:50px; margin-left: 2px;"
                       required="true" />

                <a class="btn btn-info" onclick="onGetText()" style="width:105px;margin-left:10px;"><i class="fa fa-download"></i>&nbsp;快报分析</a>
                <a class="mini-button" onclick="OnSava()" style="width:105px;margin-left:10px;"><i class="fa fa-file-word-o"></i>&nbsp;生成文件</a>

            </div>
        </div>
        <div style="width:100%;background:#f7f6f6;margin-top: -20px;">
            <div id="PrintA" style="width:1100px;margin:0 auto;background:#fff;padding: 0px 80px;-webkit-box-shadow: 0 2px 6px 2px rgba(0,0,0,.14);
            box-shadow: 0 2px 6px 2px rgba(0,0,0,.14);">
                <div style="height:20px;">&nbsp;</div>
                <h1 style="text-align:center;">
                    水 情 快 报
                </h1>
                <div style="text-align:center;font-size:18px;line-height: 50px;height:50px;">
                    <input id="XQKB_YEAR" name="XQKB_YEAR" class="mini-textbox DivSpan70 YEARCSS" value="2022" style="width:60px;" required="true" />
                    年
                    第
                    <input id="XQKB_QIHAO" name="XQKB_QIHAO" class="mini-textbox DivSpan50 YEARCSS" style="text-align:center;" required="true" />
                    期
                </div>
                <table cellpadding="0" cellspacing="0" border="0" style="width:100%">
                    <tr>
                        <td style="font-size: 18px;border-bottom:1px solid #000;">
                            上海市水文总站
                        </td>
                        <td style="font-size: 18px;text-align: right;border-bottom:1px solid #000;" id="tdTM">
                            <!--2019年5月26日18时-->
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" id="tdDiv">
                            <table cellpadding="0" cellspacing="0" border="0" class="table2">
                                <!--隐藏的行，请勿删除-->
                                <tr style="display:none;">
                                    <td>
                                        <input id="XQKB_ID" name="XQKB_ID" class="mini-textbox Span90" style="display:none;" />
                                        <input id="XQKB_OWEN" name="XQKB_OWEN" class="mini-textbox Span90" style="display:none;" />
                                        <input id="XQKB_FILE" name="XQKB_FILE" class="mini-textbox Span90" style="display:none;" />
                                    </td>
                                </tr>
                                <tr class="table2Tr">
                                    <td style="width:100%;height:110px;line-height:110px;" align="center">
                                        <input id="XQKB_TITLE" name="XQKB_TITLE" class="mini-textbox TITLECSS" style="width:600px;text-align:center;height:40px;" required="true" emptytext="请输入副标题" />
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center">
                                        <textarea id="editorJY" name="editorJY" rows="100" style="width: 100%; height:700px;" class="mini-textarea NOTECONTENT"
                                                  emptytext="请输入水雨情信息"></textarea>
                                    </td>
                                </tr>
                                <!--<tr>
                                    <td>
                                        <textarea id="editorSW" name="editorSW" rows="50" style="width: 100%; height: 250px;" class="mini-textarea NOTECONTENT"
                                                  emptytext="请输入潮（水）位信息"></textarea>
                                    </td>
                                </tr>-->
                            </table>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script>
        mini.parse();
        var form = new mini.Form("form1");
        var ckJY = mini.get("editorJY");
        var XQID = GetQueryString("XQID");
        var PATHNAME = "XQKB";
        var isBindText = false;
        var myData = [];
        $(function () {
            mini.get("XQKB_STM").setValue(formatDate(addDayDate(new Date().format("yyyy-MM-dd"), -1)).format("yyyy-M-dd 08:00:00"));
            mini.get("XQKB_ETM").setValue(new Date().format("yyyy-M-dd 08:00:00"));
            mini.get("XQKB_OWEN").setValue(GetCookie("LOGINNAME"));
            mini.get("XQKB_ID").setValue(GetTableID());
            $("#tdTM").html(new Date().format("yyyy年M月d日H时"));
            mini.get("XQKB_YEAR").setValue(new Date().getFullYear());
            var hourList = [];
            for (var num = 0; num < 24; num++) {
                hourList.push({ id: num, text: num });
            }
            if (XQID != null) {
                //是修改
                mini.get("XQKB_ID").setValue(XQID);
                PageFillData();
            } else {
                var Now = new Date();
                var tm = Now.format("yyyy-01-01") + " 00:00:00";
                var strWhere = { "thecol": "XQKB_QIHAO", "thetable": " swzz_floodtidedata.dbo.XQKB_LIST where XQKB_TM>='" + tm + "' and XQKB_TYPE='水情快报'" };
                GetJosns("TABLEMAXID", strWhere, "TABLEMAXID");
                mini.get("stmlist").setData(hourList);
                mini.get("etmlist").setData(hourList);
            }
            ulLiClick();
        });
        function PageFillData() {
            var strWhere = {
                XQKB_ID: mini.get("XQKB_ID").getValue()
            };
            GetJosns("SWZZ_FLOODTIDEDATA_XQKB_LISTSel", strWhere, "Sel");
        }
        function onGetText() {
            if (isBindText) {
                mini.confirm("确定是否覆盖？", "确定？",
                    function (action) {
                        if (action == "ok") {
                            onLoadText();
                        } else {
                        }
                    }
                );
            } else {
                onLoadText();
            }
            isBindText = true;
        }
        function onLoadText() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '文本生成中，请稍等...'
            });
            var yaosuStr = "";
            $(".selected").each(function (e) {
                var spanName = $(this).find("span").attr("name");
                yaosuStr += spanName + ",";
            });
            if (yaosuStr != "") {
                yaosuStr = yaosuStr.substring(0, yaosuStr.length - 1);
            }
            $.data(myData, "YAOSU", yaosuStr);
            var strWhere = {
                STIME: mini.get("XQKB_STM").getFormValue() + " " + mini.get("stmlist").getValue() + ":00:00",
                ETIME: mini.get("XQKB_ETM").getFormValue() + " " + mini.get("etmlist").getValue() + ":00:00",
                YAOSU: yaosuStr,
                XQKB_ID: mini.get("XQKB_ID").getValue()
            };
            var choseArr = ["choseJY", "choseSW", "choseLL"];
            for (var num = 0; num < choseArr.length; num++) {
                var _length = $("#" + choseArr[num] + " .selected").length;
                //console.error(_length);
                if (_length > 0) {
                    strWhere[choseArr[num]] = true;
                } else {
                    strWhere[choseArr[num]] = false;
                }
            }
            GetJosns("SWZZ_FLOODTIDEDATA_XQKBPrintText_Weixin", strWhere, "printText");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Update" || typeID == "Add") {
                //汛情快报的记录生成之后，生成汛情快报文件
                exportFile();
                if (data.data.length > 0) {
                    XQID = data.data[0].XQKB_ID;
                }
            }
            else if (typeID == "printWord") {
                mini.unmask(document.body);
                if (data.data == "生成文件失败") {
                    mini.alert(data.data);
                    return;
                }
                var fileName = data.data;
                window.open(HttpUrl + "XQKB/" + fileName);
            }
            else if (typeID == "TABLEMAXID") {
                mini.get("XQKB_QIHAO").setValue(data.ID);
            }
            else if (typeID == "printText") {
                TextBind(data.data);
                mini.unmask(document.body);
            }
            else if (typeID == "Sel") {
                if (data.total > 0) {
                    bindForm(data.data);
                }
            }
        }
        function bindForm(data) {
            form.setData(data[0]);
            mini.get("XQKB_STM").setValue(convertToDate(data[0].XQKB_STM));
            mini.get("XQKB_ETM").setValue(convertToDate(data[0].XQKB_ETM));
            mini.get("stmlist").setValue(convertToDate(data[0].XQKB_STM).format("H"));
            mini.get("etmlist").setValue(convertToDate(data[0].XQKB_ETM).format("H"));
            mini.get("XQKB_YEAR").setValue(convertToDate(data[0].XQKB_TM).format("yyyy"));
            ckJY.setValue(data[0].XQKB_YLNOTE);
            ckSW.setValue(data[0].XQKB_SWNOTE);
            var imgUrl = data[0].XQKB_DZMPIC;
            $("#DZMPIC").attr("src", HttpUrl + "/" + PATHNAME + "/" + imgUrl);
        }
        function TextBind(data) {
            ckJY.setValue(data[0].XQKB_YLNOTE);
            //ckSW.setValue(data[0].XQKB_SWNOTE);
        }
        function OnSava() {
            form.validate();
            if (form.isValid() == false) {
                mini.alert("有必填项未填写，请检查！");
                return;
            }
            var year = formatDate(mini.get("XQKB_STM").getFormValue()).format('yyyy');
            var qihao = mini.get("XQKB_QIHAO").getValue();
            var fileName = "水情快报[" + year + qihao + "]_" + mini.get("XQKB_TITLE").getValue() + ".docx";
            mini.get("XQKB_FILE").setValue(fileName);
            var strWhere = form.getData(true, true);
            strWhere.XQKB_TM = new Date().format("yyyy-MM-dd HH:mm:ss");
            strWhere.XQKB_TYPE = "水情快报";
            strWhere.XQKB_STM = mini.get("XQKB_STM").getFormValue() + " " + mini.get("stmlist").getValue() + ":00:00";
            strWhere.XQKB_ETM = mini.get("XQKB_ETM").getFormValue() + " " + mini.get("etmlist").getValue() + ":00:00";
            strWhere.XQKB_YLNOTE = ckJY.getValue();
            strWhere.XQKB_YAOSU = $.data(myData, "YAOSU");
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '文件生成中，请稍等...'
            });
            if (XQID != null) {
                GetJosns("SWZZ_FLOODTIDEDATA_XQKB_LISTUpdate", strWhere, "Update");
            }
            else {
                GetJosns("SWZZ_FLOODTIDEDATA_XQKB_LISTAdd", strWhere, "Add");
            }
        }
        function exportFile() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '文件生成中，请稍等...'
            });
            var fileName = mini.get("XQKB_FILE").getValue().replace(".docx", "");
            var yaosuStr = "";
            $(".selected").each(function (e) {
                var spanName = $(this).find("span").attr("name");
                yaosuStr += spanName + ",";
            });
            if (yaosuStr != "") {
                yaosuStr = yaosuStr.substring(0, yaosuStr.length - 1);
            }
            var strWhere = form.getData(true, true);
            strWhere.fileName = fileName;
            strWhere.STIME = mini.get("XQKB_STM").getFormValue() + " " + mini.get("stmlist").getValue() + ":00:00";
            strWhere.ETIME = mini.get("XQKB_ETM").getFormValue() + " " + mini.get("etmlist").getValue() + ":00:00";
            strWhere.YAOSU = yaosuStr;
            strWhere.XQKB_YLNOTE = ckJY.getValue();
            strWhere.XQKB_TM = new Date().format("yyyy-MM-dd HH:mm:ss");
            strWhere.XQKB_DZM = $.data(myData, "DZMPIC");
            var choseArr = ["choseJY", "choseSW", "choseLL"];
            for (var num = 0; num < choseArr.length; num++) {
                var _length = $("#" + choseArr[num] + " .selected").length;
                if (_length > 0) {
                    strWhere[choseArr[num]] = true;
                } else {
                    strWhere[choseArr[num]] = false;
                }
            }
            GetJosns("SWZZ_FLOODTIDEDATA_XQKBFloodReportTextWord_Weixin", strWhere, "printWord");
        }
        function ulLiClick() {
            $('#choseJY li').click(function () {
                if ($(this).attr("class") == "selected") {
                    $(this).removeClass('selected');
                } else {
                    $(this).addClass('selected');
                }
            });
            $('#choseSW li').click(function () {
                if ($(this).attr("class") == "selected") {
                    $(this).removeClass('selected');
                } else {
                    $(this).addClass('selected');
                }
            });
            $('#choseLL li').click(function () {
                if ($(this).attr("class") == "selected") {
                    $(this).removeClass('selected');
                } else {
                    $(this).addClass('selected');
                }
            });
        }
        function openMenu() {
            var dis = $(".mini-toolbar").css("display");
            var showMenu = $("#showMenu");
            if (dis == "block") {
                $(".mini-toolbar").css("display", "none");
                showMenu.css("transform", " rotate(90deg)");
                showMenu.attr("title", "展开");
            } else {
                $(".mini-toolbar").css("display", "block");
                showMenu.css("transform", " rotate(270deg)");
                showMenu.attr("title", "收缩");
            }
        }
    </script>
</body>
</html>
