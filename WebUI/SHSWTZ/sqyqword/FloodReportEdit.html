        mini.parse();
        var form = new mini.Form("form1");
        var grid = mini.get("grid1");

        var isBindText = false;
        var myData = [];
        $(function () {
            mini.get("XQKB_STM").setValue(formatDate(addDayDate(new Date().format("yyyy-MM-dd"), -1)).format("yyyy-M-dd 08:00:00"));
            mini.get("XQKB_ETM").setValue(new Date().format("yyyy-M-dd 08:00:00"));
            mini.get("XQKB_OWEN").setValue(GetCookie("LOGINNAME"));
            mini.get("XQKB_ID").setValue(GetTableID());
            $("#tdTM").html(new Date().format("yyyy年M月d日H时"));
            mini.get("XQKB_YEAR").setValue(new Date().getFullYear());
            var hourList = [];
            for (var num = 0; num < 24; num++) {
                hourList.push({ id: num, text: num });
            }
            if (XQID != null) {
                //是修改
                mini.get("XQKB_ID").setValue(XQID);
                PageFillData();
            } else {
                var Now = new Date();
                var tm = Now.format("yyyy-01-01") + " 00:00:00";
                var strWhere = { "thecol": "XQKB_QIHAO", "thetable": " swzz_floodtidedata.dbo.XQKB_LIST where XQKB_TM>='" + tm + "' and XQKB_TYPE='水情快报'" };
                GetJosns("TABLEMAXID", strWhere, "TABLEMAXID");
                mini.get("stmlist").setData(hourList);
                mini.get("etmlist").setData(hourList);
            }
            ulLiClick();

            var oFileInput = new FileInput();
            oFileInput.Init("Files", ServerIP + "/json/reply/UOLOADFILE");



        });
        function PageFillData() {
            var strWhere = {
                XQKB_ID: mini.get("XQKB_ID").getValue()
            };
            GetJosns("SWZZ_FLOODTIDEDATA_XQKB_LISTSel", strWhere, "Sel");
        }
        function onGetText() {
            if (isBindText) {
                mini.confirm("确定是否覆盖？", "确定？",
                    function (action) {
                        if (action == "ok") {
                            onLoadText();
                        } else {
                        }
                    }
                );
            } else {
                onLoadText();
            }
            isBindText = true;
        }
        function onLoadText() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '文本生成中，请稍等...'
            });
            var yaosuStr = "";
            $(".selected").each(function (e) {
                var spanName = $(this).find("span").attr("name");
                yaosuStr += spanName + ",";
            });
            if (yaosuStr != "") {
                yaosuStr = yaosuStr.substring(0, yaosuStr.length - 1);
            }
            $.data(myData, "YAOSU", yaosuStr);
            var strWhere = {
                STIME: mini.get("XQKB_STM").getFormValue() + " " + mini.get("stmlist").getValue() + ":00:00",
                ETIME: mini.get("XQKB_ETM").getFormValue() + " " + mini.get("etmlist").getValue() + ":00:00",
                YAOSU: yaosuStr,
                XQKB_ID: mini.get("XQKB_ID").getValue()
            };
            var choseArr = ["choseJY", "choseSW", "choseLL"];
            for (var num = 0; num < choseArr.length; num++) {
                var _length = $("#" + choseArr[num] + " .selected").length;
                //console.error(_length);
                if (_length > 0) {
                    strWhere[choseArr[num]] = true;
                } else {
                    strWhere[choseArr[num]] = false;
                }
            }
            GetJosns("SWZZ_FLOODTIDEDATA_XQKBFloodReportText", strWhere, "printText");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Update" || typeID == "Add") {
                //汛情快报的记录生成之后，生成汛情快报文件
                exportFile();
                if (data.data.length > 0) {
                    XQID = data.data[0].XQKB_ID;
                }
            }
            else if (typeID == "printWord") {
                mini.unmask(document.body);
                if (data.data == "生成文件失败") {
                    mini.alert(data.data);
                    return;
                }
                var fileName = data.data;
                window.open(HttpUrl + "XQKB/" + fileName);
            }
            else if (typeID == "TABLEMAXID") {
                mini.get("XQKB_QIHAO").setValue(data.ID);
            }
            else if (typeID == "printText") {
                TextBind(data.data);
                mini.unmask(document.body);
            }
            else if (typeID == "Sel") {
                if (data.total > 0) {
                    bindForm(data.data);
                }
            }
        }
        function bindForm(data) {
            form.setData(data[0]);
            mini.get("XQKB_STM").setValue(convertToDate(data[0].XQKB_STM));
            mini.get("XQKB_ETM").setValue(convertToDate(data[0].XQKB_ETM));
            mini.get("stmlist").setValue(convertToDate(data[0].XQKB_STM).format("H"));
            mini.get("etmlist").setValue(convertToDate(data[0].XQKB_ETM).format("H"));
            mini.get("XQKB_YEAR").setValue(convertToDate(data[0].XQKB_TM).format("yyyy"));
            ckJY.setValue(data[0].XQKB_YLNOTE);
            ckSW.setValue(data[0].XQKB_SWNOTE);
            var imgUrl = data[0].XQKB_DZMPIC;
            $("#DZMPIC").attr("src", HttpUrl + "/" + PATHNAME + "/" + imgUrl);

        }

                return;
            }
            var year = formatDate(mini.get("XQKB_STM").getFormValue()).format('yyyy');
            var qihao = mini.get("XQKB_QIHAO").getValue();
            var fileName = "水情快报[" + year + qihao + "]_" + mini.get("XQKB_TITLE").getValue() + ".docx";
            mini.get("XQKB_FILE").setValue(fileName);
            var strWhere = form.getData(true, true);
            strWhere.XQKB_TM = new Date().format("yyyy-MM-dd HH:mm:ss");
            strWhere.XQKB_TYPE = "水情快报";
            strWhere.XQKB_STM = mini.get("XQKB_STM").getFormValue() + " " + mini.get("stmlist").getValue() + ":00:00";
            strWhere.XQKB_ETM = mini.get("XQKB_ETM").getFormValue() + " " + mini.get("etmlist").getValue() + ":00:00";
            strWhere.XQKB_YLNOTE = ckJY.getValue();
            strWhere.XQKB_SWNOTE = ckSW.getValue();
            strWhere.XQKB_DZMPIC = $.data(myData, "DZMPIC");
            strWhere.XQKB_YAOSU = $.data(myData, "YAOSU");
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '文件生成中，请稍等...'
            });
            if (XQID != null) {
                GetJosns("SWZZ_FLOODTIDEDATA_XQKB_LISTUpdate", strWhere, "Update");
            }
            else {
                GetJosns("SWZZ_FLOODTIDEDATA_XQKB_LISTAdd", strWhere, "Add");
            }
        }
        function exportFile() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '文件生成中，请稍等...'
            });
            var fileName = mini.get("XQKB_FILE").getValue().replace(".docx", "");
            var yaosuStr = "";
            $(".selected").each(function (e) {
                var spanName = $(this).find("span").attr("name");
                yaosuStr += spanName + ",";
            });
            if (yaosuStr != "") {
                yaosuStr = yaosuStr.substring(0, yaosuStr.length - 1);
            }
            var strWhere = form.getData(true, true);
            strWhere.fileName = fileName;
            strWhere.STIME = mini.get("XQKB_STM").getFormValue() + " " + mini.get("stmlist").getValue() + ":00:00";
            strWhere.ETIME = mini.get("XQKB_ETM").getFormValue() + " " + mini.get("etmlist").getValue() + ":00:00";
            strWhere.YAOSU = yaosuStr;
            strWhere.XQKB_YLNOTE = ckJY.getValue();
            strWhere.XQKB_SWNOTE = ckSW.getValue();
            strWhere.XQKB_TM = new Date().format("yyyy-MM-dd HH:mm:ss");
            strWhere.JYTOP10Data = JSON.stringify(grid.getData());
            strWhere.SWTOP10Data = JSON.stringify(grid2.getData());
            strWhere.XQKB_DZM = $.data(myData, "DZMPIC");
            var choseArr = ["choseJY", "choseSW", "choseLL"];
            for (var num = 0; num < choseArr.length; num++) {
                var _length = $("#" + choseArr[num] + " .selected").length;
                if (_length > 0) {
                    strWhere[choseArr[num]] = true;
                } else {
                    strWhere[choseArr[num]] = false;
                }
            }
            GetJosns("SWZZ_FLOODTIDEDATA_XQKBFloodReportTextWord", strWhere, "printWord");
        }
        function ulLiClick() {

                    $(this).removeClass('selected');

                    $(this).addClass('selected');
                }

            $('#choseSW li').click(function () {
                if ($(this).attr("class") == "selected") {

                }
            });
            $('#choseLL li').click(function () {

                } else {
                    $(this).addClass('selected');
                }
            });

        function openMenu() {
            var dis = $(".mini-toolbar").css("display");
            var showMenu = $("#showMenu");
            if (dis == "block") {
                $(".mini-toolbar").css("display", "none");
                showMenu.css("transform", " rotate(90deg)");
                showMenu.attr("title", "展开");
            } else {
                $(".mini-toolbar").css("display", "block");
                showMenu.css("transform", " rotate(270deg)");
                showMenu.attr("title", "收缩");

    <script src="/Common/bootstrap-fileinput/js/fileinput_locale_zh.js" type="text/javascript" charset="utf-8"></script>
    <script>
        var myData = [];
        var FileInput = function () {
            var oFile = new Object();
            //初始化fileinput控件（第一次初始化）
            oFile.Init = function (ctrlName, uploadUrl) {
                var control = $('#' + ctrlName);

                //初始化上传控件的样式
                control.fileinput({
                    language: 'zh', //设置语言
                    uploadUrl: uploadUrl, //上传的地址
                    allowedFileExtensions: ['jpeg', 'jpg', 'gif', 'png'],//接收的文件后缀
                    showClose: false,
                    showUpload: false, //是否显示上传按钮
                    showRemove: true, //是否显示删除按钮
                    showCaption: false,//是否显示标题
                    showUploadedThumbs: false,
                    browseClass: "btn btn-primary", //按钮样式
                    textEncoding: "UTF-8",
                    dropZoneEnabled: true,//是否显示拖拽区域
                    //minImageWidth: 50, //图片的最小宽度
                    //minImageHeight: 50,//图片的最小高度
                    //maxImageWidth: 1000,//图片的最大宽度
                    //maxImageHeight: 1000,//图片的最大高度
                    maxFileSize: 204800,//单位为kb，如果为0表示不限制文件大小
                    //minFileCount: 0,
                    maxFileCount: 100,
                    enctype: 'multipart/form-data',
                    validateInitialCount: true,
                    previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",
                    msgFilesTooMany: "选择上传的文件数量({n}) 超过允许的最大数值{m}！",
                    uploadExtraData: function (previewId, index) {   //额外参数的关键点
                        var obj = {};
                        obj.PDFTOTIF = false;
                        obj.PATHNAME = PATHNAME;
                        return obj;
                    }
                });

                var FileResult = [];
                //导入文件上传完成之后的事件
                $("#Files").on("fileuploaded", function (event, data, previewId, index) {
                    var strResult = data.response.data;
                    if (strResult == undefined) {
                        //toastr.error('文件格式类型不正确');
                        return;
                    }
                    var imgUrl = strResult[0].HTTPURL;
                    if (strResult[0].PATHNAME != undefined) {
                        imgUrl += strResult[0].PATHNAME;
                    }
                    imgUrl += "/" + strResult[0].FILEPATH;
                    $("#DZMPIC").attr("src", imgUrl);
                    $.data(myData, "DZMPIC", strResult[0].FILEPATH);
                });
                $("#Files").on("filebatchselected", function (event, data, previewId, index) {
                    //alert("fileimageuploaded");
                    console.error(data);
                    $(this).fileinput("upload");
                });
            }
            return oFile;
        };
    </script>
