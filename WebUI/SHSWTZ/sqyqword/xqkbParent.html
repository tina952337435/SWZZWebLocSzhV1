<body>
    <div class="layui-layout">
        <div class="layui-header">
            <ul class="layuimini-header-menu">
                <li class="layui-nav-item layui-this">
                    <a>水情快报</a>
                </li>
                <li class="layui-nav-item">
                    <a>水情简报</a>
                </li>

        <div class="layui-content">
            <iframe id="myIframe" src="FloodReportEdit.html?contType=水情快报" width="100%" height="100%" scrolling="yes" frameborder="0"></iframe>
        </div>
    </div>
    <script>
        $(function () {
            $(".layuimini-header-menu li").click(function () {
                $(".layuimini-header-menu li").removeClass("layui-this");
                $(this).addClass("layui-this");
                var aHtml = $(this).find("a").html();
                var url = "";
                if (aHtml == "水情快报") {
                    url = "FloodReportEdit.html?contType=" + aHtml;
                }
                if (aHtml == "水情简报") {
                    url = "xqkb_preview.html?contType=" + aHtml;
                }
                $("#myIframe").attr("src",url);
            });
        });
    </script>
