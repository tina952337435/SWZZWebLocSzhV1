    var FileInput = function () {

        oFile.Init = function (ctrlName, uploadUrl) {
            var control = $('#' + ctrlName);
            //初始化上传控件的样式
            control.fileinput({
                language: 'zh', //设置语言
                uploadUrl: uploadUrl, //上传的地址
                allowedFileExtensions: ['xlsx', 'xls'], //接收的文件后缀
                showClose: false,
                showUpload: false, //是否显示上传按钮
                showRemove: false, //是否显示删除按钮
                showCaption: false, //是否显示标题
                showUploadedThumbs: false,
                browseClass: "btn btn-primary", //按钮样式
                textEncoding: "UTF-8",
                dropZoneEnabled: true, //是否显示拖拽区域
                //minImageWidth: 50, //图片的最小宽度
                //minImageHeight: 50,//图片的最小高度
                //maxImageWidth: 1000,//图片的最大宽度
                //maxImageHeight: 1000,//图片的最大高度
                maxFileSize: 204800, //单位为kb，如果为0表示不限制文件大小
                //minFileCount: 0,
                maxFileCount: 100,
                enctype: 'multipart/form-data',
                validateInitialCount: true,
                previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",

                msgFilesTooMany: "选择上传的文件数量({n}) 超过允许的最大数值{m}！",
                uploadExtraData: function (previewId, index) { //额外参数的关键点
                    var obj = {};
                    obj.PATHNAME = _PathName;
                    obj.OFILES = ctrlName;
                    obj.PDFTOTIF = true;
                    obj.token = "768ADC6A9E72BFEE4891F1F98650FEEE";
                    return obj;
                }
            }).on('filebatchselected', function (event, data) {
                mini.mask({
                    el: document.body,
                    cls: 'mini-mask-loading',
                    html: '数据加载中...'
                });
                $(this).fileinput("upload");
            });

            var FileResult = [];
            //导入文件上传完成之后的事件
            $("#Fdata").on("fileuploaded", function (event, data, previewId, index) {
                var strJson = data.response.data;

                var JSONDATA = strJson[0].JSONDATA
                mini.get("Sheet").setData(JSONDATA);
                mini.get("Sheet").select(0);

                $.data(myData, "FILEData", strJson[0]);

                var item = eval(strJson[0].JSONDATA[0]["SheetData"]);
                //console.error(strJson[0]);
                $.data(myData, "SheetData", item);
                GetColumnData();
                mini.unmask(document.body);
            });
        }
        return oFile;
    };

    function GetColumnData() {
        var createGrid = STGRDColumn();
        grid.set({
            columns: createGrid
        });

        var columnName = [],
            columnValue = [];
        var tmFiled = 0;
        
        //if (_PathName == "DRP") {
        tmFiled = 4;
        if (_PathName == "AREA") {
            tmFiled = 3;
        }
        var strJson = $.data(myData, "SheetData");
        if (strJson.length > 0) {
            for (num = 0; num < strJson.length; num++) {
                var tm = strJson[num][tmFiled]; //时间
                var tmFlag = new Date(tm);
                if (tmFlag != "Invalid Date") {
                    columnValue.push(strJson[num]);
                } else {
                    columnName.push(strJson[num]);
                }
            }
        }
        var _columnFiled=getColumnFiled();
        $.data(myData, "COLUMNFILED", _columnFiled);
        console.error(columnValue);
        grid.setData(columnValue);
        //}
    }

            }));
