<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }
        #areaDiv ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 5px;
        }

        .searchContext {
            height: 40px;
            line-height: 40px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }

        .mini-grid-summaryCell {
            line-height: 35px;
            text-align: center;
            color: blue;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            <div class="searchContext">
                <div style="height:25px;line-height:50px;">&nbsp; &nbsp;区域选择： </div>
                <div id="areaDiv" style="margin-left: 92px;margin-top: -25px;float:left;">
                </div>
                &nbsp;&nbsp;<a class="mini-button" onclick="Exp()" id="expButton" style="margin-top: -45px;display:none;">导出报表</a>
            </div>


        </div>
    </div>
    <div id="grid1" class="mini-datagrid"
         style="width: 100%;height:height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);"
         allowalternating="true" borderstyle="border-right:0;" idfield="SID" sortmode="client" sizelist="[15,20,30,50]"
         pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         showSummaryRow="true" ondrawsummarycell="onDrawSummaryCell"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" headeralign="center" align="center" width="5%">序号</div>
            <div field="STNM" headeralign="center" align="center" width="10%">
                站名
            </div>
            <div field="SFLAG" headeralign="center" align="center" width="5%">
                雨量
            </div>
            <div field="YFLAG" headeralign="center" align="center" width="5%">
                水位
            </div>
            <div field="AFLAG" headeralign="center" align="center" width="5%">
                潮位
            </div>
            <div field="STLC" headeralign="center" align="left" width="15%">
                测站位置
            </div>
            <div field="HNNM" headeralign="center" align="center" width="5%">
                分中心
            </div>
            <div field="BSNM" headeralign="center" align="center" width="5%">
                水利片
            </div>
            <!--<div name="action" headeralign="center" align="center" width="5%">
        基本操作
    </div>-->
        </div>
    </div>

    <script>
        mini.parse();
        var grid = mini.get("grid1");
        var myData = [];
        $(function () {
            $("#expButton").hide();            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {                $("#expButton").show();            }
            loadArea();
            search();
        });
        function loadArea() {
            var dataResult = [
                { AREANAME: "宝山" },
                { AREANAME: "崇明" },
                { AREANAME: "奉贤" },
                { AREANAME: "嘉定" },
                { AREANAME: "金山" },
                { AREANAME: "闵行" },
                { AREANAME: "浦东" },
                { AREANAME: "青浦" },
                { AREANAME: "松江" },
                { AREANAME: "松浦" },
                { AREANAME: "苏州河" },
                { AREANAME: "吴淞" }
            ];
            var data = { data: dataResult }
            JosnSel(data, "ASel");
        }
        function search() {
            var strWhere = {};
            strWhere["HNNM"] = $.data(myData, "HNNM");
            GetJosns("SWZZ_FLOODTIDEDATA_ST_STATIONNETWORK_BSel", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var dataResult = data.data.filter(function (e) {
                    return e.SFLAG != "AREA";
                });
                grid.setData(dataResult);
            }
            else if (typeID == "ASel") {
                $.data(myData, "AreaData", data.data);
                var dataResult = data.data;
                var strHtml = '<ul class="ui-choose choose-type-right" id="choseArea">';
                strHtml += '<li class="selected"><span id="areaAll">全部</span></li>';
                $.data(myData, "HNNM", "");
                dataResult.forEach(function (item, index) {
                    strHtml += '<li><span  id="' + item.AREANAME + '">' + item.AREANAME + '</span></li>';
                });
                strHtml += '</ul>';
                $("#areaDiv").html(strHtml);
                $('#choseArea li').click(function () {
                    var f = this;
                    $('#choseArea li').each(function (index, item) {
                        this.className = this == f ? 'selected' : '';
                    });
                    var stcd = $(this).find("span").attr("id").replace("areaAll", "");
                    $.data(myData, "HNNM", stcd);
                    search();
                });
            }
        }

        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "SFLAG" || field == "YFLAG" || field == "AFLAG") {
                if (value != undefined && value != "" && value != null) {
                    e.cellHtml = '<img src="/Common/miniui/themes/icons/ok.png"/>';
                }
            }
        }

        function onDrawSummaryCell(e) {
            var result = e.result;
            var field = e.field;
            var grid = e.sender;
            var data = grid.getData();
            //服务端汇总计算
            if (field == "STNM") {
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:blue;'>站点数量：" + data.length + "个</div>";
                s += "</span>";
                e.cellHtml = s;
            }
            if (field == "SFLAG") {
                var dataResult = data.filter(function (e) {
                    return e.SFLAG == "YL";
                });
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:blue;'>雨量站：" + dataResult.length + "个</div>";
                s += "</span>";
                e.cellHtml = s;
            }
            if (field == "YFLAG") {
                var dataResult = data.filter(function (e) {
                    return e.YFLAG == "SW";
                });
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:blue;'>水位站：" + dataResult.length + "个</div>";
                s += "</span>";
                e.cellHtml = s;
            }
            if (field == "AFLAG") {
                var dataResult = data.filter(function (e) {
                    return e.AFLAG == "CW";
                });
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:blue;'>潮位站：" + dataResult.length + "个</div>";
                s += "</span>";
                e.cellHtml = s;
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = "站点列表";
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
