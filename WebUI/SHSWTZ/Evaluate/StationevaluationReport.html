    <script>
        mini.parse();

        $(function () {
            PathName = "SW";

                    this.className = this == f ? 'selected' : '';
                });

                PathName = id;
                if (id == "AREA") {
                    $("#SWYLINDEX").hide();
                    $("#AREAINDEX").show();
                } else {
                    $("#SWYLINDEX").show();
                    $("#AREAINDEX").hide();
                }
                search();
            });
        });
        function search() {
            var strWhere = {};
            strWhere["PATHNAME"] = PathName;
            GetJosns("Stationnetworkevaluation", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                $.data(myData, "Alldata", data.data);
                loadHtml();
            }
        }
        //平均分统计
        function loadHtml() {
            var data = $.data(myData, "Alldata");
            var _length = data.length;
            var shScore = 0,shBili=0;
            var dataResult = groupBy(data, "HNNM");
            var dataX = [], dataY = [], dataM = [];
            var dataYBili = [], dataYNum = [], totalCost = [];
            var YBiliData=[], YNumData = [], AvgData = [];
            for (var num = 0; num < dataResult.length; num++) {
                dataM.push(100);
                dataX.push(dataResult[num][0].HNNM);
                totalCost.push(dataResult[num].length);
                var totalScore = 0;
                var YBili = 0;
                for (var _index = 0; _index < dataResult[num].length; _index++) {
                    var item = dataResult[num][_index];
                    var score = item.SCORE;
                    totalScore += score;
                    shScore += score;
                    if (score > 80) {
                        YBili++;
                        shBili++;
                    }
                }
                dataYNum.push(YBili);
                var avgScore = (totalScore / dataResult[num].length).toFixed(0);
                dataY.push(Number(avgScore));
                var bili = Number(((YBili / dataResult[num].length) * 100).toFixed(0));
                dataYBili.push(bili);

                YBiliData.push({ HNNM: dataResult[num][0].HNNM, BILI: bili });
                YNumData.push({ HNNM: dataResult[num][0].HNNM, YNUM: YBili });
                AvgData.push({ HNNM: dataResult[num][0].HNNM, AVG: Number(avgScore) });
            }
            if (PathName == "AREA") {
                chartBar('chartArea', dataX, dataY);
            } else {
                var totalBili = Number(((shBili / _length) * 100).toFixed(0));
                chartBarPie("chartPieBili", dataX, dataYBili, dataM, totalBili);
                chartBarNum("chartPieNum", dataX, dataYNum, totalCost);
                dataX.push("上海市");
                var avgSHScore = Number((shScore / _length).toFixed(0));
                dataY.push(Number(avgSHScore));
                chartBar('chartPie', dataX, dataY);
                AvgData.push({ HNNM: "上海市", AVG: Number(avgSHScore) });
            }
            $.data(myData, "biliData", YBiliData);
            $.data(myData, "ynumData", YNumData);
            $.data(myData, "avgData", AvgData);
        }

        //导出报表
        function ExpIndexAvg(filename, type) {
            var columns = [], data=[];
            if (type == "avg") {
                columns = [{ field: "HNNM", header: "区域名称" }, { field: "AVG", header: "站点平均分" }];
                data = $.data(myData, "avgData");
            } else if (type == "bili") {
                columns = [{ field: "HNNM", header: "区域名称" }, { field: "BILI", header: "合格率" }];
                data = $.data(myData, "biliData");
            } else if (type == "ynum") {
                columns = [{ field: "HNNM", header: "区域名称" }, { field: "YNUM", header: "站点合格个数" }];
                data = $.data(myData, "ynumData");
            }
            ExportExcel(filename, columns,data);
        }
