    <script>
        mini.parse();
        var grid = mini.get("grid1");
        var dataResult = {};
        var myData = [];
        var PathName = GetQueryString("PATHNAME");
        $(function () {
            PathName = PathName == null ? "SW" : PathName;
            $.data(myData, "HNNM", "宝山");
            var createGrid = STGRDColumn();
            grid.set({
                columns: createGrid
            });
            loadArea();
            search();

            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var id = $(this).find("span").attr("id");
                PathName = id;
                var createGrid = STGRDColumn();
                grid.set({
                    columns: createGrid
                });
                search();
            });

            $('#chosePG li').click(function () {
                var f = this;
                $('#chosePG li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                loadHtml();
            });
        });
        function loadHtml() {
            var data = $.data(myData, "Alldata");
            var name = $("#chosePG .selected").find("span").attr("name");
            if (name == "自定义") {
                OnClickTitle();
                return;
            } else if (name == "全部") {
                data = $.data(myData, "Alldata");
            }
            else {
                if (name.indexOf('-') > -1) {
                    var min = name.split('-')[0];
                    var max = name.split('-')[1];
                    data = data.filter(function (e) {
                        return e.SCORE >= min && e.SCORE < max;
                    });
                }
            }
            grid.setData(data);
        }
        function onActionRenderer(res) {
            var grid = res.sender;
            var record = res.record;
            var uid = record._uid;
            var rowIndex = res.rowIndex;
            var s = '<img style="cursor:pointer;" onclick="lookData(\'PATHNAME@' + PathName + ',STCD@' + record.STCD + '\',\'/SHSWTZ/Evaluate/StationevaluationView.html\',\'站点指标\',\'50%\',485,\'true\')" src="/Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
            return s;
        }
        //新增
        function newAddData() {
            WindowsOpen("/SHSWTZ/Evaluate/StationevaluationView.html?PATHNAME=" + PathName + "&STCD=" + STCD, "批量站点评价", "90%@80%");
        }
        function del(objID) {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        var strWhere = { "SID": objID };
                        GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETDATADel", strWhere, "Del");
                    }
                });
        }
        function search() {
            var strWhere = {};
            strWhere["HNNM"] = $.data(myData, "HNNM");
            //strWhere["PATHNAME"] = PathName;
            var name = $("#choseMNLX .selected").find("span").html();
            name = PathName == "SW" ? "水位" : "雨量";
            strWhere["STTP"] = name.replace("站", "");
            var method = "SN_TARGETCONFIGSCOREGRID";//SN_TARGETCONFIGSCOREAreaGRID
            if (name == "区域") {
                method = "SN_TARGETCONFIGSCOREAreaGRID";
            }
            method = "SN_TARGETCONFIGSCOREGRIDTwo";
            GetJosns(method, strWhere, "Sel");
        }

        function loadArea() {
            var dataResult = [
                { AREANAME: "宝山" },
                { AREANAME: "崇明" },
                { AREANAME: "奉贤" },
                { AREANAME: "嘉定" },
                { AREANAME: "金山" },
                { AREANAME: "闵行" },
                { AREANAME: "浦东" },
                { AREANAME: "青浦" },
                { AREANAME: "松江" },
                { AREANAME: "松浦" },
                { AREANAME: "苏州河" },
                { AREANAME: "吴淞" }
            ];
            var data = { data: dataResult }
            JosnSel(data, "ASel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "Alldata", dataResult);
                loadHtml();
                //grid.setData(data.data);
            }
            else if (typeID == "ASel") {
                $.data(myData, "AreaData", data.data);
                var dataResult = data.data;
                var strHtml = '<ul class="ui-choose choose-type-right" id="choseArea">';
                //strHtml += '<li><span id="areaAll">全部</span></li>';
                dataResult.forEach(function (item, index) {
                    if (index == 0) {
                        $.data(myData, "HNNM", item.AREANAME );
                        strHtml += '<li class="selected"><span  id="' + item.AREANAME + '">' + item.AREANAME + '</span></li>';
                    }
                    else {
                        strHtml += '<li><span  id="' + item.AREANAME + '">' + item.AREANAME + '</span></li>';
                    }
                });
                strHtml += '</ul>';
                strHtml += '&nbsp;&nbsp;<a class="mini-button" onclick="ExpIndex()" id="expButton" style="margin-top: 10px;display:none;">导出报表</a>';
                $("#areaDiv").html(strHtml);
                $('#choseArea li').click(function () {
                    var f = this;
                    $('#choseArea li').each(function (index, item) {
                        this.className = this == f ? 'selected' : '';
                    });
                    var stcd = $(this).find("span").attr("id").replace("areaAll", "");
                    $.data(myData, "HNNM", stcd);
                    search();
                });
                $("#expButton").hide();                if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {                    $("#expButton").show();                }
            } else if (typeID == "Del") {
                search();
            }
            else if (typeID == "SCOREExcel") {
                window.open(ClientIP + "UploadDoc/" + data.data);
            }
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex,
                pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });

        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
        }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var field = e.field;
            var grid = e.sender;
            var data = grid.getData();
            //服务端汇总计算
            if (field == "STNM") {
                var s = "<span style='color:Brown;'>";
                //s += "<div class='classColor' style='color:blue;'>最高分</div>";
                //s += "<div class='classColor' style='color:blue;'>最低分</div>";
                s += "<div class='classColor' style='color:blue;'>二级指标平均分</div>";

                //var name = $("#choseMNLX .selected").find("span").html();
                //if (name!= "区域") {
                //    s += "<div class='classColor' style='color:blue;'>总站数</div>";
                //}
                s += "</span>";
                e.cellHtml = s;
            }
            if ("STNM,rownumber,STCD,HNNM".indexOf(field)==-1) {
                var MaxZ = 0, MinZ = 100000, avgZ = 0, totalZ = 0;
                for (var num = 0; num < data.length; num++) {
                    var ybz = data[num][field];
                    if (ybz > MaxZ) {
                        MaxZ = ybz;
                    }
                    if (ybz < MinZ) {
                        MinZ = ybz;
                    }
                    totalZ += Number(ybz);
                }
                if (data.length > 0) {
                    avgZ = (totalZ / data.length).toFixed(0);
                }
                if (MinZ == 100000) {
                    MinZ = 0;
                }
                var s = "<span style='color:Brown;'>";
                //s += "<div class='classColor' style='color:blue;'>" + MaxZ + "</div>";
                //s += "<div class='classColor' style='color:blue;'>" + MinZ + "</div>";
                s += "<div class='classColor' style='color:blue;'>" + avgZ + "</div>";
                //var name = $("#choseMNLX .selected").find("span").html();
                //if (name != "区域") {
                //    s += "<div class='classColor' style='color:blue;'>" + data.length + "</div>";
                //}
                s += "</span>";
                e.cellHtml = s;
            }
        }
        function OnClickTitle() {
            var isDisplay = $("#sysList").css("display");
            if (isDisplay == "none") {
                $("#sysList").css("display", "block");
            } else {
                $("#sysList").css("display", "none");
            }
        }
        function XunOK() {
            $("#sysList").css("display", "none");
            var data = $.data(myData, "Alldata");
            var minValue = mini.get("comboStart").getValue();
            var maxValue = mini.get("comboEnd").getValue();
            if (minValue != "" && maxValue != "") {
                data = data.filter(function (e) {
                    return e.SCORE >= minValue && e.SCORE <=maxValue;
                });
            } else if (minValue != "" && maxValue == "") {
                data = data.filter(function (e) {
                    return e.SCORE < minValue;
                });
            }
            else if (minValue == "" && maxValue != "") {
                data = data.filter(function (e) {
                    return e.SCORE > maxValue;
                });
            }
            grid.setData(data);
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var hnnm = $.data(myData, "HNNM");
            if (hnnm == undefined || hnnm == null || hnnm == "") {
                hnnm = "上海市";
            }
            var name = hnnm + "站点评估";
            ExportExcel(name, columns, data);
        }

            var name = PathName == "SW" ? "水位" : "雨量";
            var strWhere = {};
            strWhere["HNNM"] = $.data(myData, "HNNM");
            strWhere["STTP"] = name.replace("站", "");
            strWhere["LISTMODE"] = JSON.stringify(grid.getData());
            var method = "SN_TARGETCONFIGSCOREExcelNew";
            if (name == "区域") {
                method = "SN_TARGETCONFIGSCOREExcelArea";

            GetJosns(method, strWhere, "SCOREExcel");
        }
