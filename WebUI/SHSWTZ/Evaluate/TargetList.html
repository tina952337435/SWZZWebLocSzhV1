<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100mm以上暴雨查询</title>
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <script src="/Common/Scripts/DownLoad.js" type="text/javascript"></script>

    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
        }

        #areaList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 5px;
        }

        .searchContext {
            height: 40px;
            line-height: 40px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }
    </style>
</head>

<body>
    <div style="width:100%;">
        <div class="mini-toolbar">
            <div class="searchContext">
                <!--&nbsp; &nbsp;
                开始日期： &nbsp;<input id="STIME" class="mini-datepicker" style="width:115px;"
                    format="yyyy-MM-dd" />&nbsp;&nbsp;
                结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:115px;"
                    format="yyyy-MM-dd" />&nbsp;&nbsp;-->
                <!-- 评价指标：
                <input id="combo1" class="mini-combobox" style="width:150px;" textField="text" valueField="id"
                    emptyText="请选择..." value="" allowInput="true" showNullItem="true" nullItemText="请选择..." /> -->
                <!--<a class="mini-button" onclick="search()">查询</a>-->
                &nbsp;&nbsp;
                <!--<button type="button" class="btn btn-success" onclick="newAddData()">新增</button>-->
                <button type="button" class="btn btn-info" onclick="OpenTab()">批量导入</button>
                <button type="button" class="btn btn-danger" id="uploadExcel" onclick="showAtEl()">模板下载</button>

            </div>
            <div class="searchContext" style="display: none;">
                <div class="searchTitle">&nbsp; &nbsp;分值规则：</div>
                <ul class="ui-choose choose-type-right" id="choseMNLX">
                    <li class="selected">
                        <span>全部</span>
                    </li>
                    <li>
                        <span>行政分区</span>
                    </li>
                    <li>
                        <span>水利片区</span>
                    </li>
                </ul>
            </div>
            <div id="areaList" style="display:none;">
                <div style="height:25px;line-height:50px;">&nbsp; &nbsp;区域选择： </div>
                <div id="areaDiv" style="margin-left: 92px;margin-top: -25px;">

                </div>
            </div>
            <div id="zhanList" style="display: none;">
                <div class="searchTitle" style="line-height:55px;">&nbsp; &nbsp;站点选择： </div>
                <div style="margin-left:92px;" id="zhanDiv">
                </div>
            </div>
        </div>
    </div>

    <div id="grid1" class="mini-datagrid"
         style="width: 100%;height:height: -webkit-calc(100% - 95px);height: -moz-calc(100% - 95px);height: calc(100% - 95px);"
         allowalternating="true" borderstyle="border-right:0;" idfield="SID" sortmode="client" sizelist="[15,20,30,50]"
         pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell">
        <div property="columns">
            <div type="indexcolumn" headeralign="center" align="center">序号</div>
            <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" -->
            <div field="FILENAME" headeralign="center" align="center" allowsort="true">
                所属区域
            </div>
            <div field="OWEN" headeralign="center" align="center" allowsort="true">
                上报人员
            </div>
            <div field="TIME" headeralign="center" align="center" format="yyyy-MM-dd" allowsort="true" renderer="onTMRenderer">
                上报时间
            </div>
            <div field="FILEPATH" headeralign="center" align="center" allowsort="true">
                上报文件
            </div>
            <div name="action" width="50" headeralign="center" align="center" renderer="onActionRenderer" cellstyle="padding:0;">
                基本操作
            </div>
        </div>
    </div>

    <div id="win1" class="mini-window" title="导出区域指标模板" style="width:400px;height:250px;"
         showMaxButton="false" showCollapseButton="false" showShadow="false"
         showToolbar="false" showFooter="false" showModal="false" allowResize="false" allowDrag="false">
        <div class="searchTitle">&nbsp;&nbsp;&nbsp;区域选择：</div>
        <input id="AREANAME" name="AREANAME" class="mini-combobox" style="width:150px;float:left;" textfield="AREANAME"
               valuefield="AREANAME" allowinput="true" multiSelect="false" onvaluechanged="onSTCDChanged" />
        <a class="mini-button" onclick="ExpData()" style="float:none;position: absolute;top: 45px;left: 98px;">确认下载</a>
    </div>

    <script>
        mini.parse();
        var grid = mini.get("grid1");
        var dataResult = {};
        var myData = [];
        var PathName = GetQueryString("PATHNAME");
        $(function () {
            var tm = new Date();
            // 显示当日的日期为开始日期
            //mini.get("STIME").setValue(addDayDate(tm.format("yyyy-MM-dd"), -365));
            // mini.get("STIME").setValue("1978-01-01");
            // 显示当日的日期为结束日期
            //mini.get("ETIME").setValue(tm.format("yyyy-MM-dd"));

            loadArea();
            search();

            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var ATYPE = $(this).find("span").html();
                $.data(myData, "ATYPE", ATYPE);

            });
        });

        function showAtEl() {
            var win = mini.get("win1");
            var xAlign = "outright";
            var yAlign = "top";
            var atEl = document.getElementById("uploadExcel");
            win.showAtEl(atEl, {
                xAlign: xAlign,
                yAlign: yAlign
            });
        }
        function onActionRenderer(res) {
            var grid = res.sender;
            var record = res.record;
            var uid = record._uid;
            var rowIndex = res.rowIndex;
            var s = '<img style="cursor:pointer;" onclick="lookData(\'ID@' + record.SID + '\',\'/SHSWTZ/Evaluate/TargetView.html\',\'查看站网评价\',\'90%\',\'80%\',\'true\')" src="/Common/miniui/themes/icons/look.gif" title="查看"/>&nbsp;'
            s += '<img style="cursor:pointer;" onclick="del(\'' + record.SID + '\')" src="/Common/miniui/themes/icons/remove.png" title="删除会商纪要" />&nbsp;';
            return s;
        }
        function del(objID) {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        grid.loading("执行删除中，请稍后......");
                        var strWhere = { "SID": objID };
                        GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETDATADel", strWhere, "Del");
                    }
                });
        }
        function onTMRenderer(e) {
            var value = e.value;
            if (value) {
                return mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
            }
            else {
                return "";
            }
        }
        function search() {
            var strWhere = {};
            strWhere["FILENAME"] = $.data(myData, "HNNM");
            strWhere["PATHNAME"] = PathName;
            GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETDATASel", strWhere, "Sel");
        }

        function loadArea() {
            var strWhere = {};
            strWhere["ATYPE"] = "行政分区";
            //GetJosns("SWZZ_FLOODTIDEDATA_ST_AREA_BSel", strWhere, "ASel");
            var dataResult = [
                { AREANAME: "宝山" },
                { AREANAME: "崇明" },
                { AREANAME: "奉贤" },
                { AREANAME: "嘉定" },
                { AREANAME: "金山" },
                { AREANAME: "闵行" },
                { AREANAME: "浦东" },
                { AREANAME: "青浦" },
                { AREANAME: "松江" },
                { AREANAME: "松浦" },
                { AREANAME: "苏州河" },
                { AREANAME: "吴淞" }
            ];
            mini.get("AREANAME").setData(dataResult);
            mini.get("AREANAME").select(0);
            $.data(myData, "HNNM", mini.get("AREANAME").getValue());
            var data = { data: dataResult }
            JosnSel(data, "ASel");
        }
        function onSTCDChanged(e) {
            $.data(myData, "HNNM", mini.get("AREANAME").getValue());
        }
        //下载模板
        function ExpData() {
            var _hnnm = $.data(myData, "HNNM");
            var strWhere = {};
            if (PathName == "SW") {
                strWhere["STTP"] = "水位";
            } else if (PathName == "DRP") {
                strWhere["STTP"] = "雨量";
            } else if (PathName == "AREA") {
                strWhere["STTP"] = "区域";
            }
            //strWhere["HNNM"] = _hnnm;
            strWhere["HNNM"] = mini.get("AREANAME").getValue();
            if (PathName == "AREA") {
                GetJosns("SN_TARGETCONFIGExcelArea", strWhere,
                    "SN_TARGETCONFIGExcel");
            } else {
                GetJosns("SN_TARGETCONFIGExcel", strWhere,
                    "SN_TARGETCONFIGExcel");
            }
        }

        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                grid.setData(data.data);
            } else if (typeID == "SSel") {
                $.data(myData, "StationData", data.data);
                //loadAreaStationHtml();
            } else if (typeID == "ASel") {
                $.data(myData, "AreaData", data.data);

                var dataResult = data.data;
                var strHtml = '<ul class="ui-choose choose-type-right" id="choseArea">';
                strHtml += '<li class="selected"><span id="areaAll">全部</span></li>';
                $.data(myData, "HNNM", "");
                dataResult.forEach(function (item, index) {
                    strHtml += '<li><span  id="' + item.AREANAME + '">' + item.AREANAME + '</span></li>';
                });
                strHtml += '</ul>';
                $("#areaDiv").html(strHtml);
                $('#choseArea li').click(function () {
                    var f = this;
                    $('#choseArea li').each(function (index, item) {
                        this.className = this == f ? 'selected' : '';
                    });
                    var stcd = $(this).find("span").attr("id").replace("areaAll", "");
                    $.data(myData, "HNNM", stcd);
                    search();
                });
            } else if (typeID == "BSel") {
                $.data(myData, "AreaStationData", data.data);
            } else if (typeID == "SWZZ_FLOODTIDEDATA_ST_STATIONNETWORK_BSel") {
                $.data(myData, "SWZZ_FLOODTIDEDATA_ST_STATIONNETWORK_BSel", data.data);
                GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGSel", {
                    "PATHNAME": PathName
                }, "SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGSel");
            } else if (typeID == "SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGSel") {
                var strWhere = {};
                strWhere["STATION"] = JSON.stringify($.data(myData, "SWZZ_FLOODTIDEDATA_ST_STATIONNETWORK_BSel"));
                strWhere["TARGETCONFIG"] = JSON.stringify(data.data);
                GetJosns("SN_TARGETCONFIGExcel", strWhere, "SN_TARGETCONFIGExcel");
            } else if (typeID == "SN_TARGETCONFIGExcel") {
                window.open(HttpUrl + data.data);
            } else if (typeID == "SN_TARGETCONFIGExcel") {
                console.warn(data)
            } else if (typeID == "Del") {
                search();
            }
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex,
                pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });

        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "FILEPATH") {
                var s = "";
                if (value != "") {
                    s = "<span onclick=\"download('" + HttpUrl + record.PATHNAME + "/" + record.FILEPATH + "','" + record.FILEPATH + "')\" style=\"cursor:pointer;\" title=\"点击下载此文件\">" + GetImage(value) + "</span>";
                    var wdFile = record.FILEPATH;
                    if (wdFile != null && wdFile != undefined) {
                        wdFile = wdFile.substring(0, wdFile.lastIndexOf('.')) + ".pdf";
                        var strHref = HttpUrl + record.PATHNAME + "/" + wdFile;

                        $.ajax({
                            url: strHref,
                            type: 'HEAD',
                            async: false,      //取消ajax的异步实现
                            success: function () {
                                // 文件存在
                                console.log("111")
                                s += "&nbsp;&nbsp;&nbsp;"
                                s += "<span onclick=\"JavaScript:window.parent.open('" + strHref + "')\" style=\"cursor:pointer;\" title=\"点击在线打开此文件\">" + GetImage(wdFile) + "</span>";
                            },
                            error: function () {
                                // 文件不存在
                            }
                        });
                    }
                }
                e.cellHtml = s;
            }
        }

        function OnClickTitle(objID, objPathName) { //选择类型
            var only = $("#onlytab .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            // $.data(myData, "HOUR", objPathName);
            $('#dataLoad').show();
            // BreakLayerLoad();
        }

        function OpenTab() {
            var title = "站点";
            if (PathName == "AREA") {
                title = "区域";
            }
            //批量导入
            WindowsOpen("/SHSWTZ/Evaluate/TargetImport.html?PATHNAME=" + PathName + "&HNNM=" + $.data(myData, "HNNM"), "批量导入" + title + "指标", "90%@80%");
        }
        //新增
        function newAddData() {
            var title = "站点";
            if (PathName == "AREA") {
                title = "区域";
            }
            WindowsOpen("/SHSWTZ/Evaluate/TargetEdit.html?PATHNAME=" + PathName, "批量导入" + title + "指标", "90%@80%");
        }



    </script>
</body>
</html>
