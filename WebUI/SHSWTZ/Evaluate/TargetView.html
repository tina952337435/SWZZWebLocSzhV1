    function JosnSel(text, typeID) {
        if (typeID == "Sel") {
            if (text.total > 0) {
                var PATHNAME = text.data[0].PATHNAME;
                var FILEPATH = text.data[0].FILEPATH;
                _PathName = PATHNAME;
                GetJosns("GETEXCELFILE", { PATHNAME: PATHNAME, FILENAME: FILEPATH }, "SelFile");
            }

        } else if (typeID == "Sava") {
            if (text.total > 0) {
                mini.alert("站网评价数据上报成功");
            }
        }
        else if (typeID == "SelFile") {
            console.error(text);

            var item = eval(text.data[0].JSONDATA[0]["SheetData"]);
            //console.error(strJson[0]);
            $.data(myData, "SheetData", item);
            GetColumnData();
        }
        mini.unmask(document.body);
    }

        var columnName = [],

        }

            for (num = 0; num < strJson.length; num++) {
                var tm = strJson[num][tmFiled]; //时间

                if (tmFlag != "Invalid Date") {
                    columnValue.push(strJson[num]);
                } else {
                    columnName.push(strJson[num]);
                }
            }
        }
        var _columnFiled = getColumnFiled();
        $.data(myData, "COLUMNFILED", _columnFiled);
        grid.setData(columnValue);

    Array.prototype.MapApply = function (field, format) {
        var val = null;
        if (format == "max") {
            val = Math.max.apply(Math, this.map(function (o) {
                return o[field]
            }));
        } else if (format == "min") {
            val = Math.min.apply(Math, this.map(function (o) {
                return o[field]
            }));
        }
        return val;
    }
