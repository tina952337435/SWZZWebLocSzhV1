<body>
    <div style="height: -webkit-calc(100%);height: -moz-calc(100%);height: calc(100%);background: #ededed;">
        <div style="height:calc(100%);padding:0px 10px;box-sizing: border-box;-webkit-box-sizing: border-box;width:calc(50%);float:left;background:white;">
            <div class="layout_title px-2">

                <div class="d2"></div>
                <p class="base-p" id="title1">全市水位综合评估成果表</p>
            </div>
            <div id="grid1" class="mini-datagrid"
                 style="width: 100%;height:height: -webkit-calc(100% - 55px);height: -moz-calc(100% - 55px);height: calc(100% - 55px);"
                 allowalternating="true" borderstyle="border-right:0;" idfield="SID" sortmode="client" sizelist="[15,20,30,50]"
                 pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
                 showSummaryRow="false"
                 ondrawcell="ondrawcell">
                <div property="columns">
                    <div field="QX_ID" width="100" headerstyle="height:30px" headeralign="center" align="center">
                        一级指标
                    </div>
                    <div field="QX_ID" width="100" headerstyle="height:30px" headeralign="center" align="center">
                        基础设施
                    </div>
                    <div field="QX_ID" width="100" headerstyle="height:30px" headeralign="center" align="center">
                        测站运维
                    </div>
                    <div field="QX_ID" width="100" headerstyle="height:30px" headeralign="center" align="center">
                        数据管理
                    </div>
                    <div field="QX_ID" width="100" headerstyle="height:30px" headeralign="center" align="center">
                        信息服务
                    </div>
                    <div field="QX_ID" width="100" headerstyle="height:30px" headeralign="center" align="center">
                        站网管理
                    </div>
                    <div field="QX_ID" width="100" headerstyle="height:30px" headeralign="center" align="center">
                        综合评价
                    </div>
                </div>
            </div>
        </div>
        <div style="height:calc(100%);padding:0px 10px;box-sizing: border-box;-webkit-box-sizing: border-box;width:calc(50% - 10px);float:left;background:white;margin-left:10px;">
            <div class="layout_title px-2">
                <div data-v-62547c07="" class="d1">
                </div>
                <div class="d2"></div>
                <p class="base-p" id="title2">全市水位综合评估成果图</p>
            </div>
            <div id="fxq_charts" style="height:calc(100% - 50px);width:100%;margin:0px 0%;"></div>
        </div>
    </div>

    <script>
        
        mini.parse();
        var grid = mini.get("grid1");
        var dataResult = {};
        var myData = [];
        var PathName = GetQueryString("PATHNAME");
        var PathType = "";
        $(function () {
            PathName = PathName == null ? "SW" : PathName;
            PathType = PathName == "YL" ? "雨量" : "水位";
            var createGridOne = STGRDColumnOne();
            grid.set({
                columns: createGridOne
            });
            search();
        });
        function STGRDColumnOne() {
            var createGrid = [];
            if (PathName == "SW") {
                createGrid = [
                    { field: "HNNM", headerAlign: "center", align: "center", header: "所属行政", width: "100" },
                    { field: "2021111711263334261", headerAlign: "center", align: "center", header: "基础设施", width: "60" },
                    { field: "2021111713461576305", headerAlign: "center", align: "center", header: "测站运维", width: "60" },
                    { field: "2021111711453673519", headerAlign: "center", align: "center", header: "数据管理", width: "60" },
                    { field: "2021111711563627630", headerAlign: "center", align: "center", header: "信息服务", width: "60" },
                    { field: "20221108162649900", headerAlign: "center", align: "center", header: "站网管理", width: "60" },
                    { field: "ZONGHE", headerAlign: "center", align: "center", header: "综合评价", width: "60" }
                ];
            }
            else if (PathName == "YL") {
                createGrid = [
                    { field: "HNNM", headerAlign: "center", align: "center", header: "所属行政", width: "100" },
                    { field: "2021111611163325837", headerAlign: "center", align: "center", header: "基础设施", width: "60" },
                    { field: "2021111611311897597", headerAlign: "center", align: "center", header: "测站运维", width: "60" },
                    { field: "2021111611304970842", headerAlign: "center", align: "center", header: "数据管理", width: "60" },
                    { field: "2021111611310375830", headerAlign: "center", align: "center", header: "信息服务", width: "60" },
                    { field: "2022110817132964006", headerAlign: "center", align: "center", header: "站网管理", width: "60" },
                    { field: "ZONGHE", headerAlign: "center", align: "center", header: "综合评价", width: "60" }
                ];
            }
            return createGrid;
        }
        function loadHtml() {
            var data = $.data(myData, "Alldata");
            var name = $("#chosePG .selected").find("span").attr("name");
            if (name == "自定义") {
                OnClickTitle();
                return;
            } else if (name == "全部") {
                data = $.data(myData, "Alldata");
            }
            else {
                if (name.indexOf('-') > -1) {
                    var min = name.split('-')[0];
                    var max = name.split('-')[1];
                    data = data.filter(function (e) {
                        return e.SCORE >= min && e.SCORE < max;
                    });
                }
            }
            grid.setData(data);
        }
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中，请稍等...'
            });
            $("#title1").html("全市" + PathType+"综合评估成果表");
            $("#title2").html("全市" + PathType +"综合评估成果图");
            var strWhere = {};
            var name = PathName == "SW" ? "水位" : "雨量";
            strWhere["STTP"] = name.replace("站", "");
            method = "SN_TARGETCONFIGSCOREGRIDONEZONGHEArea";
            GetJosns(method, strWhere, "SelOne");
        }
        function JosnSel(data, typeID) {
            if (typeID == "SCOREExcel") {
                window.open(ClientIP + "UploadDoc/" + data.data);
            }
            else if (typeID == "SelOne") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "AllONEdata", dataResult);
                grid.setData(dataResult);
                loadBarHtml();
                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
        }
        function loadBarHtml() {
            var data = $.data(myData, "AllONEdata");
            var dataResult = []
            if (data != null) {
                for (var num = 0; num < data.length; num++) {
                    if (data[num]["HNNM"] != "全市") {
                        dataResult.push(data[num]["ZONGHE"]);
                    }
                }
            }
            barChart("fxq_charts", dataResult);
        }
        function barChart(ChartName, data) {
            var myChart = echarts.init(document.getElementById(ChartName)); //获得控件对象
            var className = ['宝山', '崇明', '奉贤', '嘉定', '金山', '闵行', '浦东', '青浦', '松江', '松浦', '苏州河','吴淞'];
            var colorList = ['#39B3FF', '#47E0E0', '#7891D9', '#83D978', '#C7A530', '#FF8439'];
            option = {
                legend: {
                    show: false,
                    data: ['平均分'],
                    icon: 'circle',
                    bottom: 10,
                    textStyle: {
                        color: '#ffffff'
                    }
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '5%',
                    top: '5%',
                    containLabel: true
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    },
                    formatter: function (params) {
                        return params[0].name + '<br/>' +
                            "<span style='display:inline-block;margin-right:5px;border-radius:10px;width:9px;height:9px;background-color:rgba(36,207,233,0.9)'></span>" +
                            // params[0].seriesName + ' : ' + Number((params[0].value.toFixed(4) / 10000).toFixed(2)).toLocaleString() + ' <br/>'
                            params[0].seriesName + ' : ' + params[0].value
                    }
                },
                //backgroundColor: 'rgb(20,28,52)',
                xAxis: {
                    type: 'value',
                    axisLine: {
                        show: true
                    },
                    splitLine: {
                        show: false
                    },
                    max: 100,
                    min: function (e) {
                        var shiNum = parseInt(e.min / 10) % 10;
                        return shiNum * 10-20;
                    }
                },
                yAxis: [{
                    type: 'category',
                    inverse: true,
                    axisLabel: {
                        show: true,
                        textStyle: {
                            color: '#000'
                        },
                    },
                    splitLine: {
                        show: false
                    },
                    axisTick: {
                        show: true
                    },
                    axisLine: {
                        show: true
                    },
                    data: className
                }, {
                    type: 'category',
                    inverse: true,
                    axisTick: 'none',
                    axisLine: 'none',
                    show: true,
                    axisLabel: {
                        textStyle: {
                            color: '#000',
                            fontSize: '12'
                        },
                        formatter: function (value) {
                            return value;
                        },
                    },
                    data: data
                }],
                series: [{
                    name: '平均分',
                    type: 'bar',
                    zlevel: 1,
                    itemStyle: {
                        normal: {
                            barBorderRadius: 0,
                            color: (params) => {
                                return colorList[0]
                            },
                            barBorderRadius: [0,50,50,0],
                        },
                    },
                    barWidth: 15,
                    data: data
                }
                ]
            };
            myChart.setOption(option);
        }
    </script>
</body>
