<script type="text/javascript">
var _PathName = GetQueryString("PATHNAME");
var FileInput = function () {
    var oFile = new Object();

    //初始化fileinput控件（第一次初始化）
    oFile.Init = function (ctrlName, uploadUrl) {
        var control = $('#' + ctrlName);
        //初始化上传控件的样式
        control.fileinput({
            language: 'zh', //设置语言
            uploadUrl: uploadUrl, //上传的地址
            allowedFileExtensions: ['xlsx', 'xls'], //接收的文件后缀
            showClose: false,
            showUpload: false, //是否显示上传按钮
            showRemove: false, //是否显示删除按钮
            showCaption: false, //是否显示标题
            showUploadedThumbs: false,
            browseClass: "btn btn-primary", //按钮样式
            textEncoding: "UTF-8",
            dropZoneEnabled: true, //是否显示拖拽区域
            //minImageWidth: 50, //图片的最小宽度
            //minImageHeight: 50,//图片的最小高度
            //maxImageWidth: 1000,//图片的最大宽度
            //maxImageHeight: 1000,//图片的最大高度
            maxFileSize: 204800, //单位为kb，如果为0表示不限制文件大小
            //minFileCount: 0,
            maxFileCount: 100,
            enctype: 'multipart/form-data',
            validateInitialCount: true,
            previewFileIcon: "<i class='glyphicon glyphicon-king'></i>",

            msgFilesTooMany: "选择上传的文件数量({n}) 超过允许的最大数值{m}！",
            uploadExtraData: function (previewId, index) { //额外参数的关键点
                var obj = {};
                obj.PATHNAME = _PathName;
                obj.OFILES = ctrlName;
                obj.PDFTOTIF = true;
                obj.token = "768ADC6A9E72BFEE4891F1F98650FEEE";
                return obj;
            }
        }).on('filebatchselected', function (event, data) {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据上报中...'
            });
            $(this).fileinput("upload");
        });

        var FileResult = [];
        //导入文件上传完成之后的事件
        $("#Fdata").on("fileuploaded", function (event, data, previewId, index) {
            var strJson = data.response.data;
            $.data(myData, "FILEData", strJson[0]);

            var item = eval(strJson[0].JSONDATA[0]["SheetData"]);
            console.error(strJson[0]);
            $.data(myData, "SheetData", item);
            GetColumnData();
            mini.unmask(document.body);
        });
    }
    return oFile;
};

function GetColumnData() {
    var columnName = [],
        columnValue = [];
    var tmFiled = 0;
    var createGrid = [];
    if (PATHNAME == "DRP") {
        tmFiled = 4;
        var strJson = $.data(myData, "SheetData");
        if (strJson.length > 0) {
            for (num = 0; num < strJson.length; num++) {
                var tm = strJson[num][tmFiled]; //时间   
                var tmFlag = new Date(tm);
                if (tmFlag != "Invalid Date") {
                    columnValue.push(strJson[num]);
                } else {
                    columnName.push(strJson[num]);
                }
            }
        }

        var _AllColumnName = [];
        if (columnName.length > 0) {
            var item = columnName[0];
            var FuData = columnName[1];
            var oldName = "";
            var tempAgg = [];
            var _columnFiled = [];
            var _columnFiledSTCD = [];
            for (var key in item) {
                if (item[key] == FuData[key]) {
                    var strWhere = {
                        "field": key,
                        headerAlign: "center",
                        align: "center",
                        allowSort: true,
                        header: item[key]
                    };
                    if (key != "TABLETYPE") {
                        _columnFiledSTCD.push({"field":key,"fieldName":item[key]});
                        createGrid.push(strWhere);
                    }
                } else {
                    var strWhere = {
                        "field": key,
                        headerAlign: "center",
                        align: "center",
                        allowSort: true,
                        header: FuData[key]
                    };
                    _columnFiled.push({
                        "field": key,
                        "fieldName": FuData[key]
                    });
                    tempAgg.push(strWhere);
                    if (item[key] == oldName) {
                        if (item[(Number(key) + 1)] != oldName) {
                            var _strWhere = {
                                headerAlign: "center",
                                align: "center",
                                allowSort: true,
                                header: oldName,
                                columns: tempAgg
                            };
                            createGrid.push(_strWhere);
                            tempAgg = [];
                        }
                    }
                }
                oldName = item[key];
            }

        }
        $.data(myData, "COLUMNFILED", _columnFiled);
        $.data(myData, "COLUMNFILEDSTCD", _columnFiledSTCD);
        console.error(_columnFiled)
        grid.set({
            columns: createGrid
        });
        grid.setData(columnValue);
        console.error(createGrid)
        // columnName.push({
        //     "val": "ID",
        //     "field": "ID",
        //     "txt": "编号"
        // });
        // columnName.push({
        //     "val": "SPT",
        //     "field": "SPT",
        //     "txt": "时间"
        // });


    }
}
</script>

Array.prototype.MapApply = function (field, format) {
    var val = null;
    if (format == "max") {
        val = Math.max.apply(Math, this.map(function (o) {
            return o[field]
        }));
    } else if (format == "min") {
        val = Math.min.apply(Math, this.map(function (o) {
            return o[field]
        }));
    }
    return val;
}

function saveExcel() {
    var strJson = grid.getData();
    if (strJson.length > 0) {
        mini.mask({
            el: document.body,
            cls: 'mini-mask-loading',
            html: '加载中...'
        });
        setTimeout(function () {
            var result = [];
            var columnFiled = $.data(myData, "COLUMNFILED");
            //  var columnFiledSTCD = $.data(myData, "COLUMNFILEDSTCD");
            if (strJson.length > 0) {
                for (num = 0; num < strJson.length; num++) {
                    if(columnFiled.length>0){
                        for(numII=0;numII<columnFiled.length;numII++){
                            var strWhere={};
                             strWhere["HNNM"]=strJson[num][1];
                             strWhere["STCD"]=strJson[num][2];
                             strWhere["STNM"]=strJson[num][3];
                             strWhere["TM"]=strJson[num][4];
                             strWhere["OWEN"]=GetCookie("LOGINNAME");
                            //  console.error(columnFiled[num])
                             strWhere["FIELD"]=columnFiled[numII]["fieldName"];
                             strWhere["FIELDVAL"]=strJson[num][columnFiled[numII]["field"]];
                            result.push(strWhere);
                        }
                    }

                }
            }
            console.error(result);
            var targetData={};
            targetData["SID"]=UUID(19,16);
            var filePath=$.data(myData, "FILEData");

            // targetData["FILENAME"]=
            targetData["PATHNAME"]=filePath.PATHNAME;
            targetData["OWEN"]=GetCookie("LOGINNAME");
            // targetData["FILESIZE"]=
            targetData["TIME"]=new Date().format("yyyy-MM-dd HH:mm:ss");
            targetData["FILEPATH"]=filePath.FILEPATH;
            var strWhere = {};
            strWhere["LISTMODE"] = JSON.stringify(result);
            strWhere["PATHNAME"] = PATHNAME;
            strWhere["SN_TARGETDATA"] = JSON.stringify(targetData);
            strWhere["UPDATE"] = false;
            GetJosns("TARGETIMPORTPL", strWhere, "Sava");
        }, 100);
    } else {
        if (mini.get("URL").getValue() == "") {
            showTips("请先上站网评价文件");
        } else {
            showTips("无数据");
        }
    }
}
