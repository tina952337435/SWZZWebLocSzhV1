<!DOCTYPE HTML
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>系统菜单管理</title>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style type="text/css">
        html,
        body {
            width: 100%;
            height: 100%;
            border: 0;
            margin: 0;
            overflow: hidden;
        }
        .searchTitle {
            width: 65px;
            float: left;
            line-height: 35px;
            text-align: right;
        }
    </style>
</head>

<body class="contentbody">
    <div style="width:100%;">
        <div class="mini-toolbar" style=" margin-bottom:1px;">
            <table style="width:100%;">
                <tr>
                    <td style="width:320px;">
                        <div class="searchTitle">类型：</div>
                        <ul class="ui-choose choose-type-right" id="choseMNLX" style="padding-top:5px;">
                            <li class="selected">
                                <span id="SW">水位站</span>
                            </li>
                            <li>
                                <span id="DRP">雨量站</span>
                            </li>
                            <!--<li>
                                <span id="AREA">区域</span>
                            </li>-->
                        </ul>
                    </td>
                    <td style="width:calc(100% - 320px);">
                        关键字：
                        <input id="key" class="mini-textbox" emptytext="请输入关键字" style="height:25px;width:200px;"
                               onenter="onKeyEnter" /> &nbsp;
                        <a id="searchbtn" class="mini-button" onclick="search()">查询</a>
                        <a id="delbtn" class="mini-button" onclick="remove()">删除</a>
                    </td>
                    <td style="white-space:nowrap;width: 60px;">
                       
                        <!--<span class="separator"></span>-->
                    </td>
                </tr>
                <tr>
                    <td colspan="2">
                        <span id="typeSpan">水位权重</span>：
                        <input id="weightValue" class="mini-textbox" emptytext="请输入权重系数" style="height:25px;width:100px;margin-left: -3px;" onvaluechanged="onvaluechanged"/> 
                    </td>
                </tr>
            </table>
        </div>
    </div>
    <!--allowAlternating="true"隔行换色，showVGridLines =false竖线 showHGridLines横线  headerStyle头样式 cellStyle=列样式 -->
    <div class="mini-fit"
        style="margin-top:1px;height: -webkit-calc(100% - 60px);height: -moz-calc(100% - 60px);height: calc(100% - 60px);">
        <div id="treegrid1" class="mini-treegrid" style="width:100%;height: calc(100% - 100px);;background-color:#FFF;"
            showtreeicon="true" treecolumn="taskname" idfield="TCD" parentfield="TPID" resultastree="false"
            allowresize="true" expandonload="true" allowresize="true" showvgridlines="false" ondrawcell="ondrawcell">
            <div property="columns">
                <!--<div type="indexcolumn" width="5%" headerstyle="height:30px" cellstyle="height:25px" headeralign="center" allowsort="true"></div>-->
                <div name="taskname" field="TNAME" width="30%" 
                      headeralign="center" allowsort="true">指标名称</div>
                <div field="SCORE" width="15%" headerstyle="height:30px;" 
                     headeralign="center" align="center" allowsort="true">分值</div>

                <div field="WEIGHT" width="15%" headerstyle="height:30px;" 
                     headeralign="center" align="center" allowsort="true">权重</div>

                <div field="NT" width="20%" headerstyle="height:30px;" 
                     headeralign="center" align="center" allowsort="true">说明</div>
                <div field="ORDERBYID" width="10%" headeralign="center" align="center" allowsort="true">序号</div>
            </div>
        </div>
        <fieldset style="width:99.9%;border:solid 1px #aaa;position:relative;background-color:#FFF">
            <legend>指标编辑</legend>
            <div id="editForm1" style="padding:5px; ">
                <div class="mini-toolbar">
                    <table style="width:100%">
                        <tr>
                            <td align="left">
                                <input id="TCD" name="TCD" class="mini-Hidden" />
                                <input type="checkbox" onchange="OnQx_ID()" id="CBQX_ID" title="" />是否一级指标
                            </td>
                            <td align="right">指标名称：</td>
                            <td align="left">
                                <input id="TNAME" name="TNAME" class="mini-textbox Span90"
                                       required="true" />
                            </td>
                            <td align="right">分值：</td>
                            <td align="left">
                                <input id="SCORE" name="SCORE" class="mini-textbox Span90" />
                            </td>

                            <td align="right">权重：</td>
                            <td align="left">
                                <input id="WEIGHT" name="WEIGHT" class="mini-textbox Span90" />
                            </td>

                            <td align="right">说明：</td>
                            <td align="left" style="width:25%">
                                <input id="NT" name="NT" class="mini-textbox Span90" />
                            </td>

                            <td align="right">排序：</td>
                            <td align="left">
                                <input id="ORDERBYID" name="ORDERBYID" class="mini-textbox Span90" />
                            </td>
                            <td align="right">
                                <a class="mini-button" onclick="saveData()" id="savebtn">修改</a>
                                <a class="mini-button" onclick="addData()" id="addbtn">添加</a>
                            </td>
                        </tr>
                    </table>
                </div>
            </div>
        </fieldset>
    </div>
    <script language="javascript" type="text/javascript">
        var myData = [];
        var PATHNAME = GetQueryString("PATHNAME");
        //删除
        function remove() {
            mini.confirm("确定删除记录？", "确定？",
                function (action) {
                    if (action == "ok") {
                        var value = grid.getValue();
                        if (value == "") {
                            mini.alert("请选择删除行！");
                            return;
                        }
                        grid.loading("执行删除中，请稍后......");
                        GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGDel", {
                            "TCD": value
                        }, "Del");
                    }
                }
            );
        }

        function OnQx_ID() {
            if (GetObj("CBQX_ID").checked == true) {
                GetObj("CBQX_ID").alt = mini.get("TCD").getValue();
                mini.get("TCD").setValue("-1");
            } else {
                GetObj("CBQX_ID").title = "-1";
                mini.get("TCD").setValue(GetObj("CBQX_ID").alt);
            }
        }
        //查询
        function search() {
            var key = mini.get("key").getValue();
            var strWhere = {
                key: key,
                "PATHNAME": PATHNAME
            }
            GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGSel", strWhere, "Sel");
        }
        function searchType() {
            var type = PATHNAME == "SW" ? "水位" : "雨量";
            $("#typeSpan").html(type + "权重");
            var strWhere = {
                "TPID": -2,
                "TNAME": type
            }
            GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGSel", strWhere, "SelType");
        }
        function onvaluechanged(e) {
            if (!isNaN(e.value)) {
                var value = e.value;
                var type = PATHNAME == "SW" ? "水位" : "雨量";
                mini.confirm("确定修改" + type+"权重系数？", "确定？",
                    function (action) {
                        if (action == "ok") {
                            var tcd = $.data(myData, "TCD");
                            var strWhere = {
                                "TCD": tcd,
                                "WEIGHT": mini.get("weightValue").getValue()
                            }
                            GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGUpdate", strWhere, "Update");
                        }
                    }
                );
            }
            else {
                ShowMsg("请输入数字！");
            }
        }
    </script>
    <script language="javascript" type="text/javascript">
        mini.parse();
        //绑定表单
        var form = new mini.Form("editForm1");
        var grid = mini.get("treegrid1");
        var db = new mini.DataBinding();
        db.bindForm("editForm1", grid);
        $(function () {
            searchType();
            search();

            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var id = $(this).find("span").attr("id");
                PATHNAME = id;
                searchType();
                search();
            });
        })


        function JosnSel(resultdata, typeID) {
            if (typeID == "Sel") {
                var tree = mini.get("treegrid1");
                tree.loadList(resultdata.data, "TCD", "TPID")
            }
            else if (typeID == "SAVE") {
                alert(resultdata.Message)
                if (resultdata.total > 0) {
                    search();
                    GetObj("CBQX_ID").checked == false;
                }
            }
            else if (typeID == "Del") {
                alert(resultdata.Message)
                if (resultdata.total > 0) {
                    search();
                }
            }
            else if (typeID == "SelType") {
                if (resultdata.total > 0) {
                    mini.get("weightValue").setValue(resultdata.data[0].WEIGHT);
                    $.data(myData, "TCD", resultdata.data[0].TCD);
                }
            }
            else if (typeID == "Update") {
                ShowMsg(resultdata.Message);
                searchType();
            }
        }

        function saveData() {
            var data = grid.getChanges();
            var json = mini.encode(data);
            if (json == "[]") {
                mini.alert("未对数据进行修改！");
                return;
            }
            grid.loading("保存中，请稍后......");
            var strWhere = {
                "TCD": mini.get("TCD").getValue(),
                "TNAME": mini.get("TNAME").getValue(),
                "NT": mini.get("NT").getValue(),
                "TM": new Date().format("yyyy-MM-dd HH:mm:ss"),
                "OWEN": GetCookie("LOGINNAME"),
                "SCORE": mini.get("SCORE").getValue(),
                "ORDERBYID": mini.get("ORDERBYID").getValue(),
                "WEIGHT": mini.get("WEIGHT").getValue(),
            };
            GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGUpdate", strWhere, "SAVE");
        }

        function addData() {
            form.validate();
            if (form.isValid() == false)
                return;
            grid.loading("保存中，请稍后......");
            var strID = GetTableID();
            var PARENT_ID = mini.get("TCD").getValue();
            console.error(PARENT_ID)
            if (PARENT_ID != "-1") {
                var data = grid.getChanges();
                PARENT_ID = data[0].TCD;
            }
            var strWhere = {
                "TCD": strID,
                "TPID": PARENT_ID,
                "TNAME": mini.get("TNAME").getValue(),
                "NT": mini.get("NT").getValue(),
                "TM": new Date().format("yyyy-MM-dd HH:mm:ss"),
                "OWEN": GetCookie("LOGINNAME"),
                "SCORE": mini.get("SCORE").getValue(),
                "ORDERBYID": mini.get("ORDERBYID").getValue(),
                "PATHNAME": PATHNAME,
                "WEIGHT": mini.get("WEIGHT").getValue(),
            };
            GetJosns("SWZZ_FLOODTIDEDATA_SN_TARGETCONFIGAdd", strWhere, "SAVE");
        }

        //鼠标移动上去的提示信息。
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            //超链接任务

        }
    </script>
    </div>
</body>

</html>
