            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var id = $(this).find("span").attr("id");
                PathName = id;
                var createGrid = STGRDColumn();
                grid.set({
                    columns: createGrid
                });
                search();
            });

            $('#chosePG li').click(function () {
                var f = this;
                $('#chosePG li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                loadHtml();
            });
        });
        function loadHtml() {
            var data = $.data(myData, "Alldata");
            var name = $("#chosePG .selected").find("span").attr("name");
            if (name == "自定义") {
                OnClickTitle();
                return;
            } else if (name == "全部") {
                data = $.data(myData, "Alldata");
            }
            else {
                if (name.indexOf('-') > -1) {
                    var min = name.split('-')[0];
                    var max = name.split('-')[1];
                    data = data.filter(function (e) {
                        return e.SCORE >= min && e.SCORE < max;
                    });
                }
            }
            grid.setData(data);
        }
        function search() {
            $("#title3").html($.data(myData, "HNNM") + PathType+ "单项指标评估");
            $("#title1").html($.data(myData, "HNNM") + PathType + "综合评估成果");
            $("#title2").html($.data(myData, "HNNM") + PathType + "一级指标综合评估成果图");
            var strWhere = {};
            strWhere["HNNM"] = $.data(myData, "HNNM");
            //strWhere["PATHNAME"] = PathName;
            var name = PathName == "SW" ? "水位" : "雨量";
            strWhere["STTP"] = name.replace("站", "");
            var method = "SN_TARGETCONFIGSCOREGRIDTWOZONGHE";//SN_TARGETCONFIGSCOREAreaGRID
            if (name == "区域") {
                method = "SN_TARGETCONFIGSCOREAreaGRID";
            }
            GetJosns(method, strWhere, "Sel");

            method = "SN_TARGETCONFIGSCOREGRIDONEZONGHE";
            GetJosns(method, strWhere, "SelOne");
        }

        function loadArea() {
            var dataResult = [
                { AREANAME: "宝山" },
                { AREANAME: "崇明" },
                { AREANAME: "奉贤" },
                { AREANAME: "嘉定" },

                { AREANAME: "松浦" },

                { AREANAME: "吴淞" }
            ];
            var data = { data: dataResult }
            JosnSel(data, "ASel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "Alldata", dataResult);
                loadHtml();
                //grid.setData(data.data);
            }
            else if (typeID == "ASel") {
                $.data(myData, "AreaData", data.data);
                var dataResult = data.data;
                var strHtml = '<ul class="ui-choose choose-type-right" id="choseArea">';
                //strHtml += '<li><span id="areaAll">全部</span></li>';
                dataResult.forEach(function (item, index) {
                    if (index == 0) {
                        $.data(myData, "HNNM", item.AREANAME);
                        strHtml += '<li class="selected"><span  id="' + item.AREANAME + '">' + item.AREANAME + '</span></li>';
                    }
                    else {
                        strHtml += '<li><span  id="' + item.AREANAME + '">' + item.AREANAME + '</span></li>';
                    }
                });
                strHtml += '</ul>';
                //strHtml += '&nbsp;&nbsp;<a class="mini-button" onclick="ExpIndex()" style="margin-top: 10px;">导出报表</a>';
                $("#areaDiv").html(strHtml);
                $('#choseArea li').click(function () {
                    var f = this;
                    $('#choseArea li').each(function (index, item) {
                        this.className = this == f ? 'selected' : '';
                    });
                    var stcd = $(this).find("span").attr("id").replace("areaAll", "");
                    $.data(myData, "HNNM", stcd);
                    search();
                });
            }
            else if (typeID == "SCOREExcel") {
                window.open(ClientIP + "UploadDoc/" + data.data);
            }
            else if (typeID == "SelOne") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "AllONEdata", dataResult);
                grid2.setData(dataResult);
                loadBarHtml();
            }
        }

        function OnClickTitle() {
            var isDisplay = $("#sysList").css("display");
            if (isDisplay == "none") {
                $("#sysList").css("display", "block");
            } else {
                $("#sysList").css("display", "none");
            }

        function XunOK() {
            $("#sysList").css("display", "none");
            var data = $.data(myData, "Alldata");
            var minValue = mini.get("comboStart").getValue();
            var maxValue = mini.get("comboEnd").getValue();
            if (minValue != "" && maxValue != "") {
                data = data.filter(function (e) {
                    return e.SCORE >= minValue && e.SCORE <= maxValue;
                });
            } else if (minValue != "" && maxValue == "") {
                data = data.filter(function (e) {
                    return e.SCORE < minValue;
                });
            }
            else if (minValue == "" && maxValue != "") {
                data = data.filter(function (e) {
                    return e.SCORE > maxValue;
                });
            }
            grid.setData(data);
        }

            var name = hnnm + "站点评估";
            ExportExcel(name, columns, data);

        function barChart(ChartName,data) {
            var myChart = echarts.init(document.getElementById(ChartName)); //获得控件对象
            //var data = [50, 60, 70, 20, 30, 10];
            var className = ['基础设施', '测站运维', '数据管理', '信息报送', '站网管理'];
            var colorList = ['#39B3FF', '#47E0E0', '#7891D9', '#83D978', '#C7A530', '#FF8439'];
            option = {
                legend: {
                    show:false,
                    data: ['平均分'],
                    icon: 'circle',
                    bottom: 10,
                    textStyle: {
                        color: '#ffffff'
                    }
                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '5%',
                    top: '10%',
                    containLabel: true
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    },
                    formatter: function (params) {
                        return params[0].name + '<br/>' +
                            "<span style='display:inline-block;margin-right:5px;border-radius:10px;width:9px;height:9px;background-color:rgba(36,207,233,0.9)'></span>" +
                            // params[0].seriesName + ' : ' + Number((params[0].value.toFixed(4) / 10000).toFixed(2)).toLocaleString() + ' <br/>'
                            params[0].seriesName + ' : ' + params[0].value
                    }
                },
                //backgroundColor: 'rgb(20,28,52)',
                xAxis: {
                    type: 'value',
                    axisLine: {
                        show: true
                    },
                    splitLine: {
                        show: false
                    },
                    max: 100,
                    min: function (e) {
                        var shiNum = parseInt(e.min / 10) % 10;
                        return shiNum*10;
                    }
                },
                yAxis: [{
                    type: 'category',
                    inverse: true,
                    axisLabel: {
                        show: true,
                        textStyle: {
                            color: '#000'
                        },
                    },
                    splitLine: {
                        show: false
                    },
                    axisTick: {
                        show: true
                    },
                    axisLine: {
                        show: true
                    },
                    data: className
                }, {
                    type: 'category',
                    inverse: true,
                    axisTick: 'none',
                    axisLine: 'none',
                    show: true,
                    axisLabel: {
                        textStyle: {
                            color: '#000',
                            fontSize: '12'
                        },
                        formatter: function (value) {
                            return value;
                        },
                    },
                    data: data
                }],
                series: [{
                    name: '平均分',
                    type: 'bar',
                    zlevel: 1,
                    itemStyle: {
                        normal: {
                            barBorderRadius: 0,
                            color: (params) => {
                                return colorList[params.dataIndex]
                            },
                            barBorderRadius: [0, 50, 50, 0],
                        },
                    },
                    barWidth: 15,
                    data: data
                }
                ]
            };
            myChart.setOption(option);
        }
