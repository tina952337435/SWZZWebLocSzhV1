
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title></title>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <script src="/Common/Scripts/poulic_charts.js" type="text/javascript"></script>

    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 12px;
        }

        .classColor {
            font-size: 14px;
            text-align: center;
            line-height: 30px;
        }

        .mini-grid-rows-view {
            overflow: auto;
        }
    </style>
</head>
<body class="contentbody">
    <div showcollapsebutton="true" style="width: 100%; height: 100%;">
        <div style="width:200px;float:left;height:100%;background:white;">
            <ul id="tree1" class="mini-tree" style="width:100%;height: -webkit-calc(100% - 0px);height: -moz-calc(100% - 0px);height: calc(100% - 0px);padding:5px;"
                showTreeIcon="true" textField="STNM" expandOnLoad="0" allowDrag="true" allowDrop="true" allowLeafDropIn="true"
                idField="STCD" parentField="PID" resultAsTree="false" onnodecheck="onSelectNode" allowSelect="true" showCheckBox="true" autoCheckParent="true"></ul>
        </div>
        <div style="width:calc(100% - 200px);float:left;height:100%;background:white;">
            <div class="mini-toolbar" style="padding-top: 5px;">
                <table style="width: 100%;">
                    <tr>
                        <td style="width: 100%;">
                            <span style="float:left;">
                                <!--站点：--><input id="STCD" name="STCD" class="mini-combobox" style="width: 120px;display:none;"
                                                 textfield="STNM" valuefield="STCD" showNullItem="false" emptytext="请选择..." />
                                &nbsp;&nbsp;
                                开始时间：<input id="stime" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:mm" showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                                结束时间：<input id="etime" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:mm" showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                                台风名称：&nbsp;
                                <input id="TFNAME" name="TFNAME" class="mini-combobox" style="width:150px;"
                                       textField="TFNAME" valueField="STATUS" allowInput="true"
                                       onvaluechanged="onvaluechangedTF" />
                            </span>
                            <span id="rbl" class="mini-radiobuttonlist" repeatItems="1" repeatLayout="table" repeatDirection="vertical" style="float:left;"
                                  textField="text" valueField="id" value="DAY" data="[{'id':'HOUR','text':'小时'},{'id':'DAY','text':'日'}]"></span>
                            <span style="float:left;">
                                <input type="hidden" id="HidType" />
                                <a id="searchbtn" class="mini-button" onclick="search()">统计</a>
                                <a id="expButton" class="mini-button" onclick="Exp()" style="display:none;">导出</a>
                            </span>
                            <span id="divMX" style="    padding: 10px;line-height: 30px;color: red;font-size: 14px;display:none;">

                            </span>

                        </td>

                    </tr>
                </table>
            </div><!--showFilterRow="true" summaryPosition="top"-->
            <div class="mini-fit" style="margin-top:1px;height: -webkit-calc(100% - 38px);height: -moz-calc(100% - 38px);height: calc(100% - 38px);">
                <div style="width:100%;height:300px; " id="Chart">

                </div>
                <div id="grid1" class="mini-datagrid" style="width:100%;height: -webkit-calc(100% - 300px);height: -moz-calc(100% - 300px);height: calc(100% - 300px);" allowAlternating="true" showEmptyText="无数据"
                     showSummaryRow="true" allowResize="true" ondrawsummarycell="onDrawSummaryCell" showpager="false"
                     borderStyle="border-right:0;" idField="STCD" sortMode="client" sizeList="[15,20,30,50,100,200]" pageSize="50" ondrawcell="ondrawcell">
                    <div property="columns">
                    </div>
                </div>
            </div>
        </div>
    </div>
        <script language="javascript" type="text/javascript">
            mini.parse();
            var tree = mini.get("tree1");
            //实例化表格对象
            var grid = mini.get("grid1");
            var rbl = mini.get("rbl");
            var myData = [];
            onload = function () {
                $("#expButton").hide();                if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {                    $("#expButton").show();                }
                //初始化事件控件
                var Now = new Date();
                mini.get("stime").setValue(Now.format("yyyy-MM-01 08:00"));
                mini.get("etime").setValue(Now.format("yyyy-MM-dd HH:mm"));

                loadZhan();
                searchZT();
            }
            function  loadZhan() {
                var strWhere = {
                    STTP:"PP"
                };
                GetJosns("SWZZ_FLOODTIDEDATA_ST_STBPRP_BSel", strWhere, "STCD");
            }
            function searchZT() {
                var strWhere = {
                };
                GetJosns("SWZZ_FLOODTIDEDATA_ZHUANTISel", strWhere, "SelZT");
            }
            function onvaluechangedTF(e) {
                var value = e.value;
                var selected = mini.get("TFNAME").getSelected();
                var stm = convertToDate(selected.STM).format("yyyy-MM-dd");
                var etm = convertToDate(selected.ETM).format("yyyy-MM-dd");
                mini.get("stime").setValue(stm);
                mini.get("etime").setValue(etm);
                search();
            }
			function onSelectNode(){
				search();
			}
            function onDrawSummaryCell(e) {
                var result = e.result;
                var grid = e.sender;
                //服务端汇总计算
                var JSONArray = $.data(myData, "JSONArray");
                for (var item in JSONArray) {
                    if (item == "TM") {
                        var s = "<span style='color:Brown;'>";
                        s += "<div class='classColor' style='color:#18CF5D;'>累计值</div>";
                        s += "<div class='classColor' style='color:#FF0000;'>最大值</div>";
                        s += "<div class='classColor' style='color:#FF0000;'>最大时间</div>";
                        s += "</span>";
                        e.cellHtml = s;
                    } else if (e.field == item) {
                        var s = "<span style='color:Brown;'>";
                        s += "<div class='classColor' style='color:#18CF5D;'>" + Number($.data(myData, "SUM_" + item)).toFixed(1) + "</div>";
                        s += "<div class='classColor' style='color:#FF0000;'>" + Number($.data(myData, "MAX_" + item)).toFixed(1) + "</div>";
                        s += "<div class='classColor' style='color:#FF0000;'>" + $.data(myData, "MAXTM_" + item) + "</div>";
                        s += "</span>";
                        e.cellHtml = s;
                    }
                }
            }

            function fillDataDANZHAN(pageIndex, pageSize, dataResult, gridView) {

                var data = dataResult.data, totalCount = dataResult.total;
                var tempDay = rbl.getValue();
                if (dataResult.total > 0) {
                    var JSONArray = $.data(myData, "JSONArray");
                    for (var item in JSONArray) {
                        var _avg = 0;
                        var _maxData = -99999, maxTM;
                        var _minData = 99999, minTM;
                        for (num = 0; num < dataResult.total; num++) {
                            //console.log("item====" + data[num][item]);
                            var tempData = data[num][item];
							//console.error(tempData);
                            if (data[num][item] == undefined) {
                                tempData = 0;
                            } else {
                                tempData = Number(tempData);
                            }

                            _avg += tempData;
                            if (_maxData < tempData) {
                                _maxData = tempData;
                                if (tempDay == "DAY") {
                                    maxTM = new Date(data[num].TM).format("yyyy/MM/dd");
                                } else {
                                    maxTM = new Date(data[num].TM).format("MM/dd HH:mm");
                                }
                            }
                            if (_minData > tempData) {
                                _minData = tempData;
                                if (tempDay == "DAY") {
                                    minTM = new Date(data[num].TM).format("yyyy/MM/dd");
                                } else {
                                    minTM = new Date(data[num].TM).format("MM/dd HH:mm");
                                }
                            }

                        }
                        var tempAVG = (_avg / dataResult.total).toFixed(2);
                        var tempSum = _avg.toFixed(2);
                        
                        $.data(myData, "SUM_" + item, tempSum);
                        $.data(myData, "AVG_" + item, tempAVG);
                        $.data(myData, "MAX_" + item, _maxData);
                        $.data(myData, "MAXTM_" + item, maxTM);
                    }
                }
                //var arr = [];
                //var start = pageIndex * pageSize, end = start + pageSize;
                //for (var i = start, l = end; i < l; i++) {
                //    var record = data[i];
                //    if (!record) continue;
                //    arr.push(record);
                //}

                //gridView.setTotalCount(totalCount);
                //gridView.setPageIndex(pageIndex);
                //gridView.setPageSize(pageSize);

                //gridView.setData(arr);
                gridView.setData(dataResult.data);
            }
            function JosnSel(data, typeID) {
                if (typeID == "STCD") {
                    tree.loadList(data.data, "STCD", "PID");
                    var stcds = "62724600,62724635,62724612,62724610,63405480,63425900";
                    var nodes = [];
                    for (var num = 0; num < data.data.length; num++) {
                        if (num > 10) {
                            break;
                        }
                        nodes.push(data.data[num]);
                    }
                    tree.checkNodes(nodes);
                    search();
                }
                else if (typeID == "Sel") {
                    var strJson = data.data;
                    if (strJson.length > 0) {
                        var jsonstr = strJson.filter(function (e) {
                            return e.FLAG == "0";
                        });
                        var JSONArray = eval('(' + JSON.stringify(jsonstr[0]) + ')');
                        var temTM = "";
                        var ColoumnsName = "";
                        $.data(myData, "JSONArray", JSONArray);

                        for (var item in JSONArray) {
                            if (item == "TM") {
                                temTM += "\"" + item + "\":\"时间\",";
                            } else if (item != "FLAG") {
                                ColoumnsName += "\"" + item + "\":\"" + JSONArray[item] + "\",";
                            }
                        }
                        ColoumnsName = temTM + ColoumnsName;
                        if (ColoumnsName.length > 0) {
                            ColoumnsName = ColoumnsName.substring(0, ColoumnsName.length - 1);
                        }
                        ColoumnsName = "{" + ColoumnsName + "}";
                        SetColumns(JSON.parse(ColoumnsName), grid);
                        grid.frozenColumns(0, 0);
                        var temData = SetValueDataJson(data.data, "FLAG", "0");
                        dataResult = temData;
                        fillDataDANZHAN(0, grid.getPageSize(), dataResult, grid);
                        var _XData = [];
                        var strNote = '[{"name": "时间","codename": "STNM","tableV":"1","isShow":true,"width":"30%"}';
                        strNote += ',{"name": "降雨量","codename": "DRP","tableV":"1","isShow":true,"width":"30%"}';

                        var AggName = $.data(myData, "JSONArray");
                        for (var item in AggName) {
                            if (item != "FLAG" && item != "TM") {
                                var strValue = {};
                                strValue["STNM"] = JSONArray[item];
                                strValue["DRP"] = $.data(myData, "SUM_" + item);

                                _XData.push(strValue);
                            }
                        }
                        strNote += ']';
                        var LineColor = ['#257BEE', '#FF0000', '#F5DEB3', '#E9967A', "#FFA500", "#FF69B4", "#FF00FF", "#9400D3", "#FFDAB9", "#6959CD", "#FF3030", "#E066FF", "#FF34B3", "#FF1493", "#FF4500", "#F4A460",
                            "#EEAD0E", "#53868B", "#79CDCD", "#66CDAA", "#43CD80", "#00FF00", "#FFFF00", "#8B658B", "#FF3030", "#FF00FF", "#EE00EE", "#8B0000", "#8B008B", "#008B8B", "#90EE90"];

                        chartYL("Chart", _XData, eval('(' + strNote + ')'), LineColor, "雨量");
                    //GetJosns("WATER_MYXUNQIYQ", { "STIME": mini.get("stime").getFormValue(), "ETIME": mini.get("etime").getFormValue(), "TREEID": $.data(myData, "TREEID") }, "WATER_MYXUNQIYQ");
                    }
                    mini.unmask(document.body);
                }
                else if (typeID == "WATER_MYXUNQIYQ") {
                    if (data.total > 0) {
                        for (num = 0; num < data.total; num++) {
                            //$.data(myData, "MIN_YQ" + data.data[num].STCD, data.data[num].MY_YQ);
                            //$.data(myData, "MINTM_YQ" + data.data[num].STCD, data.data[num].XQ_YQ);
                            $("#MIN_YQ" + data.data[num].STCD).html(Number(data.data[num].MY_YQ).toFixed(1));
                            $("#MINTM_YQ" + data.data[num].STCD).html(Number(data.data[num].XQ_YQ).toFixed(1));
                        }
                    }
                    mini.unmask(document.body);
                }
                else if (typeID == "SelZT") {
                    var dataResult = data.data.filter(function (e) {
                        e.TFNAME = e.STATUS + "" + e.TITLE;
                        return e.STM != null;
                    });
                    mini.get("TFNAME").setData(dataResult);
                }
            }

            function Exp() {
                var name = new Date(mini.get("stime").getFormValue()).format("yyyy年M月d日")
                name += "至" + new Date(mini.get("etime").getFormValue()).format("yyyy年M月d日") + "雨情分析";
                var data = grid.data;
                var columns = grid.columns;
                ExportExcel(name, columns, data);
            }
            function search() {
                mini.mask({
                    el: document.body,
                    cls: 'mini-mask-loading',
                    html: '加载中...'
                });

                PageFillData(0, grid.pageSize);
            }

            function PageFillData(pageIndex, pageSize) {
                var Startime = mini.get("stime").getFormValue();
                var Endtime = mini.get("etime").getFormValue();
                if (Startime > Endtime) {
                    mini.alert("请确认起止日期次序是否正确（中止日期至少是起始日期的次日）！");
                    return false;
                }
                var tempDay = rbl.getValue();
                var strWhere = {
                    STIME: Startime,
                    ETIME: Endtime,
                    STCD: tree.getValue(),
                    DAYHOUR: tempDay
                };

                GetJosns("WATER_ST_PPTN_RCUSTOMLIST", strWhere, "Sel");
            }


            // 监听分页前事件，阻止后自行设置当前数据和分页信息
            grid.on("beforeload", function (e) {
                e.cancel = true;
                var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
                //PageFillData(pageIndex, pageSize);
                fillDataDANZHAN(pageIndex, pageSize, dataResult, grid);
            });
            //鼠标移动上去的提示信息。
            function ondrawcell(e) {
                var row = e.row,
                    column = e.column,
                    field = e.field,
                    value = e.value;

                //超链接任务
                if (field == "STNM") {
                    var tempSTM = mini.get("stime").getFormValue();
                    var tempETM = mini.get("etime").getFormValue();

                    var s = "<a title=\"" + value + "\" href=\"javascript:WindowsOpen('page/yq/RainLineChart.htm?stcd=" + row.STCD + "&stnm=" + row.STNM + "&stime=" + tempSTM + "&etime=" + tempETM + "','" + row.STNM + "水位过程线" + "','" + row.STCD + "','" + tempSTM + "')\">" + value + "</a>";
                    e.cellHtml = s;
                }
                var tempDay = rbl.getValue();

                var JSONArray = $.data(myData, "JSONArray");

                for (var item in JSONArray) {
                    if (field == "TM") {
                        if (value != "" && value != undefined) {
                            if (tempDay == "DAY") {
                                e.cellHtml = formatDate(value).format("yyyy-MM-dd");
                            } else if (tempDay == "HOUR") {
                                e.cellHtml = formatDate(value).format("yyyy-MM-dd HH");
                            } else {
                                e.cellHtml = formatDate(value).format("yyyy-MM-dd HH:mm");
                            }
                        }
                    } else if (field == item) {
                        if (value != "" && value != undefined) {
                            e.cellHtml = Number(value).toFixed(1)
                        }
                    }
                }
            }

        </script>
</body>
</html>
