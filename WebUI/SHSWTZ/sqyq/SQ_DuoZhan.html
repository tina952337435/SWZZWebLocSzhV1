        function onSelectNode(e) {
            if (e.isLeaf == true) {
                //单站
                var node = e.node;
                if (e.node) {
                    var strPID = e.node.PID;
                    $.data(myData, "ID", e.node.ID);
                    $.data(myData, "PID", strPID);
                    if (node["checked"] == true) {
                        dtSTCD.push(node.STCD);
                        $("#show_spec").append("<button  class='btn-allocate btn-tick show_spec" + node.STCD + "' id='show_spec" + node.STCD + "'>" + node.STNM + "</button>")
                    } else {
                        if (dtSTCD.length > 0) {
                            dtSTCD.removeValue(node.STCD);
                        }
                        $("#show_spec" + node.STCD).remove();
                    }

                }
            } else {
                var nodes = e.node.children;
                 if (nodes.length > 0) {
                    for (num = 0; num < nodes.length; num++) {
                        if (nodes[num]["checked"] == true) {
                            dtSTCD.push(nodes[num].STCD);
                            $("#show_spec").append("<button  class='btn-allocate btn-tick show_spec" + nodes[num].STCD + "' id='show_spec" + nodes[num].STCD + "'>" + nodes[num].STNM + "</button>")
                        } else {
                            if (dtSTCD.length > 0) {
                                try {
                                    dtSTCD.removeValue(nodes[num].STCD);
                                } catch (err) {
                                }

                            }
                            $("#show_spec" + nodes[num].STCD).remove();
                        }
                    }
                }

            }

            btnTick();
            search();
        }
        function clearSTCDAll() {
            $("#show_spec").html("");
            dtSTCD = [];
            tree.uncheckAllNodes();
            search();
        }
        function btnTick() {
            $(".btn-tick").click(function (res) {
                var _stcd = res.target.id;
                if ($("#show_spec button").hasClass(_stcd)) {
                    $("#" + _stcd).remove();

                    _stcd = _stcd.replaceAll("show_spec", "");
                    var nodes = tree.findNodes(function (node) {
                        if (node.STCD == _stcd) return true;
                    });
                    tree.uncheckNodes(nodes);
                    if (dtSTCD.length > 0) {
                        dtSTCD.removeValue(_stcd);
                    }
                }
                search();
            })

        }

                $(".fit").hide();

        function search() {
            var Startime = mini.get("stime").getFormValue();
            var Endtime = mini.get("etime").getFormValue();
            if (Startime > Endtime) {
                mini.alert("请确认起止日期次序是否正确（中止日期至少是起始日期的次日）！");
                return false;
            }
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var tempSTCD = dtSTCD.toString();
            var tempTree = $.data(myData, "result").filter(function (e) {
                return dtSTCD.contains(e.STCD);
            });
            $.data(myData, "WATER_ST_STBPRP_B_QU", tempTree);
            //if (tempTree.length > 0) {
            //    for (num = 0; num < tempTree.length; num++) {
            //        tempSTCD += tempTree[num].STCD + ",";

            $.data(myData, "STCD", tempSTCD);
            var strWhere = { STIME: Startime, ETIME: Endtime, STCD: $.data(myData, "STCD"), "DAY": mini.get("rbl").getValue() }
            GetJosns("DT_SQDUOZHANLISTSel", strWhere, "Sel");
        }

        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {

            fillData(pageIndex, pageSize, dataResult, grid);

        //鼠标移动上去的提示信息。
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;

            //超链接任务
            //            if (field == "RC_NAME") {
            //                var s = '<a title="' + value + '" href="javascript:lookRow(\'' + row.RC_ID + '\',\'' + row.ZT_STIME + '\',\'' + row.ZT_ETIME + '\',\'' + row.ZT_TYPE + '\')">' + value + '</a>';
            //                e.cellHtml = s;
            //            }
            if (field == "TM") {
                var rbl = mini.get("rbl").getValue();
                if (rbl == "HOUR") {
                    e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm");
                } else if (rbl == "DAY") {
                    e.cellHtml = new Date(value).format("yyyy-MM-dd");
                } else {
                    e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
                }
            }
        }

        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            if (e.field == "TM") {
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:#18CF5D;'>平均值</div>";
                s += "<div class='classColor' style='color:#FF0000;'>最大值</div>";
                s += "<div class='classColor' style='color:#FF0000;'>最大时间</div>";
                s += "<div class='classColor' style='color:black;'>最小值</div>";
                s += "<div class='classColor' style='color:black;'>最小时间</div>";
                s += "</span>";
                e.cellHtml = s;

            } else if (e.field != undefined) {
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:#18CF5D;'>" + $.data(myData, "AVG" + e.field) + " </div>";
                s += "<div class='classColor' style='color:#FF0000;'>" + $.data(myData, "MAX" + e.field) + " </div>";
                s += "<div class='classColor' style='color:#FF0000;'> " + $.data(myData, "MAXTM" + e.field) + "</div>";
                s += "<div class='classColor' style='color:black;'>" + $.data(myData, "MIN" + e.field) + "</div>";
                s += "<div class='classColor' style='color:black;'>" + $.data(myData, "MINTM" + e.field) + "</div>";
                s += "</span>";
                e.cellHtml = s;
            }

        function onChart(xval, yval) {
            $('#Chart').highcharts({
                chart: {
                    type: 'line'
                },
                title: {
                    text: '多站水情对比分析'
                },
                exporting: {
                    enabled: false //用来设置是否显示‘打印’,'导出'等功能按钮，不设置时默认为显示
                },
                subtitle: {
                    text: ''
                },
                xAxis: {

                    crosshair: true
                },

                        text: '水位 (m)'
                    }
                },
                legend: {
                    verticalAlign: 'top',
                    y: 20
                },
                tooltip: {

                    pointFormat: '<tr><td style="color:{series.color};padding:0">{series.name}: </td>' +
                        '<td style="padding:0"><b>{point.y:.1f} m</b></td></tr>',
                    footerFormat: '</table>',
                    shared: true,
                    useHTML: true
                },
                plotOptions: {
                    series: {
                        marker: {
                            //enabled: false//无点
                            radius: 3,  //曲线点半径，默认是4
                            symbol: 'diamond' //曲线点类型："circle", "square", "diamond", "triangle","triangle-down"，默认是"circle"

                        }
                    },
                    column: {
                        pointPadding: 0.2,
                        borderWidth: 0
                    }
                },
                series: eval(yval)
            });
        }


        function treeSel() {
            var key = mini.get("key").getValue();
            if (key == "") {
                tree.clearFilter();
            } else {
                key = key.toLowerCase();
                tree.filter(function (node) {
                    var text = node.STNM ? node.STNM.toLowerCase() : "";
                    if (text.indexOf(key) != -1) {
                        return true;
                    }
                });
            }
        }
