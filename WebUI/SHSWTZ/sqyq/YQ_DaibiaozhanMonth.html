<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨量代表站特征统计(遥测)</title>
    <script src="/Common/boot.js?v=1" type="text/javascript"></script>
    <link href="/Common/CSS/bootstrap.css" rel="stylesheet" />
    <link href="/Common/CSS/bootstrap.min.css" rel="stylesheet" />
    <link href="/Common/CSS/font-awesome.min.css" rel="stylesheet" />
    <link href="/Common/CSS/bootstrap-datetimepicker.min.css" rel="stylesheet" />
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />
    <style>
        body {
                margin: 0;
                padding: 0;
                border: 0;
                width: 100%;
                height: 100%;
                /*overflow-y: hidden;*/
                overflow-x: hidden;
                font-size: 14px;
            }
    
            .mini-toolbar {
                border: 0px !important;
            }
    
            .searchTitle {
                width: 92px;
                float: left;
            }
        </style>
</head>

<body>
    <div showcollapsebutton="true" style="width: 100%; height: 100%;">
        <div class="mini-toolbar" style="padding-top: 5px;">
            <div class="searchContext" style="line-height:35px;">
                <ul class="ui-choose choose-type-right" id="choseType">
                    <li class="selected">
                        <span id="镇代表站">镇代表站</span>
                    </li>
                    <li>
                        <span id="所有站">所有站</span>
                    </li>
                </ul>
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;年份选择：</div>
                <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                    <input id="SYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <!-- &nbsp;&nbsp;<a class="mini-button" onclick="search()" style="">查询</a> -->
                <button type="button" class="btn btn-info" onclick="Exp()" id="expButton" style="display:none;margin-left: 10px;">导出报表</button>
            </div>
        </div>
        <!--showFilterRow="true" summaryPosition="top"-->
        <div class="mini-fit" style="margin-top:1px;height: -webkit-calc(100% - 38px);height: -moz-calc(100% - 38px);height: calc(100% - 38px);">
            <div id="grid1" class="mini-datagrid" style="width:100%;height:100%;" allowAlternating="true" showEmptyText="无数据"
                showSummaryRow="true" allowResize="true" ondrawsummarycell="onDrawSummaryCell" showpager="false"
                borderStyle="border-right:0;" idField="STCD" sortMode="client" sizeList="[15,20,30,50]" pageSize="50"
                ondrawcell="ondrawcell">
                <div property="columns">
                </div>
            </div>
        </div>
    </div>
    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        mini.parse();
        //实例化表格对象
        var grid = mini.get("grid1");
        var myData = [];
        var grid = mini.get("grid1");
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var _year = new Date().format("yyyy");
            GetObj("SYear").value = _year;
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            $(".form-control").on('change', function (e) {
                //处理代码
                search();
            });
            //默认加载数据
            search();


            $('#choseType li').click(function () {
                var f = this;
                $('#choseType li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                search();
            });
        });
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var Startime = GetObj("SYear").value + "-01-01 00:00:00";
            var Endtime = GetObj("SYear").value + "-12-31 23:59:59";
            //type: "indexcolumn",
            var columns = [
                { type: "indexcolumn", field: "SORTID", width: "4%", headerAlign: "center", align: "center", header: "序号" }
            ];
            if ($("#choseType .selected").find('span').html() == "镇代表站") {
                columns.push({ field: "TOWNSHIP", width: "8%", headerAlign: "center", align: "center", header: "所在乡镇" });
            }
            columns.push({ field: "STNM", width: "12%", headerAlign: "center", align: "center", header: "站名" });
            for (var month = 1; month <= 12; month++) {
                var item = { field: "MONTH" + (month), width: "5%", headerAlign: "center", align: "center", header: month + "月", decimalPlaces: "1", dataType: "float" };
                columns.push(item);
            }
            columns.push({ field: "TOTALDRP", width: "5%", headerAlign: "center", align: "center", header: "年雨量", decimalPlaces: "1", dataType: "float" });
            columns.push({ field: "MAXDAYDRP", width: "6%", headerAlign: "center", align: "center", header: "单日最大雨量", decimalPlaces: "1", dataType: "float" });
            columns.push({ field: "MAXDAYDRPTM", width: "8%", headerAlign: "center", align: "center", header: "时间" });
            grid.set({
                columns: columns
            });
            var  ISDBZ="month";
            if ($("#choseType .selected").find('span').html() == "镇代表站") {
                ISDBZ="1";
            }
            var strWhere = {
                "STIME": Startime,
                "ETIME": Endtime,
                "ISDBZ": ISDBZ
            };
            GetJosns("RainfallCharacteristicValueByMonth", strWhere, "Sel");
        }
        //接收并处理方法
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "JSONArray", dataResult);
                var totalDrp = SumJson(dataResult, 'TOTALDRP');
                var avgDrp = totalDrp / dataResult.length;
                avgDrp = avgDrp.toFixed(1);

                var itemtj={
                    STNM:"平均值",
                    TOTALDRP:avgDrp,
                };
                for (var month = 1; month <= 12; month++) {
                    totalDrp = SumJson(dataResult, "MONTH" + (month));
                    avgDrp = totalDrp / dataResult.length;
                    avgDrp = avgDrp.toFixed(1);
                    itemtj["MONTH" + (month)] = avgDrp;
                }
                dataResult.push(itemtj);
                grid.setData(dataResult);
                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            if (e.field == "MAXDAYDRPTM") {
                var tm = "-";
                if (e.value != ""&&e.value!=undefined) {
                    tm = new Date(e.value).format("yyyy-MM-dd");
                }
                e.cellHtml = tm;
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = GetObj("SYear").value + "年镇代表站雨量特征值统计";
            ExportExcel(name, columns, data);
        }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            var JSONArray = $.data(myData, "JSONArray");
            for (var item in JSONArray) {
                if (e.field == "STNM") {
                    var s = "<span style='color:Brown;font-size:14px;'>";
                    s += "<div class='classColor' style='color:#FF0000;text-align:center;height: 30px;line-height: 30px;'>平均值</div>";
                    s += "</span>";
                    e.cellHtml = s;
                } else if (e.field == "RVNM") {
                    e.cellHtml = "";
                } else if ("SORTID,TOWNSHIP,STNM,MAXDAYDRP,MAXDAYDRPTM".indexOf(e.field) == -1) {
                    var totalDrp = SumJson(JSONArray, e.field);
                    var avgDrp = totalDrp / JSONArray.length;
                    var s = "<span style='color:Brown;font-size:14px;'>";
                    s += "<div class='classColor' style='color:#FF0000;text-align:center;'>" + avgDrp.toFixed(1) + "</div>";
                    s += "</span>";
                    e.cellHtml = s;
                }
            }
        }
    </script>
</body>
</html>
