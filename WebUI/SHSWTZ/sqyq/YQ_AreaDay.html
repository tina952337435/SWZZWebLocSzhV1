<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
        }
        .mini-grid-summaryCell {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="mini-toolbar">
        <div id="zhanList">
            &nbsp;&nbsp;&nbsp;
            开始日期：&nbsp;<input id="STIME" class="mini-datepicker" style="width:100px;" format="yyyy-MM-dd" showOkButton="false" showClearButton="false" />&nbsp;&nbsp;
            &nbsp;&nbsp;&nbsp;
            结束日期：&nbsp;<input id="ETIME" class="mini-datepicker" style="width:100px;" format="yyyy-MM-dd" showOkButton="false" showClearButton="false" />&nbsp;&nbsp;

            &nbsp;&nbsp;&nbsp;
            台风名称：&nbsp;
            <input id="TFNAME" name="TFNAME" class="mini-combobox" style="width:140px;"
                   textField="TFNAME" valueField="STATUS" allowInput="true"
                   onvaluechanged="onvaluechangedTF" />
            &nbsp;&nbsp;<a class="mini-button" onclick="search()">查询</a>
            <button type="button" class="btn btn-info" onclick="Exp()" style="margin: 0px 0px;padding: 4px 12px;">数据导出</button>

        </div>
    </div>
    <div class="mini-fit">
        <div id="grid1" class="mini-datagrid"
             style="width: 100%;height:100%;"
             allowalternating="true" borderstyle="border-right:0;" idfield="SID" sortmode="client" sizelist="[15,20,30,50]"
             pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
             allowcellselect="true" allowcelledit="true"
             ondrawcell="ondrawcell" showSummaryRow="true" ondrawsummarycell="onDrawSummaryCell">
            <div property="columns">
                <div type="indexcolumn" headeralign="center" align="center">序号</div>
                <div field="TM" headeralign="center" align="center">
                    日期
                </div>
                <div field="10001DRP" headeralign="center" align="center" width="60" decimalPlaces="1" dataType="float">
                    宝山区
                </div>
                <div field="10002DRP" headeralign="center" align="center">
                    崇明区
                </div>
                <div field="10003DRP" headeralign="center" align="center" width="60" decimalPlaces="1" dataType="float">
                    奉贤区
                </div>
                <div field="10004DRP" headeralign="center" align="center" decimalPlaces="1" dataType="float">
                    嘉定区
                </div>

                <div field="10005DRP" headeralign="center" align="center" width="60" decimalPlaces="1" dataType="float">
                    金山区
                </div>
                <div field="10006DRP" headeralign="center" align="center">
                    闵行区
                </div>
                <div field="10007DRP" headeralign="center" align="center" width="60" decimalPlaces="1" dataType="float">
                    浦东新区
                </div>
                <div field="10008DRP" headeralign="center" align="center" decimalPlaces="1" dataType="float">
                    青浦区
                </div>
                <div field="10009DRP" headeralign="center" align="center" decimalPlaces="1" dataType="float">
                    松江区
                </div>
                <div field="10010DRP" headeralign="center" align="center" decimalPlaces="1" dataType="float">
                    中心城区
                </div>
            </div>
        </div>
    </div>

    <script>
        var myData = [];
        mini.parse();
        var grid = mini.get("grid1");
        $(function () {
            var curDate = new Date();
            var stime = addDayDate(curDate.format("yyyy-MM-dd"), -20);
            var etime = curDate.format("yyyy-MM-dd");
            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            searchZT();
            search();
        });
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var stime = mini.get("STIME").getFormValue() + " 00:00:00";
            var etime = mini.get("ETIME").getFormValue() + " 23:59:59";
            var strWhere = {
                STIME: stime,
                ETIME: etime,
                TYPE:"行政分区"
            };
            GetJosns("YQ_AREADAYRAIN", strWhere, "Sel");
        }
        function searchZT() {
            var strWhere = {
            };
            GetJosns("SWZZ_FLOODTIDEDATA_ZHUANTISel", strWhere, "SelZT");
        }
        function onvaluechangedTF(e) {
            var value = e.value;
            var selected = mini.get("TFNAME").getSelected();
            var stm = convertToDate(selected.STM).format("yyyy-MM-dd");
            var etm = convertToDate(selected.ETM).format("yyyy-MM-dd");
            mini.get("STIME").setValue(stm);
            mini.get("ETIME").setValue(etm);
            search();
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                //console.error(data.data);
                var dataResult = eval("("+data.data+")");
                grid.setData(dataResult);
                mini.unmask(document.body);
            }
            else if (typeID == "SelZT") {
                var dataResult = data.data.filter(function (e) {
                    e.TFNAME = e.STATUS + "" + e.TITLE;
                    return e.STM != null;
                });
                mini.get("TFNAME").setData(dataResult);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            if (field == "TM") {
                var s = new Date(convertToDate(value)).format("yyyy-MM-dd");
                e.cellHtml = s;
            }
        }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            var JSONArray = grid.getData();
            if (e.field == "TM") {
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>合计</div>";
                //s += "<div class='classColor' style='color:#FF0000;font-size:14px;'></div>";
                s += "</span>";
                e.cellHtml = s;
            }
            else if (e.field != "TM" && e.field != undefined) {
                if (JSONArray.length > 0) {
                    var drp = SumJson(JSONArray, e.field)
                    var s = "<span style='color:Brown;'>";
                    s += "<div class='classColor' style='color:#FF0000;font-size:14px;'>" + drp.toFixed(1) + "</div>";
                    s += "</span>";
                    e.cellHtml = s;
                }
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = "";
            name += new Date(mini.get("STIME").getFormValue()).format("yyyy年M月d日") + "-";
            name += new Date(mini.get("ETIME").getFormValue()).format("yyyy年M月d日") + "行政分区雨量统计";
            ExportExcel(name, columns, data);
        }
    </script>
</body>
</html>
