<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>小时面雨量过程</title>
    <script src="../../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../../Common/boot.js" type="text/javascript"></script>
    <script src="../../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
    <link href="../../arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" />
    <link href="../../arcgis_js_api/myJs/style/index.css" rel="stylesheet" type="text/css" />
    <script src="../../Common/Scripts/ChartJs.js" type="text/javascript"></script>

    <style>
        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

        .mini-grid-summaryRow tr td span {
            color: #000 !important;
            line-height: 25px;
            font-weight: 400 !important;
        }

        .label {
            height: 30px;
            line-height: 30px;
        }

        /* 统计摘要样式 */
        .summary-panel {
            text-align: center;
            padding: 10px 0;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin: 5px 10px;
        }
        .summary-item {
            display: inline-block;
            margin: 0 30px;
            font-size: 14px;
        }
        .summary-item .summary-label {
            color: #666;
        }
        .summary-item .summary-value {
            font-size: 18px;
            font-weight: bold;
            color: #3291F9;
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <!--页面载入显示-->
    <div id="dataLoad" class="load">
        <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td align="center">
                    <img src="../../arcgis_js_api/myJs/images/wait1.gif" />
                </td>
            </tr>
            <tr>
                <td align="center">
                    数据载入中，请稍后...
                </td>
            </tr>
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>

    <!--工具栏-->
    <div class="mini-toolbar" style="padding-top: 3px;">
        <table style="width: 100%;">
            <tr>
                <td>
                    <span style="float:left;">
                        &nbsp;&nbsp; 开始时间：&nbsp;
                        <input id="STIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:00"
                            showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                        结束时间：&nbsp;
                        <input id="ETIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:00"
                            showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                        <a id="searchbtn" class="mini-button" onclick="btnSearch()">查询</a>
                        <a class="mini-button" onclick="doExport()">导出</a>
                    </span>
                </td>
            </tr>
        </table>
    </div>

    <!--主体内容-->
    <div class="mini-fit"
        style="margin-top:1px;height: -webkit-calc(100% - 36px);height: -moz-calc(100% - 36px);height: calc(100% - 36px);overflow-y:auto;">

        <!--柱状图-->
        <div id="Chart" style="width: 98%; height:380px; text-align: center; margin: 0 auto;">
        </div>

        <!--统计摘要-->
        <div class="summary-panel">
            <div class="summary-item">
                <span class="summary-label">最大小时面雨量：</span>
                <span class="summary-value" id="maxDrp">--</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">最大雨量时间：</span>
                <span class="summary-value" id="maxDrpTime" style="font-size:14px;">--</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">累计面雨量：</span>
                <span class="summary-value" id="sumDrp">--</span>
            </div>
        </div>

        <!--数据表格-->
        <div style="margin: 5px 10px; height: -webkit-calc(100% - 460px); height: -moz-calc(100% - 460px); height: calc(100% - 460px); min-height: 200px;">
            <div id="grid1" class="mini-datagrid" style="width: 100%; height: 100%;" allowalternating="true"
                sizeList="[15,20,30,50,100,500,1000]" pageSize="50" showsummaryrow="true"
                allowresize="false" ondrawcell="ondrawcell" showPager="false" ondrawsummarycell="onDrawSummaryCell"
                showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
                <div property="columns">
                    <div type="indexcolumn" width="60" align="center" headerAlign="center">序号</div>
                    <div field="tm" width="160" align="center" headerAlign="center" allowSort="false">时间</div>
                    <div field="drp" width="140" align="center" headerAlign="center" allowSort="true" summaryType="sum">
                        面雨量(mm)</div>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript">
        mini.parse();
        var grid = mini.get("grid1");

        $(function () {
            var tm = new Date();
            // 默认查询近24小时，addDayDate 需要带 '-' 的字符串
            var dateStr = tm.format("yyyy-MM-dd");
            var stime = addDayDate(dateStr, -1) + " " + tm.format("HH:mm");
            var etime = tm.format("yyyy/MM/dd") + " " + tm.format("HH:mm");

            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            BreakLayerLoad();
        });

        function btnSearch() {
            $("#dataLoad").show();
            setTimeout('BreakLayerLoad()', 100);
        }

        function BreakLayerLoad() {
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(endDate);

            var strWhere = {
                "stime": d1.format("yyyy-MM-dd HH:mm:ss"),
                "etime": d2.format("yyyy-MM-dd HH:mm:ss"),
                "pid":"201901101419326076-1-1,201901101419326076-5"
            }
            app.post("/SWZZ_RTSQ_ST_PPTN_R/selectListHourlyArea", strWhere, (data) => {
                JosnSel(data);
            });
        }

        var resultData;
        function JosnSel(data) {
            resultData = data;
            if (data && data.data && data.data.length > 0) {
                JsonLineChart(data.data);
                grid.setData(data.data);
            } else {
                $("#maxDrp").html("--");
                $("#maxDrpTime").html("--");
                $("#sumDrp").html("--");
                grid.setData([]);
                // 清空图表
                var myChart = echarts.init(document.getElementById("Chart"));
                myChart.clear();
                myChart.setOption({
                    title: {
                        text: '暂无数据',
                        left: 'center',
                        top: 'center',
                        textStyle: { color: '#999', fontSize: 16 }
                    }
                });
            }
            $("#dataLoad").hide();
        }

        function JsonLineChart(strJson) {
            var chartTM = [], chartValue = [];
            var DRPMAX = -9999, DRPMAXTM = "", SUMSUM = 0;

            for (var num = 0; num < strJson.length; num++) {
                var tmStr = new Date(strJson[num].tm).format("MM/dd HH:mm");
                var drpVal = parseFloat(strJson[num].drp) || 0;
                chartTM.push(tmStr);
                chartValue.push(Number(drpVal.toFixed(1)));

                if (strJson[num].drp != "" && strJson[num].drp != null) {
                    if (DRPMAX < drpVal) {
                        DRPMAX = drpVal;
                        DRPMAXTM = tmStr;
                    }
                    SUMSUM += drpVal;
                }
            }

            // 更新统计摘要
            $("#maxDrp").html(DRPMAX == -9999 ? "--" : DRPMAX.toFixed(1) + " mm");
            $("#maxDrpTime").html(DRPMAXTM || "--");
            $("#sumDrp").html(SUMSUM > 0 ? SUMSUM.toFixed(1) + " mm" : "--");

            // 直接构建 ECharts 柱状图
            var myChart = echarts.init(document.getElementById("Chart"));
            myChart.clear();

            // 计算 Y 轴最大值
            var yMax = Math.ceil(Math.max.apply(null, chartValue) / 5) * 5 + 2;
            if (yMax < 5) yMax = 5;

            var option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#3291F9',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: { color: '#000000' },
                    formatter: function (params) {
                        return params[0].name + '<br/>面雨量：<b>' + params[0].value + ' mm</b>';
                    }
                },
                color: ['#3291F9'],
                grid: {
                    left: '3%',
                    right: '5%',
                    bottom: '3%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: chartTM,
                    axisTick: { alignWithLabel: true },
                    axisLabel: {
                        interval: Math.floor(chartTM.length / 8) || 0,
                        rotate: 0
                    }
                },
                yAxis: {
                    name: '面雨量（mm）',
                    type: 'value',
                    min: 0,
                    max: yMax,
                    splitNumber: 5,
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#e0e0e0',
                            width: 1,
                            type: 'dashed'
                        }
                    },
                    axisLabel: {
                        formatter: function (v) {
                            return v.toFixed(1);
                        }
                    }
                },
                series: [{
                    name: '面雨量',
                    type: 'bar',
                    data: chartValue,
                    barWidth: '60%',
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#5B9CF5' },
                            { offset: 1, color: '#3291F9' }
                        ])
                    }
                }]
            };
            myChart.setOption(option);
        }

        function doExport() {
            var data = grid.data;
            if (data && data.length > 0) {
                ExportExcel(data, grid, "小时面雨量过程");
            } else {
                mini.alert("暂无数据可导出！");
            }
        }

        // 监听分页前事件
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, resultData, grid);
        });

        // 表格汇总行 - 累计雨量
        function onDrawSummaryCell(e) {
            var value = e.value;
            if (e.field == "drp") {
                if (value != null) {
                    e.cellHtml = "<span style=\"color:#3291F9;font-weight:bold;\">累计面雨量: "
                        + Number(value).toFixed(1) + " mm</span>";
                } else {
                    e.cellHtml = "<span style=\"color:#3291F9;font-weight:bold;\">累计面雨量: --</span>";
                }
            }
        }

        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            if (field == "drp") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(1);
                }
            } else if (field == "tm") {
                if (value != undefined) {
                    e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
                }
            }
        }
    </script>
</body>

</html>
