<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>小时面雨量过程</title>
    <script src="../../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../../Common/boot.js" type="text/javascript"></script>
    <script src="../../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
    <link href="../../arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" />
    <link href="../../arcgis_js_api/myJs/style/index.css" rel="stylesheet" type="text/css" />
    <script src="../../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <script src="../../arcgis_js_api/myJs/mapConfig.js" type="text/javascript"></script>
    <script src="../../arcgis_js_api/library/3.31/3.31/init.js" type="text/javascript"></script>

    <style>
        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

        .mini-grid-summaryRow tr td span {
            color: #000 !important;
            line-height: 25px;
            font-weight: 400 !important;
        }

        .label {
            height: 30px;
            line-height: 30px;
        }

        /* 统计摘要样式 */
        .summary-panel {
            text-align: center;
            padding: 10px 0;
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            margin: 5px 10px;
        }
        .summary-item {
            display: inline-block;
            margin: 0 30px;
            font-size: 14px;
        }
        .summary-item .summary-label {
            color: #666;
        }
        .summary-item .summary-value {
            font-size: 18px;
            font-weight: bold;
            color: #3291F9;
            margin-left: 5px;
        }
    </style>
</head>

<body>
    <!--页面载入显示-->
    <div id="dataLoad" class="load">
        <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td align="center">
                    <img src="../../arcgis_js_api/myJs/images/wait1.gif" />
                </td>
            </tr>
            <tr>
                <td align="center">
                    数据载入中，请稍后...
                </td>
            </tr>
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>

    <!--左侧区域树-->
    <div style="width:210px;float:left;height:100%;background:#fff;border-right:1px solid #e0e0e0;box-sizing:border-box;padding:10px;">
        <div style="height:30px;line-height:30px;font-weight:bold;color:#333;">区域</div>
        <ul id="tree1" class="mini-tree" style="width:100%;height:calc(100% - 30px);padding:5px;"
            showTreeIcon="true" textField="title" idField="id" parentField="pid"
            resultAsTree="false" expandOnNodeClick="false" expandOnLoad="1" onnodeselect="onSelectNode"></ul>
    </div>

    <!--右侧内容区-->
    <div style="width:calc(100% - 210px);float:right;height:100%;">

    <!--工具栏-->
    <div class="mini-toolbar" style="padding-top: 3px;">
        <table style="width: 100%;">
            <tr>
                <td>
                    <span style="float:left;">
                        &nbsp;&nbsp; 开始时间：&nbsp;
                        <input id="STIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:00"
                            showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                        结束时间：&nbsp;
                        <input id="ETIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:00"
                            showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                        <a id="searchbtn" class="mini-button" onclick="btnSearch()">查询</a>
                        <a class="mini-button" onclick="doExport()">导出</a>
                    </span>
                </td>
            </tr>
        </table>
    </div>

    <!--主体内容-->
    <div class="mini-fit"
        style="margin-top:1px;height: -webkit-calc(100% - 36px);height: -moz-calc(100% - 36px);height: calc(100% - 36px);overflow-y:auto;">

        <!--柱状图-->
        <div id="Chart" style="width: 98%; height:380px; text-align: center; margin: 0 auto;">
        </div>

        <!--统计摘要-->
        <div class="summary-panel">
            <div class="summary-item">
                <span class="summary-label">最大小时面雨量：</span>
                <span class="summary-value" id="maxDrp">--</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">最大雨量时间：</span>
                <span class="summary-value" id="maxDrpTime" style="font-size:14px;">--</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">累计面雨量：</span>
                <span class="summary-value" id="sumDrp">--</span>
            </div>
        </div>

        <!--数据表格-->
        <div style="margin: 5px 10px; height: -webkit-calc(100% - 460px); height: -moz-calc(100% - 460px); height: calc(100% - 460px); min-height: 200px;">
            <div id="grid1" class="mini-datagrid" style="width: 100%; height: 100%;" allowalternating="true"
                sizeList="[15,20,30,50,100,500,1000]" pageSize="50" showsummaryrow="true"
                allowresize="false" ondrawcell="ondrawcell" showPager="false" ondrawsummarycell="onDrawSummaryCell"
                onrowclick="onRowClick" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
                <div property="columns">
                    <div type="indexcolumn" width="60" align="center" headerAlign="center">序号</div>
                    <div field="tm" width="160" align="center" headerAlign="center" allowSort="false">时间</div>
                    <div field="drp" width="140" align="center" headerAlign="center" allowSort="true" summaryType="sum">
                        面雨量(mm)</div>
                </div>
            </div>
        </div>

    </div>
    </div>

    <!--各站雨量明细弹窗-->
    <div id="stationWin" class="mini-window" title="各站雨量明细" showModal="true" showFooter="false"
        style="width:880px;height:500px;display:none;" allowResize="false">
        <div style="padding:6px 10px;border-bottom:1px solid #eee;">
            <a class="mini-button" onclick="doExportStation()">导出</a>
        </div>
        <div style="height:calc(100% - 45px);">
            <div id="stationGrid" class="mini-datagrid" style="width:100%;height:100%;"
                allowalternating="true" showpager="false"
                showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
                <div property="columns">
                    <div type="indexcolumn" width="50" align="center" headerAlign="center">序号</div>
                    <div field="stnm" width="120" align="center" headerAlign="center">站名</div>
                    <!-- <div field="stcd" width="110" align="center" headerAlign="center">站码</div> -->
                    <div field="drp" width="110" align="center" headerAlign="center" dataType="float" decimalPlaces="1">雨量(mm)</div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript">
        mini.parse();
        var grid = mini.get("grid1");
        var tree = mini.get("tree1");

        // 全市 = 合并这两个 id
        var DEFAULT_PID = "201901101419326076-1-1,201901101419326076-5";
        var currentPid = DEFAULT_PID;
        var parentIds = {};   // 记录哪些 id 是父节点（有子项），选中时不查询
        var stationGrid = mini.get("stationGrid");
        var stationWin = mini.get("stationWin");
        var stationData = [];   // 当前弹窗展示的站点明细
        var stationWinTm = null; // 当前明细对应的小时

        // 苏州河及两翼 = 合并这几个片区 id（与"全市"一样是单个合并节点）
        var SZH_PID = "201901101419326076-4-12,201901101419326076-4-13,201901101419326076-4-2,201901101419326076-4-7,201901101419326076-4-9";

        $(function () {
            var tm = new Date();
            // 默认查询近24小时，addDayDate 需要带 '-' 的字符串
            var dateStr = tm.format("yyyy-MM-dd");
            var stime = addDayDate(dateStr, -1) + " " + tm.format("HH:mm");
            var etime = tm.format("yyyy/MM/dd") + " " + tm.format("HH:mm");

            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            loadTree();
        });

        // 查询区域树接口，按规则过滤拼装成树
        function loadTree() {
            $("#dataLoad").show();
            app.post("SWZZ_RTSQ_ST_STBPRP_B_TREE/findResult", {}, (data) => {
                var src = (data && data.data) ? data.data : [];
                markParentIds(src);
                var list = buildAreaTree(src);
                tree.loadList(list, "id", "pid");
                if (list.length > 0) {
                    tree.select(0);
                }
                currentPid = DEFAULT_PID;
                BreakLayerLoad();
            }, () => {
                // 树接口异常时仍按默认 pid 查询，避免页面卡在加载中
                BreakLayerLoad();
            });
        }

        // 拼装规则：
        // 1. 全市 = 合并两个 id（DEFAULT_PID）；
        // 2. 2024060516432392160 本身 + 子项；
        // 3. 201901101419326076-4 本身 + 子项；
        // 4. 苏州河及两翼 = 合并 5 个片区 id（SZH_PID）。
        function buildAreaTree(src) {
            var list = [];
            // 全市
            list.push({ id: DEFAULT_PID, pid: "", title: "全市" });
            // 两个片区根 + 全部子项
            var subRoots = ["2024060516432392160", "201901101419326076-4"];
            for (var i = 0; i < subRoots.length; i++) {
                list = list.concat(collectSubtree(src, subRoots[i]));
            }
            // 苏州河及两翼（单个合并节点，跟"全市"一样）
            list.push({ id: SZH_PID, pid: "", title: "苏州河及两翼" });
            return list;
        }

        // 取某个 id 及其全部子孙节点，并把根重新挂为顶级
        function collectSubtree(src, rootId) {
            var byPid = {};
            for (var i = 0; i < src.length; i++) {
                var p = src[i].pid;
                if (!byPid[p]) byPid[p] = [];
                byPid[p].push(src[i]);
            }
            var root = null;
            for (var j = 0; j < src.length; j++) {
                if (src[j].id === rootId) { root = src[j]; break; }
            }
            if (!root) return [];

            var result = [];
            result.push({ id: root.id, pid: "", title: root.title || root.name || root.text });
            var stack = [root.id];
            while (stack.length) {
                var cur = stack.pop();
                var children = byPid[cur] || [];
                for (var k = 0; k < children.length; k++) {
                    result.push({
                        id: children[k].id,
                        pid: children[k].pid,
                        title: children[k].title || children[k].name || children[k].text
                    });
                    stack.push(children[k].id);
                }
            }
            return result;
        }

        // 标记哪些 id 是父节点（有子项）
        function markParentIds(src) {
            parentIds = {};
            for (var i = 0; i < src.length; i++) {
                if (src[i].pid) parentIds[src[i].pid] = true;
            }
        }

        // 树节点选择后重新查询（父节点不查询）
        function onSelectNode(e) {
            var node = e.node;
            if (!node) return;
            // 父节点不调用接口
            if (parentIds[node.id]) return;
            var newPid = node.id;
            // 初始自动选中"全市"时 pid 未变化，避免重复查询
            if (newPid === currentPid) return;
            currentPid = newPid;
            $("#dataLoad").show();
            BreakLayerLoad();
        }

        // ===== 站点明细弹窗 =====
        function onRowClick(e) {
            var row = e.record;
            if (row && row.tm) showStationDetail(row.tm);
        }

        // 点击柱子/表格数字后，查询该小时各站雨量
        function showStationDetail(tm) {
            stationWinTm = tm;
            var start = new Date(tm);
            var end = new Date(start.getTime() + 60 * 60 * 1000);
            var strWhere = {
                pid: currentPid,
                stime: start.format("yyyy-MM-dd HH:mm:ss"),
                etime: end.format("yyyy-MM-dd HH:mm:ss"),
                pathname: "SUM"
            };
            mini.mask({ el: document.body, cls: 'mini-mask-loading', html: '站点明细加载中...' });
            app.post("/SWZZ_RTSQ_ST_PPTN_R/queryDRPList", strWhere, (data) => {
                mini.unmask(document.body);
                fillStationDetail(data);
            });
        }

        function fillStationDetail(data) {
            var list = (data && data.data) ? data.data : [];
            // 按雨量降序
            list = list.slice().sort(function (a, b) {
                return (parseFloat(b.drp) || 0) - (parseFloat(a.drp) || 0);
            });
            stationData = list;
            stationGrid.setData(list);

            var title = "各站雨量明细";
            if (stationWinTm) {
                var d = new Date(stationWinTm);
                title = (d.getMonth() + 1) + "月" + d.getDate() + "日 " + d.getHours() + "时 各站雨量（" + list.length + "站）";
            }
            stationWin.setTitle(title);
            stationWin.show();
        }

        function onStationDrawCell(e) {
            if (e.field === "op") {
                var rec = e.record;
                if (rec && rec.lgtd != null && rec.lttd != null && rec.lgtd !== "" && rec.lttd !== "") {
                    var stcd = (rec.stcd || "").toString();
                    e.cellHtml = '<a href="javascript:void(0)" style="color:#3291F9;" onclick="locateByStcd(\'' + stcd + '\')">定位</a>';
                } else {
                    e.cellHtml = '<span style="color:#ccc;">--</span>';
                }
            }
        }

        // ===== 弹窗内嵌小地图 =====
        var stationMap = null;
        var stationGraphicsLayer = null;
        var stationLocateLayer = null;
        var stationMapReady = false;
        var _Point = null, _Graphic = null, _PictureMarkerSymbol = null, _SpatialReference = null, _Extent = null;

        function initStationMap(cb) {
            if (stationMapReady) { cb && cb(); return; }
            if (stationMap) {
                stationMap.on("load", function () { cb && cb(); });
                return;
            }
            require([
                "esri/map", "esri/layers/GraphicsLayer", "esri/geometry/Point", "esri/graphic",
                "esri/symbols/PictureMarkerSymbol", "esri/SpatialReference", "esri/geometry/Extent",
                "myJs/shswOneMapServer", "dojo/domReady!"
            ], function (Map, GraphicsLayer, Point, Graphic, PictureMarkerSymbol, SpatialReference, Extent, shswOneMapServer) {
                _Point = Point; _Graphic = Graphic; _PictureMarkerSymbol = PictureMarkerSymbol;
                _SpatialReference = SpatialReference; _Extent = Extent;
                stationMap = new Map("stationMap", {
                    logo: false, slider: false, zoom: 10, maxZoom: 18, showLabels: true,
                    center: [1301.505898, -12657.422868], spatialReference: { wkid: 3857 }
                });
                stationMap.on("load", function () {
                    stationMapReady = true;
                    stationMap.centerAndZoom(new _Point(121.47, 31.23, new _SpatialReference({ wkid: 4326 })), 10);
                    cb && cb();
                });
                stationMap.addLayer(new shswOneMapServer("shsw_OneMapServer"));
                stationGraphicsLayer = new GraphicsLayer();
                stationLocateLayer = new GraphicsLayer();
                stationMap.addLayer(stationGraphicsLayer);
                stationMap.addLayer(stationLocateLayer);
            });
        }

        // 定位到某个站点
        function locateByStcd(stcd) {
            var item = null;
            for (var i = 0; i < stationData.length; i++) {
                if ((stationData[i].stcd || "").toString() === stcd) { item = stationData[i]; break; }
            }
            if (!item) return;
            if (item.lgtd == null || item.lttd == null || item.lgtd === "" || item.lttd === "") {
                mini.alert("该站缺少经纬度");
                return;
            }
            initStationMap(function () {
                var point = new _Point(item.lgtd, item.lttd, new _SpatialReference({ wkid: 4326 }));
                stationMap.centerAndZoom(point, 12);
                stationLocateLayer.clear();
                var symbol = new _PictureMarkerSymbol("../../arcgis_js_api/myJs/images/d_red.png", 18, 24);
                stationLocateLayer.add(new _Graphic(point, symbol, item, null));
            });
        }

        // 全部站点上图（弹窗内小地图）
        function showAllStationsOnMap() {
            if (!stationData || stationData.length === 0) {
                mini.alert("暂无站点可上图");
                return;
            }
            initStationMap(function () {
                stationGraphicsLayer.clear();
                var extent = null;
                for (var i = 0; i < stationData.length; i++) {
                    var item = stationData[i];
                    if (item.lgtd == null || item.lttd == null || item.lgtd === "" || item.lttd === "") continue;
                    var point = new _Point(item.lgtd, item.lttd, new _SpatialReference({ wkid: 4326 }));
                    var symbol = new _PictureMarkerSymbol("../../arcgis_js_api/myJs/images/d_blue.png", 14, 18);
                    stationGraphicsLayer.add(new _Graphic(point, symbol, item, null));
                    if (!extent) {
                        extent = new _Extent(point.x, point.y, point.x, point.y, point.spatialReference);
                    } else {
                        extent = extent.union(new _Extent(point.x, point.y, point.x, point.y, point.spatialReference));
                    }
                }
                if (extent) stationMap.setExtent(extent.expand(1.5));
            });
        }

        // 清空小地图站点
        function clearStationLayer() {
            if (stationGraphicsLayer) stationGraphicsLayer.clear();
            if (stationLocateLayer) stationLocateLayer.clear();
        }

        function doExportStation() {
            if (!stationData || stationData.length === 0) {
                mini.alert("暂无数据可导出！");
                return;
            }
            var mockGrid = {
                columns: [
                    { field: "stnm", header: "站名" },
                    { field: "stcd", header: "站码" },
                    { field: "drp", header: "雨量(mm)" }
                ],
                data: stationData
            };
            ExportExcel(stationData, mockGrid, "各站雨量明细");
        }

        function btnSearch() {
            $("#dataLoad").show();
            setTimeout('BreakLayerLoad()', 100);
        }

        function BreakLayerLoad() {
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(endDate);

            var strWhere = {
                "stime": d1.format("yyyy-MM-dd HH:mm:ss"),
                "etime": d2.format("yyyy-MM-dd HH:mm:ss"),
                "pid": currentPid
            }
            app.post("/SWZZ_RTSQ_ST_PPTN_R/selectListHourlyArea", strWhere, (data) => {
                JosnSel(data);
            });
        }

        var resultData;
        function JosnSel(data) {
            resultData = data;
            if (data && data.data && data.data.length > 0) {
                JsonLineChart(data.data);
                grid.setData(data.data);
            } else {
                $("#maxDrp").html("--");
                $("#maxDrpTime").html("--");
                $("#sumDrp").html("--");
                grid.setData([]);
                // 清空图表
                var myChart = echarts.init(document.getElementById("Chart"));
                myChart.clear();
                myChart.setOption({
                    title: {
                        text: '暂无数据',
                        left: 'center',
                        top: 'center',
                        textStyle: { color: '#999', fontSize: 16 }
                    }
                });
            }
            $("#dataLoad").hide();
        }

        function JsonLineChart(strJson) {
            var chartTM = [], chartValue = [];
            var DRPMAX = -9999, DRPMAXTM = "", SUMSUM = 0;

            for (var num = 0; num < strJson.length; num++) {
                var tmStr = new Date(strJson[num].tm).format("MM/dd HH:mm");
                var drpVal = parseFloat(strJson[num].drp) || 0;
                chartTM.push(tmStr);
                chartValue.push(Number(drpVal.toFixed(1)));

                if (strJson[num].drp != "" && strJson[num].drp != null) {
                    if (DRPMAX < drpVal) {
                        DRPMAX = drpVal;
                        DRPMAXTM = tmStr;
                    }
                    SUMSUM += drpVal;
                }
            }

            // 更新统计摘要
            $("#maxDrp").html(DRPMAX == -9999 ? "--" : DRPMAX.toFixed(1) + " mm");
            $("#maxDrpTime").html(DRPMAXTM || "--");
            $("#sumDrp").html(SUMSUM > 0 ? SUMSUM.toFixed(1) + " mm" : "--");

            // 直接构建 ECharts 柱状图
            var myChart = echarts.init(document.getElementById("Chart"));
            myChart.clear();

            // 计算 Y 轴最大值
            var yMax = Math.ceil(Math.max.apply(null, chartValue) / 5) * 5 + 2;
            if (yMax < 5) yMax = 5;

            var option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#3291F9',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: { color: '#000000' },
                    formatter: function (params) {
                        return params[0].name + '<br/>面雨量：<b>' + params[0].value + ' mm</b>';
                    }
                },
                color: ['#3291F9'],
                grid: {
                    left: '3%',
                    right: '5%',
                    bottom: '3%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: chartTM,
                    axisTick: { alignWithLabel: true },
                    axisLabel: {
                        interval: Math.floor(chartTM.length / 8) || 0,
                        rotate: 0
                    }
                },
                yAxis: {
                    name: '面雨量（mm）',
                    type: 'value',
                    min: 0,
                    max: yMax,
                    splitNumber: 5,
                    splitLine: {
                        show: true,
                        lineStyle: {
                            color: '#e0e0e0',
                            width: 1,
                            type: 'dashed'
                        }
                    },
                    axisLabel: {
                        formatter: function (v) {
                            return v.toFixed(1);
                        }
                    }
                },
                series: [{
                    name: '面雨量',
                    type: 'bar',
                    data: chartValue,
                    barWidth: '60%',
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#5B9CF5' },
                            { offset: 1, color: '#3291F9' }
                        ])
                    }
                }]
            };
            myChart.setOption(option);

            // 点击柱子查看该小时各站雨量
            myChart.off("click");
            myChart.on("click", function (params) {
                if (params.componentType === "series" && params.dataIndex != null) {
                    var rec = strJson[params.dataIndex];
                    if (rec && rec.tm) showStationDetail(rec.tm);
                }
            });
        }

        function doExport() {
            var data = grid.data;
            if (data && data.length > 0) {
                ExportExcel(data, grid, "小时面雨量过程");
            } else {
                mini.alert("暂无数据可导出！");
            }
        }

        // 监听分页前事件
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, resultData, grid);
        });

        // 表格汇总行 - 累计雨量
        function onDrawSummaryCell(e) {
            var value = e.value;
            if (e.field == "drp") {
                if (value != null) {
                    e.cellHtml = "<span style=\"color:#3291F9;font-weight:bold;\">累计面雨量: "
                        + Number(value).toFixed(1) + " mm</span>";
                } else {
                    e.cellHtml = "<span style=\"color:#3291F9;font-weight:bold;\">累计面雨量: --</span>";
                }
            }
        }

        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            if (field == "drp") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(1);
                }
            } else if (field == "tm") {
                if (value != undefined) {
                    e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
                }
            }
        }
    </script>
</body>

</html>
