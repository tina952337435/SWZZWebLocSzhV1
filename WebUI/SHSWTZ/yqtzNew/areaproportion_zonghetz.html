    <script>
        mini.parse();
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 2;
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
           $.data(myData, "TYPE","行政分区");

            searchStation();

            $.data(myData, "SMONTH", null);
            $.data(myData, "EMONTH", null);
            $.data(myData, "SMONTHF", null);
            $.data(myData, "EMONTHF", null);
        });
        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;
        }
        function loadTree() {
            var data = $.data(myData, "stationData");
            var dataResult = [];
            var type = $.data(myData, "TYPE");
            var stcds = "";
            if (type == "行政分区") {
                var dataTempC = groupBy(data, "COUNTIES");
                dataTempC.forEach(function (item) {
                    dataResult.push({ STCD: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                    stcds += item[0].COUNTIESID+",";
                });
            }
            else if (type == "水利片区") {
                var dataTempW = groupBy(data, "WATERAREA");
                dataTempW.forEach(function (item) {
                    dataResult.push({ STCD: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
                    stcds += item[0].WATERAREAID + ",";
                });
            }
            else {
                var dataTempC = groupBy(data, "COUNTIES");
                dataTempC.forEach(function (item) {
                    for (var num = 0; num < item.length; num++) {
                        dataResult.push({ STCD: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                        stcds += item[num].STCD + ",";
                    }
                });
            }
            if (stcds != "") stcds = stcds.substring(0, stcds.length - 1);
            $.data(myData, "stcds", stcds);
            $.data(myData, "stationDataFen", dataResult);
            search();
        }
        function search() {
            STGRDColumn();
            var startYear = Number(GetObj("startYear").value) + "-01-01 00:00:00";
            var endYear = Number(GetObj("endYear").value) + "-12-31 23:59:59";
            var strWhere = {
                STCD: $.data(myData, "stcds"),
                STIME: startYear,
                ETIME: endYear,
                SMONTH: $.data(myData, "SMONTH"),
                EMONTH: $.data(myData, "EMONTH"),
                SMONTHF: $.data(myData, "SMONTHF"),
                EMONTHF: $.data(myData, "EMONTHF")
            };
            GetJosns("TOTALSURFACERAINSTORMSel", strWhere, "SelNum");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                $.data(myData, "stationData", data.data);
                loadTree();
            }
            else if (typeID == "SelNum") {
                var dataResult = mini.decode(data.data);
                //var totalYear = SumJson(dataResult, "TOTALDRP");
                //var totalSur = SumJson(dataResult, "SURDRP");
                //dataResult.push({ YEAR: "合计", TOTALDRP: totalYear.toFixed(1), SURDRP: totalSur.toFixed(1) });
                //grid.setData(dataResult);
                $.data(myData, "data", dataResult);
                loadChart();
            }
        }
        function onSelectNode(e) {
            search();
        };
        function onSTCDChanged(e) {
            search();
        }
        function loadChart() {
            var data = $.data(myData, "data");
            var arr = $.data(myData, "stationDataFen");
            var dataResult = [];
            for (var num = 0; num < arr.length; num++) {
                var dataTemp = data.filter(function (e) {
                    return e.STCD == arr[num].STCD;
                });
                var totalSur = SumJson(dataTemp, "SURDRP");//年暴雨量
                var totalDrp = SumJson(dataTemp, "TOTALDRP");//年累计雨量
                var avgDrp = totalDrp / dataTemp.length;//年平均雨量

                var surMax = Math.max.apply(Math, dataTemp.map(function (o) { return o.SURDRP }));
                var totalMax = Math.max.apply(Math, dataTemp.map(function (o) { return o.TOTALDRP }));
                var dataTempTemp = dataTemp.filter(function (e) {
                    return e.SURDRP == surMax;
                });
                var maxYear = dataTempTemp[0].YEAR;
                dataTempTemp = dataTemp.filter(function (e) {
                    return e.TOTALDRP == totalMax;
                });
                var totalMaxYear = dataTempTemp[0].YEAR;
                var avgSur = totalSur / dataTemp.length;//平均暴雨量
                var MAXBILI = ((surMax / avgDrp) * 100).toFixed(1);
                var AVGDRPBILI = ((avgSur / avgDrp) * 100).toFixed(1);
                dataResult.push({ NAME: arr[num].NAME, AVGDRP: avgSur.toFixed(1), AVGDRPBILI: AVGDRPBILI, MAX: surMax, MAXYEAR: maxYear, MAXTOTAL: totalMax, MAXTOTALYEAR: totalMaxYear, MAXBILI: MAXBILI});
            }
            //var totalAVGDRP = SumJson(dataResult, "AVGDRP");
            //for (var num = 0; num < dataResult.length; num++) {

            //    dataResult[num].AVGDRPBILI = ((dataResult[num].AVGDRP / totalAVGDRP) * 100).toFixed(1);
            //}

            Chart('BY_charts', dataResult);

            grid.setData(dataResult);
        }
        function Chart(chartName, data) {
            var node = tree.getSelectedNode();
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.off('click');
            myChart.clear();
            option = {
                title: {
                    left: 'center',
                    text: node.NAME + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年面暴雨总量变化以及占当年面降雨的比例",
                },
                tooltip: {
                    trigger: 'axis',
                    //axisPointer: {
                    //    type: 'shadow'
                    //}
                },
                // 更改图例默认颜色(依次应用)
                // color: ['red', 'black', 'yellow', 'pink', 'cyan'],
                color: ['#5470C6', '#91CC75', '#FAC858', '#EE6666'],
                // //这里设置柱状图上面的方块，名称跟series里的name保持一致
                legend: {
                    orient: 'vertical',
                    x: 'right',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    padding: [10, 50, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                    show: false,
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    // boundaryGap: true 表示x轴两边留白
                    boundaryGap: true,
                    axisTick: {
                        alignWithLabel: true
                    },
                    data: ['特大暴雨', '大暴雨', '暴雨']
                },
                yAxis: {
                    name: "暴雨频次",
                    type: 'value',
                    max: function (e) {
                        return e.max + 10;
                    }
                },
                series: [
                    {
                        name: '暴雨频次',
                        type: 'bar',
                        barGap: '0%',
                        barWidth: 30,
                        data: data,
                        itemStyle: {
                            normal: {
                                label: {
                                    show: true,  //开启显示
                                    formatter: '{c}',  //显示数值
                                    position: 'top',
                                    textStyle: { //数值样式
                                        fontSize: 10
                                    }
                                }
                            }
                        }
                    }
                ]
            };
            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
            myChart.on("click", pieConsole);
            function pieConsole(param) {
                //获取data长度
                var year = param.name;
                loadChangci(year);
            }
        }
        //柱子的点击事件
        function loadChangci(year) {
            var node = tree.getSelectedNode();
            var strTitle = node.NAME;
            var STCD = node.ID;
            var strParam = "STCD@" + STCD;
            var rainLevel = "";
            if (isNaN(year)) {
                strTitle += "1978年至2020年" + year + "频次";
                rainLevel = year;
                strParam += ",TYPE@" + rainLevel;
            } else {
                strTitle += year + "年暴雨频次";
                var stime = year + "-01-01 00:00:00";
                var etime = year + "-12-31 23:59:59";
                strParam += ",STIME@" + stime + ",ETIME@" + etime
            }
            var url = "/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html";
            lookData(strParam, url, strTitle, "50%", 565, "true");
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            //var node = tree.getSelectedNode();
            var name = $.data(myData, "TYPE") + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年面暴雨总量变化以及占当年面降雨的比例"
            ExportExcel(name, columns, data);
        }
        function OnClickTitle2(objID, name) {
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $.data(myData, "TYPE", name);
            loadTree();
        }

            var only = $("#onlytab3 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            if (name == "全年") {
                $.data(myData, "SMONTH", null);
                $.data(myData, "EMONTH", null);
                $.data(myData, "SMONTHF", null);
                $.data(myData, "EMONTHF", null);
            }
            else if (name == "汛期") {
                $.data(myData, "SMONTH", 6);
                $.data(myData, "EMONTH", 9);
                $.data(myData, "SMONTHF", 6);
                $.data(myData, "EMONTHF", 9);
            } else {
                $.data(myData, "SMONTH", 1);
                $.data(myData, "EMONTH", 5);
                $.data(myData, "SMONTHF", 10);
                $.data(myData, "EMONTHF", 12);
            }
            search();
        }
        function XunOK() {
            $.data(myData, "ISFLOOD", true);
            $("#sysList").css("display", "none");
            search();
        }
        function feiXunOK() {
            $.data(myData, "ISFLOOD", false);

        }

        //获取表头---2022-01-05
        function STGRDColumn() {
            var createGrid = [];
            createGrid.push({ type: "indexcolumn", headerAlign: "center", align: "center", header: "序号", width: "50" });
            var type = $.data(myData, "TYPE");
            if (type=="行政分区"||type=="水利片区") {
                createGrid.push({ field: "NAME", headerAlign: "center", align: "center", header: "区域" });
            }
            else {
                createGrid.push({ field: "NAME", headerAlign: "center", align: "center", header: "站名" });
            }
            createGrid.push({
                headerAlign: "center", align: "center", header: "平均", columns: [
                    { field: "AVGDRP", headerAlign: "center", align: "center", header: "暴雨量(mm)", allowsort: true },
                    { field: "AVGDRPBILI", headerAlign: "center", align: "center", header: "占年降水量比例", allowsort: true }
                ]
            });
            createGrid.push({
                field: "SURDRP", headerAlign: "center", align: "center", header: "年最大", columns: [
                    { field: "MAX", headerAlign: "center", align: "center", header: "暴雨量(mm)", allowsort: true },
                    { field: "MAXBILI", headerAlign: "center", align: "center", header: "占年降水量比例", allowsort: true }
                ] });
            createGrid.push({ field: "MAXTOTALYEAR", headerAlign: "center", align: "center", header: "总量最大年份", allowsort: true });

            grid.set({
                columns: createGrid
            });
        }

    <script>
        function Chart(chartName, data) {
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.clear();
            var startYear = Number(GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            var textStr = startYear + "-" + endYear + "年" + $.data(myData, "TYPE")+"平均暴雨总量";
         
            var YData = [];
            AData = [];
            for (var num = 0; num < data.length; num++) {
                AData.push(data[num].NAME);
                YData.push(data[num].AVGDRP);
            }
            option = {
                title: {
                    left: 'center',
                    text: textStr,//node.NAME + '多年' + $.data(myData, "MTYPE")+'暴雨级别频次对比'
                },
                tooltip: {
                    trigger: 'axis',
                    //axisPointer: {
                    //    type: 'shadow'
                    //}
                },
                // 更改图例默认颜色(依次应用)
                color: ['#26A0D2', '#44CB90', '#EFBB43', '#E63D45', '#6A5ACD', '#F5DEB3', '#E9967A', "#FFA500", "#FF69B4", "#FF00FF", "#9400D3", "#FFDAB9", "#6959CD", "#FF3030", "#E066FF", "#FF34B3", "#FF1493", "#FF4500", "#F4A460",
                    "#EEAD0E", "#53868B", "#79CDCD", "#66CDAA", "#43CD80", "#00FF00", "#FFFF00", "#8B658B", "#FF3030", "#FF00FF", "#EE00EE", "#8B0000", "#8B008B", "#008B8B", "#90EE90"],
                // color: ['#009BC2', '#FFC000', '#00C54E', '#FF2600'],
                // color: ['#7ea8ee', '#91CC75', '#FAC858', '#EE6666'],
                // //这里设置柱状图上面的方块，名称跟series里的name保持一致
                legend: {
                    // orient: 'vertical',
                    x: 'center',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    //left: '41%',
                    padding: [30, 0, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                    // data: legendData
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    // boundaryGap: true 表示x轴两边留白
                    boundaryGap: true,
                    axisTick: {
                        alignWithLabel: true
                    },
                    data: AData,//'特大暴雨', '大暴雨', '暴雨']
                },
                yAxis: {
                    name: "（次）",
                    type: 'value',
                    min: 0,
                    splitNumber: 4,
                    max: function (e) {
                        return e.max + 5;
                    }
                },
                series: [{
                    type: 'bar',
                    barMaxWidth: 20,
                    zlevel: 10,
                    data: YData,
                    itemStyle: {
                        normal: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: '#2D8DED'
                                }, {
                                    offset: 1,
                                    color: '#5ED8FB'
                                }]
                            },
                            barBorderRadius: [30, 30, 0, 0],

                    },
                    label: {
                        normal: {
                            show: true,
                            position: 'top',
                            formatter: function (params) {
                                return params.value;
                            },
                            textStyle: {
                                color: '#2D8DED', //color of value
                                fontSize: 14
                            }
                        }

                }]

            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
