            { STCD: "63404000", STNM: "青浦南门", PAID: "10018", AREANAME: "青松片" },
            { STCD: "63404100", STNM: "陈坊桥", PAID: "10018", AREANAME: "青松片" },
            { STCD: "63404500", STNM: "南桥", PAID: "10015", AREANAME: "浦东片" },
            { STCD: "63425700", STNM: "祝桥", PAID: "10015", AREANAME: "浦东片" },
            { STCD: "63405480", STNM: "嘉定南门", PAID: "10014", AREANAME: "嘉宝北片" },
            { STCD: "63425900", STNM: "罗店", PAID: "10014", AREANAME: "嘉宝北片" },
        ];
        $(function () {

                loadAreaStationHtml();
            });

            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间

                // 选择器打开之后首先显示的视图

        function loadAreaStationHtml() {
            var data = stationArr;
            data = data.filter(function (item) {
                return item.PAID == $.data(myData, "AID");
            });
            var strHtml = '<ul class="ui-choose choose-type-right" id="choseZhan">';
            data.forEach(function (item, _index) {
                var cls = "";
                if (_index == 0) {
                    $.data(myData, "STCD", item.STCD);
                    cls = ' class="selected" ';
                }
                strHtml += '<li ' + cls + '><span id="' + item.STCD + '">' + item.STNM + '</span></li>';
            });
            strHtml += '</ul>';
            $("#zhanDiv").html(strHtml);
            search();
            $('#choseZhan li').click(function () {
                var f = this;
                $('#choseZhan li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });

                    var astnm = $('#choseArea .selected').find("span").html();
                }
                $.data(myData, "STCD", stcd);
                search();
            });
        }
        //场次数据
        function search() {
            if (Number(GetObj("endYear").value) >= Number(GetObj("startYear").value)) {
                var stime = GetObj("startYear").value + "-01-01 00:00:00";
                var etime = GetObj("endYear").value + "-12-31 23:59:59";
                var spanHours = $("#hourList .selected").find('span').attr('name');
                var strWhere = {
                    STCD: $.data(myData, "AID"),//$.data(myData, "STCD"),
                    STIME: stime,
                    ETIME: etime,
                    AREADPR: mini.get('areadrp').getValue(),
                    AREADRPBEFORE24: mini.get('areadrpbefore24').getValue(),
                    HOUR: spanHours,
                };
                GetJosns("ST_RAINSTORMFREQUENCYNAMESel", strWhere, "RSel");
            }
        }
        function searchData() {
            var stime = GetObj("startYear").value + "-01-01 00:00:00";
            var etime = GetObj("endYear").value + "-12-31 23:59:59";
            var strWhere = {
                BYSTCD: $.data(myData, "AID"),
                STIME: stime,
                ETIME: etime,
                STCD: $.data(myData, "STCD")
            };
            GetJosns("SWZZ_FLOODTIDEDATA_ST_RAINSTORMFREQUENCY_RDBZSWZFSel", strWhere, "WaterSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "RSel") {
                if (data.total > 0) {
                $("#chartPie").html("");
                //暴雨场次
                $.data(myData, "BYDATA", data.data);
                searchData();
                }
                else{
                    grid.setData([]);
                    $("#chartPie").html("<div style='width: 100%;text-align: center; line-height: 350px;font-size: 20px;'>无降雨场次</div>");
                }
            }
            else if (typeID == "WaterSel") {
                var byData = $.data(myData, "BYDATA");
                var dataAll = [];
                var dataResult = [];
                for (var num = 0; num < byData.length; num++) {
                    var dataTemp = data.data.filter(function (res) {
                        return res.BYSTCD == byData[num].STCD &&
                            res.BGTM == byData[num].BGTM &&
                            res.ENDTM == byData[num].ENDTM
                    });
                    if (dataTemp.length > 0) {
                        var item = dataTemp[0];
                        item.AREADRP = byData[num].AREADRP;
                        item.AREADRPBEFORE24 = byData[num].AREADRPBEFORE24;
                        var sStr = convertToDate(item.BGTM).format('yyyy年M月d日H时');
                        var eStr = convertToDate(item.ENDTM).format('M月d日H时');
                        item.TMSTR = sStr + '~' + eStr;
                        dataResult.push(item);
                        dataAll.push([byData[num].AREADRP, item.UPZZF]);
                    }
                }
                chartNHXNew('chartPie', dataAll);
                grid.setData(dataResult);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var rowIndex = e.rowIndex;
            if (field == "BGTM") {
                var stm = mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
                var etm = mini.formatDate(convertToDate(record.ENDTM), 'yyyy-MM-dd HH:mm:ss');
                var url = "/SHSWTZ/yqtzNew/RainstormWaterBYSWLine.html";
                var titleText = $('#choseArea .selected span').html() + "内面雨量和" + $('#choseZhan .selected span').html() + "站水位过程";
                var strParam = "STCD@" + $.data(myData, "STCD") + ",STM@" + stm + ",ETM@" + etm + ",AID@" + $.data(myData, "AID") + ",titleText@" + titleText;
                var str = "<a  style='cursor:pointer;' onclick='lookData(\"" + strParam + "\",\"" + url + "\",\"" + titleText + "\",\"60%\",565,\"true\")'>" + stm + "</a>";
                e.cellHtml = str;
            }
            if (field == 'TMSTR') {
                var stm = mini.formatDate(convertToDate(record.BGTM), 'yyyy-MM-dd HH:mm:ss');
                var etm = mini.formatDate(convertToDate(record.ENDTM), 'yyyy-MM-dd HH:mm:ss');
                var url = "/SHSWTZ/yqtzNew/RainstormWaterBYSWLine.html";
                var titleText = $('#choseArea .selected span').html() + "内面雨量和" + $('#choseZhan .selected span').html() + "站水位过程";
                var strParam = "STCD@" + $.data(myData, "STCD") + ",STM@" + stm + ",ETM@" + etm + ",AID@" + $.data(myData, "AID") + ",titleText@" + titleText;
                var str = "<a  style='cursor:pointer;' onclick='lookData(\"" + strParam + "\",\"" + url + "\",\"" + titleText + "\",\"60%\",565,\"true\")'>" + value + "</a>";
                e.cellHtml = str;
            }
        }

        function chartNHXNew(ChartName, dataAll) {
            var titleText = $('#choseArea .selected span').html() + "内面雨量和" + $('#choseZhan .selected span').html() + "站水位涨幅相关线";
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            var listSeries = myChart.getOption();
            // if(listSeries!=undefined){
            //     listSeries.dataset[0].source=dataAll;
            //     myChart.setOption(listSeries);
            // }else{
            var configMethod = { method: 'polynomial', order: 2 };
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            echarts.registerTransform(ecStat.transform.regression);
            var data = dataAll;
            option = {
                dataset: [
                    {
                        source: data
                    },
                    {
                        transform: {
                            type: 'ecStat:regression',
                            config: configMethod
                        }
                    }
                ],
                title: {
                    text: titleText,
                    textStyle: {
                        //color: '#497DBB',
                        color: '#414C59',
                        // fontSize: 12,
                        // fontWeight: 'normal'
                    },
                    // subtext: subtext,
                    subtextStyle: {
                        color: '#497DBB',
                        fontSize: 16,
                        fontWeight: 'normal'
                    },
                    left: 'center',
                    top: 16
                },
                tooltip: {
                    show: false,
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                xAxis: {
                    name: "雨量(mm)",
                    splitLine: {
                        lineStyle: {
                            type: 'dashed'
                        }
                    },
                    // splitNumber: 20,
                    // interval: 2,
                    axisLabel: {
                        formatter: function (v) {
                            return v.toFixed(1);
                        }
                    },
                },
                yAxis: {
                    name: "水位涨幅(m)",
                    // interval: 0.1,
                    min: function (res) {
                        var minValue = res.min - 0.1;
                        if (res.min > 0) {
                            minValue = 0;
                        }
                        return minValue;
                    },
                    max: function (res) {
                        var maxValue = res.max + 0.1;
                        return maxValue;
                    },
                    splitLine: {
                        lineStyle: {
                            type: 'dashed'
                        }
                    },
                    axisLabel: {
                        formatter: function (v) {
                            return v.toFixed(1);
                        }
                    },
                },
                series: [
                    {
                        name: '',
                        type: 'scatter',
                        color: '#111D2C',//'#497DBB',
                        symbolSize: 8,
                        itemStyle: {
                            borderColor: '#4D7EB8'
                        },
                    },
                    {
                        name: '增水',
                        type: 'line',
                        smooth: true,
                        datasetIndex: 1,
                        symbolSize: 0.1,
                        symbol: 'circle',
                        color: 'red',//#497DBB
                        lineStyle: {
                            //type: 'dashed'
                        },
                        label: {
                            show: true,
                            fontSize: 16,
                        },
                        labelLayout: { dx: 50 },
                        encode: { label: 2, tooltip: 1 }
                    }
                ]
            };
            myChart.setOption(option);
            //}
        }
    </script>
