
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代表站暴雨极值查询</title>
    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <script src="/Common/boot.js" type="text/javascript"></script>
    <link href="/Common/CSS/ui-choose.css" rel="stylesheet" />

    <link href="/Common/CSS/bootstrap.min.css" rel="stylesheet">
    <link href="/Common/CSS/font-awesome.min.css" rel="stylesheet">
    <link href="/Common/CSS/bootstrap-datetimepicker.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .onlytab {
            margin: 0px;
            padding: 0px;
            padding-top: 5px;
            padding-bottom: 5px;
            width: 100% !important;
        }

            .onlytab li {
                list-style: none;
                border: 1px #3291f9 solid;
                float: left;
                background-color: White;
                width: auto !important;
                height: 30px;
                font: 14px/30px "arial";
                text-align: center;
            }

        #zhanList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }

        #areaList ul li {
            width: auto !important;
            margin-right: 10px;
            margin-top: 10px;
            list-style: none;
            float: left;
        }

        .btn {
            /*padding: 3px 12px;*/
            position: absolute;
            left: 365px;
            margin-top: 3px;
        }

        .mini-button {
            position: absolute;
            left: 365px;
            margin-top: 3px;
        }

        .searchContext {
            height: 40px;
            line-height: 40px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }

        ul.ui-choose > li {
            width: auto;
        }
    </style>
</head>
<body>
    <!-- 头部搜索框start -->
    <div style="width:100%;">
        <div class="mini-toolbar" style="position:relative;height:90px;">
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;分类规则：</div>
                <ul class="ui-choose choose-type-right" id="choseType">
                    <li class="selected">
                        <span>代表站</span>
                    </li>
                    <li>
                        <span>行政分区</span>
                    </li>
                    <li>
                        <span>水利片区</span>
                    </li>
                </ul>
            </div>
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;年份选择：</div>
                <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                    <input id="startYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <span style="float:left;">—</span>
                <div class="input-group" style="width:110px;float:left;margin-left:4px;">
                    <input id="endYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <ul class="ui-choose choose-type-right" id="choseMNLX" style="position:absolute;left:350px;margin-top: 0px;">
                    <li class="selected">
                        <span id="HOUR">小时最大</span>
                    </li>
                    <li>
                        <span id="24H">24小时最大</span>
                    </li>
                    <li>
                        <span id="DAY">日最大</span>
                    </li>
                </ul>
                <a class="mini-button" onclick="search();" style="position:absolute;left:640px;margin-top: 0px;">查询</a>
                <a class="mini-button" onclick="Exp()" id="expButton" style="position:absolute;left:700px;margin-top: 0px;display:none;">导出报表</a>
            </div>
        </div>
    </div>
    <!-- 头部搜索框end -->
    <!-- 表格start -->
    <div id="grid1" class="mini-datagrid"
         style="width: 100%;margin-top:1px;height: -webkit-calc(100% - 90px);height: -moz-calc(100% - 90px);height: calc(100% - 90px);"
         allowalternating="true" borderstyle="border-right:0;" idfield="ID" sortmode="client" sizelist="[15,20,30,50]"
         pagesize="15" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
         ondrawcell="ondrawcell">
    </div>
    <!-- 表格end -->
    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        // 将html标签解析为miniui控件，解析后，才能使用mini.get获取到控件对象
        // 在window.onload时间点会自动调用
        mini.parse();
        var myData = [];
        //实例化表格对象
        // mini.get("grid1") 根据id获取控件对象
        var grid = mini.get("grid1");
        var dataResult = {};
        $.data(myData, "TYPE","代表站");

        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 2;
            $.data(myData, "STYPE", "1");
            bindTable();
            //默认加载数据
            search();
            $('#choseMNLX li').click(function () {
                var f = this;
                $('#choseMNLX li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var str = $(this).find('span').attr("id");

                if (str == "HOUR") {
                    $.data(myData, "STYPE", "1");
                } else if (str == "DAY") {
                    $.data(myData, "STYPE", "2");
                } else if (str == "24H") {
                    $.data(myData, "STYPE", "24");
                } else {
                    $.data(myData, "STYPE", str);
                }
                search();
            });
            $('#choseType li').click(function () {
                var f = this;
                $('#choseType li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var str = $(this).find('span').html();
                $.data(myData, "TYPE", str);
                bindTable();
                search();
            });
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
        });
        function search() {
            var strWhere = {
                TYPE: $.data(myData, "TYPE"),
                STYPE: $.data(myData, "STYPE"),
                STIME: GetObj("startYear").value + "-01-01 00:00:00",
                ETIME: GetObj("endYear").value + "-12-31 23:59:59"
            };
            GetJosns("RAINSTORMVALUENAME_SSelNew", strWhere, "Sel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                grid.setData(data.data);
            }
            else if (typeID == "Update") {
                ShowMsg(data.Message);
                search();
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            if (field == "STNM") {
                if ($.data(myData, "STYPE") != 24) {
                    // e.cellStyle="background:#0099CC;";
                    if (value != undefined) {
                        var str = "<a onclick='lookData(\"STCD@" + record.STCD + ",STYPE@" + $.data(myData, "STYPE") + "\",\"/SHSWTZ/yqtz/jiangyuliang.html\",\"" + record.STNM + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                        e.cellHtml = str;
                    }
                }

            }
            if (field == "TM" || field == "XQ_TM" || field == "XQ_FTM") {
                var str = "-";
                if (value != undefined) {
                    str = convertToDate(value).format("yyyy-MM-dd HH:mm");
                    //console.error(str);
                    var tm = new Date(str).format("yyyy年M月d日H时");
                    str = "<a onclick='lookData(\"TM@" + str + "\",\"/SHSWTZ/yqtz/daibiaozhanPolygonCounty.html?TM=" + str + "&STYPE=" + $.data(myData, "STYPE") + "\",\"" + tm + "面雨量\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + str + "</a>";
                    e.cellHtml = str;
                }
            }

            if (field == "TIME") {
                if (value != undefined) {
                    var str = new Date(value).format("yyyy-MM-dd HH:mm");
                    str = "<a onclick='lookData(\"TM@" + str + "\",\"/SHSWTZ/yqtz/daibiaozhanPolygonCounty.html?TM=" + str + "&STYPE=" + $.data(myData, "STYPE") + "\",\"" + tm + "面雨量\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + str + "</a>";
                    e.cellHtml = str;

                }

            }
        }
        function look() {
            lookData('', '/SHSWTZ/yqtz/daibiaozhanPolygonCounty.html?STYPE=' + $.data(myData, "STYPE"), '面雨量', '60%', '70%', 'true')
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var stype = $.data(myData, "STYPE");
            var name = "代表站";
            if (stype == "1") {
                name += "小时累计最大降雨量"
            } else if (stype == "2") {
                name += "日累计最大降雨量"
            }
            name += "列表"
            ExportExcel(name, columns, data);
        }
        function bindTable() {
            var type = $.data(myData, "TYPE");
            var columns = [];
            if (type == "代表站")//所有暴雨
            {
                //columns.push({ field: "COUNTIES", header: "行政分区", headerAlign: "center", align: "center", allowSort: true });
                columns.push({ field: "STNM", header: "站点", headerAlign: "center", align: "center", allowSort: true });
            } else {
                columns.push({ field: "STNM", header: "区域", headerAlign: "center", align: "center", allowSort: true });
            }
            columns.push(
                {
                    field: "", header: "全年", headerAlign: "center", align: "center",
                    columns: [
                        { field: "DRP", header: "降雨量(mm)", headerAlign: "center", align: "center", allowSort: true, width: 60, decimalPlaces:"1",dataType:"float"},
                        { field: "TM", header: "发生时间", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                    ]
                },
                {
                    field: "", header: "汛期", headerAlign: "center", align: "center",
                    columns: [
                        { field: "DRP_XQ", header: "降雨量(mm)", headerAlign: "center", align: "center", allowSort: true, width: 60, decimalPlaces: "1", dataType: "float"},
                        { field: "XQ_TM", header: "发生时间", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                    ]
                },
                {
                    field: "", header: "非汛期", headerAlign: "center", align: "center",
                    columns: [
                        { field: "DRP_FXQ", header: "降雨量(mm)", headerAlign: "center", align: "center", allowSort: true, width: 60, decimalPlaces: "1", dataType: "float"},
                        { field: "XQ_FTM", header: "发生时间", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                    ]
                }
            );
            grid.set({ columns: columns });
        }
    </script>
</body>
</html>
