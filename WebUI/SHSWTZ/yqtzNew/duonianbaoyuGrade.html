    <script>
        mini.parse();
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        var dataMonth = [];
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }

            var _year = new Date().format("yyyy");
            GetObj("startYear").value =1978;
            GetObj("endYear").value = _year - 2;
            $.data(myData, "MTYPE", "");
            searchStation();
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            $('#choseGrade li').click(function () {
                var f = this;
                $('#choseGrade li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");
                if (grade == "全部") {
                    grade = null;
                }
                $.data(myData, "GRADE", grade);
                bindTable();
            });
            for (var m = 1; m <= 12; m++) {
                dataMonth.push({ id: m, text: m });
            }
            mini.get('comboStart').setData(dataMonth);
            mini.get('comboEnd').setData(dataMonth);
        });
        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                if (item[0].COUNTIESID == "100071") {
                    dataResult.push({ ID: "10007", NAME: "浦东新区", PID: "1" });
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                } else if (item[0].COUNTIESID == "100072") {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                }
                else {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                }
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
            var YEARS = [];
            var startYear = Number( GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            for (var num = startYear; num <= endYear; num++) {
                YEARS.push(num.toFixed(0));
            }
            $.data(myData, "YEARS", YEARS);
            var node = tree.getSelectedNode();
            var sMonth = mini.get('comboStart').getValue();
            var eMonth = mini.get('comboEnd').getValue();
            var strWhere = {
                STCD: node.ID,
                YEARS: YEARS.join(','),
                SMONTH: sMonth,
                EMONTH: eMonth
            };
            GetJosns("duonianbaoyuGradeNum", strWhere, "SelNum");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "data", dataResult);
                bindTable();
            }
        }
        function bindTable() {
            var dataResult = [];
            dataResult = $.data(myData, "data");
            var grade = $.data(myData, "GRADE");
            var columns = [];
            columns.push({ field: "YEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true });
            if (grade == null) {
                columns.push({ field: "QIANG", header: "特大暴雨", headerAlign: "center", align: "center", allowSort: true });
                columns.push({ field: "ZHONG", header: "大暴雨", headerAlign: "center", align: "center", allowSort: true });
                columns.push({ field: "RUO", header: "暴雨", headerAlign: "center", align: "center", allowSort: true });
            }
            else if (grade == "RUO") {
                columns.push({ field: "RUO", header: "暴雨", headerAlign: "center", align: "center", allowSort: true });
            }
            else if (grade == "ZHONG") {
                columns.push({ field: "ZHONG", header: "大暴雨", headerAlign: "center", align: "center", allowSort: true });
            }
            else if (grade == "QIANG") {
                columns.push({ field: "QIANG", header: "特大暴雨", headerAlign: "center", align: "center", allowSort: true });
            }
            columns.push({ field: "TOTAL", header: "总数", headerAlign: "center", align: "center", allowSort: true });
            grid.set({ columns: columns });
            loadChart(dataResult);

            //总计
            //var item = { YEAR: "总计", TOTAL: SumJson(dataResult, 'TOTAL'), RUO: SumJson(dataResult, 'RUO'), ZHONG: SumJson(dataResult, 'ZHONG'), QIANG: SumJson(dataResult, 'QIANG')};
            //dataResult.unshift(item);
            grid.setData(dataResult);
        }
        function onSelectNode(e) {
            search();
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;
            if (field == "YEAR") {
                if (value == "总计") {
                    e.rowStyle = "background:#FFF1DF !important;";
                }
            }
            if (field == "QIANG" || field == "ZHONG" || field == "RUO") {
                var node = tree.getSelectedNode();
                var STCD = node.ID;
                var YEAR = record.YEAR;
                var STIME = YEAR + "-01-01 00:00:00";
                var ETIME = YEAR + "-12-31 23:59:59";
                var NAME = node.NAME;
                var TYPE = column.header.replaceAll(" ", "").replaceAll("\r", "").replaceAll("\n", "").replaceAll("\t", "");
                var strTitle = NAME + YEAR + "年" + TYPE;
                var str = "<a onclick='lookData(\"STCD@" + STCD + ",STIME@" + STIME + ",ETIME@" + ETIME + ",TYPE@" + TYPE+"\",\"/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html\",\"" + strTitle + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                if (value == undefined) {
                    str = "-";
                }
                if (Number(value) == 0) {
                    str = 0;
                }
                e.cellHtml = str;
            }
            if (field == "TOTAL") {
                var node = tree.getSelectedNode();
                var STCD = node.ID;
                var YEAR = record.YEAR;
                var STIME = YEAR + "-01-01 00:00:00";
                var ETIME = YEAR + "-12-31 23:59:59";
                var NAME = node.NAME;
                var TYPE = null;
                var strTitle = NAME + YEAR + "年" + TYPE;
                var str = "<a onclick='lookData(\"STCD@" + STCD + ",STIME@" + STIME + ",ETIME@" + ETIME + ",TYPE@" + TYPE + "\",\"/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html\",\"" + strTitle + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                if (value == undefined) {
                    str = "-";
                }
                if (Number(value) == 0) {
                    str = 0;
                }
                e.cellHtml = str;
            }
        }
        function onDrawSummaryCell(e) {
            var result = e.result;
            var grid = e.sender;
            //服务端汇总计算
            var JSONArray = grid.getData();
            if (e.field == "YEAR") {
                var s = "<span style='color:Brown;'>";
                s += "<div class='classColor' style='color:#0080ff;font-size:14px;'>合计</div>";
                s += "</span>";
                e.cellHtml = s;
            }
            else if (e.field !== "YEAR") {
                if (JSONArray.length > 0) {
                    var totalNum = SumJson(JSONArray, e.field);
                    console.error("总数：",totalNum);
                    var s = "<span style='color:Brown;'>";
                    s += "<div class='classColor' style='color:#0080ff;font-size:14px;'>" + totalNum + "</div>";
                    s += "</span>";
                    e.cellHtml = s;
                }
            }
        }
        function onSTCDChanged(e) {
            search();
        }
        // ul li 选择切换行政分区和水利分区
        function OnClickTitle2(objID, objPathName) {//选择类型
            $("#sysList").css("display", "block");
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            var left = 215;
            var titleType = "汛期";
            var sMonth = 6, eMonth = 9;
            $("#sysList").css("display", "none");
            if (objID == "TitleLiYear") {
                sMonth = 1;
                eMonth = 12;
                titleType = "";
            }
            else if (objID == "TitleLimonth") {
                sMonth = 1;
                eMonth = 1;
                left = 95;
                titleType = sMonth + "月";
                $("#sysList").css("display", "block");
            }
            else if (objID == "TitleLibefore") {
                sMonth = 1;
                eMonth = 5;
                left = 155;
                titleType = "汛前";
            }
            else if (objID == "TitleLidoing") {
                sMonth = 6;
                eMonth = 9;
                left = 215;
                titleType = "汛期";
                
            }
            else if (objID == "TitleLiafter") {
                sMonth = 10;
                eMonth = 12;
                left = 275;
                titleType = "汛后";
            }
            $.data(myData, "MTYPE", titleType);
            mini.get('comboStart').setValue(sMonth);
            mini.get('comboEnd').setValue(eMonth);
            $("#titleType").html(titleType);
            $("#sysList").css("left", left + "px");
            if (objID != "TitleLimonth") {
                search();
            }
        }
        function loadChart(data) {
            Chart('BY_charts', data);
        }
        function Chart(chartName, data) {
            var grade = $.data(myData, "GRADE");
            var AData = ['特大暴雨', '大暴雨', '暴雨'];
            if (grade == "RUO") {
                AData = ['暴雨'];
            }
            else if (grade == "ZHONG") {
                AData = ['大暴雨'];
            }
            else if (grade == "QIANG") {
                AData = ['特大暴雨'];
            }
            var node = tree.getSelectedNode();
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.clear();
            var legendData = $.data(myData, "YEARS");

            var startYear = Number(GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            var textStr = node.NAME + startYear + "-" + endYear + "年" + $.data(myData, "MTYPE");
            if (grade == null) {
                textStr += "总暴雨场次";
            } else {
                textStr += AData[0] +"场次";
            }
            var YData = [];
            AData = [];
            for (var num = 0; num < data.length; num++) {
                AData.push(data[num].YEAR);
                var field = grade == null ? "TOTAL" : grade;
                YData.push(data[num][field]);

            }
            option = {
                title: {
                    left: 'center',
                    text: textStr,//node.NAME + '多年' + $.data(myData, "MTYPE")+'暴雨级别频次对比'
                },
                tooltip: {
                    trigger: 'axis',
                    //axisPointer: {
                    //    type: 'shadow'
                    //}
                },
                // 更改图例默认颜色(依次应用)
                color: ['#26A0D2', '#44CB90', '#EFBB43', '#E63D45', '#6A5ACD', '#F5DEB3', '#E9967A', "#FFA500", "#FF69B4", "#FF00FF", "#9400D3", "#FFDAB9", "#6959CD", "#FF3030", "#E066FF", "#FF34B3", "#FF1493", "#FF4500", "#F4A460",
                    "#EEAD0E", "#53868B", "#79CDCD", "#66CDAA", "#43CD80", "#00FF00", "#FFFF00", "#8B658B", "#FF3030", "#FF00FF", "#EE00EE", "#8B0000", "#8B008B", "#008B8B", "#90EE90"],
                // color: ['#009BC2', '#FFC000', '#00C54E', '#FF2600'],
                // color: ['#7ea8ee', '#91CC75', '#FAC858', '#EE6666'],
                // //这里设置柱状图上面的方块，名称跟series里的name保持一致
                legend: {
                    // orient: 'vertical',
                    x: 'center',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    //left: '41%',
                    padding: [30, 0, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                   // data: legendData
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    // boundaryGap: true 表示x轴两边留白
                    boundaryGap: true,
                    axisTick: {
                        alignWithLabel: true
                    },
                    data: AData,//'特大暴雨', '大暴雨', '暴雨']
                },
                yAxis: {
                    name: "（次）",
                    type: 'value',
                    min: 0,
                    splitNumber: 4,
                    max: function (e) {
                        return e.max + 5;
                    }
                },
                series: [{
                    type: 'bar',
                    barMaxWidth: 20,
                    zlevel: 10,
                    data: YData,
                    itemStyle: {
                        normal: {
                            color: {
                                type: 'linear',
                                x: 0,
                                y: 0,
                                x2: 0,
                                y2: 1,
                                colorStops: [{
                                    offset: 0,
                                    color: '#2D8DED'
                                }, {
                                    offset: 1,
                                    color: '#5ED8FB'
                                }]
                            },
                            barBorderRadius: [30, 30, 0, 0],
                        }
                    },
                    label: {
                        normal: {
                            show: true,
                            position: 'top',
                            formatter: function (params) {
                                return params.value;
                            },
                            textStyle: {
                                color: '#2D8DED', //color of value
                                fontSize: 14
                            }
                        }
                    },

                }]
            };
            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var node = tree.getSelectedNode();
            var name = node.NAME + "多年暴雨级别对比";
            ExportExcel(name, columns, data);
        }
        function XunOK() {
            $("#sysList").css("display", "none");
            var sMonth=mini.get('comboStart').getValue();
            var eMonth = mini.get('comboEnd').getValue();
            var titleType = $.data(myData, "MTYPE");
            if (titleType.indexOf("月") > -1) {
                if (sMonth == eMonth) {
                    $.data(myData, "MTYPE", sMonth + "月");
                } else {
                    $.data(myData, "MTYPE", sMonth + "-" + eMonth+"月");
                }
            }
            if (sMonth == eMonth) {
                eMonth = sMonth + 1;
            }
            
            search();
        }
    </script>
</body>
</html>
