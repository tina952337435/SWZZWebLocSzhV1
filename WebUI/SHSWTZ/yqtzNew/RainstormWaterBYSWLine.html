    <script>
        mini.parse();
        var myData = [];
        var shTitle = "全市";
        var grid = mini.get("grid1");
        function SetData(data) {
            $.data(myData, "AID", data.AID);
            $.data(myData, "STCD", data.STCD);
            $.data(myData, "STIME", data.STM);
            $.data(myData, "ETIME", data.ETM);
            $.data(myData, "titleText", data.titleText);
            searchData();
        }
        $(function () {
            $("#fit2").hide();
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
        });
        function searchData() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '数据加载中...'
            });
            var stime = $.data(myData, "STIME");
            var etime = $.data(myData, "ETIME");
            var strWhere = {
                STCD: $.data(myData, "STCD"),
                STIME: stime,
                ETIME: etime,
                AID: $.data(myData, "AID"),
            };
            GetJosns("ST_RAINSTORMFREQUENCYWaterRiverSel", strWhere, "WaterSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "WaterSel") {
                var strNote = [
                    { "name": "时间", "codename": "TM", "tableV": "1", "isShow": true, "width": "20%" },
                    { "name": "水位", "codename": "UPZ", "tableV": "1", "isShow": true, "width": "20%" },
                    { "name": "雨量", "codename": "DRP", "tableV": "1", "isShow": true, "width": "20%" }
                ];
                var LineColor = ['#0000FF', '#00FF00', '#ff0909', '#FFA500'];
                chartSW('chartPie', data.data, strNote, LineColor, '水位');
                grid.setData(data.data);
                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var rowIndex = e.rowIndex;
            if (field == "TM") {
                var stm = mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
                e.cellHtml = stm;
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = $.data(myData, "titleText");
            ExportExcel(name, columns, data);
        }
        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            //$(".fit").css("display", "none");
            //$("#" + objFit).css("display", "block");
            $(".fit").hide();
            $("#" + objFit).show();
        }
        /* 过程线绘制 过程线 水位
            * ChartName画图控件名称
            * dataS数据对象，数据格式json
            * strNote数据说明，数据类型数组，数据格式
            * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示过程线
            * [
            * {"name": "时间","codename": "TM","tableV":"1","isShow":true},
            * {"name": "闸上水位","codename": "UPZ","tableV":"1","isShow":true},
            * {"name": "闸下水位","codename": "DWZ","tableV":"1","isShow":true},
            * {"name": "警戒水位","codename": "WRZ","tableV":"0","isShow":false}
            * ]
            */
        function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
            var titleText = $.data(myData, "titleText");
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var ShowSelected = {};
            var m = new Array();
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            //获得最大值最小值
            //var max_min=GetSort(chartValue);
            var option = {
                //backgroundColor: '#100E19',
                title: {
                    text: titleText,
                    left: "center"
                },
                noDataLoadingOption: {
                    text: '暂无数据',
                    effect: 'bubble',
                    effectOption: {
                        effect: {
                            n: 0 //气泡个数为0
                        }
                    },
                    textStyle: {
                        fontSize: 30,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    //showDelay: 0,
                    //hideDelay: 50,
                    //transitionDuration: 0,
                    //backgroundColor: 'rgba(255,255,255,0.9)',
                    //borderColor: '#4040FB',
                    //borderRadius: 8,
                    //borderWidth: 2,
                    //padding: 10,
                    //textStyle: {
                    //    color: '#000000'
                    //},
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#1B2B2F',
                        fontSize: 12,
                        padding: [35, 0]
                    },
                    selected: ShowSelected
                    //selected: {
                    //    '警戒水位': false
                    //}

                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: true,
                        data: chartTM,
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        name: "水位(m)",
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#cbcccc',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;

                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiajngenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            //  console.error("间隔",jiange,jiangenew);
                            var Xc = 100;
                            if (jiange < 25) {
                                Xc = 30;
                            }
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            var minValue;
                            if ((jiangenew - jiange) % 2 == 0) {
                                minValue = value.min - (jiangenew - jiange) / Xc;
                            }
                            else {
                                minValue = value.min - (jiangenew - jiange - 1) / Xc;
                            }
                            // console.error("minValue", minValue);
                            return minValue;
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);
                            var Xc = 100;
                            if (jiange < 25) {
                                Xc = 30;
                            }
                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            var maxValue;
                            if ((jiangenew - jiange) % 2 == 0) {
                                maxValue = value.max + (jiangenew - jiange) / Xc;
                            }
                            else {
                                maxValue = value.max + (jiangenew - jiange + 1) / Xc;
                            }
                            // console.error("maxValue",maxValue);
                            return maxValue;
                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            },
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0,
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    },
                    {
                        name: "雨量(mm)",
                        type: 'value',
                        // splitNumeber: 5,
                        scale: true, //是否自动计算最大最小值。
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        },
                        splitLine: {
                            show: false,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            var minValue;
                            if ((jiangenew - jiange) % 2 == 0) {
                                minValue = value.min - (jiangenew - jiange) / 200;
                            }
                            else {
                                minValue = value.min - (jiangenew - jiange - 1) / 200;
                            }
                            if (minValue < 0) {
                                minValue = 0;
                            }
                            return minValue;
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;
                            var maxValue;
                            if ((jiangenew - jiange) % 2 == 0) {
                                maxValue = value.max + (jiangenew - jiange) / 200;
                            }
                            else {
                                maxValue = value.max + (jiangenew - jiange + 1) / 200;
                            }
                            if (Number(maxValue) <= 1) {
                                maxValue = 5;
                            }
                            return maxValue;
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0,
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }

                        if ("雨量" == chartName[j] || "流域面平均雨量" == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                yAxisIndex: 1,
                                barWidth: 5,
                                barMaxWidth: 20,
                                label: {
                                    normal: {
                                        show: false,
                                        position: 'top',
                                        formatter: function (params) {
                                            var val = "";
                                            if (SetNull(params.value) != "") {
                                                if (Number(params.value) != 0) {
                                                    val = params.value;
                                                }
                                            }
                                            return val;
                                        },
                                        color: "#00A3FF"
                                    },
                                },
                                smooth: true,
                                itemStyle: {
                                    normal: {
                                        show: true,
                                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{

                                        borderWidth: 0,
                                        barBorderRadius: [15, 15, 0, 0],
                                    },
                                    emphasis: {
                                        shadowBlur: 10,
                                        shadowColor: 'rgba(105,123, 214, 0.7)'
                                    }
                                }
                            }
                            serie.push(item);
                        } else if (chartName[j] == "水位") {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: false,
                                itemStyle: {
                                    normal: {
                                        color: '#000',
                                        label: {
                                            show: true,
                                            color: '#000000',//气泡中字体颜色
                                        }
                                    }
                                },

                                    data: [
                                        { type: 'max', name: '最大值' },
                                        // { type: 'min', name: '最小值' },
                                    ],
                                    symbolSize: 80,
                                    label: {
                                        offset: [0, 0],
                                        textStyle: {
                                            color: "#000000",
                                            fontSize: 13,
                                        },
                                    },
                                },
                                symbol: "none",
                                smooth: true,
                                itemStyle: {
                                    color: "rgba(20,253,129,1)",
                                    //borderColor: "#646ace",
                                    //borderWidth: 1
                                },
                                areaStyle: { //区域填充样式
                                    normal: {
                                        //线性渐变，前4个参数分别是x0,y0,x2,y2(范围0~1);相当于图形包围盒中的百分比。如果最后一个参数是‘true’，则该四个值是绝对像素位置。
                                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                            offset: 0,
                                            color: "rgba(20,253,129,.3)"
                                        },
                                        {
                                            offset: 1,
                                            color: "rgba(25,163,223, 0)"
                                        }
                                        ], false),
                                        shadowColor: 'rgba(20,253,129, 0.5)', //阴影颜色
                                        shadowBlur: 20 //shadowBlur设图形阴影的模糊大小。配合shadowColor,shadowOffsetX/Y, 设置图形的阴影效果。
                                    }
                                },
                            }
                            serie.push(item);
                        } else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: true,
                                symbol: "none",
                                smooth: true,
                                itemStyle: {
                                    borderWidth: 1
                                },
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
