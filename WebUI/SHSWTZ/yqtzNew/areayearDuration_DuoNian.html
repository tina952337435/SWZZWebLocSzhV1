        mini.parse();

        $(function () {
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 2;

            GetObj("startYear1").value = 1978;
            GetObj("endYear1").value = 2000;
            GetObj("startYear2").value = 2001;
            GetObj("endYear2").value = _year - 2;

            searchStation();

                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
        });

        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                if (item[0].COUNTIESID == "100071") {
                    dataResult.push({ ID: "10007", NAME: "浦东新区", PID: "1" });
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                } else if (item[0].COUNTIESID == "100072") {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                }
                else {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                }
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
            var node = tree.getSelectedNode();
            var startYear = GetObj("startYear").value + "-01-01 00:00:00";
            var endYear = GetObj("endYear").value + "-12-31 23:59:59";

            $("#title1").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + node.NAME + "暴雨平均历时(h)");
            $("#title2").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + node.NAME + "汛期、非汛期不同级别暴雨平均历时");
            $("#title3").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + node.NAME + "暴雨不同历时场次变化(h)");

            var strWhere = {
                STCD: node.ID,
                STIME: startYear,
                ETIME: endYear
            };
            GetJosns("ST_RAINSTORMFREQUENCYNAMESel", strWhere, "SelNum");
        }

        function searchqujian() {
            $("#showTime").css("display", "none");
            var yearArr = [];
            var strYears = "";
            $("#qujianUL li").each(function (_index) {
                var rowIndex = (_index + 1);
                var startYear = parseInt(GetObj("startYear" + rowIndex).value);
                var endYear = parseInt(GetObj("endYear" + rowIndex).value);
                for (var num = startYear; num <= endYear; num++) {
                    strYears += num + ",";
                }
                yearArr.push([startYear, endYear]);
            });
            $.data(myData, "years", yearArr);
            if (strYears != "") strYears = strYears.substring(0, strYears.length - 1);

            var data = $.data(myData, "data");

            var gradeArr = ["暴雨", "大暴雨", "特大暴雨"];
            var gradeValueArr = [[50, 100], [100, 200], [200, 10000000]];

            var dataResult = [];
            for (var num = 0; num < gradeArr.length; num++) {
                var dataTemp = data.filter(function (e) {
                    return e.DRP24 >= gradeValueArr[num][0] && e.DRP24 < gradeValueArr[num][1];
                });
                var item = { GRADE: gradeArr[num] };
                for (var y = 0; y < yearArr.length; y++) {
                    var dataTempT = dataTemp.filter(function (e) {
                        var bgtm = new Date(convertToDate(e.BGTM));
                        var year = bgtm.getFullYear();
                        return year >= yearArr[y][0] && year <= yearArr[y][1];
                    });
                    
                    var totalHour = SumJson(dataTempT, 'HOUR');
                    item["YEAR" + (y + 1)] = (totalHour / dataTempT.length).toFixed(1);
                }
                dataResult.push(item);
            }
            ChartNew("BY_charts", dataResult);

            dataResult = [];
            var hourArr = [[0, 1], [1, 3], [3, 6], [6, 12], [12, 24], [24, 100000000]];
            for (var num = 0; num < hourArr.length; num++) {
                var str = hourArr[num][0] + "-" + hourArr[num][1] + "h";
                if (num == 0) {
                    str = "<=" + hourArr[num][1] +"h";
                }
                if (num == hourArr.length - 1) {
                    str = ">" + hourArr[num][0] +"h";
                }
                item = { HOUR: str };
                var dataTemp = data.filter(function (e) {
                    return e.HOUR > hourArr[num][0] && e.HOUR <= hourArr[num][1];
                });
                console.error(dataTemp);
                for (var y = 0; y < yearArr.length; y++) {
                    var dataTempT = dataTemp.filter(function (e) {
                        var bgtm = new Date(convertToDate(e.BGTM));
                        var year = bgtm.getFullYear();
                        return year >= yearArr[y][0] && year <= yearArr[y][1];
                    });

                    var dataTotal = data.filter(function (e) {
                        var bgtm = new Date(convertToDate(e.BGTM));
                        var year = bgtm.getFullYear();
                        return year >= yearArr[y][0] && year <= yearArr[y][1];
                    });
                    var bili= ((dataTempT.length / dataTotal.length) * 100).toFixed(1);
                    item["YEARBILI" + (y + 1)] = bili;
                }
                dataResult.push(item);
            }
            ChartHOUR("hour_charts", dataResult);
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = data.data;
                $.data(myData, "data", dataResult);
                loadHtml(dataResult);
                searchqujian();
            }
            else if (typeID == "SelNumArea") {
                var dataResult = data.data;
                loadAreaHtml(dataResult);
            }
        }
        function onSelectNode(e) {
            search();
        }
        function loadHtml(data) {
            var data1 = [];
            var gradeArr = ["暴雨", "大暴雨", "特大暴雨"];
            var gradeValueArr = [[50, 100], [100, 200], [200, 10000000]];
            for (var num = 0; num < gradeArr.length; num++) {
                var dataTemp = data.filter(function (e) {
                    return e.DRP24 >= gradeValueArr[num][0] && e.DRP24 < gradeValueArr[num][1];
                });

                var item = { GRADE: gradeArr[num] };
                //统计汛期，非汛期
                var total = SumJson(dataTemp, 'HOUR'), totalXQ = 0, totalFXQ = 0;//暴雨总时长，暴雨汛期时长，暴雨非汛期时长；
                var number = dataTemp.length, numberXQ = 0, numberFXQ = 0;
                var maxHour = 0, maxHourQX = 0, maxHourFQX = 0;
                var minHour = 100000000000, minHourQX = 100000000000, minHourFQX = 100000000000;
                item = { GRADE: gradeArr[num] };
                for (var h = 0; h < dataTemp.length; h++) {
                    var bgtm = new Date(convertToDate(dataTemp[h].BGTM));
                    var xqStime = new Date(bgtm.getFullYear() + "-06-01 00:00:00");
                    var xqEtime = new Date(bgtm.getFullYear() + "-09-30 23:59:59");

                    var fxqStime1 = new Date(bgtm.getFullYear() + "-01-01 00:00:00");
                    var fxqEtime1 = new Date(bgtm.getFullYear() + "-05-31 23:59:59");
                    var fxqStime2 = new Date(bgtm.getFullYear() + "-01-01 00:00:00");
                    var fxqEtime2 = new Date(bgtm.getFullYear() + "-09-30 23:59:59");

                    if (bgtm >= xqStime && bgtm <= xqEtime) {
                        totalXQ += dataTemp[h].HOUR;
                        numberXQ++;
                        if (maxHourQX < dataTemp[h].HOUR) {
                            maxHourQX = dataTemp[h].HOUR;
                        }
                        if (minHourQX > dataTemp[h].HOUR) {
                            minHourQX = dataTemp[h].HOUR;
                        }
                    }
                    if ((bgtm >= fxqStime1 && bgtm <= fxqEtime1) || (bgtm >= fxqStime2 && bgtm <= fxqEtime2)) {
                        totalFXQ += dataTemp[h].HOUR;
                        numberFXQ++;
                        if (maxHourFQX < dataTemp[h].HOUR) {
                            maxHourFQX = dataTemp[h].HOUR;
                        }
                        if (minHourFQX > dataTemp[h].HOUR) {
                            minHourFQX = dataTemp[h].HOUR;
                        }
                    }
                    if (maxHour < dataTemp[h].HOUR) {
                        maxHour = dataTemp[h].HOUR;
                    }
                    if (minHour > dataTemp[h].HOUR) {
                        minHour = dataTemp[h].HOUR;
                    }
                }
                item.HOURQ = (total / number).toFixed(1);
                item.HOURXQ = (totalXQ / numberXQ).toFixed(1);
                item.HOURFXQ = (totalFXQ / numberFXQ).toFixed(1);
                item.HOURQMAX = maxHour;
                item.HOURXQMAX = maxHourQX;
                item.HOURFXQMAX = maxHourFQX;
                item.HOURQMIN = minHour;
                item.HOURXQMIN = minHourQX;
                item.HOURFXQMIN = minHourFQX;
                data1.push(item);
            }
            Chart('fxq_charts', data1);
        }
        function searchTIME() {
            var dis = $("#showTime").css("display");
            if (dis == 'none') {

        function addqujian() {
            var rowIndex = $("#qujianUL li").length;

            html += '<div class="searchTitle" style = "width:80px;padding-top: 8px;" >&nbsp;&nbsp;&nbsp;区间' + (rowIndex + 1) + '：</div >';
            html += '<div class="input-group" style="width:110px;float:left;margin-right:4px;">';
            html += '<input id="startYear' + (rowIndex + 1) + '" class="form-control" value="开始" readonly>';
            html += '<div class="input-group-addon">';
            html += '<i class="fa fa-calendar" aria-hidden="true"></i>';
            html += '</div>';
            html += '</div>';
            html += '<span style="float:left;">—</span>';
            html += '<div class="input-group" style="width:110px;float:left;margin-left:4px;">';
            html += '<input id="endYear' + (rowIndex + 1) + '" class="form-control" value="结束" readonly>';
            html += '<div class="input-group-addon">';
            html += '<i class="fa fa-calendar" aria-hidden="true"></i>';
            html += '</div>';
            html += '</div>';
            html += '</li>';

            $("#qujianUL").append(html);

            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
        }

    <script>
        function Chart(chartName, data) {
            var node = tree.getSelectedNode();
            var legendData = ["汛期", "非汛期"];
            var legendDataF = ["HOURXQ","HOURFXQ"];
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.clear();
            var xData = ["暴雨", "大暴雨", "特大暴雨"];
            var text = "";
            option = {
                title: {
                    left: 'center',
                    text: text
                },
                tooltip: {
                    trigger: 'axis',
                    //axisPointer: {
                    //    type: 'shadow'
                    //}
