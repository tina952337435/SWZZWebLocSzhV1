    <script>
        mini.parse();
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            $.data(myData, "TIMER", "");
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 2;
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            searchStation();
            $.data(myData, "SMONTH", null);
            $.data(myData, "EMONTH", null);
            $.data(myData, "SMONTHF", null);
            $.data(myData, "EMONTHF", null);
        });
        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                if (item[0].COUNTIESID == "100071") {
                    dataResult.push({ ID: "10007", NAME: "浦东新区", PID: "1" });
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                } else if (item[0].COUNTIESID == "100072") {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                }
                else {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                }
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }

        

        function search() {
            STGRDColumn();
            var node = tree.getSelectedNode();
            var startYear = Number(GetObj("startYear").value)+"-01-01 00:00:00";
            var endYear = Number(GetObj("endYear").value) + "-12-31 23:59:59";
            var strWhere = {
                STCD: node.ID,
                STIME: startYear,
                ETIME: endYear,
                SMONTH: $.data(myData, "SMONTH"),
                EMONTH: $.data(myData, "EMONTH"),
                SMONTHF: $.data(myData, "SMONTHF"),
                EMONTHF: $.data(myData, "EMONTHF"),
                AREA: node.PID,
                MONTH: $.data(myData, "MONTH"),
            };
            GetJosns("TOTALSURFACERAINSTORMSel", strWhere, "SelNum");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = data.data;
                $.data(myData, "data", dataResult);
                loadChart();
                var totalYear = SumJson(dataResult, "TOTALDRP");
                var totalSur = SumJson(dataResult, "SURDRP");
                var avgYear = totalYear / dataResult.length;
                var avgSur = totalSur / dataResult.length;
                dataResult.push({ YEAR: "平均", TOTALDRP: avgYear.toFixed(1), SURDRP: avgSur.toFixed(1)});
                grid.setData(dataResult);
            }
        }
        function onSelectNode(e) {
            search();
        };
        function onSTCDChanged(e) {
            search();
        }
        var chartField = "SURDRP";
        function loadChart() {
            var data = $.data(myData, "data");
            var dataX = [], dataY = [];
            for (var num = 0; num < data.length; num++) {
                dataX.push(data[num].YEAR);
                dataY.push(data[num][chartField]);
            }
            chartBarPie('BY_charts', dataX, dataY);
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var node = tree.getSelectedNode();
            var name = node.NAME + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年面暴雨总量变化以及占当年面降雨的比例"
            ExportExcel(name, columns, data);
        }
        function OnClickTitle2(objID, name) {
            $.data(myData, "MONTH", null);
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            var SMONTH, EMONTH, SMONTHF, EMONTHF;

            $("#BY_charts").show();
            $("#grid1").css("height", " calc(100% - 410px)");
            if (objID == "TitleQuan") {
                $.data(myData, "TIMER", "");
                $("#sysList").css("display", "none");
                $("#sysListFei").css("display", "none");
                $.data(myData, "SMONTH", null);
                $.data(myData, "EMONTH", null);
                $.data(myData, "SMONTHF", null);
                $.data(myData, "EMONTHF", null);
                
            }
            else if (objID == "TitleLidoing") {
                $.data(myData, "TIMER", "汛期");
                $("#sysListFei").css("display", "none");
                //$("#sysListMonth").css("display", "none");
                var isDisplay = $("#sysList").css("display");
                //if (isDisplay == "none") {
                //    $("#sysList").css("display", "block");
                //} else {
                //    $("#sysList").css("display", "none");
                //}
                SMONTH = mini.get('comboStart').getValue();
                EMONTH = mini.get('comboEnd').getValue();
                SMONTHF = mini.get('comboStart').getValue();
                EMONTHF = mini.get('comboEnd').getValue();
                $.data(myData, "SMONTH", SMONTH);
                $.data(myData, "EMONTH", EMONTH);
                $.data(myData, "SMONTHF", SMONTHF);
                $.data(myData, "EMONTHF", EMONTHF);
            }
            else if (objID == "TitleLiafter") {
                $.data(myData, "TIMER", "非汛期");
                $("#sysList").css("display", "none");
                //var isDisplay = $("#sysListFei").css("display");
                //if (isDisplay == "none") {
                //    $("#sysListFei").css("display", "block");
                //} else {
                //    $("#sysListFei").css("display", "none");
                //}
                SMONTH = mini.get('comboStartFei').getValue();
                EMONTH = mini.get('comboEndFei').getValue();
                SMONTHF = mini.get('comboStartFei1').getValue();
                EMONTHF = mini.get('comboEndFei1').getValue();
                $.data(myData, "SMONTH", SMONTH);
                $.data(myData, "EMONTH", EMONTH);
                $.data(myData, "SMONTHF", SMONTHF);
                $.data(myData, "EMONTHF", EMONTHF);
            }
            else if (objID == "TitleLiMonth") {
                $("#BY_charts").hide();
                $.data(myData, "TIMER", "每月");
                $("#sysListFei").css("display", "none");
                $("#sysList").css("display", "none");
                $.data(myData, "MONTH", "MONTH");

                $("#grid1").css("height", " calc(100% - 60px)");
            }
            search();
        }
        function XunOK() {
            $.data(myData, "ISFLOOD", true);
            $("#sysList").css("display", "none");
            search();
        }
        function feiXunOK() {
            $.data(myData, "ISFLOOD", false);
            $("#sysListFei").css("display", "none");
            search();
        }
        //获取表头---2022-01-05
        function STGRDColumn() {
            var createGrid = [];
            if ($.data(myData, "MONTH") == null) {
                var TIMER = $.data(myData, "TIMER");
                createGrid.push({ type: "indexcolumn", header: "序号", headerAlign: "center", align: "center" });
                createGrid.push({ field: "YEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true });
                var header = "年降水量(mm)";
                if (TIMER == "汛期")//所有暴雨
                {
                    header = "汛期降水量(mm)";
                } else if(TIMER == "非汛期") {
                    header = "非汛期降水量(mm)";
                }
                createGrid.push({ field: "TOTALDRP", header: header, headerAlign: "center", align: "center", allowSort: true });
                createGrid.push({ field: "SURDRP", header: "暴雨总量(mm)", headerAlign: "center", align: "center", allowSort: true });
                createGrid.push({ field: "DRPP", header: "暴雨总量占累计雨量的比例(%)", headerAlign: "center", align: "center", allowSort: true });
                
            } else {
                createGrid.push({ type: "indexcolumn", headerAlign: "center", align: "center", header: "序号", width: "50" });
                createGrid.push({ field: "YEAR", headerAlign: "center", align: "center", header: "月份" });
                createGrid.push({ field: "TOTALDRP", headerAlign: "center", align: "center", header: "月降水量(mm)", allowsort: true });
                createGrid.push({ field: "SURDRP", headerAlign: "center", align: "center", header: "暴雨总量(mm)", allowsort: true });
                createGrid.push({ field: "DRPP", headerAlign: "center", align: "center", header: "暴雨总量占累计雨量的比例(%)", allowsort: true });
            }
            grid.set({
                columns: createGrid
            });
        }

        var rbl = mini.get("rbl");        rbl.on("valuechanged", function (e) {
            chartField = e.value;
            loadChart();
        });
    </script>

                            type: 'png',
                            lang: ['点击保存']
                        }
                    }
                },
                grid: {
                    top: '15%',
                    left: '3%',
                    right: '1%',
                    bottom: '8%',
                },
                xAxis: [
                    {
                        type: 'category',
                        data: dataX,
                        axisTick: {
                            show: false // 是否显示坐标轴轴线
                        },
                        axisLabel: {
                            color: '#282828'
                        },
                        splitLine: {
                            show: false
                        },
                        boundaryGap: true,
                        axisLine: { //坐标轴轴线相关设置。
                            show: true,
                            inside: false,
                            lineStyle: {
                                color: '#000'
                            }
                        }
                    },
                ],
                yAxis: [{
                    type: 'value',
                    max: function (e) {
                        return e.max + e.max/10;
                    },
                    min: 0,
                    splitNumber: 4,
                    splitLine: { show: true },
                    axisLabel: { //坐标轴刻度标签的相关设置。
                        show: true,
                        textStyle: {
                            color: '#737373',
                        }
                    },
                    axisLine: {
                        show: true,
                    },
                    axisTick: {
                        show: false,
                    },
                    splitLine: {
                        lineStyle: {
                            color: 'rgba(131,101,101,0.2)',
                            type: 'dashed',
                        }
                    },
                    show: true,
                }],
                series: seriesData
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html>
