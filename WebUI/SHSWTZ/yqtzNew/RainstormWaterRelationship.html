    <script>
        mini.parse();
        var myData = [];
        var shNo = "310000";
        var shTitle = "全市";
        var grid = mini.get("grid1");
        var tree=mini.get('tree1');
        var dataMonth = [];
        var ATYPE = '水利片区';
        var areaNameStr="青松片,嘉宝北片,浦东片";
        var stcdNameStr = "63404000,63404100,63404500,63425700,63405480,63425900";//青浦南门、陈坊桥、南桥、祝桥、嘉定南门、罗店
        var stationArr=[
            {STCD:"63404000",STNM:"青浦南门",PAID:"10018",AREANAME:"青松片"},
            {STCD:"63404100",STNM:"陈坊桥",PAID:"10018",AREANAME:"青松片"},
            {STCD:"63404500",STNM:"南桥",PAID:"10015",AREANAME:"浦东片"},
            {STCD:"63425700",STNM:"祝桥",PAID:"10015",AREANAME:"浦东片"},
            {STCD:"63405480",STNM:"嘉定南门",PAID:"10014",AREANAME:"嘉宝北片"},
            {STCD:"63425900",STNM:"罗店",PAID:"10014",AREANAME:"嘉宝北片"},
        ];
        $(function () {
            $.data(myData, "AID", '10014');
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 2010;
            GetObj("endYear").value = _year-1;
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            loadAreaStationHtml();
            $('#choseArea li').click(function () {
                var f = this;
                $('#choseArea li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var AID = $(this).find("span").attr("id");
                $.data(myData, "AID", AID);
                loadAreaStationHtml();
            });
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
         });
         function loadAreaStationHtml() {
            var data =stationArr;
            data = data.filter(function (item) {
                    return item.PAID==$.data(myData, "AID");
                });
            var strHtml = '<ul class="ui-choose choose-type-right" id="choseZhan">';
            data.forEach(function (item, _index) {
                var cls = "";
                if (_index == 0) {
                    $.data(myData, "STCD", item.STCD);
                    cls = ' class="selected" ';
                }
                strHtml += '<li ' + cls + '><span id="' + item.STCD + '">' + item.STNM + '</span></li>';
            });
            strHtml += '</ul>';
            $("#zhanDiv").html(strHtml);
            search();
            $('#choseZhan li').click(function () {
                var f = this;
                $('#choseZhan li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var stcd = $(this).find("span").attr("id");
                if (stcd.indexOf("All") > -1) {
                    var astcd = $('#choseArea .selected').find("span").attr("id");//分区的编号或者全市的编号
                    var astnm = $('#choseArea .selected').find("span").html();
                }
                $.data(myData, "STCD", stcd);
                search();
            });
        }
        //场次数据
        function search() {
            if (Number(GetObj("endYear").value) >= Number(GetObj("startYear").value)) {
                var stime = GetObj("startYear").value + "-01-01 00:00:00";
                var etime = GetObj("endYear").value + "-12-31 23:59:59";
                var strWhere = {
                    STCD: $.data(myData, "AID"),//$.data(myData, "STCD"),
                    STIME: stime,
                    ETIME: etime,
                    AREADPR:mini.get('areadrp').getValue()
                };
                GetJosns("ST_RAINSTORMFREQUENCYNAMESel", strWhere, "RSel");
            }
        }
        function searchData() {
            var node = tree.getSelectedNode();
                var stime=new Date( convertToDate(node.BGTM)).format('yyyy-MM-dd HH:mm:ss');
                var etime=new Date(convertToDate(node.ENDTM)).format('yyyy-MM-dd HH:mm:ss');
                var strWhere = {
                    STCD: $.data(myData, "STCD"),
                    STIME: stime,
                    ETIME: etime,
                    AID: $.data(myData, "AID"),
                };
                GetJosns("ST_RAINSTORMFREQUENCYWaterRiverSel", strWhere, "WaterSel");
            }
        function JosnSel(data, typeID) {
            if (typeID == "SSel") {
                $.data(myData, "StationData", data.data);
            }
            else if (typeID == "ASel") {
                $.data(myData, "AreaData", data.data);
                var dataResult = $.data(myData, "AreaData");
                dataResult = dataResult.filter(function (item) {
                    return item.ATYPE == ATYPE && item.AID != '100071' && item.AID != '100072';
                });
                var strHtml = '<ul class="ui-choose choose-type-right" id="choseArea">';
                var AID="";
                dataResult.forEach(function (item, index) {
                    if (areaNameStr.indexOf(item.AREANAME) > -1) {
                        var clsStr='';
                        if(item.AREANAME=='嘉宝北片'){
                            clsStr=' class="selected"';
                            AID=item.AID
                        }
                        strHtml += '<li '+clsStr+'><span  id="' + item.AID + '">' + item.AREANAME + '</span></li>';
                    }
                });
                $.data(myData, "AID",AID);
                strHtml += '</ul>';
                $("#areaDiv").html(strHtml);
                var AreaStationData = $.data(myData, "AreaStationData");
                var stcsArr=[];
                AreaStationData = AreaStationData.filter(function (item) {
                    if (item.PAID == AID) {
                        stcsArr.push(item.STCD);
                    }
                });
                //根据分区编号筛选站点
                $.data(myData, "STCDS", stcsArr);
                loadAreaStationHtml();
                $('#choseArea li').click(function () {
                    var f = this;
                    $('#choseArea li').each(function (index, item) {
                        this.className = this == f ? 'selected' : '';
                    });
                    var stcd = $(this).find("span").attr("id");
                    $.data(myData, "AID", stcd);
                    var stcsArr = [];
                    var AreaStationData = $.data(myData, "AreaStationData");
                    AreaStationData = AreaStationData.filter(function (item) {
                        if (item.PAID == stcd) {
                            stcsArr.push(item.STCD);
                        }
                    });
                    //根据分区编号筛选站点
                    $.data(myData, "STCDS", stcsArr);
                    loadAreaStationHtml();
                });
            }
            else if (typeID == "RSel") {
                //暴雨场次
                var dataResultNew=[];
                var dataResult=data.data;
                $("#areaTitle").html($('#choseArea .selected span').html().trim()+"暴雨场次("+dataResult.length+")");
                for (var num = dataResult.length-1; num >=0; num--) {
                    var item=dataResult[num];
                    var bgtm = new Date(convertToDate(item.BGTM)).format('yyyy年M月d日');
                    var grade="";
                    if(item.DRP24>=50&&item.DRP24<100){
                        grade="暴雨";
                    }else if(item.DRP24>=100&&item.DRP24<200){
                        grade="大暴雨";
                    }else if(item.DRP24>=200){
                        grade="特大暴雨";
                    }
                    item.treeText=bgtm+grade;
                    dataResultNew.push(item);
                }
                tree.loadList(dataResultNew);
                tree.select(0);
            }
            else if (typeID == "BSel") {
                $.data(myData, "AreaStationData", data.data);
            }
            else if(typeID=="WaterSel"){
                console.error(typeID,data.data);
                var dataAll=[];
                for(var num=0;num<data.data.length;num++){
                    dataAll.push([data.data[num].DRP,data.data[num].UPZCHA]);
                }
                if (dataAll.length > 0) {
                    chartNHXNew('chartPie', dataAll);
                    grid.setData(data.data);
                }
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var rowIndex = e.rowIndex;
            if (field == "TM") {
                var stm = mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
                e.cellHtml = stm;
            }
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var name = shTitle;
            name += GetObj("startYear").value + "年至" + GetObj("endYear").value + "年暴雨频次";
            ExportExcel(name, columns, data);
        }
        function onSelectNode(e) {
            searchData();
        }
        function chartNHXNew(ChartName, dataAll) {
            var titleText=$('#choseZhan .selected span').html()+"暴雨水位关系";
            var configMethod = { method: 'polynomial', order: 2 };
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            echarts.registerTransform(ecStat.transform.regression);
            var data = dataAll;
            option = {
                dataset: [
                    {
                        source: data
                    },
                    {
                        transform: {
                            type: 'ecStat:regression',
                            config: configMethod
                        }
                    }
                ],
                title: {
                    text: titleText,
                    textStyle: {
                        color: '#497DBB',
                        // fontSize: 12,
                        // fontWeight: 'normal'
                    },
                    // subtext: subtext,
                    subtextStyle: {
                        color: '#497DBB',
                        fontSize: 16,
                        fontWeight: 'normal'
                    },
                    left: 'center',
                    top: 16
                },
                tooltip: {
                    show:false,
                    trigger: 'axis',
                    axisPointer: {
                        type: 'cross'
                    }
                },
                xAxis: {
                    name:"雨量(mm)",
                    splitLine: {
                        lineStyle: {
                            type: 'dashed'
                        }
                    },
                    // splitNumber: 20,
                    // interval: 2,
                    axisLabel: {
                        formatter: function (v) {
                            return v.toFixed(0);
                        }
                    },
                },
                yAxis: {
                    name:"水位涨幅(m)",
                    // interval: 0.1,
                    min: function (res) {
                        var minValue = res.min - 0.1;
                        if (res.min > 0) {
                            minValue = 0;
                        }
                        return minValue;
                    },
                    max: function (res) {
                        var maxValue = res.max + 0.1;
                        return maxValue;
                    },
                    splitLine: {
                        lineStyle: {
                            type: 'dashed'
                        }
                    },
                    axisLabel: {
                        formatter: function (v) {
                            return v.toFixed(1);
                        }
                    },
                },
                series: [
                    {
                        name: '风速',
                        type: 'scatter',
                        color:'#497DBB',
                    },
                    {
                        name: '增水',
                        type: 'line',
                        smooth: true,
                        datasetIndex: 1,
                        symbolSize: 0.1,
                        symbol: 'circle',
                        color:'#497DBB',
                        lineStyle: {
                            type: 'dashed'
                        },
                        label: {
                            show: true,
                            fontSize: 16,
                        },
                        labelLayout: { dx: 50 },
                        encode: { label: 2, tooltip: 1 }
                    }
                ]
            };
            myChart.setOption(option);
        }
