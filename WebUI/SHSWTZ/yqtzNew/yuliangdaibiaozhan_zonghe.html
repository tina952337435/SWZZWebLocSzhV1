
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨量代表站</title>
    <script src="/Common/boot.js" type="text/javascript"></script>
    <!-- 引入echarts.js -->
    <script src="/Common/Scripts/echarts.min.js"></script>
    <script src="/Common/Scripts/ChartJs.js"></script>

    <link href="/Common/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="/Common/CSS/bootstrap.min.css" rel="stylesheet">
    <link href="/Common/CSS/font-awesome.min.css" rel="stylesheet">
    <link href="/Common/CSS/bootstrap-datetimepicker.min.css" rel="stylesheet">
    <style type="text/css">
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-size: 14px;
        }

        .onlytab {
            margin: 0px;
            padding: 0px;
            /*padding-top: 10px;*/
            padding-bottom: 5px;
            width: 100% !important;
        }

            .onlytab li {
                list-style: none;
                border: 1px #3291f9 solid;
                float: left;
                background-color: White;
                width: 100px !important;
                height: 34px;
                font: 14px/34px "arial";
                text-align: center;
            }

                .onlytab li:nth-child(2) {
                    border-left: 0px;
                }

                .onlytab li:nth-child(3) {
                    border-left: 0px;
                }

                .onlytab li:nth-child(4) {
                    border-left: 0px;
                }

        .mini-toolbar {
            min-height: 55px;
            padding: 10px 20px;
            border: 0px !important;
        }

        .mini-buttonedit {
            height: 30px;
            margin-right: 10px;
        }

        .mini-buttonedit-border {
            height: 30px;
        }

        .mini-buttonedit-input {
            height: 30px;
            line-height: 30px;
        }

        .mini-buttonedit-button {
            height: 30px;
            line-height: 30px;
            border: 0px;
        }

        .mini-buttonedit-button-pressed, .mini-buttonedit-popup .mini-buttonedit-trigger, .mini-buttonedit-button-hover {
            background: none;
            border: 0px;
        }

        .searchTitle {
            width: 92px;
            float: left;
        }
    </style>
</head>

<body>
    <div style="width:210px;float:left;height:100%; margin-right: 5px;background: white;padding: 10px 10px;">
        <ul id="tree1" class="mini-tree" style="width:100%;height:100%;padding:5px;"
            showTreeIcon="true" textField="NAME"
            idField="ID" expandOnNodeClick="true" onnodeselect="onSelectNode" expandOnLoad="2"></ul>
    </div>
    <!-- 头部搜索框start -->
    <div style="width:100%;width:calc(100% - 215px);float:right;height:100%;background: white;">
        <div class="mini-toolbar">
            <div class="searchContext" style="line-height:35px;">
                <div class="searchTitle">&nbsp;&nbsp;&nbsp;年份选择：</div>
                <div class="input-group" style="width:110px;float:left;margin-right:4px;">
                    <input id="startYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
                <span style="float:left;">—</span>
                <div class="input-group" style="width:110px;float:left;margin-left:4px;">
                    <input id="endYear" class="form-control" value="请选择年份" readonly>
                    <div class="input-group-addon">
                        <i class="fa fa-calendar" aria-hidden="true"></i>
                    </div>
                </div>
            </div>
            <ul class="onlytab" id="onlytab2"
                style="width:200px !important;margin-left:20px;float:left;">
                <!-- onlyliHover 默认选择小时累计 -->
                <li id="TitleLimonth" onclick="OnClickTitle2(this.id,'每月')" class="onlyli onlyliHover start"
                    style="width: 60px !important;">每年</li>
                <li id="TitleLidoing" onclick="OnClickTitle2(this.id,'汛期')" class="onlyli"
                    style="width: 60px !important;">汛期</li>
                <li id="TitleLiafter" onclick="OnClickTitle2(this.id,'非汛期')" class="onlyli end"
                    style="width: 60px !important;">非汛期</li>
                <!--<li id="TitleLibefore" onclick="OnClickTitle2(this.id,'汛前')" class="onlyli"
        style="width: 60px !important;">汛前</li>
    <li id="TitleLidoing" onclick="OnClickTitle2(this.id,'汛期')" class="onlyli"
        style="width: 60px !important;">汛期</li>
    <li id="TitleLiafter" onclick="OnClickTitle2(this.id,'汛后')" class="onlyli end"
        style="width: 60px !important;">汛后</li>-->
            </ul>
            &nbsp;&nbsp;
            <a class="mini-button" onclick="Exp()" id="expButton" style="display:none;">导出报表</a>
        </div>

        <div id="YL_charts" style="height:350px;width:100%;background:white;"></div>

        <!-- echarts柱状图end -->
        <!-- 表格start -->
        <div id="grid1" class="mini-datagrid" style="width: 100%;height: -webkit-calc(100% - 400px);height: -moz-calc(100% - 400px);height: calc(100% - 400px);" allowalternating="true"
             borderstyle="border-right:0;" idfield="ID" sortmode="client" showemptytext="true" sizelist="[15,20,30,50]" pagesize="15"
             showpager="false" emptytext="暂无数据" alwaysshowemptytext="true" ondrawcell="ondrawcell">
            <div property="columns" showpager="false">
                <!-- allowsort="true" 表格中列名数据排序 注在上面的div中要添加sortmode="client" -->
                <div width="10%" field="YEAR" headeralign="center" align="center" allowsort="true">
                    年份
                </div>
                <!-- dataType="float":表示小数点  decimalPlaces="1"：小数点的位数 -->
                <div width="20%" field="DRP" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                     dataType="float">
                    日最大降雨量(mm)
                </div>
                <div width="20%" field="TM" headeralign="center" align="center" allowsort="true">
                    时间
                </div>
                <div width="20%" field="DRP_1" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                     dataType="float">
                    1小时最大降雨量(mm)
                </div>
                <div width="20%" field="TM_1" headeralign="center" align="center" allowsort="true">
                    开始时间
                </div>
                <div width="20%" field="DRP_24" headeralign="center" align="center" allowsort="true" decimalPlaces="1"
                     dataType="float">
                    24小时最大降雨量(mm)
                </div>
                <div width="20%" field="TM_24" headeralign="center" align="center" allowsort="true">
                    开始时间
                </div>
            </div>
        </div>
        <!-- 表格end -->
    </div>
   
  

    <script src="/Common/Scripts/bootstrap-datetimepicker.min.js"></script>
    <script src="/Common/Scripts/locales/bootstrap-datetimepicker.zh-CN.js"></script>
    <script>
        mini.parse();
        var grid = mini.get("grid1");
        var TYPE = GetQueryString('TYPE');
        var tree = mini.get("tree1");
        var myData = [];
        window.onload = function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var startYear = 1978;
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = startYear;// _year-10;
            GetObj("endYear").value = _year - 2;
            $.data(myData, "TYPE", "每月");
            searchStation();


            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
        }
        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function search() {
            var startYear = GetObj("startYear").value;
            var endYear = GetObj("endYear").value;
            var node = tree.getSelectedNode();
            var strWhere = {
                STCD: node.ID,
                STIME: startYear+"-01-01 00:00:00",
                STYPE: $.data(myData, "TYPE"),
                ETIME: endYear + "-12-31 23:59:59",
            };
            GetJosns("RAINSTORMVALUENAMEBySTCD_SSel", strWhere, "duonianbaoyumaxvalue");
        }

        function JosnSel(data, typeID) {
            if (typeID == "duonianbaoyumaxvalue") {
                loadChart(data.data);
            }
            else if (typeID == "Sel") {
                loadTree(data.data);
            }
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                if (item[0].COUNTIESID == "100071") {
                    dataResult.push({ ID: "10007", NAME: "浦东新区", PID: "1" });
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                } else if (item[0].COUNTIESID == "100072") {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                }
                else {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                }
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function onSelectNode(e) {
            search();
        }

        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var uid = record._uid;
            var rowIndex = e.rowIndex;
            if (field == "TM") {
                if (value != undefined) {
                    var str = new Date(convertToDate(value)).format("yyyy-MM-dd")
                    e.cellHtml = str;
                } else {
                    e.cellHtml = '-';
                }
            }
            if (field == "TM_1" || field == "TM_24") {
                if (value != undefined) {
                    var str = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm")
                    e.cellHtml = str;
                } else {
                    e.cellHtml = '-';
                }
            }
        }

        // ul li 选择切换行政分区和水利分区
        function OnClickTitle2(objID, objPathName) {//选择类型
            $.data(myData, "TYPE", objPathName);
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            $('#dataLoad').show();
            search();
        }

        function onSTCDChanged() {
            search();
        }

        function loadChart(data) {
            grid.setData(data);
            var strNote = [];
            var item = { "name": "名称", "codename": "YEAR", "tableV": "1", "isShow": true, "width": "30%" };
            strNote.push(item);
            item = { "name": "最大日量", "codename": "DRP", "tableV": "1", "isShow": true, "width": "30%" };
            strNote.push(item);
            item = { "name": "最大1h", "codename": "DRP_1", "tableV": "1", "isShow": false, "width": "30%" };
            strNote.push(item);
            item = { "name": "最大24h", "codename": "DRP_24", "tableV": "1", "isShow": false, "width": "30%" };
            strNote.push(item);
            chartBar('YL_charts', strNote, data);
        }
        function chartBar(chartName, strNote, data) {
            var node = tree.getSelectedNode();
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.clear();
            var type = $.data(myData, "TYPE");
            if ($.data(myData, "TYPE") == "每月") {
                type = "";
            }
            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            var ShowSelected = {};
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合
                    } else if (value1.name == "名称") {
                        if (value[value1.codename] != undefined) {
                            chartTM.push(value[value1.codename]);
                        }
                    } else if (value1.name == "时间名称") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            option = {
                title: {
                    left: 'center',
                    text: node.NAME + type+ '雨量极值分析'
                },
                tooltip: {
                    trigger: 'axis',
                    // 鼠标移动到柱状图会显示内容 竖线编程阴影
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                // 更改图例默认颜色(依次应用)
                // color: ['red', 'black', 'yellow', 'pink', 'cyan'],
                color: ['#4CABCE', '#91CC75', '#FAC858', '#EE6666'],
                // //这里设置柱状图上面的方块，名称跟series里的name保持一致
                legend: {
                    // orient: 'vertical',
                    x: 'center',      //可设定图例在左、右、居中
                    y: 'top',     //可设定图例在上、下、居中
                    // left: '41%',
                    padding: [30, 0, 0, 0],   //可设定图例[距上方距离，距右方距离，距下方距离，距左方距离]
                    data: chartName,
                    show: true,
                    selected: ShowSelected
                },
                grid: {
                    left: 30,
                    right: 30,
                    bottom: '3%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        saveAsImage: {}
                    }
                },
                xAxis: {
                    type: 'category',
                    // boundaryGap: true 表示x轴两边留白
                    boundaryGap: true,
                    axisTick: {
                        alignWithLabel: true
                    },
                    data: chartTM
                },
                yAxis: {
                    name: "雨量(mm)",
                    type: 'value'
                },
                series:
                    function () {
                        var serie = [];

                        for (var j = 0; j < chartName.length; j++) {
                            if (chartName[j] == "时间" || chartName[j] == "名称" || chartName[j] == "时间名称") //调过时间字段
                            {
                                continue;
                            }
                            var chartValue = []; 	//声明过线value集合
                            for (var i = 0; i < m.length; i++) {
                                if (isNaN(m[i][j]) == false) {
                                    chartValue.push(changeTwoDecimal(m[i][j], 1)); //循环价值
                                } else {
                                    chartValue.push(null); //循环价值
                                }
                            }

                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: 20,
                                itemStyle: {
                                    normal: {
                                        show: true,
                                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                            offset: 0,
                                            color: '#7ea8ee'
                                        }, {
                                            offset: 1,
                                            color: '#2dc5fe'
                                        }]),
                                        // barBorderRadius: 50,
                                        borderWidth: 0,
                                        label: {
                                            show: true,  //开启显示
                                            formatter: '{c}',  //显示数值
                                            position: 'top',
                                            textStyle: { //数值样式
                                                fontSize: 10
                                            }
                                        },
                                        barBorderRadius: [30, 30, 0, 0],
                                    },
                                    emphasis: {
                                        shadowBlur: 15,
                                        shadowColor: 'rgba(105,123, 214, 0.7)'
                                    }
                                }
                            }
                            serie.push(item);

                        };
                        return serie;
                    }()
            };
            // 使用刚指定的配置项和数据显示图表。
            myChart.setOption(option);
            // console.log(echarts.version)

            myChart.on('legendselectchanged', function (params) {
                let name = params.name
                let selected = params.selected
                let checked = selected[name]
                if (checked) {
                    for (let k in selected) {
                        if (k != name) {
                            selected[k] = false
                        }
                    }

                    myChart.setOption({
                        legend: {
                            selected: selected
                        }
                    })
                }
            });
        }


        function Exp() {
            var data = grid.data;
            var columns = grid.columns;

            var node = tree.getSelectedNode();
            var name = node.NAME;
            var type = $.data(myData, "TYPE");
            if (type == "每月") {
                type = "";
            }
            name += "多年" + type + "极值列表"
            ExportExcel(name, columns, data);
        }
    </script>
</body>

</html>
