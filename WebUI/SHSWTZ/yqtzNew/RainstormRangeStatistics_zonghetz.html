    <script>

        mini.parse();
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        var grid2 = mini.get("grid2");

        var myData = [];
        $(function () {
            createGrid();
            $.data(myData, "TIMER", null);
            $.data(myData, "TYPE", "");
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 2;
            searchStation();
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
        });

        function createGrid() {
            var columns = [
                { field: "GRADE", header: "暴雨等级", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                { field: "RUOAVG", header: "暴雨", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                { field: "ZHONGAVG", header: "大暴雨", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                { field: "QIANGAVG", header: "特大暴雨", width: "10%", headerAlign: "center", align: "center", allowSort: true },
            ];
            grid.set({
                columns: columns
            });

            columns = [
                { field: "GRADE", header: "暴雨级别", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                {
                    field: "", header: "局部(s≤1000k㎡)", width: "10%", headerAlign: "center", align: "center", allowSort: true, dataType: "float", decimalPlaces: "1", columns: [
                        { field: "NUMBER1", header: "场次", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                        { field: "BILI1", header: "占比", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                    ]
                },
                {
                    field: "", header: "小范围(1000k㎡＜s≤3500k㎡)", width: "10%", headerAlign: "center", align: "center", allowSort: true, columns: [
                        { field: "NUMBER2", header: "场次", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                        { field: "BILI2", header: "占比", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                    ]
                },
                {
                    field: "", header: "大范围(s＞3500k㎡)", width: "10%", headerAlign: "center", align: "center", allowSort: true, columns: [
                        { field: "NUMBER3", header: "场次", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                        { field: "BILI3", header: "占比", width: "10%", headerAlign: "center", align: "center", allowSort: true },
                    ]
                }
            ];
            grid2.set({
                columns: columns
            });
        }

        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                if (item[0].COUNTIESID == "100071") {
                    dataResult.push({ ID: "10007", NAME: "浦东新区", PID: "1" });
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                } else if (item[0].COUNTIESID == "100072") {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                }
                else {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                }
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
            var node = tree.getSelectedNode();
            var timer = $.data(myData, "TIMER") != null ? $.data(myData, "TIMER"):"";
            $("#title1").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer+ node.NAME+"各级别暴雨平均笼罩面积及占比");
            $("#title2").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer + node.NAME + "不同级别不同时段降水笼罩范围统计");
            $("#title3").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer+ node.NAME + "暴雨不同降水范围场次占比");
            $("#title4").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer+ node.NAME + "大暴雨不同降水范围场次占比");
            $("#title5").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer+ node.NAME + "特大暴雨不同降水范围场次占比");
            var startYear = Number(GetObj("startYear").value) + "-01-01 00:00:00";
            var endYear = Number(GetObj("endYear").value) + "-12-31 23:59:59";
            var strWhere = {
                STCD: node.ID,
                STIME: startYear,
                ETIME: endYear
            };
            GetJosns("ST_RAINSTORMFREQUENCYNAMESel", strWhere, "SelNum");
        }
        
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = data.data;
                $.data(myData, "data", dataResult);
                loadHtml(dataResult);

            }
        }

        function loadHtml() {
            var node = tree.getSelectedNode();
            var timer = $.data(myData, "TIMER") != null ? $.data(myData, "TIMER") : "";
            $("#title1").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer + node.NAME + "各级别暴雨平均笼罩面积及占比");
            $("#title2").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer + node.NAME + "不同级别不同时段降水笼罩范围统计");
            $("#title3").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer + node.NAME + "暴雨不同降水范围场次占比");
            $("#title4").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer + node.NAME + "大暴雨不同降水范围场次占比");
            $("#title5").html(GetObj("startYear").value + "-" + GetObj("endYear").value + "年" + timer + node.NAME + "特大暴雨不同降水范围场次占比");

            var data = $.data(myData, "data");
            var timer = $.data(myData, "TIMER");
            if (timer == "汛期") {
                data = data.filter(function (e) {
                    var bgtm = new Date(convertToDate(e.BGTM));
                    var year = bgtm.getFullYear();
                    var xqStime = new Date(bgtm.getFullYear() + "-06-01 00:00:00");
                    var xqEtime = new Date(bgtm.getFullYear() + "-09-30 23:59:59");
                    return bgtm >= xqStime && bgtm <= xqEtime;
                });
            }
            
            if (timer == "非汛期") {
                data = data.filter(function (e) {
                    var bgtm = new Date(convertToDate(e.BGTM));
                    var fxqStime1 = new Date(bgtm.getFullYear() + "-01-01 00:00:00");
                    var fxqEtime1 = new Date(bgtm.getFullYear() + "-05-31 23:59:59");
                    var fxqStime2 = new Date(bgtm.getFullYear() + "-10-01 00:00:00");
                    var fxqEtime2 = new Date(bgtm.getFullYear() + "-12-31 23:59:59");
                    if ((bgtm >= fxqStime1 && bgtm <= fxqEtime1) || (bgtm >= fxqStime2 && bgtm <= fxqEtime2)) {
                        return true;
                    }
                });
            }

            var data1 = [];
            var data2 = [];
            var gradeArr = ["暴雨", "大暴雨", "特大暴雨"];
            var gradeValueArr = [[50, 100], [100, 200], [200, 10000000]];
            var gradeFieldArr = ["RUO", "ZHONG", "QIANG"];
            var itemAvg = { GRADE: "笼罩面积" };
            var itemAvgbi = { GRADE: "面积占比" };
            var fanweiArr = ["s≤1000", "1000＜s≤3500", "s＞3500"];

            var dataPie = [];
            var colorArr = ["#73e363", "#fdbd2c", "#05eca7"];

           
            for (var num = 0; num < gradeArr.length; num++) {
                var item = { GRADE: gradeArr[num] };
                var dataTemp = data.filter(function (e) {
                    return e.DRP24 >= gradeValueArr[num][0] && e.DRP24 < gradeValueArr[num][1];
                });
                var totalArea = SumJson(dataTemp, 'AREA');
                var avgArea = 0;
                if (dataTemp.length > 0) {
                    avgArea = Math.round( totalArea / dataTemp.length,1);
                }
                itemAvg[gradeFieldArr[num] + "AVG"] = avgArea;
                itemAvgbi[gradeFieldArr[num] + "AVG"] = ((avgArea / 6890) * 100).toFixed(1)+"%";

                var dataTempT = dataTemp.filter(function (e) {
                    return e.AREA <= 1000;
                });
                item.NUMBER1 = dataTempT.length;
                item.BILI1 = dataTemp.length>0?((dataTempT.length / dataTemp.length) * 100).toFixed(1):0;
                
                dataTempT = dataTemp.filter(function (e) {
                    return e.AREA > 1000 && e.AREA <= 3500;
                });
                item.NUMBER2 = dataTempT.length;
                item.BILI2 = dataTemp.length > 0 ?((dataTempT.length / dataTemp.length) * 100).toFixed(1):0;

                dataTempT = dataTemp.filter(function (e) {
                    return e.AREA > 3500;
                });
                item.NUMBER3 = dataTempT.length;
                item.BILI3 = dataTemp.length > 0 ?((dataTempT.length / dataTemp.length) * 100).toFixed(1):0;
                data2.push(item);

                var itemPie = {
                    value: dataTemp.length,
                    name: gradeArr[num],
                    //bili: itemT.BILI1,
                    label: {
                        color: colorArr[num]
                    },
                    color: colorArr[num]
                };
                dataPie.push(itemPie);

                var dataPieArea = [
                    { value: item.NUMBER1, name: fanweiArr[0], percent: item.BILI1 },
                    { value: item.NUMBER2, name: fanweiArr[1], percent: item.BILI2 },
                    { value: item.NUMBER3, name: fanweiArr[2], percent: item.BILI3 },
                ];
                chartPieArea("pie_charts" + (num + 1), dataPieArea, data.length);
            }
            data1.push(itemAvg);
            data1.push(itemAvgbi);
            grid.setData(data1);

            chartBar('BY_charts', data1);
            chartPie("pie_charts", dataPie, data.length);
            
            grid2.setData(data2);
        }

        function loadChangci(year) {
            var node = tree.getSelectedNode();
            var strTitle = node.NAME;
            var STCD = node.ID;
            var strParam = "STCD@" + STCD;
            var rainLevel = "";
            if (isNaN(year)) {
                strTitle += "1978年至2020年" + year + "频次";
                rainLevel = year;
                strParam += ",TYPE@" + rainLevel;
            } else {
                strTitle += year + "年暴雨频次";
                var stime = year + "-01-01 00:00:00";
                var etime = year + "-12-31 23:59:59";
                strParam += ",STIME@" + stime + ",ETIME@" + etime
            }
            var url = "/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html";
            lookData(strParam, url, strTitle, "50%", 565, "true");
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var node = tree.getSelectedNode();
            var type = $.data(myData, "TYPENAME") != null ? $.data(myData, "TYPENAME") : "";
            var grade = $.data(myData, "GRADE") != null ? $.data(myData, "GRADE") : "暴雨";
            var name = node.NAME + GetObj("startYear").value + "年至" + GetObj("endYear").value + "年" + type + grade + "历时统计"
            ExportExcel(name, columns, data);
        }


        function OnClickTitle2(objID, name) {
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            if (objID == "TitleQuan") {
                $.data(myData, "TIMER", null);
            }
            else if (objID == "TitleLidoing") {
