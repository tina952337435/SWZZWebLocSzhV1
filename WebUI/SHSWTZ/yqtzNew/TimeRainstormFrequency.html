    <script>
        mini.parse();
        var myData = [];
        var tree = mini.get("tree1");
        var grid = mini.get("grid1");
        var dataMonth = [];
        var rainType = mini.get('rainType');
        $(function () {
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            var rainTypeArr = [{ id: "全部", text: "全部" }, { id: "暴雨", text: "暴雨" }, { id: "大暴雨", text: "大暴雨" }, { id: "特大暴雨", text: "特大暴雨" }];
            rainType.setData(rainTypeArr);
            rainType.select(0);

            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 1978;
            GetObj("endYear").value = _year - 2;
            $.data(myData, "MTYPE", "");
            $.data(myData, "GEMONTH", null);
            searchStation();
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
            $('#choseGrade li').click(function () {
                var f = this;
                $('#choseGrade li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var grade = $(this).find("span").attr("name");
                if (grade == "全部") {
                    grade = null;
                }
                $.data(myData, "GRADE", grade);
                bindTable();
            });
            for (var m = 1; m <= 12; m++) {
                dataMonth.push({ id: m, text: m });
            }
            mini.get('comboStart').setData(dataMonth);
            mini.get('comboEnd').setData(dataMonth);
        });
        function searchStation() {
            var strWhere = { STTP: "PP", TYPE: "雨量" };
            GetJosns("REPRESENTATIVESTATIONS", strWhere, "Sel");
        }
        function loadTree(data) {
            var dataResult = [];
            dataResult.push({ ID: "310000", NAME: "全市", PID: "-1" });
            var dataTempC = groupBy(data, "COUNTIES");
            dataResult.push({ ID: "1", NAME: "行政分区", PID: "-1" });
            dataTempC.forEach(function (item) {
                if (item[0].COUNTIESID == "100071") {
                    dataResult.push({ ID: "10007", NAME: "浦东新区", PID: "1" });
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                } else if (item[0].COUNTIESID == "100072") {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "10007" });
                }
                else {
                    dataResult.push({ ID: item[0].COUNTIESID, NAME: item[0].COUNTIES, PID: "1" });
                }
            });
            var dataTempW = groupBy(data, "WATERAREA");
            dataResult.push({ ID: "2", NAME: "水利片区", PID: "-1" });
            dataTempW.forEach(function (item) {
                dataResult.push({ ID: item[0].WATERAREAID, NAME: item[0].WATERAREA, PID: "2" });
            });
            dataResult.push({ ID: "3", NAME: "32个代表站", PID: "-1" });
            dataTempC.forEach(function (item) {
                for (var num = 0; num < item.length; num++) {
                    dataResult.push({ ID: item[num].STCD, NAME: item[num].STNM, PID: "3" });
                }
            });
            tree.loadList(dataResult, "ID", "PID");
            tree.select(0);
        }
        function search() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var YEARS = [];
            var startYear = Number(GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            for (var num = startYear; num <= endYear; num++) {
                YEARS.push(num.toFixed(0));
            }
            $.data(myData, "YEARS", YEARS);
            var node = tree.getSelectedNode();
            var sMonth = mini.get('comboStart').getValue();
            var eMonth = mini.get('comboEnd').getValue();
            var strWhere = {
                STCD: node.ID,
                YEARS: YEARS.join(','),
                SMONTH: sMonth,
                EMONTH: eMonth
            };
            GetJosns("duonianbaoyuGradeNum", strWhere, "SelNum");
        }
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                loadTree(data.data);
                //search();
            }
            else if (typeID == "SelNum") {
                var dataResult = mini.decode(data.data);
                $.data(myData, "data", dataResult);
                bindTable();
                mini.unmask(document.body);
            }
        }
        function bindTable() {
            var grade = $.data(myData, "GRADE");
            var columns = [];
            if ($.data(myData, "GEMONTH") == null)//所有暴雨
            {
                columns.push({ field: "GRADE", header: "暴雨级别", headerAlign: "center", align: "center", allowSort: true });
                columns.push(
                    {
                        field: "", header: "全部", headerAlign: "center", align: "center",
                        columns: [
                            { field: "QTOTAL", header: "总场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                            {
                                field: "", header: "最多", headerAlign: "center", align: "center", allowSort: true, columns: [
                                    { field: "QMAXNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                    { field: "QMAXYEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                ]
                            },
                            {
                                field: "", header: "最少", headerAlign: "center", align: "center", allowSort: true, columns: [
                                    { field: "QMINNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                    { field: "QMINYEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                ]
                            }
                        ]
                    },
                    {
                        field: "", header: "汛期", headerAlign: "center", align: "center",
                        columns: [
                            { field: "XQTOTAL", header: "总场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                            {
                                field: "", header: "最多", headerAlign: "center", align: "center", allowSort: true, columns: [
                                    { field: "XQMAXNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                    { field: "XQMAXYEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                ]
                            },
                            {
                                field: "", header: "最少", headerAlign: "center", align: "center", allowSort: true, columns: [
                                    { field: "XQMINNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                    { field: "XQMINYEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                ]
                            }
                        ]
                    },
                    {
                        field: "", header: "非汛期", headerAlign: "center", align: "center",
                        columns: [
                            { field: "FXQTOTAL", header: "总场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                            {
                                field: "", header: "最多", headerAlign: "center", align: "center", allowSort: true, columns: [
                                    { field: "FXQMAXNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                    { field: "FXQMAXYEAR", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                ]
                            },
                            {
                                field: "", header: "最少", headerAlign: "center", align: "center", allowSort: true, columns: [
                                    { field: "FXQMINNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                    { field: "FXQMINYEAR", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                ]
                            }
                        ]
                    }
                );
            }
            else {
                columns.push({ field: "GRADE", header: "暴雨级别", headerAlign: "center", align: "center", allowSort: true });
                columns.push({ field: "QTOTAL", header: "总场次", headerAlign: "center", align: "center", allowSort: true, width: 60 });
                columns.push({
                                field: "", header: "最多", headerAlign: "center", align: "center", allowSort: true, columns: [
                                    { field: "QMAXNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                    { field: "QMAXYEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                                ]
                            });
                columns.push({
                    field: "", header: "最少", headerAlign: "center", align: "center", allowSort: true, columns: [
                        { field: "QMINNUM", header: "场次", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                        { field: "QMINYEAR", header: "年份", headerAlign: "center", align: "center", allowSort: true, width: 60 },
                    ]
                });
            }
            grid.set({ columns: columns });
            loadChart();
        }
        function onSelectNode(e) {
            search();
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var record = e.record;
            var column = e.column;

            if (field == "QIANG" || field == "ZHONG" || field == "RUO") {
                var node = tree.getSelectedNode();
                var STCD = node.ID;
                var YEAR = record.YEAR;
                var STIME = YEAR + "-01-01 00:00:00";
                var ETIME = YEAR + "-12-31 23:59:59";
                var NAME = node.NAME;
                var TYPE = column.header.replaceAll(" ", "").replaceAll("\r", "").replaceAll("\n", "").replaceAll("\t", "");
                var strTitle = NAME + YEAR + "年" + TYPE;
                var str = "<a onclick='lookData(\"STCD@" + STCD + ",STIME@" + STIME + ",ETIME@" + ETIME + ",TYPE@" + TYPE + "\",\"/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html\",\"" + strTitle + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                if (value == undefined) {
                    str = "-";
                }
                if (Number(value) == 0) {
                    str = 0;
                }
                e.cellHtml = str;
            }
            if (field == "TOTAL") {
                var node = tree.getSelectedNode();
                var STCD = node.ID;
                var YEAR = record.YEAR;
                var STIME = YEAR + "-01-01 00:00:00";
                var ETIME = YEAR + "-12-31 23:59:59";
                var NAME = node.NAME;
                var TYPE = null;
                var strTitle = NAME + YEAR + "年" + TYPE;
                var str = "<a onclick='lookData(\"STCD@" + STCD + ",STIME@" + STIME + ",ETIME@" + ETIME + ",TYPE@" + TYPE + "\",\"/SHFLOODTIDE/yqtz/yqDataInterpolationDanzhan.html\",\"" + strTitle + "\",\"50%\",565,\"true\")' style='cursor:pointer;'>" + value + "</a>";
                if (value == undefined) {
                    str = "-";
                }
                if (Number(value) == 0) {
                    str = 0;
                }
                e.cellHtml = str;
            }
        }
        function onSTCDChanged(e) {
            search();
        }
        function onvaluechangedType(e) {
            var value = e.value;
            if ($.data(myData, "GEMONTH") == null) {
                loadChartRight();
            } else {
                loadChartRightMonth();
            }
        }
        // ul li 选择切换行政分区和水利分区
        function OnClickTitle2(objID, objPathName) {//选择类型
            $("#sysList").css("display", "block");
            var only = $("#onlytab2 .onlyli").removeClass("onlyliHover");
            $("#" + objID).addClass("onlyliHover");
            var left = 215;
            var titleType = "汛期";
            var sMonth = 5, eMonth = 10;
            if (objID == "TitleLiYear") {
                sMonth = 1;
                eMonth = 12;
                titleType = "";
                $("#sysList").css("display", "none");
                $("#BY_chartsRight").show();
                $.data(myData, "GEMONTH", null);//代表选择的是全年
            }
            else if (objID == "TitleLimonth") {
                sMonth = 6;
                eMonth = 9;
                left = 95;
                titleType = sMonth + "月";
            }
            else if (objID == "TitleLibefore") {
                sMonth = 1;
                eMonth = 5;
                left = 155;
                titleType = "汛前";
            }
            else if (objID == "TitleLidoing") {
                sMonth = 6;
                eMonth = 9;
                left = 215;
                titleType = "汛期";
            }
            else if (objID == "TitleLiafter") {
                sMonth = 10;
                eMonth = 12;
                left = 275;
                titleType = "汛后";
            }
            $.data(myData, "MTYPE", titleType);
            mini.get('comboStart').setValue(sMonth);
            mini.get('comboEnd').setValue(eMonth);
            $("#titleType").html(titleType);
            $("#sysList").css("left", left + "px");
            if (objID == "TitleLiYear") {
                search();
            }
        }
        function loadChart() {
            var data = $.data(myData, "data");
            var grade = $.data(myData, "GRADE");
            //所有特大暴雨，大暴雨，暴雨统计饼图
            if (grade == null)//所有暴雨
            {
                var dataALL = [];
                dataALL.push({
                    GRADE: "暴雨",
                    QTOTAL: SumJson(data, "RUO"),
                    XQTOTAL: SumJson(data, "XZRUO"),
                    FXQTOTAL: SumJson(data, "FXQRUO"),
                    QMAXNUM: Math.max.apply(Math, data.map(function (o) { return o.RUO })),
                    QMAXYEAR: data.filter(function (e) { return e.RUO == Math.max.apply(Math, data.map(function (o) { return o.RUO })) })[0].YEAR,
                    QMINNUM: Math.min.apply(Math, data.map(function (o) { return o.RUO })),

        function loadChartRight() {
            var rainTypeValue = rainType.getValue();
            var data = $.data(myData, "data");
            var startYear = Number(GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            var titleTextTime = startYear + "-" + endYear + "年";

            var typeStr = "";
            var field = "";
            if (rainTypeValue == "全部") {
                field = "TOTAL";
                typeStr = "";
            }
            else if (rainTypeValue == "暴雨") {
                field = "RUO";
                typeStr = "暴雨";
            } else if (rainTypeValue == "大暴雨") {
                field = "ZHONG";
                typeStr = "大暴雨";
            } else if (rainTypeValue == "特大暴雨") {
                field = "QIANG";
                typeStr = "特大暴雨";
            }
            titleTextTime += "不同时段" + typeStr +"场次占比";
            var byTotal = (SumJson(data, "XQ" + field) + SumJson(data, "XZ" + field) + SumJson(data, "XH" + field));
            var optionsData = [];
            if (SumJson(data, "XQ" + field) > 0) {
                optionsData.push({
                    name: '汛前',
                    value: SumJson(data, "XQ" + field),
                    percent: (Number(SumJson(data, "XQ" + field) / byTotal) * 100).toFixed(1),
                    itemStyle: {
                        color: '#41adf8',
                        // opacity: 1,
                    },
                });
            }
            if (SumJson(data, "XZ" + field) > 0) {
                optionsData.push({
                    name: '汛期',
                    value: SumJson(data, "XZ" + field),
                    percent: (Number(SumJson(data, "XZ" + field) / byTotal) * 100).toFixed(1),
                    itemStyle: {
                        color: '#ffa100',
                        // opacity: 1,
                    },
                });
            }
            if (SumJson(data, "XH" + field) > 0) {
                optionsData.push({
                    name: '汛后',
                    value: SumJson(data, "XH" + field),
                    percent: (Number(SumJson(data, "XH" + field) / byTotal) * 100).toFixed(1),
                    itemStyle: {
                        color: '#2acf81',
                        // opacity: 1,
                    },
                });
            }
            chartPieArea("BY_chartsRight", optionsData, titleTextTime);
        }
        function loadChartRightMonth() {
            var rainTypeValue = rainType.getValue();
            var data = $.data(myData, "data");
            var startYear = Number(GetObj("startYear").value);
            var endYear = Number(GetObj("endYear").value);
            var titleTextTime = startYear + "-" + endYear + "年";

            var typeStr = "";
            var field = "";
            if (rainTypeValue == "全部") {
                field = "TOTAL";
                typeStr = "";
            } else if (rainTypeValue == "暴雨") {
                field = "RUO";
                typeStr = "暴雨";
            } else if (rainTypeValue == "大暴雨") {
                field = "ZHONG";
                typeStr = "大暴雨";
            } else if (rainTypeValue == "特大暴雨") {
                field = "QIANG";
                typeStr = "特大暴雨";
            }
            titleTextTime += "各月" + typeStr + "场次占比";
            var optionsData = [];
            var sMonth = Number(mini.get('comboStart').getValue());
            var eMonth = Number(mini.get('comboEnd').getValue());
            var byTotal = 0;
            for (var m = sMonth; m <= eMonth; m++) {
                byTotal += Number( SumJson(data, "MONTH" + field + m));
            }
            var lineColor = ['#41adf8', '#ffa100', '#2acf81'];
            for (var m = sMonth; m <= eMonth; m++)
            {
                if (SumJson(data, "MONTH" + field + m) > 0) {
                    optionsData.push({
                        name: m+'月',
                        value: SumJson(data, "MONTH" +field + m),
                        percent: (Number(SumJson(data, "MONTH" + field + m) / byTotal) * 100).toFixed(1),
                        itemStyle: {
                            color: lineColor[m - sMonth],
                            // opacity: 1,
                        },
                    });
                }
            }
            chartPieArea("BY_chartsRight", optionsData, titleTextTime);
        }
        function Exp() {
            var data = grid.data;
            var columns = grid.columns;
            var node = tree.getSelectedNode();
            var name = node.NAME + "多年暴雨级别对比";
            ExportExcel(name, columns, data);
        }
        function XunOK() {
            $.data(myData, "GEMONTH", "GEMONTH");//代表选择的是各月
            $("#sysList").css("display", "none");
            var sMonth = mini.get('comboStart').getValue();
            var eMonth = mini.get('comboEnd').getValue();
            var titleType = $.data(myData, "MTYPE");
            if (titleType.indexOf("月") > -1) {
                if (sMonth == eMonth) {
                    $.data(myData, "MTYPE", sMonth + "月");
                } else {
                    $.data(myData, "MTYPE", sMonth + "-" + eMonth + "月");
                }
            }
            if (sMonth == eMonth) {
                eMonth = sMonth + 1;
            }
            search();
        }

    <script>
        function chartPieArea(chartName, data, titleText) {
            var myChart = echarts.init(document.getElementById(chartName));
            myChart.clear();
            const dataList = data;

            option = {
                title: {
                    text: titleText,
                    x: 'center',
                    top: '20',
                    textStyle: {
                        //color: '#fff',
                        fontSize: 20,
                    },
                },
                legend: {
                    show: false,
                    icon: 'circle',
                    right: '3%',
                    left: 'center',
                    bottom: '10%',
                    itemWidth: 10,
                    itemStyle: {
                        borderColor: 'none',
                    },
                    textStyle: {
                        rich: {
                            name: {
                                color: '#606266',
                                fontSize: 14,
                            },
                            percentage: {
                                color: '#606266',
                                fontSize: 16,
                                padding: [0, 0, 0, 30],
                                align: 'right',
                            },
                        },
                    },
                },
                tooltip: {
                    trigger: 'item',
                },
                series: [
                    {
                        type: 'pie',
                        color: ['#4D88FE', '#50CCCB', '#FFBF3C'],
                        radius: '45%',
                        left: 'center',
                        data: dataList,
                        //emphasis: {
                        //    itemStyle: {
                        //        shadowBlur: 10,
                        //        shadowOffsetX: 0,
                        //        shadowColor: 'rgba(0, 0, 0, 0.5)',
                        //    },
                        //},
                        labelLine: {
                            show: true,
                            length: 10,
                            length2: 30,
                        },
                        label: {
                            //width: 100,
                            fontSize: 12,
                            formatter: function (e) {
                                let {
                                    data: { value, name, percent },
                                } = e;
                                return `${name}\n${value}场\n${percent}%`;
                            },
                        },
                        itemStyle: {
                            borderColor: '#fff',
                        },
                    },
                ],
            };

            myChart.setOption(option);
        }
    </script>
