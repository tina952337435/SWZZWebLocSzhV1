            { STCD: "63404000", STNM: "青浦南门", PAID: "10018", AREANAME: "青松片" },
            { STCD: "63404100", STNM: "陈坊桥", PAID: "10018", AREANAME: "青松片" },
            { STCD: "63404500", STNM: "南桥", PAID: "10015", AREANAME: "浦东片" },
            { STCD: "63425700", STNM: "祝桥", PAID: "10015", AREANAME: "浦东片" },
            { STCD: "63405480", STNM: "嘉定南门", PAID: "10014", AREANAME: "嘉宝北片" },
            { STCD: "63425900", STNM: "罗店", PAID: "10014", AREANAME: "嘉宝北片" },
        ];
        $(function () {
            $.data(myData, "AID", '10014');
            var _year = new Date().format("yyyy");
            GetObj("startYear").value = 2010;
            GetObj("endYear").value = _year - 1;
            $("#expButton").hide();
            if (shswzzGroupAllIDS.indexOf(GetCookie("GROUPID")) > -1) {
                $("#expButton").show();
            }
            loadAreaStationHtml();
            $('#choseArea li').click(function () {
                var f = this;
                $('#choseArea li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var AID = $(this).find("span").attr("id");
                $.data(myData, "AID", AID);
                loadAreaStationHtml();
            });
            $(".form-control").datetimepicker({
                format: 'yyyy', // 展现格式
                startDate: "1978",// 开始时间
                endDate: "9999", // 结束时间
                autoclose: true, // 选择日期后关闭
                // 选择器打开之后首先显示的视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                startView: 4,
                // 选择器所能够提供的最精确的时间选择视图
                // 0表示分钟(默认),1表示小时,2表示天,3表示月,4表示年
                minView: 4,
                language: 'zh-CN', //显示语言为中文
            });
        });
        function loadAreaStationHtml() {
            var data = stationArr;
            data = data.filter(function (item) {
                return item.PAID == $.data(myData, "AID");
            });
            var strHtml = '<ul class="ui-choose choose-type-right" id="choseZhan">';
            data.forEach(function (item, _index) {
                var cls = "";
                if (_index == 0) {
                    $.data(myData, "STCD", item.STCD);
                    cls = ' class="selected" ';
                }
                strHtml += '<li ' + cls + '><span id="' + item.STCD + '">' + item.STNM + '</span></li>';
            });
            strHtml += '</ul>';
            $("#zhanDiv").html(strHtml);
            search();
            $('#choseZhan li').click(function () {
                var f = this;
                $('#choseZhan li').each(function (index, item) {
                    this.className = this == f ? 'selected' : '';
                });
                var stcd = $(this).find("span").attr("id");
                if (stcd.indexOf("All") > -1) {
                    var astcd = $('#choseArea .selected').find("span").attr("id");//分区的编号或者全市的编号
                    var astnm = $('#choseArea .selected').find("span").html();
                }
                $.data(myData, "STCD", stcd);
                search();
            });
        }
        //场次数据
        function search() {
            if (Number(GetObj("endYear").value) >= Number(GetObj("startYear").value)) {
                var stime = GetObj("startYear").value + "-01-01 00:00:00";
                var etime = GetObj("endYear").value + "-12-31 23:59:59";
                var strWhere = {
                    STCD: $.data(myData, "AID"),//$.data(myData, "STCD"),
                    STIME: stime,
                    ETIME: etime,
                    AREADPR: mini.get('areadrp').getValue()
                };
                GetJosns("ST_RAINSTORMFREQUENCYNAMESel", strWhere, "RSel");
            }
        }
        function searchData() {
            mini.mask({
                el: document.body,
                cls: 'mini-mask-loading',
                html: '加载中...'
            });
            var node = tree.getSelectedNode();
            var stime = new Date(convertToDate(node.BGTM)).format('yyyy-MM-dd HH:mm:ss');
            var etime = new Date(convertToDate(node.ENDTM)).format('yyyy-MM-dd HH:mm:ss');
            var strWhere = {
                STCD: $.data(myData, "STCD"),
                STIME: stime,
                ETIME: etime,
                AID: $.data(myData, "AID"),
            };
            GetJosns("ST_RAINSTORMFREQUENCYWaterRiverSel", strWhere, "WaterSel");
        }
        function JosnSel(data, typeID) {
            if (typeID == "SSel") {
                $.data(myData, "StationData", data.data);
            }
            else if (typeID == "RSel") {
                //暴雨场次
                var dataResultNew = [];
                var dataResult = data.data;
                $("#areaTitle").html($('#choseArea .selected').html().trim() + "暴雨场次(" + dataResult.length + ")");
                for (var num = dataResult.length - 1; num >= 0; num--) {
                    var item = dataResult[num];
                    var bgtm = new Date(convertToDate(item.BGTM)).format('yyyy年M月d日');
                    var grade = "";
                    if (item.DRP24 >= 50 && item.DRP24 < 100) {
                        grade = "暴雨";
                    } else if (item.DRP24 >= 100 && item.DRP24 < 200) {
                        grade = "大暴雨";
                    } else if (item.DRP24 >= 200) {
                        grade = "特大暴雨";
                    }
                    var sStr=convertToDate(item.BGTM).format('yyyy-MM-dd HH:mm:ss');
                    var eStr=convertToDate(item.ENDTM).format('yyyy-MM-dd HH:mm:ss');
                    item.hours=GetDateDiff(sStr,eStr,'hour');
                    item.treeText=bgtm+grade+'('+item.hours+'h)';
                    dataResultNew.push(item);
                }
                tree.loadList(dataResultNew);
                tree.select(0);
            }
            else if (typeID == "WaterSel") {
                console.error(typeID, data.data);
                var strNote = [
                    { "name": "时间", "codename": "TM", "tableV": "1", "isShow": true, "width": "20%" },
                    { "name": "水位", "codename": "UPZ", "tableV": "1", "isShow": true, "width": "20%" },
                    { "name": "雨量", "codename": "DRP", "tableV": "1", "isShow": true, "width": "20%" },
                    { "name": "孔数", "codename": "KONGSHU", "tableV": "1", "isShow": true, "width": "20%" },
                ];
                var LineColor = ['#0000FF', '#00FF00', '#ff0909', '#FFA500'];
                chartSW('chartPie', data.data, strNote, LineColor, '水位');
                grid.setData(data.data);
                mini.unmask(document.body);
            }
        }
        function ondrawcell(e) {
            var field = e.field;
            var value = e.value;
            var grid = e.sender;
            var record = e.record;
            var rowIndex = e.rowIndex;
            if (field == "TM") {
                var stm = mini.formatDate(convertToDate(value), 'yyyy-MM-dd HH:mm:ss');
                e.cellHtml = stm;
            }

            var data = grid.data;
            var columns = grid.columns;
            var name = shTitle;
            name += GetObj("startYear").value + "年至" + GetObj("endYear").value + "年暴雨频次";
            ExportExcel(name, columns, data);

            searchData();

        /* 过程线绘制 过程线 水位
            * ChartName画图控件名称
            * dataS数据对象，数据格式json
            * strNote数据说明，数据类型数组，数据格式
            * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示过程线
            * [
            * {"name": "时间","codename": "TM","tableV":"1","isShow":true},
            * {"name": "闸上水位","codename": "UPZ","tableV":"1","isShow":true},
            * {"name": "闸下水位","codename": "DWZ","tableV":"1","isShow":true},
            * {"name": "警戒水位","codename": "WRZ","tableV":"0","isShow":false}
            * ]
            */
        function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
            var titleText = $('#choseArea .selected span').html() + "内面雨量和" + $('#choseZhan .selected span').html() + "站水位过程";
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var ShowSelected = {};
            var m = new Array();
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(new Date(convertToDate(value[value1.codename])).format("MM-dd HH:mm")); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            //获得最大值最小值
            //var max_min=GetSort(chartValue);
            var option = {
                //backgroundColor: '#100E19',
                title: {
                    text: titleText,
                    left: "center"
                },
                noDataLoadingOption: {
                    text: '暂无数据',
                    effect: 'bubble',
                    effectOption: {
                        effect: {
                            n: 0 //气泡个数为0
                        }
                    },
                    textStyle: {
                        fontSize: 30,
                        fontWeight: 'bold'
                    }
                },
                tooltip: {
                    //showDelay: 0,
                    //hideDelay: 50,
                    //transitionDuration: 0,
                    //backgroundColor: 'rgba(255,255,255,0.9)',
                    //borderColor: '#4040FB',
                    //borderRadius: 8,
                    //borderWidth: 2,
                    //padding: 10,
                    //textStyle: {
                    //    color: '#000000'
                    //},
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#1B2B2F',
                        fontSize: 12,
                        padding: [35, 0]
                    },
                    selected: ShowSelected
                    //selected: {
                    //    '警戒水位': false
                    //}

                },
                grid: {
                    left: '5%',
                    right: '5%',
                    bottom: '3%',
                    top: '20%',
                    containLabel: true
                },
                xAxis: [
                    {
                        type: 'category',
                        boundaryGap: true,
                        data: chartTM,
                        axisLine: {
                            lineStyle: {
                                color: '#918F8F',
                                width: 1, //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        name: "水位(m)",
                        type: 'value',
