        mini.parse();

            var tabsPsonRole = mini.get("mainTabs");

        }

        function RemoveTab() {
            var tabs = mini.get("mainTabs");
            var tab = tabs.getActiveTab();
            if (tab) {
                tabs.removeTab(tab);
            }
        }
        function AllTab() {
            var tabsPsonRole = mini.get("mainTabs");
            var win = mini.open({
                width: "100%", height: "100%", showCloseButton: true, url: tabsPsonRole.getActiveTab().url, showModal: true, onload: function () {       //弹出页面加载完成

            win.max();

            activeTab(agg);
        }
        function activeTab(item) {
            if (item.url.lastIndexOf('http') > -1) {
                window.open(item.url);
            } else {
                var tabs = mini.get("mainTabs");
                var tab = tabs.getTab(item.id);
                if (!tab) {
                    tab = { name: item.id, title: item.text, url: item.url, iconCls: item.iconCls, showCloseButton: true };
                    tab = tabs.addTab(tab);
                }
                tabs.activeTab(tab);
            }
        }
        var menu;
        var strMenu = GetQueryString("Menu");
        if (strMenu == null) {
            strMenu = "NO07";
        }
        $(function () {
            $(document).attr("title", systematicName);

            GetObj("userinfo").innerHTML = _userinfo;

            $('#openUserinfo').hover(function () {
                $('#divXTQH').stop(true, true).fadeIn(200);
            }, function () {
                $('#divXTQH').stop(true, true).delay(500).fadeOut(200);

            var postParam = { "QX_SYS": "NO12", "QX_MENU": strMenu, "GROUPID": GetCookie("GROUPID") };
            GetJosns("QX_MAINSel", postParam, "QX_MAINSel");

            postParam = { "QX_SYS": "NO12", "QX_PARENT": "-1", "GROUPID": GetCookie("GROUPID") };
            GetJosns("QX_MAINNEWSel", postParam, "QX_MAIN");
        });
        function JosnSel(data, typeID) {
            if (typeID == "QX_MAINSel") {
                var MenuData = [];
                if (data.data.length > 0) {
                    var tempLogo = data.data.filter(function (res) {
                        return res.QX_PARENT == "-1";
                    });
                    if (tempLogo.length > 0) {
                        $(document).attr("title", tempLogo[0]["QX_NAME"]);
                        var strIco = tempLogo[0]["QX_ICON"];
                        if (strIco.lastIndexOf(".") > -1) {
                            $("#divLogo").css("background-image", "url('/Common/images/" + strIco + "')");
                        } else {
                            $("#divLogo").css("background-image", "url('/Common/images/logoDD.png')");
                        }
                    } else {
                        $("#divLogo").css("background-image", "url('/Common/images/logoDD.png')");
                    }
                    var str = data.data.filter(function (res) {
                        return res.QX_PARENT != "-1" && res.QX_PARENT == data.data[0].QX_ID;
                    });
                    var strMsg = '';
                    strMsg = ' <ul class="menu">';
                    if (str.length > 0) {
                        for (num = 0; num < str.length; num++) {
                            var cls = "";
                            if (strMenu =="NO07") {
                                if (num == 2) {
                                    cls = "activeLi";
                                    $.data(myData, "QX_URL", str[num].QX_URL);
                                    $.data(myData, "id", str[num].QX_ID);
                                    $.data(myData, "iconCls", str[num].QX_ICON);
                                    $.data(myData, "text", str[num].QX_NAME);
                                }
                            } else {
                                if (num == 0) {
                                    cls = "activeLi";
                                    $.data(myData, "QX_URL", str[num].QX_URL);
                                    $.data(myData, "id", str[num].QX_ID);
                                    $.data(myData, "iconCls", str[num].QX_ICON);
                                    $.data(myData, "text", str[num].QX_NAME);
                                }
                            }
                            
                            
                            strMsg += '<li style="cursor:pointer;" id="menuLi' + num + '" class="' + cls + '" onclick="OnClickTitle(\'' + str[num].QX_ICON + '\',\'' + str[num].QX_NAME + '\',\'' + str[num].QX_URL + '\',\'menuLi' + num + '\',\'' + str[num].QX_ID + '\')">';
                            strMsg += '    <span class="menuSpan">';
                            strMsg += '  <i class="menu-icon fa ' + str[num].QX_ICON + '"></i><span class="menutext">' + str[num].QX_NAME + '</span>';
                            strMsg += '         </span>';
                            strMsg += '     </li>';
                        }
                    }
                    strMsg += '     </ul>';
                    $("#mainMenu").html(strMsg);
                    $(".menu>li").mouseover(function () {
                        $(this).addClass("menuHour");
                    });
                    $(".menu>li").mouseout(function () {
                        $(this).removeClass("menuHour");
                    });
                    FirstTab();
                }
            }
            else if (typeID == "QX_MAIN") {
                var strWhere = "";
                if (data.data.length > 0) {
                    for (num = 0; num < data.data.length; num++) {
                        if (data.data[num].QX_MENU.lastIndexOf(strMenu) > -1) {

                        } else {
                            if (data.data[num].QX_URL != undefined) {
                                var strICON = data.data[num].QX_ICON;
                                if (strICON != undefined) {
                                    strICON = data.data[num].QX_ICON;
                                    if (strICON == "暂定图片") {
                                        strICON = "fa-desktop";
                                    }
                                }
                                strWhere += ' <li>';
                                strWhere += '  <a href="' + data.data[num].QX_URL + '" target="_blank"><i class="fa ' + strICON + ' "></i>' + data.data[num].QX_NAME + '</a>';
                                strWhere += '</li>';
                            }

                        }
                    }
                }
                strWhere += ' <li class="divider"></li>';
                strWhere += ' <li>';
                strWhere += '  <a href="../login.html"><i class="fa fa-key "></i>注销</a>';
                strWhere += '</li>';
                $("#divXTQH").html(strWhere);

            }
        }
        function FirstTab() {
            var item = { id: $.data(myData, "id"), iconCls: "mini-tab-icon mini-iconfont fa fa " + $.data(myData, "iconCls"), text: $.data(myData, "text"), url: $.data(myData, "QX_URL") };
            //var item = { id: "201809140010", iconCls: "mini-tab-icon mini-iconfont fa fa-desktop", text: "总体分析", url: "/TJFX/tzSpecial.html" };
            var tabs = mini.get("mainTabs");

            tab = { name: item.id, title: item.text, url: item.url, iconCls: item.iconCls, showCloseButton: false };
            tab = tabs.addTab(tab);
            tabs.activeTab(tab);
        }
        function toSystemManager() {
            window.open("TYIndex.html");
        }
        function OnClickTitle(_iconCls, _text, _url, objID, QX_ID) {
            var only = $(".menu li").removeClass("activeLi");
            $("#" + objID).addClass("activeLi");
            addTab(_iconCls, _text, _url, QX_ID);
        }
        function addTab(_iconCls, _text, _url, QX_ID) {
            var tabs = mini.get("mainTabs");
            var tab = tabs.getTab(QX_ID);
            if (tab && tab.url.indexOf('http') > -1) {
                window.open(tab.url);
            }
            else if (tab && _url == tab.url) {
                tabs.activeTab(tab);
                tabs.reloadTab(tab);
            }
            else {
                var item = { id: QX_ID, iconCls: "mini-tab-icon mini-iconfont MenuIcoColor menu-icon fa " + _iconCls, text: _text, url: _url };
                tab = { name: item.id, title: item.text, url: item.url, iconCls: item.iconCls, showCloseButton: true };
                tab = tabs.addTab(tab);
                //tab.ondestroy = onTabDestroy;
                tabs.activeTab(tab);
            }
        }
