        function BreakLayerLoad(value) {
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(endDate);
            //GetJosns("YBSHUIWEI", { "STIME": d1.format("yyyy-MM-dd HH:mm:ss"), "ETIME": d2.format("yyyy-MM-dd HH:mm:ss"), "STCD": stcd, "PLAN_N": value, "TYPE": "1" }, "Sel");
			app.post("SWZZ_MODE_ES_ZHANDIANDATA/YBSHUIWEI",
				{startdate:d1.format("yyyy-MM-dd HH:mm:ss"),

				type:"1"
				},
				(data)=>{
					JosnSel(data,"Sel")
				}
			)
		}

        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                if (data.total > 0) {
                    //$("#dataShow").hide();
                } else {
                    noData();
                    //$("#Chart").html("<h1 style=\"text-align:center;padding-top:18%;\">暂无数据</h1>");
                    //$("#dataShow").show();
                }
                JsonLineChart(dataResult);
                grid.setData(dataResult.data);
                $("#dataShow").hide();
                $("#dataLoad").hide();
            } else if (typeID == "MODE_SCHEME_TYPESel") {
                arrZU = data.data;
                strWhere = {
                    "pattem": ZU_ID
                };
                setTimeout(function () { 
					//GetJosns("MODE_DD_SOLUTIONSel", strWhere, "MODE_DD_SOLUTIONSel");
					app.post("SWZZ_MODE_DD_SOLUTION/findResult",strWhere,(data)=>{
						JosnSel(data,"MODE_DD_SOLUTIONSel")
					})
				}, 200);
            } else if (typeID == "MODE_DD_SOLUTIONSel") {
                arrFA = data.data;
                var newARR = [];
                newARR.push({ "ID": arrZU[0].id, "PID": "-1", "NAME": arrZU[0].name, "NOTE": arrZU[0].note });
                for (var i = 0; i < arrFA.length; i++) {
                    newARR.push({ "ID": arrFA[i].id, "PID": arrFA[i].dd_MIND, "NAME": arrFA[i].dd_NAME, "NOTE": arrFA[i].note });
                }
                tree.loadList(newARR, "ID", "PID");
                var nodes = tree.findNodes(function (node) {
                    if (node.ID == PLAN_N) return true;
                });
                tree.checkNodes(nodes);

                var value = tree.getValue(true);
				console.log(value)
                if (value != "") {
                    BreakLayerLoad(value);
                }
            }
            else if (typeID == "MODE_BDMS_PREDICTSel") {
                var aggList = data.data.split('@'); 
                if (aggList[0] != "") {
                    var jsonarray = eval('(' + aggList[0] + ')');
                    var jsonData = eval('(' + aggList[1] + ')');
                    $.data(myData, "gridColumn", jsonarray);
                    $.data(myData, "gridData", jsonData);
                    gridLoad();
                }
                $("#dataShow").hide();
                $("#dataLoad").hide();
                //loadChartSW(data.data);
            }
        }
        function noData() {
            $("#maxUpz").html("无");
            $("#maxUpTime").html("无");
            $("#minUpz").html("无");
            $("#minUpTime").html("无");
            $("#maxDown").html("无");
            $("#maxDownTime").html("无");
            $("#minDown").html("无");
            $("#minDownTime").html("无");
        }
        function JsonLineChart(strJson) {
            var strData = "";
            var _XData = [];
            if (strJson.data.length > 0) {
                var SWMAX = -9999, SWMIN = 9999, XYMAX = -9999, XYMIN = 9999;
                var SWMAXTM = "", SWMINTM = "", XYMAXTM = "", XYMINTM = "";
                for (num = 0; num < strJson.data.length; num++) {
                    if (strJson.data[num].UPZ != "" && strJson.data[num].UPZ != null) {
                        if (SWMAX < parseFloat(strJson.data[num].UPZ)) {
                            SWMAX = parseFloat(strJson.data[num].UPZ).toFixed(2);
                            SWMAXTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                        if (SWMIN > parseFloat(strJson.data[num].UPZ)) {
                            SWMIN = parseFloat(strJson.data[num].UPZ).toFixed(2);
                            SWMINTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                    }
                    if (strJson.data[num].YBZ != "" && strJson.data[num].YBZ != null) {
                        if (XYMAX < parseFloat(strJson.data[num].YBZ)) {
                            XYMAX = parseFloat(strJson.data[num].YBZ).toFixed(2);
                            XYMAXTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                        if (XYMIN > parseFloat(strJson.data[num].YBZ)) {
                            XYMIN = parseFloat(strJson.data[num].YBZ).toFixed(2);
                            XYMINTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                    }
                    if (strJson.data[num].YBZ == undefined) {
                        strJson.data[num].YBZ = null;
                    }
                    _XData.push({ TM: new Date(convertToDate(strJson.data[num].TM)).format("yyyy-MM-dd HH:mm:ss"), UPZ: strJson.data[num].UPZ, YBZ: strJson.data[num].YBZ, WRZ: strJson.data[num].WRZ });
                }
                //console.log(JSON.stringify(_XData));
                GetObj("maxUpz").innerHTML = SWMAX == -9999 ? "-" : SWMAX + "m";
                GetObj("maxUpTime").innerHTML = SWMAXTM;
                GetObj("minUpz").innerHTML = SWMIN == 9999 ? "-" : SWMIN + "m";
                GetObj("minUpTime").innerHTML = SWMINTM;
                GetObj("maxDown").innerHTML = XYMAX == -9999 ? "-" : XYMAX + "m";
                GetObj("maxDownTime").innerHTML = XYMAXTM;
                GetObj("minDown").innerHTML = XYMIN == 9999 ? "-" : XYMIN + "m";
                GetObj("minDownTime").innerHTML = XYMINTM;
            }
            //绘制数据说明
            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            strNote += ',{"name": "预报","codename": "YBZ","tableV":"1","isShow":true,"width":"30%"}';
            strNote += ',{"name": "实测","codename": "UPZ","tableV":"1","isShow":true,"width":"30%"}';
            strNote += ',{"name": "警戒","codename": "WRZ","tableV":"1","isShow":false,"width":"30%"}]';
            //绘制过程线颜色设置
            var LineColor = ["#15D69F", '#0000FF', '#FFA500'];
            //绘制图形
            chartSW("Chart", _XData, eval('(' + strNote + ')'), LineColor, "水位(m)");

        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;

        //统计水位
        function onDrawSummaryCell(e) {
            var value = e.value;
            if (e.field == "UPZ") {
                value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">实测最高水位: " + value + "m</span>" : e.cellHtml = "<span  style=\"color:red;font-weight:bold;\">实测最高水位: 无</span>";
            }
            if (e.field == "YBZ") {
                value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">预报最高水位: " + value + "m</span>" : e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">预报最高水位: 无</span>";
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (Number(row.WRZ) > 0 && Number(row.UPZ) > Number(row.WRZ)) {
                e.cellStyle = "color:#FFA500";
            }
            if (Number(row.GRZ) > 0 && Number(row.UPZ) > Number(row.GRZ)) {
                e.cellStyle = "color:red";
            }
            if (field == "TM") {
                e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm:ss");
            } else if (field == "UPZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            } else if (field == "YBZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            } else if (field == "WRZ") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(2);
                }
            }
        }

        function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
            var tm = new Date(stime).format("MM-dd HH:mm");
            if (max_min_Name == "") {
                max_min_Name = "水位(m)";
            }
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            myChart.clear();

            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            var ShowSelected = {};
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(new Date(value[value1.codename]).format("MM-dd HH:mm"));
                    } else if (value1.name == "名称") {
                        if (value[value1.codename] != undefined) {
                            chartTM.push(new Date(value[value1.codename]).format("MM-dd HH:mm"));
                        }
                    } else if (value1.name == "时间名称") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });

            //获得最大值最小值
            //var max_min=GetSort(chartValue);
            var zmax = 0;
            var option = {
                //backgroundColor: '#100E19',
                tooltip: {
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    },
                    selected: ShowSelected
                },
                grid: {
                    left: '1%',
                    right: '2%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: { show: false, type: ['line', 'bar'] },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                calculable: true,
                xAxis:
                {
                    type: 'category',
                    boundaryGap: false,
                    data: chartTM,
                    //axisPointer: {
                    //    value: tm,
                    //    snap: true,
                    //    lineStyle: {
                    //        color: '#004E52',
                    //        opacity: 0.5,
                    //        width: 2
                    //    },
                    //    label: {
                    //        show: true,
                    //        formatter: function (params) {
                    //            return params.value;
                    //        },
                    //        backgroundColor: '#004E52'
                    //    },
                    //    handle: {
                    //        show: true,
                    //        color: '#004E52',
                    //        size: 0
                    //    }
                    //},
                }
                ,
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        // splitNumeber:5,
                        scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#E5E5E5',
                                width: 1,
                                type: 'dashed'
                            }
                        },

                        //min:max_min.min, //动态设置最大值最小值。
                        //max:max_min.max,
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                           
                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 200;
                            }


                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;
                            var max = 0;
                            if ((jiangenew - jiange) % 2 == 0) {
                                max=value.max + (jiangenew - jiange) / 200;
                            }
                            else {
                                max= value.max + (jiangenew - jiange + 1) / 200;
                            }
                            zmax = max;
                            return max;
                        },

                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            },
                            textStyle: {
                                color: '#999'
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#999',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0
                            },

                                    }
                                }

                                //		           ,itemStyle: {normal: {
                                //		            	areaStyle: {type: 'default'},
                                //						//颜色渐变设置
                                //		            	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //		            		offset:0,
                                //		            		color:'#050AE8'
                                //		            	},{
                                //		            		offset:1,
                                //		            		color:'#8688F4'
                                //		            	}])
                                //		            }}
                            }
                            serie.push(item);
                        }
                        else if (chartName[j] == "警戒水位") {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                connectNulls: true,
                                symbol: 'none',
                                smooth: false,
                                itemStyle: {
                                    normal: {
                                        lineStyle: {
                                            width: 1,
                                            type: 'dotted'  //'dotted'虚线 'solid'实线
                                        }
                                    }
                                }
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                type: 'line',
                                symbol: 'none',
                                connectNulls: true,
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    var item = {
                        name: '平行于y轴的趋势线',
                        type: 'line',
                        markLine: {
                            itemStyle: {      //盒须图样式。
                            },
                            name: 'cc',
                            //yAxisIndex: 0,
                            // symbol:'none',//去掉箭头
                            data: [[
                                { coord: [tm, 0] },
                                { coord: [tm, 3] }
                            ]]
                        }
                    }
                    serie.push(item);
                    return serie;
                }()
            };

            myChart.resize();
            myChart.setOption(option);
        }

        function loadChartSW(data) {
            var value = tree.getValue(true);
            var gridcolumns = [];
            var aggWG = [];
            var aggWGStr = "[";
            var tempStime = new Date(stime);
            var tempEtime = new Date(etime);
            var date3 = tempEtime.getTime() - tempStime.getTime();  //时间差的毫秒数
            var days = Math.floor(date3 / (3600 * 1000));
            var arr = value.split(",");
            gridcolumns.push({ field: 'TM', header: '时间', headerAlign: "center", align: "center" });
            var strNote = '[{"name": "名称","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            for (var i = 0; i < arr.length; i++) {
                if (arr[i] != ZU_ID) {
                    var p1 = arrFA.filter(function (e) {
                        return e.ID == arr[i];
                    });
                    strNote += ',{"name": "' + p1[0].DD_NAME + '","codename": "DATA_' + (i + 1) + '","tableV":"1","isShow":true,"width":"30%"}';
                    gridcolumns.push({ field: 'DATA_' + (i + 1), header: p1[0].DD_NAME, headerAlign: "center", align: "center" });
                }
            }
            strNote = strNote + "]";
            if (days > 0) {
                var strJson = data;
                for (IInum = 0; IInum < days; IInum++) {
                    var tempTM = new Date(AddHourDate(stime, IInum)).format("yyyy-MM-dd HH:mm:ss");
                    var tempData = strJson.filter(function (e) {
                        return convertToDate(e.YMDHM).format("yyyy-MM-dd HH:mm:ss") == tempTM;
                    });
                    var arrStr = '{ "TM": "' + tempTM + '",';
                    if (tempData.length > 0) {
                        for (var i = 0; i < arr.length; i++) {
                            if (arr[i] != ZU_ID) {
                                var p1 = tempData.filter(function (e) {
                                    return e.PLAN_N == arr[i];
                                });
                                if (p1.length > 0) {
                                    var TH = p1[0].DATA;
                                    arrStr += '"DATA_' + (i + 1) + '":"' + TH + '",';
                                }
                            }
                        }
                    }

                    arrStr = arrStr.substring(0, arrStr.length - 1) + "}";
                    aggWGStr += arrStr + ",";
                }
            }
            var LineColor = ['#00FF00', '#FF0000', '#FFA500', '#7CB5EC', '#F7A35C', '#8085E9', '#F15C80', '#90ED7D', '#44A9A8', '#7D7D87', '#8085E9'];
            if (aggWGStr != "") {
                aggWGStr = aggWGStr.substring(0, aggWGStr.length - 1) + "]";
            }
            aggWG = eval('(' + aggWGStr + ')');
            chartSW("Chart", aggWG, eval('(' + strNote + ')'), LineColor, "水位(m)");

            grid.set({
                columns: gridcolumns
            });
            grid.setData(aggWG);
            $("#dataLoad").hide();
        }
