<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
    <link href="../arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" />
    <link href="../arcgis_js_api/myJs/style/index.css" rel="stylesheet" type="text/css" />
    <script src="../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <style>
        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

            .mini-grid-summaryRow tr td span {
                color: #000 !important;
                line-height: 25px;
                font-weight: 400 !important;
            }

        .label {
            height: 30px;
            line-height: 30px;
        }
    </style>
</head>
<body>
    <!--页面载入显示-->
    <div id="dataLoad" class="load">
        <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td align="center">
                    <img src="../arcgis_js_api/myJs/images/wait1.gif" />
                </td>
            </tr>
            <tr>
                <td align="center">
                    数据载入中，请稍后......
                </td>
            </tr>
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <div class="mini-toolbar" style="padding-top: 3px;">
        <table style="width: 100%;">
            <tr>
                <td style="width:20%;">
                    <div style="cursor:pointer;" onclick="showFs_clickHandler(this)">
                        <img src="../Common/images/shrink.png" title="多方案对比" style="float:left;" /><span style="display: block;float: left;line-height: 20px;margin-left:5px;">多方案对比</span>
                    </div>
                </td>
                <td style="width: 80%;display:none">
                    &nbsp;&nbsp; 开始时间：&nbsp;
                    <input id="STIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:mm" showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                    结束时间：&nbsp;
                    <input id="ETIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:mm" showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                    <a id="searchbtn" class="mini-button" onclick="btnSearch()">查询</a>
                    <a class="mini-button" onclick="doExport()">导出</a>
                </td>
                <td align="right">
                    <div class="bootstrap-switch ">
                        <div class="bootstrap-switch-container">
                            <span class="bootstrap-switch-handle-on switch" onclick="OnBoot(this.id,'fit1')" id="switch1"><i class="fa fa-line-chart"></i></span>
                            <span class="bootstrap-switch-handle-off switch" onclick="OnBoot(this.id,'fit2')" id="switch2"><i class="fa fa-table"></i></span>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
    <div class="mini-fit" style="margin-top:1px;height: -webkit-calc(100% - 36px);height: -moz-calc(100% - 36px);height: calc(100% - 36px);">
        <div id="fit1" class="fit">
            <div id="Chart" style="width: 98%; height:480px; text-align: center">
            </div>
            <table style="margin: 0 auto;width: 50%;">
                <tr style="display:none;">
                    <td style="color: #000; " align="right">
                        水位最高：
                    </td>
                    <td style="color:  #000;" align="left">
                        <span id="maxUpz"></span>，<span id="maxUpTime"></span>
                    </td>
                    <td style="color:  #000; " align="right">
                        水位最低：
                    </td>
                    <td style="color:  #000;" align="left">
                        <span id="minUpz"></span>，<span id="minUpTime"></span>
                    </td>
                </tr>
                <tr>
                    <td style="color: #000;" align="right">
                        最大流量：
                    </td>
                    <td style="color:#000;" align="left">
                        <span id="maxDown"></span>，<span id="maxDownTime"></span>
                    </td>
                    <td style="color:#000;" align="right">
                        最小流量：
                    </td>
                    <td style="color:#000;" align="left">
                        <span id="minDown"></span>，<span id="minDownTime"></span>
                    </td>
                </tr>
            </table>

        </div>
        <div id="fit2" class="fit" style="height:480px;">
            <div id="grid1" class="mini-datagrid" style="width: 100%; height: 100%;" allowalternating="true" sizeList="[15,20,30,50,100]" pageSize="15"
                 showsummaryrow="true" idfield="STCD" allowresize="false" ondrawcell="ondrawcell" showpager="false" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
                 ondrawsummarycell="onDrawSummaryCell">
                <div property="columns">
                    <div field="TM" width="150" align="center" headeralign="center" allowsort="false">
                        时间
                    </div>
                    <div field="YBZ" width="120" align="center" headeralign="center" allowsort="true"
                         summarytype="max">
                        流量(m³/s)
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div style="display:none;position:absolute;top: 40px;left:5.5px; z-index: 99999;background:#fff;" id="treeDIV">
        <ul id="tree1" class="mini-tree" style="width: 100%; height: 100%; padding: 5px;border:0px;" showtreeicon="true" textfield="NAME" expandonload="true"
            idfield="ID" parentfield="PID"
            resultastree="false" showCheckBox="true" checkRecursive="true"
            allowSelect="false" enableHotTrack="false" onnodecheck="onNodeCheck"></ul>
    </div>
    <script type="text/javascript">
        mini.parse();
        var stcd = GetQueryString("stcd");
        var stnm = GetQueryString("stnm");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        var PLAN_N = GetQueryString("PLAN_N");
        var ZU_ID = GetQueryString("ZU_ID");
        var datatype = GetQueryString("datatype");
        var grid = mini.get("grid1");
        var tree = mini.get("tree1");

        var arrZU, arrFA, arrZhan;
        $(function () {
            $("#fit2").hide();
            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);

            //获取方案组
            var strWhere = {
                "ID": ZU_ID
            };
            GetJosns("MODE_SCHEME_TYPESel", strWhere, "MODE_SCHEME_TYPESel");
        });

        function btnSearch() {
            $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
            setTimeout('BreakLayerLoad()', 100);
        }

        function BreakLayerLoad(value) {
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(endDate);
            GetJosns("YBSHUIWEI", { "STIME": d1.format("yyyy-MM-dd HH:mm:ss"), "ETIME": d2.format("yyyy-MM-dd HH:mm:ss"), "STCD": stcd, "PLAN_N": value, "TYPE": datatype }, "Sel");
        }

        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                if (data.total > 0) {
                    //$("#dataShow").hide();
                } else {
                    noData();
                    //$("#Chart").html("<h1 style=\"text-align:center;padding-top:18%;\">暂无数据</h1>");
                    //$("#dataShow").show();
                }
                JsonLineChart(dataResult);
                grid.setData(dataResult.data);
                //console.log(JSON.stringify(dataResult));
                //fillData(0, grid.getPageSize(), dataResult, grid);
                $("#dataShow").hide();
                $("#dataLoad").hide();
            } else if (typeID == "MODE_SCHEME_TYPESel") {
                arrZU = data.data;
                strWhere = {
                    "DD_MIND": ZU_ID
                };
                setTimeout(function () { GetJosns("MODE_DD_SOLUTIONSel", strWhere, "MODE_DD_SOLUTIONSel"); }, 200);
            } else if (typeID == "MODE_DD_SOLUTIONSel") {
                arrFA = data.data;
                var newARR = [];
                newARR.push({ "ID": arrZU[0].ID, "PID": "-1", "NAME": arrZU[0].NAME, "NOTE": arrZU[0].NOTE });
                for (var i = 0; i < arrFA.length; i++) {
                    newARR.push({ "ID": arrFA[i].ID, "PID": arrFA[i].DD_MIND, "NAME": arrFA[i].DD_NAME, "NOTE": arrFA[i].NOTE });
                }
                tree.loadList(newARR, "ID", "PID");
                var nodes = tree.findNodes(function (node) {
                    if (node.ID == PLAN_N) return true;
                });
                tree.checkNodes(nodes);

                var value = tree.getValue(true);
                if (value != "") {
                    BreakLayerLoad(value);
                }
            } else if (typeID == "MODE_BDMS_PREDICTSel") {
                loadChartSW(data.data);
            }
        }
        function noData() {
            $("#maxUpz").html("无");
            $("#maxUpTime").html("无");
            $("#minUpz").html("无");
            $("#minUpTime").html("无");
            $("#maxDown").html("无");
            $("#maxDownTime").html("无");
            $("#minDown").html("无");
            $("#minDownTime").html("无");
        }
        function JsonLineChart(strJson) {
            var strData = "";
            var _XData = [];
            if (strJson.data.length > 0) {
                var SWMAX = -9999, SWMIN = 9999, XYMAX = -9999, XYMIN = 9999;
                var SWMAXTM = "", SWMINTM = "", XYMAXTM = "", XYMINTM = "";
                for (num = 0; num < strJson.data.length; num++) {
                    if (strJson.data[num].UPZ != "" && strJson.data[num].UPZ != null) {
                        if (SWMAX < parseFloat(strJson.data[num].UPZ)) {
                            SWMAX = parseFloat(strJson.data[num].UPZ).toFixed(2);
                            SWMAXTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                        if (SWMIN > parseFloat(strJson.data[num].UPZ)) {
                            SWMIN = parseFloat(strJson.data[num].UPZ).toFixed(2);
                            SWMAXTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                    }
                    if (strJson.data[num].YBZ != "" && strJson.data[num].YBZ != null) {
                        if (XYMAX < parseFloat(strJson.data[num].YBZ)) {
                            XYMAX = parseFloat(strJson.data[num].YBZ).toFixed(2);
                            SWMAXTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                        if (XYMIN > parseFloat(strJson.data[num].YBZ)) {
                            XYMIN = parseFloat(strJson.data[num].YBZ).toFixed(2);
                            SWMAXTM = new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm");
                        }
                    }

                    _XData.push({ TM: new Date(convertToDate(strJson.data[num].TM)).format("MM-dd HH:mm"), UPZ: strJson.data[num].UPZ, YBZ: strJson.data[num].YBZ, WRZ: strJson.data[num].WRZ });
                }
                console.log(JSON.stringify(_XData));
                GetObj("maxUpz").innerHTML = SWMAX == -9999 ? "-" : SWMAX + "m";
                GetObj("maxUpTime").innerHTML = SWMAXTM;
                GetObj("minUpz").innerHTML = SWMIN == 9999 ? "-" : SWMIN + "m";
                GetObj("minUpTime").innerHTML = SWMINTM;
                GetObj("maxDown").innerHTML = XYMAX == -9999 ? "-" : XYMAX + "m³/s";
                GetObj("maxDownTime").innerHTML = XYMAXTM;
                GetObj("minDown").innerHTML = XYMIN == 9999 ? "-" : XYMIN + "m³/s";
                GetObj("minDownTime").innerHTML = XYMINTM;
            }
            //绘制数据说明
            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            //strNote += ',{"name": "流量","codename": "UPZ","tableV":"1","isShow":true,"width":"30%"}';
            strNote += ',{"name": "流量","codename": "YBZ","tableV":"1","isShow":true,"width":"30%"}';
            //strNote += ',{"name": "警戒水位","codename": "WRZ","tableV":"1","isShow":true,"width":"30%"}';
            strNote += ']';
            //绘制过程线颜色设置
            var LineColor = ['#0095F0', '#0000FF', '#FFA500'];
            //绘制图形
            chartSW("Chart", _XData, eval('(' + strNote + ')'), LineColor, "流量(m³/s)");

        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });

        //统计水位
        function onDrawSummaryCell(e) {
            var value = e.value;
            if (e.field == "YBZ") {
                value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">预报最大流量: " + value + "m</span>" : e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">预报最大流量: 无</span>";
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (Number(row.WRZ) > 0 && Number(row.UPZ) > Number(row.WRZ)) {
                e.cellStyle = "color:#FFA500";
            }
            if (Number(row.GRZ) > 0 && Number(row.UPZ) > Number(row.GRZ)) {
                e.cellStyle = "color:red";
            }
            if (field == "TM") {
                e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm:ss");
            }
        }


        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            //$(".fit").css("display", "none");
            //$("#" + objFit).css("display", "block");
            $(".fit").hide();
            $("#" + objFit).show();
        }


        function showFs_clickHandler(obj) {
            var isDisplay = $("#treeDIV").css("display");

            if (isDisplay == "none") {
                $("#treeDIV").css("display", "block");
            } else {
                $("#treeDIV").css("display", "none");
            }
        }

        function onNodeCheck(e) {
            var tree = e.sender;
            var node = e.node;
            var value = tree.getValue(true);

            //数据库查询曲线
            if (value != "") {
                $("#dataLoad").show();
                onLoadDuofangan();
            } else {
                mini.alert("请选择方案！");
            }
        }

        //多方案对比
        function onLoadDuofangan() {
            $("#tongjiTable").hide();
            var value = tree.getValue(true);
            var str = "";
            for (var i = 0; i < arrFA.length; i++) {
                if (value.indexOf(arrFA[i].DD_ID > -1))
                    str += arrFA[i].DD_ID + ",";
            }
            if (str != "") {
                str = str.substring(0, str.length - 1);
            }
            var strWhere = { PLAN_N: str, STCD: stcd, DATA_TYPE: "7,8" };
            GetJosns("MODE_BDMS_PREDICTSel", strWhere, "MODE_BDMS_PREDICTSel");
        }

        function loadChartSW(data) {
            var value = tree.getValue(true);
            var gridcolumns = [];
            var aggWG = [];
            var aggWGStr = "[";
            var tempStime = new Date(stime);
            var tempEtime = new Date(etime);
            var date3 = tempEtime.getTime() - tempStime.getTime();  //时间差的毫秒数
            var days = Math.floor(date3 / (3600 * 1000));
            var arr = value.split(",");
            gridcolumns.push({ field: 'TM', header: '时间', headerAlign: "center", align: "center" });
            var strNote = '[{"name": "名称","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            for (var i = 0; i < arr.length; i++) {
                if (arr[i] != ZU_ID) {
                    var p1 = arrFA.filter(function (e) {
                        return e.ID == arr[i];
                    });
                    strNote += ',{"name": "' + p1[0].DD_NAME + '","codename": "DATA_' + (i + 1) + '","tableV":"1","isShow":true,"width":"30%"}';
                    gridcolumns.push({ field: 'DATA_' + (i + 1), header: p1[0].DD_NAME, headerAlign: "center", align: "center" });
                }
            }
            strNote = strNote + "]";
            if (days > 0) {
                var strJson = data;
                for (IInum = 0; IInum < days; IInum++) {
                    var tempTM = new Date(AddHourDate(stime, IInum)).format("yyyy-MM-dd HH:mm:ss");
                    var tempData = strJson.filter(function (e) {
                        return convertToDate(e.YMDHM).format("yyyy-MM-dd HH:mm:ss") == tempTM;
                    });
                    var arrStr = '{ "TM": "' + tempTM + '",';
                    if (tempData.length > 0) {
                        for (var i = 0; i < arr.length; i++) {
                            if (arr[i] != ZU_ID) {
                                var p1 = tempData.filter(function (e) {
                                    return e.PLAN_N == arr[i];
                                });
                                if (p1.length > 0) {
                                    var TH = p1[0].DATA;
                                    arrStr += '"DATA_' + (i + 1) + '":"' + TH + '",';
                                }
                            }
                        }
                    }

                    arrStr = arrStr.substring(0, arrStr.length - 1) + "}";
                    aggWGStr += arrStr + ",";
                }
            }
            var LineColor = ['#00FF00', '#FF0000', '#FFA500', '#7CB5EC', '#F7A35C', '#8085E9', '#F15C80', '#90ED7D', '#44A9A8', '#7D7D87', '#8085E9'];
            if (aggWGStr != "") {
                aggWGStr = aggWGStr.substring(0, aggWGStr.length - 1) + "]";
            }
            aggWG = eval('(' + aggWGStr + ')');
            chartSW("Chart", aggWG, eval('(' + strNote + ')'), LineColor, "流量(m³/s)");

            grid.set({
                columns: gridcolumns
            });
            grid.setData(aggWG);
            $("#dataLoad").hide();
        }
    </script>
</body>
</html >
