    <script type="text/javascript">
        mini.parse();
        var stcd = GetQueryString("stcd");
        var stnm = GetQueryString("stnm");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        var exkey = GetQueryString("exkey");
        var eqptp = GetQueryString("eqptp");
        var grid = mini.get("grid1");
        var myData = [];
        $(function () {
            $("#fit2").hide();
            var tm = new Date();
            if (stime == null) {
                stime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
            } else {
                stime = formatDate(stime).format("yyyy/MM/dd HH:mm:ss")
            }
            if (etime == null) {
                etime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
            } else {
                etime = formatDate(etime).format("yyyy/MM/dd HH:mm:ss")
            }
            if (new Date(stime.replaceAll('-', '/')) > new Date(etime)) {
                stime = addDayDate(stime, -1) + " 08:00:00"
            }
            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            BreakLayerLoad();
        });

        function btnSearch() {
            $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
            setTimeout('BreakLayerLoad()', 100);
            //BreakLayerLoad();
        }

        function BreakLayerLoad() {
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(endDate);
            if (parseInt(d2 - d1) < 0) {
                $("#dataShow").hide();
                $("#dataLoad").hide();
                mini.alert("开始时间不大于结束时间！");
                return;
            }
            if (parseInt(d2 - d1) / 1000 / 60 / 60 / 24 > 90) {
                $("#dataShow").hide();
                $("#dataLoad").hide();
                mini.alert("时间不能大于三个月！");
                return;
            }
            var s_where = {
                "stcd": stcd,
                "stime": d1.format("yyyy-MM-dd HH:mm:ss"),
                "etime": d2.format("yyyy-MM-dd HH:mm:ss"),
                // "exkey": exkey,
                // "eqptp": eqptp
            };
            // GetJosns("WATER_ST_GATE_RSel", s_where, "Sel");
            
            app.post("SWZZ_RTSQ_ST_GATE_RNEW/queryDANZHANList",s_where,function(res){
                JosnSel(res,"Sel");
            });
        }

        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                if (data.total > 0) {
                    upAndDown(data.data);
                    $("#dataShow").hide();

                } else {
                    noData();
                    $("#dataShow").hide();
                    $("#dataLoad").hide();
                }

            }
        }
        function JsonLineChart(data) {
            var xData = [];
            var min = 100; var max = 0;
            var minTM = "", maxTM = "";
            for (var i = 0; i < data.length; i++) {

                //if (tm == "") {
                //    tm = data[i].TM;
                //} else {
                var tm = new Date(data[i].tm).format('MM/dd HH:mm');
                //}
                xData.push({ "TM": tm, "GTQ": Number(data[i].gtq).toFixed(2) });

            }

            var strNote = '[{"name": "时间","codename": "TM","tableV":"1","isShow":true,"width":"40%"}';
            strNote += ',{"name": "' + exkey + '#' + eqptp + '","codename": "GTQ","tableV":"1","isShow":true,"width":"30%"}]';
            var LineColor = ['#0000FF', '#00FF00', '#FF0000'];
            var tempVal = eqptp + "（m³/s）";
            if (eqptp == "闸坝开度") {
                tempVal = "闸门开度（m）";
            } else if (eqptp == "泵站电流") {
                tempVal = "泵站电流（A）";
            }
            chartLL("Chart", xData, eval('(' + strNote + ')'), LineColor, tempVal);
        }



        function upAndDown(data) {
            data=data.filter(function (item) {
                return item.exkey==exkey&&item.eqptp==eqptp;
            });
            var maxUp = 0;
            var minDown = 1000;

            var maxFlow = -100;
            var minFlow = 100;
            var upTime = "";
            var downTime = "";
            var maxFlowTime = "";
            var minFlowTime = "";
            var dt = [];
            for (var i = 0; i<data.length; i++) {
                var upz = Number(data[i].gtq).toFixed(2);
                var tm;
                if (tm == "") {
                    tm = data[i].tm;
                } else {
                    tm = new Date(data[i].tm).format('yyyy/MM/dd HH:mm:ss');
                }
                var q = Number(data[i].gtq).toFixed(2);
                if (maxUp < upz) {
                    maxUp = upz;
                    upTime = tm;
                }
                if (minDown > upz) {
                    minDown = upz;
                    downTime = tm;
                }

                if (maxFlow < q) {
                    maxFlow = q;
                    maxFlowTime = tm;
                }
                if (minFlow > q) {
                    minFlow = q;
                    minFlowTime = tm;
                }
                dt.push(data[i]);
            }
            $.data(myData, "DT", dt);
            if (maxUp == "") {
                maxUp = "无";
            } else {
                maxUp += "m";
            }
            if (upTime == "") {
                upTime = "无";
            }
            if (minDown == "") {
                minDown = "无";
            } else {
                minDown += "m";
            }
            if (downTime == "") {
                downTime = "无";
            }

            var tempVal = "m³/s";
            if (eqptp == "闸坝开度") {
                tempVal = "m";
            } else if (eqptp == "泵站电流") {
                tempVal = "A";
            }

            if (maxFlow == ""||maxFlow==-100) {
                maxFlow = "无";
            } else {
                maxFlow = maxFlow + tempVal
            }
            if (maxFlowTime == "") {
                maxFlowTime = "无";
            }
            if (minFlow == ""||minFlow==100) {
                minFlow = "无";
            } else {
                minFlow = minFlow + tempVal
            }
            if (minFlowTime == "") {
                minFlowTime = "无";
            }

            $("#upz").html(maxUp);
            $("#dpz").html(minDown);
            $("#upTime").html(upTime);
            $("#downTime").html(downTime);


            $("#maxFlow").html(maxFlow);
            $("#minFlow").html(minFlow);
            $("#maxFlowTime").html(maxFlowTime);
            $("#minFlowTime").html(minFlowTime);


            JsonLineChart($.data(myData, "DT"));
            var tempResult = dataResult.data;
            // .filter(function (e) {
            //     return Number(e.GTQ) > 0.1;
            // });
            $.data(myData, "TotalCount", tempResult.length);
            console.error(tempResult);
            grid.setData(tempResult);
            //fillData(0, grid.getPageSize(), dataResult, grid);
            $("#dataShow").hide();
            $("#dataLoad").hide();
        }

        function noData() {
            $("#Chart").html("<div style=\"line-height:120px;height:120px;font-size:30px;\">暂无数据</div>");
            $("#upz").html("无");
            $("#dpz").html("无");
            $("#upTime").html("无");
            $("#downTime").html("无");

            $("#maxFlow").html("无");
            $("#minFlow").html("无");
            $("#maxFlowTime").html("无");
            $("#minFlowTime").html("无");
        }

        function doExport() {
			var data = grid.data;
            var columns = grid.columns;
            ExportExcel(data,grid,stnm + "运行情况");
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });

        function onDrawSummaryCell(e) {
            // var value = e.value;
            // if (e.field == "GTQ") {
            //     var tempVal = "m³/s";
            //     if (eqptp == "闸坝开度") {
            //         tempVal = "m";
            //     } else if (eqptp == "泵站电流") {
            //         tempVal = "A";
            //     }
            //     value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最大" + eqptp + "数据: " + Number(value).toFixed(2) + tempVal + "</span>" :
            //         e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">最大数据: 无</span>";
            // } else if (e.field == "TM") {
            //     var tempTotal = 0;
            //     if ($.data(myData, "TotalCount") != undefined) {
            //         tempTotal = Number($.data(myData, "TotalCount"));
            //     }
            //     value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">时长: " + Number((tempTotal * 5) / 60).toFixed(2) + "（时）</span>" :
            //         e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">时长: 无</span>";
            // }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "gtq") {
                if (value != "") {
                    e.cellHtml = Number(value).toFixed(2);
                }
            }
            if (field == "tm") {
                if (value != "") {
                    e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
                }
            }
            if (field == "stnm") {
                e.cellHtml = stnm + row.exkey + "#" ;//+ row.eqptp;
            }
        }

        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            //$(".fit").css("display", "none");
            //$("#" + objFit).css("display", "block");
            $(".fit").hide();
            $("#" + objFit).show();
        }

    </script>
    <script type="text/javascript">
        /* 柱状图 雨量
* ChartName画图控件名称
* dataS数据对象，数据格式json
* strNote数据说明，数据类型数组，数据格式
* json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示
*/
        function chartLL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();

            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                        //chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });

            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '1%',
                    right: '2%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                toolbox: {
                    show: false,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: { show: false, type: ['line', 'bar'] },
                        restore: { show: false },
                        saveAsImage: { show: false }
                    }
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        scale: true, //是否自动计算最大最小值。
                        boundaryGap: false,
                        axisLine: {
                            lineStyle: {
                                color: '#999',
                                width: 1 //这里是为了突出显示加上的
                            },
                            textStyle: {
                                color: '#999',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                yAxis: [
                    {
                        type: 'value',
                        name: max_min_Name,
                        scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#E5E5E5',
                                width: 1,
                                type: 'dashed'
                            }
                        },
                        min:function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (value.min == 0) {
                                return value.min;
                            } else {
                                if ((jiangenew - jiange) % 2 == 0) {
                                    return value.min - (jiangenew - jiange) / 200;
                                }
                                else {
                                    return value.min - (jiangenew - jiange - 1) / 200;
                                }
                            }
                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 200;
                            }

                        },
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            }
                        }, axisLine: {
                            lineStyle: {
                                color: '#999',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            if (m[i][j] != "" && m[i][j] != null) {
                                chartValue.push(m[i][j]); //循环价值
                            }
                        }

                        if (max_min_Name != "" & max_min_Name == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                yAxisIndex: 1,
                                smooth: true
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                itemStyle: {
                                    normal: {
                                        lineStyle: {
                                            width: 1,
                                            type: 'solid'  //'dotted'虚线 'solid'实线
                                        }
                                    }
                                }
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }



    </script>
