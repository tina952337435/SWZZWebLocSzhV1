            function GetView(stcd, exkey, eqptp, strTITLE) {

            function toggleFieldSet(ck, id) {
                var dom = document.getElementById(id);
                dom.className = !ck.checked ? "hideFieldset" : "";
            }

            function onTMRenderer(e) {
                var value = e.value;
                if (!value) {
                    return;
                }
                if (value !== "") {
                    return (value).format("yyyy-MM-dd HH:mm");
                }
                return "";
            }
            function ondrawcell(e) {
                var row = e.row,
                    column = e.column,
                    field = e.field,
                    value = e.value;
                rowIndex = e.rowIndex;
                var record = e.record;
                if (field == "STNM") {
                    var s = '';

                    s = $.data(myData, "STNM") + record.exkey + "#" + record.eqptp;
                    e.cellHtml = s;
