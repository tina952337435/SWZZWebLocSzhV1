<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <link rel="stylesheet" href="">
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../Common/Scripts/ChartJs.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <!--border: 1px solid #ecd0d0;-->
    <div id="YBTM" style="position:absolute;right:20px;top:10px;z-index:99;font-size:16px;height: 40px;line-height: 40px;padding: 0px 15px;border-radius: 5px;"></div>
    <div id="myCharts" style="width:100%;height:100%;">
    </div>
    <script>
        mini.parse();
        var myData = [];
        var STCD = GetQueryString("stcd");
        var DD_ID = GetQueryString("PLAN_N");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
		//console.log(stime);
		//console.log(etime);

        $(function () {
            //GetJosns("MODE_ES_PROFILESel", { "STCD": STCD }, "MODE_ES_PROFILESel");
			app.post("SWZZ_MODE_ES_PROFILE/findResult",{"stcd": STCD},(data)=>{
				JosnSel(data,"MODE_ES_PROFILESel")
			})
        });

        function BreakLayerLoad() {
            //GetJosns("MODE_BDMS_PREDICTSelMORE", { "STIME": stime, "ETIME": etime, "STCD": STCD, "PLAN_N": DD_ID, "DATA_TYPE": "1" }, "Sel");
			app.post(
				"SWZZ_MODE_BDMS_PREDICT/MODE_BDMS_PREDICTSelMORE",
				{ "startdate": stime, "enddate": etime, "stcd": STCD, "plan_n": DD_ID, "data_TYPE": "1" },
				(data)=>{
					JosnSel(data,"Sel");
				}
			)
		}

        var dataResult = null;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data.data;
                var interval = setInterval(getProcess,400);
                //getProcess();
            } else if (typeID == "MODE_ES_PROFILESel") {
                $.data(myData, "dataResult", data.data);
                BreakLayerLoad();
            }
        }
        var t = null;
        var timeout = false;
        var lengthIndex = 0;
        var dataValue = 0, wrz = 0, grz = 0;
        function getProcess() {
            window.clearTimeout(t);
            if (timeout) return;
            if (lengthIndex < dataResult.length) {
                dataValue = dataResult[lengthIndex].DATA;

                wrz = dataResult[lengthIndex].WRZ;
                grz = dataResult[lengthIndex].GRZ;
                var data = $.data(myData, "dataResult");
                for (var num = 0; num < data.length; num++) {
                    data[num].UPZ = dataValue;
                    data[num].WRZ = wrz;
                    data[num].GRZ = grz;
                }
                var tm = mini.formatDate(new Date(dataResult[lengthIndex].YMDHM), 'yyyy年MM月dd日 H时');
                $("#YBTM").html(tm);
                waterHeightChange("myCharts", data);
                lengthIndex++;
            } else {
                //暂停
                window.clearInterval(t);
                //timeout = true;
                lengthIndex = 0
            }
        }

        //模拟水位变化
        function waterHeightChange(ChartName, data) {
            //console.error(JSON.stringify( data));
            var strNote = [];
            strNote.push({ "name": "时间", "codename": "X", "tableV": "1", "isShow": true, "width": "40%" });
            strNote.push({ "name": "预报水位", "codename": "UPZ", "tableV": "1", "isShow": true, "width": "40%" });
            strNote.push({ "name": "警戒水位", "codename": "WRZ", "tableV": "1", "isShow": false, "width": "40%" });
            strNote.push({ "name": "保证水位", "codename": "GRZ", "tableV": "1", "isShow": false, "width": "40%" });
            strNote.push({ "name": "断面高程", "codename": "Y", "tableV": "1", "isShow": true, "width": "40%" });

            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //断面高程
            var chartValueUPZ = []; //当前水位
            var chartValueMM = [];
            var chartValueWRZ = []; //警戒水位
            var chartValueGRZ = []; //保证水位

            var ShowSelected = {};
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });
            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                chartTM.push(value["x"].toString()); //加入时间集合
                chartValue.push(value["y"]);
                chartValueMM.push(value["y"]);
                //chartValueUPZ.push(value["UPZ"]);
                //chartValueWRZ.push(value["WRZ"]);
                //chartValueGRZ.push(value["GRZ"]);
            });
            var yMin = Math.abs(GetSort(chartValueMM).min);
            var chartValueMMNew = [];
            for (var num = 0; num < chartValue.length; num++) {
                var value = parseFloat(parseFloat(chartValue[num] + yMin).toFixed(2));
                chartValueMMNew.push(value);
                value =parseFloat(parseFloat(data[num]["UPZ"] + yMin).toFixed(2));
                chartValueUPZ.push(value);
                value = 3.20 + yMin;//parseFloat(parseFloat(data[num]["WRZ"] + yMin).toFixed(2));
                chartValueWRZ.push(value);
                value = 3.80 + yMin; //parseFloat(parseFloat(data[num]["GRZ"] + yMin).toFixed(2));
                chartValueGRZ.push(value);
            }
            // console.error('chartValueUPZ',yMin);
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //myChart.clear();
            option = {
                xAxis: {
                    name: "距离(m)",
                    nameTextStyle: {
                        padding: [20, 100, 0, 0]    // 四个数字分别为上右下左与原位置距离
                    },
                    nameLocation: "center",
                    type: 'category',
                    boundaryGap: false,
                    tooltip: {
                        trigger: 'axis',
                        axisPointer: {
                            type: 'cross',
                            label: {
                                backgroundColor: '#6a7985'
                            }
                        }
                    },
                    data: chartTM
                },
                legend: {
                    top: 'top',
                    data: chartName,
                    selected: ShowSelected
                },
                grid: {
                    left: '1%',
                    right: '2%',
                    bottom:40,
                    top: 40,
                    containLabel: true
                },
                color: ["#E4D9F3", "#FFA5A4"],
                series: [
                    {
                        name: '预报水位',
                        data: chartValueUPZ,
                        type: 'line',
                        smooth: true,
                        symbolSize: 0,
                        //sampling: 'average',
                        itemStyle: {
                            color: '#00B0F0',
                            opacity: 0.5,
                            borderWidth: 0.5
                        },
                        markPoint: {
                            data: [
                                {
                                    type: 'min',
                                    name: '预报水位:',
                                    label: {
                                        formatter: function (item) {
                                            console.error(item.value);
                                            return parseFloat(item.value - yMin).toFixed(2);
                                            
                                        }
                                    }
                                }
                            ]
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                offset: 0,
                                color: '#3ECAEB'
                            },
                            {
                                offset: 1,
                                color: "#3D99FF"
                            },
                            ]),
                            opacity: 0.8
                        },
                        z: 0,
                    },
                    {
                        name: '警戒水位',
                        data: chartValueWRZ,
                        type: 'line',
                        smooth: true,
                        symbolSize: 0,
                        color: "#FFFF13",
                        lineStyle: {
                            type: "dashed"
                        },
                        z: 0,
                    },
                    {
                        name: '保证水位',
                        data: chartValueGRZ,
                        type: 'line',
                        smooth: true,
                        symbolSize: 0,
                        color: "red",
                        lineStyle: {
                            type: "dashed"
                        },
                        z:0,
                    },
                    {
                        name: '断面高程',
                        data: chartValueMMNew,
                        //markPoint: {
                        //    data: [{ type: 'max', name: '最大值' }]
                        //},
                        type: 'line',
                        smooth: true,
                        symbolSize: 0,
                        //sampling: 'average',
                        itemStyle: {
                            color: '#C05857'
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                offset: 0,
                                color: '#A2781E'
                            },
                            {
                                offset: 1,
                                color: "#A2781E"
                            },
                            ]),
                            opacity: 1
                        },
                        z: 1
                    }],
                yAxis: {
                    name: "高程(m)",
                    scale: true,
                    type: 'value',
                    min:function(){
                        console.error('yAxisMin',sortBy_Chart(chartValueMMNew).split('@')[0]);
                        return sortBy_Chart(chartValueMMNew).split('@')[0];
                    } ,
                    max: function(){
                        console.error('yAxisMax',sortBy_Chart(chartValueMMNew).split('@')[1]+2);
                        return sortBy_Chart(chartValueMMNew).split('@')[1]+2;
                    } ,
                    interval: 2,
                    splitLine: {
                        show: false
                    },
                    axisLabel: {
                        show: true,
                        textStyle: {
                            //color: '#0786b3',
                            //fontSize: '16'
                        },
                        formatter: function (item) {
                            return parseFloat(item - yMin).toFixed(2);
                        }
                    },
                },
            };
            //myChart.resize();
            myChart.setOption(option);
        }
    </script>
</body>
</html>
