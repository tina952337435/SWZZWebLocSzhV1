<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
    <link href="../arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" />
    <link href="../arcgis_js_api/myJs/style/index.css" rel="stylesheet" type="text/css" />
    <script src="../Common/Scripts/ChartJs.js" type="text/javascript"></script>

    <style>
        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

        .mini-grid-summaryRow tr td span {
            color: #000 !important;
            line-height: 25px;
            font-weight: 400 !important;
        }

        .label {
            height: 30px;
            line-height: 30px;
        }
    </style>
</head>

<body>
    <!--页面载入显示-->
    <div id="dataLoad" class="load">
        <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td align="center">
                    <img src="../arcgis_js_api/myJs/images/wait1.gif" />
                </td>
            </tr>
            <tr>
                <td align="center">
                    数据载入中，请稍后...
                </td>
            </tr>
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <div class="mini-toolbar" style="padding-top: 3px;">
        <table style="width: 100%;">
            <tr>
                <td>
                    <span style="float:left;">

                        &nbsp;&nbsp; 开始时间：&nbsp;
                        <input id="STIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:mm"
                            showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                        结束时间：&nbsp;
                        <input id="ETIME" class="mini-datepicker" style="width:145px;" format="yyyy-MM-dd HH:mm"
                            showtime="true" showOkButton="true" showClearButton="false" />&nbsp;&nbsp;
                        时段长：&nbsp;
                    </span>

                    <span id="rbl" class="mini-radiobuttonlist" repeatItems="1" repeatLayout="table"
                        repeatDirection="vertical" style="float:left;" textField="text" valueField="id" value="HOUR"
                        data="[{'id':'MIN','text':'分钟'},{'id':'HOUR','text':'小时'},{'id':'DAY','text':'日'}]"></span>
                    <span style="float:left;">

                        <a id="searchbtn" class="mini-button" onclick="btnSearch()">查询</a>
                        <a class="mini-button" onclick="doExport()">导出</a>
                    </span>

                </td>
                <td align="right">
                    <div class="bootstrap-switch ">
                        <div class="bootstrap-switch-container">
                            <span class="bootstrap-switch-handle-on switch" onclick="OnBoot(this.id,'fit1')"
                                id="switch1"><i class="fa fa-line-chart"></i></span>
                            <span class="bootstrap-switch-handle-off switch" onclick="OnBoot(this.id,'fit2')"
                                id="switch2"><i class="fa fa-table"></i></span>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
    <div class="mini-fit"
        style="margin-top:1px;height: -webkit-calc(100% - 36px);height: -moz-calc(100% - 36px);height: calc(100% - 36px);">
        <div id="fit1" class="fit">
            <div id="Chart" style="width: 98%; height:430px; text-align: center">
            </div>
            <table style="margin:0 auto; width:27%;">
                <tr>
                    <td align="right">最大雨量：</td>
                    <td align="left">
                        <span id="drp"></span>，<span id="Time"></span>
                    </td>
                </tr>
            </table>
        </div>
        <div id="fit2" class="fit" style="height:450px;">
            <div id="grid1" class="mini-datagrid" style="width: 100%; height: 100%;" allowalternating="true"
                sizeList="[15,20,30,50,100,500,1000]" pageSize="50" showsummaryrow="true" idfield="STCD"
                allowresize="false" ondrawcell="ondrawcell" showPager="false" ondrawsummarycell="onDrawSummaryCell"
                showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true">
                <div property="columns">
                    <div field="tm" width="120" align="center" headerAlign="center" allowSort="false">日期</div>
                    <div field="drp" width="120" align="center" headerAlign="center" allowSort="true" summaryType="sum">
                        雨量(mm)</div>
                </div>
            </div>
        </div>

    </div>

    <script type="text/javascript">
        mini.parse();
        var stcd = GetQueryString("stcd");
        var stnm = GetQueryString("stnm");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        var dayhour = GetQueryString("dayhour")==null?"HOUR":GetQueryString("dayhour");
        var grid = mini.get("grid1");
        var rbl = mini.get("rbl");
        rbl.on("valuechanged", function (e) {
            btnSearch();
        });


        $(function () {
            rbl.setValue(dayhour);
            $("#fit2").hide();
            var tm = new Date();
            if (stime == null) {
                stime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
            } else {
                stime = new Date(stime.replaceAll("-", "/")).format("yyyy/MM/dd HH:mm:ss")
            }
            if (etime == null) {
                etime = addDayDate(tm, -6) + " " + tm.format("HH:mm")
            } else {
                etime = new Date(etime.replaceAll("-", "/")).format("yyyy/MM/dd HH:mm:ss")
            }
            if (new Date(stime.replaceAll("-", "/")) > tm) {
                stime = addDayDate(stime, -1) + " 08:00:00"
            }

            mini.get("STIME").setValue(stime);
            mini.get("ETIME").setValue(etime);
            BreakLayerLoad();
        });

        function btnSearch() {
            $("#dataLoad").show(); //页面加载完毕后即将DIV隐藏
            setTimeout('BreakLayerLoad()', 100);
            //BreakLayerLoad();
        }

        function BreakLayerLoad() {
            var startDate = mini.get("STIME").getFormValue();
            var endDate = mini.get("ETIME").getFormValue();
            var d1 = formatDate(startDate);
            var d2 = formatDate(endDate);
            //if (parseInt(d2 - d1) < 0) {
            //    mini.alert("开始时间不大于结束时间！");
            //    return;
            //}
            //if (parseInt(d2 - d1) / 1000 / 60 / 60 / 24 > 90) {
            //    mini.alert("时间不能大于三个月！");
            //    return;
            //}
            var tempDay = rbl.getValue();

            //if (tempDay != "DAY") {
            //    tempDay = "";
            //}
            var strWhere = 
            {
                "stcd": stcd,
                "stime": d1.format("yyyy-MM-dd HH:mm:ss"),
                "etime": d2.format("yyyy-MM-dd HH:mm:ss"),
                "pathname": tempDay,
                "datasource": "BX"
            }
            app.post("/SWZZ_RTSQ_ST_PPTN_R/queryDRPDANZHANList", strWhere, (data) => {
                JosnSel(data, "Sel")
            });

        }

        var resultData;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                resultData = data;
                if (data.total > 0) {
                    $("#dataShow").hide();
                } else {
                    $("#drp").html("无");
                    $("#Time").html("无");
                    //$("#Chart").html("<h1 style=\"text-align:center;padding-top:18%;\">暂无数据</h1>");
                    //$("#dataShow").show();
                }
                JsonLineChart(data.data);
                //fillData(0, grid.getPageSize(), resultData, grid);
                grid.setData(resultData.data);
                $("#dataShow").hide();
                $("#dataLoad").hide();
            }
        }
        function JsonLineChart(strJson) {
            var _XData = [];
            var tempDay = rbl.getValue();
            if (strJson.length > 0) {
                var DRPMAX = -9999, DRPMAXTM = "";
                for (num =0; num<strJson.length; num++) {
                    if (strJson[num].drp != "" && strJson[num].drp != null) {
                        if (DRPMAX < parseFloat(strJson[num].drp)) {
                            DRPMAX = parseFloat(strJson[num].drp);
                            if (tempDay == "DAY") {
                                DRPMAXTM = new Date(strJson[num].tm).format("MM/dd");
                            } else {
                                DRPMAXTM = new Date(strJson[num].tm).format("MM/dd HH:mm");
                            }
                        }
                    }
                    if (tempDay == "DAY") {
                        _XData.push({ tm: new Date(strJson[num].tm).format("MM/dd"), drp: Number(strJson[num].drp).toFixed(1) });
                    } else {
                        _XData.push({ tm: new Date(strJson[num].tm).format("MM/dd HH:mm"), drp: Number(strJson[num].drp).toFixed(1) });
                    }
                }
                GetObj("drp").innerHTML = DRPMAX == -9999 ? "-" : DRPMAX.toFixed(1) + "mm";
                GetObj("Time").innerHTML = DRPMAXTM;
            }
            var strNote = '[{"name": "时间","codename": "tm","tableV":"1","isShow":true,"width":"40%"}';
            strNote += ',{"name": "雨量","codename": "drp","tableV":"1","isShow":true,"width":"30%"}]';
            //绘制过程线颜色设置
            var LineColor = ['#257BEE', '#FF0000', '#00FF00', '#FFA500'];
            //绘制图形
            chartYL("Chart", _XData, eval('(' + strNote + ')'), LineColor, "雨量");

        }
        function doExport(name) {
            var data = grid.data;
            ExportExcel(data, grid, stnm + "雨情");
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, resultData, grid);
        });

        //统计水位
        function onDrawSummaryCell(e) {
            var value = e.value;
            if (e.field == "drp") {
                value != null ? e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">累计雨量: " + Number(value).toFixed(1) + "mm</span>" : e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">累计雨量: 无</span>";
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "drp") {
                if (value != undefined) {
                    e.cellHtml = Number(value).toFixed(1);
                }
            } else if (field == "tm") {
                if (value != undefined) {
                    var tempDay = rbl.getValue();
                    if (tempDay != "DAY") {
                        e.cellHtml = new Date(value).format("yyyy-MM-dd HH:mm:ss");
                    } else {
                        e.cellHtml = new Date(value).format("yyyy-MM-dd");
                    }
                }
            }
        }

        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            //$(".fit").css("display", "none");
            //$("#" + objFit).css("display", "block");
            $(".fit").hide();
            $("#" + objFit).show();
        }

    </script>
    <script type="text/javascript">

        /* 柱状图 雨量
         * ChartName画图控件名称
         * dataS数据对象，数据格式json
         * strNote数据说明，数据类型数组，数据格式
         * json 格式说明 name数据类型名称，codename数据表示，tableV 表格是否显示，isShow 是否显示
         */
        function chartYL(ChartName, data, strNote, LineColor, max_min_Name) {
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            //清空绘画内容，清空后实例可用，因为并非释放示例的资源，释放资源我们需要dispose()
            myChart.clear();
            if (max_min_Name == "雨量") {
                max_min_Name = "雨量（mm）";
            }
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        chartTM.push(value[value1.codename]); //加入时间集合
                        //chartTM.push(IsSubDate(value[value1.codename], "MM-dd hh:mm", "4")); //加入时间集合
                    } else if (value1.name == "名称") {
                        chartTM.push(value[value1.codename]);
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var max_min = GetSort(chartValue);

            var option = {
                tooltip: {
                    showDelay: 0,
                    hideDelay: 50,
                    transitionDuration: 0,
                    backgroundColor: 'rgba(255,255,255,0.9)',
                    borderColor: '#4040FB',
                    borderRadius: 8,
                    borderWidth: 2,
                    padding: 10,
                    textStyle: {
                        color: '#000000'
                    },
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    }
                },
                grid: {
                    left: '2%',
                    right: '5%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                calculable: true,
                xAxis: [
                    {
                        type: 'category',
                        data: chartTM,
                        axisTick: {
                            alignWithLabel: false
                        }
                    }
                ],
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        splitNumeber: 5,
                        //scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#eee',
                                width: 1,
                                type: 'dashed',
                            }
                        },
                        //min: max_min.min, //动态设置最大值最小值。
                        min: 0,
                        max: max_min.max,
                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(1);
                            }
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            chartValue.push(m[i][j]); //循环价值
                        }
                        if (max_min_Name != "") {
                            var item = {
                                name: chartName[j],
                                type: 'bar',
                                data: chartValue,
                                barWidth: 20,
                                barWidth: '60%',
                                label: {
                                    normal: {
                                        show: true,
                                        position: 'top',
                                        formatter: function (v) {
                                            var labelValue = "";
                                            if (Number(v.value) > 0) {
                                                //labelValue=Number(v.value).toFixed(2);
                                            }
                                            return labelValue;
                                        }
                                    }
                                },
                                smooth: true
                                //,itemStyle: {
                                //    normal: {
                                //        areaStyle: { type: 'default' },
                                //        //颜色渐变设置
                                //        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{
                                //            offset: 0,
                                //            color: '#050AE8'
                                //        }, {
                                //            offset: 1,
                                //            color: '#8688F4'
                                //        }])
                                //    }
                                //}
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }


    </script>
</body>

</html>
