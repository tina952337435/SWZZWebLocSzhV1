<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/Scripts/echarts.js" type="text/javascript"></script>
    <script src="../Common/boot.js" type="text/javascript"></script>
    <script src="../arcgis_js_api/myJs/parentIndex.js" type="text/javascript"></script>
    <link href="../arcgis_js_api/myJs/style/common.css" rel="stylesheet" type="text/css" />
    <link href="../arcgis_js_api/myJs/style/index.css" rel="stylesheet" type="text/css" />
    <script src="../Common/Scripts/ChartJs.js" type="text/javascript"></script>
    <style>
        .mini-grid-summaryRow div {
            background: none !important;
        }

        .mini-grid-summaryRow table {
            background: none !important;
        }

        .mini-grid-summaryRow tr td {
            text-align: center;
            background: none !important;
            border: none;
        }

            .mini-grid-summaryRow tr td span {
                color: #000 !important;
                line-height: 25px;
                font-weight: 400 !important;
            }

        .label {
            height: 30px;
            line-height: 30px;
        }
    </style>
</head>
<body>
    <!--页面载入显示-->
    <div id="dataLoad" class="load">
        <table style="width: 100%; height: 100%; border: 0;" align="center" valign="middle">
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
            <tr>
                <td align="center">
                    <img src="../arcgis_js_api/myJs/images/wait1.gif" />
                </td>
            </tr>
            <tr>
                <td align="center">
                    数据载入中，请稍后......
                </td>
            </tr>
            <tr style="height: 50%">
                <td align="center">
                    &nbsp;
                </td>
            </tr>
        </table>
    </div>
    <div class="mini-toolbar" style="padding-top: 3px;">
        <table style="width: 100%;">
            <tr>
                <td style="width:20%;">
                </td>
                <td align="right">
                    <div class="bootstrap-switch ">
                        <div class="bootstrap-switch-container">
                            <span class="bootstrap-switch-handle-on switch" onclick="OnBoot(this.id,'fit1')" id="switch1"><i class="fa fa-line-chart"></i></span>
                            <span class="bootstrap-switch-handle-off switch" onclick="OnBoot(this.id,'fit2')" id="switch2"><i class="fa fa-table"></i></span>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
    <div class="mini-fit" style="margin-top:1px;height: -webkit-calc(100% - 36px);height: -moz-calc(100% - 36px);height: calc(100% - 36px);">
        <div id="fit1" class="fit">
            <div id="Chart" style="width: 98%; height:480px; text-align: center">
            </div>
        </div>
        <div id="fit2" class="fit" style="height:480px;">
            <div id="grid1" class="mini-datagrid" style="width: 100%; height: 100%;" allowalternating="true" sizeList="[15,20,30,50,100]" pageSize="15" showpager="false"
                 showsummaryrow="true" idfield="STCD" allowresize="false" ondrawcell="ondrawcell" showemptytext="true" emptytext="暂无数据" alwaysshowemptytext="true"
                 ondrawsummarycell="onDrawSummaryCell">
                <div property="columns">
                    <div field="ZHANTIME" width="150" align="center" headeralign="center" allowsort="false">
                        时间
                    </div>
                    <div field="ZHANDATA" width="120" align="center" headeralign="center" allowsort="true"
                         summarytype="max">
                        雨量(mm)
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript">
        mini.parse();
        var stnm = GetQueryString("stnm");
        var DD_ID = GetQueryString("DD_ID");
        var stcd = "";
        var grid = mini.get("grid1");
        var myData = [];
        $(function () {
            $("#fit2").hide();
            BreakLayerLoad();
        });

        function BreakLayerLoad() {
            GetJosns("MODE_ES_ZHANDIANSel", { "ZHANNAME": stnm}, "MODE_ES_ZHANDIANSel");
        }
        function search() {
            GetJosns("MODE_ES_ZHANDIANDATASel", { "ZHANID": stcd, "SOLUTIONID": DD_ID }, "Sel");
        }

        var dataResult;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data;
                if (data.total > 0) {
                    JsonLineChart(dataResult.data);
                    grid.setData(dataResult.data);
                } else {
                    noData();
                }
                $("#dataShow").hide();
                $("#dataLoad").hide();
            }
            else if (typeID == "MODE_ES_ZHANDIANSel") {
                if (data.data.length > 0) {
                    stcd = data.data[0].ZHANID;
                    search();
                }
            }
        }
        function noData() {
        }
        function JsonLineChart(strJson) {
            var tempSum = 0;
            for (num = 0; num < strJson.length; num++) {
                var tempData = parseFloat(strJson[num].ZHANDATA);
                tempSum += tempData;
            }
            tempSum = tempSum.toFixed(2);
            $.data(myData, "tempSum", tempSum);
            var strData = "";
            var _XData = strJson;
            //绘制数据说明
            var strNote = '[{"name": "时间","codename": "ZHANTIME","tableV":"1","isShow":true,"width":"40%"}';
            strNote += ',{"name": "雨量","codename": "ZHANDATA","tableV":"1","isShow":true,"width":"30%"}]';
            //绘制过程线颜色设置
            var LineColor = ['#3398DB', '#0000FF', '#FFA500'];
            //绘制图形
            chartSW("Chart", _XData, eval('(' + strNote + ')'), LineColor, "雨量(mm)");
        }
        // 监听分页前事件，阻止后自行设置当前数据和分页信息
        grid.on("beforeload", function (e) {
            e.cancel = true;
            var pageIndex = e.data.pageIndex, pageSize = e.data.pageSize;
            fillData(pageIndex, pageSize, dataResult, grid);
        });
        //统计水位
        function onDrawSummaryCell(e) {
            var data = e.result;
            if (e.field == "ZHANDATA") {
                e.cellHtml = "<span  style=\"color:Blue;font-weight:bold;\">累计降雨: " + $.data(myData, "tempSum") + "m</span>";
            }
        }
        function ondrawcell(e) {
            var row = e.row,
                column = e.column,
                field = e.field,
                value = e.value;
            rowIndex = e.rowIndex;
            if (field == "ZHANTIME") {
                e.cellHtml = new Date(convertToDate(value)).format("yyyy-MM-dd HH:mm");
            } 
        }
        function OnBoot(objID, objFit) {
            $(".switch").removeClass("bootstrap-switch-handle-on");
            $(".switch").addClass("bootstrap-switch-handle-off");
            $("#" + objID).toggleClass("bootstrap-switch-handle-on");
            //$(".fit").css("display", "none");
            //$("#" + objFit).css("display", "block");
            $(".fit").hide();
            $("#" + objFit).show();
        }
        function chartSW(ChartName, data, strNote, LineColor, max_min_Name) {
            if (max_min_Name == "") {
                max_min_Name = "水位(m)";
            }
            var myChart = echarts.init(document.getElementById(ChartName));  //获得控件对象
            myChart.clear();

            //echarts.init(document.getElementById('quxian'), 'macarons');
            var chartName = []; 	//控件元素名称
            var chartTM = []; 	//时间序列
            var chartValue = []; //时间序列
            var liststr = ""; 	//拼装表格
            var m = new Array();

            var ShowSelected = {};
            $.each(strNote, function (index, value, item) {
                chartName.push(value.name);   //Echarts绘制标注名称加入
                ShowSelected[value.name] = value.isShow;
            });

            //循环数据，加入有效数据。
            $.each(data, function (index, value, item) {
                var charthan = []; 	//时间序列
                $.each(strNote, function (index1, value1, item1) {
                    charthan.push(value[value1.codename]); //加入集合
                    if (value1.name == "时间") {
                        //console.error(value[value1.codename]);
                        var tm = new Date(convertToDate(value[value1.codename])).format("yyyy-MM-dd HH");
                        chartTM.push(tm);
                    }else if (value1.name == "时间名称") {
                        chartTM.push(value[value1.codename]); //加入时间集合 
                    }
                    else {
                        chartValue.push(value[value1.codename]);
                    }
                });
                m.push(charthan); //加入集合
            });
            var option = {
                //backgroundColor: '#100E19',
                tooltip: {
                    trigger: 'axis'
                },
                color: LineColor,
                legend: {
                    data: chartName,
                    itemWidth: 8,
                    itemHeight: 8,
                    textStyle: {
                        color: '#000',
                        fontSize: 12
                    },
                    selected: ShowSelected
                },
                grid: {
                    left: '1%',
                    right: '2%',
                    bottom: '3%',
                    top: '15%',
                    containLabel: true
                },
                toolbox: {
                    show: true,
                    feature: {
                        mark: { show: false },
                        dataView: { show: false, readOnly: false },
                        magicType: { show: false, type: ['line', 'bar'] },
                        restore: { show: false },
                        saveAsImage: { show: true }
                    }
                },
                calculable: true,
                dataZoom: [
                    {
                        show: true,
                        realtime: true,
                        start: 0,
                        end: 40
                    },
                    {
                        type: 'inside',
                        realtime: true,
                        start: 0,
                        end: 40
                    }
                ],
                xAxis:
                {
                    type: 'category',
                    boundaryGap: false,
                    data: chartTM,
                    axisPointer: {
                        //value: tm,
                        snap: true,
                        lineStyle: {
                            color: '#004E52',
                            opacity: 0.5,
                            width: 2
                        },
                        label: {
                            show: true,
                            formatter: function (params) {
                                return params.value;
                            },
                            backgroundColor: '#004E52'
                        },
                        handle: {
                            show: true,
                            color: '#004E52',
                            size: 0
                        }
                    },
                    axisLabel: {
                        //interval: 0,
                        rotate: 40
                    }
                },
                yAxis: [
                    {
                        name: max_min_Name,
                        type: 'value',
                        boundaryGap: false,
                        // splitNumeber:5,
                        scale: true, //是否自动计算最大最小值。
                        splitLine: {
                            show: true,
                            lineStyle: {
                                color: '#E5E5E5',
                                width: 1,
                                type: 'dashed'
                            }
                        },

                        //min:max_min.min, //动态设置最大值最小值。
                        //max:max_min.max,
                        min: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5);

                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.min - (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.min - (jiangenew - jiange - 1) / 200;
                            }


                        },
                        max: function (value) {
                            var jiange = (value.max - value.min).toFixed(2) * 100;
                            var jiangenew = Number(Number((jiange - (jiange % 5)) / 5 + 1).toFixed(0) * 5);

                            jiangenew = jiangenew + ((jiangenew / 100).toFixed(0) * 5)
                            if ((jiangenew - jiange - 1) == 0) {
                                jiangenew = jiangenew * 2;
                            }
                            if (jiangenew < 5) jiangenew = 5;

                            if ((jiangenew - jiange) % 2 == 0) {
                                return value.max + (jiangenew - jiange) / 200;
                            }
                            else {
                                return value.max + (jiangenew - jiange + 1) / 200;
                            }

                        },

                        axisLabel: {
                            formatter: function (v) {
                                return v.toFixed(2);
                            },
                            textStyle: {
                                color: '#999'
                            }
                        },
                        axisLine: {
                            lineStyle: {
                                color: '#999',
                                width: 1,//这里是为了突出显示加上的
                                shadowBlur: 0,
                                shadowOffsetX: 0
                            },
                            textStyle: {
                                color: '#000',
                                fontSize: '16'
                            },
                        }
                    }
                ],
                series: function () {
                    var serie = [];
                    for (var j = 0; j < chartName.length; j++) {
                        if (chartName[j] == "时间" || chartName[j] == "名称" || chartName[j] == "时间名称") //调过时间字段
                        {
                            continue;
                        }
                        var chartValue = []; 	//声明过线value集合
                        for (var i = 0; i < m.length; i++) {
                            if (isNaN(m[i][j]) == false) {
                                chartValue.push(changeTwoDecimal(m[i][j], 2)); //循环价值
                            }
                        }
                        if (max_min_Name != "" & max_min_Name == chartName[j]) {
                            var item = {
                                name: chartName[j],
                                type: 'line',
                                data: chartValue,
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                symbol: 'none',
                                smooth: true,
                                itemStyle: {
                                    normal: {
                                        lineStyle: {
                                            width: 1,
                                            type: 'solid'  //'dotted'虚线 'solid'实线
                                        }
                                    }
                                }

                                //		           ,itemStyle: {normal: {
                                //		            	areaStyle: {type: 'default'},
                                //						//颜色渐变设置
                                //		            	color:new echarts.graphic.LinearGradient(0,0,0,1,[{
                                //		            		offset:0,
                                //		            		color:'#050AE8'
                                //		            	},{
                                //		            		offset:1,
                                //		            		color:'#8688F4'
                                //		            	}])
                                //		            }}	
                            }
                            serie.push(item);
                        }
                        else {
                            var item = {
                                name: chartName[j],
                                markPoint: {
                                    data: [{ type: 'max', name: '最大值' }, { type: 'min', name: '最小值' }]
                                },
                                type: 'bar',
                                symbol: 'none',
                                connectNulls: true,
                                data: chartValue,
                                smooth: true
                            }
                            serie.push(item);
                        }
                    };
                    return serie;
                }()
            };
            myChart.setOption(option);
        }
    </script>
</body>
</html >
