<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <script src="../Common/boot.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            border: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="mainTabs" class="mini-tabs" activeIndex="0" style="width:100%;height:100%;" >
    </div>

    <script type="text/javascript">
        mini.parse();
        var tabs = mini.get("mainTabs");
        var myData = [];
        $(function () {
            var _stcd = GetQueryString("stcd");
            var _stnm = GetQueryString("stnm");
            var _stime = GetQueryString("stime");
            var _etime = GetQueryString("etime");
            var _TYPENAME = undefined != GetQueryString("TYPENAME") ? GetQueryString("TYPENAME") : "";
            var _PLAN_N = GetQueryString("PLAN_N");
            var _ZU_ID = GetQueryString("ZU_ID");
            $.data(myData, "STCD", _stcd);
            $.data(myData, "STNM", _stnm);
            $.data(myData, "STIME", _stime);
            $.data(myData, "ETIME", _etime);
            $.data(myData, "PLAN_N", _PLAN_N);
            if ("" != _TYPENAME) {
                var _url = "GQVIEWYUNXING.html?stcd=" + _stcd + "&stnm=" + (_stnm) + "&stime=" + _stime + "&etime=" + _etime;
                var tab = { title: _TYPENAME, url: _url, showCloseButton: false };
                tabs.addTab(tab);
                tabs.activeTab(tab);

                _url = "SQLine.html?stcd=" + _stcd + "&stnm=" + (_stnm) + "&stime=" + _stime + "&etime=" + _etime + "&PLAN_N=" + _PLAN_N + "&ZU_ID=" + _ZU_ID;
                var tab = { title: "水位过程", url: _url, showCloseButton: false };
                tabs.addTab(tab);

                //GetJosns("WATER_GL_STCDSel", { "STCD": _stcd, "TYPE": "站点关联配置" }, "Sel");
            } else {
                var _url = "YBSQLine.html?stcd=" + _stcd + "&stnm=" + (_stnm) + "&stime=" + _stime + "&etime=" + _etime + "&PLAN_N=" + _PLAN_N + "&ZU_ID=" + _ZU_ID;
                var tab = { title: "水位过程线", url: _url, showCloseButton: false };
                tabs.addTab(tab);
                tabs.activeTab(tab);

                _url = "ruleNew.html?stcd=" + _stcd + "&stnm=" + (_stnm) + "&stime=" + _stime + "&etime=" + _etime + "&PLAN_N=" + _PLAN_N;
                tab = { title: "剖面图", url: _url, showCloseButton: false };
                tabs.addTab(tab);
            }
        });

        function JosnSel(data, typeID) { 
            if (typeID == "Sel") {
                var JsonData = data.data; 
                if (JsonData.length > 0) {
                    for (num = 0; num < JsonData.length; num++) {
                        var _url = JsonData[num].URL;
                        if (_url.lastIndexOf("?") > -1) {
                            _url += "&STCD=" + $.data(myData, "STCD"); 
                        } else {
                            _url += "?STCD=" + $.data(myData, "STCD"); 
                        }
                        _url += "&STNM=" + $.data(myData, "STNM");
                        _url += "&STIME=" + $.data(myData, "STIME");
                        _url += "&ETIME=" + $.data(myData, "ETIME");
                        var _name = JsonData[num].NAME;  
                        var tab = { title: _name, url: _url, showCloseButton: false }; 
                        tabs.addTab(tab); 
                        if ($.data(myData, "TYPENAME") != null) {
                            if (_name == $.data(myData, "TYPENAME")) {
                                tabs.activeTab(tab);
                            }
                        } else {
                            if (num == 0) {
                                tabs.activeTab(tab);
                            }
                        }
                        
                    } 
                    //var tab1 = { title: "图片", url: "/DanZhan/PicInfo.htm?STCD=" + $.data(myData, "STCD") + "&STNM=" + $.data(myData, "STNM")+"&MT_TYPE=照片资料", showCloseButton: false };
                    //tabs.addTab(tab1); 
                }

            }
        }


    </script>
</body>
</html>
