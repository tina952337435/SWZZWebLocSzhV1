<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title></title>
    <link rel="stylesheet" href="">
    <script src="../Common/boot.js" type="text/javascript"></script>
    <style>
            body {
                margin: 0;
                padding: 0;
                border: 0;
                width: 100%;
                height: 100%;
            }

            .container {
                /*width: 800px;
        height: 600px;*/
                width: 100%;
                height: 100%;
                /*position: relative;*/
                min-height: 550px !important;
                min-width: 600px !important;
            }

            .content {
                position: absolute;
                bottom: 50px;
                width: 100%;
                height: calc(100% - 50px);
                background: url(../Common/images/content_bg.png);
                background-size: cover;
                -moz-background-size: cover; /* 老版本的 Firefox */
                background-repeat: no-repeat;
                /*background: #00FF00 url(./img/content_bg.png) no-repeat fixed top;*/
            }

            .water-container {
                position: absolute;
                bottom: 0;
                width: 100%;
                height: 50px;
                background: #3B8879;
            }

            .water-value {
                position: absolute;
                top: -20px;
                border-bottom: 1px #0066cc solid;
                margin-left: 50%;
                width: 70px;
                text-align: right;
            }

                .water-value:before {
                    content: '';
                    width: 0;
                    height: 0;
                    border-left: 10px solid transparent;
                    border-right: 10px solid transparent;
                    border-top: 20px solid #0066cc;
                    position: absolute;
                    bottom: 0;
                    display: block;
                }

            .ruler-container {
                background-color: #fffaf4;
                font-size: 14px;
                color: #A76538;
                width: 40px;
                padding-top: 25px;
                margin-left: 65%;
                position: absolute;
                bottom: 0;
            }

            .ruler {
                position: relative;
                height: 500px;
            }

                .ruler .cm,
                .ruler .mm {
                    position: absolute;
                    border-bottom: 1px solid #A76538;
                    height: 2px;
                    bottom: 0px;
                }

                .ruler div:nth-of-type(6n) {
                    width: 8px;
                }

                .ruler .cm {
                    width: 10px;
                    padding-left: 10px;
                    padding-bottom: 16px;
                }

                .ruler .mm {
                    width: 5px;
                }

            .tudi {
                position: absolute;
                bottom: 0;
                height: 50px;
                width: 100%;
            }

            .tudi1 {
                height: 10px;
                background-color: #D6BC96;
                width: 100%;
            }

            .tudi2 {
                height: 40px;
                background-color: #B8925E;
                width: 100%;
            }
    </style>
</head>
<body>
    <div class="container">
        <div id="YBTM" style="position:absolute;right:20px;top:10px;z-index:99;font-size:16px;    border: 1px solid #ecd0d0;
    height: 30px;
    line-height: 30px;
    padding: 0px 15px;
    border-radius: 5px;">
            
        </div>
        <div class="content">
            <div class='water-container'>
                <div class="water-value">10cm</div>
            </div>
            <div class='ruler-container'>
                <div class='ruler'></div>
            </div>
        </div>
        <div class="tudi">
            <div class="tudi1"></div>
            <div class="tudi2"></div>
        </div>

    </div>
    
    <script>
        mini.parse();
        var STCD = GetQueryString("stcd");
        var DD_ID = GetQueryString("PLAN_N");
        var stime = GetQueryString("stime");
        var etime = GetQueryString("etime");
        
        $(function () {
            BreakLayerLoad();
        });

        function BreakLayerLoad() {
            GetJosns("MODE_BDMS_PREDICTSelMORE", { "STIME": stime, "ETIME": etime, "STCD": STCD, "PLAN_N": DD_ID, "DATA_TYPE": "1" }, "Sel");
        }

        var dataResult = null;
        function JosnSel(data, typeID) {
            if (typeID == "Sel") {
                dataResult = data.data;
                addRuler(testMax);
            } 
        }

        var t = null;
        var timeout = false;
        var lengthIndex = 0;
        var dataValue = 0;
        function getProcess() {
            window.clearTimeout(t);
            if (timeout) return;
            if (lengthIndex < dataResult.length) {
                dataValue = dataResult[lengthIndex].DATA;
                var tm = mini.formatDate(convertToDate(dataResult[lengthIndex].YMDHM), 'yyyy年MM月dd日 H时')
                $("#YBTM").html(tm);
                waterHeightChange();
                lengthIndex++;
            } else {
                //暂停
                window.clearInterval(t);
                //timeout = true;
                lengthIndex = 0
            }
        }


        var interval = setInterval(getProcess, 1000);
        waterHeightChange();
        
        var testMax = 100;
        var total = $(".ruler").height();//总高度，与样式中的高度保持一致
        function addRuler(max) {
            //	num 	总高 	一个像素	十个	数值
            //  100 	500 	5 			10  	1
            //  500 	500 	5			10		5

            const step = 10;//十个刻度
            const stepPx = 5;//一刻度代表5像素

            var stepValue = max / (total / stepPx);//每个刻度代表的数值
            //循环次数
            var time = Math.ceil(total / stepPx);
            for (var i = 0; i <= time; i++) {
                var className = (i % step == 0) ? "cm" : "mm";
                var kd = (i % step == 0) ? parseFloat((i * stepValue).toFixed(10)) : "";
                var bottomValue = stepPx * i;
                $(".ruler").append("<div class='" + className + "' style='bottom:" + bottomValue + "px'>" + kd + "</div>");
            }
        }
        
        //模拟水位变化
        function waterHeightChange() {
            var value = Math.ceil(Math.random() * testMax);
            $(".water-container").height((value / testMax) * total);
            //$(".water-value").html(value + "cm");
            //$(".water-container").height(dataValue);
            $(".water-value").html(dataValue + "cm");
        }
    </script>
</body>
</html>
